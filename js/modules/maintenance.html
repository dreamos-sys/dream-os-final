<!-- Maintenance Module v1.0 - Dream OS (ISO Standard) -->
<div style="min-height:100vh;background:linear-gradient(135deg,#0f172a,#1e293b);color:white;font-family:'Inter',sans-serif;padding:1.5rem;padding-bottom:5rem;">
    <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;">
        <button onclick="closeMaintenance()" style="background:rgba(255,255,255,0.1);color:white;border:none;padding:0.5rem 1rem;border-radius:0.5rem;cursor:pointer;font-weight:600;">← Kembali</button>
        <h2 style="color:#f97316;font-size:1.5rem;font-weight:800;">🔧 Maintenance Manager</h2>
    </div>

    <!-- STATS CARDS -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:1.5rem;" id="maint-stats">
        <div style="background:rgba(249,115,22,0.1);border-left:4px solid #f97316;padding:1rem;border-radius:0.75rem;">
            <div style="font-size:0.75rem;opacity:0.7;">Total Tugas</div>
            <div style="font-size:2rem;font-weight:700;color:#f97316;" id="stat-total">0</div>
        </div>
        <div style="background:rgba(59,130,246,0.1);border-left:4px solid #3b82f6;padding:1rem;border-radius:0.75rem;">
            <div style="font-size:0.75rem;opacity:0.7;">Dalam Proses</div>
            <div style="font-size:2rem;font-weight:700;color:#3b82f6;" id="stat-proses">0</div>
        </div>
        <div style="background:rgba(16,185,129,0.1);border-left:4px solid #10b981;padding:1rem;border-radius:0.75rem;">
            <div style="font-size:0.75rem;opacity:0.7;">Selesai</div>
            <div style="font-size:2rem;font-weight:700;color:#10b981;" id="stat-selesai">0</div>
        </div>
        <div style="background:rgba(245,158,11,0.1);border-left:4px solid #f59e0b;padding:1rem;border-radius:0.75rem;">
            <div style="font-size:0.75rem;opacity:0.7;">Pending</div>
            <div style="font-size:2rem;font-weight:700;color:#f59e0b;" id="stat-pending">0</div>
        </div>
    </div>

    <!-- TABS -->
    <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:1.5rem;">
        <button class="maint-tab active" data-tab="dashboard">📊 Dashboard</button>
        <button class="maint-tab" data-tab="form">➕ Tugas Baru</button>
        <button class="maint-tab" data-tab="history">📜 History</button>
        <button class="maint-tab" data-tab="analytics">📈 Analytics</button>
        <button class="maint-tab" data-tab="schedule">📅 Jadwal</button>
        <button class="maint-tab" data-tab="reminder">⏰ Reminder</button>
    </div>

    <!-- CONTENT -->
    <div id="maint-content"></div>
</div>

<script>
(function() {
    const STORAGE_TASKS = 'dreamos_maintenance_tasks';
    const STORAGE_SCHEDULE = 'dreamos_maintenance_schedule';

    // Helper functions
    const fmtDate = (d) => d ? new Date(d).toLocaleDateString('id-ID', {day:'2-digit',month:'short',year:'numeric'}) : '—';
    const fmtRp = (n) => 'Rp ' + Number(n||0).toLocaleString('id-ID');
    const esc = (s) => String(s||'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m]);

    // Close function
    window.closeMaintenance = function() {
        const mod = document.getElementById('maintenance-module');
        if (mod) mod.style.display = 'none';
    };

    // Data operations
    function getTasks() { return JSON.parse(localStorage.getItem(STORAGE_TASKS) || '[]'); }
    function saveTasks(tasks) { localStorage.setItem(STORAGE_TASKS, JSON.stringify(tasks)); }
    function getSchedule() { return JSON.parse(localStorage.getItem(STORAGE_SCHEDULE) || '[]'); }

    // Update stats
    function updateStats() {
        const tasks = getTasks();
        document.getElementById('stat-total').textContent = tasks.length;
        document.getElementById('stat-proses').textContent = tasks.filter(t => t.status === 'proses').length;
        document.getElementById('stat-selesai').textContent = tasks.filter(t => t.status === 'selesai').length;
        document.getElementById('stat-pending').textContent = tasks.filter(t => t.status === 'pending').length;
    }

    // Render dashboard
    function renderDashboard() {
        const tasks = getTasks();
        const recent = tasks.slice(-5).reverse();
        const content = document.getElementById('maint-content');
        let html = '<div class="maint-panel"><h3 style="margin-bottom:1rem;">📋 Tugas Terbaru</h3>';
        if (recent.length === 0) html += '<p style="opacity:0.7;">Belum ada tugas</p>';
        else {
            recent.forEach(t => {
                html += `<div style="background:rgba(0,0,0,0.2);border-radius:8px;padding:1rem;margin-bottom:0.75rem;">
                    <div style="display:flex;justify-content:space-between;">
                        <strong>${esc(t.deskripsi)}</strong>
                        <span class="badge badge-${t.status}">${t.status}</span>
                    </div>
                    <div style="font-size:0.8rem;opacity:0.7;margin-top:0.25rem;">📍 ${esc(t.lokasi)} | 👤 ${esc(t.petugas)} | 📅 ${fmtDate(t.tanggal)}</div>
                </div>`;
            });
        }
        html += '</div>';
        content.innerHTML = html;
    }

    // Render form
    function renderForm() {
        const content = document.getElementById('maint-content');
        content.innerHTML = `
            <div class="maint-panel">
                <h3 style="margin-bottom:1.5rem;">📝 Buat Tugas Maintenance Baru</h3>
                <form id="maintForm">
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-bottom:1rem;">
                        <div>
                            <label style="display:block;margin-bottom:0.3rem;font-size:0.8rem;">Tanggal *</label>
                            <input type="date" id="maint-tgl" required class="maint-input">
                        </div>
                        <div>
                            <label style="display:block;margin-bottom:0.3rem;font-size:0.8rem;">Prioritas</label>
                            <select id="maint-priority" class="maint-input">
                                <option value="low">Low</option><option value="normal" selected>Normal</option>
                                <option value="high">High</option><option value="urgent">Urgent</option>
                            </select>
                        </div>
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-bottom:1rem;">
                        <div>
                            <label style="display:block;margin-bottom:0.3rem;font-size:0.8rem;">Jenis Kegiatan *</label>
                            <select id="maint-jenis" required class="maint-input">
                                <option value="perbaikan">Perbaikan</option><option value="penggantian">Penggantian</option>
                                <option value="perawatan">Perawatan</option><option value="cuci_ac">Cuci AC</option>
                                <option value="inspeksi">Inspeksi</option>
                            </select>
                        </div>
                        <div>
                            <label style="display:block;margin-bottom:0.3rem;font-size:0.8rem;">Kategori</label>
                            <select id="maint-kategori" class="maint-input">
                                <option value="ac">AC</option><option value="listrik">Listrik</option>
                                <option value="plumbing">Plumbing</option><option value="gedung">Gedung</option>
                                <option value="peralatan">Peralatan</option><option value="lainnya">Lainnya</option>
                            </select>
                        </div>
                    </div>
                    <div style="margin-bottom:1rem;">
                        <label style="display:block;margin-bottom:0.3rem;font-size:0.8rem;">Petugas *</label>
                        <input type="text" id="maint-petugas" required class="maint-input" placeholder="Nama petugas">
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-bottom:1rem;">
                        <div>
                            <label style="display:block;margin-bottom:0.3rem;font-size:0.8rem;">Lokasi *</label>
                            <input type="text" id="maint-lokasi" required class="maint-input" placeholder="Ruang Server">
                        </div>
                        <div>
                            <label style="display:block;margin-bottom:0.3rem;font-size:0.8rem;">Unit Aset (opsional)</label>
                            <input type="text" id="maint-aset" class="maint-input" placeholder="AC-001">
                        </div>
                    </div>
                    <div style="margin-bottom:1rem;">
                        <label style="display:block;margin-bottom:0.3rem;font-size:0.8rem;">Deskripsi Masalah *</label>
                        <textarea id="maint-deskripsi" rows="3" required class="maint-input" placeholder="Jelaskan masalah..."></textarea>
                    </div>
                    <div style="margin-bottom:1.5rem;">
                        <label style="display:block;margin-bottom:0.3rem;font-size:0.8rem;">Catatan</label>
                        <textarea id="maint-catatan" rows="2" class="maint-input"></textarea>
                    </div>
                    <button type="submit" style="background:#f97316;color:white;border:none;padding:1rem 2rem;border-radius:0.75rem;font-weight:700;cursor:pointer;">💾 Simpan Tugas</button>
                </form>
                <div id="maint-form-msg" style="margin-top:1rem;"></div>
            </div>
        `;
        document.getElementById('maint-tgl').value = new Date().toISOString().split('T')[0];
        document.getElementById('maintForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const task = {
                id: Date.now(),
                kode: 'MNT-' + new Date().getFullYear() + '-' + String(Date.now()).slice(-3),
                tanggal: document.getElementById('maint-tgl').value,
                prioritas: document.getElementById('maint-priority').value,
                jenis: document.getElementById('maint-jenis').value,
                kategori: document.getElementById('maint-kategori').value,
                petugas: document.getElementById('maint-petugas').value.trim(),
                lokasi: document.getElementById('maint-lokasi').value.trim(),
                unit_aset: document.getElementById('maint-aset').value.trim(),
                deskripsi: document.getElementById('maint-deskripsi').value.trim(),
                catatan: document.getElementById('maint-catatan').value.trim(),
                status: 'pending',
                created_at: new Date().toISOString()
            };
            const tasks = getTasks();
            tasks.push(task);
            saveTasks(tasks);
            updateStats();
            document.getElementById('maint-form-msg').innerHTML = '<span style="color:#10b981;">✅ Tugas berhasil dibuat!</span>';
            this.reset();
            document.getElementById('maint-tgl').value = new Date().toISOString().split('T')[0];
        });
    }

    // Render history with search
    function renderHistory() {
        const content = document.getElementById('maint-content');
        content.innerHTML = `
            <div class="maint-panel">
                <h3 style="margin-bottom:1rem;">📜 Riwayat Maintenance (Selesai)</h3>
                <div style="display:flex;gap:0.5rem;margin-bottom:1rem;">
                    <input type="text" id="maint-search" class="maint-input" placeholder="Cari deskripsi, lokasi..." style="flex:1;">
                    <button id="maint-search-btn" style="background:#f97316;color:white;border:none;padding:0.75rem 1.5rem;border-radius:0.75rem;cursor:pointer;">🔍 Cari</button>
                </div>
                <div id="maint-history-results"></div>
            </div>
        `;
        function loadHistory() {
            const search = document.getElementById('maint-search')?.value.toLowerCase() || '';
            const tasks = getTasks().filter(t => t.status === 'selesai' && (!search || t.deskripsi?.toLowerCase().includes(search) || t.lokasi?.toLowerCase().includes(search)));
            const results = document.getElementById('maint-history-results');
            if (tasks.length === 0) {
                results.innerHTML = '<p style="opacity:0.7;">Tidak ada data</p>';
                return;
            }
            results.innerHTML = tasks.map(t => `
                <div style="background:rgba(0,0,0,0.2);padding:1rem;border-radius:8px;margin-bottom:0.5rem;">
                    <strong>${esc(t.deskripsi)}</strong> (${esc(t.jenis)})
                    <div style="font-size:0.8rem;opacity:0.7;">📍 ${esc(t.lokasi)} | 👤 ${esc(t.petugas)} | 📅 ${fmtDate(t.tanggal)}</div>
                </div>
            `).join('');
        }
        document.getElementById('maint-search-btn').addEventListener('click', loadHistory);
        document.getElementById('maint-search').addEventListener('keyup', e => { if (e.key==='Enter') loadHistory(); });
        loadHistory();
    }

    // Render analytics (sederhana dari tasks)
    function renderAnalytics() {
        const content = document.getElementById('maint-content');
        const tasks = getTasks();
        // Hitung per unit_aset
        const unitMap = {};
        tasks.forEach(t => {
            if (t.unit_aset) {
                unitMap[t.unit_aset] = unitMap[t.unit_aset] || { count: 0, biaya: 0 };
                unitMap[t.unit_aset].count++;
                unitMap[t.unit_aset].biaya += t.biaya || 0;
            }
        });
        const sorted = Object.entries(unitMap).sort((a,b) => b[1].count - a[1].count).slice(0,10);
        let html = '<div class="maint-panel"><h3 style="margin-bottom:1rem;">📊 Top 10 Unit Aset (Sering Maintenance)</h3>';
        if (sorted.length === 0) html += '<p>Tidak ada data unit aset.</p>';
        else {
            html += '<table style="width:100%;border-collapse:collapse;"><tr style="border-bottom:1px solid rgba(255,255,255,0.1);"><th>Unit Aset</th><th>Jumlah</th><th>Estimasi Biaya</th></tr>';
            sorted.forEach(([unit, data]) => {
                html += `<tr style="border-bottom:1px solid rgba(255,255,255,0.1);"><td>${esc(unit)}</td><td>${data.count}x</td><td>${fmtRp(data.biaya)}</td></tr>`;
            });
            html += '</table>';
        }
        html += '</div>';
        content.innerHTML = html;
    }

    // Render jadwal (contoh statis, bisa diisi dari localStorage jika ada)
    function renderSchedule() {
        const content = document.getElementById('maint-content');
        let schedules = getSchedule();
        if (schedules.length === 0) {
            // Contoh default
            schedules = [
                { nama: 'Cuci AC R. Server', lokasi: 'Ruang Server', frekuensi: '3 Bulan', next: '2026-06-01' },
                { nama: 'Inspeksi Listrik', lokasi: 'Panel Utama', frekuensi: 'Bulanan', next: '2026-06-05' },
                { nama: 'Pengecatan Tiang', lokasi: 'Lapangan', frekuensi: 'Tahunan', next: '2026-12-01' }
            ];
        }
        let html = '<div class="maint-panel"><h3 style="margin-bottom:1rem;">📅 Jadwal Maintenance Rutin</h3>';
        schedules.forEach(s => {
            html += `<div style="background:rgba(0,0,0,0.2);padding:1rem;border-radius:8px;margin-bottom:0.5rem;">
                <strong>${esc(s.nama)}</strong> - ${esc(s.lokasi)}<br>
                <span style="font-size:0.8rem;opacity:0.7;">Frekuensi: ${s.frekuensi} | Berikutnya: ${fmtDate(s.next)}</span>
            </div>`;
        });
        html += '</div>';
        content.innerHTML = html;
    }

    // Render reminder (overdue tasks)
    function renderReminder() {
        const content = document.getElementById('maint-content');
        const tasks = getTasks().filter(t => t.status === 'pending' && t.tanggal < new Date().toISOString().split('T')[0]);
        let html = '<div class="maint-panel"><h3 style="margin-bottom:1rem;">⚠️ Tugas Overdue</h3>';
        if (tasks.length === 0) html += '<p style="opacity:0.7;">Tidak ada tugas overdue 🎉</p>';
        else {
            tasks.forEach(t => {
                html += `<div style="background:rgba(239,68,68,0.1);border-left:4px solid #ef4444;padding:1rem;margin-bottom:0.5rem;border-radius:8px;">
                    <strong>${esc(t.deskripsi)}</strong> (${esc(t.jenis)})<br>
                    📅 Jatuh tempo: ${fmtDate(t.tanggal)} | 📍 ${esc(t.lokasi)} | 👤 ${esc(t.petugas)}
                </div>`;
            });
        }
        html += '</div>';
        content.innerHTML = html;
    }

    // Tab switching
    const tabs = document.querySelectorAll('.maint-tab');
    tabs.forEach(btn => {
        btn.addEventListener('click', function() {
            tabs.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            const tab = this.dataset.tab;
            switch(tab) {
                case 'dashboard': renderDashboard(); break;
                case 'form': renderForm(); break;
                case 'history': renderHistory(); break;
                case 'analytics': renderAnalytics(); break;
                case 'schedule': renderSchedule(); break;
                case 'reminder': renderReminder(); break;
            }
        });
    });

    // Init
    updateStats();
    renderDashboard();
})();
</script>

<style>
.maint-tab {
    padding:0.6rem 1.2rem;
    background:rgba(255,255,255,0.05);
    color:white;
    border:none;
    border-radius:8px;
    font-weight:600;
    cursor:pointer;
    transition:all 0.2s;
}
.maint-tab.active {
    background:#f97316;
    color:white;
}
.maint-tab:hover:not(.active) {
    background:rgba(255,255,255,0.1);
}
.maint-input, .maint-textarea, .maint-select {
    width:100%;
    padding:0.75rem;
    background:rgba(0,0,0,0.3);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:0.75rem;
    color:white;
    font-size:0.85rem;
}
.maint-input:focus, .maint-textarea:focus {
    border-color:#f97316;
    outline:none;
}
.badge {
    display:inline-block;
    padding:0.2rem 0.75rem;
    border-radius:20px;
    font-size:0.7rem;
    font-weight:700;
}
.badge-pending { background:rgba(245,158,11,0.2); color:#f59e0b; }
.badge-proses { background:rgba(59,130,246,0.2); color:#3b82f6; }
.badge-selesai { background:rgba(16,185,129,0.2); color:#10b981; }
.maint-panel {
    background:rgba(30,41,59,0.6);
    border:1px solid rgba(249,115,22,0.2);
    border-radius:1rem;
    padding:1.5rem;
}
</style>
