<!-- Modul Asset & Gudang v2.0 – Dream OS -->
<div style="min-height:100vh;background:linear-gradient(135deg,#0f172a,#1e293b);color:white;font-family:'Inter',sans-serif;padding:1.5rem;padding-bottom:5rem;">
    <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap;">
        <button onclick="closeAsset()" style="background:rgba(255,255,255,0.1);color:white;border:none;padding:0.5rem 1rem;border-radius:0.5rem;cursor:pointer;font-weight:600;">← Kembali</button>
        <h2 style="color:#8b5cf6;font-size:1.5rem;font-weight:800;">🏛️ ASSET & GUDANG</h2>
        <span style="background:linear-gradient(135deg,#8b5cf6,#7c3aed);color:white;padding:0.3rem 0.8rem;border-radius:1rem;font-size:0.7rem;font-weight:600;">ISO 55000</span>
    </div>

    <!-- Status Bar -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0.75rem;margin-bottom:1.5rem;" id="asset-status-bar">
        <div style="background:rgba(139,92,246,0.1);border-left:3px solid #8b5cf6;padding:0.75rem;border-radius:0.5rem;"><div style="font-size:0.65rem;opacity:0.7;">TOTAL ASET</div><div style="font-weight:700;" id="astat-total">0</div></div>
        <div style="background:rgba(16,185,129,0.1);border-left:3px solid #10b981;padding:0.75rem;border-radius:0.5rem;"><div style="font-size:0.65rem;opacity:0.7;">AKTIF</div><div style="font-weight:700;color:#10b981;" id="astat-aktif">0</div></div>
        <div style="background:rgba(239,68,68,0.1);border-left:3px solid #ef4444;padding:0.75rem;border-radius:0.5rem;"><div style="font-size:0.65rem;opacity:0.7;">RUSAK/HILANG</div><div style="font-weight:700;color:#ef4444;" id="astat-rusak">0</div></div>
        <div style="background:rgba(245,158,11,0.1);border-left:3px solid #f59e0b;padding:0.75rem;border-radius:0.5rem;"><div style="font-size:0.65rem;opacity:0.7;">TOTAL NILAI</div><div style="font-weight:700;" id="astat-nilai">Rp 0</div></div>
        <div style="background:rgba(59,130,246,0.1);border-left:3px solid #3b82f6;padding:0.75rem;border-radius:0.5rem;"><div style="font-size:0.65rem;opacity:0.7;">GUDANG</div><div style="font-weight:700;" id="astat-gudang">0</div></div>
    </div>

    <!-- Tabs Navigasi -->
    <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:1.5rem;">
        <button class="astab active" data-tab="dashboard">📊 Dashboard</button>
        <button class="astab" data-tab="list">📋 Daftar Aset</button>
        <button class="astab" data-tab="add">➕ Tambah Aset</button>
        <button class="astab" data-tab="tax">📊 Pajak & Susut</button>
        <button class="astab" data-tab="warehouse">🏭 Gudang</button>
        <button class="astab" data-tab="audit">📜 Audit Log</button>
        <button class="astab" data-tab="export">📤 Export</button>
    </div>

    <!-- Konten Dinamis -->
    <div id="asset-content" style="background:rgba(30,41,59,0.6);border:1px solid rgba(139,92,246,0.2);border-radius:1.5rem;padding:1.5rem;"></div>
</div>

<style>
    .astab { padding:0.5rem 1rem; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:white; border-radius:0.5rem; font-size:0.8rem; font-weight:600; cursor:pointer; transition:all 0.2s; }
    .astab:hover { background:rgba(139,92,246,0.1); }
    .astab.active { background:#8b5cf6; color:white; border-color:#8b5cf6; }
    .asinput, .asselect, .astextarea { width:100%; padding:0.7rem; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1); border-radius:0.5rem; color:white; font-size:0.85rem; outline:none; }
    .asinput:focus, .asselect:focus { border-color:#8b5cf6; }
    .asbtn { padding:0.7rem 1.5rem; background:#8b5cf6; color:white; border:none; border-radius:0.5rem; font-weight:600; cursor:pointer; transition:all 0.2s; }
    .asbtn:hover { opacity:0.9; }
    .asbtn-outline { background:transparent; border:1px solid #8b5cf6; color:#8b5cf6; }
    .asbtn-danger { background:#ef4444; }
    .asbtn-sm { padding:0.3rem 0.8rem; font-size:0.7rem; }
    .badge { display:inline-block; padding:0.2rem 0.6rem; border-radius:1rem; font-size:0.7rem; font-weight:600; }
    .badge-aktif { background:rgba(16,185,129,0.2); color:#10b981; }
    .badge-rusak { background:rgba(239,68,68,0.2); color:#ef4444; }
    .badge-hilang { background:rgba(100,116,139,0.2); color:#64748b; }
    .badge-dipinjam { background:rgba(245,158,11,0.2); color:#f59e0b; }
    .table-as { width:100%; border-collapse:collapse; font-size:0.85rem; }
    .table-as th { padding:0.7rem; text-align:left; background:rgba(0,0,0,0.3); color:#94a3b8; font-size:0.7rem; }
    .table-as td { padding:0.7rem; border-top:1px solid rgba(255,255,255,0.05); }
    .table-as tr:hover td { background:rgba(255,255,255,0.02); }
    .qr-box { display:inline-block; width:100px; height:100px; background:white; border-radius:0.5rem; padding:5px; cursor:pointer; }
</style>

<script>
(function() {
    // Konfigurasi ISO
    const KONDISI_LIST = ['aktif', 'rusak', 'hilang', 'dipinjam'];
    const METODE_SUSUT = ['garis_lurus', 'saldo_menurun'];
    const KATEGORI_LIST = ['Tanah', 'Bangunan', 'Kendaraan', 'Elektronik', 'Mesin', 'Furniture', 'Lainnya'];

    const ASET_KEY = 'dreamos_assets';
    const AUDIT_KEY = 'dreamos_asset_audit';
    const GUDANG_KEY = 'dreamos_warehouses';

    let assets = JSON.parse(localStorage.getItem(ASET_KEY) || '[]');
    let auditLogs = JSON.parse(localStorage.getItem(AUDIT_KEY) || '[]');
    let warehouses = JSON.parse(localStorage.getItem(GUDANG_KEY) || '[]');

    function saveAssets() { localStorage.setItem(ASET_KEY, JSON.stringify(assets)); }
    function saveAudit() { localStorage.setItem(AUDIT_KEY, JSON.stringify(auditLogs)); }
    function saveWarehouses() { localStorage.setItem(GUDANG_KEY, JSON.stringify(warehouses)); }
    function addLog(aksi, detail) { auditLogs.unshift({ id: Date.now(), aksi, detail, user: 'System', waktu: new Date().toISOString() }); saveAudit(); }

    const fmtRp = n => 'Rp ' + Number(n||0).toLocaleString('id-ID');
    const fmtDate = d => d ? new Date(d).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}) : '—';

    window.closeAsset = () => { const m = document.getElementById('asset-module'); if (m) m.style.display = 'none'; };

    function updateStatusBar() {
        document.getElementById('astat-total').textContent = assets.length;
        document.getElementById('astat-aktif').textContent = assets.filter(a => a.kondisi === 'aktif').length;
        document.getElementById('astat-rusak').textContent = assets.filter(a => a.kondisi === 'rusak' || a.kondisi === 'hilang').length;
        document.getElementById('astat-nilai').textContent = fmtRp(assets.reduce((s,a) => s + (a.nilai || 0), 0));
        document.getElementById('astat-gudang').textContent = warehouses.length;
    }

    function renderTab(tab) {
        const c = document.getElementById('asset-content');
        switch(tab) {
            case 'dashboard': renderDashboard(c); break;
            case 'list': renderList(c); break;
            case 'add': renderForm(c); break;
            case 'tax': renderTax(c); break;
            case 'warehouse': renderWarehouse(c); break;
            case 'audit': renderAudit(c); break;
            case 'export': renderExport(c); break;
        }
    }

    function renderDashboard(container) {
        const total = assets.length;
        const aktif = assets.filter(a => a.kondisi === 'aktif').length;
        const rusak = assets.filter(a => a.kondisi === 'rusak' || a.kondisi === 'hilang').length;
        const totalNilai = assets.reduce((s,a) => s + (a.nilai||0), 0);
        const totalSusut = assets.reduce((s,a) => s + (a.akum_susut||0), 0);
        const byKat = {}; KATEGORI_LIST.forEach(k => byKat[k] = assets.filter(a => a.kategori === k).length);

        let html = '<h3 style="color:#8b5cf6;margin-bottom:1rem;">📊 Dashboard Aset</h3>';
        html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1.5rem;">' +
            '<div><strong>Total Aset:</strong> ' + total + '</div>' +
            '<div><strong>Aktif:</strong> <span style="color:#10b981;">' + aktif + '</span></div>' +
            '<div><strong>Rusak/Hilang:</strong> <span style="color:#ef4444;">' + rusak + '</span></div>' +
            '<div><strong>Total Nilai:</strong> ' + fmtRp(totalNilai) + '</div>' +
            '<div><strong>Akum. Susut:</strong> ' + fmtRp(totalSusut) + '</div>' +
            '<div><strong>Nilai Buku:</strong> ' + fmtRp(totalNilai - totalSusut) + '</div></div>';
        html += '<h4 style="margin-bottom:0.5rem;">Distribusi Kategori</h4>';
        KATEGORI_LIST.forEach(k => {
            html += '<div style="display:flex;justify-content:space-between;padding:0.3rem 0;border-bottom:1px solid rgba(255,255,255,0.05);"><span>' + k + '</span><strong>' + (byKat[k] || 0) + '</strong></div>';
        });
        html += '<h4 style="margin-top:1rem;margin-bottom:0.5rem;">Gudang Terdaftar</h4>';
        if (warehouses.length === 0) html += '<p style="opacity:0.7;">Belum ada gudang</p>';
        else warehouses.forEach(w => { html += '<div style="padding:0.5rem;background:rgba(0,0,0,0.2);border-radius:0.5rem;margin-bottom:0.5rem;"><strong>' + w.nama + '</strong> (' + w.lokasi + ') - ' + assets.filter(a => a.gudang_id === w.id).length + ' aset</div>'; });
        container.innerHTML = html;
    }

    function renderList(container) {
        let html = '<h3 style="color:#8b5cf6;margin-bottom:1rem;">📋 Daftar Aset</h3>';
        html += '<div style="display:flex;gap:0.5rem;margin-bottom:1rem;"><input type="text" id="asearch" class="asinput" placeholder="Cari kode/nama..." style="flex:1;"><select id="afilter-kondisi" class="asselect" style="width:150px;"><option value="">Semua Kondisi</option>'+KONDISI_LIST.map(k=>'<option value="'+k+'">'+k+'</option>').join('')+'</select><select id="afilter-kat" class="asselect" style="width:150px;"><option value="">Semua Kategori</option>'+KATEGORI_LIST.map(k=>'<option value="'+k+'">'+k+'</option>').join('')+'</select></div>';
        html += '<div style="overflow-x:auto;"><table class="table-as"><thead><tr><th>Kode</th><th>Nama</th><th>Kategori</th><th>Nilai</th><th>Susut</th><th>Kondisi</th><th>Gudang</th><th>Aksi</th></tr></thead><tbody id="alist-body"></tbody></table></div>';
        container.innerHTML = html;

        function refreshList() {
            const search = document.getElementById('asearch').value.toLowerCase();
            const fKondisi = document.getElementById('afilter-kondisi').value;
            const fKat = document.getElementById('afilter-kat').value;
            const filtered = assets.filter(a => {
                return (!search || a.kode?.toLowerCase().includes(search) || a.nama?.toLowerCase().includes(search)) &&
                       (!fKondisi || a.kondisi === fKondisi) &&
                       (!fKat || a.kategori === fKat);
            });
            const tbody = document.getElementById('alist-body');
            tbody.innerHTML = filtered.map(a => {
                const wh = warehouses.find(w => w.id === a.gudang_id);
                return '<tr>' +
                    '<td><strong>' + a.kode + '</strong></td><td>' + a.nama + '</td><td>' + (a.kategori || '-') + '</td>' +
                    '<td>' + fmtRp(a.nilai) + '</td><td>' + fmtRp(a.akum_susut||0) + '</td>' +
                    '<td><span class="badge badge-' + a.kondisi + '">' + a.kondisi + '</span></td>' +
                    '<td>' + (wh ? wh.nama : '-') + '</td>' +
                    '<td>' +
                        '<button class="asbtn-outline asbtn-sm" onclick="editAsset(\'' + a.id + '\')">✏️</button>' +
                        '<button class="asbtn-danger asbtn-sm" onclick="deleteAsset(\'' + a.id + '\')">🗑️</button>' +
                        '<button class="asbtn-sm" style="background:#3b82f6;margin-top:0.2rem;" onclick="generateQR(\'' + a.id + '\')">📱</button>' +
                    '</td></tr>';
            }).join('');
        }
        document.getElementById('asearch').addEventListener('input', refreshList);
        document.getElementById('afilter-kondisi').addEventListener('change', refreshList);
        document.getElementById('afilter-kat').addEventListener('change', refreshList);
        refreshList();
    }

    function renderForm(container, editId = null) {
        const asset = editId ? assets.find(a => a.id == editId) : null;
        container.innerHTML = '<h3 style="color:#8b5cf6;margin-bottom:1rem;">' + (asset ? '✏️ Edit Aset' : '➕ Tambah Aset Baru') + '</h3>' +
            '<form id="aform" style="display:grid;gap:1rem;">' +
                '<input type="hidden" id="aid" value="' + (asset ? asset.id : '') + '">' +
                '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;">' +
                    '<div><label style="font-size:0.7rem;">Kode Aset *</label><input type="text" id="akode" class="asinput" required value="' + (asset ? asset.kode : 'AST-'+Date.now().toString(36).toUpperCase()) + '"></div>' +
                    '<div><label style="font-size:0.7rem;">Nama Aset *</label><input type="text" id="anama" class="asinput" required value="' + (asset ? asset.nama : '') + '"></div>' +
                '</div>' +
                '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.5rem;">' +
                    '<div><label style="font-size:0.7rem;">Kategori</label><select id="akat" class="asselect">' + KATEGORI_LIST.map(k=> '<option value="'+k+'"' + (asset && asset.kategori===k ? ' selected' : '') + '>' + k + '</option>').join('') + '</select></div>' +
                    '<div><label style="font-size:0.7rem;">Kondisi</label><select id="akondisi" class="asselect">' + KONDISI_LIST.map(k=> '<option value="'+k+'"' + (asset && asset.kondisi===k ? ' selected' : '') + '>' + k + '</option>').join('') + '</select></div>' +
                    '<div><label style="font-size:0.7rem;">Gudang</label><select id="agudang" class="asselect"><option value="">-- Pilih --</option>' + warehouses.map(w=> '<option value="'+w.id+'"' + (asset && asset.gudang_id===w.id ? ' selected' : '') + '>' + w.nama + '</option>').join('') + '</select></div>' +
                '</div>' +
                '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.5rem;">' +
                    '<div><label style="font-size:0.7rem;">Nilai Perolehan (Rp) *</label><input type="number" id="anilai" class="asinput" required value="' + (asset ? asset.nilai : 0) + '"></div>' +
                    '<div><label style="font-size:0.7rem;">Tanggal Perolehan</label><input type="date" id="atgl" class="asinput" value="' + (asset ? asset.tgl_perolehan : '') + '"></div>' +
                    '<div><label style="font-size:0.7rem;">Masa Manfaat (thn)</label><input type="number" id="amasa" class="asinput" min="1" value="' + (asset ? asset.masa : '') + '"></div>' +
                '</div>' +
                '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;">' +
                    '<div><label style="font-size:0.7rem;">Metode Penyusutan</label><select id="ametode" class="asselect">' + METODE_SUSUT.map(m=> '<option value="'+m+'"' + (asset && asset.metode===m ? ' selected' : '') + '>' + m.replace('_',' ') + '</option>').join('') + '</select></div>' +
                    '<div><label style="font-size:0.7rem;">PIC / Penanggung Jawab</label><input type="text" id="apic" class="asinput" value="' + (asset ? asset.pic : '') + '"></div>' +
                '</div>' +
                '<div><label style="font-size:0.7rem;">Lokasi Detail</label><input type="text" id="alokasi" class="asinput" value="' + (asset ? asset.lokasi : '') + '"></div>' +
                '<div style="display:flex;gap:0.5rem;">' +
                    '<button type="submit" class="asbtn">💾 Simpan</button>' +
                    '<button type="button" class="asbtn-outline" onclick="generateQR(\'' + (asset ? asset.id : 'new') + '\')">📱 QR Code</button>' +
                '</div>' +
            '</form>';
        document.getElementById('aform').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('aid').value;
            const data = {
                id: id ? parseInt(id) : Date.now(),
                kode: document.getElementById('akode').value,
                nama: document.getElementById('anama').value,
                kategori: document.getElementById('akat').value,
                kondisi: document.getElementById('akondisi').value,
                gudang_id: document.getElementById('agudang').value ? parseInt(document.getElementById('agudang').value) : null,
                nilai: parseFloat(document.getElementById('anilai').value),
                tgl_perolehan: document.getElementById('atgl').value,
                masa: parseInt(document.getElementById('amasa').value) || null,
                metode: document.getElementById('ametode').value,
                pic: document.getElementById('apic').value,
                lokasi: document.getElementById('alokasi').value,
                akum_susut: asset ? asset.akum_susut || 0 : 0
            };
            if (id) {
                const idx = assets.findIndex(a => a.id == id);
                if (idx > -1) assets[idx] = data;
                addLog('UPDATE', 'Aset ' + data.kode + ' diperbarui');
            } else {
                assets.push(data);
                addLog('CREATE', 'Aset ' + data.kode + ' dibuat');
            }
            saveAssets();
            updateStatusBar();
            document.querySelectorAll('.astab').forEach(b => b.classList.remove('active'));
            document.querySelector('.astab[data-tab="list"]').classList.add('active');
            renderTab('list');
        });
    }

    window.editAsset = function(id) {
        document.querySelectorAll('.astab').forEach(b => b.classList.remove('active'));
        document.querySelector('.astab[data-tab="add"]').classList.add('active');
        renderForm(document.getElementById('asset-content'), id);
    };

    window.deleteAsset = function(id) {
        const a = assets.find(x => x.id == id);
        if (confirm('Hapus aset ' + a?.kode + '?')) {
            assets = assets.filter(x => x.id != id);
            saveAssets();
            updateStatusBar();
            addLog('DELETE', 'Aset ' + a?.kode + ' dihapus');
            renderTab('list');
        }
    };

    window.generateQR = function(id) {
        let kode;
        if (id === 'new') {
            kode = document.getElementById('akode')?.value || 'ASSET-NEW';
        } else {
            const a = assets.find(x => x.id == id);
            kode = a ? a.kode : 'ASSET-UNKNOWN';
        }
        const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent('DREAM-OS|' + kode);
        const modal = document.createElement('div');
        modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:10000;';
        modal.innerHTML = '<div style="background:#1e293b;padding:1.5rem;border-radius:1rem;text-align:center;border:1px solid #8b5cf6;"><h4 style="color:#8b5cf6;">QR Code</h4><p style="font-size:0.85rem;">' + kode + '</p><img src="' + qrUrl + '" style="max-width:200px;border-radius:0.5rem;border:2px solid #8b5cf6;"><br><button onclick="this.parentElement.parentElement.remove()" class="asbtn" style="margin-top:1rem;">Tutup</button></div>';
        document.body.appendChild(modal);
        modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
        addLog('QR', 'QR Code digenerate untuk ' + kode);
    };

    function renderTax(container) {
        const aktif = assets.filter(a => a.kondisi === 'aktif');
        let html = '<h3 style="color:#8b5cf6;margin-bottom:1rem;">📊 Laporan Pajak & Penyusutan</h3>';
        if (aktif.length === 0) { html += '<p>Tidak ada aset aktif</p>'; container.innerHTML = html; return; }
        html += '<div style="overflow-x:auto;"><table class="table-as"><thead><tr><th>Kode</th><th>Nama</th><th>Nilai</th><th>Susut</th><th>Nilai Buku</th><th>Masa</th><th>Metode</th></tr></thead><tbody>';
        let totalNilai = 0, totalSusut = 0;
        aktif.forEach(a => {
            totalNilai += a.nilai || 0;
            totalSusut += a.akum_susut || 0;
            html += '<tr><td>' + a.kode + '</td><td>' + a.nama + '</td><td>' + fmtRp(a.nilai) + '</td><td>' + fmtRp(a.akum_susut||0) + '</td><td>' + fmtRp((a.nilai||0)-(a.akum_susut||0)) + '</td><td>' + (a.masa||'-') + ' thn</td><td>' + (a.metode||'-') + '</td></tr>';
        });
        html += '<tr style="font-weight:bold;background:rgba(139,92,246,0.1);"><td colspan="2">TOTAL</td><td>' + fmtRp(totalNilai) + '</td><td>' + fmtRp(totalSusut) + '</td><td>' + fmtRp(totalNilai-totalSusut) + '</td><td colspan="2"></td></tr>';
        html += '</tbody></table></div>';
        html += '<div style="margin-top:1rem;"><button class="asbtn" onclick="window.print()">🖨️ Cetak</button> <button class="asbtn-outline" onclick="hitungSusutMassal()">🔄 Hitung Ulang Susut</button></div>';
        container.innerHTML = html;
    }

    window.hitungSusutMassal = function() {
        assets.forEach(a => {
            if (a.kondisi === 'aktif' && a.nilai && a.masa && a.masa > 0) {
                const susutTahunan = a.metode === 'saldo_menurun' ? (a.nilai * 0.25) : (a.nilai / a.masa);
                a.akum_susut = Math.min(a.nilai, (a.akum_susut || 0) + susutTahunan);
            }
        });
        saveAssets();
        updateStatusBar();
        addLog('CALC', 'Penyusutan massal dihitung ulang');
        renderTab('tax');
    };

    function renderWarehouse(container) {
        let html = '<h3 style="color:#8b5cf6;margin-bottom:1rem;">🏭 Manajemen Gudang</h3>';
        html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;"><div><h4>Daftar Gudang</h4><div id="wh-list"></div></div><div><h4>Tambah Gudang</h4><form id="whform"><div style="margin-bottom:0.5rem;"><input type="text" id="whnama" class="asinput" placeholder="Nama Gudang" required></div><div style="margin-bottom:0.5rem;"><input type="text" id="whlokasi" class="asinput" placeholder="Lokasi"></div><button type="submit" class="asbtn">➕ Tambah</button></form></div></div>';
        container.innerHTML = html;

        function refreshWH() {
            const list = document.getElementById('wh-list');
            if (warehouses.length === 0) { list.innerHTML = '<p style="opacity:0.7;">Belum ada gudang</p>'; return; }
            list.innerHTML = warehouses.map(w => {
                const count = assets.filter(a => a.gudang_id === w.id).length;
                return '<div style="background:rgba(0,0,0,0.2);padding:0.75rem;border-radius:0.5rem;margin-bottom:0.5rem;"><strong>' + w.nama + '</strong> (' + w.lokasi + ')<br><span style="font-size:0.8rem;">' + count + ' aset</span> <button class="asbtn-danger asbtn-sm" style="float:right;" onclick="deleteWH(' + w.id + ')">🗑️</button></div>';
            }).join('');
        }
        document.getElementById('whform').addEventListener('submit', function(e) {
            e.preventDefault();
            warehouses.push({ id: Date.now(), nama: document.getElementById('whnama').value, lokasi: document.getElementById('whlokasi').value });
            saveWarehouses();
            updateStatusBar();
            addLog('WH_CREATE', 'Gudang ' + document.getElementById('whnama').value + ' dibuat');
            this.reset();
            refreshWH();
        });
        refreshWH();
    }

    window.deleteWH = function(id) {
        if (confirm('Hapus gudang ini? Aset di dalamnya akan jadi tanpa gudang.')) {
            assets.forEach(a => { if (a.gudang_id === id) a.gudang_id = null; });
            saveAssets();
            warehouses = warehouses.filter(w => w.id !== id);
            saveWarehouses();
            updateStatusBar();
            renderTab('warehouse');
        }
    };

    function renderAudit(container) {
        let html = '<h3 style="color:#8b5cf6;margin-bottom:1rem;">📜 Audit Log</h3>';
        if (auditLogs.length === 0) { html += '<p style="opacity:0.7;">Belum ada aktivitas</p>'; container.innerHTML = html; return; }
        html += '<div style="max-height:400px;overflow-y:auto;">';
        auditLogs.slice(0,100).forEach(log => {
            html += '<div style="padding:0.5rem;border-bottom:1px solid rgba(255,255,255,0.05);font-size:0.8rem;"><strong>[' + log.aksi + ']</strong> ' + log.detail + ' <span style="opacity:0.5;float:right;">' + fmtDate(log.waktu) + '</span></div>';
        });
        html += '</div>';
        html += '<button class="asbtn-danger asbtn-sm" style="margin-top:1rem;" onclick="if(confirm(\'Hapus audit log?\')){auditLogs=[];saveAudit();renderTab(\'audit\');}">🗑️ Hapus Log</button>';
        container.innerHTML = html;
    }

    function renderExport(container) {
        container.innerHTML = '<h3 style="color:#8b5cf6;margin-bottom:1rem;">📤 Export Data</h3>' +
            '<div style="display:flex;gap:1rem;flex-wrap:wrap;">' +
                '<button class="asbtn" onclick="exportAssetCSV()">📊 Aset (CSV)</button>' +
                '<button class="asbtn" onclick="exportAssetJSON()">📄 Aset (JSON)</button>' +
                '<button class="asbtn-outline" onclick="exportAuditCSV()">📊 Audit (CSV)</button>' +
                '<button class="asbtn-outline" onclick="exportAuditJSON()">📄 Audit (JSON)</button>' +
                '<button class="asbtn-danger" onclick="if(confirm(\'Reset SEMUA data?\')){localStorage.clear();location.reload();}">🗑️ Reset Semua</button>' +
            '</div>';
    }

    window.exportAssetCSV = function() {
        let csv = 'ID,Kode,Nama,Kategori,Kondisi,Nilai,Susut,NilaiBuku,Gudang,PIC,TglPerolehan\n';
        assets.forEach(a => {
            const wh = warehouses.find(w => w.id === a.gudang_id);
            csv += a.id + ',"' + a.kode + '","' + a.nama + '","' + a.kategori + '","' + a.kondisi + '",' + a.nilai + ',' + (a.akum_susut||0) + ',' + ((a.nilai||0)-(a.akum_susut||0)) + ',"' + (wh?.nama||'') + '","' + (a.pic||'') + '","' + (a.tgl_perolehan||'') + '"\n';
        });
        downloadFile('aset.csv', csv);
    };
    window.exportAssetJSON = function() { downloadFile('aset.json', JSON.stringify(assets, null, 2)); };
    window.exportAuditCSV = function() {
        let csv = 'ID,Aksi,Detail,User,Waktu\n';
        auditLogs.forEach(l => { csv += l.id + ',"' + l.aksi + '","' + l.detail + '","' + l.user + '","' + l.waktu + '"\n'; });
        downloadFile('audit.csv', csv);
    };
    window.exportAuditJSON = function() { downloadFile('audit.json', JSON.stringify(auditLogs, null, 2)); };
    function downloadFile(name, text) {
        const b = new Blob([text], {type:'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = name;
        a.click();
    }

    // Inisialisasi
    document.querySelectorAll('.astab').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.astab').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            renderTab(this.dataset.tab);
        });
    });
    updateStatusBar();
    renderTab('dashboard');
})();
</script>
