<div id="janout-root"></div>
<script>
(function() {
    function getChecklist() { try { return JSON.parse(localStorage.getItem('dreamos_janitor_outdoor') || '{}'); } catch(e) { return {}; } }
    function saveChecklist(data) { localStorage.setItem('dreamos_janitor_outdoor', JSON.stringify(data)); }

    var ITEMS = ['Jalan Utama', 'Lorong dan Jalan Kecil', 'Parkir Motor / Mobil', 'Area Loby', 'Play Ground', 'Taman', 'Lapangan', 'Keterangan Dll'];
    var WEEKLY_TASKS = ['Pangkas Rumput', 'Pangkas Dahan', 'Pupuk Tanaman', 'Bersihkan Kolam', 'Perbaiki Pagar', 'Lainnya'];

    var JanoutApp = {
        date: new Date().toISOString().split('T')[0], shift: 'pagi', data: {}, petugas: '', area: '', photoData: {},
        oninit: function() { this.loadData(); },
        loadData: function() {
            var all = getChecklist();
            if (!all[this.date]) all[this.date] = { shifts: { pagi: {}, siang: {}, sore: {} }, weekly: {}, petugas: '', area: '', photos: {} };
            if (!all[this.date].shifts) all[this.date].shifts = { pagi: {}, siang: {}, sore: {} };
            if (!all[this.date].photos) all[this.date].photos = {};
            this.data = all; this.petugas = all[this.date].petugas || ''; this.area = all[this.date].area || ''; this.photoData = all[this.date].photos || {};
            m.redraw();
        },
        saveMetadata: function() {
            if (!this.data[this.date]) this.data[this.date] = { shifts: { pagi: {}, siang: {}, sore: {} }, weekly: {}, petugas: '', area: '', photos: {} };
            this.data[this.date].petugas = this.petugas; this.data[this.date].area = this.area;
            saveChecklist(this.data);
        },
        toggleItem: function(item) {
            if (!this.data[this.date].shifts[this.shift]) this.data[this.date].shifts[this.shift] = {};
            this.data[this.date].shifts[this.shift][item] = !this.data[this.date].shifts[this.shift][item];
            saveChecklist(this.data);
        },
        toggleWeekly: function(task) {
            if (!this.data[this.date].weekly) this.data[this.date].weekly = {};
            this.data[this.date].weekly[task] = !this.data[this.date].weekly[task];
            saveChecklist(this.data);
        },
        getProgress: function() {
            var checked = 0;
            if (this.data[this.date] && this.data[this.date].shifts[this.shift]) {
                ITEMS.forEach(function(item) { if (this.data[this.date].shifts[this.shift][item]) checked++; }.bind(this));
            }
            return { checked: checked, total: ITEMS.length };
        },
        uploadPhoto: function() {
            var self = this;
            var input = document.createElement('input');
            input.type = 'file'; input.accept = 'image/*'; input.capture = 'environment';
            input.onchange = function(e) {
                var file = e.target.files[0]; if (!file) return;
                var reader = new FileReader();
                reader.onload = function(ev) {
                    var key = self.shift + '-area';
                    self.data[self.date].photos[key] = ev.target.result;
                    saveChecklist(self.data);
                    self.photoData = self.data[self.date].photos;
                    m.redraw();
                };
                reader.readAsDataURL(file);
            };
            input.click();
        },
        view: function() {
            var self = this, progress = self.getProgress(), percent = Math.round((progress.checked / progress.total) * 100);
            var shiftLabels = { pagi: '🌅 Pagi (07:30)', siang: '☀️ Siang (13:00)', sore: '🌇 Sore (15:00)' };
            var photoKey = self.shift + '-area', photo = self.photoData[photoKey];
            return m("div", { style: "min-height:100vh;background:var(--bg-deep-space);color:var(--text-primary);font-family:'Space Grotesk',sans-serif;padding:1rem;padding-bottom:5rem;" }, [
                m("div", { style: "display:flex;align-items:center;gap:1rem;margin-bottom:1rem;" }, [
                    m("button", { onclick: function() { document.getElementById('janitor-out-module').style.display = 'none'; }, style: "background:rgba(255,255,255,0.1);color:var(--text-primary);border:none;padding:0.5rem 1rem;border-radius:0.5rem;cursor:pointer;font-weight:600;" }, "← Kembali"),
                    m("div", [ m("h2", { style: "color:#22c55e;font-size:1.3rem;font-weight:800;" }, "🌿 Janitor Outdoor"), m("p", { style: "color:var(--text-secondary);font-size:0.7rem;" }, "Ceklis & Tugas Mingguan"), m("button", {onclick:function(){self.cetakLaporan();}, style:"padding:0.4rem 0.8rem;background:#6366f1;color:white;border:none;border-radius:0.5rem;cursor:pointer;font-weight:600;font-size:0.75rem;"}, "🖨️ Cetak") ])
                ]),
                m("div", { class: "dream-panel", style: "padding:0.75rem;margin-bottom:0.75rem;" }, [
                    m("h4", { style: "color:var(--neon-tawhid);margin-bottom:0.5rem;" }, "👤 Petugas & Area"),
                    m("div", { style: "display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;" }, [
                        m("input", { type: "text", placeholder: "Nama Petugas", value: self.petugas, oninput: function(e) { self.petugas = e.target.value; self.saveMetadata(); }, style: "background:var(--input-bg);border:1px solid var(--glass-border);border-radius:0.5rem;padding:0.5rem;color:var(--text-primary);font-size:0.8rem;" }),
                        m("input", { type: "text", placeholder: "Area / Taman", value: self.area, oninput: function(e) { self.area = e.target.value; self.saveMetadata(); }, style: "background:var(--input-bg);border:1px solid var(--glass-border);border-radius:0.5rem;padding:0.5rem;color:var(--text-primary);font-size:0.8rem;" })
                    ])
                ]),
                m("div", { class: "dream-panel", style: "padding:0.75rem;margin-bottom:0.75rem;display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center;" }, [
                    m("input", { type: "date", value: self.date, onchange: function(e) { self.date = e.target.value; self.loadData(); }, style: "background:var(--input-bg);border:1px solid var(--glass-border);border-radius:0.5rem;padding:0.5rem;color:var(--text-primary);font-size:0.8rem;" }),
                    m("div", { style: "display:flex;gap:0.3rem;" }, ['pagi','siang','sore'].map(function(s) {
                        return m("button", { onclick: function() { self.shift = s; self.loadData(); }, style: "padding:0.5rem 0.8rem;border:none;border-radius:0.5rem;cursor:pointer;font-weight:600;font-size:0.75rem;" + (self.shift===s?'background:var(--neon-tawhid);color:black;':'background:var(--glass-bg);color:var(--text-primary);') }, shiftLabels[s]);
                    })),
                    m("button", { onclick: function() { self.uploadPhoto(); }, style: "background:rgba(59,130,246,0.2);color:#3b82f6;border:none;border-radius:0.5rem;padding:0.5rem 0.8rem;font-size:0.75rem;cursor:pointer;" }, photo ? "📸✓" : "📸 Foto")
                ]),
                photo ? m("img", { src: photo, style: "max-width:100%;max-height:150px;border-radius:0.5rem;margin-bottom:0.75rem;" }) : null,
                m("div", { class: "dream-panel", style: "padding:0.75rem;margin-bottom:0.75rem;text-align:center;" }, [
                    m("div", { style: "font-size:1.2rem;font-weight:700;color:var(--neon-tawhid);" }, progress.checked + "/" + progress.total + " item"),
                    m("div", { style: "width:100%;height:8px;background:rgba(255,255,255,0.1);border-radius:4px;margin-top:0.3rem;" },
                        m("div", { style: "width:"+percent+"%;height:100%;background:"+(percent===100?'#10b981':percent>=50?'#f59e0b':'#ef4444')+";border-radius:4px;transition:width 0.3s;" }))
                ]),
                m("div", { class: "dream-panel", style: "padding:0.75rem;margin-bottom:0.75rem;" }, [
                    m("h4", { style: "color:var(--neon-tawhid);margin-bottom:0.5rem;" }, "📋 Ceklis Harian"),
                    ITEMS.map(function(item) {
                        var checked = self.data[self.date] && self.data[self.date].shifts[self.shift] && self.data[self.date].shifts[self.shift][item];
                        return m("label", { style: "display:flex;align-items:center;gap:0.5rem;padding:0.5rem;background:"+(checked?'rgba(16,185,129,0.15)':'rgba(255,255,255,0.03)')+";border-radius:0.5rem;margin-bottom:0.3rem;cursor:pointer;font-size:0.8rem;" }, [ m("input", { type: "checkbox", checked: checked, onchange: function() { self.toggleItem(item); } }), item ]);
                    })
                ]),
                m("div", { class: "dream-panel", style: "padding:0.75rem;" }, [
                    m("h4", { style: "color:var(--amber-glow);margin-bottom:0.5rem;" }, "🗓️ Tugas Mingguan"),
                    WEEKLY_TASKS.map(function(task) {
                        var checked = self.data[self.date] && self.data[self.date].weekly && self.data[self.date].weekly[task];
                        return m("label", { style: "display:flex;align-items:center;gap:0.5rem;padding:0.5rem;background:"+(checked?'rgba(245,158,11,0.15)':'rgba(255,255,255,0.03)')+";border-radius:0.5rem;margin-bottom:0.3rem;cursor:pointer;font-size:0.8rem;" }, [ m("input", { type: "checkbox", checked: checked, onchange: function() { self.toggleWeekly(task); } }), task ]);
                    })
                ])
            ]);
        }
    };
    m.mount(document.getElementById('janout-root'), JanoutApp);
})();
</script>
