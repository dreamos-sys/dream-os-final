<div id="main-app" style="display:none;min-height:100vh;background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#0f172a 100%);font-family:'Inter',sans-serif;">
    <header style="padding:2rem 1.5rem 1rem;text-align:center;background:linear-gradient(180deg,rgba(16,185,129,0.15),transparent);border-bottom:1px solid rgba(16,185,129,0.2);backdrop-filter:blur(20px);">
        <img src="assets/logo-sultan.png" style="width:56px;height:56px;border-radius:16px;border:2px solid rgba(251,191,36,0.4);box-shadow:0 0 30px rgba(16,185,129,0.3);cursor:pointer;margin-bottom:0.75rem;" onclick="tapLogo()" onerror="this.style.display='none'">
        <p style="font-size:1.8rem;font-weight:800;color:#2dd4bf;text-shadow:0 0 30px rgba(45,212,191,0.4);margin-bottom:0.25rem;font-family:'Amiri',serif;">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ</p>
        <p style="font-size:0.8rem;color:rgba(45,212,191,0.7);font-style:italic;font-family:'Amiri',serif;">اَللّٰهُمَّ صَلِّ عَلٰى سَيِّدِنَا مُحَمَّدٍ</p>
        <div style="display:flex;justify-content:center;gap:0.75rem;margin-top:1rem;flex-wrap:wrap;">
            <span style="background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.3);padding:0.5rem 1rem;border-radius:2rem;font-size:0.7rem;color:#2dd4bf;font-weight:600;">🕌 Dzuhur</span>
            <span style="background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);padding:0.5rem 1rem;border-radius:2rem;font-size:0.7rem;color:#818cf8;font-weight:600;">⏱️ <span id="countdown">00:00:00</span></span>
            <span style="background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.3);padding:0.5rem 1rem;border-radius:2rem;font-size:0.7rem;color:#4ade80;font-weight:600;">🔋 47%</span>
        </div>
    </header>
    <main style="padding:1.5rem;padding-bottom:6rem;">
        <div style="background:rgba(30,41,59,0.6);border:1px solid rgba(45,212,191,0.2);border-radius:1.5rem;padding:1.25rem;margin-bottom:1.5rem;backdrop-filter:blur(10px);">
            <h3 style="color:#2dd4bf;font-size:0.8rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;text-align:center;margin-bottom:0.5rem;">Today's Booking</h3>
            <p style="color:#94a3b8;font-size:0.8rem;text-align:center;">No bookings today</p>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0.75rem;" id="module-grid"></div>
    </main>
    <nav style="position:fixed;bottom:0;left:0;right:0;height:4rem;background:rgba(15,23,42,0.95);border-top:1px solid rgba(45,212,191,0.2);display:flex;justify-content:space-around;align-items:center;z-index:40;backdrop-filter:blur(20px);">
        <button onclick="nav('HOME')" style="color:#2dd4bf;display:flex;flex-direction:column;align-items:center;font-size:0.65rem;font-weight:600;"><span style="font-size:1.3rem;">🏠</span>Home</button>
        <button onclick="nav('PROFILE')" style="color:#94a3b8;display:flex;flex-direction:column;align-items:center;font-size:0.65rem;font-weight:600;"><span style="font-size:1.3rem;">👤</span>Profile</button>
        <button onclick="nav('QR')" style="color:#94a3b8;display:flex;flex-direction:column;align-items:center;font-size:0.65rem;font-weight:600;"><span style="font-size:1.3rem;">📱</span>QR</button>
        <button onclick="nav('ABOUT')" style="color:#94a3b8;display:flex;flex-direction:column;align-items:center;font-size:0.65rem;font-weight:600;"><span style="font-size:1.3rem;">ℹ️</span>About</button>
        <button onclick="nav('SETTING')" style="color:#94a3b8;display:flex;flex-direction:column;align-items:center;font-size:0.65rem;font-weight:600;"><span style="font-size:1.3rem;">⚙️</span>Setting</button>
    </nav>
</div>
