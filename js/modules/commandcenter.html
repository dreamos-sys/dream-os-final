<!-- COMMAND CENTER PRO v2.0 - ENTERPRISE HARDENED -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Command Center • Enterprise v2.0</title>

<!-- Security Helper -->
<script src="../js/security-helper.js"></script>

<style>
  :root {
    --glass-bg: rgba(15, 23, 42, 0.6);
    --glass-border: rgba(0, 255, 157, 0.1);
    --neon: #00ff9d;
    --accent: #0ea5e9;
    --warning: #e11d48;
    --gold: #f59e0b;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:#0a0e27; color:#e2e8f0; font-family:'Inter',sans-serif; min-height:100vh; }
  .glass-panel {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 1.2rem;
    margin-bottom: 1rem;
  }
  .back-btn {
    position: fixed; top: 1rem; left: 1rem; z-index: 1000;
    background: rgba(30,41,59,0.8); border: 1px solid var(--neon);
    color: var(--neon); padding: 0.6rem 1.2rem; border-radius: 12px;
    cursor: pointer; font-weight: 700; font-size: 0.8rem;
  }
  .btn {
    padding: 0.7rem 1.2rem; border: none; border-radius: 12px;
    font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: all 0.2s ease;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-success { background: #10b981; color: #fff; }
  .btn-danger { background: var(--warning); color: #fff; }
  .btn-warning { background: var(--gold); color: #000; }
  .btn:hover { transform: translateY(-1px); opacity: 0.9; }
  .input-field {
    width: 100%; padding: 0.7rem; background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
    color: #e2e8f0; font-size: 0.8rem; outline: none;
  }
  .input-field:focus { border-color: var(--neon); }
  table { width:100%; border-collapse:collapse; font-size:0.75rem; }
  th { background: rgba(0,0,0,0.3); color: #94a3b8; padding: 0.6rem; text-align: left; }
  td { padding: 0.5rem 0.6rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .badge {
    padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.65rem; font-weight: 600;
  }
  .badge-pending { background: rgba(245,158,11,0.2); color: #f59e0b; }
  .badge-approved { background: rgba(16,185,129,0.2); color: #10b981; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
</style>

<button class="back-btn" onclick="window.parent.goHome()">← KEMBALI</button>

<div style="max-width:1100px; margin:0 auto; padding:4rem 1.5rem 5rem;">

  <!-- HEADER -->
  <div class="glass-panel" style="display:flex; justify-content:space-between; align-items:center;">
    <div>
      <h2 style="color:var(--neon); margin:0;">🏢 Command Center Pro</h2>
      <p style="color:#94a3b8; font-size:0.7rem; margin:0;" id="role-subtitle">Memuat...</p>
    </div>
    <div style="text-align:right;">
      <div style="font-weight:700;" id="user-display">🔒</div>
      <button class="btn btn-danger" onclick="doLogout()" style="font-size:0.7rem; padding:0.4rem 1rem; margin-top:0.3rem;">🚪 Logout</button>
    </div>
  </div>

  <!-- ENTERPRISE DASHBOARD -->
  <div class="glass-panel" style="border-color: rgba(14,165,233,0.4);">
    <h3 style="color:var(--accent); margin:0 0 1rem;">📊 Enterprise Dashboard</h3>
    <div class="grid-2" id="kpi-summary"></div>
    <canvas id="mainChart" style="max-height:250px; margin-top:1rem;"></canvas>
  </div>

  <!-- MANAJEMEN USER -->
  <div class="glass-panel" style="border-color: rgba(139,92,246,0.4);">
    <h3 style="color:#8b5cf6; margin:0 0 1rem;">👥 Manajemen User & Device Binding</h3>
    <div style="display:flex; gap:0.5rem; margin-bottom:1rem; flex-wrap:wrap;">
      <button class="btn btn-primary" onclick="addNewUser()">➕ Tambah User</button>
      <button class="btn btn-success" onclick="resetUserPassword()">🔑 Reset Password</button>
      <button class="btn btn-warning" onclick="printUserList()">🖨️ Cetak Daftar</button>
    </div>
    <div id="user-table" style="max-height:300px; overflow-y:auto;"></div>
  </div>

  <!-- WORKFLOW APPROVAL -->
  <div class="grid-2">
    <div class="glass-panel">
      <h3 style="color:var(--gold); margin:0 0 1rem;">💸 Pengajuan Dana</h3>
      <div id="dana-pending-list"></div>
      <button class="btn btn-primary" onclick="submitDana()" style="margin-top:0.5rem;">📝 Ajukan Dana Baru</button>
    </div>
    <div class="glass-panel">
      <h3 style="color:var(--accent); margin:0 0 1rem;">🔧 Maintenance</h3>
      <div id="maint-list"></div>
    </div>
  </div>

  <!-- AUDIT TRAIL -->
  <div class="glass-panel">
    <h3 style="color:#94a3b8; margin:0 0 1rem;">📜 Audit Trail (ISO 27001)</h3>
    <div id="audit-log" style="max-height:200px; overflow-y:auto; font-size:0.7rem; color:#64748b;"></div>
  </div>

  <!-- SISTEM -->
  <div class="glass-panel" style="border-color: rgba(239,68,68,0.3);">
    <h3 style="color:var(--warning); margin:0 0 1rem;">⚙️ Sistem & Backup</h3>
    <button class="btn btn-success" onclick="exportAllData()">📥 Export Backup (JSON)</button>
    <button class="btn btn-danger" onclick="resetSystem()" style="margin-left:0.5rem;">⚠️ Reset Pengaturan</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
(function() {
  'use strict';

  // ========== CORE ==========
  const SEC = window.DreamSec;
  if (!SEC) {
    alert('Security Helper tidak ditemukan! Pastikan js/security-helper.js sudah dimuat.');
    return;
  }

  let currentUser = SEC.getCurrentUser();
  const role = SEC.getCurrentRole();

  // Cek akses
  if (!SEC.canAccess('cmd')) {
    document.body.innerHTML = '<div style="text-align:center;padding:4rem;color:#ef4444;"><h2>⛔ AKSES DITOLAK</h2><p>Role Anda tidak memiliki izin ke Command Center.</p><button onclick="window.parent.goHome()" style="padding:0.8rem 2rem;background:#10b981;color:#fff;border:none;border-radius:8px;cursor:pointer;margin-top:1rem;">← Kembali ke Home</button></div>';
    return;
  }

  // ========== INISIALISASI ==========
  document.getElementById('user-display').textContent = currentUser ? currentUser.nama : 'Unknown';
  document.getElementById('role-subtitle').textContent = 'Role: ' + role.toUpperCase() + ' • ISO 27001 Compliant';
  renderAll();
  setInterval(renderAll, 30000); // Refresh setiap 30 detik

  // ========== RENDER FUNCTIONS ==========
  function safeGet(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); }
    catch(e) { return fallback; }
  }

  function renderAll() {
    renderKPIs();
    renderChart();
    renderUserTable();
    renderDanaPending();
    renderMaintenance();
    renderAuditLog();
  }

  function renderKPIs() {
    const dana = safeGet('dreamos_dana', []);
    const k3 = safeGet('dreamos_k3_reports', []);
    const maint = safeGet('dreamos_maintenance_tasks', []);
    const stok = safeGet('dreamos_stok', []);

    const pendingDana = dana.filter(d => d.status === 'pending').length;
    const urgentK3 = k3.filter(k => k.status === 'pending').length;
    const activeMaint = maint.filter(m => m.status !== 'Selesai' && m.status !== 'Disetujui').length;
    const totalStok = stok.reduce((s, i) => s + (parseInt(i.jumlah) || 0), 0);

    document.getElementById('kpi-summary').innerHTML = `
      <div style="text-align:center;padding:0.8rem;background:rgba(245,158,11,0.1);border-radius:12px;">
        <div style="font-size:0.7rem;color:#94a3b8;">💰 Dana Pending</div>
        <div style="font-size:1.5rem;font-weight:700;color:#f59e0b;">${pendingDana}</div>
      </div>
      <div style="text-align:center;padding:0.8rem;background:rgba(239,68,68,0.1);border-radius:12px;">
        <div style="font-size:0.7rem;color:#94a3b8;">⚠️ K3 Urgent</div>
        <div style="font-size:1.5rem;font-weight:700;color:#ef4444;">${urgentK3}</div>
      </div>
      <div style="text-align:center;padding:0.8rem;background:rgba(14,165,233,0.1);border-radius:12px;">
        <div style="font-size:0.7rem;color:#94a3b8;">🔧 Maint. Aktif</div>
        <div style="font-size:1.5rem;font-weight:700;color:#0ea5e9;">${activeMaint}</div>
      </div>
      <div style="text-align:center;padding:0.8rem;background:rgba(16,185,129,0.1);border-radius:12px;">
        <div style="font-size:0.7rem;color:#94a3b8;">📦 Total Stok</div>
        <div style="font-size:1.5rem;font-weight:700;color:#10b981;">${totalStok}</div>
      </div>
    `;
  }

  function renderChart() {
    const ctx = document.getElementById('mainChart');
    if (!ctx || typeof Chart === 'undefined') return;
    const dana = safeGet('dreamos_dana', []);
    const k3 = safeGet('dreamos_k3_reports', []);
    const maint = safeGet('dreamos_maintenance_tasks', []);

    if (window._chart) window._chart.destroy();
    window._chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Dana Pending', 'Dana ACC', 'K3 Urgent', 'K3 Selesai', 'Maint Aktif'],
        datasets: [{
          label: 'Status Operasional',
          data: [
            dana.filter(d => d.status === 'pending').length,
            dana.filter(d => d.status === 'approved').length,
            k3.filter(k => k.status === 'pending').length,
            k3.filter(k => k.status === 'Selesai').length,
            maint.filter(m => m.status !== 'Selesai').length
          ],
          backgroundColor: ['#f59e0b', '#10b981', '#ef4444', '#10b981', '#0ea5e9']
        }]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });
  }

  function renderUserTable() {
    const users = safeGet('dreamos_users_db', []);
    const container = document.getElementById('user-table');
    if (!users.length) {
      container.innerHTML = '<p style="text-align:center;color:#94a3b8;">Belum ada user terdaftar.</p>';
      return;
    }
    container.innerHTML = `
      <table>
        <tr><th>Nama</th><th>Email</th><th>Role</th><th>Device</th><th>Aksi</th></tr>
        ${users.map((u, i) => `
          <tr>
            <td>${SEC.sanitize(u.nama)}</td>
            <td>${SEC.sanitize(u.email)}</td>
            <td>${SEC.sanitize(u.role)}</td>
            <td>${u.device_dna ? '🔒 Terikat' : '⏳ Belum'}</td>
            <td>
              <button class="btn btn-warning" onclick="editUser(${i})" style="font-size:0.6rem;padding:0.3rem 0.6rem;">✏️</button>
              <button class="btn btn-danger" onclick="deleteUser(${i})" style="font-size:0.6rem;padding:0.3rem 0.6rem;">🗑️</button>
            </td>
          </tr>
        `).join('')}
      </table>
    `;
  }

  function renderDanaPending() {
    const dana = safeGet('dreamos_dana', []);
    const pending = dana.filter(d => d.status === 'pending');
    const container = document.getElementById('dana-pending-list');
    if (!pending.length) {
      container.innerHTML = '<p style="color:#94a3b8;">✅ Tidak ada pengajuan pending.</p>';
      return;
    }
    container.innerHTML = pending.map(d => `
      <div style="background:rgba(0,0,0,0.2);padding:0.8rem;border-radius:8px;margin-bottom:0.5rem;">
        <b>${SEC.sanitize(d.judul)}</b><br>
        Rp ${parseInt(d.nominal || 0).toLocaleString('id-ID')}<br>
        <button class="btn btn-success" onclick="approveDana('${d.id}')" style="font-size:0.65rem;padding:0.3rem 0.8rem;margin-top:0.3rem;">✅ ACC</button>
        <button class="btn btn-danger" onclick="rejectDana('${d.id}')" style="font-size:0.65rem;padding:0.3rem 0.8rem;">❌ Tolak</button>
      </div>
    `).join('');
  }

  function renderMaintenance() {
    const maint = safeGet('dreamos_maintenance_tasks', []);
    const active = maint.filter(m => m.status !== 'Selesai' && m.status !== 'Disetujui');
    const container = document.getElementById('maint-list');
    if (!active.length) {
      container.innerHTML = '<p style="color:#94a3b8;">✅ Semua maintenance selesai.</p>';
      return;
    }
    container.innerHTML = active.slice(0, 10).map(m => `
      <div style="background:rgba(0,0,0,0.2);padding:0.6rem;border-radius:8px;margin-bottom:0.3rem;font-size:0.75rem;">
        ${SEC.sanitize(m.judul)} - <span class="badge badge-pending">${SEC.sanitize(m.status)}</span>
      </div>
    `).join('');
  }

  function renderAuditLog() {
    const logs = safeGet('dreamos_audit_logs', []);
    document.getElementById('audit-log').innerHTML = logs.slice(0, 20).map(l => `
      <div style="margin-bottom:0.3rem;border-bottom:1px solid rgba(255,255,255,0.03);padding-bottom:0.2rem;">
        <span style="color:#475569;">[${new Date(l.time).toLocaleTimeString('id-ID')}]</span>
        <b>${SEC.sanitize(l.user)}</b> (${SEC.sanitize(l.role)}): ${SEC.sanitize(l.action)} - ${SEC.sanitize(l.details || '')}
      </div>
    `).join('') || '<p style="text-align:center;">Tidak ada aktivitas tercatat.</p>';
  }

  // ========== AKSI ==========
  window.addNewUser = async function() {
    const nama = prompt('Nama Lengkap:');
    if (!nama) return;
    const email = prompt('Email:');
    if (!email || !email.includes('@')) return alert('Email tidak valid!');
    const roleInput = prompt('Role (staff/security/janitor/maintenance):', 'staff');
    const pass = prompt('Password awal (min 6 karakter):', '123456');
    if (!pass || pass.length < 6) return alert('Password minimal 6 karakter!');

    const hashed = await SEC.hashPassword(pass);
    const users = safeGet('dreamos_users_db', []);
    if (users.find(u => u.email === email)) return alert('Email sudah terdaftar!');

    users.push({
      nama, email, role: roleInput,
      password_hash: hashed,
      device_dna: '',
      created_at: new Date().toISOString()
    });
    localStorage.setItem('dreamos_users_db', JSON.stringify(users));
    SEC.auditLog('ADD_USER', `Menambahkan ${nama} (${email})`);
    renderAll();
    alert(`✅ User ${nama} berhasil dibuat!\nEmail: ${email}\nPassword: ${pass}\n\n⚠️ Segera minta user mengganti password setelah login pertama.`);
  };

  window.editUser = function(index) {
    const users = safeGet('dreamos_users_db', []);
    const user = users[index];
    const newRole = prompt('Role baru:', user.role);
    if (newRole) {
      user.role = newRole;
      localStorage.setItem('dreamos_users_db', JSON.stringify(users));
      SEC.auditLog('EDIT_USER', `Ubah role ${user.nama} menjadi ${newRole}`);
      renderAll();
    }
  };

  window.deleteUser = function(index) {
    if (!confirm('Hapus user ini?')) return;
    const users = safeGet('dreamos_users_db', []);
    const deleted = users.splice(index, 1)[0];
    localStorage.setItem('dreamos_users_db', JSON.stringify(users));
    SEC.auditLog('DELETE_USER', `Menghapus ${deleted.nama}`);
    renderAll();
  };

  window.resetUserPassword = async function() {
    const email = prompt('Email user yang akan di-reset password:');
    if (!email) return;
    const users = safeGet('dreamos_users_db', []);
    const user = users.find(u => u.email === email);
    if (!user) return alert('User tidak ditemukan!');
    const newPass = prompt('Password baru (min 6 karakter):', '123456');
    if (!newPass || newPass.length < 6) return alert('Password minimal 6 karakter!');
    user.password_hash = await SEC.hashPassword(newPass);
    user.device_dna = ''; // Reset device binding
    localStorage.setItem('dreamos_users_db', JSON.stringify(users));
    SEC.auditLog('RESET_PASSWORD', `Reset password untuk ${user.nama}`);
    alert(`✅ Password untuk ${user.nama} telah direset.\nPassword baru: ${newPass}\n\nDevice binding juga direset.`);
    renderAll();
  };

  window.approveDana = function(id) {
    const dana = safeGet('dreamos_dana', []);
    const item = dana.find(d => d.id === id);
    if (item) {
      item.status = 'approved';
      localStorage.setItem('dreamos_dana', JSON.stringify(dana));
      SEC.auditLog('APPROVE_DANA', `ACC dana: ${item.judul}`);
      renderAll();
    }
  };

  window.rejectDana = function(id) {
    const dana = safeGet('dreamos_dana', []);
    const item = dana.find(d => d.id === id);
    if (item) {
      item.status = 'rejected';
      localStorage.setItem('dreamos_dana', JSON.stringify(dana));
      SEC.auditLog('REJECT_DANA', `Tolak dana: ${item.judul}`);
      renderAll();
    }
  };

  window.submitDana = function() {
    const judul = prompt('Judul pengajuan:');
    if (!judul) return;
    const nominal = prompt('Nominal (angka):', '0');
    if (!nominal) return;
    const dana = safeGet('dreamos_dana', []);
    dana.push({
      id: 'dana_' + Date.now(),
      judul,
      nominal,
      status: 'pending',
      tanggal: new Date().toLocaleDateString('id-ID')
    });
    localStorage.setItem('dreamos_dana', JSON.stringify(dana));
    SEC.auditLog('SUBMIT_DANA', `Mengajukan ${judul} Rp${nominal}`);
    renderAll();
  };

  window.printUserList = function() {
    const users = safeGet('dreamos_users_db', []);
    const w = window.open('', '_blank');
    w.document.write(`
      <html><head><title>Daftar User</title>
      <style>body{font-family:Arial;padding:2rem;}table{width:100%;border-collapse:collapse;}th,td{border:1px solid #000;padding:8px;}</style>
      </head><body><h2>Daftar User Dream OS</h2><table>
      <tr><th>Nama</th><th>Email</th><th>Role</th><th>Device</th></tr>
      ${users.map(u => `<tr><td>${u.nama}</td><td>${u.email}</td><td>${u.role}</td><td>${u.device_dna ? 'Terikat' : 'Belum'}</td></tr>`).join('')}
      </table></body></html>
    `);
    w.document.close();
    setTimeout(() => w.print(), 500);
  };

  window.exportAllData = function() {
    const data = {};
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (!key.includes('supabase') && !key.includes('gemini')) {
        try { data[key] = JSON.parse(localStorage.getItem(key)); }
        catch(e) { data[key] = localStorage.getItem(key); }
      }
    }
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'dreamos_backup_' + new Date().toISOString().split('T')[0] + '.json';
    a.click();
    SEC.auditLog('EXPORT_DATA', 'Backup data diunduh');
  };

  window.resetSystem = function() {
    if (confirm('⚠️ Yakin reset semua pengaturan? Data tidak akan dihapus.')) {
      localStorage.removeItem('dreamos_settings');
      localStorage.removeItem('theme');
      alert('✅ Reset selesai. Halaman akan dimuat ulang.');
      location.reload();
    }
  };

  window.doLogout = function() {
    localStorage.removeItem('dreamos_bound_user');
    localStorage.removeItem('dreamos_session_active');
    window.parent.location.reload();
  };

  SEC.auditLog('ACCESS', 'Membuka Command Center');
})();
</script>
