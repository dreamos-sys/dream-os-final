<!-- K3 Module v2.0 - Dream OS -->
<div style="min-height:100vh;background:linear-gradient(135deg,#0f172a,#1e293b);color:white;font-family:'Inter',sans-serif;padding:1.5rem;padding-bottom:5rem;">
    <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;">
        <button onclick="closeK3()" style="background:rgba(255,255,255,0.1);color:white;border:none;padding:0.5rem 1rem;border-radius:0.5rem;cursor:pointer;font-weight:600;">← Kembali</button>
        <h2 style="color:#f59e0b;font-size:1.5rem;font-weight:800;">⚠️ K3 Safety Report</h2>
    </div>

    <form id="k3Form" style="background:rgba(30,41,59,0.6);border:1px solid rgba(245,158,11,0.3);border-radius:1.5rem;padding:1.5rem;display:flex;flex-direction:column;gap:1rem;">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;">
            <div>
                <label style="color:#94a3b8;font-size:0.75rem;display:block;margin-bottom:0.3rem;">Tanggal *</label>
                <input type="date" id="k3-tgl" required style="width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);padding:0.75rem;border-radius:0.75rem;color:white;font-size:0.85rem;">
            </div>
            <div>
                <label style="color:#94a3b8;font-size:0.75rem;display:block;margin-bottom:0.3rem;">Lokasi *</label>
                <input type="text" id="k3-lokasi" required style="width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);padding:0.75rem;border-radius:0.75rem;color:white;font-size:0.85rem;" placeholder="Gedung A Lantai 2">
            </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;">
            <div>
                <label style="color:#94a3b8;font-size:0.75rem;display:block;margin-bottom:0.3rem;">Jenis Laporan *</label>
                <select id="k3-jenis" required style="width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);padding:0.75rem;border-radius:0.75rem;color:white;font-size:0.85rem;">
                    <option value="">-- Pilih --</option>
                    <option value="kerusakan">🔧 Kerusakan Fasilitas</option>
                    <option value="kehilangan">📦 Kehilangan</option>
                    <option value="kebersihan">🧹 Kebersihan</option>
                    <option value="kecelakaan">⚠️ Kecelakaan</option>
                    <option value="bahaya">☢️ Potensi Bahaya</option>
                    <option value="lainnya">📌 Lainnya</option>
                </select>
            </div>
            <div>
                <label style="color:#94a3b8;font-size:0.75rem;display:block;margin-bottom:0.3rem;">Prioritas</label>
                <select id="k3-priority" style="width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);padding:0.75rem;border-radius:0.75rem;color:white;font-size:0.85rem;">
                    <option value="normal">⚪ Normal</option>
                    <option value="high">🟡 Tinggi</option>
                    <option value="critical">🔴 Critical</option>
                </select>
            </div>
        </div>

        <div>
            <label style="color:#94a3b8;font-size:0.75rem;display:block;margin-bottom:0.3rem;">Deskripsi *</label>
            <textarea id="k3-deskripsi" rows="4" required style="width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);padding:0.75rem;border-radius:0.75rem;color:white;font-size:0.85rem;resize:none;" placeholder="Jelaskan detail kejadian..."></textarea>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;">
            <div>
                <label style="color:#94a3b8;font-size:0.75rem;display:block;margin-bottom:0.3rem;">Pelapor *</label>
                <input type="text" id="k3-pelapor" required style="width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);padding:0.75rem;border-radius:0.75rem;color:white;font-size:0.85rem;" placeholder="Nama Anda">
            </div>
            <div style="display:flex;align-items:flex-end;">
                <button type="submit" id="k3-submit" style="width:100%;background:linear-gradient(135deg,#f59e0b,#d97706);color:white;border:none;padding:1rem;border-radius:0.75rem;font-weight:700;font-size:1rem;cursor:pointer;transition:all 0.3s;">📩 KIRIM LAPORAN</button>
            </div>
        </div>
        <div id="k3-error" style="display:none;background:rgba(239,68,68,0.1);border:1px solid #ef4444;padding:0.75rem;border-radius:0.5rem;color:#ef4444;font-size:0.8rem;"></div>
        <div id="k3-success" style="display:none;background:rgba(16,185,129,0.1);border:1px solid #10b981;padding:0.75rem;border-radius:0.5rem;color:#10b981;font-size:0.8rem;"></div>
    </form>

    <!-- Info Box -->
    <div style="margin-top:1.5rem;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);border-radius:1rem;padding:1rem;">
        <h4 style="color:#f59e0b;font-weight:700;margin-bottom:0.5rem;">⚠️ Informasi K3:</h4>
        <ul style="color:#cbd5e1;font-size:0.75rem;display:flex;flex-direction:column;gap:0.3rem;">
            <li>• Laporan akan diteruskan ke modul terkait (Maintenance/Security/Janitor)</li>
            <li>• Priority Critical akan dieskalasi ke Maintenance</li>
            <li>• Semua laporan tercatat di audit trail Command Center</li>
        </ul>
    </div>
</div>

<script>
(function() {
    window.closeK3 = function() {
        const mod = document.getElementById('k3-module');
        if (mod) mod.style.display = 'none';
    };

    document.getElementById('k3Form').addEventListener('submit', function(e) {
        e.preventDefault();
        const errEl = document.getElementById('k3-error');
        const succEl = document.getElementById('k3-success');
        errEl.style.display = 'none';
        succEl.style.display = 'none';

        const tgl = document.getElementById('k3-tgl').value;
        const lokasi = document.getElementById('k3-lokasi').value.trim();
        const jenis = document.getElementById('k3-jenis').value;
        const priority = document.getElementById('k3-priority').value;
        const deskripsi = document.getElementById('k3-deskripsi').value.trim();
        const pelapor = document.getElementById('k3-pelapor').value.trim();

        if (!tgl || !lokasi || !jenis || !deskripsi || !pelapor) {
            errEl.textContent = 'Mohon isi semua field wajib (*)';
            errEl.style.display = 'block';
            return;
        }

        const reports = JSON.parse(localStorage.getItem('dreamos_k3_reports') || '[]');
        reports.push({
            id: Date.now(),
            tgl, lokasi, jenis, priority, deskripsi, pelapor,
            status: 'pending',
            created: new Date().toISOString()
        });
        localStorage.setItem('dreamos_k3_reports', JSON.stringify(reports));

        succEl.textContent = '✅ Laporan K3 berhasil dikirim!';
        succEl.style.display = 'block';
        this.reset();
        document.getElementById('k3-tgl').value = '';
    });
})();
</script>
