<div id="login-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center p-6 bg-gradient-to-br from-slate-100 via-white to-emerald-50">
    <div class="text-center mb-10">
        <img src="assets/logo-sultan.png" class="w-24 h-24 mx-auto rounded-3xl border-2 border-amber-400/40 shadow-2xl mb-6 cursor-pointer" onclick="tapLogo()" onerror="this.style.display='none'">
        <p class="text-5xl font-bold text-emerald-600 arabic-glow mb-3" style="font-family:'Amiri',serif">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ</p>
        <p class="text-lg text-emerald-600/80 italic" style="font-family:'Amiri',serif">اَللّٰهُمَّ صَلِّ عَلٰى سَيِّدِنَا مُحَمَّدٍ</p>
        <p class="text-xs text-gray-500 mt-4 font-semibold">Dream OS • v1.0 Limited Edition 2026</p>
    </div>
    <div class="w-full max-w-xs space-y-4">
        <div class="glass-light rounded-2xl p-1 flex items-center pr-3">
            <input type="password" id="pass" class="flex-1 p-4 bg-white/60 text-center outline-none font-mono tracking-[0.3em] text-emerald-600 placeholder-gray-400 rounded-xl" placeholder="••••">
            <button onclick="togglePass()" class="p-2 text-gray-400 hover:text-emerald-600 transition"><span id="eye">👁️</span></button>
        </div>
        <button onclick="login()" class="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-bold rounded-xl shadow-lg transition active:scale-95 text-sm tracking-widest uppercase">Access Core</button>
    </div>
    <div id="tap-counter" class="text-xs text-emerald-600 font-mono mt-4 opacity-0 font-semibold">Tap 0/7</div>
</div>
