<!-- Janitor Indoor Module v1.0 - Dream OS (adopt K3 system) -->
<div style="min-height:100vh;background:linear-gradient(135deg,#0f172a,#1e293b);color:white;font-family:'Inter',sans-serif;padding:1.5rem;padding-bottom:5rem;">
    <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;">
        <button onclick="closeJanitorIn()" style="background:rgba(255,255,255,0.1);color:white;border:none;padding:0.5rem 1rem;border-radius:0.5rem;cursor:pointer;font-weight:600;">← Kembali</button>
        <h2 style="color:#14b8a6;font-size:1.5rem;font-weight:800;">🧹 Janitor Indoor</h2>
    </div>

    <form id="janitorInForm" style="background:rgba(30,41,59,0.6);border:1px solid rgba(20,184,166,0.3);border-radius:1.5rem;padding:1.5rem;display:flex;flex-direction:column;gap:1rem;">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;">
            <div>
                <label style="color:#94a3b8;font-size:0.75rem;display:block;margin-bottom:0.3rem;">Tanggal *</label>
                <input type="date" id="ji-tgl" required style="width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);padding:0.75rem;border-radius:0.75rem;color:white;font-size:0.85rem;">
            </div>
            <div>
                <label style="color:#94a3b8;font-size:0.75rem;display:block;margin-bottom:0.3rem;">Shift *</label>
                <select id="ji-shift" required style="width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);padding:0.75rem;border-radius:0.75rem;color:white;font-size:0.85rem;">
                    <option value="">-- Pilih --</option>
                    <option value="pagi">🌅 Pagi (~07:00)</option>
                    <option value="siang">☀️ Siang (~12:00)</option>
                    <option value="sore">🌆 Sore (~16:00)</option>
                </select>
            </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.75rem;">
            <div>
                <label style="color:#94a3b8;font-size:0.75rem;display:block;margin-bottom:0.3rem;">Petugas *</label>
                <input type="text" id="ji-petugas" required style="width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);padding:0.75rem;border-radius:0.75rem;color:white;font-size:0.85rem;" placeholder="Nama petugas">
            </div>
            <div>
                <label style="color:#94a3b8;font-size:0.75rem;display:block;margin-bottom:0.3rem;">Area *</label>
                <input type="text" id="ji-area" required style="width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);padding:0.75rem;border-radius:0.75rem;color:white;font-size:0.85rem;" placeholder="SD - Lantai 1">
            </div>
            <div>
                <label style="color:#94a3b8;font-size:0.75rem;display:block;margin-bottom:0.3rem;">Gedung</label>
                <input type="text" id="ji-gedung" style="width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);padding:0.75rem;border-radius:0.75rem;color:white;font-size:0.85rem;" placeholder="SD / SMP / SMA">
            </div>
        </div>

        <!-- TOILET CHECKLIST -->
        <div>
            <h3 style="color:#14b8a6;font-size:1rem;margin-bottom:0.5rem;">🚽 Area Toilet</h3>
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0.5rem;" id="ji-toilet-grid">
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-toilet"> Pintu Utama</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-toilet"> Pintu Kubikal</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-toilet"> Kaca / Cermin</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-toilet"> Exhaust</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-toilet"> Dinding</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-toilet"> Tempat Wudhu</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-toilet"> Lantai</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-toilet"> Floor Drain</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-toilet"> Kloset</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-toilet"> Plafon / Flapond</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-toilet"> Tempat Sampah</label>
            </div>
        </div>

        <!-- RUANGAN CHECKLIST -->
        <div>
            <h3 style="color:#14b8a6;font-size:1rem;margin-bottom:0.5rem;">🏢 Ruangan & Area Umum</h3>
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0.5rem;" id="ji-ruang-grid">
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> Loby Utama</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> Teras</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> Lorong Utama</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> Balkon</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> Pintu Utama</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> Pintu Kelas</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> Jendela</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> Kelas</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> Aula</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> Sentra Musik</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> Sentra Kreasi</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> UKS</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> Psikolog</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> Lab Kom</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> Lab IPA</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> Perpustakaan</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> Kepala Sekolah</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> R. Guru Laki</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> R. Guru Perempuan</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> R. Pemasaran</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> R. Admin TU</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> R. Rapat</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> R. CEO</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> R. Kabid</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> R. Osis</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> R. Mushalla</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> R. Inklusi</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> Gudang Olahraga</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> R. Serbaguna</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> R. Masjid</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> Kantin</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> Saung Besar</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> Saung Kecil</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> Pos</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> Gudang Umum</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> Tangga</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> Lift</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;color:#cbd5e1;"><input type="checkbox" class="ji-ruang"> Lainnya</label>
            </div>
        </div>

        <div>
            <label style="color:#94a3b8;font-size:0.75rem;display:block;margin-bottom:0.3rem;">Catatan</label>
            <textarea id="ji-catatan" rows="2" style="width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);padding:0.75rem;border-radius:0.75rem;color:white;font-size:0.85rem;resize:none;" placeholder="Tambahan..."></textarea>
        </div>

        <div style="display:flex;gap:0.75rem;">
            <button type="submit" id="ji-submit" style="flex:1;background:linear-gradient(135deg,#14b8a6,#0d9488);color:white;border:none;padding:1rem;border-radius:0.75rem;font-weight:700;font-size:1rem;cursor:pointer;transition:all 0.3s;">✅ SIMPAN CEKLIS</button>
        </div>
        <div id="ji-error" style="display:none;background:rgba(239,68,68,0.1);border:1px solid #ef4444;padding:0.75rem;border-radius:0.5rem;color:#ef4444;font-size:0.8rem;"></div>
        <div id="ji-success" style="display:none;background:rgba(16,185,129,0.1);border:1px solid #10b981;padding:0.75rem;border-radius:0.5rem;color:#10b981;font-size:0.8rem;"></div>
    </form>

    <!-- Info Box -->
    <div style="margin-top:1.5rem;background:rgba(20,184,166,0.1);border:1px solid rgba(20,184,166,0.3);border-radius:1rem;padding:1rem;">
        <h4 style="color:#14b8a6;font-weight:700;margin-bottom:0.5rem;">📋 Info Kerja Indoor:</h4>
        <ul style="color:#cbd5e1;font-size:0.75rem;display:flex;flex-direction:column;gap:0.3rem;">
            <li>• Jam: Senin-Jumat 06:30-17:00, Sabtu 06:30-14:00</li>
            <li>• Ceklis 3x/hari: Pagi ~07:00, Siang ~12:00, Sore ~16:00</li>
            <li>• Area wajib diisi (SD/SMP/SMA/Serbaguna)</li>
        </ul>
    </div>
</div>

<script>
(function() {
    window.closeJanitorIn = function() {
        const mod = document.getElementById('janitor-in-module');
        if (mod) mod.style.display = 'none';
    };

    document.getElementById('janitorInForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const errEl = document.getElementById('ji-error');
        const succEl = document.getElementById('ji-success');
        errEl.style.display = 'none';
        succEl.style.display = 'none';

        const tgl = document.getElementById('ji-tgl').value;
        const shift = document.getElementById('ji-shift').value;
        const petugas = document.getElementById('ji-petugas').value.trim();
        const area = document.getElementById('ji-area').value.trim();
        const gedung = document.getElementById('ji-gedung').value.trim();
        const catatan = document.getElementById('ji-catatan').value.trim();

        if (!tgl || !shift || !petugas || !area) {
            errEl.textContent = 'Mohon isi Tanggal, Shift, Petugas, dan Area (*)';
            errEl.style.display = 'block';
            return;
        }

        const toilet = {};
        document.querySelectorAll('.ji-toilet').forEach(function(cb) {
            toilet[cb.parentElement.textContent.trim()] = cb.checked;
        });

        const ruangan = {};
        document.querySelectorAll('.ji-ruang').forEach(function(cb) {
            ruangan[cb.parentElement.textContent.trim()] = cb.checked;
        });

        const reports = JSON.parse(localStorage.getItem('dreamos_janitor_indoor_reports') || '[]');
        reports.push({
            id: Date.now(),
            tgl, shift, petugas, area, gedung,
            items: { toilet, ruangan },
            catatan,
            status: 'pending',
            created: new Date().toISOString()
        });
        localStorage.setItem('dreamos_janitor_indoor_reports', JSON.stringify(reports));

        succEl.textContent = '✅ Ceklis indoor berhasil disimpan!';
        succEl.style.display = 'block';
        this.reset();
        document.getElementById('ji-tgl').value = '';
    });
})();
</script>
