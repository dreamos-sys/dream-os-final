<!-- Booking Module v2.0 - Dream OS -->
<div style="min-height:100vh;background:linear-gradient(135deg,#0f172a,#1e293b);color:white;font-family:'Inter',sans-serif;padding:1.5rem;padding-bottom:5rem;">
    <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;">
        <button onclick="closeBooking()" style="background:rgba(255,255,255,0.1);color:white;border:none;padding:0.5rem 1rem;border-radius:0.5rem;cursor:pointer;font-weight:600;">← Kembali</button>
        <h2 style="color:#2dd4bf;font-size:1.5rem;font-weight:800;">📅 Form Booking Sarana</h2>
    </div>

    <!-- System Lock Alert -->
    <div id="lock-alert" style="display:none;background:rgba(239,68,68,0.1);border:1px solid #ef4444;border-radius:0.75rem;padding:1rem;margin-bottom:1.5rem;">
        <div style="color:#ef4444;font-weight:700;margin-bottom:0.5rem;">🔒 Sistem Booking Ditutup</div>
        <div id="lock-alert-msg" style="color:#fca5a5;font-size:0.85rem;"></div>
    </div>

    <form id="bookingForm" style="background:rgba(30,41,59,0.6);border:1px solid rgba(45,212,191,0.2);border-radius:1.5rem;padding:1.5rem;display:flex;flex-direction:column;gap:1rem;">
        <!-- Nama & Divisi -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;">
            <div>
                <label style="color:#94a3b8;font-size:0.75rem;display:block;margin-bottom:0.3rem;">Nama Pemohon *</label>
                <input type="text" id="bk-nama" required style="width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);padding:0.75rem;border-radius:0.75rem;color:white;font-size:0.85rem;">
            </div>
            <div>
                <label style="color:#94a3b8;font-size:0.75rem;display:block;margin-bottom:0.3rem;">Divisi</label>
                <input type="text" id="bk-divisi" style="width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);padding:0.75rem;border-radius:0.75rem;color:white;font-size:0.85rem;">
            </div>
        </div>

        <!-- No HP -->
        <div>
            <label style="color:#94a3b8;font-size:0.75rem;display:block;margin-bottom:0.3rem;">No. HP *</label>
            <input type="tel" id="bk-nohp" required style="width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);padding:0.75rem;border-radius:0.75rem;color:white;font-size:0.85rem;">
        </div>

        <!-- Sarana & Tanggal -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;">
            <div>
                <label style="color:#94a3b8;font-size:0.75rem;display:block;margin-bottom:0.3rem;">Pilih Sarana *</label>
                <select id="bk-sarana" required style="width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);padding:0.75rem;border-radius:0.75rem;color:white;font-size:0.85rem;">
                    <option value="">-- Pilih Sarana --</option>
                    <option>Aula SMP</option><option>Aula SMA</option><option>Saung Besar</option>
                    <option>Saung Kecil</option><option>Mushalla SMA</option><option>Serbaguna</option>
                    <option>Lapangan Basket</option><option>Lapangan Volly</option><option>Lapangan Tanah</option>
                    <option>Lapangan SMA</option><option>Kantin SMP</option><option>Kantin SMA</option>
                    <option>Labkom SD</option><option>Labkom SMP</option><option>Labkom SMA</option>
                    <option>Perpustakaan SD</option><option>Perpustakaan SMP</option><option>Perpustakaan SMA</option>
                </select>
            </div>
            <div>
                <label style="color:#94a3b8;font-size:0.75rem;display:block;margin-bottom:0.3rem;">Tanggal *</label>
                <input type="date" id="bk-tgl" required style="width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);padding:0.75rem;border-radius:0.75rem;color:white;font-size:0.85rem;">
            </div>
        </div>

        <!-- Jam Mulai & Selesai -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;">
            <div>
                <label style="color:#94a3b8;font-size:0.75rem;display:block;margin-bottom:0.3rem;">Jam Mulai *</label>
                <input type="time" id="bk-mulai" required value="08:00" style="width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);padding:0.75rem;border-radius:0.75rem;color:white;font-size:0.85rem;">
            </div>
            <div>
                <label style="color:#94a3b8;font-size:0.75rem;display:block;margin-bottom:0.3rem;">Jam Selesai *</label>
                <input type="time" id="bk-selesai" required value="10:00" style="width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);padding:0.75rem;border-radius:0.75rem;color:white;font-size:0.85rem;">
            </div>
        </div>

        <!-- Peralatan -->
        <div>
            <label style="color:#94a3b8;font-size:0.75rem;display:block;margin-bottom:0.3rem;">Peralatan Tambahan</label>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0.5rem;">
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.75rem;color:#cbd5e1;cursor:pointer;"><input type="checkbox" name="bk-alat" value="Sound Portable"> Sound Portable</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.75rem;color:#cbd5e1;cursor:pointer;"><input type="checkbox" name="bk-alat" value="Sound Display"> Sound Display</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.75rem;color:#cbd5e1;cursor:pointer;"><input type="checkbox" name="bk-alat" value="Projektor"> Projektor</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.75rem;color:#cbd5e1;cursor:pointer;"><input type="checkbox" name="bk-alat" value="TV"> TV</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.75rem;color:#cbd5e1;cursor:pointer;"><input type="checkbox" name="bk-alat" value="Mic Wireless"> Mic Wireless</label>
                <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.75rem;color:#cbd5e1;cursor:pointer;"><input type="checkbox" name="bk-alat" value="Kursi Futura"> Kursi Futura</label>
            </div>
        </div>

        <!-- Keperluan -->
        <div>
            <label style="color:#94a3b8;font-size:0.75rem;display:block;margin-bottom:0.3rem;">Keperluan</label>
            <textarea id="bk-keperluan" rows="2" style="width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);padding:0.75rem;border-radius:0.75rem;color:white;font-size:0.85rem;resize:none;"></textarea>
        </div>

        <button type="submit" id="bk-submit" style="background:linear-gradient(135deg,#2dd4bf,#06b6d4);color:#0f172a;border:none;padding:1rem;border-radius:0.75rem;font-weight:700;font-size:1rem;cursor:pointer;transition:all 0.3s;">📩 AJUKAN BOOKING</button>
        <div id="bk-error" style="display:none;background:rgba(239,68,68,0.1);border:1px solid #ef4444;padding:0.75rem;border-radius:0.5rem;color:#ef4444;font-size:0.8rem;"></div>
        <div id="bk-success" style="display:none;background:rgba(16,185,129,0.1);border:1px solid #10b981;padding:0.75rem;border-radius:0.5rem;color:#10b981;font-size:0.8rem;"></div>
    </form>

    <!-- Info Box -->
    <div style="margin-top:1.5rem;background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.3);border-radius:1rem;padding:1rem;">
        <h4 style="color:#3b82f6;font-weight:700;margin-bottom:0.5rem;">ℹ️ Informasi:</h4>
        <ul style="color:#cbd5e1;font-size:0.75rem;display:flex;flex-direction:column;gap:0.3rem;">
            <li>• Jam operasional: 07:30 - 16:00 (Senin-Jumat)</li>
            <li>• Sabtu: Optional (untuk team umum)</li>
            <li>• Minggu & Tanggal Merah: LIBUR</li>
            <li>• Jumat 10:30-13:00: Aula & Serbaguna tidak tersedia</li>
            <li>• Booking minimal H-1</li>
        </ul>
    </div>
</div>

<script>
(function() {
    const CONFIG = {
        WORK_HOURS: { start: 7.5, end: 16.0 },
        FRIDAY_PRAYER_BLOCK: { start: 10.5, end: 13.0 },
        FRIDAY_BLOCKED_ROOMS: ['Aula SMP', 'Aula SMA', 'Serbaguna', 'Mushalla SMA'],
        MIN_BOOKING_DAYS: 1,
        HOLIDAYS_2026: ['2026-01-01','2026-01-27','2026-03-20','2026-04-10','2026-05-01','2026-05-21','2026-06-01','2026-06-07','2026-06-08','2026-08-17','2026-09-15','2026-11-24','2026-12-25','2026-12-26']
    };

    function timeToDecimal(t) { const [h,m] = t.split(':').map(Number); return h + m/60; }
    function isFriday(d) { return new Date(d+'T00:00:00').getDay() === 5; }
    function isSunday(d) { return new Date(d+'T00:00:00').getDay() === 0; }
    function isHoliday(d) { return CONFIG.HOLIDAYS_2026.includes(d); }

    window.closeBooking = function() {
        const mod = document.getElementById('booking-module');
        if (mod) mod.style.display = 'none';
    };

    document.getElementById('bookingForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const errEl = document.getElementById('bk-error');
        const succEl = document.getElementById('bk-success');
        errEl.style.display = 'none';
        succEl.style.display = 'none';

        const nama = document.getElementById('bk-nama').value.trim();
        const divisi = document.getElementById('bk-divisi').value.trim();
        const nohp = document.getElementById('bk-nohp').value.trim();
        const sarana = document.getElementById('bk-sarana').value;
        const tgl = document.getElementById('bk-tgl').value;
        const mulai = document.getElementById('bk-mulai').value;
        const selesai = document.getElementById('bk-selesai').value;
        const keperluan = document.getElementById('bk-keperluan').value.trim();
        const alatEls = document.querySelectorAll('input[name="bk-alat"]:checked');
        const peralatan = Array.from(alatEls).map(e => e.value).join(', ');

        if (!nama || !nohp || !sarana || !tgl || !mulai || !selesai) {
            errEl.textContent = 'Mohon isi semua field wajib (*)';
            errEl.style.display = 'block';
            return;
        }

        const mDec = timeToDecimal(mulai);
        const sDec = timeToDecimal(selesai);
        if (sDec <= mDec) {
            errEl.textContent = 'Jam selesai harus > jam mulai!';
            errEl.style.display = 'block';
            return;
        }

        if (isSunday(tgl) || isHoliday(tgl)) {
            errEl.textContent = 'Tanggal tersebut LIBUR!';
            errEl.style.display = 'block';
            return;
        }

        if (isFriday(tgl) && CONFIG.FRIDAY_BLOCKED_ROOMS.includes(sarana)) {
            if (mDec < CONFIG.FRIDAY_PRAYER_BLOCK.end && sDec > CONFIG.FRIDAY_PRAYER_BLOCK.start) {
                errEl.textContent = sarana + ' tidak tersedia Jumat 10:30-13:00 (Shalat Jumat)';
                errEl.style.display = 'block';
                return;
            }
        }

        // Check double booking
        const bookings = JSON.parse(localStorage.getItem('dreamos_bookings') || '[]');
        const conflict = bookings.find(b => 
            b.sarana === sarana && b.tgl === tgl && b.status !== 'rejected' &&
            mDec < timeToDecimal(b.selesai) && sDec > timeToDecimal(b.mulai)
        );
        if (conflict) {
            errEl.textContent = 'BENTROK! ' + sarana + ' sudah di-booking ' + conflict.nama;
            errEl.style.display = 'block';
            return;
        }

        bookings.push({
            id: Date.now(),
            nama, divisi, nohp, sarana, tgl, mulai, selesai, keperluan, peralatan,
            status: 'pending',
            created: new Date().toISOString()
        });
        localStorage.setItem('dreamos_bookings', JSON.stringify(bookings));

        succEl.textContent = '✅ Booking berhasil! Menunggu approval.';
        succEl.style.display = 'block';
        this.reset();
        document.getElementById('bk-tgl').value = '';
    });
})();
</script>
