<div id="ghost-hub" style="display:none;position:fixed;inset:0;z-index:99999;background:linear-gradient(135deg,#0a0e27,#1a1f3a,#0f1419);overflow-y:auto;font-family:'Segoe UI',Roboto,Arial,sans-serif;">
    <div style="background:linear-gradient(90deg,rgba(15,23,42,0.95),rgba(30,41,59,0.95));border-bottom:2px solid #2dd4bf;padding:1rem 1.25rem;display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(10px);">
        <div style="display:flex;align-items:center;gap:0.75rem;">
            <div style="width:40px;height:40px;background:linear-gradient(135deg,#2dd4bf,#06b6d4);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;box-shadow:0 0 20px rgba(45,212,191,0.5);">🕌</div>
            <div>
                <h2 style="color:#2dd4bf;font-size:1rem;font-weight:800;margin:0;letter-spacing:0.5px;">4S DevOps Center</h2>
                <p style="color:#64748b;font-size:0.6rem;margin:0;">Shadow Soul Spirit • v2.0</p>
            </div>
        </div>
        <div style="display:flex;gap:0.75rem;align-items:center;">
            <span style="display:flex;align-items:center;gap:0.3rem;color:#10b981;font-size:0.65rem;font-weight:600;"><span style="width:6px;height:6px;background:#10b981;border-radius:50%;animation:pulse 2s infinite;"></span>ONLINE</span>
            <button onclick="hideGhostHub()" style="background:linear-gradient(135deg,#ef4444,#dc2626);color:white;border:none;padding:0.5rem 1rem;border-radius:8px;cursor:pointer;font-weight:700;font-size:0.75rem;box-shadow:0 4px 15px rgba(239,68,68,0.3);">✕</button>
        </div>
    </div>
    <div style="padding:1rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(85px,1fr));gap:8px;" id="ghost-tools-inject"></div>
    <div style="margin:0 1rem 1rem;background:rgba(0,0,0,0.8);border:1px solid rgba(45,212,191,0.3);border-radius:12px;padding:0.75rem;font-family:'Courier New',monospace;font-size:0.7rem;color:#2dd4bf;height:120px;overflow-y:auto;" id="ghost-log">
        <div style="color:#64748b;">> 4S DevOps Center ready...</div>
    </div>
    <style>
        @keyframes pulse { 0%,100%{opacity:0.3;} 50%{opacity:1;} }
    </style>
</div>
