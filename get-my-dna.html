<!DOCTYPE html>
<html>
<head>
    <title>Device DNA Checker</title>
    <style>
        body { font-family: monospace; padding: 2rem; background: #0a0e27; color: #00ff9d; text-align: center; }
        button { padding: 1rem 2rem; background: #10b981; color: white; border: none; border-radius: 12px; font-size: 1rem; cursor: pointer; margin: 1rem; }
        #result { margin-top: 1rem; padding: 1rem; background: rgba(0,0,0,0.3); border-radius: 12px; word-break: break-all; }
    </style>
</head>
<body>
    <h1>📱 Device DNA Generator</h1>
    <p>Klik tombol di bawah untuk generate Device DNA HP Anda:</p>
    <button onclick="generateDNA()">🔍 Generate My DNA</button>
    <div id="result"></div>
    
    <script>
    async function generateDNA() {
        var c = document.createElement('canvas');
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#f60';
        ctx.fillRect(125,1,62,20);
        var metrics = [navigator.hardwareConcurrency||0, screen.colorDepth, c.toDataURL()].join('|');
        var hashBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(metrics));
        var dna = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2,'0')).join('').substring(0,32);
        
        document.getElementById('result').innerHTML = 
            '<h3>✅ Device DNA Anda:</h3>' +
            '<h2 style="color:#f59e0b;">' + dna + '</h2>' +
            '<p style="color:#94a3b8;font-size:0.8rem;">Copy DNA ini untuk didaftarkan ke system</p>';
    }
    </script>
</body>
</html>
