name: Deploy save-settings Edge Function

on:
  push:
    branches: [gh-pages]
    paths:
      - 'supabase/functions/save-settings/**'
      - '.github/workflows/deploy-save-settings.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: |
          wget -qO- https://raw.githubusercontent.com/supabase/cli/main/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Deploy save-settings
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy save-settings --project-ref gbigjdhifispatrrskgh
