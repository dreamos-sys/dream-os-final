name: Deploy All Edge Functions
on:
  push:
    branches: [gh-pages, main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-edges.yml'
  workflow_dispatch:  # manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: gbigjdhifispatrrskgh
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy all functions
        run: |
          echo "🚀 Deploying all Edge Functions..."
          for fn in supabase/functions/*/; do
            fn_name=$(basename "$fn")
            echo "📦 Deploying: $fn_name"
            supabase functions deploy "$fn_name" --no-verify-jwt || echo "⚠️ Failed: $fn_name"
          done
          echo "✅ All functions deployed"

      - name: List functions (non-fatal)
        run: supabase functions list --project-ref "$SUPABASE_PROJECT_ID" || true
