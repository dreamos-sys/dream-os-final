name: Dream OS CI
on:
  push:
    branches: [gh-pages]
  pull_request:

jobs:
  syntax-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract inline JS (skip ld+json/template)
        run: |
          mkdir -p /tmp/js
          python3 - << 'PY'
          import re
          from pathlib import Path
          JS_TYPES = ('', 'text/javascript', 'application/javascript', 'module')
          files=['index.html']+[str(p) for p in sorted(Path('modules').glob('*.html'))]
          n=0
          for f in files:
              t=Path(f).read_text(encoding='utf-8',errors='replace')
              for i,m in enumerate(re.finditer(r'<script([^>]*)>(.*?)</script>', t, re.S)):
                  attrs, body = m.group(1), m.group(2)
                  if 'src=' in attrs: continue
                  tm = re.search(r'type=["\']?([^"\'\s>]+)', attrs)
                  if tm and tm.group(1) not in JS_TYPES: continue
                  (Path('/tmp/js') / (f.replace('/','_')+('_%d.js'%i))).write_text(body, encoding='utf-8')
                  n+=1
          print('extracted',n,'inline JS (non-JS skipped)')
          PY

      - name: Node syntax check all inline JS
        run: |
          fail=0
          for f in /tmp/js/*.js; do
            node --check "$f" >/dev/null 2>&1 || { echo "SYNTAX FAIL: $f"; fail=1; }
          done
          [ $fail -eq 0 ] && echo "ALL INLINE JS SYNTAX OK" || exit 1

      - name: CSS brace balance
        run: |
          python3 - << 'PY'
          from pathlib import Path
          c=Path('css/dashboard.css').read_text(encoding='utf-8')
          o,cl=c.count('{'),c.count('}')
          print('braces:',o,cl)
          assert o==cl, 'CSS braces unbalanced'
          print('CSS BALANCED')
          PY
