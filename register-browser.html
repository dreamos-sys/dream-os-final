<!DOCTYPE html>
<html>
<head>
    <title>Register Browser - Dream OS</title>
    <style>
        body { font-family: monospace; padding: 2rem; background: #0a0e27; color: #00ff9d; text-align: center; }
        button { padding: 1rem 2rem; background: #10b981; color: white; border: none; border-radius: 12px; font-size: 1rem; cursor: pointer; margin: 1rem; }
        #result { margin-top: 1rem; padding: 1rem; background: rgba(0,0,0,0.3); border-radius: 12px; }
    </style>
</head>
<body>
    <h1>📱 Register Browser</h1>
    <p>Klik tombol di bawah untuk mendaftarkan browser ini:</p>
    <button onclick="register()">🔗 Register This Browser</button>
    <div id="result"></div>
    
    <script>
    async function register() {
        var c = document.createElement('canvas');
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#f60';
        ctx.fillRect(125,1,62,20);
        var metrics = [navigator.hardwareConcurrency||0, screen.colorDepth, c.toDataURL()].join('|');
        var hashBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(metrics));
        var dna = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2,'0')).join('').substring(0,32);
        
        var users = JSON.parse(localStorage.getItem('dreamos_users_db') || '[]');
        var admin = users.find(u => u.role === 'dev');
        
        if (admin) {
            if (!admin.device_dna_list) admin.device_dna_list = [];
            if (admin.device_dna && !admin.device_dna_list.includes(admin.device_dna)) {
                admin.device_dna_list.push(admin.device_dna);
            }
            if (!admin.device_dna_list.includes(dna)) {
                admin.device_dna_list.push(dna);
            }
            localStorage.setItem('dreamos_users_db', JSON.stringify(users));
            
            document.getElementById('result').innerHTML = 
                '<h3>✅ Browser Terdaftar!</h3>' +
                '<p>DNA: ' + dna.substring(0,16) + '...</p>' +
                '<p style="color:#10b981;">Sekarang Anda bisa login dari browser ini!</p>' +
                '<p><a href="index.html" style="color:#0ea5e9;">🔐 Buka Dream OS</a></p>';
        }
    }
    </script>
</body>
</html>
