    <style>
        :root { --bg: #020617; --text: #e2e8f0; --accent: #0ea5e9; --panel: #1e293b; }
        body { background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; margin:0; }
        canvas#star-field { position:fixed; inset:0; z-index:-1; width:100%; height:100%; }
        #login-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; }

        .card { background:var(--panel); padding:1rem; border-radius:1rem; text-align:center; cursor:pointer; }
        nav { position:fixed; bottom:0; left:0; right:0; background:#0f172a; display:none; height:60px; }
        nav button { flex:1; background:none; border:none; color:#94a3b8; font-size:0.7rem; }

    <script>
        // ========== BINTANG ==========
        (function() {
            var c = document.getElementById('star-field');
            if (!c) return;
            var ctx = c.getContext('2d'), stars = [], w, h;
            function resize() { w = c.width = window.innerWidth; h = c.height = window.innerHeight; }
            function init() { resize(); stars = []; for (var i = 0; i < 120; i++) stars.push({ x: Math.random()*w, y: Math.random()*h, r: Math.random()*1.5, v: Math.random()*0.3 }); }
            function draw() { ctx.fillStyle = '#020617'; ctx.fillRect(0,0,w,h); ctx.fillStyle = 'rgba(255,255,255,0.5)'; for (var i = 0; i < stars.length; i++) { var p = stars[i]; p.y -= p.v; if (p.y < 0) p.y = h; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill(); } requestAnimationFrame(draw); }
            window.addEventListener('resize', function() { resize(); init(); });
            init(); draw();
        })();

        function debug(msg) {
            var el = document.getElementById('debug-log');
            if (el) { el.style.display = 'block'; el.innerHTML += '<div>' + msg + '</div>'; el.scrollTop = el.scrollHeight; }
        }

        function sha256(str) {
            return CryptoJS.SHA256(str).toString();
        }

        function getUsers() { try { return JSON.parse(localStorage.getItem('dreamos_users_db') || '[]'); } catch(e) { return []; } }
        function saveUsers(users) { localStorage.setItem('dreamos_users_db', JSON.stringify(users)); }

        // ========== DATA VIP (PASSWORD LANGSUNG) ==========
        var VIP = {
            'dreamos.sch.id@gmail.com': { pass: 'b15m1ll4h_012443410', role: 'dev', name: 'Sultan Architect' },
            'vespaexcelhijaucedar@gmail.com': { pass: '4dm1n_k002d', role: 'kabag', name: 'Bpk. Hanung' },
            'erwinsyah1679@gmail.com': { pass: '4dm1n_k002d', role: 'koord', name: 'Bpk. Erwinsyah' }
        };

        // ========== LOGIN ==========
        window.authenticate = function() {
            var email = document.getElementById('email').value.trim().toLowerCase();
            var pass = document.getElementById('pass').value;
            var msg = document.getElementById('msg');
            msg.innerText = '';

            if (!email || !pass) { msg.innerText = '⚠️ Isi email dan password'; return; }

            // 1. VIP: password langsung (tanpa hash)
            if (VIP[email] && VIP[email].pass === pass) {
                enterSystem(VIP[email].role, VIP[email].name, email);
                return;
            }

            // 2. User biasa: cek hash
            var users = getUsers();
            var hash = sha256(pass + 'dreamos_salt_2026');
            var user = users.find(function(u) { return u.email === email && u.password_hash === hash; });
            if (user) {
                enterSystem(user.role, user.nama || email.split('@')[0], email);
                return;
            }

            msg.innerText = '⛔ Email atau password salah';
        };

        // ========== REGISTRASI (USER BIASA) ==========
        window.registerUser = function() {
            var email = document.getElementById('email').value.trim().toLowerCase();
            var pass = document.getElementById('pass').value;
            var msg = document.getElementById('msg');
            if (!email || !pass) { msg.innerText = '⚠️ Isi email dan password'; return; }

            // Cegah VIP mendaftar ulang
            if (VIP[email]) { msg.innerText = '⚠️ Email ini khusus VIP, tidak bisa didaftarkan ulang.'; return; }

            var users = getUsers();
            var hash = sha256(pass + 'dreamos_salt_2026');

            var existing = users.find(function(u) { return u.email === email; });
            if (existing) {
                existing.password_hash = hash;
                msg.innerText = '✅ Password diperbarui!';
            } else {
                users.push({ email: email, password_hash: hash, nama: email.split('@')[0], role: 'staff' });
                msg.innerText = '✅ Registrasi berhasil! Silakan login.';
            }
            saveUsers(users);
        };

        function enterSystem(role, name, email) {
            localStorage.setItem('dreamos_bound_user', JSON.stringify({ role: role, name: name, email: email }));
            localStorage.setItem('dreamos_session_active', 'true');
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('bottom-nav').style.display = 'flex';
            document.getElementById('user-info').innerText = name + ' (' + role + ')';
            renderModules();
            startClock();
        }

        function renderModules() {
            var mods = ['CMD','Security','K3','Jan Indoor','Jan Outdoor','Booking','Asset','Stok','Maintenance','Dana'];
            var grid = document.getElementById('mod-grid');
            grid.innerHTML = mods.map(function(m) { return '<div class="card">' + m + '</div>'; }).join('');
        }

        function startClock() {
            var el = document.getElementById('live-clock');
            function tick() { el.textContent = new Date().toLocaleTimeString('id-ID'); }
            tick(); setInterval(tick, 1000);
        }

        var taps = 0;
        window.tapLogo = function(e) {
            e.stopPropagation();
            taps++;
            if (taps >= 7) { taps = 0; window.open('modules/4s-ghost.html', '_blank'); }
            setTimeout(function() { taps = 0; }, 2000);
        };
    </script>
