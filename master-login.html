<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Key Login • Dream OS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0a0e27;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(0, 255, 157, 0.3);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 0 50px rgba(0, 255, 157, 0.2);
        }
        h1 { color: #00ff9d; margin-bottom: 0.5rem; font-size: 1.5rem; }
        .arabic { font-family: 'Amiri', serif; font-size: 1.8rem; color: #00ff9d; margin-bottom: 1rem; }
        .shalawat { font-family: 'Amiri', serif; font-size: 0.9rem; color: #0ea5e9; margin-bottom: 2rem; }
        .input-wrapper { position: relative; margin-bottom: 1rem; }
        input {
            width: 100%;
            padding: 1rem 3rem 1rem 1rem;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(0, 255, 157, 0.3);
            border-radius: 16px;
            color: #00ff9d;
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-align: center;
            outline: none;
        }
        .toggle-pin {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 1.5rem;
        }
        button {
            width: 100%;
            padding: 1rem;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 0.5rem;
            box-shadow: 0 4px 25px rgba(16, 185, 129, 0.4);
        }
        .error { color: #ef4444; font-size: 0.9rem; margin-top: 1rem; display: none; }
        .success { color: #10b981; font-size: 0.9rem; margin-top: 1rem; display: none; }
        .bypass-info {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 12px;
            font-size: 0.75rem;
            color: #f59e0b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="arabic">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم</div>
        <div class="shalawat">اَللّٰهُمَّ صَلِّ عَلٰى سَيِّدِنَا مُحَمَّدٍ</div>
        
        <h1>🔑 MASTER KEY LOGIN</h1>
        <p style="color:#94a3b8; font-size:0.8rem; margin-bottom:1.5rem;">No Device Check • Direct Access</p>
        
        <div class="input-wrapper">
            <input type="password" id="pin" placeholder="MASTER PIN" onkeypress="if(event.key==='Enter')login()">
            <span class="toggle-pin" onclick="togglePin()">👁️</span>
        </div>
        
        <button onclick="login()">🔓 ACCESS CORE (BYPASS)</button>
        
        <div class="error" id="error-msg"></div>
        <div class="success" id="success-msg"></div>
        
        <div class="bypass-info">
            ⚠️ <strong>MASTER KEY MODE</strong><br>
            • Login TANPA device check<br>
            • Login TANPA DNA verification<br>
            • Hanya untuk Developer<br>
            • Jangan share halaman ini!
        </div>
    </div>

    <script>
        const MASTER_PIN = 'b15m1ll4h_012443410';
        const DEV_PASSWORD_HASH = 'ec363f85aa74ef12cb507cbaaf199eeb13723b121780f0cfc257d1abb1796ece';
        
        function togglePin() {
            const input = document.getElementById('pin');
            const icon = document.querySelector('.toggle-pin');
            input.type = input.type === 'password' ? 'text' : 'password';
            icon.textContent = input.type === 'password' ? '👁️' : '🙈';
        }
        
        function login() {
            const pin = document.getElementById('pin').value;
            const errorEl = document.getElementById('error-msg');
            const successEl = document.getElementById('success-msg');
            
            errorEl.style.display = 'none';
            successEl.style.display = 'none';
            
            if (pin !== MASTER_PIN) {
                errorEl.textContent = '⛔ MASTER PIN SALAH!';
                errorEl.style.display = 'block';
                return;
            }
            
            // GENERATE DNA UNTUK BROWSER INI
            (async function() {
                var c = document.createElement('canvas');
                var ctx = c.getContext('2d');
                ctx.fillStyle = '#f60';
                ctx.fillRect(125, 1, 62, 20);
                var metrics = [navigator.hardwareConcurrency || 0, screen.colorDepth, c.toDataURL()].join('|');
                var hashBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(metrics));
                var dna = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('').substring(0, 32);
                
                // RESET & SETUP
                localStorage.clear();
                
                // Setup users_db
                var users = [{
                    nama: 'Developer',
                    email: 'dreamos.sch.id@gmail.com',
                    role: 'dev',
                    password_hash: DEV_PASSWORD_HASH,
                    device_dna: dna,
                    device_dna_list: [dna],
                    phone: '',
                    department: 'IT Development',
                    created_at: new Date().toISOString()
                }];
                localStorage.setItem('dreamos_users_db', JSON.stringify(users));
                
                // Setup session
                var devUser = {
                    nama: 'Developer',
                    email: 'dreamos.sch.id@gmail.com',
                    role: 'dev',
                    device_dna: dna,
                    device_dna_list: [dna]
                };
                localStorage.setItem('dreamos_bound_user', JSON.stringify(devUser));
                localStorage.setItem('dreamos_session_active', 'true');
                
                // Setup empty data
                var emptyArrays = ['dreamos_dana', 'dreamos_k3_reports', 'dreamos_maintenance_tasks', 
                                   'dreamos_bookings', 'dreamos_stok', 'dreamos_assets', 'dreamos_audit_logs'];
                emptyArrays.forEach(function(key) {
                    localStorage.setItem(key, '[]');
                });
                
                localStorage.setItem('dreamos_budget_cap', '50000000');
                localStorage.setItem('dreamos_slide_5', 'Selamat datang di Dream OS!');
                localStorage.setItem('dreamos_slide_6', 'Semoga hari ini produktif.');
                localStorage.setItem('dreamos_slide_7', 'The Power Soul Of Shalawat!');
                localStorage.setItem('dreamos_sec_today', '🛡️ Petugas Siaga');
                localStorage.setItem('dreamos_executive_note', '');
                localStorage.setItem('dreamos_settings', JSON.stringify({
                    theme: 'dark', fontSize: 100, highContrast: false,
                    reduceMotion: false, starfield: true, glassIntensity: 70, lang: 'id'
                }));
                
                successEl.innerHTML = '✅ BERHASIL! DNA: ' + dna.substring(0,16) + '...<br>Mengalihkan ke dashboard...';
                successEl.style.display = 'block';
                
                // Redirect ke index.html
                setTimeout(function() {
                    window.location.href = 'index.html';
                }, 2000);
            })();
        }
    </script>
</body>
</html>
