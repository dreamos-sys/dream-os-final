    el.className = 'badge'; try { const d = new Date(); const res = await fetch(`https://api.aladhan.com/v1/timings/${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}?latitude=-6.2088&longitude=106.8456&method=20`); const data = await res.json(); if (data.code === 200) { const t = data.data.timings; el.innerHTML = `🕌 Subuh ${t.Fajr} | Dzuhur ${t.Dhuhr} | Ashar ${t.Asr} | Maghrib ${t.Maghrib} | Isya ${t.Isha}`; } } catch(e) { el.textContent = '🕌 Gagal memuat.'; } }

async function showSlides() {
    const track = document.getElementById('dream-slide-track');
    const dotsContainer = document.getElementById('slide-dots');
    if (!track || !dotsContainer) return;

    const slides = [
        '🕌 Assalamualaikum, selamat datang.',
        '📅 Booking: Memuat data...',
        '⚠️ K3 & Progres: Memuat data...',
        '☁️ Cuaca: Memuat...',
        localStorage.getItem('dreamos_slide_5') || '📢 Pengumuman Manajemen: Belum ada.',
        localStorage.getItem('dreamos_slide_6') || '🏢 Info Bagian Umum: Belum ada.',
        localStorage.getItem('dreamos_slide_7') || '💚 Terima kasih untuk seluruh tim!'
    ];

    track.innerHTML = slides.map(s => '<div class="dream-slide">' + s.replace(/\n/g, '<br>') + '</div>').join('');
    dotsContainer.innerHTML = slides.map((_, i) => `<span class="dot${i === 0 ? ' active' : ''}" onclick="goToSlide(${i})"></span>`).join('');

    window.goToSlide = function(idx) {
        window.slideIdx = idx;
        track.style.transform = `translateX(-${idx * 100}%)`;
        document.querySelectorAll('#slide-dots .dot').forEach((d, i) => d.classList.toggle('active', i === idx));
    };

    if (slideInterval) clearInterval(slideInterval);
    slideInterval = setInterval(() => { window.slideIdx = (window.slideIdx + 1) % slides.length; window.goToSlide(window.slideIdx); }, 7000);
}

window.openMod = function(id) {
    if (!window.canAccess(id)) return alert('⛔ Akses Ditolak.');
    const map = { cmd: 'commandcenter.html', sec: 'security.html', k3: 'k3.html', in: 'janitor-indoor.html', out: 'janitor-outdoor.html', maint: 'maintenance.html', book: 'booking.html', stok: 'stok.html', asset: 'asset.html', profile: 'profile.html', qr: 'qr.html', about: 'about.html', setting: 'setting.html' };
    const m = map[id];
    if (!m) return alert('Unknown module');
    let container = document.getElementById('mod-container');
    if (!container) { container = document.createElement('div'); container.id = 'mod-container'; container.style.cssText = 'position:fixed;inset:0;z-index:9995;overflow-y:auto;background:rgba(4,8,20,0.95);backdrop-filter:blur(20px);padding-bottom:5rem;'; document.body.appendChild(container); }
    container.style.display = 'block';
    container.innerHTML = '<div style="text-align:center;padding:3rem;color:#94a3b8;">⏳ Loading...</div>';
    fetch(`modules/${m}?v=${Date.now()}`)
        .then(r => r.ok ? r.text() : Promise.reject('HTTP ' + r.status))
        .then(html => { container.innerHTML = html; container.querySelectorAll('script').forEach(s => { const ns = document.createElement('script'); ns.textContent = s.textContent; document.body.appendChild(ns); }); })
        .catch(err => { container.innerHTML = `<div style="color:#ef4444;padding:4rem;text-align:center;"><h3>⚠️ Failed</h3><p>${err}</p><button onclick="goHome()">Back</button></div>`; });
};

(function() {
    const canvas = document.getElementById('star-field');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let stars = [], anim;
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize(); window.addEventListener('resize', resize);
    function createStars() { stars = []; for (let i = 0; i < (canvas.width * canvas.height) / 2000; i++) stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: Math.random() * 1.5, speed: 0.02 + Math.random() * 0.05 }); }
    createStars(); window.addEventListener('resize', createStars);
    function animate() { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = '#e2e8f0'; for (let s of stars) { ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill(); s.y += s.speed; if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; } } anim = requestAnimationFrame(animate); }
    animate(); window.addEventListener('beforeunload', () => cancelAnimationFrame(anim));
})();

// ========== RETRY QUEUE ENGINE (Exponential Backoff) ==========
window.retryQueue = [];
window.isProcessingQueue = false;

window.addToRetryQueue = function(action) {
  window.retryQueue.push({ ...action, retries: 0, nextRetry: Date.now() + 1000 });
  if (!window.isProcessingQueue) processRetryQueue();
};

async function processRetryQueue() {
  if (window.retryQueue.length === 0) {
    window.isProcessingQueue = false;
    return;
  }
  window.isProcessingQueue = true;
  
  const now = Date.now();
  const action = window.retryQueue.find(a => a.nextRetry <= now);
  
  if (!action) {
    setTimeout(processRetryQueue, 500); // cek lagi nanti
    return;
  }
  
  try {
    const result = await action.fn();
    if (result && result.error) throw result.error;
    // Sukses, hapus dari queue
    window.retryQueue = window.retryQueue.filter(a => a !== action);
    console.log('✅ Retry sukses:', action.label);
    if (action.onSuccess) action.onSuccess();
  } catch(e) {
    action.retries++;
    if (action.retries > 5) {
      console.warn('❌ Retry gagal setelah 5x:', action.label);
      window.retryQueue = window.retryQueue.filter(a => a !== action);
      if (action.onFail) action.onFail();
    } else {
      // Exponential backoff: 1s, 2s, 4s, 8s, 16s
      action.nextRetry = now + Math.pow(2, action.retries) * 1000;
      console.log('🔄 Retry #' + action.retries + ' untuk ' + action.label + ' dalam ' + Math.pow(2, action.retries) + 's');
    }
  }
  
  setTimeout(processRetryQueue, 500);
}

// ========== OPTIMISTIC UI HELPER ==========
window.optimisticSave = function(key, data, supabaseFn, label) {
  // 1. Simpan ke localStorage dulu (instan)
  var existing = JSON.parse(localStorage.getItem(key) || '[]');
  existing.push(data);
  localStorage.setItem(key, JSON.stringify(existing));
  
  // 2. Update UI langsung (tanpa nunggu server)
  if (typeof refreshUI === 'function') refreshUI();
  
  // 3. Coba kirim ke Supabase
  supabaseFn().then(function(res) {
    if (res.error) {
      // Gagal, masukkan ke retry queue
      window.addToRetryQueue({
        label: label,
        fn: supabaseFn,
        onSuccess: function() { console.log('✅ ' + label + ' tersimpan'); },
        onFail: function() { console.warn('⚠️ ' + label + ' gagal tersimpan'); }
      });
    }
  }).catch(function() {
    window.addToRetryQueue({
      label: label,
      fn: supabaseFn,
      onSuccess: function() { console.log('✅ ' + label + ' tersimpan'); },
      onFail: function() { console.warn('⚠️ ' + label + ' gagal tersimpan'); }
    });
  });
};


// ========== AUDIT LOGGER TERPUSAT ==========
window.auditLog = async function(action, details) {
  var user = JSON.parse(localStorage.getItem('dreamos_bound_user') || '{}');
  var entry = {
    user_id: user.id || 'unknown',
    email: user.email || 'unknown',
    action: action,
    details: details || '',
    timestamp: new Date().toISOString()
  };
  
  // 1. Simpan ke localStorage (offline-first)
  var logs = JSON.parse(localStorage.getItem('dreamos_audit_logs') || '[]');
  logs.unshift(entry);
  if (logs.length > 100) logs.pop();
  localStorage.setItem('dreamos_audit_logs', JSON.stringify(logs));
  
  // 2. Kirim ke Supabase (background)
  try {
    await window.supabase.from('audit_logs').insert({
      user_id: entry.user_id,
      action: entry.action,
      details: entry.details
    });
  } catch(e) {
    // Gagal kirim ke cloud, tetap tersimpan di localStorage
    console.warn('Audit cloud sync failed, saved locally.');
  }
};
