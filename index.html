    <style>
        body { background:#020617; color:#e2e8f0; font-family:Inter,sans-serif; margin:0; }
        #login-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; background:radial-gradient(circle at 30% 30%, #1a1f3a, #0a0e27); }
        .login-box { width:90%; max-width:400px; text-align:center; }
        .logo { width:80px; border-radius:20px; margin-bottom:1rem; }
        input { width:100%; padding:0.8rem; margin:0.5rem 0; background:#0f172a; border:1px solid #2dd4bf; border-radius:0.5rem; color:#00ff9d; font-family:Orbitron,monospace; }
        button { width:100%; padding:0.8rem; background:#0ea5e9; color:#fff; border:none; border-radius:0.5rem; font-weight:bold; cursor:pointer; margin-top:0.3rem; }
        #debug-log { background:#000; color:#0f0; font-size:0.7rem; padding:0.5rem; margin-top:1rem; text-align:left; max-height:150px; overflow-y:auto; display:none; }

<body>
    <div id="login-screen">
        <div class="login-box">
            <img src="assets/logo-sultan.png" class="logo" id="logo-main" onclick="tapLogo(event)">
            <h2 style="color:#00ff9d;">Dream OS Debug</h2>
            <input type="email" id="login-email" placeholder="EMAIL">
            <input type="password" id="login-pass" placeholder="PASSWORD">
            <button onclick="authenticate()">🔐 LOGIN</button>
            <!-- Tombol darurat untuk developer: registrasi user baru -->
            <button class="reg-btn" onclick="registerUser()" style="margin-top:1rem;">⚡ DAFTAR (Developer Only)</button>
            <div id="debug-log"></div>
        </div>
    </div>
    <div id="main-app">
        <h1>Selamat Datang</h1>
        <p id="user-info"></p>
        <button onclick="location.reload()">Logout</button>
    </div>

    <script>
        function debug(msg) {
            var el = document.getElementById('debug-log');
            el.style.display = 'block';
            el.innerHTML += '<div>' + msg + '</div>';
            el.scrollTop = el.scrollHeight;
        }

        // Fungsi hash (fallback jika crypto.subtle gagal)
        async function simpleHash(pin) {
            try {
                var enc = new TextEncoder();
                var data = enc.encode(pin + 'dreamos_salt_2026');
                var hashBuffer = await crypto.subtle.digest('SHA-256', data);
                return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2,'0')).join('');
            } catch(e) {
                debug('crypto error: ' + e.message);
                // Fallback untuk TWA
                return btoa(pin + 'dreamos_salt_2026').replace(/[^a-f0-9]/g,'').substring(0,64);
            }
        }

        // Fungsi login
        window.authenticate = async function() {
            var email = document.getElementById('login-email').value.trim().toLowerCase();
            var pass = document.getElementById('login-pass').value;
            debug('Login: ' + email);

            if (!email || !pass) {
                debug('Email/password kosong');
                return;
            }

            var inputHash = await simpleHash(pass);
            debug('Hash: ' + inputHash.substring(0,20) + '...');

            // VIP
            if (email === 'dreamos.sch.id@gmail.com' && inputHash === 'ec363f85aa74ef12cb507cbaaf199eeb13723b121780f0cfc257d1abb1796ece') {
                enterSystem('dev', 'Sultan Architect');
                return;
            }
            if (email === 'vespaexcelhijaucedar@gmail.com' && inputHash === '5801493feae83f710df042ff0df63758e03b27a4212725dbe07d0227b85d6de5') {
                enterSystem('kabag', 'Bpk. Hanung');
                return;
            }
            if (email === 'erwinsyah1679@gmail.com' && inputHash === '9961bf59f61d19e50c2032a05de3a5db1a375494e4c098dbaf49a071bca0e288') {
                enterSystem('koord', 'Bpk. Erwinsyah');
                return;
            }

            // Cek database lokal
            var users = JSON.parse(localStorage.getItem('dreamos_users_db') || '[]');
            var user = users.find(u => u.email === email && u.password_hash === inputHash);

            if (user) {
                enterSystem(user.role, user.nama, email);
                return;
            }

            debug('User tidak ditemukan');
        };

        // Fungsi pendaftaran darurat (hanya untuk developer)
        window.registerUser = async function() {
            var email = document.getElementById('login-email').value.trim().toLowerCase();
            var pass = document.getElementById('login-pass').value;

            if (!email || !pass) {
                debug('Isi email dan password untuk daftar');
                return;
            }

            var hash = await simpleHash(pass);
            var users = JSON.parse(localStorage.getItem('dreamos_users_db') || '[]');

            // Cek apakah email sudah ada
            if (users.some(u => u.email === email)) {
                // Update password
                users = users.map(u => u.email === email ? {...u, password_hash: hash} : u);
                debug('Password diperbarui untuk ' + email);
            } else {
                // Tambah user baru
                users.push({
                    email: email,
                    password_hash: hash,
                    nama: email.split('@')[0],
                    role: 'koord', // Bisa disesuaikan
                    device_dna: ''
                });
                debug('User baru ditambahkan: ' + email);
            }

            localStorage.setItem('dreamos_users_db', JSON.stringify(users));
            debug('✅ Registrasi berhasil! Silakan login dengan password yang sama.');
        };

        function enterSystem(role, name, email) {
            localStorage.setItem('dreamos_bound_user', JSON.stringify({role: role, name: name, email: email}));
            localStorage.setItem('dreamos_session_active', 'true');
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('user-info').textContent = name + ' (' + role + ')';
            debug('Login sukses: ' + name);
        }

        // Tap logo 7x untuk 4S Ghost
        var taps = 0;
        window.tapLogo = function(e) {
            e.stopPropagation();
            taps++;
            if (taps >= 7) {
                taps = 0;
                debug('Membuka 4S Ghost...');
                window.open('modules/4s-ghost.html', '_blank');
            }
            setTimeout(function() { taps = 0; }, 2000);
        };
    </script>
</body>
</html>
