<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dream OS • v1.0 Final</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#020617">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;600;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <script src="js/config-supabase.js"></script>
    <script src="js/auto-sync.js"></script>
    <script src="js/auto-sync.js"></script>
    <style>
        :root { --bg-void: #020617; --text-main: #e2e8f0; --neon-accent: #0ea5e9; --neon-warning: #e11d48; --panel-bg: #1e293b; }
        body { margin:0; background:var(--bg-void); color:var(--text-main); font-family:'Inter',sans-serif; }
        #login-screen { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 30% 30%, #1a1f3a, #0a0e27); z-index:1000; }
        .login-content { width:100%; max-width:400px; padding:2rem; text-align:center; }
        .logo-img { width:90px; border-radius:1.2rem; margin:1rem 0; cursor:pointer; }
        .arabic { font-family:'Amiri',serif; color:#00ff9d; font-size:1.8rem; font-weight:800; }
        .login-input { width:100%; padding:1rem; margin-bottom:1rem; background:#0f172a; border:1px solid #2dd4bf; border-radius:0.5rem; color:#00ff9d; font-family:'Orbitron',monospace; text-align:center; }
        .btn-login { width:100%; padding:1rem; background:#0ea5e9; color:#fff; border:none; border-radius:0.5rem; font-weight:700; cursor:pointer; }
        .lockout-msg { color:var(--neon-warning); font-size:0.8rem; margin-top:10px; display:none; }
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="login-content">
            <img src="assets/logo-sultan.png" class="logo-img" id="logo-main" onclick="tapLogo(event)">
            <div class="arabic">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم</div>
            <div class="arabic" style="font-size:1.2rem; color:#0ea5e9;">اَللّٰهُمَّ صَلِّ عَلٰى سَيِّدِنَا مُحَمَّدٍ</div>
            <input type="email" id="login-email" class="login-input" placeholder="EMAIL AKSES">
            <input type="password" id="login-pass" class="login-input" placeholder="PASSWORD">
            <button class="btn-login" onclick="authenticate()">🔐 ACCESS CORE</button>
            <div class="lockout-msg" id="lock-msg"></div>
        </div>
    </div>
    <div id="main-app" style="display:none;">
        <div id="dashboard-container"></div>
    </div>

    <script>
        // ========== SINGLE AUTHENTICATE ==========
        let attempts = 0;
        const DEV_EMAIL = "dreamos.sch.id@gmail.com";
        const DEV_HASH = "ec363f85aa74ef12cb507cbaaf199eeb13723b121780f0cfc257d1abb1796ece";
        const KABAG_EMAIL = "vespaexcelhijaucedar@gmail.com";
        const KABAG_HASH = "5801493feae83f710df042ff0df63758e03b27a4212725dbe07d0227b85d6de5";
        const KOORD_EMAIL = "erwinsyah1679@gmail.com";
        const KOORD_HASH = "9961bf59f61d19e50c2032a05de3a5db1a375494e4c098dbaf49a071bca0e288";

        async function hashPin(pin) {
            const enc = new TextEncoder();
            const hash = await crypto.subtle.digest('SHA-256', enc.encode(pin + 'dreamos_salt_2026'));
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        window.authenticate = async function() {
            const email = document.getElementById('login-email').value.trim().toLowerCase();
            const pass = document.getElementById('login-pass').value;
            const msg = document.getElementById('lock-msg');
            if (!email || !pass) {
                msg.innerText = '⚠️ Email dan Password wajib diisi!';
                msg.style.display = 'block';
                return;
            }
            const inputHash = await hashPin(pass);

            // VIP Bypass
            if (email === DEV_EMAIL && inputHash === DEV_HASH) { enterSystem('dev', 'Sultan Architect', email); return; }
            if (email === KABAG_EMAIL && inputHash === KABAG_HASH) { enterSystem('kabag', 'Bpk. Hanung', email); return; }
            if (email === KOORD_EMAIL && inputHash === KOORD_HASH) { enterSystem('koord', 'Bpk. Erwinsyah', email); return; }

            const users = JSON.parse(localStorage.getItem('dreamos_users_db') || '[]');
            const user = users.find(u => u.email === email && u.password_hash === inputHash);

            if (!user) {
                msg.innerText = '⛔ Email atau Password salah!';
                msg.style.display = 'block';
                return;
            }

            if (['dev', 'kabag', 'koord'].includes(user.role)) {
                enterSystem(user.role, user.nama, user.email);
                return;
            }

            // Staff tanpa GPS sementara (biar mudah login)
            enterSystem(user.role, user.nama, user.email);
        };

        function enterSystem(role, name, email) {
            localStorage.setItem('dreamos_bound_user', JSON.stringify({ role, name, email }));
            localStorage.setItem('dreamos_session_active', 'true');
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('dashboard-container').innerHTML = `<h2>Selamat Datang, ${name} (${role})</h2>`;
        }

        window.tapLogo = function(e) {
            e.stopPropagation();
            let taps = parseInt(localStorage.getItem('taps') || '0');
            taps++;
            localStorage.setItem('taps', taps);
            if (taps >= 7) {
                localStorage.setItem('taps', '0');
                const pin = prompt('🔐 4S DevOps PIN:');
                if (pin === '4s_ghost_2026') {
                    document.getElementById('login-screen').style.display = 'none';
                    window.openMod('4s-ghost');
                } else alert('PIN salah');
            }
            setTimeout(() => localStorage.setItem('taps', '0'), 2000);
        };
    </script>
</body>
</html>
