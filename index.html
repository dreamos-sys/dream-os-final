    <script>
    // ========== BINTANG-BINTANG ==========
    (function() {
        var canvas = document.getElementById('star-field');
        if (!canvas) return;
        var ctx = canvas.getContext('2d');
        var stars = [];
        var w, h;

        function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
        function init() { resize(); stars = []; for (var i = 0; i < 120; i++) { stars.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.5, v: Math.random() * 0.3 }); } }
        function draw() { ctx.fillStyle = '#020617'; ctx.fillRect(0, 0, w, h); ctx.fillStyle = 'rgba(255,255,255,0.5)'; for (var i = 0; i < stars.length; i++) { var p = stars[i]; p.y -= p.v; if (p.y < 0) p.y = h; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); } requestAnimationFrame(draw); }
        window.addEventListener('resize', function() { resize(); init(); });
        init(); draw();
    })();

    // ========== GLOBAL FUNCTIONS ==========
    window.togglePass = function() { var x = document.getElementById('login-pass'); x.type = (x.type === 'password') ? 'text' : 'password'; };
    window.wipeAllCache = function() { if (confirm('Hapus SEMUA data lokal?')) { localStorage.clear(); document.cookie.split(';').forEach(function(c) { document.cookie = c.trim().split('=')[0] + '=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/'; }); location.reload(); } };
    function debug(msg) { var el = document.getElementById('debug-log'); if(el){ el.style.display = 'block'; el.innerHTML += '<div>' + msg + '</div>'; el.scrollTop = el.scrollHeight; } }

    // ========== HASH & LOGIN ==========
    let attempts=0, taps=0, tapTimer, slideInterval; window.slideIdx=0;
    const DEV_EMAIL = "dreamos.sch.id@gmail.com", DEV_HASH = "ec363f85aa74ef12cb507cbaaf199eeb13723b121780f0cfc257d1abb1796ece";
    const KABAG_EMAIL = "vespaexcelhijaucedar@gmail.com", KABAG_HASH = "5801493feae83f710df042ff0df63758e03b27a4212725dbe07d0227b85d6de5";
    const KOORD_EMAIL = "erwinsyah1679@gmail.com", KOORD_HASH = "9961bf59f61d19e50c2032a05de3a5db1a375494e4c098dbaf49a071bca0e288";

    async function hashPin(pin) {
        try {
            const enc = new TextEncoder();
            const hash = await crypto.subtle.digest('SHA-256', enc.encode(pin + 'dreamos_salt_2026'));
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        } catch(e) { return btoa(pin + 'dreamos_salt_2026').replace(/[^a-f0-9]/g,'').substring(0,64); }
    }

    window.authenticate = async function() {
        var email = document.getElementById('login-email').value.trim().toLowerCase();
        var pass = document.getElementById('login-pass').value;
        var msg = document.getElementById('lock-msg');
        if (!email || !pass) { msg.innerText = '⚠️ Email dan Password wajib diisi!'; msg.style.display='block'; return; }
        var inputHash = await hashPin(pass);
        debug('Login attempt: ' + email);

        // VIP Bypass (NO GPS)
        if (email === DEV_EMAIL && inputHash === DEV_HASH) { enterSystem('dev', 'Sultan Architect', email); return; }
        if (email === KABAG_EMAIL && inputHash === KABAG_HASH) { enterSystem('kabag', 'Bpk. Hanung', email); return; }
        if (email === KOORD_EMAIL && inputHash === KOORD_HASH) { enterSystem('koord', 'Bpk. Erwinsyah', email); return; }

        let users = JSON.parse(localStorage.getItem('dreamos_users_db') || '[]');
        let user = users.find(u => u.email === email && u.password_hash === inputHash);

        if (!user) { msg.innerText = '⛔ Email atau Password salah!'; msg.style.color='#ef4444'; msg.style.display='block'; debug('User tidak ditemukan: ' + email); return; }

        if (['dev', 'kabag', 'koord'].includes(user.role)) { enterSystem(user.role, user.nama, user.email); return; }
        // Staff tanpa GPS sementara
        enterSystem(user.role, user.nama, user.email);
    };

    // Registrasi darurat
    window.registerUser = async function() {
        var email = document.getElementById('login-email').value.trim().toLowerCase();
        var pass = document.getElementById('login-pass').value;
        if (!email || !pass) { debug('Isi email dan password'); return; }
        var hash = await hashPin(pass);
        var users = JSON.parse(localStorage.getItem('dreamos_users_db') || '[]');
        if (users.some(u => u.email === email)) {
            users = users.map(u => u.email === email ? {...u, password_hash: hash} : u);
            debug('Password diperbarui untuk ' + email);
        } else {
            users.push({ email: email, password_hash: hash, nama: email.split('@')[0], role: 'staff', device_dna: '' });
            debug('User baru ditambahkan: ' + email);
        }
        localStorage.setItem('dreamos_users_db', JSON.stringify(users));
        debug('✅ Registrasi berhasil! Silakan login dengan password yang sama.');
    };

    function enterSystem(role, name, email) {
        window.currentRole = role;
        window.currentUser = { role, name, email };
        localStorage.setItem('dreamos_bound_user', JSON.stringify(window.currentUser));

        document.cookie = 'dreamos_user=' + encodeURIComponent(name) + ';path=/;max-age=86400';

        tapTimer = setTimeout(function() { taps = 0; }, 2000);
    };

    // ========== RBAC ==========
    window.ROLE_PERMISSIONS = {
        dev: ['cmd','sec','k3','in','out','book','asset','stok','maint','dana','profile','qr','about','setting','4s-ghost','core-ai'],
        kabag: ['cmd','sec','k3','in','out','book','asset','stok','maint','dana','profile','qr','about','setting','core-ai'],

    // ========== OPEN MODULE ==========
    window.openMod = function(id) {
        if (!window.canAccess(id)) { alert('⛔ Akses Ditolak!'); return; }
        var map = {
            book:['Booking','booking.html','booking-module'], k3:['K3','k3.html','k3-module'],
            in:['Jan Indoor','janitor-indoor.html','janitor-in-module'], out:['Jan Outdoor','janitor-outdoor.html','janitor-out-module'],
            maint:['Maintenance','maintenance.html','maintenance-module'], sec:['Security','security.html','security-module'],
            stok:['Stok','stok.html','stok-module'], asset:['Asset','asset.html','asset-module'],
            cmd:['CMD','commandcenter.html','cmd-module'], profile:['Profile','profile.html','profile-module'],
            qr:['QR','qr.html','qr-module'], about:['About','about.html','about-module'],
            setting:['Setting','setting.html','setting-module'], dana:['Dana','dana.html','dana-module'],
            '4s-ghost':['4S Ghost Hub','4s-ghost.html','ghost-hub-module'],
            'core-ai':['Core AI','core-ai.html','core-ai-module']
        };
        var m = map[id]; if (!m) return alert('Modul tidak dikenali: '+id);
        var c = document.getElementById(m[2]);
        if (!c) { c = document.createElement('div'); c.id = m[2]; c.style.cssText = 'position:fixed;inset:0;z-index:9995;overflow-y:auto;background:#040814;padding-bottom:5rem;'; document.body.appendChild(c); }
        c.style.display = 'block'; c.innerHTML = '<div style="text-align:center;padding:3rem;color:#94a3b8;">⏳ Memuat '+m[0]+'...</div>';
        fetch('modules/'+m[1]+'?v='+Date.now()).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text();}).then(html=>{c.innerHTML=html;var q=[];c.querySelectorAll('script').forEach(old=>{if(old.textContent)q.push(old.textContent);});setTimeout(()=>{q.forEach(src=>{try{var ns=document.createElement('script');ns.textContent=src;document.body.appendChild(ns);}catch(e){console.error('Script Error:',e.message);}});},120);}).catch(err=>{c.innerHTML='<div style="color:#ef4444;padding:4rem;text-align:center;"><h3>⚠️ Gagal</h3><p>'+err.message+'</p></div>';});
    };

    // ========== DASHBOARD ==========
    function safeGet(k, fb) { try { return JSON.parse(localStorage.getItem(k) || JSON.stringify(fb)); } catch(e) { return fb; } }
    async function checkWeatherAndNotify() {
        try { const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-6.4025&longitude=106.7942&current_weather=true'); const data = await res.json(); const code = data.current_weather.weathercode; const rainCodes = [51,53,55,61,63,65,80,81,82,95,96,99]; const isRaining = rainCodes.includes(code); localStorage.setItem('dreamos_weather_text', isRaining ? '🌧️ HUJAN (Waspada!)' : '☀️ CERAH / BERAWAN'); localStorage.setItem('dreamos_is_raining', isRaining); } catch(e) { localStorage.setItem('dreamos_weather_text', '🌤️ Tidak diketahui'); }
    }
    function updateSecuritySlideAuto() {
        var now = new Date(), yyyy = now.getFullYear(), mm = String(now.getMonth()+1).padStart(2,'0'), dd = now.getDate(), period = yyyy + '-' + mm;
        var m = safeGet('dreamos_matrix',[]); var todayShifts = m.filter(x => x.periode === period && parseInt(x.tgl) === dd);
        var pagi = todayShifts.filter(x => x.shift === 'L' || x.shift === 'P').map(x => x.nama); var malam = todayShifts.filter(x => x.shift === 'M').map(x => x.nama);
        if (!localStorage.getItem('dreamos_sec_today') || localStorage.getItem('dreamos_sec_date') !== now.toDateString()) { localStorage.setItem('dreamos_sec_today', "🛡️ SECURITY: " + (pagi.length ? pagi.join(", ") : "Libur") + (malam.length ? " | Malam: "+malam.join(", ") : "")); localStorage.setItem('dreamos_sec_date', now.toDateString()); }
    }
    window.showSlides = function() {
        var t = document.getElementById('dream-slide-track'); if (!t) return; if (slideInterval) clearInterval(slideInterval);
        var sec = localStorage.getItem('dreamos_sec_today') || 'Petugas Siaga';
        var todayStr = new Date().toISOString().split('T')[0]; var tomorrowDate = new Date(); tomorrowDate.setDate(tomorrowDate.getDate()+1); var tomorrowStr = tomorrowDate.toISOString().split('T')[0];
        var bookings = safeGet('dreamos_bookings',[]).filter(b => b.status === 'approved');
        var todayBookings = bookings.filter(b => b.tgl === todayStr), tomorrowBookings = bookings.filter(b => b.tgl === tomorrowStr);
        var todayTxt = todayBookings.length ? todayBookings.map(b => b.ruang+' ('+b.jam_mulai+'-'+b.jam_selesai+')').join(', ') : 'Kosong';
        var tomorrowTxt = tomorrowBookings.length ? tomorrowBookings.map(b => b.ruang+' ('+b.jam_mulai+'-'+b.jam_selesai+')').join(', ') : 'Kosong';
        var k3 = safeGet('dreamos_k3_reports',[]);
        var k3Pending = k3.filter(x=>x.status==='pending').length, k3Proses = k3.filter(x=>x.status==='Proses'||x.status==='proses').length, k3Selesai = k3.filter(x=>x.status==='Selesai'||x.status==='selesai'||x.status==='disposisi').length;
        var totalK3 = k3.length, k3Pct = totalK3 > 0 ? Math.round((k3Selesai/totalK3)*100) : 100;
        var weather = localStorage.getItem('dreamos_weather_text') || 'Memuat Cuaca...', isRaining = localStorage.getItem('dreamos_is_raining') === 'true';
        var s = [
            {t:'🕌 Selamat Datang', s:'Security: '+sec},
            {t:'📅 Booking (Hari & Besok)', s:'Hari: '+todayTxt+' | Besok: '+tomorrowTxt},
            {t:'⚠️ K3 Progress Laporan', s:'Total:'+totalK3+' | Pending:'+k3Pending+' | Proses:'+k3Proses+' | Selesai:'+k3Selesai+' ('+k3Pct+'%)'},
            {t:'🌦️ Cuaca Depok Hari Ini', s: weather + (isRaining ? ' | ⚠️ Booking Outdoor Hubungi Bpk. Erwinsyah!' : '')},
            {t:'🏛️ Slide 5: Info Manajemen', s: localStorage.getItem('dreamos_slide_5') || 'Tidak ada agenda Manajemen.'},
            {t:'📋 Slide 6: Info Bag. Umum', s: localStorage.getItem('dreamos_slide_6') || 'Tidak ada agenda Bagian Umum.'},
            {t:'🎉 Slide 7: Ucapan & Info', s: localStorage.getItem('dreamos_slide_7') || 'Selamat Bekerja! The Power Soul Of Shalawat!'}
        ];
        t.innerHTML = s.map(sl => '<div class="dream-slide">'+sl.t+'<br><small style="font-size:0.8rem;opacity:0.9;word-wrap:break-word;">'+sl.s+'</small></div>').join('');
        window.slideIdx = 0; slideInterval = setInterval(function() { if (!t.children.length) return; window.slideIdx = (window.slideIdx+1) % t.children.length; t.style.transform = 'translateX(-' + (window.slideIdx*100) + '%)'; }, 7000);
    };
    window.fetchPrayerTimes = function() {
        var el = document.getElementById('prayer-times-dash'); if (!el) return;
        function addIhtiyat(timeStr, mins) { var parts = timeStr.split(':'); var h = parseInt(parts[0]), m = parseInt(parts[1]) + mins; if (m >= 60) { h++; m -= 60; } return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0'); }
        var today = new Date(); var dateStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
        fetch('https://api.aladhan.com/v1/timings/'+dateStr+'?latitude=-6.3940&longitude=106.8228&method=20')
            .then(r => { if (!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
            .then(d => { if (d && d.data && d.data.timings) { var t = d.data.timings; el.innerHTML = '🕌 Subuh ' + t.Fajr + ' • Dzuhur ' + t.Dhuhr + ' • Ashar ' + t.Asr + ' • Maghrib ' + addIhtiyat(t.Maghrib,2) + ' • Isya ' + addIhtiyat(t.Isha,2); } })
            .catch(e => { el.innerHTML = '⚠️ Gagal memuat jadwal shalat'; });
    };
    window.renderDashboard = function() {
        var c = document.getElementById('dashboard-container'); if (!c) return;
        var modules = [{i:'⎈',n:'CMD Center',id:'cmd',cls:'iso-27001-b'},{i:'◈',n:'Security',id:'sec',cls:'iso-27001-b'},{i:'⚠',n:'K3 Safety',id:'k3',cls:'iso-27001-r'},{i:'⌾',n:'Jan Indoor',id:'in',cls:'iso-9001'},{i:'⎉',n:'Jan Outdoor',id:'out',cls:'iso-9001'},{i:'◷',n:'Booking',id:'book',cls:'iso-9001'},{i:'⛊',n:'Asset',id:'asset',cls:'iso-55001'},{i:'◫',n:'Stok',id:'stok',cls:'iso-55001'},{i:'⚙',n:'Maintenance',id:'maint',cls:'iso-55001'},{i:'💰',n:'Dana',id:'dana',cls:'iso-9001'}];
        var allowed = modules.filter(function(m) { return window.canAccess(m.id); });
        var gridHTML = ''; allowed.forEach(function(m) { gridHTML += '<div class="mod-card '+m.cls+'" onclick="openMod(\''+m.id+'\')"><div class="mod-icon">'+m.i+'</div><div class="mod-title">'+m.n+'</div></div>'; });
        c.innerHTML = '<div class="header-main"><img src="assets/logo-sultan.png" class="logo-img" onclick="tapLogo(event)"/><div class="arabic">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ</div><div class="shalawat">اَللّٰهُمَّ صَلِّ عَلٰى سَيِّدِنَا مُحَمَّدٍ</div><div class="info-badges"><span class="badge">🕌 Depok Area</span><span class="badge" id="live-clock">⏱️ --:--:--</span><span class="badge" id="sync-badge" style="background:rgba(16,185,129,0.1);color:#10b981;">☁️ Synced</span></div><div id="prayer-times-dash" style="font-size:0.65rem; color:var(--text-dim); margin-top:10px; background:rgba(0,0,0,0.3); padding:8px; border-radius:8px;">🕌 Memuat jadwal shalat...</div></div><div id="dream-slideshow"><div id="dream-slide-track"></div></div><div class="module-grid">'+gridHTML+'</div><div class="system-info-box"><strong>Dream OS v1.0 Final</strong><br>Family Dream Team<br><span style="color:var(--neon-accent);">"The Power Soul Of Shalawat"</span></div>';
        setInterval(function() { var clockEl = document.getElementById('live-clock'); if (clockEl) clockEl.textContent = '⏱️ '+new Date().toLocaleTimeString('id-ID'); }, 1000);
        updateSecuritySlideAuto(); checkWeatherAndNotify(); showSlides(); fetchPrayerTimes();
    };
    document.addEventListener('click', function(e) { var c = e.target.closest('.mod-card'); if (c && c.dataset.mod) { e.preventDefault(); window.openMod(c.dataset.mod); } });
    setTimeout(function() { var p = document.getElementById('login-pass'); if (p) p.focus(); }, 500);
    </script>
