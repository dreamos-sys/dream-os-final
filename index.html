<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dream OS Lite</title>
    <style>
        body { background:#020617; color:#e2e8f0; font-family:system-ui,sans-serif; margin:0; }
        #login-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; }
        .box { width:90%; max-width:400px; text-align:center; }
        .logo { width:80px; height:80px; border-radius:20px; margin-bottom:1rem; }
        input { width:100%; padding:0.8rem; margin:0.5rem 0; background:#0f172a; border:1px solid #2dd4bf; border-radius:0.5rem; color:#00ff9d; font-family:monospace; }
        button { width:100%; padding:0.8rem; background:#0ea5e9; color:white; border:none; border-radius:0.5rem; font-weight:bold; cursor:pointer; margin-top:0.5rem; }
        #main-app { display:none; padding-bottom:60px; }
        .header { padding:2rem 1rem 1rem; text-align:center; }
        .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:0.5rem; padding:1rem; }
        .card { background:#1e293b; padding:1rem; border-radius:1rem; text-align:center; cursor:pointer; }
        .card:active { background:#334155; }
        nav { position:fixed; bottom:0; left:0; right:0; background:#0f172a; display:flex; height:60px; display:none; }
        nav button { flex:1; background:none; border:none; color:#94a3b8; font-size:0.7rem; }
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="box">
            <img src="assets/logo-sultan.png" class="logo">
            <h2>Dream OS</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="pass" placeholder="Password">
            <button onclick="login()">Login</button>
            <button style="background:#10b981;" onclick="register()">Daftar</button>
            <p id="msg" style="color:#f59e0b; font-size:0.8rem;"></p>
        </div>
    </div>

    <div id="main-app">
        <div class="header">
            <h2>Dashboard</h2>
            <p id="user-info"></p>
        </div>
        <div class="grid" id="mod-grid"></div>
    </div>

    <nav id="bottom-nav">
        <button>Home</button>
        <button>Profile</button>
        <button>QR</button>
        <button>About</button>
        <button>System</button>
    </nav>

    <script>
        // Hash super sederhana (hanya untuk kompatibilitas)
        function simpleHash(str) {
            var h = 0;
            for (var i = 0; i < str.length; i++) {
                h = ((h << 5) - h) + str.charCodeAt(i);
                h |= 0;
            }
            return 'hash_' + Math.abs(h).toString(16);
        }

        window.login = function() {
            var email = document.getElementById('email').value.trim().toLowerCase();
            var pass = document.getElementById('pass').value;
            var msg = document.getElementById('msg');
            msg.innerText = '';

            if (!email || !pass) {
                msg.innerText = 'Isi email dan password';
                return;
            }

            // VIP hardcoded (dengan password asli)
            if (email === 'dreamos.sch.id@gmail.com' && pass === 'b15m1ll4h_012443410') {
                enter('dev', 'Sultan Architect');
                return;
            }
            if (email === 'vespaexcelhijaucedar@gmail.com' && pass === '4dm1n_k002d') {
                enter('kabag', 'Bpk. Hanung');
                return;
            }
            if (email === 'erwinsyah1679@gmail.com' && pass === '4dm1n_k002d') {
                enter('koord', 'Bpk. Erwinsyah');
                return;
            }

            // Cek database lokal
            var hash = simpleHash(pass + 'dreamos_salt_2026');
            var users = JSON.parse(localStorage.getItem('dreamos_users_db') || '[]');
            var user = users.find(function(u) { return u.email === email && u.password_hash === hash; });
            if (user) {
                enter(user.role, user.nama || email.split('@')[0]);
            } else {
                msg.innerText = 'Email atau password salah';
            }
        };

        window.register = function() {
            var email = document.getElementById('email').value.trim().toLowerCase();
            var pass = document.getElementById('pass').value;
            var msg = document.getElementById('msg');
            if (!email || !pass) {
                msg.innerText = 'Isi email dan password';
                return;
            }
            var hash = simpleHash(pass + 'dreamos_salt_2026');
            var users = JSON.parse(localStorage.getItem('dreamos_users_db') || '[]');
            if (users.some(function(u) { return u.email === email; })) {
                users = users.map(function(u) { return u.email === email ? Object.assign({}, u, { password_hash: hash }) : u; });
                msg.innerText = 'Password diperbarui!';
            } else {
                users.push({ email: email, password_hash: hash, nama: email.split('@')[0], role: 'staff' });
                msg.innerText = 'Registrasi berhasil! Silakan login.';
            }
            localStorage.setItem('dreamos_users_db', JSON.stringify(users));
        };

        function enter(role, name) {
            localStorage.setItem('dreamos_bound_user', JSON.stringify({ role: role, name: name }));
            localStorage.setItem('dreamos_session_active', 'true');
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('bottom-nav').style.display = 'flex';
            document.getElementById('user-info').innerText = name + ' (' + role + ')';
            renderModules();
        }

        function renderModules() {
            var mods = ['CMD','Security','K3','Jan Indoor','Jan Outdoor','Booking','Asset','Stok','Maintenance','Dana'];
            var grid = document.getElementById('mod-grid');
            grid.innerHTML = mods.map(function(m) { return '<div class="card">' + m + '</div>'; }).join('');
        }
    </script>
</body>
</html>
