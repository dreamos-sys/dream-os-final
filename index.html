      set(k, v) {
        try {
          const raw = JSON.stringify(v);
          const b64 = btoa(unescape(encodeURIComponent(raw)));
          localStorage.setItem(k, b64);
          if(window.BankAudit) BankAudit.log('SECURE_STORE_WRITE', { key: k, size: raw.length });
        } catch(e) { console.warn('SecureStore set failed:', e); }
      },
      get(k) {
        try {
          const b64 = localStorage.getItem(k);
          if(!b64) return null;
          const raw = decodeURIComponent(escape(atob(b64)));
          return JSON.parse(raw);
        } catch(e) { console.warn('SecureStore get failed:', e); return null; }

      remove(k) { localStorage.removeItem(k); if(window.BankAudit) BankAudit.log('SECURE_STORE_DELETE', { key: k }); }

            const dots = dotsC.querySelectorAll('.slide-dot');

            function goTo(i) {
              window._sliderCur = (i + slides.length) % slides.length;
              track.style.transform = `translateX(-${window._sliderCur * 100}%)`;
              dots.forEach((d,x) => d.classList.toggle('active', x === window._sliderCur));
            }
            function next() { goTo(window._sliderCur + 1); }
            function start() { if(window._sliderTimer) clearInterval(window._sliderTimer); window._sliderTimer = setInterval(next, 7000); }
            function stop() { if(window._sliderTimer) clearInterval(window._sliderTimer); }

            el.addEventListener('mouseenter', stop);
            el.addEventListener('mouseleave', start);
            el.addEventListener('touchstart', stop, {passive:true});
            el.addEventListener('touchend', () => setTimeout(start, 3000));

            let sx = 0;
            el.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, {passive:true});
            el.addEventListener('touchend', e => {
              const diff = sx - e.changedTouches[0].clientX;
              if (Math.abs(diff) > 40) diff > 0 ? goTo(window._sliderCur + 1) : goTo(window._sliderCur - 1);
            });

            goTo(0);
            start();
            // Auto-timer dinonaktifkan untuk kepatuhan WCAG & Enterprise UX pattern
            console.log('🎠 Carousel active: 7 slides, 7s interval');
          }

          // Init after DOM paint
          requestAnimationFrame(() => setTimeout(() => {
            window.updateDashboardSlides();
            initCarousel();
          }, 300));

          window._sliderInit = true;

          // Re-render called: just refresh data & reset carousel position
          if (typeof window.updateDashboardSlides === 'function') window.updateDashboardSlides();

        function createStars() {
          stars = [];

            stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: Math.random() * 1.5, speed: 0.02 + Math.random() * 0.05 });

      let idleWarnShown = false;
      function resetIdleTimer() { idleTime = 0; idleWarnShown = false; }
      ['mousemove','keypress','click','scroll','touchstart'].forEach(evt => window.addEventListener(evt, resetIdleTimer));

      setInterval(() => {
        if (localStorage.getItem('dreamos_session_active') !== 'true') return;
        idleTime++;
        if (idleTime >= WARN_IDLE_MINUTES && !idleWarnShown) {
          if (window.showToast) window.showToast('⚠️ Sesi akan berakhir dalam 2 menit karena tidak ada aktivitas.', 'warn');
          if (window.announce) window.announce('Peringatan: Sesi akan berakhir dalam 2 menit.');
          idleWarnShown = true;
        }
        if (idleTime >= MAX_IDLE_MINUTES) {
          if (window.supabaseClient) window.supabaseClient.auth.signOut().catch(()=>{});
          localStorage.removeItem('dreamos_bound_user');
          localStorage.setItem('dreamos_session_active', 'false');
          if (window.showToast) window.showToast('🔒 Sesi berakhir. Mengalihkan ke login...', 'error');
          if (window.announce) window.announce('Sesi berakhir karena tidak ada aktivitas.');
          setTimeout(() => location.reload(), 1500);
        }
      }, 60000);

      // Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('✅ SW registered:', reg.scope))
            .catch(err => console.warn('⚠️ SW registration failed:', err));
        });
      }
    });
  </script>
