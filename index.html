<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dream OS • Hybrid v1.0</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#020617">
    <style>
        :root { --bg: #020617; --text: #e2e8f0; --accent: #0ea5e9; --panel: #1e293b; }
        body { background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; margin:0; }
        canvas#star-field { position:fixed; inset:0; z-index:-1; }
        #login-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; }
        .box { width:90%; max-width:400px; text-align:center; }
        .logo { width:80px; border-radius:20px; margin-bottom:1rem; cursor:pointer; }
        input { width:100%; padding:0.8rem; margin:0.5rem 0; background:#0f172a; border:1px solid #2dd4bf; border-radius:0.5rem; color:#00ff9d; }
        button { width:100%; padding:0.8rem; background:var(--accent); color:#fff; border:none; border-radius:0.5rem; font-weight:bold; cursor:pointer; margin-top:0.5rem; }
        .btn-green { background:#10b981; }
        #main-app { display:none; padding-bottom:60px; }
        .header { padding:2rem 1rem 1rem; text-align:center; border-bottom:2px solid var(--accent); }
        .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:0.5rem; padding:1rem; }
        .card { background:var(--panel); padding:1rem; border-radius:1rem; text-align:center; cursor:pointer; }
        nav { position:fixed; bottom:0; left:0; right:0; background:#0f172a; display:none; height:60px; }
        nav button { flex:1; background:none; border:none; color:#94a3b8; font-size:0.7rem; }
        #msg { color:#f59e0b; font-size:0.8rem; }
    </style>
</head>
<body>
    <canvas id="star-field"></canvas>

    <div id="login-screen">
        <div class="box">
            <img src="assets/logo-sultan.png" class="logo" onclick="tapLogo(event)">
            <h2>Dream OS</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="pass" placeholder="Password">
            <button onclick="login()">Login</button>
            <button class="btn-green" onclick="register()">Daftar</button>
            <p id="msg"></p>
        </div>
    </div>

    <div id="main-app">
        <div class="header">
            <h2>Dashboard</h2>
            <p id="user-info"></p>
            <p id="live-clock"></p>
        </div>
        <div class="grid" id="mod-grid"></div>
    </div>

    <nav id="bottom-nav">
        <button>Home</button>
        <button>Profile</button>
        <button>QR</button>
        <button>About</button>
        <button>System</button>
    </nav>

    <script>
        // ========== BINTANG ==========
        (function(){
            var c=document.getElementById('star-field');
            if(!c)return;
            var ctx=c.getContext('2d'),stars=[],w,h;
            function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight;}
            function init(){resize();stars=[];for(var i=0;i<120;i++)stars.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5,v:Math.random()*0.3});}
            function draw(){ctx.fillStyle='#020617';ctx.fillRect(0,0,w,h);ctx.fillStyle='rgba(255,255,255,0.5)';for(var i=0;i<stars.length;i++){var p=stars[i];p.y-=p.v;if(p.y<0)p.y=h;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}requestAnimationFrame(draw);}
            window.addEventListener('resize',function(){resize();init();});
            init();draw();
        })();

        // ========== HASH SEDERHANA (KOMPATIBEL TWA) ==========
        function simpleHash(str) {
            var h = 0;
            for (var i = 0; i < str.length; i++) {
                h = ((h << 5) - h) + str.charCodeAt(i);
                h |= 0;
            }
            return 'hash_' + Math.abs(h).toString(16);
        }

        // ========== DATABASE HYBRID ==========
        function getUsers() {
            try { return JSON.parse(localStorage.getItem('dreamos_users_db') || '[]'); } catch(e) { return []; }
        }
        function saveUsers(users) {
            localStorage.setItem('dreamos_users_db', JSON.stringify(users));
        }

        // ========== LOGIN ==========
        window.login = function() {
            var email = document.getElementById('email').value.trim().toLowerCase();
            var pass = document.getElementById('pass').value;
            var msg = document.getElementById('msg');
            msg.innerText = '';

            if (!email || !pass) { msg.innerText = '⚠️ Isi email dan password'; return; }

            // VIP - Password langsung (bypass hash)
            if (email === 'dreamos.sch.id@gmail.com' && pass === 'b15m1ll4h_012443410') { enter('dev', 'Sultan Architect'); return; }
            if (email === 'vespaexcelhijaucedar@gmail.com' && pass === '4dm1n_k002d') { enter('kabag', 'Bpk. Hanung'); return; }
            if (email === 'erwinsyah1679@gmail.com' && pass === '4dm1n_k002d') { enter('koord', 'Bpk. Erwinsyah'); return; }

            var users = getUsers();
            var hash = simpleHash(pass + 'dreamos_salt_2026');

            // Coba cocokkan dengan hash
            var user = users.find(function(u) { return u.email === email && u.password_hash === hash; });
            if (user) { enter(user.role, user.nama || email.split('@')[0]); return; }

            // Fallback: cocokkan password langsung (untuk user yang baru daftar di TWA)
            user = users.find(function(u) { return u.email === email && u.password === pass; });
            if (user) {
                // Konversi ke hash untuk login berikutnya
                user.password_hash = hash;
                delete user.password;
                saveUsers(users);
                enter(user.role, user.nama || email.split('@')[0]);
                return;
            }

            msg.innerText = '⛔ Email atau password salah';
        };

        // ========== REGISTRASI ==========
        window.register = function() {
            var email = document.getElementById('email').value.trim().toLowerCase();
            var pass = document.getElementById('pass').value;
            var msg = document.getElementById('msg');
            if (!email || !pass) { msg.innerText = '⚠️ Isi email dan password'; return; }

            var users = getUsers();
            var hash = simpleHash(pass + 'dreamos_salt_2026');

            var existing = users.find(function(u) { return u.email === email; });
            if (existing) {
                existing.password_hash = hash;
                delete existing.password;
                msg.innerText = '✅ Password diperbarui!';
            } else {
                users.push({
                    email: email,
                    password_hash: hash,
                    nama: email.split('@')[0],
                    role: 'staff'
                });
                msg.innerText = '✅ Registrasi berhasil! Silakan login.';
            }
            saveUsers(users);
        };

        function enter(role, name) {
            localStorage.setItem('dreamos_bound_user', JSON.stringify({ role: role, name: name }));
            localStorage.setItem('dreamos_session_active', 'true');
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('bottom-nav').style.display = 'flex';
            document.getElementById('user-info').innerText = name + ' (' + role + ')';
            renderModules();
            startClock();
        }

        function renderModules() {
            var mods = ['CMD','Security','K3','Jan Indoor','Jan Outdoor','Booking','Asset','Stok','Maintenance','Dana'];
            var grid = document.getElementById('mod-grid');
            grid.innerHTML = mods.map(function(m) { return '<div class="card">' + m + '</div>'; }).join('');
        }

        function startClock() {
            var el = document.getElementById('live-clock');
            function tick() { el.textContent = new Date().toLocaleTimeString('id-ID'); }
            tick(); setInterval(tick, 1000);
        }

        var taps = 0;
        window.tapLogo = function(e) {
            e.stopPropagation();
            taps++;
            if (taps >= 7) { taps = 0; window.open('modules/4s-ghost.html', '_blank'); }
            setTimeout(function() { taps = 0; }, 2000);
        };
    </script>
</body>
</html>
