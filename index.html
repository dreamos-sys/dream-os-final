<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dream OS • Redirecting...</title>
  <style>
    body { font-family: 'Inter', sans-serif; background: #0a0e27; color: #e2e8f0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
    .glass { background: rgba(15,23,42,0.8); backdrop-filter: blur(20px); border: 1px solid rgba(0,255,157,0.2); padding: 2rem; border-radius: 16px; box-shadow: 0 0 30px rgba(0,255,157,0.1); max-width: 400px; width: 90%; }
    h2 { color: #00ff9d; margin-bottom: 0.5rem; font-size: 1.2rem; }
    p { color: #94a3b8; font-size: 0.85rem; line-height: 1.5; }
    .spinner { width: 40px; height: 40px; border: 4px solid rgba(0,255,157,0.2); border-top: 4px solid #00ff9d; border-radius: 50%; animation: spin 1s linear infinite; margin: 1.5rem auto 0; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
  <script>
    // Intelligent Multi-Cloud Redirect Logic
    (function() {
      var target = "https://dream-os-final.vercel.app/";
      // Cek jika user tidak sengaja membuka domain lama, langsung alihkan ke Vercel Enterprise Server
      if (window.location.hostname.includes("github.io")) {
        setTimeout(function() {
          window.location.replace(target);
        }, 1500); // Jeda 1.5 detik buat pamer estetika loading ala enterprise
      }
    })();
  </script>
</head>
<body>
  <div class="glass">
    <h2>🚀 Dream OS Enterprise</h2>
    <p>بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ<br>Mengalihkan jalur ke server Vercel berkecepatan tinggi...</p>
    <div class="spinner"></div>
  </div>
</body>
</html>
