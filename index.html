<!DOCTYPE html>
<html lang="id">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; connect-src 'self' https:;">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dream OS • v1.0 Final</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;600;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <style>
        :root { 
            --glass-bg: rgba(10, 15, 30, 0.6);
            --glass-border: rgba(0, 255, 157, 0.2);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --neon: #00ff9d;
            --accent: #0ea5e9;
            --warning: #e11d48;
            --gold: #d4af37;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #0a0e27;
            color: #e2e8f0; 
            font-family: 'Inter', sans-serif; 
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* STARFIELD CANVAS - PALING BAWAH */
        canvas#star-field {
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }
        
        /* GRADIENT & CIRCUIT - DI ATAS BINTANG */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 255, 157, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(14, 165, 233, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
            animation: gradientFlow 15s ease-in-out infinite;
        }
        
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0,255,157,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,157,0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 2;
        }
        
        @keyframes gradientFlow {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.6; }
            50% { transform: scale(1.1) rotate(5deg); opacity: 1; }
        }

        /* GLASS UTILITY */
        .glass {
            background: rgba(15, 23, 42, 0.7) !important;
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        /* LOGIN SCREEN - Z-INDEX TINGGI */
        #login-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(10, 14, 39, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 10000;
            transition: opacity 0.5s ease;
        }
        
        .login-container {
            text-align: center;
            max-width: 400px;
            width: 100%;
            padding: 2rem;
            z-index: 10001;
        }
        
        .login-logo {
            width: 100px;
            height: 100px;
            border-radius: 24px;
            margin-bottom: 2rem;
            box-shadow: 0 0 40px rgba(212,175,55,0.4);
        }
        
        .arabic {
            font-family: 'Amiri', serif;
            font-size: 2.2rem;
            color: var(--neon);
            text-shadow: 0 0 30px rgba(0,255,157,0.6);
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }
        
        .shalawat {
            font-family: 'Amiri', serif;
            font-size: 1rem;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(14,165,233,0.6);
            margin-bottom: 3rem;
        }
        
        .input-wrapper {
            position: relative;
            margin-bottom: 1.5rem;
        }
        
        .pin-input {
            width: 100%;
            padding: 1.2rem 4rem 1.2rem 1.5rem;
            background: rgba(0,0,0,0.6);
            border: 2px solid rgba(0,255,157,0.3);
            border-radius: 16px;
            color: var(--neon);
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-align: center;
            outline: none;
        }
        
        .toggle-pin {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 1.5rem;
            color: var(--neon);
        }
        
        .access-btn {
            width: 100%;
            padding: 1.2rem;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 25px rgba(16,185,129,0.4);
            transition: all 0.3s ease;
        }
        
        .access-btn:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 8px 35px rgba(16,185,129,0.6);
        }
        
        .error-msg {
            color: var(--warning);
            font-size: 0.9rem;
            margin-top: 1rem;
            display: none;
        }

        /* MAIN APP - DI ATAS STARFIELD */
        #main-app {
            display: none;
            position: relative;
            z-index: 10;
            padding-bottom: 6rem;
            min-height: 100vh;
        }
        
        #dashboard-container {
            position: relative;
            z-index: 11;
        }
        
        .header-main {
            padding: 2rem 1.5rem 1rem;
            text-align: center;
            margin: 1.5rem;
            border-radius: 24px;
        }
        
        .info-badges {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 1.5rem 0;
            flex-wrap: wrap;
        }
        
        .badge {
            padding: 0.5rem 1.2rem;
            border-radius: 24px;
            font-size: 0.7rem;
            color: var(--neon);
            font-weight: 700;
            background: rgba(0,255,157,0.1);
            border: 1px solid rgba(0,255,157,0.3);
            backdrop-filter: blur(10px);
        }
        
        .badge.online { background: rgba(16,185,129,0.2); color: #10b981; }
        .badge.offline { background: rgba(239,68,68,0.2); color: #ef4444; }
        
        #prayer-times-dash {
            font-size: 0.65rem;
            color: #94a3b8;
            margin-top: 1rem;
            padding: 0.6rem 1.2rem;
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            display: inline-block;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #dream-slideshow {
            height: 220px;
            margin: 1.5rem;
            overflow: hidden;
            position: relative;
            border-radius: 24px;
        }
        
        #dream-slide-track {
            display: flex;
            height: 100%;
            transition: transform 0.7s ease;
        }
        
        .dream-slide {
            min-width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            color: var(--neon);
            text-align: center;
            padding: 20px;
        }
        
        #slide-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: -30px;
            position: relative;
            z-index: 2;
            padding-bottom: 10px;
        }
        
        .dot {
            width: 8px;
            height: 8px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        
        .dot.active {
            background: var(--neon);
            box-shadow: 0 0 10px var(--neon);
            width: 24px;
            border-radius: 4px;
        }

        .module-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            padding: 0 1.5rem;
            margin-bottom: 2rem;
        }
        
        .mod-card {
            text-align: center;
            cursor: pointer;
            padding: 1.5rem 0.5rem;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            border-radius: 24px;
        }
        
        .mod-card:hover {
            transform: translateY(-5px);
            border-color: var(--neon);
            box-shadow: 0 12px 40px rgba(0,255,157,0.4);
        }
        
        .mod-icon {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            display: inline-block;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }
        
        .mod-title {
            font-size: 0.6rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--neon);
        }

        /* BOTTOM NAV */
        #bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 5rem;
            display: none;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
            border-top: 1px solid var(--glass-border);
            border-radius: 24px 24px 0 0;
        }
        
        .nav-item {
            background: transparent;
            border: none;
            color: #94a3b8;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 16px;
            border-radius: 16px;
            transition: all 0.3s ease;
            cursor: pointer;
            font-weight: 600;
        }
        
        .nav-item.active, .nav-item:active {
            background: rgba(0, 255, 157, 0.15);
            color: var(--neon);
        }
        
        .nav-icon { font-size: 1.4rem; }
        .nav-label { font-size: 0.6rem; text-transform: uppercase; }

        /* NOTIFICATION TOAST */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--neon);
            border-radius: 16px;
            padding: 1rem 1.5rem;
            z-index: 99999;
            box-shadow: 0 8px 32px rgba(0,255,157,0.3);
            display: none;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .notification.show { display: block; }
        
        .notification-title {
            font-weight: 700;
            color: var(--neon);
            margin-bottom: 0.3rem;
        }
        
        .notification-text {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        /* THEME TOGGLE */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 9999;
            font-size: 1.3rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .system-info-box {
            text-align: center;
            font-size: 0.65rem;
            color: #94a3b8;
            margin: 1.5rem;
            padding: 1.5rem;
            border-radius: 24px;
        }
    </style>
</head>
<body>
    <!-- STARFIELD CANVAS -->
    <canvas id="star-field"></canvas>

    <!-- NOTIFICATION CONTAINER -->
    <div id="notification-container"></div>

    <!-- THEME TOGGLE -->
    <div class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme">🌓</div>

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <div class="login-container">
            <img src="assets/logo-sultan.png" alt="Dream OS" class="login-logo">
            <div class="arabic">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم</div>
            <div class="shalawat">اَللّٰهُمَّ صَلِّ عَلٰى سَيِّدِنَا مُحَمَّدٍ</div>
            <div class="input-wrapper">
                <input type="password" id="pin-input" class="pin-input" placeholder="🔐 ENTER PIN">
                <span class="toggle-pin" onclick="togglePin()">👁️</span>
            </div>
            <button class="access-btn" onclick="authenticate()">⚡ ACCESS CORE</button>
            <div class="error-msg" id="error-msg"></div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="main-app">
        <div id="dashboard-container"></div>
    </div>
    
    <!-- BOTTOM NAV -->
    <nav id="bottom-nav" class="glass">
        <button class="nav-item active" onclick="goHome()"><span class="nav-icon">⌂</span><span class="nav-label">Home</span></button>
        <button class="nav-item" onclick="openMod('profile')"><span class="nav-icon">👤</span><span class="nav-label">Profile</span></button>
        <button class="nav-item" onclick="openMod('qr')"><span class="nav-icon">⎚</span><span class="nav-label">QR</span></button>
        <button class="nav-item" onclick="openMod('about')"><span class="nav-icon">ℹ️</span><span class="nav-label">About</span></button>
        <button class="nav-item" onclick="openMod('setting')"><span class="nav-icon">⚙</span><span class="nav-label">System</span></button>
    </nav>

    <script>
        // === GLOBAL STATE ===
        let slideInterval, prayerInterval;
        window.slideIdx = 0;
        const PIN_HASH = btoa('b15m1ll4h_012443410');
        let isDarkMode = true;

        // === NOTIFICATION SYSTEM ===
        function showNotification(title, text, duration = 5000) {
            const container = document.getElementById('notification-container');
            const notif = document.createElement('div');
            notif.className = 'notification show';
            notif.innerHTML = `<div class="notification-title">${title}</div><div class="notification-text">${text}</div>`;
            container.appendChild(notif);
            
            setTimeout(() => {
                notif.classList.remove('show');
                setTimeout(() => notif.remove(), 300);
            }, duration);
        }

        // === THEME TOGGLE ===
        function toggleTheme() {
            isDarkMode = !isDarkMode;
            const root = document.documentElement;
            if (isDarkMode) {
                root.style.setProperty('--glass-bg', 'rgba(10, 15, 30, 0.6)');
                root.style.setProperty('--neon', '#00ff9d');
                document.body.style.background = '#0a0e27';
            } else {
                root.style.setProperty('--glass-bg', 'rgba(240, 245, 255, 0.6)');
                root.style.setProperty('--neon', '#0ea5e9');
                document.body.style.background = '#f1f5f9';
            }
            localStorage.setItem('dreamos_theme', isDarkMode ? 'dark' : 'light');
            showNotification('Theme Changed', isDarkMode ? 'Dark mode activated' : 'Light mode activated');
        }

        // === AUTH ===
        function togglePin() {
            const input = document.getElementById('pin-input');
            const icon = event.target;
            input.type = input.type === 'password' ? 'text' : 'password';
            icon.innerHTML = input.type === 'password' ? '👁️' : '🙈';
        }

        function authenticate() {
            const input = document.getElementById('pin-input').value;
            const error = document.getElementById('error-msg');
            if (btoa(input) === PIN_HASH) {
                document.getElementById('login-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('main-app').style.display = 'block';
                    document.getElementById('bottom-nav').style.display = 'flex';
                    renderDashboard();
                    showNotification('Welcome Back!', 'Dream OS v1.0 Final loaded successfully');
                }, 500);
            } else {
                error.textContent = '⛔ ACCESS DENIED';
                error.style.display = 'block';
                setTimeout(() => error.style.display = 'none', 2000);
            }
        }
        
        document.getElementById('pin-input')?.addEventListener('keypress', e => {
            if (e.key === 'Enter') authenticate();
        });

        // === DASHBOARD ===
        window.renderDashboard = function() {
            const container = document.getElementById('dashboard-container');
            container.innerHTML = `
                <div class="header-main glass">
                    <img src="assets/logo-sultan.png" class="login-logo" style="width:60px;height:60px;margin-bottom:1rem;">
                    <div class="arabic">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم</div>
                    <div class="shalawat" style="margin-bottom:0.5rem;">اَللّٰهُمَّ صَلِّ عَلٰى سَيِّدِنَا مُحَمَّدٍ</div>
                    <div class="info-badges">
                        <span class="badge" id="live-clock">⏱️ --:--:--</span>
                        <span class="badge" id="battery-status">🔋 --%</span>
                        <span class="badge" id="connection-status">📡 Checking...</span>
                    </div>
                    <div id="prayer-times-dash">🕌 Loading prayer times...</div>
                </div>
                <div id="dream-slideshow" class="glass">
                    <div id="dream-slide-track"></div>
                </div>
                <div id="slide-dots"></div>
                <div class="module-grid" id="module-grid"></div>
                <div class="system-info-box glass">
                    <strong>Dream OS v1.0 Final</strong><br>
                    Engineered by Family Dream Team<br>
                    <span style="color:#0ea5e9;">"The Power Soul Of Shalawat"</span><br>
                    ISO 27001 • ISO 9001 • ISO 55001
                </div>
            `;

            const modules = [
                { i:'🌍', n:'CMD Center', id:'cmd' },
                { i:'🛡️', n:'Security', id:'sec' },
                { i:'⚠️', n:'K3 Safety', id:'k3' },
                { i:'🏠', n:'Jan Indoor', id:'in' },
                { i:'🌳', n:'Jan Outdoor', id:'out' },
                { i:'📅', n:'Booking', id:'book' },
                { i:'🏢', n:'Asset', id:'asset' },
                { i:'📦', n:'Stok', id:'stok' },
                { i:'🔧', n:'Maintenance', id:'maint' }
            ];
            
            const grid = document.getElementById('module-grid');
            modules.forEach(m => {
                const card = document.createElement('div');
                card.className = 'mod-card glass';
                card.innerHTML = `<div class="mod-icon">${m.i}</div><div class="mod-title">${m.n}</div>`;
                card.onclick = () => openMod(m.id);
                grid.appendChild(card);
            });

            startLiveClock();
            startBatteryMonitor();
            checkConnection();
            fetchPrayerTimes();
            showSlides();
            
            // Auto-save every 30 seconds
            setInterval(autoSave, 30000);
        };

        function startLiveClock() {
            setInterval(() => {
                const el = document.getElementById('live-clock');
                if (el) el.textContent = '⏱️ ' + new Date().toLocaleTimeString('id-ID');
            }, 1000);
        }

        function startBatteryMonitor() {
            if (navigator.getBattery) {
                navigator.getBattery().then(battery => {
                    const update = () => {
                        const el = document.getElementById('battery-status');
                        if (el) {
                            const icon = battery.charging ? '⚡' : '🔋';
                            el.textContent = `${icon} ${Math.round(battery.level * 100)}%`;
                        }
                    };
                    update();
                    battery.addEventListener('levelchange', update);
                    battery.addEventListener('chargingchange', update);
                });
            }
        }

        function checkConnection() {
            const el = document.getElementById('connection-status');
            const updateStatus = () => {
                if (navigator.onLine) {
                    el.textContent = '📡 Online';
                    el.className = 'badge online';
                } else {
                    el.textContent = '📡 Offline';
                    el.className = 'badge offline';
                    showNotification('Connection Lost', 'You are offline. Some features may not work.');
                }
            };
            updateStatus();
            window.addEventListener('online', updateStatus);
            window.addEventListener('offline', updateStatus);
        }

        function autoSave() {
            const data = {
                timestamp: new Date().toISOString(),
                localStorage: {}
            };
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('dreamos_')) {
                    data.localStorage[key] = localStorage.getItem(key);
                }
            }
            localStorage.setItem('dreamos_autosave', JSON.stringify(data));
            console.log('💾 Auto-saved:', new Date().toLocaleTimeString());
        }

        // === PRAYER TIMES ===
        async function fetchPrayerTimes() {
            try {
                const today = new Date();
                const dateStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
                
                const res = await fetch(`https://api.aladhan.com/v1/timings/${dateStr}?latitude=-6.4025&longitude=106.7942&method=20`);
                const data = await res.json();
                
                if (data.code === 200) {
                    const t = data.data.timings;
                    const prayers = [
                        { name: 'Subuh', time: t.Fajr, icon: '🌅' },
                        { name: 'Dzuhur', time: t.Dhuhr, icon: '☀️' },
                        { name: 'Ashar', time: t.Asr, icon: '🌤️' },
                        { name: 'Maghrib', time: t.Maghrib, icon: '🌅' },
                        { name: 'Isya', time: t.Isha, icon: '🌙' }
                    ];
                    
                    const now = new Date();
                    let nextPrayer = null;
                    let nextPrayerInfo = null;
                    
                    prayers.forEach(prayer => {
                        const [h, m] = prayer.time.split(':').map(Number);
                        const prayerTime = new Date();
                        prayerTime.setHours(h, m, 0);
                        if (prayerTime > now && !nextPrayer) {
                            nextPrayer = prayerTime;
                            nextPrayerInfo = prayer;
                        }
                    });
                    
                    if (!nextPrayer) {
                        nextPrayerInfo = prayers[0];
                        const [h, m] = prayers[0].time.split(':').map(Number);
                        nextPrayer = new Date();
                        nextPrayer.setDate(nextPrayer.getDate() + 1);
                        nextPrayer.setHours(h, m, 0);
                    }
                    
                    const prayerText = prayers.map(p => {
                        const isNext = nextPrayerInfo && p.name === nextPrayerInfo.name;
                        const style = isNext ? 'color:#00ff9d;font-weight:bold;' : 'color:#94a3b8;';
                        return `<span style="${style}">${p.icon} ${p.name} ${p.time}</span>`;
                    }).join(' • ');
                    
                    const el = document.getElementById('prayer-times-dash');
                    if (el) el.innerHTML = prayerText;
                    
                    updatePrayerCountdown(nextPrayer, nextPrayerInfo);
                    
                    if (prayerInterval) clearInterval(prayerInterval);
                    prayerInterval = setInterval(() => fetchPrayerTimes(), 3600000);
                }
            } catch(e) {
                console.error('Prayer error:', e);
                const el = document.getElementById('prayer-times-dash');
                if (el) el.textContent = '🕌 Failed to load';
            }
        }
        
        function updatePrayerCountdown(nextPrayer, nextPrayerInfo) {
            function update() {
                const now = new Date();
                const diff = nextPrayer - now;
                
                if (diff <= 0) {
                    showNotification('Prayer Time!', `Waktu ${nextPrayerInfo.name} telah tiba!`);
                    setTimeout(() => fetchPrayerTimes(), 60000);
                    return;
                }
                
                const h = Math.floor(diff / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                const countdown = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                
                const el = document.getElementById('prayer-times-dash');
                if (el && !el.querySelector('.countdown')) {
                    const span = document.createElement('span');
                    span.className = 'countdown';
                    span.style.cssText = 'margin-left:10px;padding:2px 8px;background:rgba(0,255,157,0.1);border-radius:10px;font-size:0.65rem;';
                    span.innerHTML = `⏱️ ${nextPrayerInfo.icon} ${nextPrayerInfo.name} dalam ${countdown}`;
                    el.appendChild(span);
                } else if (el && el.querySelector('.countdown')) {
                    el.querySelector('.countdown').innerHTML = `⏱️ ${nextPrayerInfo.icon} ${nextPrayerInfo.name} dalam ${countdown}`;
                }
            }
            update();
            setInterval(update, 1000);
        }

        // === SLIDES ===
        window.showSlides = function() {
            const track = document.getElementById('dream-slide-track');
            const dotsContainer = document.getElementById('slide-dots');
            if (!track || !dotsContainer) return;
            if (slideInterval) clearInterval(slideInterval);

            const slide5 = localStorage.getItem('dreamos_slide_5') || '🏛️ No management info.';
            const slide6 = localStorage.getItem('dreamos_slide_6') || '📋 No general info.';
            const slide7 = localStorage.getItem('dreamos_slide_7') || '💚 The Power Soul Of Shalawat!';

            const slides = [
                '🕌 Assalamualaikum!<br><small>🛡️ Petugas Siaga</small>',
                '📅 Dashboard<br><small>Real-time Monitoring</small>',
                '⚠️ Status Normal<br><small>ISO 27001 Checked</small>',
                '<span style="font-size:0.9rem;">🌦️ Cuaca</span><br><span id="slide4-weather" style="font-size:0.8rem;">⏳...</span>',
                `🏛️ Manajemen<br><small>${slide5}</small>`,
                `📋 Bag. Umum<br><small>${slide6}</small>`,
                `💚 Info<br><small>${slide7}</small>`
            ];

            track.innerHTML = slides.map(s => `<div class="dream-slide">${s}</div>`).join('');
            dotsContainer.innerHTML = slides.map((_, i) => `<div class="dot ${i === 0 ? 'active' : ''}"></div>`).join('');
            
            window.slideIdx = 0;
            const total = slides.length;
            
            function update() {
                if (!track.children.length) return;
                window.slideIdx = (window.slideIdx + 1) % total;
                track.style.transform = `translateX(-${window.slideIdx * 100}%)`;
                document.querySelectorAll('.dot').forEach((d, i) => {
                    d.classList.toggle('active', i === window.slideIdx);
                });
            }
            
            slideInterval = setInterval(update, 7000);
            
            setTimeout(() => {
                const wEl = document.getElementById('slide4-weather');
                if (!wEl) return;
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(pos => {
                        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&current=temperature_2m,weather_code&timezone=Asia/Jakarta`)
                        .then(r => r.json()).then(d => {
                            wEl.innerHTML = `🌡️ ${d.current.temperature_2m}°C`;
                        }).catch(() => { wEl.textContent = '🌤️ Offline'; });
                    }, () => { wEl.textContent = '📍 GPS Denied'; });
                }
            }, 1000);
        };

        // === MODULE LOADER ===
        window.openMod = function(id) {
            const map = {
                cmd: ['Command Center', 'commandcenter.html'],
                sec: ['Security', 'security.html'],
                k3: ['K3 Safety', 'k3.html'],
                in: ['Janitor Indoor', 'janitor-indoor.html'],
                out: ['Janitor Outdoor', 'janitor-outdoor.html'],
                maint: ['Maintenance', 'maintenance.html'],
                book: ['Booking', 'booking.html'],
                stok: ['Stok', 'stok.html'],
                asset: ['Asset', 'asset.html'],
                profile: ['Profile', 'profile.html'],
                qr: ['QR', 'qr.html'],
                about: ['About', 'about.html'],
                setting: ['Setting', 'setting.html']
            };
            const m = map[id];
            if (!m) { alert('Unknown module'); return; }
            
            let container = document.getElementById('mod-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'mod-container';
                container.style.cssText = 'position:fixed;inset:0;z-index:9995;overflow-y:auto;background:rgba(4,8,20,0.95);backdrop-filter:blur(20px);padding-bottom:5rem;';
                document.body.appendChild(container);
            }
            
            container.style.display = 'block';
            container.innerHTML = '<div style="text-align:center;padding:3rem;color:#94a3b8;">⏳ Loading...</div>';
            
            fetch(`modules/${m[1]}?v=${Date.now()}`)
                .then(r => { if (!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
                .then(html => {
                    container.innerHTML = html;
                    container.querySelectorAll('script').forEach(old => {
                        const ns = document.createElement('script');
                        ns.textContent = old.textContent;
                        document.body.appendChild(ns);
                    });
                })
                .catch(err => {
                    container.innerHTML = `<div style="color:#ef4444;padding:4rem 2rem;text-align:center;"><h3>⚠️ Failed</h3><p>${err.message}</p><button onclick="goHome()" style="margin-top:1rem;padding:0.75rem 1.5rem;background:#10b981;border:none;border-radius:8px;color:white;">Back</button></div>`;
                });
        };

        window.goHome = function() {
            const mod = document.getElementById('mod-container');
            if (mod) mod.style.display = 'none';
            if (slideInterval) clearInterval(slideInterval);
            showSlides();
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.querySelector('.nav-item:first-child').classList.add('active');
        };

        // === NVIDIA STARFIELD ===
        (function(){
            const canvas = document.getElementById('star-field');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let stars = [];
            const STAR_COUNT = 200;
            
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            
            function init() {
                resize();
                stars = [];
                for (let i = 0; i < STAR_COUNT; i++) {
                    stars.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        size: Math.random() * 2 + 0.5,
                        speed: Math.random() * 0.8 + 0.2,
                        opacity: Math.random() * 0.5 + 0.5
                    });
                }
            }
            
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                stars.forEach(star => {
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 255, 255, ' + star.opacity + ')';
                    ctx.fill();
                    if (star.size > 1.5) {
                        ctx.beginPath();
                        ctx.arc(star.x, star.y, star.size * 2, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(0, 255, 157, 0.1)';
                        ctx.fill();
                    }
                    star.y -= star.speed;
                    if (star.y < -10) {
                        star.y = canvas.height + 10;
                        star.x = Math.random() * canvas.width;
                    }
                });
                requestAnimationFrame(draw);
            }
            
            window.addEventListener('resize', () => { resize(); init(); });
            init();
            draw();
            console.log('🌟 NVIDIA Starfield Active - ' + STAR_COUNT + ' stars');
        })();
    </script>
</body>
