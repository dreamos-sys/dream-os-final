<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dream OS • v1.0 Final</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;600;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dream-ui.css">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <style>
        :root { 
            --bg-void: #020617; 
            --text-main: #e2e8f0; 
            --neon-accent: #0ea5e9; 
            --neon-warning: #e11d48; 
            --glass-border: rgba(255,255,255,0.15); 
            --panel-bg: rgba(15,23,42,0.7); 
            --text-primary: #f8fafc; 
            --text-dim: #94a3b8; 
            --glass-bg: rgba(255, 255, 255, 0.08); 
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --iso-9001: #10b981;
            --iso-27001-b: #0ea5e9;
            --iso-27001-r: #e11d48;
            --iso-55001: #f59e0b;
        }
        body { 
            margin: 0; 
            padding: 0; 
            overflow-x: hidden; 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            background-attachment: fixed;
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            min-height: 100vh; 
        }
        #login-screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: transparent; z-index: 10000; transition: opacity 0.5s ease; }
        .stealth-gate { position: relative; margin-top: 2rem; display: flex; flex-direction: column; align-items: center; min-height: 80px; }
        .eye-btn { background: none; border: none; font-size: 1.8rem; cursor: pointer; color: rgba(255, 255, 255, 0.2); transition: all 0.3s ease; }
        .eye-btn:active { color: #00ff9d; text-shadow: 0 0 15px #00ff9d; transform: scale(0.9); }
        .hidden-input-area { display: none; margin-top: 1rem; animation: fadeIn 0.4s ease; position: relative; }
        .hidden-input-area input { background: rgba(0,0,0,0.5); border: 1px solid rgba(0,255,157,0.3); color: #00ff9d; font-family: 'Orbitron', monospace; letter-spacing: 4px; text-align: center; padding: 0.75rem 1rem; border-radius: 8px; outline: none; width: 180px; box-shadow: inset 0 0 10px rgba(0,255,157,0.1); }
        .lockout-msg { color: #ef4444; font-size: 0.8rem; margin-top: 10px; display: none; font-weight: 600; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        #main-app { display: none; }
        #dashboard-container { position: relative; z-index: 1; }
        .header-main { padding: 2rem 1.5rem 1rem; text-align: center; border-bottom: 1px solid rgba(0, 255, 157, 0.1); margin-bottom: 0.5rem; }
        .header-main .logo-img { width: 48px; height: 48px; border-radius: 12px; cursor: pointer; margin-bottom: 0.5rem; }
        .header-main .arabic { font-family: 'Amiri', serif; color: #00ff9d; text-shadow: 0 0 20px rgba(0,255,157,0.3); font-size: 1.5rem; margin-bottom: 0.2rem; }
        .header-main .shalawat { font-family: 'Amiri', serif; color: #0ea5e9; font-size: 0.8rem; opacity: 0.8; }
        .info-badges { display: flex; justify-content: center; gap: 0.75rem; margin-top: 1rem; flex-wrap: wrap; }
        .badge { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); padding: 0.4rem 1rem; border-radius: 2rem; font-size: 0.7rem; color: #2dd4bf; font-weight: 600; }
        #dream-slideshow { 
            position: relative; 
            width: 100%; 
            height: 220px; 
            overflow: hidden; 
            margin-bottom: 1.5rem; 
            border-radius: 24px; 
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(24px) saturate(200%);
            -webkit-backdrop-filter: blur(24px) saturate(200%);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        #dream-slide-track { display: flex; transition: transform 0.7s ease; height: 100%; }
        .dream-slide { 
            min-width: 100%; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.8), rgba(30, 41, 59, 0.8)); 
            font-family: 'Orbitron', sans-serif; 
            font-size: 1rem; 
            color: #00ff9d; 
            text-align: center; 
            padding: 20px; 
            box-sizing: border-box;
            animation: slideFade 0.7s ease;
        }
        @keyframes slideFade {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .module-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; padding: 0 1.5rem 6rem; }
        .mod-card { 
            background: rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(24px) saturate(200%); 
            -webkit-backdrop-filter: blur(24px) saturate(200%);
            border-radius: 24px; 
            padding: 1.5rem 1rem; 
            text-align: center; 
            cursor: pointer; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        .mod-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%);
            border-radius: 24px;
            pointer-events: none;
        }
        .mod-card:active { 
            transform: scale(0.96); 
            box-shadow: 0 4px 15px rgba(0,255,157,0.2);
            border-color: rgba(0,255,157,0.3);
        }
        .mod-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 12px 40px rgba(0, 255, 157, 0.2);
            border-color: rgba(0, 255, 157, 0.3);
        }
        .mod-icon { font-size: 1.8rem; margin-bottom: 0.5rem; }
        .mod-title { font-size: 0.65rem; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; }
        .iso-9001 { border-top-color: rgba(16, 185, 129, 0.4); box-shadow: inset 0 20px 40px -20px rgba(16, 185, 129, 0.15); }
        .iso-9001 .mod-title { color: var(--iso-9001); }
        .iso-27001-b { border-top-color: rgba(14, 165, 233, 0.4); box-shadow: inset 0 20px 40px -20px rgba(14, 165, 233, 0.15); }
        .iso-27001-b .mod-title { color: var(--iso-27001-b); }
        .iso-27001-r { border-top-color: rgba(225, 29, 72, 0.4); box-shadow: inset 0 20px 40px -20px rgba(225, 29, 72, 0.15); }
        .iso-27001-r .mod-title { color: var(--iso-27001-r); }
        .iso-55001 { border-top-color: rgba(245, 158, 11, 0.4); box-shadow: inset 0 20px 40px -20px rgba(245, 158, 11, 0.15); }
        .iso-55001 .mod-title { color: var(--iso-55001); }
        nav { background: rgba(4, 8, 20, 0.85) !important; backdrop-filter: blur(20px); border-top: 1px solid rgba(0,255,157,0.1); }
        .dream-nav-item { background:none; border:none; color:#64748b; font-size:0.65rem; display:flex; flex-direction:column; align-items:center; gap:0.2rem; cursor:pointer; font-weight: 600;}
        .dream-nav-item span { font-size:1.3rem; opacity: 0.7;}
        .dream-nav-item:active span { opacity: 1; color: #00ff9d; }
        .system-info-box { margin: 2rem 1.5rem; padding: 1rem; border-radius: 12px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); font-size: 0.65rem; color: #64748b; text-align: center; line-height: 1.6; }
        .system-info-box strong { color: #94a3b8; }
    </style>
</head>
<body>
    <!-- 🌟 NVIDIA STARFIELD BACKGROUND -->
    <canvas id="star-field" style="position:fixed; inset:0; z-index:-1; pointer-events:none;"></canvas>

    <div id="login-screen">
        <div style="text-align:center;">
            <img src="assets/logo-sultan.png" style="width:75px;height:75px;border-radius:18px;cursor:pointer;margin-bottom:1.5rem;box-shadow:0 0 25px rgba(0,255,157,0.15); border: 1px solid rgba(0,255,157,0.2);" onclick="tapLogo()">
            <div style="font-family:'Amiri',serif;font-size:2.5rem;color:#00ff9d;text-shadow:0 0 30px rgba(0,255,157,0.3);margin-bottom:0.2rem;">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ</div>
            <div style="font-family:'Amiri',serif;font-size:1rem;color:#0ea5e9;opacity:0.8;">اَللّٰهُمَّ صَلِّ عَلٰى سَيِّدِنَا مُحَمَّدٍ</div>
            <div style="margin-top:1.5rem;color:#475569;font-size:0.75rem; letter-spacing: 2px; font-weight: 800;">DREAM OS • V1.0 FINAL</div>
        </div>
        <div class="stealth-gate">
            <div class="hidden-input-area" id="stealth-input" style="display:block;">
                <input type="password" id="pass" placeholder="ENTER PIN" onkeypress="handleEnter(event)" style="width:220px; font-size:1.1rem; padding-right:3rem;">
                <span onclick="togglePassword()" style="position:absolute; right:1rem; top:50%; transform:translateY(-50%); cursor:pointer; font-size:1.3rem; color:#00ff9d; z-index:2;">👁️</span>
            </div>
            <div class="lockout-msg" id="lock-msg"></div>
        </div>
    </div>
    <div id="main-app">
        <div id="dashboard-container"></div>
    </div>
    <div id="ghost-container"></div>
    <nav id="bottom-nav" style="display:none; position:fixed; bottom:0; left:0; right:0; height:4rem; justify-content:space-around; align-items:center; z-index:40;">
        <button class="dream-nav-item" onclick="goHome()"><span>⌂</span>Home</button>
        <button class="dream-nav-item" onclick="openMod('profile')"><span>👤</span>Profile</button>
        <button class="dream-nav-item" onclick="openMod('qr')"><span>⎚</span>QR</button>
        <button class="dream-nav-item" onclick="openMod('about')"><span>ℹ️</span>About</button>
        <button class="dream-nav-item" onclick="openMod('setting')"><span>⚙</span>System</button>
    </nav>
    <script>
        let attempts = 0;
        let lockoutUntil = localStorage.getItem('dream_lockout') || 0;
        let taps = 0, tapTimer, slideInterval;
        window.slideIdx = 0;

        function checkLockout() {
            if (Date.now() < lockoutUntil) {
                let remain = Math.ceil((lockoutUntil - Date.now()) / 60000);
                document.getElementById('lock-msg').innerText = `SYSTEM LOCKED. RETRY IN ${remain} MINS.`;
                document.getElementById('lock-msg').style.display = 'block';
                document.getElementById('stealth-input').style.display = 'none';
                return true;
            } else {
                document.getElementById('lock-msg').style.display = 'none';
                return false;
            }
        }

        window.togglePassword = function() {
            var passField = document.getElementById('pass');
            var eyeIcon = event.target;
            if (passField.type === 'password') {
                passField.type = 'text';
                eyeIcon.innerHTML = '🙈';
                eyeIcon.style.color = '#f59e0b';
            } else {
                passField.type = 'password';
                eyeIcon.innerHTML = '👁️';
                eyeIcon.style.color = '#00ff9d';
            }
        };

        window.handleEnter = function(e) {
            if(e.key === 'Enter') authenticate();
        }

        function authenticate() {
            if (checkLockout()) return;
            var passEl = document.getElementById('pass');
            if (!passEl || btoa(passEl.value) !== btoa('b15m1ll4h_012443410')) {
                attempts++;
                if(attempts >= 3) {
                    lockoutUntil = Date.now() + (5 * 60 * 1000);
                    localStorage.setItem('dream_lockout', lockoutUntil);
                    checkLockout();
                } else {
                    document.getElementById('lock-msg').innerText = `ACCESS DENIED. REMAINING: ${3 - attempts}`;
                    document.getElementById('lock-msg').style.display = 'block';
                    setTimeout(() => { document.getElementById('lock-msg').style.display = 'none'; }, 2000);
                }
                passEl.value = '';
                return;
            }
            attempts = 0;
            localStorage.removeItem('dream_lockout');
            document.getElementById('login-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                document.getElementById('bottom-nav').style.display = 'flex';
                renderDashboard();
            }, 500);
        }

        window.tapLogo = function() {
            clearTimeout(tapTimer);
            taps++;
            if (taps >= 7) { taps = 0; openGhostHub(); return; }
            tapTimer = setTimeout(() => { taps = 0; }, 2000);
        };

        window.openGhostHub = function() {
            var hub = document.getElementById('ghost-hub');
            if (hub) { hub.style.display = 'block'; if (typeof injectGhostTools === 'function') injectGhostTools(); }
        };

        window.hideGhostHub = function() {
            var hub = document.getElementById('ghost-hub');
            if (hub) hub.style.display = 'none';
        };

        window.log = function(msg) {
            var el = document.getElementById('ghost-log');
            if (el) { el.innerHTML += '> ' + msg + '\n'; el.scrollTop = el.scrollHeight; }
        };

        window.injectGhostTools = function() {
            var grid = document.getElementById('ghost-tools-inject');
            if (!grid) return;
            var tools = [
                { l: 'Sys Analyzer', i: '🔍', c: '#f59e0b', action: function() { log('🔍 System Analysis...'); } },
                { l: 'Network', i: '📡', c: '#10b981', action: function() { log('📡 '+(navigator.onLine?'Online':'Offline')); } },
                { l: 'Atomic Test', i: '🧪', c: '#8b5cf6', action: function() { openMod('atomic'); } },
                { l: 'Eruda Tools', i: '🛠️', c: '#ff5722', action: function() { if (typeof eruda !== 'undefined') { eruda.init(); eruda.show(); } else { alert('Eruda not loaded'); } } },
                { l: 'OSINT Pro', i: '🕵️', c: '#f97316', action: function() { alert('OSINT Module ready.\n\nHubungkan ke API eksternal.'); } },
                { l: 'Net Tools', i: '🌐', c: '#3b82f6', action: function() { alert('Net Tools Module.\n\nNmap, Spider, TShark siap digunakan.'); } }
            ];
            grid.innerHTML = '';
            tools.forEach(function(t) {
                var btn = document.createElement('button');
                btn.style.cssText = 'background:#1e293b;border:2px solid ' + t.c + ';border-radius:12px;padding:16px 8px;text-align:center;cursor:pointer;color:white;min-height:75px;';
                btn.innerHTML = '<div style="font-size:2rem;margin-bottom:6px;">' + t.i + '</div><div style="font-size:0.65rem;font-weight:600;color:#94a3b8;">' + t.l + '</div>';
                btn.addEventListener('click', t.action);
                grid.appendChild(btn);
            });
        };

        window.renderDashboard = function() {
            var container = document.getElementById('dashboard-container');
            if (!container) return;
            container.innerHTML = '';
            var header = document.createElement('div');
            header.className = 'header-main';
            header.innerHTML = `<img src="assets/logo-sultan.png" class="logo-img" onclick="tapLogo()" /><div class="arabic">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ</div><div class="shalawat">اَللّٰهُمَّ صَلِّ عَلٰى سَيِّدِنَا مُحَمَّدٍ</div><div class="info-badges"><span class="badge">🕌 Dzuhur</span><span class="badge" id="live-clock">⏱️ --:--:--</span><span class="badge" id="battery-status">🔋 --%</span></div><div style="margin-top:1rem;display:grid;grid-template-columns:repeat(3,1fr);gap:0.5rem;"><div class="badge" style="background:rgba(16,185,129,0.2);border-color:rgba(16,185,129,0.4);"><div style="font-size:0.6rem;">👥 Users</div><div style="font-weight:bold;">1,450</div></div><div class="badge" style="background:rgba(14,165,233,0.2);border-color:rgba(14,165,233,0.4);"><div style="font-size:0.6rem;">⏱️ Uptime</div><div style="font-weight:bold;">99.9%</div></div><div class="badge" style="background:rgba(245,158,11,0.2);border-color:rgba(245,158,11,0.4);"><div style="font-size:0.6rem;">📊 Active</div><div style="font-weight:bold;">890</div></div></div>`;
            container.appendChild(header);
            var slideDiv = document.createElement('div');
            slideDiv.id = 'dream-slideshow';
            slideDiv.innerHTML = '<div id="dream-slide-track"></div>';
            container.appendChild(slideDiv);
            var grid = document.createElement('div');
            grid.className = 'module-grid';
            var modules = [
                { i: '⎈', n: 'CMD Center', id: 'cmd', cls: 'iso-27001-b' },
                { i: '◈', n: 'Security', id: 'sec', cls: 'iso-27001-b' },
                { i: '⚠', n: 'K3 Safety', id: 'k3', cls: 'iso-27001-r' },
                { i: '⌾', n: 'Jan Indoor', id: 'in', cls: 'iso-9001' },
                { i: '⎉', n: 'Jan Outdoor', id: 'out', cls: 'iso-9001' },
                { i: '◷', n: 'Booking', id: 'book', cls: 'iso-9001' },
                { i: '⛊', n: 'Asset', id: 'asset', cls: 'iso-55001' },
                { i: '◫', n: 'Stok Gudang', id: 'stok', cls: 'iso-55001' },
                { i: '⚙', n: 'Maintenance', id: 'maint', cls: 'iso-55001' }
            ];
            modules.forEach(function(m) {
                grid.innerHTML += `<div class="mod-card ${m.cls}" onclick="openMod('${m.id}')"><div class="mod-icon">${m.i}</div><div class="mod-title">${m.n}</div></div>`;
            });
            container.appendChild(grid);
            var infoBox = document.createElement('div');
            infoBox.className = 'system-info-box';
            infoBox.innerHTML = `<strong>Dream OS v1.0 Final</strong><br>Engineered by Family Dream Team<br><br><span style="color:#0ea5e9; font-family:'Amiri',serif; font-size:0.8rem;">"The Power Soul Of Shalawat"</span><br><br>Compliance: <strong>ISO 27001, ISO 9001, ISO 55001</strong><br>Approver: Bapak Hanung Budianto S. E<br>Applicant: Bapak Erwinsyah`;
            container.appendChild(infoBox);
            startLiveClock();
            startBatteryMonitor();
            showSlides();
        };

        function startLiveClock() {
            setInterval(() => { var el = document.getElementById('live-clock'); if (el) el.textContent = '⏱️ ' + new Date().toLocaleTimeString('id-ID'); }, 1000);
        }

        function startBatteryMonitor() {
            if (navigator.getBattery) {
                navigator.getBattery().then(function(battery) {
                    function updateBattery() { var el = document.getElementById('battery-status'); if (el) el.textContent = (battery.charging ? '⚡' : '🔋') + ' ' + Math.round(battery.level * 100) + '%'; }
                    updateBattery();
                    battery.addEventListener('levelchange', updateBattery);
                    battery.addEventListener('chargingchange', updateBattery);
                });
            }
        }

        window.openMod = function(id) {
            var fetchMod = function(modId, file, containerId) {
                var container = document.getElementById(containerId);
                if (!container) {
                    container = document.createElement('div');
                    container.id = containerId;
                    container.style.cssText = 'position:fixed;inset:0;z-index:9995;overflow-y:auto;background:var(--bg-void); padding-bottom: 5rem;';
                    document.body.appendChild(container);
                }
                container.style.display = 'block';
                var nocacheUrl = 'modules/' + file + '?v=' + new Date().getTime();
                fetch(nocacheUrl).then(function(r){ 
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.text(); 
                }).then(function(h) {
                    container.innerHTML = h;
                    var scripts = container.querySelectorAll('script');
                    scripts.forEach(function(old) { var ns = document.createElement('script'); ns.textContent = old.textContent; document.body.appendChild(ns); });
                }).catch(function(err) {
                    container.innerHTML = '<div style="color:red;padding:4rem 2rem;text-align:center;"><h3>⚠️ Modul ' + modId + ' Gagal Dimuat</h3><p>Error: ' + err.message + '</p><button onclick="goHome()" style="margin-top:1rem;padding:0.75rem 1.5rem;background:#10b981;border:none;border-radius:8px;color:white;font-weight:bold;">Kembali</button></div>';
                });
            };
            var map = {
                book: ['Booking', 'booking.html', 'booking-module'], k3: ['K3 Safety', 'k3.html', 'k3-module'],
                in: ['Janitor Indoor', 'janitor-indoor.html', 'janitor-in-module'], out: ['Janitor Outdoor', 'janitor-outdoor.html', 'janitor-out-module'],
                maint: ['Maintenance', 'maintenance.html', 'maintenance-module'], sec: ['Security', 'security.html', 'security-module'],
                stok: ['Stok', 'stok.html', 'stok-module'], asset: ['Asset', 'asset.html', 'asset-module'],
                cmd: ['Command Center', 'commandcenter.html', 'cmd-module'], profile: ['Profile', 'profile.html', 'profile-module'],
                qr: ['QR', 'qr.html', 'qr-module'], about: ['About', 'about.html', 'about-module'],
                setting: ['Setting', 'setting.html', 'setting-module'], atomic: ['Atomic Test', 'atomic-test-v2.html', 'atomic-test-module']
            };
            var m = map[id];
            if (m) { fetchMod(m[0], m[1], m[2]); } else { alert('Modul tidak dikenali: ' + id); }
        };

        window.goHome = function() {
            if (slideInterval) { clearInterval(slideInterval); slideInterval = null; }
            var mods = document.querySelectorAll('[id$="-module"]');
            for (var i = 0; i < mods.length; i++) { mods[i].style.display = 'none'; }
            window.scrollTo(0, 0);
            showSlides();
        };

        window.showSlides = function() {
            var track = document.getElementById('dream-slide-track');
            if (!track) return;
            if (slideInterval) clearInterval(slideInterval);
            track.innerHTML = '';
            function S(c){return '<div class="dream-slide">'+c+'</div>';}
            track.innerHTML = S('🕌 Selamat Datang di Dream OS!<br><small>🛡️ Petugas Aktif</small>') + S('📅 Dashboard Operasional<br><small>Monitoring Real-time</small>') + S('⚠️ Status Keamanan Normal<br><small>ISO 27001 Perimeter Checked</small>') + S('<span style="font-size:0.85rem;">🌦️ Cuaca Depok Hari Ini</span><br><span id="slide4-weather" style="font-size:0.75rem;">⏳ Fetching...</span>') + S('💚 Terima kasih tim hebat!<br><small>"Jangan pernah lelah menebar kebaikan"</small>');
            setTimeout(() => {
                var wEl = document.getElementById('slide4-weather');
                if (!wEl) return;
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(function(pos) {
                        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,uv_index&timezone=Asia/Jakarta`)
                        .then(r => r.json()).then(d => {
                            const c = d.current;
                            const temp = c.temperature_2m;
                            const feels = c.apparent_temperature;
                            const humidity = c.relative_humidity_2m;
                            const wind = c.wind_speed_10m;
                            const uv = c.uv_index;
                            const code = c.weather_code;
                            
                            const conditions = {
                                0:'☀️ CERAH', 1:'🌤️ CERAH BERAWAN', 2:'⛅ BERAWAN', 3:'☁️ MENDUNG',
                                45:'🌫️ BERKABUT', 48:'🌫️ BERKABUT', 51:'🌦️ GERIMIS', 53:'🌦️ GERIMIS',
                                55:'🌧️ GERIMIS LEBAT', 61:'🌧️ HUJAN RINGAN', 63:'🌧️ HUJAN', 65:'🌧️ HUJAN LEBAT',
                                80:'🌦️ HUJAN RINGAN', 81:'🌧️ HUJAN', 82:'⛈️ HUJAN LEBAT',
                                95:'⛈️ HUJAN PETIR', 96:'⛈️ HUJAN PETIR', 99:'⛈️ HUJAN PETIR LEBAT'
                            };
                            
                            const weather = conditions[code] || '🌤️ Tidak diketahui';
                            wEl.innerHTML = weather + '<br>' +
                                '🌡️ ' + temp + '°C (Terasa: ' + feels + '°C)<br>' +
                                '💧 ' + humidity + '% | 💨 ' + wind + ' km/h | ☀️ UV: ' + uv;
                        }).catch(() => { wEl.textContent = '🌤️ Offline'; });
                    }, () => { wEl.textContent = '📍 GPS Denied'; });
                }
            }, 1000);
            window.slideIdx = 0;
            slideInterval = setInterval(() => {
                var slides = track.children;
                if (!slides.length) return;
                window.slideIdx = (window.slideIdx + 1) % slides.length;
                track.style.transform = 'translateX(-' + (window.slideIdx * 100) + '%)';
            }, 7000);
        };

        (function() {
            if (!document.getElementById('ghost-hub')) {
                var ghostHTML = '<div id="ghost-hub" style="display:none;position:fixed;inset:0;z-index:99999;background:rgba(4,8,20,0.98); backdrop-filter: blur(20px); overflow-y:auto;"><div style="background:rgba(15, 23, 42, 0.95); border-bottom:2px solid #2dd4bf; padding:1rem; display:flex; justify-content:space-between; align-items:center;"><div><h2 style="color:#2dd4bf; margin:0; font-family: \'Orbitron\', sans-serif; font-size:1rem;">4S DevOps Center</h2><p style="color:#64748b; font-size:0.6rem; margin:0;">Shadow Soul Spirit • v2.0</p></div><button onclick="hideGhostHub()" style="background:#ef4444; color:white; border:none; padding:0.5rem 1rem; border-radius:8px; cursor:pointer; font-weight:bold;">✕</button></div><div style="padding:1rem; display:grid; grid-template-columns:repeat(3,1fr); gap:8px;" id="ghost-tools-inject"></div><div style="margin:1rem; background:#000; border:1px solid #2dd4bf; border-radius:12px; padding:0.75rem; font-family:monospace; font-size:0.7rem; color:#2dd4bf; height:120px; overflow-y:auto;" id="ghost-log">> 4S DevOps Center ready...<br></div></div>';
                document.getElementById('ghost-container').innerHTML = ghostHTML;
            }
        })();

        if(location.search.includes("debug=true")||location.hostname==="localhost"){var es=document.createElement("script");es.src="//cdn.jsdelivr.net/npm/eruda";es.onload=function(){eruda.init();};document.head.appendChild(es);}
        checkLockout();
    </script>

    <!-- 🌟 NVIDIA STARFIELD ANIMATION -->
    <script>
    (function(){
        var c = document.getElementById('star-field');
        if (!c) return;
        var ctx = c.getContext('2d');
        var w, h, stars = [];
        function resize() {
            w = c.width = window.innerWidth;
            h = c.height = window.innerHeight;
        }
        function init() {
            resize();
            stars = [];
            for (var i = 0; i < 150; i++) {
                stars.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    r: Math.random() * 1.5 + 0.3,
                    v: Math.random() * 0.5 + 0.1
                });
            }
        }
        function draw() {
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            stars.forEach(function(p) {
                p.y -= p.v;
                if (p.y < -5) { p.y = h + 5; p.x = Math.random() * w; }
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(draw);
        }
        window.addEventListener('resize', function() { resize(); init(); });
        init();
        draw();
    })();
    </script>
