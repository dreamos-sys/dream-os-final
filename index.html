<script>
/* ===== SESSION KEEPER v2.0 (Anti Idle Timeout) ===== */
(function(){
  // 1. Force disable semua idle detection
  window.DREAMOS_DISABLE_IDLE_LOGOUT = true;
  window.DREAMOS_DISABLE_SESSION_TIMEOUT = true;
  window.DREAMOS_NEVER_LOGOUT = true;
  
  // 2. Heartbeat ke Supabase setiap 5 menit (keep session alive)
  setInterval(async function(){
    try {
      if (window.supabaseClient && localStorage.getItem('dreamos_session_active') === 'true') {
        // Touch session (prevent expiry)
        await window.supabaseClient.from('user_presence').upsert({
          user_id: JSON.parse(localStorage.getItem('dreamos_bound_user') || '{}').id || 'unknown',
          last_seen: new Date().toISOString(),
          keep_alive: true
        }, { onConflict: 'user_id' });
        console.log('[SessionKeeper] Heartbeat sent');
      }
    } catch(e) {
      console.warn('[SessionKeeper] Heartbeat failed:', e);
    }
  }, 5 * 60 * 1000); // 5 menit
  
  // 3. Block semua auto-logout attempt
  window.addEventListener('beforeunload', function(e){
    if (window.DREAMOS_NEVER_LOGOUT && !window.__userInitiatedLogout) {
      // Prevent accidental logout
      e.preventDefault();
      e.returnValue = '';
    }
  });
  
  console.log('🛡️ Session Keeper v2.0 active — idle timeout DISABLED');
})();
</script>


<!-- 🛡️ ULTIMATE IDLE KILLER -->

<script>
(function(){

  console.log('🛡️ Ultimate Idle Killer Aktif! Satpam "batu" sudah dibius total.');
})();
</script>

<script>
// 🛡️ HOTFIX: Sentinel Safe Closest Patch
(function(){
  if (Element.prototype._originClosest) return;
  Element.prototype._originClosest = Element.prototype.closest;
  Element.prototype.closest = function(selector) {
    try {
      if (!this || typeof this.matches !== 'function') return null;
      return this._originClosest(selector);
    } catch(e) { return null; }
  };
  // Juga amankan Event target jika bukan node DOM
  window.addEventListener('click', function(e){
    if (e && e.target && typeof e.target.closest !== 'function') {
      e.target.closest = function() { return null; };
    }
  }, true);
  console.log('🛡️ Safe Closest Sentinel Aktif!');
})();
</script>

    <script>
/* ===== KEYBOARD STABILIZER v1 (anti geser-geser Android) ===== */
(function(){
  if (!window.visualViewport) return;
  var vv = window.visualViewport;
  function onKb(){
    var kb = vv.height < window.innerHeight - 120;
    document.documentElement.classList.toggle('kb-open', kb);
  }
  vv.addEventListener('resize', onKb);
  vv.addEventListener('scroll', onKb);
  onKb();
})();
</script>

<script>
(function(){
  // Cegah double-tap zoom pada elemen non-input
  var lastTouch = 0;
  document.addEventListener('touchend', function(e){
    var now = Date.now();
    if (now - lastTouch <= 300 && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
      e.preventDefault();
    }
    lastTouch = now;
  }, {passive: false});

  // Deteksi keyboard: tambah class kb-open saat keyboard muncul
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function(){
      var diff = window.innerHeight - window.visualViewport.height;
      if (diff > 150) {
        document.documentElement.classList.add('kb-open');
      } else {
        document.documentElement.classList.remove('kb-open');
      }
    });
  }
})();
</script>

<script>
/* CMD Center — fallback tab/sync (production) */
(function(){
  window.switchTab = function(id){
    if (typeof window.__cmdSwitchTab === 'function') {
      try { return window.__cmdSwitchTab(id); } catch(e){ console.error(e); }
    }
    id = String(id||'').trim();
    if(!id) return;
    var root = document.getElementById('mod-container') || document;
    root.querySelectorAll('.tab-content').forEach(function(el){ el.classList.remove('active'); });
    root.querySelectorAll('.tab').forEach(function(el){ el.classList.remove('active'); });
    var pane = root.querySelector('#tab-'+id) || document.getElementById('tab-'+id);
    if (pane) pane.classList.add('active');
    var btn = root.querySelector('.tab[data-tab="'+id+'"]');
    if (btn) btn.classList.add('active');
  };
  window.refreshAll = function(force){
    if (typeof window.__cmdRefreshAll === 'function') {
      try { return window.__cmdRefreshAll(force); } catch(e){ console.error(e); }
    }
    console.warn('[cmd] refreshAll: modul belum siap / script di-skip');
  };
  window.runGlobalSearch = function(q){
    if (typeof window.__cmdGlobalSearch === 'function') return window.__cmdGlobalSearch(q);
  };
  if (!window.__dreamosModClickDelegate) {
    window.__dreamosModClickDelegate = true;
    document.addEventListener('click', function(e){
      var tab = e.target.closest('[data-tab]');
      if (tab && document.getElementById('mod-container') &&
          document.getElementById('mod-container').style.display !== 'none') {
        var id = tab.getAttribute('data-tab');
        if (id) { e.preventDefault(); e.stopPropagation(); window.switchTab(id); }
        return;
      }
      var sync = e.target.closest('[data-cmd="sync"]');
      if (sync) { e.preventDefault(); window.refreshAll(true); }
    }, true);
  }
})();
</script>
