<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream OS • v1.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f5f7fa; }
        .glass { background: rgba(255,255,255,0.85); backdrop-filter: blur(15px); border: 1px solid rgba(16,185,129,0.2); }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.875rem; }
        .dark body { background: #0f172a; }
        .dark .glass { background: rgba(30,41,59,0.9); border-color: rgba(16,185,129,0.3); }
    </style>
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="fixed inset-0 flex items-center justify-center bg-white">
        <div class="text-center">
            <img src="assets/logo-sultan.png" class="w-24 h-24 mx-auto mb-4">
            <p class="text-2xl text-emerald-600 mb-4">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ</p>
            <input type="password" id="pass" class="p-4 border rounded-lg text-center text-xl" placeholder="••••">
            <button onclick="login()" class="mt-4 px-8 py-3 bg-emerald-600 text-white rounded-lg font-bold">Access Core</button>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" style="display:none;" class="p-6">
        <div class="glass rounded-2xl p-6 mb-6">
            <h1 class="text-2xl font-bold text-gray-800 dark:text-white">Dream OS v1.0</h1>
            <div class="grid mt-4">
                <div class="glass p-4 rounded-xl text-center">
                    <div class="text-3xl mb-2">📊</div>
                    <div class="text-sm font-bold">CMD</div>
                </div>
                <div class="glass p-4 rounded-xl text-center">
                    <div class="text-3xl mb-2">📅</div>
                    <div class="text-sm font-bold">Booking</div>
                </div>
                <div class="glass p-4 rounded-xl text-center">
                    <div class="text-3xl mb-2">⚠️</div>
                    <div class="text-sm font-bold">K3</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function login() {
            const pass = document.getElementById('pass').value;
            if (pass === 'b15m1ll4h_012443410') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
            } else {
                alert('Password Salah!');
            }
        }
    </script>
</body>
</html>
