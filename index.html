    document.addEventListener('DOMContentLoaded', function() {
      // Automatic initial sync timestamp set
      if (!localStorage.getItem('dreamos_last_sync')) {
        const nowTime = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' WIB';
        localStorage.setItem('dreamos_last_sync', nowTime);
      }

      function renderHealth() {
        const el = document.getElementById('health-bar');
        if (!el) return;
        const online = navigator.onLine;
        const queue = window.OfflineQueue ? (window.OfflineQueue.queue?.length || 0) : 0;
        const storage = Math.round((JSON.stringify(localStorage).length / 1024 / 1024) * 100) / 100;
        
        // Update sync timestamp automatically
        let lastSync = localStorage.getItem('dreamos_last_sync');
        if(!lastSync || lastSync === 'Belum') {
          lastSync = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' WIB';
          localStorage.setItem('dreamos_last_sync', lastSync);
        }

        el.innerHTML = `
          <span class="health-badge ${online?'health-ok':'health-err'}">${online?'🟢 Online':'🔴 Offline'}</span>
          <span class="health-badge ${queue>0?'health-warn':'health-ok'}">📦 Queue: ${queue}</span>
          <span class="health-badge ${storage>4?'health-warn':'health-ok'}">💾 Storage: ${storage}MB</span>
          <span class="health-badge health-ok">🔄 Sync: ${lastSync}</span>
        `;
      }

      setInterval(renderHealth, 5000); // Check every 5s
    });
  </script>

  <!-- Realtime Auto-Sync Trigger Script -->
  <script>
    window.addEventListener('load', function() {
      setTimeout(() => {
        const nowTime = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' WIB';
        localStorage.setItem('dreamos_last_sync', nowTime);
        if (typeof renderHealth === 'function') renderHealth();
      }, 1500);
    });
  </script>
</body>
</html>
