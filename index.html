<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dream OS • Enterprise Core</title>
    <link rel="manifest" href="./manifest.json">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="theme-color" content="#020617">
    <style>
        :root { --bg: #020617; --text: #e2e8f0; --accent: #0ea5e9; --panel: rgba(30, 41, 59, 0.7); --neon-green: #00ff9d; --danger: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; }
        #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
        .login-box { width: 100%; max-width: 420px; background: rgba(15, 23, 42, 0.85); padding: 2rem; border-radius: 1.5rem; border: 1px solid rgba(45, 212, 191, 0.2); text-align: center; }
        .logo { width: 95px; height: 95px; border-radius: 24px; margin-bottom: 1.5rem; cursor: pointer; border: 2px solid var(--neon-green); }
        input { width: 100%; padding: 1rem; margin-bottom: 1rem; background: #090d1a; border: 1px solid #1e293b; border-radius: 0.75rem; color: var(--neon-green); }
        button { width: 100%; padding: 1rem; background: var(--accent); color: #fff; border: none; border-radius: 0.75rem; font-weight: bold; cursor: pointer; margin-top: 0.5rem; }
        #main-app { display: none; padding-bottom: 70px; min-height: 100vh; }
        .header { padding: 2rem 1rem; text-align: center; border-bottom: 1px solid var(--accent); }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem; padding: 1rem; }
        .card { background: var(--panel); padding: 1rem; border-radius: 1rem; text-align: center; border: 1px solid #334155; }
        nav { position: fixed; bottom: 0; left: 0; right: 0; background: #0f172a; display: none; height: 60px; border-top: 1px solid #334155; }
        nav button { flex: 1; border: none; background: none; color: #94a3b8; font-size: 0.7rem; }
    </style>
    <script src="js/auto-sync.js"></script>
</head>
<body>
    <div id="login-screen">
        <div class="login-box">
            <img src="assets/logo-sultan.png" class="logo" onclick="tapLogo(event)">
            <input type="email" id="email" placeholder="EMAIL">
            <input type="password" id="pass" placeholder="PASSWORD">
            <button onclick="authenticate()">🔐 LOGIN</button>
            <button style="background:#10b981" onclick="registerUser()">⚡ DAFTAR</button>
            <p id="msg" style="color:var(--danger); margin-top:1rem;"></p>
        </div>
    </div>
    <div id="main-app">
        <div class="header"><h2>Dream OS Central</h2><p id="user-info"></p></div>
        <div class="grid" id="mod-grid"></div>
    </div>
    <nav id="bottom-nav"><button class="active">🏠<br>Home</button><button>👤<br>Profile</button><button>📷<br>QR Scan</button><button onclick="window.location.href='modules/commandcenter.html'">🏢<br>CMD</button><button>⚙️<br>System</button></nav>
        <button>🏠 Home</button><button>👤 Profile</button><button>📷 QR</button>
        <button onclick="window.location.href='modules/commandcenter.html'">🏢 CMD</button><button>⚙️ Sys</button>
    </nav>
    <script>
        window.authenticate = function() {
            var email = document.getElementById('email').value.trim().toLowerCase();
            var pass = document.getElementById('pass').value;
            var users = JSON.parse(localStorage.getItem('dreamos_users_db') || '[]');
            var user = users.find(u => u.email === email && u.password === pass);
            if (user) {
                localStorage.setItem('dreamos_bound_user', JSON.stringify(user));
                localStorage.setItem('dreamos_session_active', 'true');
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                document.getElementById('bottom-nav').style.display = 'flex';
                document.getElementById('user-info').innerText = user.nama;
                renderModules();
            } else { document.getElementById('msg').innerText = '⛔ Login Gagal'; }
        };
        window.registerUser = function() {
            var email = document.getElementById('email').value.trim().toLowerCase();
            var pass = document.getElementById('pass').value;
            var users = JSON.parse(localStorage.getItem('dreamos_users_db') || '[]');
            users.push({ email, password: pass, nama: email.split('@')[0], role: 'kabag' });
            localStorage.setItem('dreamos_users_db', JSON.stringify(users));
            alert('✅ Terdaftar!');
        };
        function renderModules() {
            var mods = ['CMD','Security','K3','Jan','Taman','Book','Asset','Stok','Maint','Dana'];
            document.getElementById('mod-grid').innerHTML = mods.map(m => '<div class="card" onclick="alert(\'Modul '+m+'\')">'+m+'</div>').join('');
        }
        window.tapLogo = function(e) {
            if (e.detail >= 7) window.location.href = 'modules/4s-ghost.html';
        };
        if (localStorage.getItem('dreamos_session_active') === 'true') {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('bottom-nav').style.display = 'flex';
            renderModules();
        }
    </script>
</body>
</html>
