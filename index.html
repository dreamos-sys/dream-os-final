<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dream OS • v1.0 Final</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;600;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        :root { 
            --bg-void: #0a0e27; 
            --text-main: #e2e8f0; 
            --neon-accent: #00ff9d; 
            --neon-warning: #e11d48; 
            --glass-border: rgba(0, 255, 157, 0.3); 
            --panel-bg: rgba(15, 23, 42, 0.7);
            --text-primary: #f8fafc; 
            --text-dim: #94a3b8; 
            --glass-bg: rgba(20, 30, 50, 0.85);
            --glass-shadow: 0 8px 32px 0 rgba(0, 255, 157, 0.3);
            --iso-9001: #10b981;
            --iso-27001-b: #0ea5e9;
            --iso-27001-r: #e11d48;
            --iso-55001: #f59e0b;
        }
        
        * { box-sizing: border-box; }
        
        body { 
            margin: 0; padding: 0; overflow-x: hidden; 
            background: #0a0e27;
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            min-height: 100vh; position: relative;
        }
        
        body::before {
            content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 255, 157, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(14, 165, 233, 0.2) 0%, transparent 50%);
            pointer-events: none; z-index: -2;
            animation: gradientFlow 15s ease-in-out infinite;
        }
        
        @keyframes gradientFlow {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.6; }
            50% { transform: scale(1.15) rotate(5deg); opacity: 1; }
        }
        
        body::after {
            content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(0, 255, 157, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 157, 0.04) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none; z-index: -1;
        }
        
        #star-field { position: fixed; inset: 0; z-index: -3; pointer-events: none; }
        
        #login-screen { 
            position: fixed; inset: 0; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
            background: rgba(10, 14, 39, 0.6);
            z-index: 10000; transition: opacity 0.5s ease;
        }
        
        @supports (backdrop-filter: blur(20px)) or (-webkit-backdrop-filter: blur(20px)) {
            #login-screen, .header-main, .stats-widget, #dream-slideshow, .mod-card, nav, .badge, .system-info-box {
                backdrop-filter: blur(24px) saturate(200%);
                -webkit-backdrop-filter: blur(24px) saturate(200%);
            }
            .mod-card { background: rgba(255, 255, 255, 0.05); }
            .header-main { background: rgba(15, 23, 42, 0.4); }
            .stats-widget { background: rgba(255, 255, 255, 0.06); }
            #dream-slideshow { background: rgba(255, 255, 255, 0.04); }
        }
        
        .header-main, .stats-widget, #dream-slideshow, .mod-card, nav, .badge, .system-info-box {
            background: var(--glass-bg);
            border: 2px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }
        
        .hidden-input-area input { 
            background: rgba(0, 0, 0, 0.7); border: 2px solid rgba(0, 255, 157, 0.4); 
            color: #00ff9d; font-family: 'Orbitron', monospace; 
            letter-spacing: 4px; text-align: center; padding: 1rem 1.5rem; 
            border-radius: 16px; outline: none; width: 240px; font-size: 1.1rem;
            box-shadow: 0 0 30px rgba(0, 255, 157, 0.3), inset 0 0 20px rgba(0, 255, 157, 0.15);
        }
        
        .lockout-msg { color: #ef4444; font-size: 0.8rem; margin-top: 10px; display: none; font-weight: 600; }
        
        #main-app { display: none; position: relative; z-index: 1; }
        
        .header-main { padding: 2rem 1.5rem 1rem; text-align: center; border-bottom: 2px solid var(--glass-border); margin-bottom: 1.5rem; border-radius: 24px; }
        .header-main .logo-img { width: 60px; height: 60px; border-radius: 18px; cursor: pointer; margin-bottom: 1rem; box-shadow: 0 0 30px rgba(212, 175, 55, 0.5); }
        .info-badges { display: flex; justify-content: center; gap: 1rem; margin-top: 1.5rem; flex-wrap: wrap; }
        .badge { padding: 0.6rem 1.2rem; border-radius: 24px; font-size: 0.75rem; color: #00ff9d; font-weight: 700; transition: all 0.3s ease; }
        
        .stats-widget { margin: 1.5rem auto; max-width: 600px; border-radius: 24px; padding: 1.5rem; }
        .stats-title { font-size: 1rem; font-weight: 700; color: #00ff9d; margin-bottom: 1rem; text-align: center; }
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        .stat-item { text-align: center; padding: 0.8rem; background: rgba(0, 0, 0, 0.4); border-radius: 16px; border: 1px solid rgba(0, 255, 157, 0.2); }
        .stat-label { font-size: 0.7rem; color: #94a3b8; margin-bottom: 0.3rem; }
        .stat-value { font-size: 1.3rem; font-weight: 700; color: #00ff9d; }
        
        #dream-slideshow { position: relative; width: 100%; height: 240px; overflow: hidden; margin: 1.5rem auto; max-width: 90%; border-radius: 24px; }
        #dream-slide-track { display: flex; transition: transform 0.7s ease; height: 100%; }
        .dream-slide { min-width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(135deg, rgba(10, 14, 39, 0.9), rgba(30, 41, 59, 0.9)); font-family: 'Orbitron', sans-serif; font-size: 1.1rem; color: #00ff9d; text-align: center; padding: 25px; box-sizing: border-box; animation: slideFade 0.7s ease; }
        @keyframes slideFade { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
        
        .module-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; padding: 0 1.5rem 6rem; max-width: 95%; margin: 0 auto; }
        .mod-card { border-radius: 24px; padding: 1.8rem 1rem; text-align: center; cursor: pointer; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden; }
        .mod-card:active { transform: scale(0.95); }
        .mod-card:hover { transform: translateY(-5px); box-shadow: 0 16px 48px rgba(0, 255, 157, 0.4); border-color: rgba(0, 255, 157, 0.6); }
        .mod-icon { font-size: 2.5rem; margin-bottom: 0.8rem; }
        .mod-title { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; color: #00ff9d; }
        
        nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; height: 4.5rem; justify-content: space-around; align-items: center; z-index: 40; border-top: 2px solid var(--glass-border); }
        .dream-nav-item { background: none; border: none; color: #94a3b8; font-size: 0.7rem; display: flex; flex-direction: column; align-items: center; gap: 0.3rem; cursor: pointer; font-weight: 700; }
        .dream-nav-item span { font-size: 1.5rem; }
        
        .system-info-box { margin: 2rem 1.5rem; padding: 1.5rem; border-radius: 24px; font-size: 0.7rem; color: #94a3b8; text-align: center; line-height: 1.8; }
        .system-info-box strong { color: #00ff9d; }
        
        .update-notice { position: fixed; top: 10px; right: 10px; background: #00ff9d; color: #000; padding: 6px 12px; border-radius: 20px; font-size: 0.65rem; font-weight: 800; z-index: 9999; display: block; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(0,255,157,0.5); }
    </style>
</head>
<body>
    <canvas id="star-field"></canvas>
    <div class="update-notice">✅ v.ULTIMATE ACTIVE</div>

    <div id="login-screen">
        <div style="text-align:center;">
            <img src="assets/logo-sultan.png" class="logo-img" onclick="tapLogo()">
            <div style="font-family:'Amiri',serif;font-size:2.5rem;color:#00ff9d;text-shadow:0 0 30px rgba(0,255,157,0.5);margin-bottom:0.5rem;">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ</div>
            <div style="font-family:'Amiri',serif;font-size:1.1rem;color:#0ea5e9;opacity:0.9;">اَللّٰهُمَّ صَلِّ عَلٰى سَيِّدِنَا مُحَمَّدٍ</div>
            <div style="margin-top:2rem;color:#475569;font-size:0.8rem; letter-spacing: 3px; font-weight: 800;">DREAM OS • V1.0 FINAL</div>
        </div>
        <div class="stealth-gate">
            <div class="hidden-input-area" id="stealth-input" style="display:block;">
                <input type="password" id="pass" placeholder="ENTER PIN" onkeypress="handleEnter(event)">
                <span onclick="togglePassword()" style="position:absolute; right:1rem; top:50%; transform:translateY(-50%); cursor:pointer; font-size:1.5rem; color:#00ff9d; z-index:2;">👁️</span>
            </div>
            <div class="lockout-msg" id="lock-msg"></div>
        </div>
    </div>
    
    <div id="main-app"><div id="dashboard-container"></div></div>
    <div id="ghost-container"></div>
    
    <nav id="bottom-nav">
        <button class="dream-nav-item" onclick="goHome()"><span>⌂</span>Home</button>
        <button class="dream-nav-item" onclick="openMod('profile')"><span>👤</span>Profile</button>
        <button class="dream-nav-item" onclick="openMod('qr')"><span>⎚</span>QR</button>
        <button class="dream-nav-item" onclick="openMod('about')"><span>ℹ️</span>About</button>
        <button class="dream-nav-item" onclick="openMod('setting')"><span>⚙</span>System</button>
    </nav>

    <script>
        let attempts = 0, lockoutUntil = localStorage.getItem('dream_lockout') || 0, taps = 0, tapTimer, slideInterval; window.slideIdx = 0;

        function checkLockout() { if (Date.now() < lockoutUntil) { let remain = Math.ceil((lockoutUntil - Date.now()) / 60000); document.getElementById('lock-msg').innerText = `SYSTEM LOCKED. RETRY IN ${remain} MINS.`; document.getElementById('lock-msg').style.display = 'block'; document.getElementById('stealth-input').style.display = 'none'; return true; } else { document.getElementById('lock-msg').style.display = 'none'; return false; } }

        window.togglePassword = function() { var passField = document.getElementById('pass'); var eyeIcon = event.target; if (passField.type === 'password') { passField.type = 'text'; eyeIcon.innerHTML = '🙈'; eyeIcon.style.color = '#f59e0b'; } else { passField.type = 'password'; eyeIcon.innerHTML = '👁️'; eyeIcon.style.color = '#00ff9d'; } };

        window.handleEnter = function(e) { if(e.key === 'Enter') authenticate(); }

        function authenticate() { if (checkLockout()) return; var passEl = document.getElementById('pass'); if (!passEl || btoa(passEl.value) !== btoa('b15m1ll4h_012443410')) { attempts++; if(attempts >= 3) { lockoutUntil = Date.now() + (5 * 60 * 1000); localStorage.setItem('dream_lockout', lockoutUntil); checkLockout(); } else { document.getElementById('lock-msg').innerText = `ACCESS DENIED. REMAINING: ${3 - attempts}`; document.getElementById('lock-msg').style.display = 'block'; setTimeout(() => { document.getElementById('lock-msg').style.display = 'none'; }, 2000); } passEl.value = ''; return; } attempts = 0; localStorage.removeItem('dream_lockout'); document.getElementById('login-screen').style.opacity = '0'; setTimeout(() => { document.getElementById('login-screen').style.display = 'none'; document.getElementById('main-app').style.display = 'block'; document.getElementById('bottom-nav').style.display = 'flex'; renderDashboard(); }, 500); }

        window.tapLogo = function() { clearTimeout(tapTimer); taps++; if (taps >= 7) { taps = 0; openGhostHub(); return; } tapTimer = setTimeout(() => { taps = 0; }, 2000); };

        window.openGhostHub = function() { var hub = document.getElementById('ghost-hub'); if (hub) { hub.style.display = 'block'; if (typeof injectGhostTools === 'function') injectGhostTools(); } };
        window.hideGhostHub = function() { var hub = document.getElementById('ghost-hub'); if (hub) hub.style.display = 'none'; };
        window.log = function(msg) { var el = document.getElementById('ghost-log'); if (el) { el.innerHTML += '> ' + msg + '\n'; el.scrollTop = el.scrollHeight; } };

        window.injectGhostTools = function() { var grid = document.getElementById('ghost-tools-inject'); if (!grid) return; var tools = [ { l: 'Sys Analyzer', i: '🔍', c: '#f59e0b', action: function() { log('🔍 System Analysis...'); } }, { l: 'Network', i: '📡', c: '#10b981', action: function() { log('📡 '+(navigator.onLine?'Online':'Offline')); } }, { l: 'Atomic Test', i: '🧪', c: '#8b5cf6', action: function() { openMod('atomic'); } } ]; grid.innerHTML = ''; tools.forEach(function(t) { var btn = document.createElement('button'); btn.style.cssText = 'background:rgba(30,41,59,0.6);border:2px solid '+t.c+';border-radius:16px;padding:16px 8px;text-align:center;cursor:pointer;color:white;min-height:80px;'; btn.innerHTML = '<div style="font-size:2.2rem;margin-bottom:8px;">'+t.i+'</div><div style="font-size:0.7rem;font-weight:700;color:#94a3b8;">'+t.l+'</div>'; btn.addEventListener('click', t.action); grid.appendChild(btn); }); };

        window.renderDashboard = function() { var container = document.getElementById('dashboard-container'); if (!container) return; container.innerHTML = ''; var header = document.createElement('div'); header.className = 'header-main'; header.innerHTML = `<img src="assets/logo-sultan.png" class="logo-img" onclick="tapLogo()"><div style="font-family:'Amiri',serif;font-size:2rem;color:#00ff9d;">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ</div><div style="font-family:'Amiri',serif;font-size:1rem;color:#0ea5e9;">اَللّٰهُمَّ صَلِّ عَلٰى سَيِّدِنَا مُحَمَّدٍ</div><div class="info-badges"><span class="badge">🕌 Dzuhur</span><span class="badge" id="live-clock">⏱️ --:--:--</span><span class="badge" id="battery-status">🔋 --%</span></div><div class="stats-widget"><div class="stats-title">📊 Today's Statistics</div><div class="stats-grid"><div class="stat-item"><div class="stat-label">👥 Users</div><div class="stat-value">1,450</div></div><div class="stat-item"><div class="stat-label">📝 Transactions</div><div class="stat-value">890</div></div><div class="stat-item"><div class="stat-label">⏱️ Uptime</div><div class="stat-value">99.98%</div></div><div class="stat-item"><div class="stat-label">🕌 Prayer</div><div class="stat-value">5 Days</div></div></div></div>`; container.appendChild(header); var slideDiv = document.createElement('div'); slideDiv.id = 'dream-slideshow'; slideDiv.innerHTML = '<div id="dream-slide-track"></div>'; container.appendChild(slideDiv); var grid = document.createElement('div'); grid.className = 'module-grid'; var modules = [ { i: '🌍', n: 'CMD Center', id: 'cmd', cls: 'iso-27001-b' }, { i: '🛡️', n: 'Security', id: 'sec', cls: 'iso-27001-b' }, { i: '⚠️', n: 'K3 Safety', id: 'k3', cls: 'iso-27001-r' }, { i: '🎯', n: 'Jan Indoor', id: 'in', cls: 'iso-9001' }, { i: '🚀', n: 'Jan Outdoor', id: 'out', cls: 'iso-9001' }, { i: '📅', n: 'Booking', id: 'book', cls: 'iso-9001' }, { i: '🏢', n: 'Asset', id: 'asset', cls: 'iso-55001' }, { i: '📦', n: 'Stok', id: 'stok', cls: 'iso-55001' }, { i: '🔧', n: 'Maintenance', id: 'maint', cls: 'iso-55001' } ]; modules.forEach(function(m) { grid.innerHTML += `<div class="mod-card ${m.cls}" onclick="openMod('${m.id}')"><div class="mod-icon">${m.i}</div><div class="mod-title">${m.n}</div></div>`; }); container.appendChild(grid); var infoBox = document.createElement('div'); infoBox.className = 'system-info-box'; infoBox.innerHTML = `<strong>Dream OS v1.0 Final</strong><br>Family Dream Team<br>"The Power Soul Of Shalawat"`; container.appendChild(infoBox); startLiveClock(); startBatteryMonitor(); showSlides(); };

        function startLiveClock() { setInterval(() => { var el = document.getElementById('live-clock'); if (el) el.textContent = '⏱️ ' + new Date().toLocaleTimeString('id-ID'); }, 1000); }
        function startBatteryMonitor() { if (navigator.getBattery) { navigator.getBattery().then(function(battery) { function updateBattery() { var el = document.getElementById('battery-status'); if (el) el.textContent = (battery.charging ? '⚡' : '🔋') + ' ' + Math.round(battery.level * 100) + '%'; } updateBattery(); battery.addEventListener('levelchange', updateBattery); battery.addEventListener('chargingchange', updateBattery); }); } }

        window.openMod = function(id) { var fetchMod = function(modId, file, containerId) { var container = document.getElementById(containerId); if (!container) { container = document.createElement('div'); container.id = containerId; container.style.cssText = 'position:fixed;inset:0;z-index:9995;overflow-y:auto;background:rgba(4,8,20,0.95);backdrop-filter:blur(20px); padding-bottom: 5rem;'; document.body.appendChild(container); } container.style.display = 'block'; var nocacheUrl = 'modules/' + file + '?v=' + new Date().getTime(); fetch(nocacheUrl).then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); }).then(function(h) { container.innerHTML = h; var scripts = container.querySelectorAll('script'); scripts.forEach(function(old) { var ns = document.createElement('script'); ns.textContent = old.textContent; document.body.appendChild(ns); }); }).catch(function(err) { container.innerHTML = '<div style="color:red;padding:4rem 2rem;text-align:center;"><h3>⚠️ Modul Gagal</h3><p>'+err.message+'</p></div>'; }); }; var map = { book: ['Booking', 'booking.html', 'booking-module'], k3: ['K3 Safety', 'k3.html', 'k3-module'], in: ['Janitor Indoor', 'janitor-indoor.html', 'janitor-in-module'], out: ['Janitor Outdoor', 'janitor-outdoor.html', 'janitor-out-module'], maint: ['Maintenance', 'maintenance.html', 'maintenance-module'], sec: ['Security', 'security.html', 'security-module'], stok: ['Stok', 'stok.html', 'stok-module'], asset: ['Asset', 'asset.html', 'asset-module'], cmd: ['Command Center', 'commandcenter.html', 'cmd-module'], profile: ['Profile', 'profile.html', 'profile-module'], qr: ['QR', 'qr.html', 'qr-module'], about: ['About', 'about.html', 'about-module'], setting: ['Setting', 'setting.html', 'setting-module'], atomic: ['Atomic Test', 'atomic-test-v2.html', 'atomic-test-module'] }; var m = map[id]; if (m) { fetchMod(m[0], m[1], m[2]); } else { alert('Modul tidak dikenali: ' + id); } };

        window.goHome = function() { if (slideInterval) { clearInterval(slideInterval); slideInterval = null; } var mods = document.querySelectorAll('[id$="-module"]'); for (var i = 0; i < mods.length; i++) { mods[i].style.display = 'none'; } window.scrollTo(0, 0); showSlides(); };

        window.showSlides = function() { var track = document.getElementById('dream-slide-track'); if (!track) return; if (slideInterval) clearInterval(slideInterval); track.innerHTML = ''; function S(c){return '<div class="dream-slide">'+c+'</div>';} track.innerHTML = S('🕌 Selamat Datang!<br><small>🛡️ Petugas Aktif</small>') + S('📅 Dashboard<br><small>Real-time</small>') + S('⚠️ Status Normal<br><small>ISO 27001</small>') + S('🌦️ Cuaca<br><span id="slide4-weather">⏳...</span>') + S('💚 Terima Kasih!<br><small>"The Power Soul Of Shalawat"</small>'); setTimeout(() => { var wEl = document.getElementById('slide4-weather'); if (!wEl) return; if (navigator.geolocation) { navigator.geolocation.getCurrentPosition(function(pos) { fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&current=temperature_2m,weather_code&timezone=Asia/Jakarta`).then(r => r.json()).then(d => { wEl.innerHTML = '🌡️ '+d.current.temperature_2m+'°C'; }).catch(() => { wEl.textContent = '🌤️ Offline'; }); }, () => { wEl.textContent = '📍 GPS Denied'; }); } }, 1000); window.slideIdx = 0; slideInterval = setInterval(() => { var slides = track.children; if (!slides.length) return; window.slideIdx = (window.slideIdx + 1) % slides.length; track.style.transform = 'translateX(-' + (window.slideIdx * 100) + '%)'; }, 7000); };

        (function() { if (!document.getElementById('ghost-hub')) { var ghostHTML = '<div id="ghost-hub" style="display:none;position:fixed;inset:0;z-index:99999;background:rgba(4,8,20,0.98);backdrop-filter:blur(30px);overflow-y:auto;"><div style="background:rgba(15,23,42,0.95);border-bottom:3px solid #00ff9d;padding:1.5rem;display:flex;justify-content:space-between;align-items:center;"><div><h2 style="color:#00ff9d;margin:0;font-family:\'Orbitron\',sans-serif;">4S DevOps</h2><p style="color:#64748b;font-size:0.7rem;margin:0;">v2.0</p></div><button onclick="hideGhostHub()" style="background:#ef4444;color:white;border:none;padding:0.6rem 1.2rem;border-radius:12px;cursor:pointer;font-weight:bold;">✕</button></div><div style="padding:1.5rem;" id="ghost-tools-inject"></div><div style="margin:1.5rem;background:rgba(0,0,0,0.6);border:2px solid #00ff9d;border-radius:16px;padding:1rem;font-family:monospace;font-size:0.75rem;color:#00ff9d;height:150px;overflow-y:auto;" id="ghost-log">> Ready...<br></div></div>'; document.getElementById('ghost-container').innerHTML = ghostHTML; } })();

        if(location.search.includes("debug=true")||location.hostname==="localhost"){var es=document.createElement("script");es.src="//cdn.jsdelivr.net/npm/eruda";es.onload=function(){eruda.init();};document.head.appendChild(es);}
        checkLockout();
    </script>

    <script>
    (function(){ var c = document.getElementById('star-field'); if (!c) return; var ctx = c.getContext('2d'); var w, h, stars = []; function resize() { w = c.width = window.innerWidth; h = c.height = window.innerHeight; } function init() { resize(); stars = []; for (var i = 0; i < 150; i++) { stars.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.5 + 0.3, v: Math.random() * 0.5 + 0.1 }); } } function draw() { ctx.clearRect(0, 0, w, h); ctx.fillStyle = 'rgba(255,255,255,0.8)'; stars.forEach(function(p) { p.y -= p.v; if (p.y < -5) { p.y = h + 5; p.x = Math.random() * w; } ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }); requestAnimationFrame(draw); } window.addEventListener('resize', function() { resize(); init(); }); init(); draw(); })();
    </script>
</body>
</html>
