<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dream OS • v3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #10b981; --bg: #010409; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; height: 100vh; overflow: hidden; margin: 0; }
        .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 1.5rem; }
        .arabic-glow { text-shadow: 0 0 25px rgba(16,185,129,0.4); }
    </style>
</head>
<body class="select-none bg-[#010409]">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center p-6 bg-[#010409]">
        <div class="text-center mb-10">
            <img src="assets/logo-sultan.png" class="w-24 h-24 mx-auto rounded-3xl border border-amber-500/20 shadow-2xl mb-6" onerror="this.style.display='none'" onclick="tapLogo()" style="cursor:pointer;">
            <p class="text-4xl font-bold text-white arabic-glow" style="font-family:'Amiri',serif">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ</p>
            <p class="text-sm text-emerald-500/70 mt-2 italic" style="font-family:'Amiri',serif">اَللّٰهُمَّ صَلِّ عَلٰى سَيِّدِنَا مُحَمَّدٍ</p>
        </div>
        <div class="w-full max-w-xs space-y-4">
            <div class="glass rounded-2xl p-1 flex items-center pr-3">
                <input type="password" id="pass" class="flex-1 p-4 bg-transparent text-center outline-none font-mono tracking-[0.5em] text-emerald-400 placeholder-white/20" placeholder="••••">
                <button onclick="togglePass()" class="p-2 text-white/30 hover:text-emerald-400 transition"><span id="eye">👁️</span></button>
            </div>
            <button onclick="doLogin()" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 font-bold rounded-xl shadow-lg transition active:scale-95 text-sm tracking-widest uppercase">Access Core</button>
            <button onclick="showGhost()" class="w-full py-2 text-[8px] text-white/20 hover:text-white/50 underline">⚙️ Dev Access (Ghost Mode)</button>
        </div>
        <div id="tap-counter" class="text-[9px] text-emerald-400 font-mono mt-4 opacity-0">Tap 0/7</div>
    </div>

    <!-- GHOST HUB -->
    <div id="ghost-hub" class="fixed inset-0 z-[9999] bg-[#010206] p-6 overflow-y-auto" style="display:none;">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-sm font-black text-teal-400 uppercase tracking-widest">Stealth War Room</h2>
            <button onclick="hideGhost()" class="text-white/40 text-sm">Close</button>
        </div>
        <div id="ghost-tools-grid" class="grid grid-cols-3 gap-3 mb-6"></div>
        <div id="ghost-log" class="glass rounded-xl p-4 font-mono text-[10px] text-emerald-400 h-64 overflow-y-auto bg-black/50"></div>
    </div>

    <!-- MAIN APP -->
    <div id="main-app" style="display:none;" class="flex-col h-full bg-[#010409]">
        <header class="pt-8 pb-4 px-6 text-center">
            <img src="assets/logo-sultan.png" class="w-12 h-12 mx-auto rounded-2xl border border-amber-500/20 shadow-lg mb-2 cursor-pointer" onclick="tapLogo()">
            <h1 class="text-2xl font-bold text-white arabic-glow" style="font-family:'Amiri',serif">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ</h1>
        </header>
        <main class="flex-1 overflow-y-auto px-6 pb-32 space-y-6">
            <div class="grid grid-cols-3 gap-3.5 mt-4 pb-24">
                <div onclick="openMod('ai')" class="glass p-4 rounded-2xl text-center active:scale-95 transition cursor-pointer"><span class="text-2xl">🧠</span><p class="text-[11px] font-bold mt-2">AI Core</p></div>
                <div onclick="openMod('cmd')" class="glass p-4 rounded-2xl text-center active:scale-95 transition cursor-pointer"><span class="text-2xl">📊</span><p class="text-[11px] font-bold mt-2">CMD</p></div>
                <div onclick="openMod('book')" class="glass p-4 rounded-2xl text-center active:scale-95 transition cursor-pointer"><span class="text-2xl">📅</span><p class="text-[11px] font-bold mt-2">Booking</p></div>
                <div onclick="openMod('k3')" class="glass p-4 rounded-2xl text-center active:scale-95 transition cursor-pointer"><span class="text-2xl">⚠️</span><p class="text-[11px] font-bold mt-2">K3</p></div>
                <div onclick="openMod('sec')" class="glass p-4 rounded-2xl text-center active:scale-95 transition cursor-pointer"><span class="text-2xl">🛡️</span><p class="text-[11px] font-bold mt-2">Security</p></div>
                <div onclick="openMod('in')" class="glass p-4 rounded-2xl text-center active:scale-95 transition cursor-pointer"><span class="text-2xl">🧹</span><p class="text-[11px] font-bold mt-2">Janitor In</p></div>
                <div onclick="openMod('out')" class="glass p-4 rounded-2xl text-center active:scale-95 transition cursor-pointer"><span class="text-2xl">🌿</span><p class="text-[11px] font-bold mt-2">Janitor Out</p></div>
                <div onclick="openMod('stok')" class="glass p-4 rounded-2xl text-center active:scale-95 transition cursor-pointer"><span class="text-2xl">📦</span><p class="text-[11px] font-bold mt-2">Stok</p></div>
                <div onclick="openMod('maint')" class="glass p-4 rounded-2xl text-center active:scale-95 transition cursor-pointer"><span class="text-2xl">🔧</span><p class="text-[11px] font-bold mt-2">Maintenance</p></div>
            </div>
        </main>
        <nav class="fixed bottom-0 inset-x-0 h-16 bg-[#010409]/95 border-t border-white/5 flex justify-around items-center z-[20000]">
            <button onclick="nav('HOME')" class="text-emerald-400 flex flex-col items-center"><span class="text-lg">🏠</span><span class="text-[11px] font-bold">Home</span></button>
            <button onclick="nav('PROFILE')" class="text-white/40 flex flex-col items-center"><span class="text-lg">👤</span><span class="text-[11px] font-bold">Profile</span></button>
            <button onclick="nav('QR')" class="text-white/40 flex flex-col items-center"><span class="text-lg">📱</span><span class="text-[11px] font-bold">QR</span></button>
            <button onclick="nav('ABOUT')" class="text-white/40 flex flex-col items-center"><span class="text-lg">ℹ️</span><span class="text-[11px] font-bold">About</span></button>
            <button onclick="nav('SETTING')" class="text-white/40 flex flex-col items-center"><span class="text-lg">⚙️</span><span class="text-[11px] font-bold">Setting</span></button>
        </nav>
    </div>

    <script src="core.js"></script>
    <script>
        // ========== LOGIN (DIPERBAIKI) ==========
        window.togglePass = () => {
            const inp = document.getElementById('pass');
            const eye = document.getElementById('eye');
            if (!inp || !eye) return;
            if (inp.type === 'password') { inp.type = 'text'; eye.innerText = '🔒'; }
            else { inp.type = 'password'; eye.innerText = '👁️'; }
        };
        window.doLogin = () => {
            const pass = document.getElementById('pass').value;
            if (pass !== 'b15m1ll4h_012443410') { alert('Password Salah. Gunakan: b15m1ll4h_012443410'); return; }
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            document.getElementById('ghost-hub').style.display = 'none';
        };
        window.showGhost = () => {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('ghost-hub').style.display = 'block';
            renderGhostTools();
        };
        window.hideGhost = () => {
            document.getElementById('ghost-hub').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
        };

        // ========== GHOST MODE ==========
        let taps = 0, tapTimer;
        window.tapLogo = () => {
            taps++;
            const counter = document.getElementById('tap-counter');
            if (counter) { counter.textContent = 'Tap ' + taps + '/7'; counter.style.opacity = '1'; setTimeout(() => { counter.style.opacity = '0'; }, 1500); }
            if (taps >= 7) { taps = 0; document.getElementById('ghost-hub').style.display = 'block'; renderGhostTools(); }
            clearTimeout(tapTimer); tapTimer = setTimeout(() => { taps = 0; }, 2000);
        };

        const GhostTools = [
            { label: 'Eruda Debug', icon: '💻', action: () => { let s = document.createElement('script'); s.src = '//cdn.jsdelivr.net/npm/eruda'; document.body.appendChild(s); s.onload = () => { eruda.init(); eruda.show(); }; } },
            { label: 'NMAP Recon', icon: '🕸️', action: () => { log('NMAP Recon ready'); } },
            { label: 'T-Shark', icon: '🦈', action: () => { log('T-Shark ready'); } },
            { label: 'OSINT Spider', icon: '🕷️', action: () => { log('OSINT Spider ready'); } },
            { label: 'System Health', icon: '📈', action: () => { log('All systems nominal'); } },
            { label: 'Self-Destruct', icon: '☠️', action: () => { if (confirm('Hapus semua data?')) { localStorage.clear(); location.reload(); } } }
        ];
        const log = (msg) => {
            const el = document.getElementById('ghost-log');
            if (el) { el.innerHTML += '> ' + msg + '\n'; el.scrollTop = el.scrollHeight; }
        };
        const renderGhostTools = () => {
            const grid = document.getElementById('ghost-tools-grid');
            if (!grid) return;
            grid.innerHTML = GhostTools.map(t => '<button onclick="(' + t.action.toString() + ')()" class="glass p-3 rounded-2xl text-center active:scale-95 transition"><span class="text-2xl">' + t.icon + '</span><p class="text-[9px] font-bold mt-1">' + t.label + '</p></button>').join('');
        };

        // ========== MODUL LOADER ==========
        window.openMod = (id) => {
            if (typeof loadModuleGeneric !== 'function') { alert('Module loader not ready'); return; }
            const urls = { ai: 'js/modules/ai-core.html', cmd: 'js/modules/command.html', book: 'js/modules/booking.html', k3: 'js/modules/k3.html', maint: 'js/modules/maintenance.html', asset: 'js/modules/asset.html', stok: 'js/modules/stok.html', sec: 'js/modules/security.html', in: 'js/modules/janitor-in.html', out: 'js/modules/janitor-out.html' };
            if (urls[id]) window.loadModuleGeneric(id, urls[id]);
        };
        window.nav = (name) => {
            if (name === 'HOME') { document.querySelectorAll('[id$="-module"]').forEach(el => el.style.display = 'none'); }
            else { alert('Navigasi: ' + name); }
        };
    </script>
</body>
</html>
