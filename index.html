  <script>
    window.SecureStore = {
      set(k, v) { try { localStorage.setItem(k, btoa(JSON.stringify(v))); } catch(e){} },
      get(k) { try { const b = localStorage.getItem(k); return b ? JSON.parse(atob(b)) : null; } catch(e){ return null; } }
    };

    window.showToast = (msg, type='info') => {
      let c = document.getElementById('toast-container');
      if(!c) { c = document.createElement('div'); c.id='toast-container'; c.className='toast-container'; document.body.appendChild(c); }
      const t = document.createElement('div'); t.className = `toast ${type}`; t.textContent = msg;
      c.appendChild(t); setTimeout(() => t.remove(), 3500);
    };

    document.addEventListener('DOMContentLoaded', function() {
      window.hapticTap = function(intensity = 'light') {
        if ('vibrate' in navigator) navigator.vibrate(intensity === 'heavy' ? 30 : 10);
      };

      const ROLE_PERMISSIONS = {
        dev: ['cmd','security','security_edit_jadwal','k3','janitor-indoor','janitor-outdoor','booking','asset','stok','maintenance','dana','users','audit','profile','qr','about','setting'],
        kabag_umum: ['cmd','security','security_edit_jadwal','k3','janitor-indoor','janitor-outdoor','booking','asset','stok','maintenance','dana','users','audit','profile','qr','about','setting'],
        koordinator_umum: ['cmd','security','k3','booking','asset','stok','maintenance','dana','users','audit','janitor-indoor','janitor-outdoor','profile','qr','about','setting'],
        staff: ['profile','qr','about','setting']
      };

      function getStoredUser() {
        try { return JSON.parse(localStorage.getItem('dreamos_bound_user') || '{}'); } catch(e) { return {}; }
      }
      window.getUserRole = function() { return getStoredUser().role || 'staff'; };
      function canAccess(moduleId) { return (ROLE_PERMISSIONS[window.getUserRole()] || ROLE_PERMISSIONS.staff || []).includes(moduleId); }

      const loginBtn = document.getElementById('login-button');
      const emailInput = document.getElementById('email-input');
      const passwordInput = document.getElementById('password-input');
      const errorEl = document.getElementById('error-msg');

      document.getElementById('toggle-pin')?.addEventListener('click', function() {
        passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
        this.textContent = passwordInput.type === 'password' ? '🔒' : '🔓';
      });

      loginBtn?.addEventListener('click', async function() {
        const email = emailInput?.value.trim() || '';
        const password = passwordInput?.value || '';
        if (!email || !password) { errorEl.textContent = '⛔ Email & Password wajib diisi!'; errorEl.style.display = 'block'; return; }
        
        loginBtn.textContent = '⏳ Connecting...'; loginBtn.disabled = true;
        try {
          const res = await window.doSecureLogin(email, password, '');
          const userData = { id: res.user.id, email: res.user.email, nama: res.user.nama, role: res.user.role, source: res.source };
          localStorage.setItem('dreamos_bound_user', JSON.stringify(userData));
          localStorage.setItem('dreamos_session_active', 'true');
          showDashboard();
        } catch(e) {
          errorEl.textContent = '⛔ ' + e.message; errorEl.style.display = 'block';
          loginBtn.textContent = '⚡ ACCESS CORE'; loginBtn.disabled = false;
        }
      });

      function showDashboard() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        document.getElementById('bottom-nav').style.display = 'block';
        renderDashboard();
      }

      window.renderDashboard = function() {
        const container = document.getElementById('dashboard-container');
        if (!container) return;
        
        container.innerHTML = `
          <div class="header-main glass" style="position: relative;">
            <span class="notif-bell" onclick="toggleNotif()" title="Notifikasi" style="position: absolute; top: 1rem; right: 1rem; font-size: 1.4rem; cursor: pointer;">🔔<span class="notif-badge" id="notif-badge"></span></span>
            <img src="assets/logo-sultan.png" class="login-logo" style="width:60px;height:60px; margin-bottom: 1rem;" onerror="this.style.display='none'">
            <div class="arabic">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم</div>
            <div class="shalawat" style="margin-bottom:0.5rem;">اَللّٰهُمَّ صَلِّ عَلٰى سَيِّدِنَا مُحَمَّدٍ</div>
          </div>
          
          <div id="kpi-strip"></div>
          <div id="health-bar"></div>

          <div id="dash-slider" class="glass">
            <div class="slide-track" id="slide-track">
              <div class="slide-item" id="slide-1">⏳ Memuat Jadwal Security...</div>
              <div class="slide-item" id="slide-2">⏳ Memuat Booking...</div>
              <div class="slide-item" id="slide-3">⏳ Memuat Laporan K3...</div>
            </div>
            <div class="slide-indicators" id="slide-dots"></div>
          </div>

          <!-- 📊 SINGLE UNIFIED CANVAS CHART (BURSA / MARKET STYLE) - SATU LAYAR MENYATU -->
          <div id="unified-chart-container">
            <div class="chart-header">
              <div>
                <div class="chart-title">📊 Enterprise Live Analytics (8 Modul Utama)</div>
                <div class="chart-subtitle">Analisis Terpadu Berbasis Chart.js Dual-Axis (Bar & Growth Trend)</div>
              </div>
              <div style="font-size:0.7rem; color:var(--neon); background:rgba(0,255,157,0.1); padding:0.3rem 0.6rem; border-radius:8px; border:1px solid rgba(0,255,157,0.3);">LIVE SYNC</div>
            </div>
            <div class="unified-canvas-wrapper">
              <canvas id="unifiedMarketChart"></canvas>
            </div>
          </div>

          <div class="module-grid" id="module-grid"></div>

          <div class="system-info-box glass">
            <strong>Dream OS Enterprise RBAC v1.0 Beta</strong><br>
            ISO 27001 • ISO 9001 • ISO 55001 Ready<br>
            Engineered by Family Dream Team<br>
            <span style="color:var(--accent);">The Power Soul Of Shalawat</span>
          </div>
        `;

        const modules = [
          { i:'🌍', n:'CMD Center', id:'cmd' },
          { i:'🛡️', n:'Security Ops', id:'security' },
          { i:'⚠️', n:'K3 Safety', id:'k3' },
          { i:'🏠', n:'Jan Indoor', id:'janitor-indoor' },
          { i:'🌳', n:'Jan Outdoor', id:'janitor-outdoor' },
          { i:'📅', n:'Booking', id:'booking' },
          { i:'🏢', n:'Asset', id:'asset' },
          { i:'📦', n:'Stok Gudang', id:'stok' },
          { i:'🔧', n:'Maintenance', id:'maintenance' }
        ];

        const grid = document.getElementById('module-grid');
        if (grid) {
          modules.forEach(m => {
            const card = document.createElement('div');
            card.className = 'mod-card';
            card.innerHTML = `<div class="mod-status"></div><div class="mod-icon">${m.i}</div><div class="mod-title">${m.n}</div>`;
            card.addEventListener('click', () => { window.hapticTap('light'); window.openMod(m.id); });
            grid.appendChild(card);
          });
        }

        // Render Single Unified Chart
        setTimeout(() => {
          const canvasEl = document.getElementById('unifiedMarketChart');
          if (!canvasEl || typeof Chart === 'undefined') return;

          const bookings = JSON.parse(localStorage.getItem('dreamos_bookings') || '[]');
          const k3 = JSON.parse(localStorage.getItem('dreamos_k3_reports') || '[]');
          const dana = JSON.parse(localStorage.getItem('dreamos_dana') || '[]');
          const stok = JSON.parse(localStorage.getItem('dreamos_stok_gudang') || '[]');

          const labels = ['Total Booking', 'Booking Pending', 'Total K3', 'K3 Pending', 'Pengajuan Dana', 'Dana Pending', 'Total Stok', 'Stok Menipis'];
          const barData = [
            bookings.length, bookings.filter(b=>b.status==='pending').length,
            k3.length, k3.filter(k=>k.status==='pending').length,
            dana.length, dana.filter(d=>d.status==='pending').length,
            stok.length, stok.filter(s=>Number(s.quantity||s.jumlah||0)<5).length
          ];
          const lineTrendData = barData.map((v, i) => Math.max(5, v * 12 + (i * 3)));

          if (window._unifiedChartInstance) window._unifiedChartInstance.destroy();

          window._unifiedChartInstance = new Chart(canvasEl.getContext('2d'), {
            type: 'bar',
            data: {
              labels: labels,
              datasets: [
                {
                  label: 'Volume Modul (Batang)',
                  data: barData,
                  backgroundColor: 'rgba(0, 255, 157, 0.65)',
                  borderColor: '#00ff9d',
                  borderWidth: 1.5,
                  borderRadius: 6,
                  yAxisID: 'y',
                  order: 2
                },
                {
                  label: 'Indeks Pertumbuhan (%)',
                  data: lineTrendData,
                  type: 'line',
                  borderColor: '#0ea5e9',
                  backgroundColor: 'rgba(14, 165, 233, 0.2)',
                  borderWidth: 3,
                  pointBackgroundColor: '#0ea5e9',
                  pointRadius: 4,
                  tension: 0.35,
                  yAxisID: 'y1',
                  order: 1
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { position: 'bottom', labels: { color: '#cbd5e1', font: { size: 10 } } },
                tooltip: { backgroundColor: 'rgba(15, 23, 42, 0.95)', titleColor: '#00ff9d', bodyColor: '#e2e8f0' }
              },
              scales: {
                x: { ticks: { color: '#94a3b8', font: { size: 9 }, maxRotation: 25 }, grid: { display: false } },
                y: { type: 'linear', position: 'left', ticks: { color: '#94a3b8' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                y1: { type: 'linear', position: 'right', ticks: { color: '#0ea5e9', callback: v => v + '%' }, grid: { display: false } }
              }
            }
          });
        }, 300);
      };

      window.goHome = function() {
        const c = document.getElementById('mod-container');
        if (c) { c.style.display = 'none'; c.innerHTML = ''; }
        document.getElementById('main-app').style.display = 'block';
        document.getElementById('bottom-nav').style.display = 'block';
        window.scrollTo(0, 0);
      };

      window.openMod = function(moduleId) {
        const map = {
          cmd:'commandcenter.html', security:'security.html', k3:'k3.html',
          'janitor-indoor':'janitor-indoor.html', 'janitor-outdoor':'janitor-outdoor.html',
          booking:'booking.html', asset:'asset.html', stok:'stok.html', maintenance:'maintenance.html',
          profile:'profile.html', qr:'qr.html', about:'about.html', setting:'setting.html'
        };
        const file = map[moduleId];
        if (!file) { window.showToast('⛔ Modul tidak dikenali.', 'error'); return; }

        let c = document.getElementById('mod-container');
        if (!c) {
          c = document.createElement('div'); c.id = 'mod-container';
          c.style.cssText = 'position:fixed;inset:0;z-index:9995;overflow-y:auto;background:#0a0e27 !important;padding-bottom:5rem;';
          document.body.appendChild(c);
        } else {
          c.style.display = 'block';
          c.innerHTML = '';
        }

        document.getElementById('main-app').style.display = 'none';
        document.getElementById('bottom-nav').style.display = 'none';

        fetch(file + '?v=' + Date.now())
          .then(res => { if (!res.ok) throw new Error('404'); return res.text(); })
          .then(html => {
            c.innerHTML = html;
            c.querySelectorAll('script').forEach(s => {
              const ns = document.createElement('script');
              if (s.src) ns.src = s.src; else ns.textContent = s.textContent;
              document.body.appendChild(ns);
            });
          })
          .catch(() => {
            c.innerHTML = `<div style="color:#cbd5e1;padding:4rem;text-align:center;"><h3>🚧 Modul Dalam Pengembangan</h3><button onclick="window.goHome()" style="margin-top:1rem;padding:0.8rem 2rem;background:#0ea5e9;color:white;border:none;border-radius:12px;cursor:pointer;">🏠 Kembali</button></div>`;
          });
      };

      document.getElementById('bottom-nav').addEventListener('click', function(e) {
        const item = e.target.closest('.nav-item');
        if (!item) return;
        const mod = item.dataset.mod;
        const nav = item.dataset.nav;
        if (mod) window.openMod(mod);
        if (nav === 'home') window.goHome();
        document.querySelectorAll('#bottom-nav .nav-item').forEach(n => n.classList.remove('active'));
        item.classList.add('active');
      });

      if (localStorage.getItem('dreamos_session_active') === 'true') {
        const user = getStoredUser();
        if (user.role) showDashboard();
      }
    });
  </script>
</body>
</html>
