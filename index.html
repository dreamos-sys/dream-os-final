<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dream OS • Enterprise RBAC</title>
  <link rel="manifest" href="manifest.json">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { --neon: #00ff9d; --accent: #0ea5e9; --warning: #e11d48; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:#0a0e27; color:#e2e8f0; font-family:'Inter',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    #login-screen { text-align:center; max-width:400px; width:100%; padding:2rem; }
    .login-logo { width:100px; height:100px; border-radius:24px; margin-bottom:2rem; }
    .arabic { font-size:2.2rem; color:var(--neon); margin-bottom:0.5rem; }
    .shalawat { font-size:1rem; color:var(--accent); margin-bottom:3rem; }
    .input-wrapper { position:relative; margin-bottom:1.5rem; }
    .pin-input { width:100%; padding:1.2rem; background:rgba(0,0,0,0.6); border:2px solid rgba(0,255,157,0.3); border-radius:16px; color:var(--neon); font-size:1.2rem; text-align:center; outline:none; }
    .toggle-pin { position:absolute; right:1rem; top:50%; transform:translateY(-50%); cursor:pointer; font-size:1.5rem; color:var(--neon); }
    .access-btn { width:100%; padding:1.2rem; background:#10b981; color:white; border:none; border-radius:16px; font-size:1.1rem; font-weight:700; cursor:pointer; }
    .access-btn:active { background:#059669; }
    .error-msg { color:var(--warning); margin-top:1rem; display:none; }
  </style>
</head>
<body>
  <div id="login-screen">
    <img src="assets/logo-sultan.png" alt="Dream OS" class="login-logo" onerror="this.style.display='none'">
    <div class="arabic">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم</div>
    <div class="shalawat">اَللّٰهُمَّ صَلِّ عَلٰى سَيِّدِنَا مُحَمَّدٍ</div>
    <div class="input-wrapper">
      <input type="email" id="email-input" class="pin-input" placeholder="📧 EMAIL" autocomplete="email">
    </div>
    <div class="input-wrapper">
      <input type="password" id="password-input" class="pin-input" placeholder="🔐 PASSWORD">
      <span class="toggle-pin" id="toggle-pin">👁️</span>
    </div>
    <button class="access-btn" id="login-button">⚡ ACCESS CORE</button>
    <div class="error-msg" id="error-msg"></div>
  </div>

  <!-- Tidak ada CSP, tidak ada service worker, script di akhir -->
  <script>
    // Matikan service worker jika ada
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        registrations.forEach(reg => reg.unregister());
      });
    }

    document.addEventListener('DOMContentLoaded', function() {
      const toggleBtn = document.getElementById('toggle-pin');
      const loginBtn = document.getElementById('login-button');
      const emailInp = document.getElementById('email-input');
      const passInp = document.getElementById('password-input');
      const errEl = document.getElementById('error-msg');

      // Toggle password
      toggleBtn.addEventListener('click', function() {
        if (passInp.type === 'password') {
          passInp.type = 'text'; toggleBtn.textContent = '🙈';
        } else {
          passInp.type = 'password'; toggleBtn.textContent = '👁️';
        }
      });

      // Enter key
      emailInp.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') passInp.focus();
      });
      passInp.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') loginBtn.click();
      });

      // Login action
      loginBtn.addEventListener('click', async function() {
        const email = emailInp.value.trim();
        const password = passInp.value;
        errEl.style.display = 'none';

        if (!email || !password) {
          errEl.textContent = '⛔ Email dan password harus diisi!';
          errEl.style.display = 'block';
          return;
        }

        // Dev bypass
        if (email === 'dev@dream.os' && password === 'devbypass') {
          localStorage.setItem('dreamos_bound_user', JSON.stringify({
            id: 'dev', email: email, nama: 'Developer', role: 'dev'
          }));
          localStorage.setItem('dreamos_session_active', 'true');
          alert('✅ Dev Mode aktif! Silakan reload halaman.');
          location.reload();
          return;
        }

        // Login Supabase
        loginBtn.textContent = '⏳ Connecting...';
        loginBtn.disabled = true;

        try {
          // Inisialisasi Supabase secara inline
          const sb = window.supabase.createClient(
            'https://gbigjdhifispatrrskgh.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdiaWdqZGhpZmlzcGF0cnJza2doIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNzY1OTIsImV4cCI6MjA5Njc1MjU5Mn0.eqAFloptEHV3oIUjortuTsWvkhJgjb3xsXHM9nXfF8k'
          );

          const { data, error } = await sb.auth.signInWithPassword({ email, password });

          if (error) {
            errEl.textContent = '⛔ ' + error.message;
            errEl.style.display = 'block';
            loginBtn.textContent = '⚡ ACCESS CORE';
            loginBtn.disabled = false;
            return;
          }

          localStorage.setItem('dreamos_bound_user', JSON.stringify({
            id: data.user.id,
            email: data.user.email,
            nama: data.user.user_metadata?.nama || email.split('@')[0],
            role: data.user.user_metadata?.role || 'staff'
          }));
          localStorage.setItem('dreamos_session_active', 'true');
          alert('✅ Login berhasil! Dashboard akan dimuat.');
          location.reload();
        } catch(e) {
          errEl.textContent = '⚠️ Error: ' + e.message;
          errEl.style.display = 'block';
          loginBtn.textContent = '⚡ ACCESS CORE';
          loginBtn.disabled = false;
        }
      });

      // Auto-login jika sudah ada sesi
      if (localStorage.getItem('dreamos_session_active') === 'true') {
        document.getElementById('login-screen').innerHTML = 
          '<h2 style="color:var(--neon)">✅ Anda sudah login.</h2><p>Dashboard akan hadir.</p>';
      }

      console.log('✅ Semua event listener terpasang!');
    });
  </script>

  <!-- Supabase di akhir, tanpa async/defer -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</body>
</html>
