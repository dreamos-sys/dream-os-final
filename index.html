<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dream OS • v2.4 Enlarged Nav</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #10b981; --bg: #010409; --glass: rgba(255,255,255,0.03); }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; height: 100vh; overflow: hidden; }
        .glass { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
        .arabic-glow { text-shadow: 0 0 25px rgba(16,185,129,0.4); }
    </style>
</head>
<body class="select-none bg-[#010409]">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center p-6 bg-[#010409]">
        <div class="text-center mb-10">
            <img src="assets/logo-sultan.png" class="w-24 h-24 mx-auto rounded-3xl border border-amber-500/20 shadow-2xl mb-6" onerror="this.style.display='none'">
            <p class="text-4xl font-bold text-white arabic-glow" style="font-family:'Amiri',serif">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ</p>
            <p class="text-sm text-emerald-500/70 mt-2 italic" style="font-family:'Amiri',serif">اَللّٰهُمَّ صَلِّ عَلٰى سَيِّدِنَا مُحَمَّدٍ</p>
        </div>
        <div class="w-full max-w-xs space-y-4">
            <div class="glass rounded-2xl p-1 flex items-center pr-3">
                <input type="password" id="pass" class="flex-1 p-4 bg-transparent text-center outline-none font-mono tracking-[0.5em] text-emerald-400 placeholder-white/20" placeholder="••••">
                <button onclick="togglePass()" class="p-2 text-white/30 hover:text-emerald-400 transition">👁️</button>
            </div>
            <button onclick="login()" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 font-bold rounded-xl shadow-lg transition active:scale-95 text-[10px] tracking-widest uppercase">Access Core</button>
            <p class="text-[8px] text-white/30 text-center">Default: b15m1ll4h_012443410</p>
        </div>
    </div>

    <!-- GHOST HUB -->
    <div id="ghost-hub" class="fixed inset-0 z-[9999] bg-[#010206] p-6 overflow-y-auto flex-col" style="display:none;">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-sm font-black text-teal-400 uppercase">Stealth War Room</h2>
            <button onclick="document.getElementById('ghost-hub').style.display='none'" class="text-white/40 text-sm">Close</button>
        </div>
        <div id="ghost-tools-grid" class="grid grid-cols-3 gap-3 mb-6"></div>
        <div id="ghost-log" class="glass rounded-xl p-4 font-mono text-[10px] text-emerald-400 h-64 overflow-y-auto bg-black/50"></div>
    </div>

    <!-- MAIN APP -->
    <div id="main-app" class="hidden flex-col h-full bg-[#010409]">        <header class="pt-8 pb-4 px-6 text-center">
            <img src="assets/logo-sultan.png" class="w-12 h-12 mx-auto rounded-2xl border border-amber-500/20 shadow-lg mb-2 cursor-pointer" onclick="tapLogo()">
            <div id="tap-counter" class="text-[9px] text-emerald-400 font-mono opacity-0 transition-opacity">Tap 0/7</div>
            <h1 class="text-2xl font-bold text-white arabic-glow mt-2" style="font-family:'Amiri',serif">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ</h1>
        </header>

        <main class="flex-1 overflow-y-auto px-6 pb-32">
            <div id="module-grid" class="grid grid-cols-3 gap-3.5 mt-4">
                <div onclick="openMod('ai')" class="glass p-4 rounded-2xl text-center active:scale-95 transition cursor-pointer"><span class="text-2xl">🧠</span><p class="text-[11px] font-bold mt-2">AI Core</p></div>
                <div onclick="openMod('cmd')" class="glass p-4 rounded-2xl text-center active:scale-95 transition cursor-pointer"><span class="text-2xl">📊</span><p class="text-[11px] font-bold mt-2">CMD</p></div>
                <div onclick="openMod('book')" class="glass p-4 rounded-2xl text-center active:scale-95 transition cursor-pointer"><span class="text-2xl">📅</span><p class="text-[11px] font-bold mt-2">Booking</p></div>
                <div onclick="openMod('k3')" class="glass p-4 rounded-2xl text-center active:scale-95 transition cursor-pointer"><span class="text-2xl">⚠️</span><p class="text-[11px] font-bold mt-2">K3</p></div>
                <div onclick="openMod('sec')" class="glass p-4 rounded-2xl text-center active:scale-95 transition cursor-pointer"><span class="text-2xl">🛡️</span><p class="text-[11px] font-bold mt-2">Security</p></div>
                <div onclick="openMod('in')" class="glass p-4 rounded-2xl text-center active:scale-95 transition cursor-pointer"><span class="text-2xl">🧹</span><p class="text-[11px] font-bold mt-2">Janitor In</p></div>
                <div onclick="openMod('out')" class="glass p-4 rounded-2xl text-center active:scale-95 transition cursor-pointer"><span class="text-2xl">🌿</span><p class="text-[11px] font-bold mt-2">Janitor Out</p></div>
                <div onclick="openMod('stok')" class="glass p-4 rounded-2xl text-center active:scale-95 transition cursor-pointer"><span class="text-2xl">📦</span><p class="text-[11px] font-bold mt-2">Stok</p></div>
                <div onclick="openMod('maint')" class="glass p-4 rounded-2xl text-center active:scale-95 transition cursor-pointer"><span class="text-2xl">🔧</span><p class="text-[11px] font-bold mt-2">Maintenance</p></div>
            </div>
        </main>

        <!-- BOTTOM NAVIGATION - ENLARGED v2.4 -->
        <nav class="fixed bottom-0 inset-x-0 h-24 bg-[#010409]/95 backdrop-blur-md border-t border-white/10 flex justify-around items-center z-[20000] pb-2">
            <button onclick="navAlert('HOME')" class="text-emerald-400 flex flex-col items-center justify-center gap-1 active:scale-90 transition-all">
                <span class="text-3xl drop-shadow-[0_0_8px_rgba(16,185,129,0.5)]">🏠</span>
                <span class="text-xs font-bold uppercase tracking-wide">Home</span>
            </button>
            <button onclick="navAlert('PROFILE')" class="text-white/40 hover:text-white/80 flex flex-col items-center justify-center gap-1 active:scale-90 transition-all">
                <span class="text-3xl">👤</span>
                <span class="text-xs font-bold uppercase tracking-wide">Profile</span>
            </button>
            <button onclick="navAlert('QR')" class="text-white/40 hover:text-white/80 flex flex-col items-center justify-center gap-1 active:scale-90 transition-all">
                <span class="text-3xl">📱</span>
                <span class="text-xs font-bold uppercase tracking-wide">QR</span>
            </button>
            <button onclick="navAlert('ABOUT')" class="text-white/40 hover:text-white/80 flex flex-col items-center justify-center gap-1 active:scale-90 transition-all">
                <span class="text-3xl">ℹ️</span>
                <span class="text-xs font-bold uppercase tracking-wide">About</span>
            </button>
            <button onclick="navAlert('SETTING')" class="text-white/40 hover:text-white/80 flex flex-col items-center justify-center gap-1 active:scale-90 transition-all">
                <span class="text-3xl">⚙️</span>
                <span class="text-xs font-bold uppercase tracking-wide">Setting</span>
            </button>
        </nav>
    </div>

    <script>
        // LOGIN FUNCTIONS
        window.togglePass = () => {
            const inp = document.getElementById('pass');
            if (inp.type === 'password') { inp.type = 'text'; }            else { inp.type = 'password'; }
        };

        window.login = () => {
            const pass = document.getElementById('pass').value;
            const correctPass = 'b15m1ll4h_012443410';
            
            if (pass !== correctPass) { 
                alert('❌ Password Salah!\n\nPassword: ' + correctPass); 
                return; 
            }
            
            document.getElementById('login-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'flex';
                document.getElementById('main-app').classList.remove('hidden');
            }, 300);
        };

        // GHOST MODE (7-tap logo)
        let taps = 0, tapTimer;
        window.tapLogo = () => {
            taps++;
            const counter = document.getElementById('tap-counter');
            if (counter) { 
                counter.textContent = 'Tap ' + taps + '/7'; 
                counter.style.opacity = '1'; 
                setTimeout(() => { counter.style.opacity = '0'; }, 1500); 
            }
            if (taps >= 7) { 
                taps = 0; 
                document.getElementById('ghost-hub').style.display = 'flex'; 
                renderGhostTools(); 
            }
            clearTimeout(tapTimer); 
            tapTimer = setTimeout(() => { taps = 0; }, 2000);
        };

        // GHOST TOOLS
        const GhostTools = [
            { label: 'Eruda', icon: '💻', action: () => { 
                let s = document.createElement('script'); 
                s.src = '//cdn.jsdelivr.net/npm/eruda'; 
                document.body.appendChild(s); 
                s.onload = () => { eruda.init(); eruda.show(); }; 
            }},
            { label: 'NMAP', icon: '🕸️', action: () => log('NMAP Recon ready') },
            { label: 'T-Shark', icon: '🦈', action: () => log('T-Shark ready') },
            { label: 'OSINT', icon: '🕷️', action: () => log('OSINT Spider ready') },            { label: 'Health', icon: '📈', action: () => log('All systems nominal') },
            { label: 'Wipe', icon: '☠️', action: () => { 
                if (confirm('Hapus semua data?')) { localStorage.clear(); location.reload(); } 
            }}
        ];

        const log = (msg) => {
            const el = document.getElementById('ghost-log');
            if (el) { 
                el.innerHTML += '> ' + msg + '\n'; 
                el.scrollTop = el.scrollHeight; 
            }
        };

        const renderGhostTools = () => {
            const grid = document.getElementById('ghost-tools-grid');
            if (!grid) return;
            grid.innerHTML = GhostTools.map(t => 
                '<button onclick="(' + t.action.toString() + ')()" class="glass p-3 rounded-2xl text-center active:scale-95 transition"><span class="text-2xl">' + t.icon + '</span><p class="text-[9px] font-bold mt-1">' + t.label + '</p></button>'
            ).join('');
        };

        // MODULE LOADER
        window.openMod = (id) => {
            alert('Module: ' + id.toUpperCase() + '\n\nNote: Full module loading requires core.js');
        };

        window.navAlert = (name) => {
            if (name === 'HOME') { 
                document.querySelectorAll('[id$="-module"]').forEach(el => el.style.display = 'none'); 
            } else { 
                alert('Navigasi: ' + name); 
            }
        };

        // Enter key support
        document.addEventListener('DOMContentLoaded', () => {
            const passInput = document.getElementById('pass');
            if (passInput) {
                passInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') login();
                });
            }
        });
    </script>
</body>
</html>
