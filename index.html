  <style>
    :root { --neon: #00ff9d; --accent: #0ea5e9; --warning: #e11d48; --gold: #d4af37; --glass-bg: rgba(10, 15, 30, 0.6); --glass-border: rgba(0, 255, 157, 0.2); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0e27; color: #e2e8f0; font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; }
    canvas#star-field { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
    .glass { background: rgba(15, 23, 42, 0.7) !important; backdrop-filter: blur(24px); border: 1px solid var(--glass-border); border-radius: 24px; }
    #login-screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(10, 14, 39, 0.95); z-index: 10000; transition: opacity 0.5s; }
    .login-container { text-align: center; max-width: 400px; width: 100%; padding: 2rem; }
    .login-logo { width: 100px; height: 100px; border-radius: 24px; margin-bottom: 2rem; }
    .arabic { font-family: 'Scheherazade New', serif; font-size: 2.2rem; color: var(--neon); text-shadow: 0 0 30px rgba(0,255,157,0.6); margin-bottom: 0.5rem; }
    .shalawat { font-family: 'Scheherazade New', serif; font-size: 1rem; color: var(--accent); margin-bottom: 2rem; }
    .input-wrapper { position: relative; margin-bottom: 1.5rem; }
    .pin-input { width: 100%; padding: 1.2rem 4rem 1.2rem 1.5rem; background: rgba(0,0,0,0.6); border: 2px solid rgba(0,255,157,0.3); border-radius: 16px; color: var(--neon); font-family: 'Orbitron', monospace; font-size: 1.2rem; text-align: center; outline: none; }
    .toggle-pin { position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 1.5rem; color: var(--neon); user-select: none; }
    .access-btn { width: 100%; padding: 1.2rem; background: #10b981; color: white; border: none; border-radius: 16px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: all 0.3s; }
    .access-btn:hover { background: #059669; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(16,185,129,0.4); }
    .access-btn:disabled { opacity: 0.7; cursor: not-allowed; }
    .error-msg { color: var(--warning); font-size: 0.9rem; margin-top: 1rem; display: none; }
    #main-app { display: none; position: relative; z-index: 10; padding-bottom: 6rem; min-height: 100vh; }
    .header-main { padding: 2rem 1.5rem 1rem; text-align: center; margin: 1.5rem; }
    .user-role-badge { display: inline-block; background: rgba(212,175,55,0.2); color: var(--gold); padding: 0.3rem 0.8rem; border-radius: 12px; font-size: 0.7rem; margin: 0.5rem 0; }
    .info-badges { display: flex; justify-content: center; gap: 1rem; margin: 1.5rem 0; flex-wrap: wrap; }
    .badge { padding: 0.5rem 1.2rem; border-radius: 24px; font-size: 0.7rem; color: var(--neon); font-weight: 700; background: rgba(0,255,157,0.1); border: 1px solid rgba(0,255,157,0.3); }
    .badge.online { background: rgba(16,185,129,0.2); color: #10b981; }
    .badge.offline { background: rgba(239,68,68,0.2); color: #ef4444; }
    #prayer-times-dash { font-size: 0.8125rem; color: #cbd5e1; margin-top: 1rem; padding: 0.6rem 1.2rem; background: rgba(0,0,0,0.3); border-radius: 20px; display: inline-block; }
    .module-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; padding: 0 1.5rem; margin-bottom: 2rem; }
    .mod-card { text-align: center; cursor: pointer; padding: 1.5rem 0.5rem; transition: all 0.3s; position: relative; overflow: hidden; }
    .mod-card:hover { transform: translateY(-5px); border-color: var(--neon); box-shadow: 0 12px 40px rgba(0,255,157,0.3); }
    .mod-icon { font-size: 2.2rem; margin-bottom: 0.5rem; }
    .mod-title { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: var(--neon); }
    .mod-status { position: absolute; top: 12px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: #10b981; box-shadow: 0 0 10px #10b981; }
    #bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; padding: 12px 8px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); background: rgba(10, 14, 39, 0.95); border-top: 2px solid rgba(0, 255, 157, 0.3); display: none; }
    .nav-container { display: flex; gap: 8px; max-width: 600px; margin: 0 auto; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 8px; background: rgba(15, 23, 42, 0.6); border: 2px solid rgba(0, 255, 157, 0.2); border-radius: 16px; cursor: pointer; transition: all 0.3s; min-height: 48px; }
    .nav-item.active { background: rgba(0, 255, 157, 0.15); border-color: var(--neon); transform: translateY(-4px); box-shadow: 0 0 20px rgba(0,255,157,0.3); }
    .nav-icon-wrapper { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: rgba(0, 255, 157, 0.2); border-radius: 12px; }
    .nav-icon { font-size: 1.5rem; }
    .nav-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: #cbd5e1; }
    .nav-item.active .nav-label { color: var(--neon); }
    .logout-btn { background: rgba(239,68,68,0.2); border: 1px solid var(--warning); color: var(--warning); padding: 0.5rem 1.5rem; border-radius: 20px; cursor: pointer; font-weight: 600; margin-top: 0.5rem; }
    .system-info-box { text-align: center; font-size: 0.65rem; color: #cbd5e1; margin: 1.5rem; padding: 1.5rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-spinner { width: 30px; height: 30px; border: 3px solid rgba(0,255,157,0.3); border-top-color: var(--neon); border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
    
    /* Mobile Optimization */
    @media screen and (max-width: 768px) {
      .module-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 0.6rem !important; }
      .mod-card { min-height: 110px !important; padding: 1.2rem 0.5rem !important; }
      input, select, textarea { font-size: 16px !important; -webkit-appearance: none; border-radius: 12px; }
    }
    
    /* Accessibility */
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    :focus-visible { outline: 3px solid var(--neon) !important; outline-offset: 2px !important; }
    .skip-link { position: absolute; top: -100px; left: 0; background: var(--neon); color: #000; padding: 8px 16px; z-index: 100000; font-weight: 700; border-radius: 0 0 8px 0; }
    .skip-link:focus { top: 0; }
    
    /* Themes */
    [data-theme="light"] body { background: #f0f4ff !important; color: #1e293b !important; }
    [data-theme="light"] .glass { background: rgba(255, 255, 255, 0.7) !important; border-color: rgba(0, 150, 100, 0.2) !important; }
    [data-high-contrast="true"] body { background: #000 !important; color: #fff !important; }
    [data-high-contrast="true"] .glass { background: rgba(0,0,0,0.9) !important; border: 2px solid #00ff9d !important; }
    [data-reduce-motion="true"] *, [data-reduce-motion="true"] *::before, [data-reduce-motion="true"] *::after { animation-duration: 0.001s !important; transition-duration: 0.001s !important; }
    [dir="rtl"] { direction: rtl; text-align: right; }
    
    /* PWA & Cast */
    .pwa-install-banner { display: none; position: fixed; bottom: 80px; left: 10px; right: 10px; background: rgba(0,255,157,0.1); border: 1px solid #00ff9d; border-radius: 12px; padding: 12px; z-index: 9999; text-align: center; }
    .pwa-install-banner.show { display: block; }
    .cast-btn { position: fixed; bottom: 100px; right: 15px; z-index: 9998; background: rgba(0,255,157,0.2); border: 1px solid #00ff9d; border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .cast-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 99999; align-items: center; justify-content: center; }
    .cast-modal.show { display: flex; }
    .notif-bell { position: relative; cursor: pointer; font-size: 1.4rem; margin-right: 0.8rem; }
    .notif-badge { position: absolute; top: -6px; right: -8px; background: #e11d48; color: white; border-radius: 50%; padding: 0.1rem 0.4rem; font-size: 0.5rem; font-weight: 700; display: none; }
    .notif-panel { position: fixed; top: 60px; right: 10px; width: 320px; max-height: 400px; overflow-y: auto; background: rgba(15,23,42,0.95); border: 1px solid #00ff9d; border-radius: 12px; z-index: 10001; display: none; padding: 0.5rem; }
  </style>
</head>
<body>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // Global Error Handler
    window.onerror = function(msg, url, line) {
      console.error('🚨 Error:', msg, 'at line', line);
      return true;
    };

    document.addEventListener('DOMContentLoaded', function() {
      const SUPABASE_URL = 'https://gbigjdhifispatrrskgh.supabase.co';
      const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdiaWdqZGhpZmlzcGF0cnJza2doIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNzY1OTIsImV4cCI6MjA5Njc1MjU5Mn0.eqAFloptEHV3oIUjortuTsWvkhJgjb3xsXHM9nXfF8k';
      
      window.supabaseClient = null;

      function initSupabase() {
        if (window.supabaseClient) return true;
        try {
          if (typeof window.supabase !== 'undefined') {
            window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            console.log('✅ Supabase ready');
            return true;
          }
        } catch(e) { console.warn('Supabase init retry...'); }
        return false;
      }

      // RBAC Configuration
      const ROLE_PERMISSIONS = {
        dev: ['admin_users','cmd','security','security_edit_jadwal','k3','janitor-indoor','janitor-outdoor','booking','asset','stok','maintenance','dana','profile','qr','about','setting'],
        kabag_umum: ['cmd','security','k3','janitor-indoor','janitor-outdoor','booking','asset','stok','maintenance','dana','profile','qr','about','setting','admin_users'],
        koordinator_umum: ['dana'],
        komandan_regu: ['security', 'security_edit_jadwal'],
        guru: ['booking', 'k3'],
        janitor_indoor: ['janitor-indoor'],
        janitor_outdoor: ['janitor-outdoor'],
        security: ['security'],
        maintenance: ['maintenance'],
        staff: ['profile','qr','about','setting']
      };

      function getStoredUser() {
        try { return JSON.parse(localStorage.getItem('dreamos_bound_user') || '{}'); }
        catch(e) { return {}; }
      }

      window.getUserRole = function() { return getStoredUser().role || 'staff'; };
      function canAccess(moduleId) { return (ROLE_PERMISSIONS[getUserRole()] || ROLE_PERMISSIONS.staff || []).includes(moduleId); }

      // UI Elements
      const togglePinEl = document.getElementById('toggle-pin');
      const loginBtn = document.getElementById('login-button');
      const emailInput = document.getElementById('email-input');
      const passwordInput = document.getElementById('password-input');
      const errorEl = document.getElementById('error-msg');

      // Toggle Password Visibility
      if (togglePinEl && passwordInput) {
        togglePinEl.addEventListener('click', function() {
          passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
          togglePinEl.textContent = passwordInput.type === 'password' ? '🔒' : '🐵';
        });
      }

      // Enter Key Handlers
      emailInput?.addEventListener('keypress', e => { if (e.key === 'Enter') passwordInput?.focus(); });
      passwordInput?.addEventListener('keypress', e => { if (e.key === 'Enter') loginBtn?.click(); });

      // Login Handler
      loginBtn?.addEventListener('click', async function() {
        const email = emailInput?.value.trim() || '';
        const password = passwordInput?.value || '';
        if (errorEl) errorEl.style.display = 'none';

        if (!email || !password) {
          if (errorEl) { errorEl.textContent = '⛔ Email dan password harus diisi!'; errorEl.style.display = 'block'; }
          return;
        }

        loginBtn.textContent = '⏳ Connecting...'; loginBtn.disabled = true;

        if (!window.supabaseClient && !initSupabase()) {
          await new Promise(r => setTimeout(r, 1500));
          if (!window.supabaseClient) {
            if (errorEl) { errorEl.textContent = '️ Gagal menghubungkan ke server.'; errorEl.style.display = 'block'; }
            loginBtn.textContent = '⚡ ACCESS CORE'; loginBtn.disabled = false;
            return;
          }
        }

        try {
          const { data, error } = await window.supabaseClient.auth.signInWithPassword({ email, password });
          
          if (error) throw error;

          const userData = {
            id: data.user.id, 
            email: data.user.email,
            nama: data.user.user_metadata?.nama || email.split('@')[0],
            role: data.user.user_metadata?.role || 'staff'
          };

          localStorage.setItem('dreamos_bound_user', JSON.stringify(userData));
          localStorage.setItem('dreamos_session_active', 'true');
          
          if (window.BankSession) BankSession.create(userData);
          if (window.BankAudit) BankAudit.log('LOGIN_SUCCESS', { email: data.user.email });
          if (window.PhantomAlerter) PhantomAlerter.systemStartup();

          loginBtn.textContent = '✅ Success!';
          setTimeout(() => { 
            showDashboard(); 
            if (window.Presence && userData.id) window.Presence.track(userData.id);
          }, 500);
        } catch(e) {
          if (errorEl) { errorEl.textContent = '⛔ ' + e.message; errorEl.style.display = 'block'; }
          loginBtn.textContent = '⚡ ACCESS CORE'; loginBtn.disabled = false;
        }
      });

      // Show Dashboard
      function showDashboard() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        document.getElementById('bottom-nav').style.display = 'block';
        renderDashboard();
        if (!window._servicesStarted) {
          window._servicesStarted = true;
          // Services sudah dipindahkan ke Tab System di Settings
          // Fungsi startLiveClock, startBatteryMonitor, checkConnection, fetchPrayerTimes
          // sekarang hanya berjalan saat user membuka Tab System
        }
      }

      // Render Dashboard
      window.renderDashboard = function() {
        const container = document.getElementById('dashboard-container');
        if (!container) return;
        
        // UI Beranda Super Clean
        container.innerHTML = 
          '<div class="header-main glass" style="position: relative;">' +
            '<span class="notif-bell" onclick="toggleNotifPanel()" title="Notifikasi" style="position: absolute; top: 1rem; right: 1rem; font-size: 1.4rem; cursor: pointer;">🔔<span class="notif-badge" id="notif-badge"></span></span>' +
            '<img src="assets/logo-sultan.png" class="login-logo" style="width:60px;height:60px; margin-bottom: 1rem;" onerror="this.style.display=\'none\'">' +
            '<div class="arabic">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم</div>' +
            '<div class="shalawat" style="margin-bottom:0.5rem;">اَللّٰهُمَّ صَلِّ عَلٰى سَيِّدِنَا مُحَمَّدٍ</div>' +
          '</div>' +
          '<div class="module-grid" id="module-grid"></div>' +
          '<div class="system-info-box glass">' +
            '<strong>Dream OS Enterprise RBAC v1.0 Beta</strong><br>' +
            'ISO 27001 • ISO 9001 • ISO 55001 Ready<br>' +
            'Engineered by Family Dream Team<br>' +
            '<span style="color:var(--accent);">The Power Soul Of Shalawat</span>' +
          '</div>';

        // Render Modules based on RBAC
        const modules = [
          { i:'🌍', n:'CMD Center', id:'cmd' },
          { i:'🛡️', n:'Security', id:'security' },
          { i:'⚠️', n:'K3 Safety', id:'k3' },
          { i:'🏠', n:'Jan Indoor', id:'janitor-indoor' },
          { i:'🌳', n:'Jan Outdoor', id:'janitor-outdoor' },
          { i:'📅', n:'Booking', id:'booking' },
          { i:'🏢', n:'Asset', id:'asset' },
          { i:'📦', n:'Stok Gudang', id:'stok' },
          { i:'🔧', n:'Maintenance', id:'maintenance' }
        ];

        const grid = document.getElementById('module-grid');
        if (!grid) return;
        grid.innerHTML = '';
        
        modules.forEach(m => {
          if (!canAccess(m.id)) return;
          const card = document.createElement('div');
          card.className = 'mod-card glass';
          card.innerHTML = '<div class="mod-status"></div><div class="mod-icon">' + m.i + '</div><div class="mod-title">' + m.n + '</div>';
          card.addEventListener('click', () => openMod(m.id));
          grid.appendChild(card);
        });

        setActiveNav('home');
      }

      // Navigation Handler
      document.getElementById('bottom-nav').addEventListener('click', function(e) {
        const navItem = e.target.closest('.nav-item');
        if (!navItem) return;
        const mod = navItem.dataset.mod;
        const nav = navItem.dataset.nav;
        if (mod) window.openMod(mod);
        if (nav === 'home') window.goHome();
        setActiveNav(mod || nav || 'home');
      });

      function setActiveNav(nav) {
        document.querySelectorAll('#bottom-nav .nav-item').forEach(n => n.classList.remove('active'));
        let active = document.querySelector(`#bottom-nav .nav-item[data-nav="${nav}"]`) || 
                     document.querySelector(`#bottom-nav .nav-item[data-mod="${nav}"]`);
        if (active) active.classList.add('active');
      }

      // Go Home
      window.goHome = function() {
        const c = document.getElementById('mod-container');
        if (c) { c.style.display = 'none'; c.innerHTML = ''; }
        document.getElementById('main-app').style.display = 'block';
        document.getElementById('bottom-nav').style.display = 'block';
        setActiveNav('home');
      };

      // Open Module
      window.openMod = function(moduleId) {
        if (!canAccess(moduleId)) {
          alert(' Akses Ditolak!');
          return;
        }
        const map = {
          admin_users:'admin_users.html', cmd:'commandcenter.html', security:'security.html',
          security_edit_jadwal:'security_edit_jadwal.html', k3:'k3.html',
          'janitor-indoor':'janitor-indoor.html', 'janitor-outdoor':'janitor-outdoor.html',
          maintenance:'maintenance.html', booking:'booking.html', stok:'stok.html', asset:'asset.html',
          dana:'dana.html', profile:'profile.html', qr:'qr.html', about:'about.html', setting:'setting.html'
        };
        const file = map[moduleId];
        if (!file) return;
        
        let c = document.getElementById('mod-container');
        if (!c) {
          c = document.createElement('div'); c.id = 'mod-container';
          c.style.cssText = 'position:fixed;inset:0;z-index:9995;overflow-y:auto;background:rgba(4,8,20,0.95);padding-bottom:5rem;';
          document.body.appendChild(c);
        }
        c.style.display = 'block';
        c.innerHTML = '<div style="text-align:center;padding:3rem;color:#cbd5e1;"><div class="loading-spinner"></div><p style="margin-top:1rem;">Memuat modul...</p></div>';
        
        if (window.BankAudit) BankAudit.log('OPEN_MODULE', { module: file });
        
        fetch('modules/' + file + '?v=' + Date.now())
          .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
          .then(html => {
            c.innerHTML = html;
            c.querySelectorAll('script').forEach(s => {
              const ns = document.createElement('script');
              if (s.src) ns.src = s.src; else ns.textContent = s.textContent;
              document.body.appendChild(ns);
            });
          })
          .catch(err => {
            c.innerHTML = '<div style="color:#ef4444;padding:4rem;text-align:center;"><h3>⚠️ Gagal Memuat Modul</h3><p>' + err.message + '</p><button onclick="window.goHome()" style="margin-top:2rem;padding:0.8rem 2rem;background:#0ea5e9;color:white;border:none;border-radius:12px;">🏠 Kembali</button></div>';
          });
      }

      // Live Services
      let liveClockInterval, batteryInterval, connectionInterval, prayerInterval;

      function startLiveClock() {
        if (liveClockInterval) clearInterval(liveClockInterval);
        liveClockInterval = setInterval(() => {
          const el = document.getElementById('live-clock');
          if (el) el.textContent = '⏱️ ' + new Date().toLocaleTimeString('id-ID');
        }, 1000);
      }

      function startBatteryMonitor() {
        const el = document.getElementById('battery-status');
        if (!el) return; // Element tidak ada, keluar
        if (!('getBattery' in navigator)) { el.textContent = '🔋 N/A'; return; }
        navigator.getBattery().then(b => {
          const update = () => { if (el) el.textContent = (b.charging ? '⚡' : '🔋') + ' ' + Math.round(b.level * 100) + '%'; };
          update(); b.addEventListener('levelchange', update);
        }).catch(()=>{});
      }

      async function checkConnection() {
        const el = document.getElementById('connection-status');
        if (!el) return;
        try {
          const start = Date.now();
          const res = await fetch(SUPABASE_URL + '/rest/v1/', { method: 'HEAD', headers: { 'apikey': SUPABASE_KEY } });
          el.textContent = res.ok ? '📡 Online (' + (Date.now()-start) + 'ms)' : '📡 Offline';
          el.className = res.ok ? 'badge online' : 'badge offline';
        } catch(e) { el.textContent = '📡 Offline'; el.className = 'badge offline'; }
      }

      async function fetchPrayerTimes() {
        const el = document.getElementById('prayer-times-dash');
        if (!el) return; // Element tidak ada, keluar
        try {
          const d = new Date();
          const res = await fetch(`https://api.aladhan.com/v1/timings/${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}?latitude=-6.2088&longitude=106.8456&method=20`);
          const data = await res.json();
          if (data.code === 200) {
            const t = data.data.timings;
            el.innerHTML = `🕌 Subuh ${t.Fajr} | Dzuhur ${t.Dhuhr} | Ashar ${t.Asr} | Maghrib ${t.Maghrib} | Isya ${t.Isha}`;
          }
        } catch(e) { 
          if (el) el.textContent = '🕌 Gagal memuat jadwal shalat'; 
        }
      }

      // Keyboard Shortcuts
      document.addEventListener("keydown", function(e){
        if(e.ctrlKey&&e.shiftKey&&e.key==="H"){e.preventDefault();window.goHome()}
        if(e.ctrlKey&&e.shiftKey&&e.key==="L"){e.preventDefault();document.getElementById("logout-btn")?.click()}
        if(e.ctrlKey&&e.shiftKey&&e.key==="N"){e.preventDefault();toggleNotifPanel()}
      });

      // Starfield Animation
      (function() {
        const canvas = document.getElementById('star-field');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let stars = [];
        
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; createStars(); }
        function createStars() {
          stars = [];
          for (let i = 0; i < Math.floor((canvas.width * canvas.height) / 2000); i++) {
            stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: Math.random() * 1.5, speed: 0.02 + Math.random() * 0.05 });
          }
        }
        function animate() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#e2e8f0';
          stars.forEach(s => {
            ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
            s.y += s.speed;
            if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
          });
          requestAnimationFrame(animate);
        }
        resize(); window.addEventListener('resize', resize); animate();
      })();

      // Pause animations when tab hidden
      document.addEventListener("visibilitychange", function() {
        const canvas = document.getElementById("star-field");
        if (canvas) canvas.style.display = document.hidden ? "none" : "block";
      });

      // Init
      initSupabase();
      
      if (localStorage.getItem('dreamos_session_active') === 'true') {
        const user = getStoredUser();
        if (user.role) {
          console.log(' Auto-login:', user.role);
          showDashboard();
        }
      }

      console.log('🚀 Dream OS Enterprise RBAC v1.0 Beta siap!');
      console.log('💚 The Power Soul Of Shalawat');

      // PWA Install
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        deferredPrompt = e;
        setTimeout(() => document.getElementById('pwa-banner').classList.add('show'), 3000);
      });

      window.installPWA = function() {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(function(result) {
            if (result.outcome === 'accepted') console.log('✅ PWA installed');
            deferredPrompt = null;
            document.getElementById('pwa-banner').style.display = 'none';
          });
        } else {
          alert('📲 Buka menu browser → "Add to Home Screen"');
        }
      };

      // Cast Functions
      window.openCastModal = function() { document.getElementById('cast-modal').classList.add('show'); };
      window.closeCastModal = function() { document.getElementById('cast-modal').classList.remove('show'); };
      window.shareToTV = function() {
        const url = window.location.origin + '/dream-os-final/presentation.html';
        if (navigator.share) navigator.share({ title: 'Dream OS Presentation', url: url }).catch(()=>{});
        else alert(' Buka ' + url + ' di browser Smart TV Anda');
      };
      window.showQRForTV = function() {
        const url = window.location.origin + '/dream-os-final/presentation.html';
        const qrDiv = document.getElementById('cast-qr');
        qrDiv.style.display = 'block';
        qrDiv.innerHTML = '<div style="background:#fff;padding:15px;border-radius:8px;text-align:center;"><p style="color:#000;font-weight:700;font-size:0.7rem;">Scan QR untuk buka di TV</p><p style="color:#64748b;font-size:0.65rem;">' + url + '</p></div>';
      };

      // Service Worker
      
      // ===== ISO 27001: IDLE TIMEOUT (30 Menit) =====
      let idleTime = 0;
      const MAX_IDLE_MINUTES = 30; 
      function resetIdleTimer() { idleTime = 0; }
      window.addEventListener('mousemove', resetIdleTimer);
      window.addEventListener('keypress', resetIdleTimer);
      window.addEventListener('click', resetIdleTimer);
      window.addEventListener('scroll', resetIdleTimer);
      window.addEventListener('touchstart', resetIdleTimer);

      setInterval(() => {
        idleTime++;
        if (idleTime >= MAX_IDLE_MINUTES && localStorage.getItem('dreamos_session_active') === 'true') {
          alert('⚠️ Sesi berakhir karena tidak ada aktivitas (30 menit).');
          if (window.supabaseClient) window.supabaseClient.auth.signOut().catch(()=>{});
          localStorage.removeItem('dreamos_bound_user');
          localStorage.setItem('dreamos_session_active', 'false');
          location.reload();
        }
      }, 60000); // Cek setiap 1 menit

      // Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('✅ SW registered:', reg.scope))
            .catch(err => console.warn('⚠️ SW registration failed:', err));
        });
      }
    });
  </script>
</body>
