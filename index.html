<!DOCTYPE html>
<html lang="id">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; connect-src 'self' https:;">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dream OS • v1.0 Final</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;600;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        :root { 
            --glass-bg: rgba(10, 15, 30, 0.5);
            --glass-border: rgba(0, 255, 157, 0.15);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --neon: #00ff9d;
            --accent: #0ea5e9;
            --warning: #e11d48;
            --gold: #d4af37;
        }
        * { box-sizing: border-box; }
        body { 
            margin: 0; padding: 0; overflow-x: hidden;
            background: #0a0e27;
            color: #e2e8f0; font-family: 'Inter', sans-serif; min-height: 100vh;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed; inset: 0;
            background: 
                #0a0e27,
                radial-gradient(circle at 20% 50%, rgba(0, 255, 157, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(14, 165, 233, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(245, 158, 11, 0.1) 0%, transparent 50%);
            pointer-events: none; 
            z-index: -2;
            animation: gradientFlow 15s ease-in-out infinite;
        }
        @keyframes gradientFlow {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.6; }
            50% { transform: scale(1.1) rotate(5deg); opacity: 1; }
        }
        body::after {
            content: '';
            position: fixed; inset: 0;
            background-image: 
                linear-gradient(rgba(0,255,157,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,157,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none; z-index: -1;
        }
        canvas#star-field {
            position: fixed; 
            top: 0; left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: 0; 
            pointer-events: none;
        }
        
        /* Body background tetap gelap */
        body {
            background: #0a0e27 !important;
        }
        
        /* Gradient overlay di bawah canvas */
        body::before {
            z-index: -2 !important;
            opacity: 0.8;
        }
        
        /* Circuit pattern di bawah canvas */
        body::after {
            z-index: -1 !important;
            opacity: 0.5;
        }
        
        /* Canvas bintang di layer di atas body tapi di bawah content */
        canvas#star-field {
            z-index: 1 !important;
            opacity: 0.6;
        }

        /* ========== GLASS UTILITY ========== */
        .glass {
            background: rgba(15, 23, 42, 0.85) !important;
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        /* ========== LOGIN SCREEN ========== */
        #login-screen {
            position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(10, 14, 39, 0.95);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            z-index: 10000; transition: opacity 0.5s ease;
        }
        .login-container { text-align: center; max-width: 400px; width: 100%; padding: 0 2rem; }
        .login-logo { width: 100px; height: 100px; border-radius: 24px; margin-bottom: 2rem; box-shadow: 0 0 40px rgba(212,175,55,0.4); }
        .arabic { font-family: 'Amiri', serif; font-size: 2.2rem; color: var(--neon); text-shadow: 0 0 30px rgba(0,255,157,0.6); margin-bottom: 0.5rem; line-height: 1.4; }
        .shalawat { font-family: 'Amiri', serif; font-size: 1rem; color: var(--accent); text-shadow: 0 0 20px rgba(14,165,233,0.6); margin-bottom: 3rem; }
        .input-wrapper { position: relative; margin-bottom: 1.5rem; }
        .pin-input {
            width: 100%; padding: 1.2rem 4rem 1.2rem 1.5rem;
            background: rgba(0,0,0,0.5); border: 2px solid rgba(0,255,157,0.3);
            border-radius: 16px; color: var(--neon); font-family: 'Orbitron', monospace;
            font-size: 1.2rem; letter-spacing: 4px; text-align: center; outline: none;
            box-shadow: 0 0 30px rgba(0,255,157,0.1), inset 0 0 20px rgba(0,255,157,0.05);
        }
        .pin-input::placeholder { color: rgba(0,255,157,0.3); letter-spacing: 2px; }
        .toggle-pin {
            position: absolute; right: 1rem; top: 50%; transform: translateY(-50%);
            cursor: pointer; font-size: 1.5rem; color: var(--neon); user-select: none;
            text-shadow: 0 0 15px rgba(0,255,157,0.7);
        }
        .access-btn {
            width: 100%; padding: 1.2rem; background: #10b981; color: white; border: none;
            border-radius: 16px; font-size: 1.1rem; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 25px rgba(16,185,129,0.4); transition: all 0.3s ease;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .access-btn:hover { background: #059669; transform: translateY(-2px); box-shadow: 0 8px 35px rgba(16,185,129,0.6); }
        .error-msg { color: var(--warning); font-size: 0.9rem; margin-top: 1rem; display: none; }

        /* ========== MAIN APP ========== */
        #main-app { 
            display: none; 
            position: relative; 
            z-index: 2; 
            padding-bottom: 6rem;
            background: transparent;
            min-height: 100vh;
        }
        .header-main { 
            padding: 2rem 1.5rem 1rem; text-align: center; margin: 1.5rem;
            border-radius: 24px;
        }
        .header-main .logo-img { width: 60px; height: 60px; border-radius: 18px; cursor: pointer; margin-bottom: 1rem; }
        .info-badges { display: flex; justify-content: center; gap: 1rem; margin: 1.5rem 0; flex-wrap: wrap; }
        .badge { 
            padding: 0.5rem 1.2rem; border-radius: 24px; font-size: 0.7rem; color: var(--neon); font-weight: 700;
            background: rgba(0,255,157,0.05); border: 1px solid rgba(0,255,157,0.2);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        #prayer-times-dash {
            font-size: 0.6rem; color: #94a3b8; margin-top: 1rem; padding: 0.5rem 1rem;
            background: rgba(0,0,0,0.2); border-radius: 20px; display: inline-block;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
        }

        #dream-slideshow { 
            height: 220px; margin: 1.5rem; overflow: hidden; position: relative;
            border-radius: 24px;
        }
        #dream-slide-track {
            display: flex; height: 100%; transition: transform 0.7s ease;
        }
        .dream-slide { 
            min-width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: 'Orbitron', sans-serif; font-size: 1rem; color: var(--neon); text-align: center;
            background: rgba(10,14,39,0.4);
            padding: 20px;
        }
        #slide-dots {
            display: flex; justify-content: center; gap: 8px; margin-top: -30px; position: relative; z-index: 2; padding-bottom: 10px;
        }
        .dot {
            width: 8px; height: 8px; background: rgba(255,255,255,0.3); border-radius: 50%;
            transition: all 0.3s ease;
        }
        .dot.active { background: var(--neon); box-shadow: 0 0 10px var(--neon); width: 24px; border-radius: 4px; }

        .module-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; padding: 0 1.5rem; margin-bottom: 2rem; }
        .mod-card { 
            text-align: center; cursor: pointer; padding: 1.5rem 0.5rem; position: relative; overflow: hidden;
            transition: all 0.3s ease; border-radius: 24px;
        }
        .mod-card:hover { transform: translateY(-5px); border-color: var(--neon); box-shadow: 0 12px 40px rgba(0,255,157,0.4); }
        .mod-icon { 
            font-size: 2.2rem; margin-bottom: 0.5rem;
            display: inline-block;
            transform: perspective(500px) rotateY(0deg);
            transition: transform 0.4s ease;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }
        .mod-card:hover .mod-icon {
            transform: perspective(500px) rotateY(15deg) scale(1.1);
        }
        .mod-title { font-size: 0.6rem; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; color: var(--neon); }

        /* ========== BOTTOM NAVIGATION ========== */
        #bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 5rem;
            display: none; justify-content: space-around; align-items: center; z-index: 40;
            border-top: 1px solid var(--glass-border);
            border-radius: 24px 24px 0 0;
            padding: 0 10px;
        }
        .nav-item {
            background: transparent; border: none; color: #94a3b8;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            padding: 8px 16px; border-radius: 16px; transition: all 0.3s ease;
            cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 600;
        }
        .nav-item:active, .nav-item.active {
            background: rgba(0, 255, 157, 0.15);
            color: var(--neon);
        }
        .nav-icon { font-size: 1.4rem; }
        .nav-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.5px; }

        .system-info-box { text-align: center; font-size: 0.65rem; color: #94a3b8; margin: 1.5rem; padding: 1.5rem; border-radius: 24px; }
    </style>
</head>
<body>
    <canvas id="star-field"></canvas>

    <!-- CONTENT WRAPPER -->
    <div id="content-wrapper" style="position: relative; z-index: 2; background: rgba(10, 14, 39, 0.9); min-height: 100vh;">

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <div class="login-container">
            <img src="assets/logo-sultan.png" alt="Dream OS" class="login-logo">
            <div class="arabic">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم</div>
            <div class="shalawat">اَللّٰهُمَّ صَلِّ عَلٰى سَيِّدِنَا مُحَمَّدٍ</div>
            <div class="input-wrapper">
                <input type="password" id="pin-input" class="pin-input" placeholder="🔐 ENTER PIN">
                <span class="toggle-pin" onclick="togglePin()">👁️</span>
            </div>
            <button class="access-btn" onclick="authenticate()">⚡ ACCESS CORE</button>
            <div class="error-msg" id="error-msg"></div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="main-app">
        <div id="dashboard-container"></div>
    </div>
    <nav id="bottom-nav" class="glass">
        <button class="nav-item active" onclick="goHome()"><span class="nav-icon">⌂</span><span class="nav-label">Home</span></button>
        <button class="nav-item" onclick="openMod('profile')"><span class="nav-icon">👤</span><span class="nav-label">Profile</span></button>
        <button class="nav-item" onclick="openMod('qr')"><span class="nav-icon">⎚</span><span class="nav-label">QR</span></button>
        <button class="nav-item" onclick="openMod('about')"><span class="nav-icon">ℹ️</span><span class="nav-label">About</span></button>
        <button class="nav-item" onclick="openMod('setting')"><span class="nav-icon">⚙</span><span class="nav-label">System</span></button>
    </nav>

    <script>
        // === AUTH & UI LOGIC ===
        let slideInterval;
        window.slideIdx = 0;
        const PIN_HASH = btoa('b15m1ll4h_012443410');

        function togglePin() {
            const input = document.getElementById('pin-input');
            const icon = event.target;
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '🙈';
            } else {
                input.type = 'password';
                icon.innerHTML = '👁️';
            }
        }

        function authenticate() {
            const input = document.getElementById('pin-input').value;
            const error = document.getElementById('error-msg');
            if (btoa(input) === PIN_HASH) {
                document.getElementById('login-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('main-app').style.display = 'block';
                    document.getElementById('bottom-nav').style.display = 'flex';
                    renderDashboard();
                }, 500);
            } else {
                error.style.display = 'block';
                error.textContent = '⛔ ACCESS DENIED';
                setTimeout(() => error.style.display = 'none', 2000);
            }
        }
        document.getElementById('pin-input').addEventListener('keypress', e => {
            if (e.key === 'Enter') authenticate();
        });

        // === DATA HELPERS ===
        function getSecuritySlideText() {
            const sec = localStorage.getItem('dreamos_sec_today');
            return sec ? '🛡️ ' + sec : '🛡️ Petugas Siaga';
        }

        function getBookingSlideText() {
            const bookings = JSON.parse(localStorage.getItem('dreamos_bookings') || '[]')
                .filter(b => b.status === 'approved');
            const today = new Date().toISOString().split('T')[0];
            const tomorrow = new Date(Date.now() + 86400000).toISOString().split('T')[0];
            const todayB = bookings.filter(b => b.tgl === today);
            const tomorrowB = bookings.filter(b => b.tgl === tomorrow);
            let text = '📅 Hari Ini: ' + (todayB.length ? todayB.map(b => b.ruang + ' (' + b.jam_mulai + '-' + b.jam_selesai + ')').join(', ') : 'Kosong');
            text += ' | Besok: ' + (tomorrowB.length ? tomorrowB.map(b => b.ruang + ' (' + b.jam_mulai + '-' + b.jam_selesai + ')').join(', ') : 'Kosong');
            return text;
        }

        function getK3SlideText() {
            const k3 = JSON.parse(localStorage.getItem('dreamos_k3_reports') || '[]');
            const total = k3.length;
            const pending = k3.filter(x => x.status === 'pending').length;
            const proses = k3.filter(x => x.status === 'Proses' || x.status === 'proses').length;
            const selesai = k3.filter(x => x.status === 'Selesai' || x.status === 'selesai' || x.status === 'disposisi').length;
            const pct = total > 0 ? Math.round((selesai / total) * 100) : 100;
            return `⚠️ K3 Hari Ini: Total ${total} | Pending ${pending} | Proses ${proses} | Selesai ${selesai} (${pct}%)`;
        }

        // === DASHBOARD RENDER ===
        window.renderDashboard = function() {
            const container = document.getElementById('dashboard-container');
            container.innerHTML = `
                <div class="header-main glass">
                    <img src="assets/logo-sultan.png" class="logo-img" onclick="tapLogo()">
                    <div class="arabic">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم</div>
                    <div class="shalawat" style="margin-bottom:0.5rem;">اَللّٰهُمَّ صَلِّ عَلٰى سَيِّدِنَا مُحَمَّدٍ</div>
                    <div class="info-badges">
                        <span class="badge" id="live-clock">⏱️ --:--:--</span>
                        <span class="badge" id="battery-status">🔋 --%</span>
                    </div>
                    <div id="prayer-times-dash">🕌 Memuat jadwal shalat...</div>
                </div>
                <div id="dream-slideshow" class="glass">
                    <div id="dream-slide-track"></div>
                </div>
                <div id="slide-dots"></div>
                <div class="module-grid" id="module-grid"></div>
                <div class="system-info-box glass">
                    <strong>Dream OS v1.0 Final</strong><br>Engineered by Family Dream Team<br>
                    <span style="color:#0ea5e9; font-family:'Amiri',serif;">"The Power Soul Of Shalawat"</span><br>
                    Compliance: <strong>ISO 27001, ISO 9001, ISO 55001</strong><br>
                    Approver: Bapak Hanung Budianto S. E<br>Applicant: Bapak Erwinsyah
                </div>
            `;

            // Module cards
            const modules = [
                { i:'🌍', n:'CMD Center', id:'cmd' },{ i:'🛡️', n:'Security', id:'sec' },{ i:'⚠️', n:'K3 Safety', id:'k3' },
                { i:'🏠', n:'Jan Indoor', id:'in' },{ i:'🌳', n:'Jan Outdoor', id:'out' },{ i:'📅', n:'Booking', id:'book' },
                { i:'🏢', n:'Asset', id:'asset' },{ i:'📦', n:'Stok Gudang', id:'stok' },{ i:'🔧', n:'Maintenance', id:'maint' }
            ];
            const grid = document.getElementById('module-grid');
            modules.forEach(m => {
                const card = document.createElement('div');
                card.className = 'mod-card glass';
                card.innerHTML = `<div class="mod-icon">${m.i}</div><div class="mod-title">${m.n}</div>`;
                card.onclick = () => openMod(m.id);
                grid.appendChild(card);
            });

            startLiveClock();
            startBatteryMonitor();
            fetchPrayerTimes();
            showSlides();
        };

        function startLiveClock() {
            setInterval(() => {
                const el = document.getElementById('live-clock');
                if (el) el.textContent = '⏱️ ' + new Date().toLocaleTimeString('id-ID');
            }, 1000);
        }

        function startBatteryMonitor() {
            if (navigator.getBattery) {
                navigator.getBattery().then(battery => {
                    const update = () => {
                        const el = document.getElementById('battery-status');
                        if (el) el.textContent = (battery.charging ? '⚡' : '🔋') + ' ' + Math.round(battery.level * 100) + '%';
                    };
                    update();
                    battery.addEventListener('levelchange', update);
                    battery.addEventListener('chargingchange', update);
                });
            }
        }

        // === PRAYER TIMES WITH AUTO-UPDATE ===
        let prayerInterval;
        let nextPrayerTime = null;
        
        async function fetchPrayerTimes() {
            try {
                const today = new Date();
                const dateStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
                
                const res = await fetch(`https://api.aladhan.com/v1/timings/${dateStr}?latitude=-6.4025&longitude=106.7942&method=20`);
                const data = await res.json();
                
                if (data.code === 200) {
                    const t = data.data.timings;
                    const prayers = [
                        { name: 'Subuh', time: t.Fajr, icon: '🌅' },
                        { name: 'Dzuhur', time: t.Dhuhr, icon: '☀️' },
                        { name: 'Ashar', time: t.Asr, icon: '🌤️' },
                        { name: 'Maghrib', time: t.Maghrib, icon: '🌅' },
                        { name: 'Isya', time: t.Isha, icon: '🌙' }
                    ];
                    
                    // Find next prayer
                    const now = new Date();
                    let nextPrayer = null;
                    let nextPrayerInfo = null;
                    
                    prayers.forEach(prayer => {
                        const [hours, minutes] = prayer.time.split(':').map(Number);
                        const prayerTime = new Date();
                        prayerTime.setHours(hours, minutes, 0);
                        
                        if (prayerTime > now && !nextPrayer) {
                            nextPrayer = prayerTime;
                            nextPrayerInfo = prayer;
                        }
                    });
                    
                    // If no next prayer today, next is Subuh tomorrow
                    if (!nextPrayer) {
                        nextPrayerInfo = prayers[0];
                        const [hours, minutes] = prayers[0].time.split(':').map(Number);
                        nextPrayer = new Date();
                        nextPrayer.setDate(nextPrayer.getDate() + 1);
                        nextPrayer.setHours(hours, minutes, 0);
                    }
                    
                    // Display with highlight
                    const prayerText = prayers.map(p => {
                        const isNext = nextPrayerInfo && p.name === nextPrayerInfo.name;
                        const style = isNext ? 'color:#00ff9d;font-weight:bold;' : 'color:#94a3b8;';
                        return `<span style="${style}">${p.icon} ${p.name} ${p.time}</span>`;
                    }).join(' • ');
                    
                    const el = document.getElementById('prayer-times-dash');
                    if (el) {
                        el.innerHTML = prayerText;
                    }
                    
                    // Update countdown every second
                    updatePrayerCountdown(nextPrayer, nextPrayerInfo);
                    
                    // Auto-update every hour
                    if (prayerInterval) clearInterval(prayerInterval);
                    prayerInterval = setInterval(() => {
                        fetchPrayerTimes();
                    }, 3600000); // Update every hour
                }
            } catch(e) {
                console.error('Prayer times error:', e);
                document.getElementById('prayer-times-dash').textContent = '🕌 Gagal memuat jadwal shalat';
            }
        }
        
        function updatePrayerCountdown(nextPrayer, nextPrayerInfo) {
            function updateCountdown() {
                const now = new Date();
                const diff = nextPrayer - now;
                
                if (diff <= 0) {
                    // Prayer time arrived!
                    document.getElementById('prayer-times-dash').innerHTML = 
                        `<span style="color:#00ff9d;font-weight:bold;">🕌 WAKTU ${nextPrayerInfo.name.toUpperCase()} TELAH TIBA!</span>`;
                    setTimeout(() => fetchPrayerTimes(), 60000); // Refresh after 1 minute
                    return;
                }
                
                const hours = Math.floor(diff / 3600000);
                const minutes = Math.floor((diff % 3600000) / 60000);
                const seconds = Math.floor((diff % 60000) / 1000);
                
                const countdown = String(hours).padStart(2,'0') + ':' + 
                                 String(minutes).padStart(2,'0') + ':' + 
                                 String(seconds).padStart(2,'0');
                
                // Add countdown to display
                const el = document.getElementById('prayer-times-dash');
                if (el && !el.querySelector('.countdown')) {
                    const countdownSpan = document.createElement('span');
                    countdownSpan.className = 'countdown';
                    countdownSpan.style.cssText = 'margin-left:10px;padding:2px 8px;background:rgba(0,255,157,0.1);border-radius:10px;font-size:0.65rem;';
                    countdownSpan.innerHTML = `⏱️ ${nextPrayerInfo.icon} ${nextPrayerInfo.name} dalam ${countdown}`;
                    el.appendChild(countdownSpan);
                } else if (el && el.querySelector('.countdown')) {
                    el.querySelector('.countdown').innerHTML = `⏱️ ${nextPrayerInfo.icon} ${nextPrayerInfo.name} dalam ${countdown}`;
                }
            }
            
            updateCountdown();
            setInterval(updateCountdown, 1000); // Update every second
        }

        // === 7 SLIDES AUTO-CONNECTED ===
        window.showSlides = function() {
            const track = document.getElementById('dream-slide-track');
            const dotsContainer = document.getElementById('slide-dots');
            if (!track || !dotsContainer) return;
            if (slideInterval) clearInterval(slideInterval);

            // Data dari localStorage untuk slide 5,6,7
            const slide5 = localStorage.getItem('dreamos_slide_5') || '🏛️ Belum ada info kegiatan Manajemen.';
            const slide6 = localStorage.getItem('dreamos_slide_6') || '📋 Belum ada info Bagian Umum.';
            const slide7 = localStorage.getItem('dreamos_slide_7') || '💚 Selamat Bekerja! The Power Soul Of Shalawat!';

            // Slide 1-3: data otomatis dari modul terkait
            const slide1 = '🕌 Assalamualaikum, Selamat Datang!<br><small>' + getSecuritySlideText() + '</small>';
            const slide2 = getBookingSlideText();
            const slide3 = getK3SlideText();
            // Slide 4: cuaca (placeholder dulu)
            const slide4 = '<span style="font-size:0.9rem;">🌦️ Cuaca Depok Hari Ini</span><br><span id="slide4-weather" style="font-size:0.8rem;">⏳ Fetching...</span>';

            const slides = [
                slide1,
                slide2,
                slide3,
                slide4,
                '🏛️ Info Manajemen<br><small>' + slide5 + '</small>',
                '📋 Info Bag. Umum<br><small>' + slide6 + '</small>',
                '💚 Pesan Hari Ini<br><small>' + slide7 + '</small>'
            ];

            track.innerHTML = slides.map(s => `<div class="dream-slide">${s}</div>`).join('');
            dotsContainer.innerHTML = slides.map((_, i) => `<div class="dot ${i === 0 ? 'active' : ''}"></div>`).join('');
            
            window.slideIdx = 0;
            const totalSlides = slides.length;
            
            function updateSlide() {
                if (!track.children.length) return;
                window.slideIdx = (window.slideIdx + 1) % totalSlides;
                track.style.transform = `translateX(-${window.slideIdx * 100}%)`;
                document.querySelectorAll('.dot').forEach((d, i) => {
                    d.classList.toggle('active', i === window.slideIdx);
                });
            }
            
            slideInterval = setInterval(updateSlide, 7000); // 7 detik
            
            // Fetch cuaca untuk slide 4
            setTimeout(() => {
                const wEl = document.getElementById('slide4-weather');
                if (!wEl) return;
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(pos => {
                        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,uv_index&timezone=Asia/Jakarta`)
                        .then(r => r.json()).then(d => {
                            const c = d.current;
                            const conditions = {
                                0:'☀️ CERAH', 1:'🌤️ CERAH BERAWAN', 2:'⛅ BERAWAN', 3:'☁️ MENDUNG',
                                45:'🌫️ BERKABUT', 48:'🌫️ BERKABUT', 51:'🌦️ GERIMIS', 53:'🌦️ GERIMIS',
                                55:'🌧️ GERIMIS LEBAT', 61:'🌧️ HUJAN RINGAN', 63:'🌧️ HUJAN', 65:'🌧️ HUJAN LEBAT',
                                80:'🌦️ HUJAN RINGAN', 81:'🌧️ HUJAN', 82:'⛈️ HUJAN LEBAT',
                                95:'⛈️ HUJAN PETIR', 96:'⛈️ HUJAN PETIR', 99:'⛈️ HUJAN PETIR LEBAT'
                            };
                            const weather = conditions[c.weather_code] || '🌤️ Tidak diketahui';
                            wEl.innerHTML = `${weather}<br>🌡️ ${c.temperature_2m}°C (Terasa: ${c.apparent_temperature}°C)<br>💧 ${c.relative_humidity_2m}% | 💨 ${c.wind_speed_10m} km/h | ☀️ UV: ${c.uv_index}`;
                        }).catch(() => { wEl.textContent = '🌤️ Offline'; });
                    }, () => { wEl.textContent = '📍 GPS Denied'; });
                }
            }, 1000);
        };

        // === MODULE LOADER ===
        window.openMod = function(id) {
            const map = {
                cmd: ['Command Center', 'commandcenter.html'],
                sec: ['Security', 'security.html'],
                k3: ['K3 Safety', 'k3.html'],
                in: ['Janitor Indoor', 'janitor-indoor.html'],
                out: ['Janitor Outdoor', 'janitor-outdoor.html'],
                maint: ['Maintenance', 'maintenance.html'],
                book: ['Booking', 'booking.html'],
                stok: ['Stok', 'stok.html'],
                asset: ['Asset', 'asset.html'],
                profile: ['Profile', 'profile.html'],
                qr: ['QR', 'qr.html'],
                about: ['About', 'about.html'],
                setting: ['Setting', 'setting.html']
            };
            const m = map[id];
            if (!m) { alert('Modul tidak dikenali'); return; }
            const container = document.getElementById('mod-container') || (() => {
                const div = document.createElement('div');
                div.id = 'mod-container';
                div.style.cssText = 'position:fixed;inset:0;z-index:9995;overflow-y:auto;background:rgba(4,8,20,0.95);backdrop-filter:blur(20px);padding-bottom:5rem;';
                document.body.appendChild(div);
                return div;
            })();
            container.style.display = 'block';
            container.innerHTML = `<div style="text-align:center;padding:3rem;color:#94a3b8;">⏳ Memuat ${m[0]}...</div>`;
            fetch(`modules/${m[1]}?v=${Date.now()}`)
                .then(r => { if (!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
                .then(html => {
                    container.innerHTML = html;
                    container.querySelectorAll('script').forEach(old => {
                        const ns = document.createElement('script');
                        ns.textContent = old.textContent;
                        document.body.appendChild(ns);
                    });
                })
                .catch(err => {
                    container.innerHTML = `<div style="color:#ef4444;padding:4rem 2rem;text-align:center;"><h3>⚠️ Gagal Memuat ${m[0]}</h3><p>${err.message}</p><button onclick="goHome()" style="margin-top:1rem;padding:0.75rem 1.5rem;background:#10b981;border:none;border-radius:8px;color:white;font-weight:bold;">Kembali</button></div>`;
                });
        };

        window.goHome = function() {
            const mod = document.getElementById('mod-container');
            if (mod) mod.style.display = 'none';
            if (slideInterval) clearInterval(slideInterval);
            showSlides();
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.querySelector('.nav-item:first-child').classList.add('active');
        };

        window.tapLogo = () => {}; // placeholder

        // === NVIDIA STARFIELD ===
        (function(){
            const canvas = document.getElementById('star-field');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let stars = [];
            const STAR_COUNT = 200;
            
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            
            function init() {
                resize();
                stars = [];
                for (let i = 0; i < STAR_COUNT; i++) {
                    stars.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        size: Math.random() * 2 + 0.5,
                        speed: Math.random() * 0.8 + 0.2,
                        opacity: Math.random() * 0.5 + 0.5
                    });
                }
            }
            
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                stars.forEach(star => {
                    // Draw star with glow
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 255, 255, ' + star.opacity + ')';
                    ctx.fill();
                    
                    // Add glow effect
                    if (star.size > 1.5) {
                        ctx.beginPath();
                        ctx.arc(star.x, star.y, star.size * 2, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(0, 255, 157, 0.1)';
                        ctx.fill();
                    }
                    
                    // Move star
                    star.y -= star.speed;
                    
                    // Reset star if out of screen
                    if (star.y < -10) {
                        star.y = canvas.height + 10;
                        star.x = Math.random() * canvas.width;
                    }
                });
                
                requestAnimationFrame(draw);
            }
            
            // Proper event listener
            window.addEventListener('resize', function() {
                resize();
                init();
            });
            
            init();
            draw();
            console.log('🌟 NVIDIA Starfield Active - ' + STAR_COUNT + ' stars');
        })();
    </script>
<script src="js/dev-tools.js"></script>
