    /* Mobile optimization */
    @media screen and (max-width: 768px) {
      input, select, textarea { font-size: 16px !important; -webkit-appearance: none; border-radius: 12px; }

    /* Sci-fi effects */
    .mod-card { position: relative; overflow: hidden; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .mod-card::before { content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px; background: linear-gradient(45deg, #00ff9d, #0ea5e9, #8b5cf6, #00ff9d); background-size: 400% 400%; border-radius: 24px; z-index: -1; opacity: 0; transition: opacity 0.3s; animation: gradientShift 3s ease infinite; }
    .mod-card:hover::before { opacity: 1; }
    @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    .mod-card:hover { transform: translateY(-8px) scale(1.05); box-shadow: 0 0 30px rgba(0,255,157,0.5), 0 0 60px rgba(0,255,157,0.3), inset 0 0 20px rgba(0,255,157,0.1); }
    .mod-icon { transition: all 0.3s; filter: drop-shadow(0 0 10px rgba(0,255,157,0.3)); }
    .mod-card:hover .mod-icon { transform: scale(1.2); filter: drop-shadow(0 0 20px rgba(0,255,157,0.8)); animation: iconPulse 1s ease-in-out infinite; }
    @keyframes iconPulse { 0%, 100% { transform: scale(1.2); } 50% { transform: scale(1.3); } }
    .mod-status { position: absolute; top: 12px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: #10b981; box-shadow: 0 0 10px #10b981; animation: statusPulse 2s ease-in-out infinite; }
    @keyframes statusPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.2); } }
    .mod-card:hover .mod-title { text-shadow: 0 0 10px rgba(0,255,157,0.8); letter-spacing: 1px; }

    /* Notifications */
    .notif-bell { position: relative; cursor: pointer; font-size: 1.4rem; margin-right: 0.8rem; user-select: none; }
    .notif-badge { position: absolute; top: -6px; right: -8px; background: #e11d48; color: #fff; border-radius: 50%; padding: 0.1rem 0.4rem; font-size: 0.5rem; font-weight: 700; display: none; }

    .notif-item:last-child { border-bottom: none; }

#mod-container {

/* ===== LIGHT MODE ===== */
[data-theme="light"] body {
  background: #f0f4ff !important;
  color: #1e293b !important;
}
[data-theme="light"] .glass {
  background: rgba(255, 255, 255, 0.7) !important;

/* ===== HIGH CONTRAST ===== */
[data-high-contrast="true"] {
  --text-main: #ffffff !important;
  --glass-border: rgba(0, 255, 157, 0.6) !important;
  --neon: #00ff9d !important;
}
[data-high-contrast="true"] body {
  background: #000000 !important;
  color: #ffffff !important;
}
[data-high-contrast="true"] .glass {
  background: rgba(0, 0, 0, 0.9) !important;
  border: 2px solid #00ff9d !important;
}
[data-high-contrast="true"] .mod-card {
  border: 2px solid #ffffff !important;
}
[data-high-contrast="true"] .mod-title {
  color: #ffffff !important;
  font-weight: 900 !important;
}

/* ===== REDUCED MOTION ===== */
[data-reduce-motion="true"] *,
[data-reduce-motion="true"] *::before,
[data-reduce-motion="true"] *::after {
  animation-duration: 0.001s !important;
  transition-duration: 0.001s !important;
  scroll-behavior: auto !important;
}
[data-reduce-motion="true"] canvas#star-field {
  display: none !important;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001s !important;
    transition-duration: 0.001s !important;
  }
}

/* ===== RTL SUPPORT (BAHASA ARAB) ===== */
[dir="rtl"] {
  direction: rtl;
  text-align: right;
}
[dir="rtl"] .back-btn {
  left: auto;
  right: 0.8rem;
}
[dir="rtl"] .input-wrapper .toggle-pin {
  right: auto;
  left: 1rem;
}
[dir="rtl"] #bottom-nav .nav-container {
  flex-direction: row-reverse;
}

/* ===== FONT SCALE ===== */
html {
  font-size: var(--font-scale, 100%);
}

/* ===== SCREEN READER ONLY ===== */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ===== FOCUS VISIBLE (ACCESSIBILITY) ===== */
:focus-visible {
  outline: 3px solid var(--neon, #00ff9d) !important;
  outline-offset: 2px !important;
}

/* ===== SKIP TO CONTENT ===== */
.skip-link {

// Aplikasikan setting tersimpan ke DOM
function applyStoredSettings() {
  try {
    const s = JSON.parse(localStorage.getItem('dreamos_settings') || '{}');
    const root = document.documentElement;
    if (s.theme) root.setAttribute('data-theme', s.theme);
    if (s.highContrast !== undefined) root.setAttribute('data-high-contrast', s.highContrast ? 'true' : 'false');
    if (s.reduceMotion !== undefined) root.setAttribute('data-reduce-motion', s.reduceMotion ? 'true' : 'false');
    if (s.fontSize) root.style.setProperty('--font-scale', s.fontSize + '%');
    if (s.lang === 'ar') root.setAttribute('dir', 'rtl');
    if (s.starfield !== undefined) {
      const canvas = document.getElementById('star-field');
      if (canvas) canvas.style.display = s.starfield ? 'block' : 'none';
    }
    if (s.glassIntensity) {
      const alpha = (s.glassIntensity / 100).toFixed(2);
      const bg = s.theme === 'light' ? 'rgba(240,245,255,' + alpha + ')' : 'rgba(15,23,42,' + alpha + ')';
      root.style.setProperty('--glass-bg', bg);
    }
    console.log('🎨 Settings applied:', s.theme || 'dark', '| High Contrast:', s.highContrast || false);
  } catch(e) {}
}

function startLiveClock() {
    if (liveClockInterval) clearInterval(liveClockInterval);
        liveClockInterval = setInterval(() => {
          const el = document.getElementById('live-clock');
          if (el) el.textContent = '⏱️ ' + new Date().toLocaleTimeString('id-ID');

      let batteryInterval = null;
function startBatteryMonitor() {
    if (batteryInterval) clearInterval(batteryInterval);
        const el = document.getElementById('battery-status');
        if (!('getBattery' in navigator)) { if (el) el.textContent = '🔋 N/A'; return; }
        navigator.getBattery().then(b => {
          const update = () => { if (el) el.textContent = (b.charging ? '⚡' : '🔋') + ' ' + Math.round(b.level * 100) + '%'; };
          update(); b.addEventListener('levelchange', update);
        }).catch(()=>{});
      }

        const el = document.getElementById('connection-status');

        try {
          const start = Date.now();
          const res = await fetch(SUPABASE_URL + '/rest/v1/', { method: 'HEAD', headers: { 'apikey': SUPABASE_KEY } });

          el.className = res.ok ? 'badge online' : 'badge offline';

      (function() {
        const canvas = document.getElementById('star-field');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let stars = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; createStars(); }
        function createStars() {
          stars = [];
          for (let i = 0; i < Math.floor((canvas.width * canvas.height) / 2000); i++) {
            stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: Math.random() * 1.5, speed: 0.02 + Math.random() * 0.05 });
          }
        }
        function animate() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#e2e8f0';
          stars.forEach(s => {
            ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
            s.y += s.speed;
            if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
          });
          requestAnimationFrame(animate);
        }
        resize(); window.addEventListener('resize', resize); animate();
      })();

};

window.showQRForTV = function() {
  const url = window.location.origin + '/dream-os-final/presentation.html';
  document.getElementById('cast-url').textContent = url;
  document.getElementById('cast-url').style.display = 'block';
  
  // Generate QR sederhana (fallback jika QR library tidak ada)
  const qrDiv = document.getElementById('cast-qr');
  qrDiv.style.display = 'block';
  qrDiv.innerHTML = '<div style="background:#fff;padding:15px;border-radius:8px;text-align:center;"><p style="color:#000;font-weight:700;font-size:0.7rem;">Scan QR untuk buka di TV</p><p style="color:#64748b;font-size:0.65rem;">' + url + '</p></div>';
  
  // Jika QR library tersedia, generate QR code sebenarnya

    qrDiv.innerHTML = '';

    qr.addData(url);
    qr.make();
    qrDiv.innerHTML = qr.createImgTag(5);
  }
};
