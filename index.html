    <script>
    window.DreamGeo = { get: () => new Promise((res, rej) => { if (!navigator.geolocation) return rej('GPS Not Supported'); navigator.geolocation.getCurrentPosition(pos => res({ lat: pos.coords.latitude.toFixed(6), lng: pos.coords.longitude.toFixed(6), acc: Math.round(pos.coords.accuracy) }), err => rej(err.message), { enableHighAccuracy: true, timeout: 10000 }); }), stamp: async function(payload) { try { const loc = await this.get(); payload.gps_lat = loc.lat; payload.gps_lng = loc.lng; payload.gps_acc = loc.acc + 'm'; } catch(e) { payload.gps_lat = 'DENIED'; } return payload; } };
    window.HybridSync = { outboxKey: 'dreamos_sync_outbox', push: function(table, payload) { let box = JSON.parse(localStorage.getItem(this.outboxKey) || '[]'); payload._table = table; payload._timestamp = new Date().toISOString(); box.push(payload); localStorage.setItem(this.outboxKey, JSON.stringify(box)); this.updateUI(); if (navigator.onLine) this.flush(); }, flush: async function() { if (!navigator.onLine) return; let box = JSON.parse(localStorage.getItem(this.outboxKey) || '[]'); if (box.length === 0) return; let successCount = 0; for (let i = 0; i < box.length; i++) { let item = box[i]; let table = item._table; delete item._table; delete item._timestamp; try { let res = await fetch(window.DREAMOS_CONFIG.supabaseUrl + '/rest/v1/' + table, { method: 'POST', headers: { 'apikey': window.DREAMOS_CONFIG.supabaseKey, 'Authorization': 'Bearer ' + window.DREAMOS_CONFIG.supabaseKey, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' }, body: JSON.stringify(item) }); if (res.ok) successCount++; } catch(e) {} } if (successCount > 0) { box.splice(0, successCount); localStorage.setItem(this.outboxKey, JSON.stringify(box)); } this.updateUI(); }, updateUI: function() { let box = JSON.parse(localStorage.getItem(this.outboxKey) || '[]'); let badge = document.getElementById('sync-badge'); if (badge) { if (box.length > 0) { badge.innerHTML = '📦 Outbox: ' + box.length; badge.style.background = 'rgba(245,158,11,0.2)'; badge.style.color = '#f59e0b'; } else { badge.innerHTML = '☁️ Synced'; badge.style.background = 'rgba(16,185,129,0.1)'; badge.style.color = '#10b981'; } } } };
    window.addEventListener('online', () => { if(window.HybridSync) window.HybridSync.flush(); });
    document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "dark");
    </script>

    <script>
    let attempts=0,lockoutUntil=localStorage.getItem('dream_lockout')||0,taps=0,tapTimer,slideInterval;window.slideIdx=0;
    
    // ✅ FIX LOGO CLICK
    window.tapLogo=function(e){if(e)e.stopPropagation();clearTimeout(tapTimer);taps++;if(taps>=7){taps=0;var pin=prompt('🔐 4S DevOps PIN:');if(pin==='4s_ghost_2026'||pin==='b15m1ll4h_012443410'){document.getElementById('login-screen').style.display='none';window.openMod('4s-ghost');}else{alert('❌ PIN salah.');}return;}tapTimer=setTimeout(function(){taps=0;},2000);};
    
    async function hashPin(pin){const e=new TextEncoder();const d=e.encode(pin+'dreamos_salt_2026');const h=await crypto.subtle.digest('SHA-256',d);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');}
    function checkLockout(){if(Date.now()<lockoutUntil){let r=Math.ceil((lockoutUntil-Date.now())/60000);document.getElementById('lock-msg').innerText='SYSTEM LOCKED. RETRY IN '+r+' MINS.';document.getElementById('lock-msg').style.display='block';return true;}document.getElementById('lock-msg').style.display='none';return false;}
    
    // 🔰 ROLE-BASED ACCESS CONTROL (RBAC)
    window.ROLE_PERMISSIONS = {
        dev: ['cmd','sec','k3','in','out','book','asset','stok','maint','dana','profile','qr','about','setting','4s-ghost','core-ai'],
        kabag: ['cmd','sec','k3','in','out','book','asset','stok','maint','dana','profile','qr','about','setting','core-ai'],
        koord: ['cmd','sec','k3','in','out','book','asset','stok','maint','dana','profile','qr','about','setting','core-ai'],
        security: ['sec','qr','profile','about','setting'],
        janitor: ['in','out','profile','qr','about','setting'],
        maintenance: ['maint','profile','qr','about','setting'],
        staff: ['book','stok','asset','profile','qr','about','setting']
    };
    window.canAccess = function(modId) {
        var role = window.currentRole || 'staff';
        var permissions = window.ROLE_PERMISSIONS[role] || window.ROLE_PERMISSIONS['staff'];
        return permissions.includes(modId);
    };
    window.escapeHtml=function(s){return String(s).replace(/[&<>"'"]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];});};
    
    // ✅ FIX TOGGLE PASSWORD
    window.togglePass=function(){var x=document.getElementById("login-pass");x.type=x.type==="password"?"text":"password";};
    
    const DEV_HASH_CONFIG = "ec363f85aa74ef12cb507cbaaf199eeb13723b121780f0cfc257d1abb1796ece";
    const DEV_EMAIL_CONFIG = "dreamos.sch.id@gmail.com";
    const KABAG_HASH_CONFIG = "5801493feae83f710df042ff0df63758e03b27a4212725dbe07d0227b85d6de5";
    const KABAG_EMAIL_CONFIG = "vespaexcelhijaucedar@gmail.com";
    const KOORD_HASH_CONFIG = "9961bf59f61d19e50c2032a05de3a5db1a375494e4c098dbaf49a071bca0e288";
    const KOORD_EMAIL_CONFIG = "erwinsyah1679@gmail.com";

    async function getDeviceDNA() {
        var c = document.createElement('canvas'); var ctx = c.getContext('2d');
        ctx.textBaseline = "top"; ctx.font = "14px 'Arial'";
        ctx.fillStyle = "#f60"; ctx.fillRect(125,1,62,20);
        ctx.fillStyle = "#069"; ctx.fillText("DreamOS-Ghost", 2, 15);
        var metrics = [navigator.hardwareConcurrency || 0, screen.colorDepth, c.toDataURL()].join('|');
        const hashBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(metrics));
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('').substring(0, 16);
    }

    function handleLeaderGPS(role, name, email) {
        var msg = document.getElementById('lock-msg');
        msg.innerText = '🛰️ Memeriksa Lokasi (Global Access)...'; msg.style.color='#f59e0b'; msg.style.display='block';
        if(!navigator.geolocation) { msg.innerText = '⛔ GPS Wajib Aktif!'; return; }
        navigator.geolocation.getCurrentPosition(function(position) {
            var lat = position.coords.latitude.toFixed(6);
            var lng = position.coords.longitude.toFixed(6);
            var lastLoc = JSON.parse(localStorage.getItem('dreamos_exec_locations') || '[]');
            lastLoc.unshift({ role: role, nama: name, lat: lat, lng: lng, time: new Date().toLocaleString('id-ID') });
            if(lastLoc.length > 10) lastLoc.pop();
            localStorage.setItem('dreamos_exec_locations', JSON.stringify(lastLoc));
            msg.innerText = '✅ Lokasi terdeteksi (' + lat + ', ' + lng + '). Akses Global Diizinkan!';
            msg.style.color = '#10b981';
            setTimeout(() => enterSystem(role, name, email), 1500);
        }, function() { msg.innerText = '⛔ Gagal ambil lokasi!'; msg.style.color='#ef4444'; }, { enableHighAccuracy: true, timeout: 10000 });
    }

    // ✅ FIX TWA MULTI-USER LOGIN
    window.authenticate = async function() {
        if(checkLockout()) return;
        var email = document.getElementById('login-email').value.trim().toLowerCase();
        var pass = document.getElementById('login-pass').value;
        var msg = document.getElementById('lock-msg');
        if(!email || !pass) { msg.innerText = '⚠️ Email dan Password wajib diisi!'; msg.style.display='block'; return; }
        var inputHash = await hashPin(pass);

        if(email === DEV_EMAIL_CONFIG) {
            if(inputHash !== DEV_HASH_CONFIG) { msg.innerText = '⛔ Password Developer Salah!'; msg.style.color='#ef4444'; msg.style.display='block'; return; }
            enterSystem('dev', 'Sultan Architect', email);
            return;
        }

        if(email === KABAG_EMAIL_CONFIG) {
            if(inputHash !== KABAG_HASH_CONFIG) { msg.innerText = '⛔ Password Kabag Salah!'; msg.style.color='#ef4444'; msg.style.display='block'; return; }
            handleLeaderGPS('kabag', 'Bpk. Hanung', email);
            return;
        }

        if(email === KOORD_EMAIL_CONFIG) {
            if(inputHash !== KOORD_HASH_CONFIG) { msg.innerText = '⛔ Password Koordinator Salah!'; msg.style.color='#ef4444'; msg.style.display='block'; return; }
            handleLeaderGPS('koord', 'Bpk. Erwinsyah', email);
            return;
        }

        var users = JSON.parse(localStorage.getItem('dreamos_users_db') || '[]');
        var user = users.find(u => u.email === email);

        if (!user && navigator.onLine && window.DREAMOS_CONFIG) {
            msg.innerText = '☁️ Mengecek database pusat (Supabase)...'; msg.style.color='#0ea5e9'; msg.style.display='block';
            try {
                const res = await fetch(window.DREAMOS_CONFIG.supabaseUrl + '/rest/v1/users?email=eq.' + encodeURIComponent(email), {
                    headers: { 'apikey': window.DREAMOS_CONFIG.supabaseKey, 'Authorization': 'Bearer ' + window.DREAMOS_CONFIG.supabaseKey }
                });
                const data = await res.json();
                if (data && data.length > 0) {
                    user = data[0];
                    if (!users.find(u => u.email === user.email)) {
                        users.push(user);
                        localStorage.setItem('dreamos_users_db', JSON.stringify(users));
                    }
                    msg.innerText = '✅ Ditemukan di Cloud! Memproses...'; msg.style.color='#10b981';
                }
            } catch(e) { console.error('Supabase error:', e); }
        }

        if(!user) { msg.innerText = '⛔ Email tidak terdaftar! Hubungi Admin untuk didaftarkan.'; msg.style.color='#ef4444'; msg.style.display='block'; return; }
        if(user.password_hash !== inputHash) { 
            attempts++; msg.innerText = '⛔ Password Salah! Sisa: ' + (3-attempts); msg.style.color='#ef4444'; msg.style.display='block'; 
            if(attempts>=3) { lockoutUntil = Date.now()+(5*60*1000); localStorage.setItem('dream_lockout', lockoutUntil); checkLockout(); } 
            return; 
        }

        if(user.role !== 'kabag' && user.role !== 'koord' && user.role !== 'dev') {
            msg.innerText = '🛰️ Memeriksa Lokasi Kantor...'; msg.style.color='#f59e0b'; msg.style.display='block';
            if(!navigator.geolocation) { msg.innerText = '⛔ GPS Wajib Aktif!'; return; }
            navigator.geolocation.getCurrentPosition(async function(position) {
                var R = 6371e3; var phi1 = -6.4025 * Math.PI/180; var phi2 = position.coords.latitude * Math.PI/180;
                var dPhi = (position.coords.latitude - -6.4025) * Math.PI/180; var dLambda = (position.coords.longitude - 106.7942) * Math.PI/180;
                var a = Math.sin(dPhi/2) * Math.sin(dPhi/2) + Math.cos(phi1) * Math.cos(phi2) * Math.sin(dLambda/2) * Math.sin(dLambda/2);
                var distance = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                if(distance > 2000) { msg.innerText = '⛔ Di luar area kantor ('+Math.round(distance)+'m).'; msg.style.color='#ef4444'; return; }
                
                // Device Binding
                var currentDNA = await getDeviceDNA();
                if(!user.device_dna) {
                    if(confirm('🔐 Device baru terdeteksi! Ikatkan HP ini permanen ke akun '+user.nama+'?')) {
                        user.device_dna = currentDNA;
                        localStorage.setItem('dreamos_users_db', JSON.stringify(users));
                        enterSystem(user.role, user.nama, user.email);
                    } else { msg.innerText = '⛔ Binding Ditolak.'; msg.style.color='#ef4444'; msg.style.display='block'; }
                } else if(user.device_dna === currentDNA) {
                    enterSystem(user.role, user.nama, user.email);
                } else {
                    msg.innerText = '⛔ DEVICE TIDAK DIKENALI! Hubungi Admin.'; msg.style.color='#ef4444'; msg.style.display='block';
                }
            }, function() { msg.innerText = '⛔ Gagal ambil lokasi!'; msg.style.color='#ef4444'; }, { enableHighAccuracy: true });
        }
    };

    function enterSystem(role, name, email) {
        window.currentRole = role; window.currentUser = { role, name, email };
        localStorage.setItem('dreamos_bound_user', JSON.stringify(window.currentUser));
        localStorage.setItem('dreamos_session_active', 'true'); attempts = 0;
        document.getElementById('login-screen').style.opacity='0';
        setTimeout(function(){ document.getElementById('login-screen').style.display='none'; document.getElementById('main-app').style.display='block'; document.getElementById('bottom-nav').style.display='flex'; document.getElementById('ai-float-btn').style.display='flex'; renderDashboard(); }, 500);
    }

    window.openMod=function(id){ if(!window.canAccess(id)){ alert('⛔ Akses Ditolak! Role Anda tidak diizinkan.'); return; }
        if(id === 'cmd') { if(window.currentRole !== 'dev' && window.currentRole !== 'kabag' && window.currentRole !== 'koord') { alert('⛔ Akses Ditolak! Hanya Admin/Kabag/Koord.'); return; } }

<script>
// 🔄 AUTO SYNC PULL (Supabase -> LocalStorage) BIAR DATA ANTAR HP SINKRON OTOMATIS
(function(){
    async function pullCloudData() {
        if (!navigator.onLine || !window.DREAMOS_CONFIG) return;
        console.log('☁️ Menarik data terbaru dari Supabase...');
        // Daftar tabel yang mau disinkronkan
        const tables = ['dreamos_bookings', 'dreamos_maintenance_tasks', 'dreamos_k3_reports', 'dreamos_piket_logs', 'dreamos_stok', 'dreamos_assets', 'dreamos_dana', 'dreamos_users_db', 'dreamos_notifications', 'dreamos_matrix'];
        
        for (let t of tables) {
            try {
                let res = await fetch(window.DREAMOS_CONFIG.supabaseUrl + '/rest/v1/' + t + '?select=*', {
                    headers: { 'apikey': window.DREAMOS_CONFIG.supabaseKey, 'Authorization': 'Bearer ' + window.DREAMOS_CONFIG.supabaseKey }
                });
                if (res.ok) {
                    let data = await res.json();
                    // Timpa localStorage biar modul-modul lama bisa baca data terbaru
                    localStorage.setItem(t, JSON.stringify(data));
                }
            } catch(e){ /* Diam-diam gagal kalau offline */ }
        }
        
        // Refresh tampilan dashboard kalau user udah login
        if(window.renderDashboard && document.getElementById('main-app').style.display === 'block') {
            window.renderDashboard(); 
        }
    }
    
    // 1. Jalankan pas aplikasi pertama kali dibuka
    window.addEventListener('load', pullCloudData);
    
    // 2. Auto sync diam-diam tiap 1 menit (60000 ms)
    setInterval(pullCloudData, 60000); 
    
    // 3. Sync langsung pas internet HP balik nyala
    window.addEventListener('online', pullCloudData);
})();
</script>
