<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login Test</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h3>Login Test</h3>
  <input id="email" type="email" placeholder="Email"><br>
  <input id="pass" type="password" placeholder="Password"><br>
  <button onclick="testLogin()">Login</button>
  <pre id="result"></pre>
  <script>
    const supabase = supabase.createClient(
      'https://gbigjdhifispatrrskgh.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdiaWdqZGhpZmlzcGF0cnJza2doIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNzY1OTIsImV4cCI6MjA5Njc1MjU5Mn0.eqAFloptEHV3oIUjortuTsWvkhJgjb3xsXHM9nXfF8k'
    );
    async function testLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('pass').value;
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      document.getElementById('result').textContent = error ? 'Error: ' + error.message : 'OK: ' + JSON.stringify(data.user);
    }
  </script>
</body>
</html>
