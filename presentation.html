<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dream OS • Presentation Mode</title>
  <style>
    :root { --neon: #00ff9d; --accent: #0ea5e9; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0e27; color: #e2e8f0; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
    .logo { width: 120px; height: 120px; border-radius: 24px; margin-bottom: 2rem; box-shadow: 0 0 40px rgba(0,255,157,0.4); }
    .arabic { font-size: 2.5rem; color: var(--neon); text-shadow: 0 0 30px rgba(0,255,157,0.6); margin-bottom: 0.5rem; }
    .shalawat { font-size: 1.2rem; color: var(--accent); margin-bottom: 2rem; }
    .info-box { background: rgba(15,23,42,0.7); border: 1px solid rgba(0,255,157,0.2); border-radius: 16px; padding: 2rem; text-align: center; max-width: 600px; }
    .info-box h2 { color: var(--neon); margin-bottom: 1rem; }
    .clock { font-size: 3rem; font-weight: 700; color: var(--neon); font-family: 'Orbitron', monospace; margin: 1rem 0; }
    .date { font-size: 1rem; color: #94a3b8; }
    .status-dot { width: 12px; height: 12px; background: #10b981; border-radius: 50%; display: inline-block; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .footer { position: fixed; bottom: 1rem; text-align: center; color: #64748b; font-size: 0.7rem; }
    .qr-placeholder { width: 150px; height: 150px; background: rgba(255,255,255,0.05); border: 1px solid rgba(0,255,157,0.2); border-radius: 12px; margin: 1rem auto; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <img src="assets/logo-sultan.png" alt="Dream OS" class="logo" onerror="this.style.display='none'">
  <div class="arabic">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم</div>
  <div class="shalawat">اَللّٰهُمَّ صَلِّ عَلٰى سَيِّدِنَا مُحَمَّدٍ</div>
  
  <div class="info-box">
    <h2>🏛️ Dream OS Enterprise</h2>
    <p>The Power Soul Of Shalawat</p>
    <div class="clock" id="tv-clock">--:--:--</div>
    <div class="date" id="tv-date">---</div>
    <br>
    <p><span class="status-dot"></span> System Active</p>
    <p style="font-size:0.7rem;color:#94a3b8;">ISO 27001 • ISO 9001 • ISO 55001 Ready</p>
  </div>

  <div class="footer">
    Engineered by Family Dream Team • Presentation Mode
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('tv-clock').textContent = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      document.getElementById('tv-date').textContent = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }
    updateClock();
    setInterval(updateClock, 1000);

    // Auto-reload setiap 30 menit untuk refresh data
    setInterval(function() { location.reload(); }, 1800000);
  </script>
</body>
</html>
