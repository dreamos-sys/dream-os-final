<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar — Dream OS</title>
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #0d1428 0%, #1a1f3a 100%); }
    .signup-card { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(100, 116, 139, 0.3); border-radius: 16px; padding: 2rem; max-width: 400px; width: 90%; }
    .signup-card h1 { color: #00ff9d; margin-bottom: 1.5rem; text-align: center; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; color: #94a3b8; margin-bottom: 0.5rem; font-size: 0.875rem; }
    .form-group input { width: 100%; padding: 0.75rem; border: 1px solid #334155; border-radius: 8px; background: rgba(15, 23, 42, 0.5); color: #e2e8f0; }
    .btn { width: 100%; padding: 0.75rem; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 0.5rem; }
    .btn-primary { background: #00ff9d; color: #0d1428; }
    .btn-primary:hover { background: #00cc7d; }
    .btn-link { background: none; color: #00ff9d; text-decoration: underline; }
    .message { padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.875rem; }
    .message.error { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid #ef4444; }
    .message.success { background: rgba(0, 255, 157, 0.1); color: #00ff9d; border: 1px solid #00ff9d; }
  </style>
</head>
<body>
  <div class="signup-card">
    <h1>🛰️ Daftar Akun</h1>
    <div id="message"></div>
    
    <form id="signup-form">
      <div class="form-group">
        <label>Nama Lengkap</label>
        <input type="text" id="nama" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label>Password (min 8 karakter)</label>
        <input type="password" id="password" required minlength="8">
      </div>
      <button type="submit" class="btn btn-primary">Daftar</button>
    </form>
    
    <button class="btn btn-link" onclick="window.location.href='/modules/login.html'">Sudah punya akun? Login</button>
  </div>

  <!-- Supabase dependencies (inject by Sis Qwen) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Inline config (sama kayak di index.html)
    window.SUPABASE_URL = window.SUPABASE_URL || 'https://gbigjdhifispatrrskgh.supabase.co';
    window.SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || '';
  </script>
  <script src="js/config.js"></script>

  <script src="js/auth.js"></script>
  <script>
    function showMessage(msg, type) {
      const el = document.getElementById('message');
      el.className = 'message ' + type;
      el.textContent = msg;
    }

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nama = document.getElementById('nama').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      showMessage('Membuat akun...', 'success');
      const result = await Auth.signUp(email, password, { nama: nama, role: 'user' });
      
      if (result.success) {
        showMessage('Akun dibuat! Cek email untuk konfirmasi.', 'success');
        setTimeout(() => window.location.href = '/modules/login.html', 2000);
      } else {
        showMessage(result.error, 'error');
      }
    });
  </script>
</body>
</html>
