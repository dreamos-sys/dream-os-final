<div id="qr-root"></div>
<script>
(function() {
    function g(k){ try{return JSON.parse(localStorage.getItem(k)||'[]');}catch(e){return[];} }
    function s(k,d){ localStorage.setItem(k,JSON.stringify(d)); }

    var QRApp = {
        tab: 'generate',
        qrImage: '', qrType: 'text', qrData: '',
        history: [],
        qrCodes: [], // QR unik yang sudah digenerate

        oninit: function(){
            this.history = JSON.parse(localStorage.getItem('dreamos_qr_history')||'[]');
            this.qrCodes = JSON.parse(localStorage.getItem('dreamos_qr_codes')||'[]');
            m.redraw();
        },

        generateQR: function(){
            var data = '';
            switch(this.qrType){
                case 'text': data = this.qrData || 'DreamOS'; break;
                case 'url': data = this.qrData || 'https://'; break;
                case 'wifi': data = 'WIFI:S:'+ (document.getElementById('wifi-ssid')?.value||'') +';T:WPA;P:'+ (document.getElementById('wifi-pass')?.value||'') +';;'; break;
                case 'contact': data = 'BEGIN:VCARD\nFN:'+ (document.getElementById('contact-name')?.value||'') +'\nTEL:'+ (document.getElementById('contact-tel')?.value||'') +'\nEND:VCARD'; break;
                case 'asset': 
                    var assetSelect = document.getElementById('asset-select')?.value;
                    if(assetSelect) data = 'DREAMOS-ASSET:'+assetSelect;
                    break;
                case 'inventory':
                    var invSelect = document.getElementById('inventory-select')?.value;
                    if(invSelect) data = 'DREAMOS-INV:'+invSelect;
                    break;
                case 'gudang':
                    var gudangSelect = document.getElementById('gudang-select')?.value;
                    if(gudangSelect) data = 'DREAMOS-GDG:'+gudangSelect;
                    break;
            }
            if(!data) return alert('Masukkan data!');
            this.qrImage = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(data);
            this.history.unshift({ type: this.qrType, data: data, time: new Date().toISOString() });
            if(this.history.length > 50) this.history.pop();
            localStorage.setItem('dreamos_qr_history', JSON.stringify(this.history));
            m.redraw();
        },

        saveQrCode: function(){
            if(!this.qrImage) return alert('Generate QR dulu!');
            var label = prompt('Label untuk QR ini (contoh: Meja Lab A, AC Kantor):');
            if(!label) return;
            this.qrCodes.push({
                id: 'qr_'+Date.now(),
                label: label,
                type: this.qrType,
                image: this.qrImage,
                data: this.history[0]?.data || '',
                created: new Date().toISOString()
            });
            localStorage.setItem('dreamos_qr_codes', JSON.stringify(this.qrCodes));
            alert('QR Code disimpan!');
            m.redraw();
        },

        deleteQr: function(id){
            if(!confirm('Hapus QR ini?')) return;
            this.qrCodes = this.qrCodes.filter(function(q){ return q.id !== id; });
            localStorage.setItem('dreamos_qr_codes', JSON.stringify(this.qrCodes));
            m.redraw();
        },

        printAllQr: function(){
            if(!this.qrCodes.length) return alert('Belum ada QR tersimpan!');
            var win = window.open('', '_blank');
            win.document.write('<html><head><style>body{font-family:sans-serif;display:flex;flex-wrap:wrap;gap:20px;padding:20px;} .card{border:1px solid #ccc;padding:10px;text-align:center;width:200px;} img{width:150px;height:150px;} @media print{.card{page-break-inside:avoid;}}</style></head><body>');
            this.qrCodes.forEach(function(q){
                win.document.write('<div class="card"><img src="'+q.image+'"><br><strong>'+q.label+'</strong><br><small>'+q.type.toUpperCase()+' | '+new Date(q.created).toLocaleDateString('id-ID')+'</small></div>');
            });
            win.document.write('<script>window.print();<\\/script></body></html>');
        },

        view: function(){
            var self = this;
            var tabs = ['generate','codes','history'];
            var labels = { generate:'🔳 Generate', codes:'🏷️ QR Tersimpan', history:'📋 Riwayat' };

            return m("div", {style:"min-height:100vh;background:var(--bg-deep-space);color:var(--text-primary);font-family:'Space Grotesk',sans-serif;padding:1.5rem;padding-bottom:5rem;"}, [
                m("div", {style:"display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;"}, [
                    m("button", {onclick:function(){document.getElementById('qr-module').style.display='none';}, style:"background:rgba(255,255,255,0.2);color:white;border:none;padding:0.7rem 1.5rem;border-radius:0.75rem;cursor:pointer;font-weight:700;font-size:1rem;"}, "← Kembali"),
                    m("h2", {style:"color:var(--neon-tawhid);font-size:1.8rem;font-weight:800;"}, "📱 QR Manager")
                ]),

                // Tabs
                m("div", {style:"display:flex;gap:0.5rem;margin-bottom:1rem;"}, tabs.map(function(t){
                    return m("button", {onclick:function(){self.tab=t;}, style:"padding:0.6rem 1rem;border:none;border-radius:0.5rem;cursor:pointer;font-weight:600;font-size:0.85rem;"+(self.tab===t?'background:var(--neon-tawhid);color:black;':'background:var(--glass-bg);color:var(--text-primary);')}, labels[t]);
                })),

                // TAB GENERATE
                self.tab === 'generate' ? m("div", [
                    m("div", {class:"dream-panel", style:"padding:1.5rem;margin-bottom:1rem;"}, [
                        m("h4", {style:"color:var(--neon-tawhid);margin-bottom:0.75rem;"}, "Pilih Tipe QR"),
                        m("select", {onchange:function(e){self.qrType=e.target.value;}, style:"width:100%;margin-bottom:0.75rem;background:var(--input-bg);border:1px solid var(--glass-border);border-radius:0.5rem;padding:0.7rem;color:var(--text-primary);font-size:0.9rem;"}, [
                            m("option",{value:"text"},"📝 Teks Biasa"),
                            m("option",{value:"url"},"🌐 URL / Link"),
                            m("option",{value:"wifi"},"📶 WiFi"),
                            m("option",{value:"contact"},"👤 Kontak (vCard)"),
                            m("option",{value:"asset"},"🏢 Aset"),
                            m("option",{value:"inventory"},"📦 Inventaris"),
                            m("option",{value:"gudang"},"🗄️ Gudang")
                        ]),

                        self.qrType === 'text' ? m("textarea", {placeholder:"Masukkan teks...", rows:3, oninput:function(e){self.qrData=e.target.value;}, style:"width:100%;margin-bottom:0.5rem;background:var(--input-bg);border:1px solid var(--glass-border);border-radius:0.5rem;padding:0.7rem;color:var(--text-primary);font-size:0.9rem;resize:none;"}) : null,
                        self.qrType === 'url' ? m("input", {type:"url", placeholder:"https://...", oninput:function(e){self.qrData=e.target.value;}, style:"width:100%;margin-bottom:0.5rem;background:var(--input-bg);border:1px solid var(--glass-border);border-radius:0.5rem;padding:0.7rem;color:var(--text-primary);font-size:0.9rem;"}) : null,
                        self.qrType === 'wifi' ? m("div", [
                            m("input", {type:"text", id:"wifi-ssid", placeholder:"Nama WiFi (SSID)", style:"width:100%;margin-bottom:0.5rem;background:var(--input-bg);border:1px solid var(--glass-border);border-radius:0.5rem;padding:0.7rem;color:var(--text-primary);font-size:0.9rem;"}),
                            m("input", {type:"text", id:"wifi-pass", placeholder:"Password WiFi", style:"width:100%;margin-bottom:0.5rem;background:var(--input-bg);border:1px solid var(--glass-border);border-radius:0.5rem;padding:0.7rem;color:var(--text-primary);font-size:0.9rem;"})
                        ]) : null,
                        self.qrType === 'contact' ? m("div", [
                            m("input", {type:"text", id:"contact-name", placeholder:"Nama Kontak", style:"width:100%;margin-bottom:0.5rem;background:var(--input-bg);border:1px solid var(--glass-border);border-radius:0.5rem;padding:0.7rem;color:var(--text-primary);font-size:0.9rem;"}),
                            m("input", {type:"tel", id:"contact-tel", placeholder:"No Telepon", style:"width:100%;margin-bottom:0.5rem;background:var(--input-bg);border:1px solid var(--glass-border);border-radius:0.5rem;padding:0.7rem;color:var(--text-primary);font-size:0.9rem;"})
                        ]) : null,
                        self.qrType === 'asset' ? m("select", {id:"asset-select", style:"width:100%;margin-bottom:0.5rem;background:var(--input-bg);border:1px solid var(--glass-border);border-radius:0.5rem;padding:0.7rem;color:var(--text-primary);font-size:0.9rem;"},
                            [m("option",{value:""},"-- Pilih Aset --")].concat(g('dreamos_assets').map(function(a){return m("option",{value:a.id},a.name+' ('+a.location+')');}))
                        ) : null,
                        self.qrType === 'inventory' ? m("select", {id:"inventory-select", style:"width:100%;margin-bottom:0.5rem;background:var(--input-bg);border:1px solid var(--glass-border);border-radius:0.5rem;padding:0.7rem;color:var(--text-primary);font-size:0.9rem;"},
                            [m("option",{value:""},"-- Pilih Barang --")].concat(g('dreamos_stok').map(function(s){return m("option",{value:s.id},s.nama+' ('+s.jumlah+')');}))
                        ) : null,
                        self.qrType === 'gudang' ? m("select", {id:"gudang-select", style:"width:100%;margin-bottom:0.5rem;background:var(--input-bg);border:1px solid var(--glass-border);border-radius:0.5rem;padding:0.7rem;color:var(--text-primary);font-size:0.9rem;"},
                            [m("option",{value:""},"-- Pilih Gudang --")].concat(g('dreamos_assets').filter(function(a){return a.category==='Gedung'||a.type==='fixed';}).map(function(a){return m("option",{value:a.id},a.name+' ('+a.location+')');}))
                        ) : null,

                        m("button", {onclick:function(){self.generateQR();}, class:"dream-btn", style:"width:100%;padding:0.7rem;font-size:0.9rem;"}, "🔳 Generate QR")
                    ]),
                    self.qrImage ? m("div", {class:"dream-panel", style:"padding:1.5rem;text-align:center;"}, [
                        m("img", {src:self.qrImage, style:"max-width:100%;border-radius:1rem;"}),
                        m("div", {style:"margin-top:0.5rem;display:flex;gap:0.5rem;"}, [
                            m("button", {onclick:function(){self.saveQrCode();}, style:"flex:1;padding:0.5rem;background:#8b5cf6;color:white;border:none;border-radius:0.5rem;cursor:pointer;font-size:0.8rem;"}, "💾 Simpan QR"),
                            m("button", {onclick:function(){var a=document.createElement('a');a.href=self.qrImage;a.download='qr-code.png';a.click();}, style:"flex:1;padding:0.5rem;background:#10b981;color:white;border:none;border-radius:0.5rem;cursor:pointer;font-size:0.8rem;"}, "📥 Unduh")
                        ])
                    ]) : null
                ]) : null,

                // TAB QR TERSIMPAN
                self.tab === 'codes' ? m("div", [
                    m("div", {style:"display:flex;gap:0.5rem;margin-bottom:0.5rem;"}, [
                        m("button", {onclick:function(){self.printAllQr();}, style:"flex:1;padding:0.5rem;background:#6366f1;color:white;border:none;border-radius:0.5rem;cursor:pointer;font-size:0.8rem;"}, "🖨️ Cetak Semua QR")
                    ]),
                    self.qrCodes.length ? m("div", {style:"display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0.5rem;"},
                        self.qrCodes.map(function(q){
                            return m("div", {class:"dream-panel", style:"padding:0.75rem;text-align:center;"}, [
                                m("img", {src:q.image, style:"width:100%;max-width:120px;border-radius:0.5rem;"}),
                                m("div", {style:"font-weight:700;font-size:0.8rem;margin-top:0.3rem;"}, q.label),
                                m("div", {style:"font-size:0.65rem;color:var(--text-secondary);"}, q.type.toUpperCase()),
                                m("button", {onclick:function(){self.deleteQr(q.id);}, style:"margin-top:0.3rem;background:#ef4444;color:white;border:none;border-radius:0.3rem;padding:0.15rem 0.5rem;font-size:0.65rem;cursor:pointer;"}, "🗑️")
                            ]);
                        })
                    ) : m("div", {class:"dream-panel", style:"padding:1.5rem;text-align:center;color:var(--text-secondary);"}, "Belum ada QR tersimpan")
                ]) : null,

                // TAB HISTORY
                self.tab === 'history' ? m("div", {class:"dream-panel", style:"padding:1.5rem;"}, [
                    m("h4", {style:"color:var(--neon-tawhid);margin-bottom:1rem;"}, "📋 Riwayat Generate"),
                    self.history.length ? self.history.map(function(h){
                        return m("div", {style:"padding:0.5rem;margin-bottom:0.3rem;background:rgba(30,41,59,0.6);border-radius:0.3rem;font-size:0.8rem;"}, [
                            m("span", {style:"color:#6366f1;"}, h.type.toUpperCase()+": "),
                            m("span", h.data.substring(0,50)+(h.data.length>50?'…':'')),
                            m("div", {style:"font-size:0.65rem;color:var(--text-secondary);"}, new Date(h.time).toLocaleString('id-ID'))
                        ]);
                    }) : m("div", {style:"color:var(--text-secondary);"}, "Belum ada riwayat")
                ]) : null
            ]);
        }
    };

    m.mount(document.getElementById('qr-root'), QRApp);
})();
</script>
