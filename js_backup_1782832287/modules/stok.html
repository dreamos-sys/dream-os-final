<div id="stok-root"></div>
<script>
(function() {
    function getData(key) { try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) { return []; } }
    function saveData(key, data) { localStorage.setItem(key, JSON.stringify(data)); }
    function formatRupiah(n) { return 'Rp ' + (parseInt(n)||0).toLocaleString('id-ID'); }

    var StokApp = {
        items: [],
        showForm: false,
        search: '',
        filterCategory: 'all',
        editData: { nama: '', kategori: 'janitor_indoor', jumlah: 0, satuan: 'pcs', minimal: 5, lokasi: '', harga: 0 },

        oninit: function() {
            this.refreshItems();
        },

        refreshItems: function() {
            var all = getData('dreamos_stok');
            if (this.filterCategory !== 'all') {
                all = all.filter(function(item) { return item.kategori === this.filterCategory; }.bind(this));
            }
            if (this.search) {
                var s = this.search.toLowerCase();
                all = all.filter(function(item) {
                    return item.nama.toLowerCase().includes(s) || (item.lokasi||'').toLowerCase().includes(s);
                });
            }
            this.items = all;
            m.redraw();
        },

        getStats: function() {
            var all = getData('dreamos_stok');
            var totalJenis = all.length;
            var totalNilai = all.reduce(function(sum, item) { return sum + ((item.harga||0) * (item.jumlah||0)); }, 0);
            var menipis = all.filter(function(item) { return item.jumlah <= item.minimal; }).length;
            var habis = all.filter(function(item) { return item.jumlah === 0; }).length;
            return { totalJenis: totalJenis, totalNilai: totalNilai, menipis: menipis, habis: habis };
        },

        saveItem: function() {
            var d = this.editData;
            if (!d.nama || d.jumlah < 0) { alert('Nama barang dan jumlah wajib!'); return; }
            var items = getData('dreamos_stok');
            items.push({
                id: 'stok_' + Date.now(),
                nama: d.nama,
                kategori: d.kategori,
                jumlah: parseInt(d.jumlah),
                satuan: d.satuan,
                minimal: parseInt(d.minimal),
                lokasi: d.lokasi,
                harga: parseInt(d.harga),
                created: new Date().toISOString()
            });
            saveData('dreamos_stok', items);
            this.showForm = false;
            this.editData = { nama: '', kategori: 'janitor_indoor', jumlah: 0, satuan: 'pcs', minimal: 5, lokasi: '', harga: 0 };
            this.refreshItems();
            if (window.DreamRuleEngine) DreamRuleEngine.logAction('stok_add', { nama: d.nama, jumlah: d.jumlah });
            if (typeof window.dispatchEvent === 'function') window.dispatchEvent(new CustomEvent('stok-updated'));
        },

        updateJumlah: function(id, delta) {
            var items = getData('dreamos_stok');
            var item = items.find(function(i) { return i.id === id; });
            if (item) {
                item.jumlah = Math.max(0, (item.jumlah || 0) + delta);
                saveData('dreamos_stok', items);
                this.refreshItems();
                if (typeof window.dispatchEvent === 'function') window.dispatchEvent(new CustomEvent('stok-updated'));
            }
        },

        deleteItem: function(id) {
            if (!confirm('Hapus permanen stok ini?')) return;
            var items = getData('dreamos_stok').filter(function(i) { return i.id !== id; });
            saveData('dreamos_stok', items);
            this.refreshItems();
            if (window.DreamRuleEngine) DreamRuleEngine.logAction('stok_delete', { id: id });
            if (typeof window.dispatchEvent === 'function') window.dispatchEvent(new CustomEvent('stok-updated'));
        },

        exportCSV: function() {
            var items = getData('dreamos_stok');
            var csv = 'Nama Barang,Kategori,Jumlah,Satuan,Minimal,Lokasi,Harga\n';
            items.forEach(function(item) {
                csv += '"' + item.nama + '","' + item.kategori + '",' + item.jumlah + ',' + item.satuan + ',' + item.minimal + ',"' + (item.lokasi||'') + '",' + (item.harga||0) + '\n';
            });
            var blob = new Blob([csv], { type: 'text/csv' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'stok_dreamos_' + new Date().toISOString().split('T')[0] + '.csv';
            a.click();
            URL.revokeObjectURL(url);
        },

        cetakLaporan: function() {
            var items = getData('dreamos_stok');
            var win = window.open('', '_blank', 'width=900,height=600');
            win.document.write('<html><head><title>Laporan Stok</title><style>body{font-family:sans-serif;padding:20px}h2{text-align:center}table{width:100%;border-collapse:collapse;margin:10px 0}th,td{border:1px solid #000;padding:8px}th{background:#eee}.low{background:#ffe0e0}.out{background:#ffcccc}@media print{button{display:none}}</style></head><body>');
            win.document.write('<h2>LAPORAN STOK BARANG</h2>');
            win.document.write('<p>Tanggal: '+new Date().toLocaleDateString('id-ID')+' | Total: '+items.length+' jenis</p>');
            win.document.write('<button onclick="window.print()" style="padding:10px 20px;background:#eab308;color:black;border:none;border-radius:5px;font-weight:bold;cursor:pointer;margin-bottom:10px;">🖨️ Cetak</button>');
            win.document.write('<table><tr><th>No</th><th>Nama</th><th>Kategori</th><th>Stok</th><th>Min</th><th>Status</th><th>Harga</th></tr>');
            items.forEach(function(item, i) {
                var status = item.jumlah === 0 ? 'HABIS' : (item.jumlah <= item.minimal ? 'MENIPIS' : 'AMAN');
                var cls = item.jumlah === 0 ? 'out' : (item.jumlah <= item.minimal ? 'low' : '');
                win.document.write('<tr class="'+cls+'"><td>'+(i+1)+'</td><td>'+item.nama+'</td><td>'+item.kategori+'</td><td>'+item.jumlah+' '+item.satuan+'</td><td>'+item.minimal+'</td><td>'+status+'</td><td>'+formatRupiah(item.harga)+'</td></tr>');
            });
            win.document.write('</table></body></html>');
            win.document.close();
        },

        view: function() {
            var self = this;
            var stats = self.getStats();

            return m("div", { style: "min-height:100vh;background:var(--bg-deep-space);color:var(--text-primary);font-family:'Space Grotesk',sans-serif;padding:1rem;padding-bottom:5rem;" }, [
                // Header
                m("div", { style: "display:flex;align-items:center;gap:1rem;margin-bottom:1rem;" }, [
                    m("button", { onclick: function() { document.getElementById('stok-module').style.display = 'none'; }, style: "background:rgba(255,255,255,0.1);color:var(--text-primary);border:none;padding:0.5rem 1rem;border-radius:0.5rem;cursor:pointer;font-weight:600;" }, "← Kembali"),
                    m("div", { style: "display:flex;align-items:center;gap:0.5rem;flex:1;" }, [
                        m("h2", { style: "color:#eab308;font-size:1.3rem;font-weight:800;" }, "📦 Stok Barang"),
                        m("button", { onclick: function() { self.cetakLaporan(); }, style: "padding:0.4rem 0.8rem;background:#6366f1;color:white;border:none;border-radius:0.5rem;cursor:pointer;font-weight:600;font-size:0.75rem;" }, "🖨️ Cetak")
                    ])
                ]),

                // Alert Menipis & Habis
                (stats.menipis > 0 || stats.habis > 0) ? m("div", { style: "padding:0.75rem;margin-bottom:0.75rem;border-radius:0.5rem;background:"+(stats.habis>0?'rgba(239,68,68,0.2)':'rgba(245,158,11,0.2)')+";border:1px solid "+(stats.habis>0?'#ef4444':'#f59e0b')+";" }, [
                    stats.habis > 0 ? m("div", { style: "font-weight:700;color:#ef4444;margin-bottom:0.3rem;" }, "🚨 ALERT: "+stats.habis+" barang HABIS! Segera lakukan pengadaan.") : null,
                    stats.menipis > 0 ? m("div", { style: "font-weight:700;color:#f59e0b;" }, "⚠️ PERINGATAN: "+stats.menipis+" barang MENIPIS. Siapkan pengadaan.") : null
                ]) : null,

                // Statistik
                m("div", { class: "dream-panel", style: "padding:0.75rem;margin-bottom:0.75rem;display:grid;grid-template-columns:repeat(4,1fr);gap:0.5rem;text-align:center;" }, [
                    m("div", [m("div", { style: "font-size:1.2rem;font-weight:700;color:#eab308;" }, stats.totalJenis), m("div", { style: "font-size:0.55rem;color:var(--text-secondary);" }, "Jenis")]),
                    m("div", [m("div", { style: "font-size:1.2rem;font-weight:700;color:var(--neon-tawhid);" }, formatRupiah(stats.totalNilai)), m("div", { style: "font-size:0.55rem;color:var(--text-secondary);" }, "Total Nilai")]),
                    m("div", [m("div", { style: "font-size:1.2rem;font-weight:700;color:"+(stats.menipis>0?'#f59e0b':'#10b981')+";" }, stats.menipis), m("div", { style: "font-size:0.55rem;color:var(--text-secondary);" }, "Menipis")]),
                    m("div", [m("div", { style: "font-size:1.2rem;font-weight:700;color:"+(stats.habis>0?'#ef4444':'#10b981')+";" }, stats.habis), m("div", { style: "font-size:0.55rem;color:var(--text-secondary);" }, "Habis")])
                ]),

                // Search, Filter & Actions
                m("div", { style: "display:flex;gap:0.5rem;margin-bottom:0.75rem;flex-wrap:wrap;" }, [
                    m("input", { type: "text", placeholder: "🔍 Cari barang...", oninput: function(e) { self.search = e.target.value; self.refreshItems(); }, style: "flex:1;min-width:120px;background:var(--input-bg);border:1px solid var(--glass-border);border-radius:0.5rem;padding:0.5rem;color:var(--text-primary);font-size:0.75rem;" }),
                    m("select", { onchange: function(e) { self.filterCategory = e.target.value; self.refreshItems(); }, style: "background:var(--input-bg);border:1px solid var(--glass-border);border-radius:0.5rem;padding:0.5rem;color:var(--text-primary);font-size:0.75rem;" }, [
                        m("option", { value: "all" }, "Semua Kategori"),
                        m("option", { value: "janitor_indoor" }, "🧹 Janitor Indoor"),
                        m("option", { value: "janitor_outdoor" }, "🌿 Janitor Outdoor"),
                        m("option", { value: "maintenance" }, "🔧 Maintenance"),
                        m("option", { value: "kimia" }, "🧪 Kimia"),
                        m("option", { value: "pewangi" }, "🌸 Pewangi"),
                        m("option", { value: "atk" }, "📚 ATK"),
                        m("option", { value: "lainnya" }, "📦 Lainnya")
                    ]),
                    m("button", { onclick: function() { self.showForm = !self.showForm; }, class: "dream-btn", style: "padding:0.5rem 1rem;font-size:0.75rem;" }, self.showForm ? "❌ Batal" : "+ Tambah"),
                    m("button", { onclick: function() { self.exportCSV(); }, style: "background:#6366f1;color:white;border:none;padding:0.5rem 0.8rem;border-radius:0.5rem;font-size:0.7rem;cursor:pointer;" }, "📥 CSV")
                ]),

                // Form Tambah
                self.showForm ? m("div", { class: "dream-panel", style: "padding:0.75rem;margin-bottom:0.75rem;" }, [
                    m("h4", { style: "color:var(--neon-tawhid);margin-bottom:0.5rem;" }, "📝 Tambah Stok Baru"),
                    m("div", { style: "display:grid;grid-template-columns:1fr 1fr;gap:0.4rem;" }, [
                        m("input", { type: "text", placeholder: "Nama Barang *", oninput: function(e) { self.editData.nama = e.target.value; }, style: "background:var(--input-bg);border:1px solid var(--glass-border);border-radius:0.5rem;padding:0.5rem;color:var(--text-primary);font-size:0.75rem;" }),
                        m("select", { onchange: function(e) { self.editData.kategori = e.target.value; }, style: "background:var(--input-bg);border:1px solid var(--glass-border);border-radius:0.5rem;padding:0.5rem;color:var(--text-primary);font-size:0.75rem;" }, [
                            m("option", { value: "janitor_indoor" }, "🧹 Janitor Indoor"),
                            m("option", { value: "janitor_outdoor" }, "🌿 Janitor Outdoor"),
                            m("option", { value: "maintenance" }, "🔧 Maintenance"),
                            m("option", { value: "kimia" }, "🧪 Kimia"),
                            m("option", { value: "pewangi" }, "🌸 Pewangi"),
                            m("option", { value: "atk" }, "📚 ATK"),
                            m("option", { value: "lainnya" }, "📦 Lainnya")
                        ]),
                        m("input", { type: "number", placeholder: "Jumlah *", oninput: function(e) { self.editData.jumlah = parseInt(e.target.value)||0; }, style: "background:var(--input-bg);border:1px solid var(--glass-border);border-radius:0.5rem;padding:0.5rem;color:var(--text-primary);font-size:0.75rem;" }),
                        m("input", { type: "text", placeholder: "Satuan (pcs/liter/kg)", oninput: function(e) { self.editData.satuan = e.target.value; }, style: "background:var(--input-bg);border:1px solid var(--glass-border);border-radius:0.5rem;padding:0.5rem;color:var(--text-primary);font-size:0.75rem;" }),
                        m("input", { type: "number", placeholder: "Minimal Stok", oninput: function(e) { self.editData.minimal = parseInt(e.target.value)||0; }, style: "background:var(--input-bg);border:1px solid var(--glass-border);border-radius:0.5rem;padding:0.5rem;color:var(--text-primary);font-size:0.75rem;" }),
                        m("input", { type: "text", placeholder: "Lokasi Rak", oninput: function(e) { self.editData.lokasi = e.target.value; }, style: "background:var(--input-bg);border:1px solid var(--glass-border);border-radius:0.5rem;padding:0.5rem;color:var(--text-primary);font-size:0.75rem;" }),
                        m("input", { type: "number", placeholder: "Harga Satuan (Rp)", oninput: function(e) { self.editData.harga = parseInt(e.target.value)||0; }, style: "background:var(--input-bg);border:1px solid var(--glass-border);border-radius:0.5rem;padding:0.5rem;color:var(--text-primary);font-size:0.75rem;" })
                    ]),
                    m("button", { onclick: function() { self.saveItem(); }, class: "dream-btn", style: "width:100%;padding:0.5rem;font-size:0.8rem;margin-top:0.5rem;" }, "💾 Simpan Stok")
                ]) : null,

                // Daftar Stok dengan Alert
                m("div", { style: "display:flex;flex-direction:column;gap:0.4rem;" },
                    self.items.length === 0 ? m("p", { style: "color:var(--text-secondary);text-align:center;padding:2rem;" }, "📭 Belum ada data stok.") :
                    self.items.map(function(item) {
                        var isHabis = item.jumlah === 0;
                        var isLow = item.jumlah <= item.minimal && !isHabis;
                        var borderColor = isHabis ? '#ef4444' : (isLow ? '#f59e0b' : '#10b981');
                        var bgColor = isHabis ? 'rgba(239,68,68,0.1)' : (isLow ? 'rgba(245,158,11,0.1)' : 'transparent');
                        var statusText = isHabis ? '🚨 HABIS' : (isLow ? '⚠️ MENIPIS' : '✅ AMAN');
                        var statusColor = isHabis ? '#ef4444' : (isLow ? '#f59e0b' : '#10b981');
                        return m("div", { class: "dream-panel", style: "padding:0.6rem;border-left:4px solid "+borderColor+";background:"+bgColor+";" }, [
                            m("div", { style: "display:flex;justify-content:space-between;align-items:center;" }, [
                                m("div", { style: "flex:1;" }, [
                                    m("div", { style: "font-weight:700;font-size:0.8rem;" }, item.nama),
                                    m("div", { style: "font-size:0.6rem;color:var(--text-secondary);" }, item.kategori.replace(/_/g,' ') + " | Rak: " + (item.lokasi||'-') + " | " + formatRupiah(item.harga) + "/" + item.satuan),
                                    m("div", { style: "font-size:0.65rem;color:"+statusColor+";font-weight:600;margin-top:0.2rem;" }, statusText)
                                ]),
                                m("div", { style: "text-align:right;" }, [
                                    m("div", { style: "font-weight:700;font-size:0.9rem;color:"+(isHabis?'#ef4444':isLow?'#f59e0b':'var(--neon-tawhid)')+";" }, item.jumlah + " " + item.satuan),
                                    m("div", { style: "font-size:0.55rem;color:var(--text-secondary);" }, "Min: " + item.minimal),
                                    m("div", { style: "display:flex;gap:0.2rem;margin-top:0.3rem;justify-content:flex-end;" }, [
                                        m("button", { onclick: function() { self.updateJumlah(item.id, -1); }, style: "background:#ef4444;color:white;border:none;border-radius:0.3rem;padding:0.1rem 0.4rem;font-size:0.6rem;cursor:pointer;", title: "Kurangi 1" }, "-1"),
                                        m("button", { onclick: function() { self.updateJumlah(item.id, 1); }, style: "background:#10b981;color:white;border:none;border-radius:0.3rem;padding:0.1rem 0.4rem;font-size:0.6rem;cursor:pointer;", title: "Tambah 1" }, "+1"),
                                        m("button", { onclick: function() { self.deleteItem(item.id); }, style: "background:#dc2626;color:white;border:none;border-radius:0.3rem;padding:0.1rem 0.4rem;font-size:0.6rem;cursor:pointer;", title: "Hapus" }, "🗑")
                                    ])
                                ])
                            ])
                        ]);
                    })
                )
            ]);
        }
    };

    m.mount(document.getElementById('stok-root'), StokApp);
})();
</script>
