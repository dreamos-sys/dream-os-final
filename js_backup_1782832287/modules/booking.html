<div id="booking-root"></div>
<script>
(function() {
    function g(k){ try{return JSON.parse(localStorage.getItem(k)||'[]');}catch(e){return[];} }
    function s(k,d){ localStorage.setItem(k,JSON.stringify(d)); }
    function dt(iso){ if(!iso)return '-'; var d=new Date(iso); return d.getDate()+'/'+(d.getMonth()+1); }

    var SARANA = ["Aula SMP","Aula SMA","Saung Besar","Saung Kecil","Masjid (Maintenance)","Mushalla SMA","Serbaguna","Lapangan Basket","Lapangan Volly","Lapangan Tanah","Lapangan SMA","Kantin SMP","Kantin SMA","Labkom SD","Labkom SMP","Labkom SMA","Perpustakaan SD","Perpustakaan SMP","Perpustakaan SMA"];
    var ALAT = ["Kursi Futura","Kursi Chitose","Meja Siswa","Meja Panjang","Meja Oshin","Taplak Meja","Projektor","Screen Projektor","TV"];
    var WORK_START = 7.5, WORK_END = 16.0;
    var FRIDAY_BLOCKED = ["Aula SMP","Serbaguna"];

    var BookingApp = {
        tab: 'form',
        date: new Date().toISOString().split('T')[0],
        editData: { nama:'', divisi:'', no_hp:'', sarana:'', tgl:'', jam_mulai:'', jam_selesai:'', keperluan:'', peralatan:{} },
        msg: '',
        bookingsToday: [],
        editId: null,

        oninit: function(){ this.loadBookings(); },
        loadBookings: function(){
            this.bookingsToday = g('dreamos_bookings').filter(function(b){ return b.tgl === this.date; }.bind(this));
            m.redraw();
        },

        submit: function(e){
            e.preventDefault();
            var d = this.editData;
            if(!d.nama || !d.sarana || !d.tgl || !d.jam_mulai || !d.jam_selesai){ this.msg = 'Lengkapi data wajib!'; return; }
            var mulai = parseInt(d.jam_mulai.replace(':','')); var selesai = parseInt(d.jam_selesai.replace(':',''));
            if(selesai <= mulai){ this.msg = 'Jam selesai harus > mulai!'; return; }

            var conflict = g('dreamos_bookings').filter(function(b){
                if(b.ruang !== d.sarana || b.tgl !== d.tgl || b.status === 'rejected') return false;
                if(this.editId && b.id === this.editId) return false;
                var bMulai = parseInt(b.jam_mulai.replace(':','')); var bSelesai = parseInt(b.jam_selesai.replace(':',''));
                return mulai < bSelesai && selesai > bMulai;
            }.bind(this));
            if(conflict.length){ this.msg = 'Jadwal bentrok!'; return; }

            var peralatan = []; for(var k in d.peralatan){ if(d.peralatan[k]) peralatan.push(k); }
            var booking = { id: this.editId || 'booking_'+Date.now(), nama_peminjam:d.nama, divisi:d.divisi, no_hp:d.no_hp, ruang:d.sarana, tgl:d.tgl, jam_mulai:d.jam_mulai, jam_selesai:d.jam_selesai, keperluan:d.keperluan, peralatan:peralatan.join(', '), status:'pending', created:new Date().toISOString() };
            
            var bookings = g('dreamos_bookings');
            if(this.editId){
                var idx = bookings.findIndex(function(b){ return b.id === this.editId; }.bind(this));
                if(idx > -1) bookings[idx] = booking;
            } else {
                bookings.push(booking);
            }
            s('dreamos_bookings', bookings);
            this.msg = '✅ Booking '+(this.editId?'diperbarui':'diajukan')+'!'; 
            this.editId = null;
            this.editData = { nama:'', divisi:'', no_hp:'', sarana:'', tgl:'', jam_mulai:'', jam_selesai:'', keperluan:'', peralatan:{} };
            this.loadBookings();
            if(typeof window.dispatchEvent === 'function') window.dispatchEvent(new CustomEvent('booking-updated'));
        },

        editBooking: function(b){
            this.editId = b.id;
            this.editData = { nama:b.nama_peminjam, divisi:b.divisi||'', no_hp:b.no_hp||'', sarana:b.ruang, tgl:b.tgl, jam_mulai:b.jam_mulai, jam_selesai:b.jam_selesai, keperluan:b.keperluan||'', peralatan:{} };
            (b.peralatan||'').split(', ').forEach(function(p){ if(p) this.editData.peralatan[p] = true; }.bind(this));
            this.tab = 'form';
            m.redraw();
        },

        deleteBooking: function(id){
            if(!confirm('Hapus booking ini?')) return;
            var bookings = g('dreamos_bookings').filter(function(b){ return b.id !== id; });
            s('dreamos_bookings', bookings);
            this.loadBookings();
            if(typeof window.dispatchEvent === 'function') window.dispatchEvent(new CustomEvent('booking-updated'));
        },

        
    cetakLaporan: function(){
        var bookings = g('dreamos_bookings');
        var win = window.open('','_blank');
        win.document.write('<html><head><title>Laporan Booking</title><style>body{font-family:sans-serif;padding:20px}h2{text-align:center}table{width:100%;border-collapse:collapse;margin:10px 0}th,td{border:1px solid #000;padding:6px}th{background:#eee}@media print{button{display:none}}</style></head><body>');
        win.document.write('<h2>LAPORAN BOOKING</h2>');
        win.document.write('<p>Total: '+bookings.length+' booking</p>');
        win.document.write('<button onclick="window.print()" style="padding:10px;background:#10b981;color:white;border:none;border-radius:5px;font-weight:bold">🖨️ Cetak</button>');
        win.document.write('<table><tr><th>No</th><th>Tanggal</th><th>Peminjam</th><th>Sarana</th><th>Jam</th><th>Status</th></tr>');
        bookings.forEach(function(b, i){
            win.document.write('<tr><td>'+(i+1)+'</td><td>'+b.tgl+'</td><td>'+b.nama_peminjam+'</td><td>'+b.ruang+'</td><td>'+b.jam_mulai+'-'+b.jam_selesai+'</td><td>'+b.status+'</td></tr>');
        });
        win.document.write('</table></body></html>');
        win.document.close();
    },

    
    cetakLaporan: function(){
        var bookings = g('dreamos_bookings');
        var win = window.open('','_blank');
        win.document.write('<html><head><title>Laporan Booking</title><style>body{font-family:sans-serif;padding:20px}h2{text-align:center}table{width:100%;border-collapse:collapse;margin:10px 0}th,td{border:1px solid #000;padding:6px}th{background:#eee}@media print{button{display:none}}</style></head><body>');
        win.document.write('<h2>LAPORAN BOOKING</h2>');
        win.document.write('<p>Total: '+bookings.length+' booking</p>');
        win.document.write('<button onclick="window.print()" style="padding:10px;background:#10b981;color:white;border:none;border-radius:5px;font-weight:bold">🖨️ Cetak</button>');
        win.document.write('<table><tr><th>No</th><th>Tanggal</th><th>Peminjam</th><th>Sarana</th><th>Jam</th><th>Status</th></tr>');
        bookings.forEach(function(b, i){
            win.document.write('<tr><td>'+(i+1)+'</td><td>'+b.tgl+'</td><td>'+b.nama_peminjam+'</td><td>'+b.ruang+'</td><td>'+b.jam_mulai+'-'+b.jam_selesai+'</td><td>'+b.status+'</td></tr>');
        });
        win.document.write('</table></body></html>');
        win.document.close();
    },

    view: function(){
            var self = this;
            var tabs = ['form','calendar','list'];
            var labels = { form:'📝 Form', calendar:'📅 Kalender', list:'📋 Daftar' };

            return m("div", {style:"min-height:100vh;background:var(--bg-deep-space);color:var(--text-primary);font-family:'Space Grotesk',sans-serif;padding:1rem;padding-bottom:5rem;"}, [
                m("div", {style:"display:flex;align-items:center;gap:1rem;margin-bottom:1rem;"}, [
                    m("button", {onclick:function(){document.getElementById('booking-module').style.display='none';}, style:"background:rgba(255,255,255,0.15) !important;color:#fff !important;border:none;padding:0.6rem 1.2rem;border-radius:0.75rem;cursor:pointer;font-weight:700;font-size:0.9rem;z-index:100;position:relative;"}, "← Kembali"),
                    m("div", {style:"display:flex;align-items:center;gap:0.5rem;flex:1;"}, [m("h2", {style:"color:#f59e0b;font-size:1.3rem;font-weight:800;"}, self.editId ? "✏️ Edit Booking" : "📅 Booking Sarana"), m("button", {onclick:function(){self.cetakLaporan();}, style:"padding:0.4rem 0.8rem;background:#6366f1;color:white;border:none;border-radius:0.5rem;cursor:pointer;font-weight:600;font-size:0.75rem;"}, "🖨️ Cetak")])
                ]),
                m("div", {style:"display:flex;gap:0.3rem;margin-bottom:0.75rem;"}, tabs.map(function(t){
                    return m("button", {onclick:function(){self.tab=t;}, style:"padding:0.5rem 0.8rem;border:none;border-radius:0.5rem;cursor:pointer;font-weight:600;font-size:0.75rem;"+(self.tab===t?'background:var(--neon-tawhid);color:black;':'background:var(--glass-bg);color:var(--text-primary);')}, labels[t]);
                })),

                // TAB FORM
                self.tab === 'form' ? m("form", {onsubmit:function(e){self.submit(e);}}, [
                    m("div", {class:"dream-panel", style:"padding:1rem;"}, [
                        m("input", {placeholder:"Nama Pemohon *", value:self.editData.nama, oninput:function(e){self.editData.nama=e.target.value;}, style:"width:100%;margin-bottom:0.5rem;background:var(--input-bg);border:1px solid var(--glass-border);border-radius:0.5rem;padding:0.6rem;color:var(--text-primary);font-size:0.8rem;"}),
                        m("input", {placeholder:"Divisi", value:self.editData.divisi, oninput:function(e){self.editData.divisi=e.target.value;}, style:"width:100%;margin-bottom:0.5rem;background:var(--input-bg);border:1px solid var(--glass-border);border-radius:0.5rem;padding:0.6rem;color:var(--text-primary);font-size:0.8rem;"}),
                        m("input", {type:"tel", placeholder:"No HP", value:self.editData.no_hp, oninput:function(e){self.editData.no_hp=e.target.value;}, style:"width:100%;margin-bottom:0.5rem;background:var(--input-bg);border:1px solid var(--glass-border);border-radius:0.5rem;padding:0.6rem;color:var(--text-primary);font-size:0.8rem;"}),
                        m("select", {onchange:function(e){self.editData.sarana=e.target.value;}, style:"width:100%;margin-bottom:0.5rem;background:var(--input-bg);border:1px solid var(--glass-border);border-radius:0.5rem;padding:0.6rem;color:var(--text-primary);font-size:0.8rem;"}, 
                            [m("option",{value:""},"-- Pilih Sarana --")].concat(SARANA.map(function(s){return m("option",{value:s, selected:self.editData.sarana===s},s);}))
                        ),
                        m("div", {style:"display:flex;gap:0.5rem;"}, [
                            m("input", {type:"date", value:self.editData.tgl||self.date, onchange:function(e){self.editData.tgl=e.target.value;}, style:"flex:1;background:var(--input-bg);border:1px solid var(--glass-border);border-radius:0.5rem;padding:0.6rem;color:var(--text-primary);font-size:0.8rem;"}),
                            m("input", {type:"time", value:self.editData.jam_mulai, oninput:function(e){self.editData.jam_mulai=e.target.value;}, style:"flex:1;background:var(--input-bg);border:1px solid var(--glass-border);border-radius:0.5rem;padding:0.6rem;color:var(--text-primary);font-size:0.8rem;"}),
                            m("input", {type:"time", value:self.editData.jam_selesai, oninput:function(e){self.editData.jam_selesai=e.target.value;}, style:"flex:1;background:var(--input-bg);border:1px solid var(--glass-border);border-radius:0.5rem;padding:0.6rem;color:var(--text-primary);font-size:0.8rem;"})
                        ]),
                        m("label", {style:"font-size:0.7rem;color:var(--text-secondary);"}, "Peralatan Tambahan"),
                        m("div", {style:"display:grid;grid-template-columns:repeat(3,1fr);gap:0.3rem;margin-top:0.3rem;"},
                            ALAT.map(function(al){ return m("label", {style:"display:flex;align-items:center;gap:0.3rem;font-size:0.7rem;"}, [m("input",{type:"checkbox",checked:!!self.editData.peralatan[al],onchange:function(e){self.editData.peralatan[al]=e.target.checked;}}), al]); })
                        ),
                        m("textarea", {placeholder:"Keperluan (opsional)", value:self.editData.keperluan, rows:2, oninput:function(e){self.editData.keperluan=e.target.value;}, style:"width:100%;margin-top:0.5rem;background:var(--input-bg);border:1px solid var(--glass-border);border-radius:0.5rem;padding:0.6rem;color:var(--text-primary);font-size:0.8rem;resize:none;"}),
                        self.msg ? m("div", {style:"margin-top:0.5rem;color:"+(self.msg.startsWith('✅')?'#10b981':'#ef4444')+";font-size:0.8rem;"}, self.msg) : null
                    ]),
                    m("button", {type:"submit", class:"dream-btn", style:"width:100%;padding:0.8rem;margin-top:0.5rem;font-size:0.9rem;"}, self.editId ? "💾 UPDATE BOOKING" : "📩 AJUKAN BOOKING")
                ]) : null,

                // TAB KALENDER
                self.tab === 'calendar' ? m("div", [
                    m("div", {class:"dream-panel", style:"padding:1rem;margin-bottom:0.75rem;text-align:center;"}, [
                        m("input", {type:"date", value:self.date, onchange:function(e){self.date=e.target.value;self.loadBookings();}, style:"width:100%;margin-bottom:0.5rem;background:var(--input-bg);border:1px solid var(--glass-border);border-radius:0.5rem;padding:0.6rem;color:var(--text-primary);font-size:0.8rem;"}),
                        m("h4", "Jadwal "+self.date)
                    ]),
                    m("div", {class:"dream-panel", style:"padding:1rem;"},
                        self.bookingsToday.length ? self.bookingsToday.map(function(b){
                            var sc = b.status==='pending'?'#f59e0b':b.status==='approved'?'#10b981':'#ef4444';
                            return m("div", {style:"padding:0.5rem;margin-bottom:0.3rem;border-left:3px solid "+sc+";background:rgba(30,41,59,0.6);border-radius:0.3rem;font-size:0.75rem;"}, [
                                m("div", {style:"font-weight:700;"}, b.ruang+" | "+b.jam_mulai+"-"+b.jam_selesai),
                                m("div", b.nama_peminjam + (b.divisi?' ('+b.divisi+')':'')),
                                m("div", {style:"display:flex;gap:0.3rem;margin-top:0.3rem;"}, [
                                    m("span", {style:"background:"+sc+";color:white;padding:0.1rem 0.4rem;border-radius:0.3rem;font-size:0.6rem;"}, b.status),
                                    b.status === 'pending' ? m("button", {onclick:function(){self.editBooking(b);}, style:"background:#3b82f6;color:white;border:none;border-radius:0.3rem;padding:0.1rem 0.4rem;font-size:0.6rem;cursor:pointer;"}, "✏️") : null,
                                    m("button", {onclick:function(){self.deleteBooking(b.id);}, style:"background:#ef4444;color:white;border:none;border-radius:0.3rem;padding:0.1rem 0.4rem;font-size:0.6rem;cursor:pointer;"}, "🗑️")
                                ])
                            ]);
                        }) : m("div", {style:"color:var(--text-secondary);"}, "Belum ada booking")
                    )
                ]) : null,

                // TAB DAFTAR
                self.tab === 'list' ? m("div", {class:"dream-panel", style:"padding:1rem;"}, [
                    m("h4", "Semua Booking"),
                    g('dreamos_bookings').length ? g('dreamos_bookings').sort(function(a,b){ return new Date(b.created)-new Date(a.created); }).map(function(b){
                        var sc = b.status==='pending'?'#f59e0b':b.status==='approved'?'#10b981':'#ef4444';
                        return m("div", {style:"padding:0.5rem;margin-bottom:0.3rem;border-left:3px solid "+sc+";background:rgba(30,41,59,0.6);border-radius:0.3rem;font-size:0.75rem;"}, [
                            m("div", {style:"font-weight:700;"}, b.tgl+" "+b.ruang+" | "+b.jam_mulai+"-"+b.jam_selesai),
                            m("div", b.nama_peminjam + (b.divisi?' ('+b.divisi+')':'')),
                            m("div", {style:"display:flex;gap:0.3rem;margin-top:0.3rem;"}, [
                                m("span", {style:"background:"+sc+";color:white;padding:0.1rem 0.4rem;border-radius:0.3rem;font-size:0.6rem;"}, b.status),
                                b.status === 'pending' ? m("button", {onclick:function(){self.editBooking(b);}, style:"background:#3b82f6;color:white;border:none;border-radius:0.3rem;padding:0.1rem 0.4rem;font-size:0.6rem;cursor:pointer;"}, "✏️") : null,
                                m("button", {onclick:function(){self.deleteBooking(b.id);}, style:"background:#ef4444;color:white;border:none;border-radius:0.3rem;padding:0.1rem 0.4rem;font-size:0.6rem;cursor:pointer;"}, "🗑️")
                            ])
                        ]);
                    }) : m("div", {style:"color:var(--text-secondary);"}, "Belum ada booking")
                ]) : null
            ]);
        }
    };

    m.mount(document.getElementById('booking-root'), BookingApp);
})();
</script>
