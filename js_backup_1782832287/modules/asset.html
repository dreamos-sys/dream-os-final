<div id="asset-root"></div>
<script>
(function() {
    function g(k){ try{return JSON.parse(localStorage.getItem(k)||'[]');}catch(e){return[];} }
    function s(k,d){ localStorage.setItem(k,JSON.stringify(d)); }
    function fmt(v){ return 'Rp '+(parseInt(v)||0).toLocaleString('id-ID'); }
    function dt(iso){ if(!iso)return '-'; var d=new Date(iso); return d.getDate()+'/'+(d.getMonth()+1)+' '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); }

    function isAdmin(){ 
        try { return DreamRuleEngine && (DreamRuleEngine.currentRole === '4s_ghost' || DreamRuleEngine.currentRole === 'ai_core'); } 
        catch(e) { return false; }
    }

    var AssetApp = {
        tab: 'asset',
        activeAssetTab: 'movable',
        showForm: false, showGudangForm: false,
        editData: { name:'', type:'movable', category:'Elektronik', location:'', value:'', condition:'Aktif', description:'' },
        gudangData: { nama:'', kategori:'janitor_indoor', jumlah:0, satuan:'pcs', minimal:5, lokasi:'', harga:0 },
        assets: [], gudangItems: [], kartuStok: [],
        laporanBulan: new Date().getMonth(), laporanTahun: new Date().getFullYear(),

        oninit: function(){ this.refreshAll(); },
        refreshAll: function(){
            this.assets = g('dreamos_assets');
            this.gudangItems = g('dreamos_stok');
            this.kartuStok = g('dreamos_kartu_stok');
            m.redraw();
        },

        saveAsset: function(){
            if(!isAdmin()){ alert('Hanya admin!'); return; }
            var d = this.editData;
            if(!d.name){ alert('Nama aset wajib!'); return; }
            var assets = g('dreamos_assets');
            assets.push({ id:'asset_'+Date.now(), name:d.name, type:d.type, category:d.category, location:d.location, value:d.value, condition:d.condition, description:d.description, date:new Date().toISOString() });
            s('dreamos_assets', assets);
            this.showForm = false;
            this.editData = { name:'', type:'movable', category:'Elektronik', location:'', value:'', condition:'Aktif', description:'' };
            this.refreshAll();
        },

        deleteAsset: function(id){
            if(!isAdmin()){ alert('Hanya admin!'); return; }
            if(!confirm('Hapus?')) return;
            s('dreamos_assets', g('dreamos_assets').filter(function(a){ return a.id!==id; }));
            this.refreshAll();
        },

        generateQR: function(id, name){
            var data = 'DREAMOS-ASSET:' + id;
            var qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(data);

            win.document.close();
        },

        generateQRGudang: function(id, name){
            var data = 'DREAMOS-GDG:' + id;
            var qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(data);
            var win = window.open('', '_blank', 'width=400,height=500');
            win.document.write('<html><head><title>QR - '+name+'</title><style>body{font-family:sans-serif;text-align:center;padding:20px;background:#0a0e27;color:white;}img{border:5px solid #f59e0b;border-radius:15px;}button{padding:10px 20px;background:#f59e0b;color:black;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:10px;}</style></head><body><h2>'+name+'</h2><img src="'+qrUrl+'"><br><p style="color:#f59e0b;">DREAMOS-GDG:'+id+'</p><button onclick="window.print()">Cetak QR</button></body></html>');

        // Gudang
        saveGudang: function(){
            if(!isAdmin()){ alert('Hanya admin!'); return; }
            var d = this.gudangData;
            if(!d.nama || d.jumlah<0){ alert('Nama dan jumlah wajib!'); return; }
            var items = g('dreamos_stok');
            var existing = items.find(function(x){ return x.nama===d.nama && x.kategori===d.kategori; });
            if(existing){
                existing.jumlah += parseInt(d.jumlah);
                existing.harga = parseInt(d.harga) || existing.harga;
                s('dreamos_stok', items);
            } else {
                items.push({ id:'stok_'+Date.now(), nama:d.nama, kategori:d.kategori, jumlah:parseInt(d.jumlah), satuan:d.satuan, minimal:parseInt(d.minimal), lokasi:d.lokasi, harga:parseInt(d.harga)||0, created:new Date().toISOString() });
                s('dreamos_stok', items);
            }
            var ks = g('dreamos_kartu_stok');
            ks.push({ id:'ks_'+Date.now(), nama:d.nama, kategori:d.kategori, tipe:'MASUK', jumlah:parseInt(d.jumlah), harga:parseInt(d.harga)||0, petugas:DreamRuleEngine?.currentRole||'system', tanggal:new Date().toISOString() });
            s('dreamos_kartu_stok', ks.slice(-500));
            this.showGudangForm = false;
            this.gudangData = { nama:'', kategori:'janitor_indoor', jumlah:0, satuan:'pcs', minimal:5, lokasi:'', harga:0 };
            this.refreshAll();
        },

        stokKeluar: function(item){
            if(!isAdmin()){ alert('Hanya admin!'); return; }
            var qty = prompt('Jumlah keluar untuk '+item.nama+':', '1');
            if(!qty || parseInt(qty)<=0) return;
            qty = parseInt(qty);
            if(qty > item.jumlah){ alert('Stok tidak cukup!'); return; }
            var items = g('dreamos_stok');
            var x = items.find(function(i){ return i.id===item.id; });
            if(x){ x.jumlah -= qty; s('dreamos_stok', items); }
            var ks = g('dreamos_kartu_stok');
            ks.push({ id:'ks_'+Date.now(), nama:item.nama, kategori:item.kategori, tipe:'KELUAR', jumlah:qty, harga:item.harga||0, petugas:DreamRuleEngine?.currentRole||'system', tanggal:new Date().toISOString() });
            s('dreamos_kartu_stok', ks.slice(-500));
            this.refreshAll();
        },

        deleteGudang: function(id){
            if(!isAdmin()){ alert('Hanya admin!'); return; }
            if(!confirm('Hapus?')) return;
            s('dreamos_stok', g('dreamos_stok').filter(function(i){ return i.id!==id; }));
            this.refreshAll();

        getLaporan: function(){
            var bln = this.laporanBulan, thn = this.laporanTahun;
            var prefix = thn+'-'+String(bln+1).padStart(2,'0');
            var ks = g('dreamos_kartu_stok').filter(function(k){ return k.tanggal && k.tanggal.startsWith(prefix); });
            var masuk = ks.filter(function(k){ return k.tipe==='MASUK'; });
            var keluar = ks.filter(function(k){ return k.tipe==='KELUAR'; });
            var totalMasuk = masuk.reduce(function(s,k){ return s+k.jumlah; },0);
            var totalKeluar = keluar.reduce(function(s,k){ return s+k.jumlah; },0);
            var nilaiMasuk = masuk.reduce(function(s,k){ return s+(k.jumlah*k.harga); },0);
            var nilaiKeluar = keluar.reduce(function(s,k){ return s+(k.jumlah*k.harga); },0);
            return { masuk:totalMasuk, keluar:totalKeluar, nilaiMasuk:fmt(nilaiMasuk), nilaiKeluar:fmt(nilaiKeluar), items:ks };
        },

            assets.forEach(function(a, idx){

                var buku = nilai - susut;
                totalPerolehan += nilai; totalSusut += susut; totalBuku += buku;

                                        m("div", {style:"font-weight:700;font-size:0.9rem;color:"+(low?'#ef4444':'var(--neon-tawhid)')+";"}, item.jumlah+" "+(item.satuan||'pcs')),
                                        m("div", {style:"font-size:0.55rem;color:var(--text-secondary);"}, "Min: "+item.minimal),
                                        m("div", {style:"display:flex;gap:0.2rem;margin-top:0.3rem;justify-content:flex-end;"}, [
                                            m("button", {onclick:function(){self.generateQRGudang(item.id,item.nama);}, style:"background:#6366f1;color:white;border:none;border-radius:0.3rem;padding:0.1rem 0.4rem;font-size:0.6rem;cursor:pointer;"}, "🔳"),
                                            isAdmin() ? [
                                                m("button", {onclick:function(){self.stokKeluar(item);}, style:"background:#ef4444;color:white;border:none;border-radius:0.3rem;padding:0.1rem 0.4rem;font-size:0.6rem;cursor:pointer;"}, "- Keluar"),
                                                m("button", {onclick:function(){self.deleteGudang(item.id);}, style:"background:#dc2626;color:white;border:none;border-radius:0.3rem;padding:0.1rem 0.4rem;font-size:0.6rem;cursor:pointer;"}, "🗑")
                                            ] : null
                                        ])
                                    ])
                                ])
                            ]);
                        })
                    )
                ]) : null,

                // ========== TAB KARTU STOK ==========
                self.tab === 'kartustok' ? m("div", {class:"dream-panel", style:"padding:1rem;"}, [
                    m("h4", {style:"color:var(--neon-tawhid);margin-bottom:0.5rem;"}, "📋 Kartu Stok"),
                    self.kartuStok.length ? m("div", {style:"max-height:400px;overflow-y:auto;"},
                        self.kartuStok.slice(-30).reverse().map(function(k){
                            return m("div", {style:"padding:0.4rem;margin-bottom:0.2rem;background:rgba(30,41,59,0.6);border-radius:0.3rem;font-size:0.75rem;display:flex;justify-content:space-between;"}, [
                                m("div", [
                                    m("span", {style:"color:"+(k.tipe==='MASUK'?'#10b981':'#ef4444')+";font-weight:700;"}, k.tipe+" "),
                                    k.nama+" x"+k.jumlah
                                ]),
                                m("div", {style:"font-size:0.65rem;color:var(--text-secondary);"}, dt(k.tanggal))
                            ]);
                        })
                    ) : m("div", {style:"color:var(--text-secondary);"}, "Belum ada transaksi")
                ]) : null,

                // ========== TAB LAPORAN ==========
                self.tab === 'laporan' ? m("div", [
                    m("div", {class:"dream-panel", style:"padding:1rem;margin-bottom:0.75rem;text-align:center;"}, [
                        m("button", {onclick:function(){self.laporanBulan--; if(self.laporanBulan<0){self.laporanBulan=11;self.laporanTahun--;}}, style:"background:var(--glass-bg);border:none;color:var(--text-primary);padding:0.5rem;border-radius:0.5rem;cursor:pointer;font-size:0.8rem;"}, "◀"),
                        m("span", {style:"margin:0 1rem;font-weight:700;"}, MONTHS[self.laporanBulan]+" "+self.laporanTahun),
                        m("button", {onclick:function(){self.laporanBulan++; if(self.laporanBulan>11){self.laporanBulan=0;self.laporanTahun++;}}, style:"background:var(--glass-bg);border:none;color:var(--text-primary);padding:0.5rem;border-radius:0.5rem;cursor:pointer;font-size:0.8rem;"}, "▶")
                    ]),
                    m("div", {class:"dream-panel", style:"padding:1rem;"}, [
                        m("div", {style:"display:flex;gap:0.5rem;margin-bottom:0.5rem;flex-wrap:wrap;"}, [
                            m("button", {onclick:function(){self.cetakPenyusutan();}, style:"flex:1;padding:0.5rem;background:#10b981;color:white;border:none;border-radius:0.5rem;cursor:pointer;font-size:0.75rem;font-weight:600;"}, "📄 Penyusutan"),
                            m("button", {onclick:function(){self.cetakRAB();}, style:"flex:1;padding:0.5rem;background:#f59e0b;color:black;border:none;border-radius:0.5rem;cursor:pointer;font-size:0.75rem;font-weight:600;"}, "💰 RAB"),
                            m("button", {onclick:function(){self.cetakKartuStok();}, style:"flex:1;padding:0.5rem;background:#6366f1;color:white;border:none;border-radius:0.5rem;cursor:pointer;font-size:0.75rem;font-weight:600;"}, "📋 Kartu Stok")
                        ]),
                        m("h4", {style:"color:var(--neon-tawhid);margin-bottom:0.5rem;"}, "Ringkasan "+MONTHS[self.laporanBulan]+" "+self.laporanTahun),
                        (function(){
                            var l = self.getLaporan();
                            return m("div", {style:"font-size:0.8rem;"}, [
                                m("div", "📥 Masuk: "+l.masuk+" item | Nilai: "+l.nilaiMasuk),
                                m("div", "📤 Keluar: "+l.keluar+" item | Nilai: "+l.nilaiKeluar),
                                m("div", "📋 Total Transaksi: "+l.items.length)
                            ]);
                        })()
                    ])
                ]) : null
            ]);
        }
    };

    m.mount(document.getElementById('asset-root'), AssetApp);
})();
</script>
