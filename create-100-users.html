<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Manager • Dream OS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0a0e27; color: #e2e8f0; font-family: 'Inter', sans-serif;
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;
        }
        .container {
            text-align: center; max-width: 550px; width: 100%;
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px);
            border: 2px solid rgba(0, 255, 157, 0.3); border-radius: 24px;
            padding: 2rem; box-shadow: 0 0 50px rgba(0, 255, 157, 0.2);
        }
        .arabic { font-family: 'Amiri', serif; font-size: 1.5rem; color: #00ff9d; margin-bottom: 0.5rem; }
        .shalawat { font-family: 'Amiri', serif; font-size: 0.8rem; color: #0ea5e9; margin-bottom: 1.5rem; }
        h1 { color: #00ff9d; margin-bottom: 0.5rem; font-size: 1.2rem; }
        h2 { color: #f59e0b; margin: 1rem 0 0.5rem; font-size: 0.9rem; }
        button {
            width: 100%; padding: 0.8rem; margin: 0.3rem 0;
            border: none; border-radius: 12px; font-size: 0.9rem; font-weight: 700; cursor: pointer;
        }
        .btn-boss { background: #f59e0b; color: black; font-size: 1rem; }
        .btn-staff { background: #10b981; color: white; font-size: 1rem; }
        .btn-test { background: #0ea5e9; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .progress {
            width: 100%; height: 8px; background: rgba(255,255,255,0.1);
            border-radius: 4px; margin: 1rem 0; overflow: hidden;
        }
        .progress-fill { height: 100%; background: #00ff9d; border-radius: 4px; width: 0%; transition: width 0.3s; }
        #log {
            margin-top: 1rem; padding: 0.8rem;
            background: rgba(0,0,0,0.3); border-radius: 12px;
            max-height: 250px; overflow-y: auto; font-size: 0.65rem;
            text-align: left; font-family: monospace;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .info { color: #f59e0b; }
    </style>
</head>
<body>
    <div class="container">
        <div class="arabic">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم</div>
        <div class="shalawat">اَللّٰهُمَّ صَلِّ عَلٰى سَيِّدِنَا مُحَمَّدٍ</div>
        
        <h1>👥 DREAM OS USER MANAGER</h1>
        
        <!-- BAGIAN 1: REGISTER PIMPINAN -->
        <h2>👑 STEP 1: Register Pimpinan</h2>
        <button class="btn-boss" onclick="registerBoss()">👑 DAFTAR KABAG & KOORDINATOR</button>
        
        <!-- BAGIAN 2: BUAT 100 STAFF -->
        <h2>👥 STEP 2: Create Staff Users</h2>
        <div class="progress"><div class="progress-fill" id="progress"></div></div>
        <div id="status" style="margin-bottom:0.5rem;font-size:0.8rem;">Ready...</div>
        <button class="btn-staff" onclick="createUsers(100)">🚀 CREATE 100 USERS</button>
        <button class="btn-test" onclick="createUsers(5)">📝 TEST (5 Users)</button>
        <button class="btn-danger" onclick="clearUsers()">🗑️ RESET ALL</button>
        
        <div id="log"></div>
    </div>

    <script>
        const ROLES = ['staff','staff','staff','staff','staff','security','janitor','maintenance'];
        
        function log(msg, type) {
            const el = document.getElementById('log');
            el.innerHTML += `<div class="${type}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            el.scrollTop = el.scrollHeight;
        }
        
        async function hashPassword(pass) {
            const encoder = new TextEncoder();
            const data = encoder.encode(pass + 'dreamos_salt_2026');
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2,'0')).join('');
        }
        
        // ========== REGISTER PIMPINAN ==========
        async function registerBoss() {
            document.getElementById('log').innerHTML = '';
            log('👑 Mendaftarkan pimpinan...', 'info');
            
            let users = JSON.parse(localStorage.getItem('dreamos_users_db') || '[]');
            let added = 0;
            
            // Kabag
            if (!users.find(u => u.email === 'vespaexcelhijaucedar@gmail.com')) {
                const kabagHash = await hashPassword('b15m1ll4h_012443410');
                users.push({
                    nama: 'Bpk. Hanung Budianto S. E',
                    email: 'vespaexcelhijaucedar@gmail.com',
                    role: 'kabag',
                    password_hash: kabagHash,
                    device_dna: '', device_dna_list: [],
                    phone: '', department: 'Kabag Umum',
                    created_at: new Date().toISOString()
                });
                log('✅ Kabag: Bpk. Hanung', 'success');
                added++;
            } else {
                log('⚠️  Kabag sudah terdaftar', 'info');
            }
            
            // Koordinator
            if (!users.find(u => u.email === 'erwinsyah1679@gmail.com')) {
                const koordHash = await hashPassword('b15m1ll4h_012443410');
                users.push({
                    nama: 'Bpk. Erwinsyah',
                    email: 'erwinsyah1679@gmail.com',
                    role: 'koord',
                    password_hash: koordHash,
                    device_dna: '', device_dna_list: [],
                    phone: '', department: 'Koordinator',
                    created_at: new Date().toISOString()
                });
                log('✅ Koordinator: Bpk. Erwinsyah', 'success');
                added++;
            } else {
                log('⚠️  Koordinator sudah terdaftar', 'info');
            }
            
            // Developer
            if (!users.find(u => u.email === 'dreamos.sch.id@gmail.com')) {
                const devHash = await hashPassword('b15m1ll4h_012443410');
                users.push({
                    nama: 'Developer',
                    email: 'dreamos.sch.id@gmail.com',
                    role: 'dev',
                    password_hash: devHash,
                    device_dna: '', device_dna_list: [],
                    phone: '', department: 'IT Development',
                    created_at: new Date().toISOString()
                });
                log('✅ Developer terdaftar', 'success');
                added++;
            }
            
            localStorage.setItem('dreamos_users_db', JSON.stringify(users));
            log('📊 Total: ' + users.length + ' user', 'info');
        }
        
        // ========== CREATE STAFF USERS ==========
        async function createUsers(count) {
            document.getElementById('progress').style.width = '0%';
            document.getElementById('status').textContent = 'Creating...';
            
            let users = JSON.parse(localStorage.getItem('dreamos_users_db') || '[]');
            const start = users.length;
            
            log('📦 Existing: ' + start + ' users', 'info');
            
            for (let i = 1; i <= count; i++) {
                const num = String(i).padStart(3, '0');
                const role = ROLES[i % ROLES.length];
                const email = 'staff' + num + '@dreamos.local';
                const nama = 'Staff ' + num;
                const pass = 'staff' + num;
                
                if (users.find(u => u.email === email)) continue;
                
                try {
                    const hashed = await hashPassword(pass);
                    users.push({
                        nama, email, role,
                        password_hash: hashed,
                        device_dna: '', device_dna_list: [],
                        phone: '', department: role === 'security' ? 'Security' : role === 'janitor' ? 'CS' : role === 'maintenance' ? 'Maint' : 'Staff',
                        created_at: new Date().toISOString()
                    });
                    log('✅ ' + nama + ' (' + role + ')', 'success');
                } catch(e) {
                    log('❌ Error: ' + e.message, 'error');
                }
                
                document.getElementById('progress').style.width = Math.round((i/count)*100) + '%';
                document.getElementById('status').textContent = i + '/' + count;
                
                if (i % 20 === 0) {
                    localStorage.setItem('dreamos_users_db', JSON.stringify(users));
                    log('💾 Saved', 'info');
                }
                
                await new Promise(r => setTimeout(r, 30));
            }
            
            localStorage.setItem('dreamos_users_db', JSON.stringify(users));
            document.getElementById('progress').style.width = '100%';
            document.getElementById('status').textContent = '✅ ' + (users.length - start) + ' new users! Total: ' + users.length;
            log('🎉 DONE! Total: ' + users.length, 'success');
        }
        
        function clearUsers() {
            if (!confirm('⚠️ HAPUS SEMUA?')) return;
            localStorage.removeItem('dreamos_users_db');
            document.getElementById('log').innerHTML = '<div class="error">✅ Cleared!</div>';
        }
        
        // Auto-check on load
        window.onload = function() {
            const users = JSON.parse(localStorage.getItem('dreamos_users_db') || '[]');
            log('📋 Database: ' + users.length + ' users', 'info');
            if (users.find(u => u.role === 'kabag')) log('✅ Kabag', 'success');
            if (users.find(u => u.role === 'koord')) log('✅ Koordinator', 'success');
            if (users.find(u => u.role === 'dev')) log('✅ Developer', 'success');
        };
    </script>
</body>
</html>
