<!DOCTYPE html>
<html><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; connect-src 'self' https:;"><meta charset="UTF-8"><title>Cek Versi</title></head>
<body>
<h2>Cek Kode Terbaru</h2>
<p>Jika di bawah ini muncul "FINAL", berarti file sudah terupdate:</p>
<p id="hasil" style="color:red; font-weight:bold;"></p>
<script>
fetch('index.html?v=final')
  .then(r => r.text())
  .then(t => {
    if (t.includes('PASSWORD LANGSUNG')) {
      document.getElementById('hasil').innerText = '✅ FINAL - Kode sudah terupdate!';
    } else {
      document.getElementById('hasil').innerText = '❌ Kode masih LAMA. Tunggu atau bersihkan cache.';
    }
  });
</script>
</body></html>
