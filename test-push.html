<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Push Notification • Dream OS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#0a0e27;color:#e2e8f0;padding:2rem;min-height:100vh}
.card{background:rgba(15,23,42,0.8);backdrop-filter:blur(20px);border:1px solid rgba(0,255,157,0.25);border-radius:16px;padding:2rem;max-width:600px;margin:0 auto}
h1{color:#00ff9d;font-size:1.5rem;margin-bottom:1rem}
.btn{display:block;width:100%;padding:0.75rem;background:#00ff9d;color:#000;border:none;border-radius:8px;font-weight:700;cursor:pointer;margin:0.5rem 0;font-size:0.9rem}
.btn:hover{background:#10b981}
.btn-secondary{background:rgba(255,255,255,0.05);color:#e2e8f0;border:1px solid rgba(255,255,255,0.15)}
input,textarea{width:100%;padding:0.6rem;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#e2e8f0;margin:0.5rem 0}
.status{padding:0.75rem;background:rgba(0,0,0,0.3);border-radius:8px;margin:1rem 0;font-size:0.85rem}
.log{background:#000;padding:1rem;border-radius:8px;font-family:monospace;font-size:0.75rem;max-height:200px;overflow-y:auto;margin-top:1rem}
</style>
</head>
<body>
<div class="card">
<h1>🔔 Test Push Notification</h1>

<div class="status" id="status">Checking subscription...</div>

<button class="btn" onclick="subscribe()">1️⃣ Subscribe Push</button>
<button class="btn btn-secondary" onclick="unsubscribe()">🔕 Unsubscribe</button>

<hr style="margin:1.5rem 0;border:none;border-top:1px solid rgba(255,255,255,0.1)">

<h2 style="color:#00ff9d;font-size:1.1rem;margin-bottom:0.5rem">📤 Test Kirim Push</h2>

<input type="text" id="title" placeholder="Judul (contoh: Booking Baru)" value="📅 Test Push">
<textarea id="body" rows="3" placeholder="Isi pesan">Ini adalah test push notification dari Dream OS</textarea>

<button class="btn" onclick="sendBroadcast()">📢 Broadcast ke Semua</button>
<button class="btn btn-secondary" onclick="sendToRole('kabag_umum')">👔 Kirim ke Kabag</button>
<button class="btn btn-secondary" onclick="sendToRole('security')">🛡️ Kirim ke Security</button>

<div class="log" id="log"></div>
</div>

<script>
const log = (msg) => {
  const el = document.getElementById('log');
  el.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
  el.scrollTop = el.scrollHeight;
};

async function checkStatus() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    const status = document.getElementById('status');
    if (sub) {
      status.innerHTML = '✅ <strong>Subscribed</strong><br><small>' + sub.endpoint.slice(0, 50) + '...</small>';
      status.style.background = 'rgba(16,185,129,0.1)';
      status.style.border = '1px solid rgba(16,185,129,0.3)';
    } else {
      status.innerHTML = '⚠️ <strong>Not subscribed</strong>';
      status.style.background = 'rgba(245,158,11,0.1)';
      status.style.border = '1px solid rgba(245,158,11,0.3)';
    }
  } catch (err) {
    log('❌ ' + err.message);
  }
}

async function subscribe() {
  log('Subscribing...');
  if (window.subscribePush) {
    await window.subscribePush();
    checkStatus();
  } else {
    log('❌ subscribePush not found');
  }
}

async function unsubscribe() {
  log('Unsubscribing...');
  if (window.unsubscribePush) {
    await window.unsubscribePush();
    checkStatus();
  }
}

async function sendBroadcast() {
  const title = document.getElementById('title').value;
  const body = document.getElementById('body').value;
  log(`Broadcasting: ${title}`);
  try {
    const result = await window.PushAdmin.broadcast(title, body);
    log(`✅ Sent to ${result.count} users`);
  } catch (err) {
    log('❌ ' + err.message);
  }
}

async function sendToRole(role) {
  const title = document.getElementById('title').value;
  const body = document.getElementById('body').value;
  log(`Sending to ${role}...`);
  try {
    const result = await window.PushAdmin.sendToRole(role, title, body);
    log(`✅ Sent to ${result.count} ${role}`);
  } catch (err) {
    log('❌ ' + err.message);
  }
}

checkStatus();
log('Ready');
</script>
</body>
</html>
