<!DOCTYPE html>
<html>
<head>
    <title>Fix Role • Dream OS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: monospace; padding: 2rem; background: #0a0e27; color: #00ff9d; text-align: center; }
        button { padding: 1.5rem 3rem; background: #f59e0b; color: black; border: none; border-radius: 16px; font-size: 1.2rem; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🔧 Fix Developer Role</h1>
    <p>Klik tombol di bawah untuk mengubah role menjadi Developer:</p>
    <button onclick="fixRole()">👑 JADIKAN DEVELOPER</button>
    <div id="result" style="margin-top:1rem;"></div>
    
    <script>
    function fixRole() {
        var devUser = {
            nama: 'Developer',
            email: 'dreamos.sch.id@gmail.com',
            role: 'dev',
            device_dna: '',
            device_dna_list: [],
            phone: '',
            department: 'IT Development'
        };
        localStorage.setItem('dreamos_bound_user', JSON.stringify(devUser));
        localStorage.setItem('dreamos_session_active', 'true');
        
        var users = JSON.parse(localStorage.getItem('dreamos_users_db') || '[]');
        var admin = users.find(function(u) { return u.email === 'dreamos.sch.id@gmail.com'; });
        if (admin) {
            admin.role = 'dev';
            localStorage.setItem('dreamos_users_db', JSON.stringify(users));
        }
        
        document.getElementById('result').innerHTML = 
            '<h2>✅ Role diubah ke DEVELOPER!</h2>' +
            '<p>Role: <b style="color:#f59e0b;">dev</b></p>' +
            '<p><a href="index.html" style="color:#0ea5e9;font-size:1.2rem;">🔐 BUKA DREAM OS</a></p>';
    }
    </script>
</body>
</html>
