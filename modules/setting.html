<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise Settings • Dream OS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e27;
      --panel: rgba(15, 23, 42, 0.85);
      --border: #00ff9d;
      --text: #f8fafc;
      --text-sub: #cbd5e1;
      --accent: #0ea5e9;
      --warning: #ef4444;
      --neon: #00ff9d;
    }

    [data-theme="light"] {
      --bg: #f1f5f9;
      --panel: #ffffff;
      --border: #0284c7;
      --text: #0f172a;
      --text-sub: #334155;
      --neon: #0369a1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; }

    .glass {
      background: var(--panel);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 1.2rem;
      margin-bottom: 1rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .back-btn { position: fixed; bottom: calc(1.5rem + env(safe-area-inset-bottom)); left: 1rem; z-index: 1000; background: var(--panel); border: 1.5px solid var(--border); color: var(--text); padding: 0.6rem 1.2rem; border-radius: 12px; font-weight: 800; cursor: pointer; }
    .btn { padding: 0.5rem 1rem; border: none; border-radius: 10px; font-weight: 700; font-size: 0.75rem; cursor: pointer; }
    .btn-danger { background: var(--warning); color: #fff; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-success { background: #10b981; color: #fff; }

    .tab-nav { display: flex; gap: 0.4rem; margin-bottom: 1rem; overflow-x: auto; padding-bottom: 0.3rem; }
    .tab-btn { padding: 0.6rem 1rem; border-radius: 10px; font-size: 0.75rem; font-weight: 700; cursor: pointer; border: 1px solid var(--border); background: var(--panel); color: var(--text-sub); white-space: nowrap; }
    .tab-btn.active { background: var(--neon); color: #fff; border-color: var(--neon); }

    .set-row { display: flex; justify-content: space-between; align-items: center; padding: 0.85rem 0; border-bottom: 1px solid rgba(150,150,150,0.15); }
    .set-label { font-size: 0.875rem; color: var(--text); font-weight: 700; }
    .set-desc { font-size: 0.75rem; color: var(--text-sub); margin-top: 0.15rem; }

    .toggle-switch { width: 48px; height: 26px; background: #475569; border-radius: 13px; position: relative; cursor: pointer; transition: 0.3s; flex-shrink: 0; }
    .toggle-switch.on { background: #10b981; }
    .toggle-switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; background: white; border-radius: 50%; transition: 0.3s; }
    .toggle-switch.on::after { left: 24px; }

    input[type=range] { width: 100px; }
  </style>
</head>
<body>
  <button class="back-btn" onclick="goHomeSafe()">← HOME</button>

  <div style="max-width: 700px; margin: 0 auto; padding: 1.5rem 1rem 5rem;">
    <div class="glass" style="display: flex; justify-content: space-between; align-items: center;">
      <div>
        <h2 style="color: var(--neon); margin: 0; font-size: 1.1rem; font-weight:800;">⚙️ Enterprise Settings</h2>
        <p style="color: var(--text-sub); font-size: 0.75rem; margin-top:0.2rem;">ISO 9241-171 • WCAG 2.2 AAA High Contrast</p>
      </div>
      <div style="display: flex; gap: 0.3rem;">
        <button class="btn btn-primary" onclick="exportSettings()">📥 Export</button>
        <button class="btn btn-success" onclick="importSettings()">📤 Import</button>
      </div>
    </div>

    <div class="tab-nav">
      <button class="tab-btn active" onclick="switchTab('display', this)">🎨 Display</button>
      <button class="tab-btn" onclick="switchTab('access', this)">♿ Access</button>
      <button class="tab-btn" onclick="switchTab('system', this)">📊 System</button>
    </div>

    <div id="tab-display" class="tab-content">
      <div class="glass">
        <div class="set-row">
          <div>
            <div class="set-label">Dark Mode / Light Mode</div>
            <div class="set-desc">Ganti tema real-time seluruh sistem</div>
          </div>
          <div class="toggle-switch on" id="tog-theme" onclick="toggleTheme()"></div>
        </div>
        <div class="set-row">
          <div>
            <div class="set-label">Font Scale</div>
            <div class="set-desc">Perbesar teks global</div>
          </div>
          <input type="range" min="80" max="140" value="100" oninput="updateFont(this.value)">
        </div>
      </div>
    </div>

    <div id="tab-access" class="tab-content" style="display:none;">
      <div class="glass">
        <div class="set-row">
          <div>
            <div class="set-label">High Contrast ISO Mode</div>
            <div class="set-desc">Aksen border 100% tegas untuk keterbacaan tinggi</div>
          </div>
          <div class="toggle-switch" onclick="this.classList.toggle('on')"></div>
        </div>
      </div>
    </div>

    <div id="tab-system" class="tab-content" style="display:none;">
      <div class="glass">
        <div class="set-row">
          <div><div class="set-label">Status Koneksi</div></div>
          <strong style="color:#10b981;">🟢 Online Cloud Sync</strong>
        </div>
      </div>
    </div>
  </div>

<script>
function goHomeSafe(){ window.location.href = '../index.html'; }

function toggleTheme() {
  const isDark = document.body.getAttribute('data-theme') !== 'light';
  const newTheme = isDark ? 'light' : 'dark';
  document.body.setAttribute('data-theme', newTheme);
  document.documentElement.setAttribute('data-theme', newTheme);
  document.getElementById('tog-theme').classList.toggle('on', !isDark);
  localStorage.setItem('dreamos_theme', newTheme);
  
  // Broadcast ke parent window jika di dlm iframe
  try {
    if (window.parent) window.parent.document.documentElement.setAttribute('data-theme', newTheme);
  } catch(e) {}
}

function updateFont(val) {
  document.documentElement.style.fontSize = val + '%';
  localStorage.setItem('dreamos_fontsize', val);
}

function switchTab(name, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
  btn.classList.add('active');
  document.getElementById('tab-' + name).style.display = 'block';
}

// Load saved theme
(function() {
  const saved = localStorage.getItem('dreamos_theme') || 'dark';
  document.body.setAttribute('data-theme', saved);
  document.documentElement.setAttribute('data-theme', saved);
  const tog = document.getElementById('tog-theme');
  if (tog) tog.classList.toggle('on', saved === 'dark');
})();
</script>
</body>
</html>
