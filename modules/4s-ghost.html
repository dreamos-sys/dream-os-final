<!DOCTYPE html>
<html lang="id">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; connect-src 'self' https:;">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>4S Ghost • Dev Enterprise Pro v9.0</title>
  <style>
    :root {
      --bg: #0a0e27;
      --surface: #131a2b;
      --accent: #2dd4bf;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --danger: #ef4444;
      --warning: #f59e0b;
      --purple: #8b5cf6;

    * { box-sizing: border-box; margin: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }
    #lock-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100%; background: radial-gradient(circle at 30% 30%, #1a1f3a, #0a0e27); }

    .workspace { display: flex; width: 100%; height: 100vh; }
    .sidebar {
      width: 260px; background: var(--surface); border-right: 1px solid rgba(45,212,191,0.15);
      display: flex; flex-direction: column; overflow-y: auto; padding: 1rem 0;
    }
    .sidebar-item {
      display: flex; align-items: center; gap: 0.8rem; padding: 0.7rem 1.2rem;
      color: var(--muted); cursor: pointer; font-size: 0.85rem; font-weight: 500;
      transition: all 0.2s; border-left: 3px solid transparent;
    }
    .sidebar-item:hover, .sidebar-item.active {
      background: rgba(45,212,191,0.08); color: var(--accent);
      border-left-color: var(--accent);
    }
    .main-panel { flex: 1; display: flex; flex-direction: column; background: #0f1419; }
    .toolbar {
      padding: 0.5rem 1rem; background: var(--surface); border-bottom: 1px solid rgba(45,212,191,0.2);
      display: flex; justify-content: space-between; align-items: center;
    }
    .content-area { flex: 1; padding: 1.2rem; overflow-y: auto; }
    .log-area {
      height: 220px; background: #050510; border-top: 1px solid rgba(45,212,191,0.3);
      padding: 0.7rem; font-family: 'Courier New', monospace; font-size: 0.7rem;
      color: var(--accent); overflow-y: auto; resize: vertical;
    }
    .btn {
      padding: 0.5rem 1rem; border: none; border-radius: 6px; font-weight: 600;
      cursor: pointer; background: var(--accent); color: #000; font-size: 0.8rem;
    }
    .btn-ghost { background: transparent; border: 1px solid #334155; color: var(--text); }
    .btn-danger { background: var(--danger); color: white; }
    .btn-purple { background: var(--purple); color: white; }
    .card { background: var(--surface); padding: 1rem; border-radius: 10px; border: 1px solid rgba(45,212,191,0.15); margin-bottom: 1rem; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    input, select, textarea {
      width: 100%; padding: 0.6rem; background: #0f172a; border: 1px solid #334155;
      border-radius: 6px; color: #e2e8f0; font-family: 'Courier New', monospace; font-size: 0.8rem;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
    th, td { padding: 0.4rem; border-bottom: 1px solid #1e293b; text-align: left; }
    th { color: var(--accent); }
    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 999;
    }

      background: #1e293b; border: 2px solid var(--accent); border-radius: 1rem; padding: 2rem; max-width: 400px; text-align: center;

      .sidebar { width: 80px; }
      .sidebar-item span { display: none; }

<body>
<div id="lock-screen">
  <img src="../assets/icon-512.png" id="logo-tap" alt="Logo">
  <p style="color:var(--muted); margin-top:1.5rem;">Ketuk logo 7x untuk masuk</p>
</div>

<div id="workspace" class="workspace" style="display:none;">
  <div class="sidebar" id="sidebar"></div>
  <div class="main-panel">
    <div class="toolbar">
      <strong>4S GHOST REMOTE CENTER v9.0</strong>
      <div style="display:flex; gap:0.5rem;">
        <span id="online-status">⚪ Offline</span>
        <button class="btn btn-ghost" onclick="clearLog()">🧹 Log</button>
        <button class="btn btn-ghost" onclick="lockWorkspace()">🔒 Kunci</button>
        <button class="btn" onclick="window.location.href='../index.html'">🏠 Home</button>
      </div>
    </div>
    <div class="content-area" id="content-area"></div>
    <div class="log-area" id="ghost-log"><div>> [SYS] Ghost v9.0 Enterprise Pro siap...</div></div>
  </div>
</div>

<script>
// ==================== AUTH ====================
const logo = document.getElementById('logo-tap');
let tapCount = 0, tapTimer;

async function sha256(msg) {
  const buf = new TextEncoder().encode(msg);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
}

logo.addEventListener('click', () => {
  tapCount++;
  if (tapTimer) clearTimeout(tapTimer);
  tapTimer = setTimeout(() => tapCount = 0, 2000);
  if (tapCount === 7) { clearTimeout(tapTimer); tapCount = 0; showPinModal(); }
});

function showPinModal() {
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div class="modal-content">
      <h3>🔐 4S GHOST AUTH</h3>
      <input type="password" id="pin-input" placeholder="PIN Rahasia">
      <div style="margin-top:1rem;">
        <button class="btn" id="pin-ok">Masuk</button>
        <button class="btn btn-ghost" id="pin-cancel">Batal</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  document.getElementById('pin-ok').onclick = async () => {
    const pin = document.getElementById('pin-input').value;
    if (await sha256(pin) === await sha256("4s_ghost_2026")) {
      document.getElementById('lock-screen').style.display = 'none';
      document.getElementById('workspace').style.display = 'flex';
      modal.remove();
      log('🔓 Workspace unlocked', 'success');
    } else alert('PIN salah!');
  };
  document.getElementById('pin-cancel').onclick = () => modal.remove();
  setTimeout(() => document.getElementById('pin-input').focus(), 100);
}

function lockWorkspace() {
  document.getElementById('workspace').style.display = 'none';
  document.getElementById('lock-screen').style.display = 'flex';
}

// ==================== LOG ====================
function log(msg, type='info') {
  const el = document.getElementById('ghost-log');
  if (!el) return;
  const colors = { info:'#2dd4bf', warn:'#f59e0b', error:'#ef4444', success:'#10b981', sys:'#8b5cf6' };
  const time = new Date().toLocaleTimeString('id-ID');
  el.innerHTML += `<div style="color:${colors[type]||'#94a3b8'}">[${time}] ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}
function clearLog() { document.getElementById('ghost-log').innerHTML = '<div>> Log dibersihkan...</div>'; }

// ==================== CLOUDFLARE CONFIG ====================
const CFG_KEY = 'ghost_cloudflare_config';
function getCFG() { try { return JSON.parse(localStorage.getItem(CFG_KEY)); } catch(e) { return null; } }
function saveCFG(url, key) { localStorage.setItem(CFG_KEY, JSON.stringify({ url, key: btoa(key) })); }
function getAPIKey() { const c = getCFG(); return c ? atob(c.key) : null; }
function getWorkerURL() { const c = getCFG(); return c ? c.url.replace(/\/$/,'') : ''; }

function updateOnlineStatus(c) {
  const el = document.getElementById('online-status');
  el.innerHTML = c ? '🟢 Online' : '⚪ Offline';
  el.style.color = c ? '#10b981' : '#94a3b8';
}

async function apiCall(path, method='GET', body=null) {
  const url = getWorkerURL() + path;
  const key = getAPIKey();
  if (!url || !key) throw new Error('Belum dikonfigurasi');
  const opts = {
    method,
    headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' }
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return await res.json();
}

// ==================== TOOLS ====================
const tools = [
  { id: 'dashboard', icon: '📊', label: 'Dashboard', render: renderDashboard },
  { id: 'sync', icon: '☁️', label: 'Delta Sync', render: renderSync },
  { id: 'remote', icon: '🖥️', label: 'Remote CMD', render: renderRemote },
  { id: 'broadcast', icon: '📢', label: 'Broadcast', render: renderBroadcast },
  { id: 'audit', icon: '📜', label: 'Audit Trail', render: renderAudit },
  { id: 'health', icon: '💚', label: 'Health', render: renderHealth },
  { id: 'explorer', icon: '🗄️', label: 'Data Explorer', render: renderExplorer },
  { id: 'console', icon: '>_', label: 'JS Console', render: renderConsole },
  { id: 'network', icon: '🌐', label: 'Network Spy', render: renderNetwork },
  { id: 'sql', icon: '🗃️', label: 'SQL Play', render: renderSQL },
  { id: 'editor', icon: '📝', label: 'Editor', render: renderEditor },
  { id: 'security', icon: '🛡️', label: 'Security', render: renderSecurity },
  { id: 'snippets', icon: '📋', label: 'Snippets', render: renderSnippets },
  { id: 'backup', icon: '💾', label: 'Backup File', render: renderBackup },
  { id: 'dns', icon: '🔍', label: 'DNS/WHOIS', render: renderDNS },
  { id: 'websocket', icon: '📡', label: 'WebSocket', render: renderWebSocket },
  { id: 'defcon', icon: '💣', label: 'DEFCON', render: renderDefcon }
];

document.getElementById('sidebar').innerHTML = tools.map(t =>
  `<div class="sidebar-item" data-tool="${t.id}" onclick="switchTool('${t.id}')">
    <span style="font-size:1.3rem;">${t.icon}</span> <span>${t.label}</span>
  </div>`
).join('');

function switchTool(id) {
  document.querySelectorAll('.sidebar-item').forEach(e => e.classList.remove('active'));
  const el = document.querySelector(`[data-tool="${id}"]`);
  if (el) el.classList.add('active');
  const tool = tools.find(t => t.id === id);
  if (tool) document.getElementById('content-area').innerHTML = tool.render();
}

// ==================== RENDER FUNCTIONS ====================
function renderDashboard() {
  const m = ['dreamos_maintenance_tasks','dreamos_assets','dreamos_stok','dreamos_k3_reports'];
  const c = m.map(k => JSON.parse(localStorage.getItem(k)||'[]').length);
  return `<h3>📊 Dashboard</h3>
    <div class="grid-2">
      <div class="card"><h4>🔧 Maintenance</h4><p style="font-size:2rem;">${c[0]}</p></div>
      <div class="card"><h4>🏢 Aset</h4><p style="font-size:2rem;">${c[1]}</p></div>
      <div class="card"><h4>📦 Stok</h4><p style="font-size:2rem;">${c[2]}</p></div>
      <div class="card"><h4>⚠️ K3</h4><p style="font-size:2rem;">${c[3]}</p></div>
    </div>`;
}

function renderSync() {
  const cfg = getCFG();
  const dreamKeys = Object.keys(localStorage).filter(k => k.startsWith('dreamos_'));
  return `<div class="card">
    <h3>☁️ Delta Sync</h3>
    <p>Status: ${cfg ? '🟢 Terkonfigurasi' : '⚪ Belum'}</p>
    <p>Data Lokal: ${dreamKeys.length} modul</p>
    <input id="cf-url" placeholder="Worker URL" value="${cfg?.url || ''}">
    <input id="cf-key" type="password" placeholder="API Key" value="${cfg ? '••••••••' : ''}">
    <div style="display:flex; gap:0.5rem; margin-top:0.5rem;">
      <button class="btn" onclick="saveAndTest()">Simpan & Tes</button>
      <button class="btn" onclick="uploadDelta()">Upload</button>
      <button class="btn btn-ghost" onclick="restoreDelta()">Restore</button>
    </div>
  </div>`;
}

function saveAndTest() {
  const url = document.getElementById('cf-url').value.trim();
  const key = document.getElementById('cf-key').value.trim();
  if (!url || !key) return alert('Isi URL dan Key');
  if (key !== '••••••••') saveCFG(url, key);
  apiCall('/health').then(() => { updateOnlineStatus(true); log('✅ Terhubung'); switchTool('sync'); })
    .catch(e => { updateOnlineStatus(false); log('❌ '+e.message, 'error'); });
}

async function uploadDelta() {
  const modules = {};
  for (let i=0; i<localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k.startsWith('dreamos_')) modules[k] = localStorage.getItem(k);
  }
  try {
    const r = await apiCall('/sync', 'POST', { data: modules });
    log(`✅ Upload: ${r.updated} modul`, 'success');
  } catch(e) { log('❌ '+e.message, 'error'); }
}

async function restoreDelta() {
  try {
    const r = await apiCall('/sync');
    let count = 0;
    for (const [key, val] of Object.entries(r.data || {})) {
      const localTs = localStorage.getItem(key+'_ts') || '0';
      if ((r.timestamps[key]||'0') > localTs) {
        localStorage.setItem(key, val);
        localStorage.setItem(key+'_ts', r.timestamps[key]);
        count++;
      }
    }
    log(`✅ Restore: ${count} modul`, 'success');
  } catch(e) { log('❌ '+e.message, 'error'); }
}

// ==================== REMOTE COMMAND ====================
function renderRemote() {
  return `<div class="card">
    <h3>🖥️ Remote Command</h3>
    <p style="color:var(--muted);">Kirim perintah JS ke semua client.</p>
    <textarea id="cmd-input" rows="3" placeholder="alert('Maintenance!')"></textarea>
    <button class="btn btn-purple" onclick="sendCommand()">Kirim</button>
    <button class="btn btn-ghost" onclick="checkCommands()">Cek Perintah</button>
    <div id="cmd-response" style="margin-top:0.5rem; font-size:0.8rem;"></div>
  </div>`;
}

async function sendCommand() {
  const cmd = document.getElementById('cmd-input').value.trim();
  if (!cmd) return;
  try {
    await apiCall('/command', 'POST', { command: cmd, target: 'all' });
    log('✅ Perintah terkirim', 'success');
  } catch(e) { log('❌ '+e.message, 'error'); }
}

async function checkCommands() {
  try {
    const cmds = await apiCall('/command');
    cmds.filter(c => !c.executed).forEach(c => {
      try { eval(c.command); log('▶️ ' + c.command.substring(0,30), 'sys'); }
      catch(e) { log('❌ Gagal: '+e.message, 'error'); }
    });
  } catch(e) { log('❌ '+e.message, 'error'); }
}

// ==================== BROADCAST ====================
function renderBroadcast() {
  return `<div class="card">
    <h3>📢 System Broadcast</h3>
    <textarea id="bc-msg" rows="2" placeholder="Pesan..."></textarea>
    <select id="bc-level"><option value="info">Info</option><option value="warn">Peringatan</option><option value="error">Darurat</option></select>
    <button class="btn" onclick="sendBroadcast()">Kirim</button>
    <div id="bc-list" style="margin-top:0.5rem; font-size:0.75rem;"></div>
  </div>`;
}

async function sendBroadcast() {
  const msg = document.getElementById('bc-msg').value.trim();
  const level = document.getElementById('bc-level').value;
  if (!msg) return;
  try {
    await apiCall('/broadcast', 'POST', { message: msg, level });
    log('✅ Broadcast terkirim', 'success');
    loadBroadcasts();
  } catch(e) { log('❌ '+e.message, 'error'); }
}

async function loadBroadcasts() {
  try {
    const bcs = await apiCall('/broadcast');
    document.getElementById('bc-list').innerHTML = bcs.map(b =>
      `<div style="padding:0.3rem;border-left:3px solid ${b.level==='error'?'#ef4444':b.level==='warn'?'#f59e0b':'#2dd4bf'};margin:0.2rem 0;padding-left:0.5rem;">
        <small>${new Date(b.timestamp).toLocaleString('id-ID')}</small><br>${b.message}
      </div>`
    ).join('');
  } catch(e) {}
}

// ==================== AUDIT TRAIL ====================
function renderAudit() {
  return `<div class="card">
    <h3>📜 Audit Trail (Cloud)</h3>
    <button class="btn" onclick="loadAudit()">Muat Log</button>
    <div id="audit-list" style="margin-top:0.5rem; font-size:0.7rem; max-height:300px; overflow-y:auto;"></div>
  </div>`;
}

async function loadAudit() {
  try {
    const logs = await apiCall('/audit');
    document.getElementById('audit-list').innerHTML = logs.map(l =>
      `<div style="padding:0.2rem; border-bottom:1px solid #1e293b;">
        <span style="color:var(--accent);">${new Date(l.timestamp).toLocaleString('id-ID')}</span>
        ${l.action} - ${l.detail || ''}
      </div>`
    ).join('');
  } catch(e) { log('❌ '+e.message, 'error'); }
}

// ==================== HEALTH ====================
function renderHealth() {
  return `<div class="card">
    <h3>💚 System Health</h3>
    <button class="btn" onclick="checkHealth()">Periksa</button>
    <div id="health-result" style="margin-top:0.5rem;"></div>
  </div>`;
}

async function checkHealth() {
  try {
    const h = await apiCall('/health');
    document.getElementById('health-result').innerHTML = `
      <p>Status: <span style="color:#10b981;">${h.status}</span></p>
      <p>KV: ${h.kv}</p>
      <p>Uptime: ${new Date(h.uptime).toLocaleString('id-ID')}</p>
    `;
    updateOnlineStatus(true);
  } catch(e) {
    document.getElementById('health-result').innerHTML = `<p style="color:red;">Offline</p>`;
    updateOnlineStatus(false);
  }
}

// ==================== EXISTING TOOLS ====================
function renderExplorer() {
  const keys = Object.keys(localStorage).filter(k => k.startsWith('dreamos_'));
  return `<div class="card">
    <h3>🗄️ LocalStorage</h3>
    <table style="width:100%; font-size:0.75rem;">
      ${keys.map(k => `<tr><td>${k.replace('dreamos_','')}</td><td><button class="btn btn-ghost" onclick="alert(localStorage.getItem('${k}'))">Lihat</button></td></tr>`).join('')}
    </table>
  </div>`;
}

function renderConsole() {
  return `<div class="card">
    <h3>>_ JS Console</h3>
    <textarea id="js-code" rows="4" placeholder="// JS code..."></textarea>
    <button class="btn" onclick="executeJS()" style="margin-top:0.3rem;">Run</button>
    <pre id="js-out" style="margin-top:0.3rem; background:#0f172a; padding:0.5rem; border-radius:6px;"></pre>
  </div>`;
}
function executeJS() {
  const code = document.getElementById('js-code').value;
  try { document.getElementById('js-out').textContent = eval(code); }
  catch(e) { document.getElementById('js-out').textContent = 'Error: '+e.message; }
}

// Network Spy
let spyActive = false;
function renderNetwork() {
  return `<div class="card">
    <h3>🌐 Network Spy</h3>
    <p style="color:var(--muted);">Merekam fetch/XHR.</p>
    <button class="btn" id="spy-btn" onclick="toggleSpy()">${spyActive?'Matikan':'Aktifkan'}</button>
  </div>`;
}
function toggleSpy() {
  if (spyActive) {
    spyActive = false;
    document.getElementById('spy-btn').textContent = 'Aktifkan';
    log('Spy mati');
  } else {
    spyActive = true;
    const orig = window.fetch;
    window.fetch = function(...a) {
      const url = typeof a[0]==='string' ? a[0] : a[0]?.url||'';
      log(`[NET] ${url}`, 'sys');
      return orig.apply(this, a).then(r => { log(`[NET] ${r.status}`, 'success'); return r; });
    };
    document.getElementById('spy-btn').textContent = 'Matikan';
    log('Spy aktif');
  }
}

// SQL Play
function renderSQL() {
  return `<div class="card">
    <h3>🗃️ SQL Play</h3>
    <textarea id="sql-input" rows="3" placeholder="SELECT * FROM maintenance_tasks;"></textarea>
    <button class="btn" onclick="runSQL()">Execute</button>
    <pre id="sql-output" style="margin-top:0.5rem; background:#0f172a; padding:0.5rem;"></pre>
  </div>`;
}
function runSQL() {
  const q = document.getElementById('sql-input').value.toLowerCase();
  const out = document.getElementById('sql-output');
  if (q.includes('select * from')) {
    const table = q.split('from ')[1]?.replace(/[^a-z_]/g,'').trim();
    out.textContent = localStorage.getItem('dreamos_'+table) || 'Tidak ditemukan';
  } else out.textContent = 'Hanya SELECT * FROM [key]';
}

// Editor
function renderEditor() {
  const saved = localStorage.getItem('ghost_editor_content') || '';
  return `<div class="card">
    <h3>📝 Code Editor</h3>
    <textarea id="editor-text" rows="15">${saved}</textarea>
    <button class="btn" onclick="saveEditor()">Simpan</button>
  </div>`;
}
function saveEditor() {
  localStorage.setItem('ghost_editor_content', document.getElementById('editor-text').value);
  log('Tersimpan');
}

// Security
function renderSecurity() {
  const hash = (()=>{const ua=navigator.userAgent,si=screen.width+'x'+screen.height+'-'+screen.colorDepth,raw=ua+si+navigator.language;let h=0;for(let i=0;i<raw.length;i++){h=((h<<5)-h)+raw.charCodeAt(i);h|=0;}return 'DEV-'+Math.abs(h).toString(16).toUpperCase().slice(0,8);})();
  return `<div class="card">
    <h3>🛡️ Security</h3>
    <p>Hash: ${hash}</p>
    <p>HTTPS: ${location.protocol==='https:'?'✅':'❌'}</p>
  </div>`;
}

// Snippets
function renderSnippets() {
  const snippets = JSON.parse(localStorage.getItem('ghost_snippets')||'[]');
  return `<div class="card">
    <h3>📋 Snippets</h3>
    <input id="sn-name" placeholder="Nama">
    <textarea id="sn-code" rows="3" placeholder="Kode"></textarea>
    <button class="btn" onclick="saveSnippet()">Simpan</button>
    <div style="margin-top:0.5rem;">${snippets.map((s,i)=>`<div style="background:#1e293b;padding:0.3rem;margin:0.2rem 0;border-radius:4px;display:flex;justify-content:space-between;"><span>${s.name}</span><div><button class="btn btn-ghost" onclick="runSnippet(${i})">▶</button><button class="btn btn-ghost" onclick="deleteSnippet(${i})">🗑️</button></div></div>`).join('')}</div>
  </div>`;
}
function saveSnippet() {
  const name = document.getElementById('sn-name').value.trim();
  const code = document.getElementById('sn-code').value.trim();
  if(!name||!code) return;
  const snippets = JSON.parse(localStorage.getItem('ghost_snippets')||'[]');
  snippets.push({name,code});
  localStorage.setItem('ghost_snippets', JSON.stringify(snippets));
  switchTool('snippets');
}
function runSnippet(i) { eval(JSON.parse(localStorage.getItem('ghost_snippets'))[i].code); }
function deleteSnippet(i) {
  const snippets = JSON.parse(localStorage.getItem('ghost_snippets')||'[]');
  snippets.splice(i,1);
  localStorage.setItem('ghost_snippets', JSON.stringify(snippets));
  switchTool('snippets');
}

// Backup
function renderBackup() {
  return `<div class="card">
    <h3>💾 Backup & Restore</h3>
    <button class="btn" onclick="backupData()">Unduh Backup</button>
    <button class="btn btn-ghost" onclick="document.getElementById('restore-file').click()">Restore</button>
    <input type="file" id="restore-file" accept=".json" onchange="restoreData(this)" style="display:none;">
  </div>`;
}
function backupData() {
  const data = {};
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('dreamos_')||k.startsWith('ghost_'))data[k]=localStorage.getItem(k);}
  const blob = new Blob([JSON.stringify(data)],{type:'application/json'});
  const a = document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='backup_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}
function restoreData(input) {
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const data = JSON.parse(e.target.result);
    for(const k in data) localStorage.setItem(k, data[k]);
    log('✅ Direstore');
  };
  reader.readAsText(file);
}

// DNS/WHOIS
function renderDNS() {
  return `<div class="card">
    <h3>🔍 DNS/WHOIS</h3>
    <input id="dns-in" placeholder="Domain">
    <button class="btn" onclick="dnsLookup()">DNS</button>
    <button class="btn" onclick="whoisLookup()">WHOIS</button>
    <pre id="dns-out" style="margin-top:0.5rem; background:#0f172a; padding:0.5rem; min-height:60px;"></pre>
  </div>`;
}
async function dnsLookup() {
  const d = document.getElementById('dns-in').value.trim();
  if(!d) return;
  try {
    const r = await fetch(`https://dns.google/resolve?name=${d}&type=A`);
    const data = await r.json();
    document.getElementById('dns-out').textContent = data.Answer ? data.Answer.map(a=>a.name+' -> '+a.data).join('\n') : 'Tidak ada';
  } catch(e) { document.getElementById('dns-out').textContent = 'Error'; }
}
async function whoisLookup() {
  const d = document.getElementById('dns-in').value.trim();
  if(!d) return;
  try {
    const r = await fetch(`https://api.hackertarget.com/whois/?q=${d}`);
    document.getElementById('dns-out').textContent = (await r.text()).split('\n').slice(0,20).join('\n');
  } catch(e) { document.getElementById('dns-out').textContent = 'Error'; }
}

// WebSocket
let wsInst = null;
function renderWebSocket() {
  return `<div class="card">
    <h3>📡 WebSocket</h3>
    <input id="ws-url" placeholder="ws://...">
    <button class="btn" onclick="connectWS()">Connect</button>
    <button class="btn" onclick="disconnectWS()">Disconnect</button>
    <pre id="ws-out" style="margin-top:0.5rem; background:#0f172a; padding:0.5rem; min-height:60px;"></pre>
  </div>`;
}
function connectWS() {
  const url = document.getElementById('ws-url').value;
  if(!url) return;
  wsInst = new WebSocket(url);
  wsInst.onopen = () => log('WS connected');
  wsInst.onmessage = e => log('WS: '+e.data);
  wsInst.onerror = () => log('WS error','error');
}
function disconnectWS() { if(wsInst) { wsInst.close(); wsInst=null; } }

// DEFCON
function renderDefcon() {
  return `<div class="card" style="border-color:var(--danger);">
    <h3>💣 DEFCON</h3>
    <button class="btn btn-danger" onclick="activateDefcon()">AKTIFKAN</button>
  </div>`;
}
function activateDefcon() {
  if(confirm('🚨 Hapus sesi?')) {
    localStorage.removeItem('dreamos_bound_user');
    localStorage.removeItem('dreamos_session_active');
    log('DEFCON', 'error');
    setTimeout(()=>location.reload(),1000);
  }
}

if (getCFG()) { updateOnlineStatus(true); }
log('🛡️ 4S Ghost v9.0 Enterprise Pro siap', 'sys');
