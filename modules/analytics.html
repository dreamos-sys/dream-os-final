<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics • Dream OS</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0a0e27;--panel:rgba(15,23,42,.8);--neon:#00ff9d;--accent:#0ea5e9;--gold:#f59e0b;--warn:#ef4444;--txt:#e2e8f0;--sub:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;padding:1rem;padding-bottom:6rem}
.back-btn{position:fixed;bottom:calc(1.5rem + env(safe-area-inset-bottom));left:1rem;z-index:1000;background:rgba(30,41,59,.95);border:1px solid var(--neon);color:var(--neon);padding:.5rem 1rem;border-radius:8px;cursor:pointer;font-weight:700}
.wrap{max-width:900px;margin:0 auto}
.head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}
h1{color:var(--neon);font-size:1.2rem}
.chips{display:flex;gap:.4rem}
.chip{padding:.4rem .8rem;border-radius:999px;border:1px solid rgba(255,255,255,.15);background:transparent;color:var(--sub);font-size:.75rem;cursor:pointer}
.chip.active{background:var(--neon);color:#000;border-color:var(--neon);font-weight:700}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:1rem}
.kpi{background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:.9rem}
.kpi .v{font-size:1.5rem;font-weight:800}
.kpi .l{font-size:.68rem;color:var(--sub);text-transform:uppercase;letter-spacing:.5px}
.kpi .t{font-size:.7rem;font-weight:700;margin-top:.2rem}
.up{color:#10b981}.down{color:#ef4444}.flat{color:#94a3b8}
.card{background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:1rem;margin-bottom:1rem}
.card h3{font-size:.85rem;color:var(--neon);margin-bottom:.7rem}
.chartbox{position:relative;height:220px}
.heat{display:grid;grid-template-columns:80px repeat(7,1fr);gap:3px;font-size:.62rem}
.heat .h{color:var(--sub);text-align:center}
.heat .rn{color:var(--sub);display:flex;align-items:center}
.heat .c{border-radius:4px;min-height:26px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:700}
.anom{padding:.5rem;border-left:3px solid var(--warn);background:rgba(239,68,68,.08);border-radius:6px;margin-bottom:.4rem;font-size:.75rem}
.pred{padding:.6rem;border-left:3px solid var(--accent);background:rgba(14,165,233,.08);border-radius:6px;margin-bottom:.6rem;font-size:.78rem}
.btn{padding:.6rem 1rem;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:.8rem}
.btn-p{background:var(--accent);color:#fff}
.empty{text-align:center;color:var(--sub);padding:1.5rem;font-size:.8rem}
@media print{.back-btn,.chips,.btn{display:none!important}body{background:#fff;color:#000}.card,.kpi{border:1px solid #999;background:#fff}}
</style>
</head>
<body>
<button type="button" class="back-btn" onclick="if(typeof window.goHome==='function')window.goHome();else if(typeof window.goHomeSafe==='function')window.goHomeSafe();else{var b=window.location.pathname.indexOf('/dream-os-final/')>=0?'/dream-os-final/':'/';window.location.href=b+'index.html';}">← HOME</button>
<div class="wrap">
<div class="head">
  <h1>📊 Advanced Analytics</h1>
  <div class="chips">
    <button class="chip active" onclick="setPeriod('this',this)">Bulan Ini</button>
    <button class="chip" onclick="setPeriod('last',this)">Bulan Lalu</button>
    <button class="chip" onclick="setPeriod('90',this)">90 Hari</button>
  </div>
</div>
<div class="kpis" id="kpis"></div>
<div class="card"><h3>📈 Trend Mingguan (Booking vs K3)</h3><div class="chartbox"><canvas id="trendChart"></canvas></div></div>
<div class="card"><h3>🏢 Booking per Divisi</h3><div class="chartbox"><canvas id="divChart"></canvas></div></div>
<div class="card"><h3>🔥 Heatmap Aktivitas (7 hari terakhir)</h3><div id="heatmap"></div></div>
<div class="card"><h3>🤖 Prediksi & Deteksi Anomali</h3><div id="prediction"></div><div id="anomalies"></div></div>
<div style="display:flex;gap:.5rem;flex-wrap:wrap">
  <button class="btn btn-p" onclick="exportReport()">📄 Export Laporan Bulanan (PDF)</button>
  <button class="btn" style="background:rgba(255,255,255,.08);color:var(--txt)" onclick="init()">🔄 Refresh</button>
</div>
</div>
<script>
var SUPABASE_URL='https://gbigjdhifispatrrskgh.supabase.co';
var ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdiaWdqZGhpZmlzcGF0cnJza2doIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNzY1OTIsImV4cCI6MjA5Njc1MjU5Mn0.eqAFloptEHV3oIUjortuTsWvkhJgjb3xsXHM9nXfF8k';
var S={period:'this',bookings:[],k3:[]};
var charts={};

function ls(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}}
async function fetchT(t){try{var r=await fetch(SUPABASE_URL+'/rest/v1/'+t+'?select=*',{headers:{apikey:ANON,Authorization:'Bearer '+ANON}});return await r.json()}catch(e){return[]}}

async function load(){
  S.bookings=ls('dreamos_bookings'); S.k3=ls('dreamos_k3_reports');
  if(!S.bookings.length) S.bookings=await fetchT('bookings');
  if(!S.k3.length) S.k3=await fetchT('k3_reports');
}

function dOf(x){return new Date(x.tgl||x.created_at||x.date||x.time||Date.now())}
function inPeriod(d,p){
  var n=new Date();
  if(p==='this')return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();
  if(p==='last'){var q=new Date(n.getFullYear(),n.getMonth()-1,1);return d.getMonth()===q.getMonth()&&d.getFullYear()===q.getFullYear();}
  return (n-d)<=90*86400000;
}
function inPrev(d,p){
  var n=new Date();
  if(p==='this'){var q=new Date(n.getFullYear(),n.getMonth()-1,1);return d.getMonth()===q.getMonth()&&d.getFullYear()===q.getFullYear();}
  if(p==='last'){var q2=new Date(n.getFullYear(),n.getMonth()-2,1);return d.getMonth()===q2.getMonth()&&d.getFullYear()===q2.getFullYear();}
  return (n-d)>90*86400000&&(n-d)<=180*86400000;
}
function trend(cur,prev){
  if(prev===0)return cur>0?{t:'▲ baru',c:'up'}:{t:'—',c:'flat'};
  var p=Math.round((cur-prev)/prev*100);
  return p>0?{t:'▲ +'+p+'%',c:'up'}:p<0?{t:'▼ '+p+'%',c:'down'}:{t:'— 0%',c:'flat'};
}

function renderKPIs(){
  var cb=S.bookings.filter(function(b){return inPeriod(dOf(b),S.period)}).length;
  var pb=S.bookings.filter(function(b){return inPrev(dOf(b),S.period)}).length;
  var ck=S.k3.filter(function(b){return inPeriod(dOf(b),S.period)}).length;
  var pk=S.k3.filter(function(b){return inPrev(dOf(b),S.period)}).length;
  var per=S.bookings.filter(function(b){return inPeriod(dOf(b),S.period)});
  var app=per.filter(function(b){return (b.status||'').toLowerCase()==='approved'}).length;
  var rate=per.length?Math.round(app/per.length*100):0;
  var pend=S.k3.filter(function(b){return (b.status||'').toLowerCase()==='pending'}).length;
  var t1=trend(cb,pb),t2=trend(ck,pk);
  document.getElementById('kpis').innerHTML=
    '<div class="kpi"><div class="v" style="color:var(--neon)">'+cb+'</div><div class="l">Booking</div><div class="t '+t1.c+'">'+t1.t+' vs sebelumnya</div></div>'+
    '<div class="kpi"><div class="v" style="color:var(--gold)">'+ck+'</div><div class="l">Laporan K3</div><div class="t '+t2.c+'">'+t2.t+' vs sebelumnya</div></div>'+
    '<div class="kpi"><div class="v" style="color:var(--accent)">'+rate+'%</div><div class="l">Approval Rate</div><div class="t flat">'+app+' approved</div></div>'+
    '<div class="kpi"><div class="v" style="color:var(--warn)">'+pend+'</div><div class="l">K3 Pending</div><div class="t flat">perlu tindakan</div></div>';
}

function weekKey(d){var n=new Date();var diff=Math.floor((n-d)/(7*86400000));return diff}
function renderTrend(){
  var labels=[],bData=[],kData=[];
  for(var w=7;w>=0;w--){labels.push('W-'+w);bData.push(0);kData.push(0);}
  S.bookings.forEach(function(b){var i=weekKey(dOf(b));if(i>=0&&i<=7)bData[7-i]++;});
  S.k3.forEach(function(b){var i=weekKey(dOf(b));if(i>=0&&i<=7)kData[7-i]++;});
  if(charts.trend)charts.trend.destroy();
  charts.trend=new Chart(document.getElementById('trendChart'),{type:'line',
    data:{labels:labels,datasets:[
      {label:'Booking',data:bData,borderColor:'#00ff9d',backgroundColor:'rgba(0,255,157,.15)',fill:true,tension:.3},
      {label:'K3',data:kData,borderColor:'#f59e0b',backgroundColor:'rgba(245,158,11,.15)',fill:true,tension:.3}]},
    options:{responsive:true,maintainAspectRatio:false,scales:{x:{ticks:{color:'#94a3b8'}},y:{ticks:{color:'#94a3b8'},beginAtZero:true}},plugins:{legend:{labels:{color:'#e2e8f0'}}}}});
}

function renderDivisi(){
  var map={};
  S.bookings.filter(function(b){return inPeriod(dOf(b),S.period)}).forEach(function(b){var d=b.divisi||'Lain';map[d]=(map[d]||0)+1;});
  var keys=Object.keys(map).sort(function(a,b){return map[b]-map[a]}).slice(0,7);
  if(charts.div)charts.div.destroy();
  charts.div=new Chart(document.getElementById('divChart'),{type:'bar',
    data:{labels:keys.length?keys:['-'],datasets:[{label:'Booking',data:keys.length?keys.map(function(k){return map[k]}):[0],backgroundColor:'#0ea5e9'}]},
    options:{responsive:true,maintainAspectRatio:false,scales:{x:{ticks:{color:'#94a3b8'}},y:{ticks:{color:'#94a3b8'},beginAtZero:true}},plugins:{legend:{display:false}}}});
}

function renderHeatmap(){
  var days=[];for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);days.push(d);}
  var divis=['TK','SD','SMP','SMA','UMUM'];
  var max=1,cells={};
  divis.forEach(function(dv){days.forEach(function(d,di){
    var c=S.bookings.filter(function(b){var bd=dOf(b);return (b.divisi||'')===dv&&bd.toDateString()===d.toDateString()}).length;
    cells[dv+di]=c;if(c>max)max=c;});});
  var h='<div class="heat"><div></div>';
  days.forEach(function(d){h+='<div class="h">'+d.getDate()+'/'+(d.getMonth()+1)+'</div>'});
  divis.forEach(function(dv){h+='<div class="rn">'+dv+'</div>';
    days.forEach(function(d,di){var c=cells[dv+di];var a=c/max;
      var col=c===0?'rgba(255,255,255,.06)':'rgba(0,255,157,'+(0.25+a*0.75)+')';
      h+='<div class="c" style="background:'+col+';'+(c===0?'color:#5d6b82;':'')+'">'+(c||'')+'</div>';});});
  h+='</div>';
  document.getElementById('heatmap').innerHTML=h;
}

function renderAI(){
  // Prediksi: rata-rata 3 bulan terakhir
  var n=new Date(),months=[];
  for(var m=3;m>=1;m--){var q=new Date(n.getFullYear(),n.getMonth()-m,1);
    months.push(S.bookings.filter(function(b){var d=dOf(b);return d.getMonth()===q.getMonth()&&d.getFullYear()===q.getFullYear()}).length);}
  var avg=Math.round((months[0]+months[1]+months[2])/3);
  document.getElementById('prediction').innerHTML='<div class="pred">🔮 <b>Prediksi bulan depan:</b> ±'+avg+' booking <small>(moving-average 3 bln: '+months.join(', ')+')</small></div>';
  // Anomali: z-score harian 30 hari
  var counts=[];for(var i=0;i<30;i++){var d=new Date();d.setDate(d.getDate()-i);
    counts.push({d:d,c:S.bookings.filter(function(b){return dOf(b).toDateString()===d.toDateString()}).length});}
  var mean=counts.reduce(function(a,b){return a+b.c},0)/30;
  var std=Math.sqrt(counts.reduce(function(a,b){return a+Math.pow(b.c-mean,2)},0)/30)||1;
  var anoms=counts.filter(function(x){return Math.abs(x.c-mean)/std>1.8&&x.c>0});
  var el=document.getElementById('anomalies');
  el.innerHTML=anoms.length?anoms.map(function(x){return '<div class="anom">⚠️ <b>'+x.d.getDate()+'/'+(x.d.getMonth()+1)+'</b>: '+x.c+' booking (rata-rata '+mean.toFixed(1)+') — cek apakah event khusus atau lonjakan tak terduga.</div>'}).join(''):'<div class="empty">✅ Tidak ada anomali terdeteksi (30 hari)</div>';
}

window.setPeriod=function(p,btn){S.period=p;
  document.querySelectorAll('.chip').forEach(function(c){c.classList.remove('active')});
  btn.classList.add('active');renderAll();};

function renderAll(){renderKPIs();renderTrend();renderDivisi();renderHeatmap();renderAI();}

window.exportReport=function(){
  var n=new Date();
  var w=window.open('','_blank');
  var html='<!DOCTYPE html><html><head><title>Laporan Bulanan Dream OS</title><style>body{font-family:Arial,sans-serif;padding:2rem;color:#111}h1{font-size:1.4rem}h2{font-size:1rem;margin-top:1.5rem;border-bottom:2px solid #333;padding-bottom:.3rem}table{width:100%;border-collapse:collapse;margin-top:.5rem}td,th{border:1px solid #999;padding:.4rem;font-size:.8rem;text-align:left}.m{color:#555}</style></head><body>';
  html+='<h1>📊 Laporan Bulanan — Dream OS</h1><p class="m">Periode: '+n.toLocaleDateString('id-ID',{month:'long',year:'numeric'})+' • Dibuat: '+n.toLocaleString('id-ID')+'</p>';
  var per=S.bookings.filter(function(b){return inPeriod(dOf(b),'this')});
  var kper=S.k3.filter(function(b){return inPeriod(dOf(b),'this')});
  html+='<h2>Ringkasan KPI</h2><table><tr><th>Metrik</th><th>Nilai</th></tr>';
  html+='<tr><td>Total Booking</td><td>'+per.length+'</td></tr>';
  html+='<tr><td>Total Laporan K3</td><td>'+kper.length+'</td></tr>';
  html+='<tr><td>K3 Pending</td><td>'+S.k3.filter(function(b){return(b.status||'').toLowerCase()==='pending'}).length+'</td></tr></table>';
  var map={};per.forEach(function(b){var d=b.divisi||'Lain';map[d]=(map[d]||0)+1});
  html+='<h2>Booking per Divisi</h2><table><tr><th>Divisi</th><th>Jumlah</th></tr>'+Object.keys(map).map(function(k){return '<tr><td>'+k+'</td><td>'+map[k]+'</td></tr>'}).join('')+'</table>';
  html+='<h2>Detail Booking</h2><table><tr><th>Tanggal</th><th>Ruang</th><th>Peminjam</th><th>Divisi</th><th>Status</th></tr>'+per.slice(0,50).map(function(b){return '<tr><td>'+(b.tgl||'-')+'</td><td>'+(b.ruang||'-')+'</td><td>'+(b.nama_peminjam||'-')+'</td><td>'+(b.divisi||'-')+'</td><td>'+(b.status||'-')+'</td></tr>'}).join('')+'</table>';
  html+='<p class="m" style="margin-top:2rem">Dibuat otomatis oleh Dream OS Analytics • The Power Soul Of Shalawat</p></body></html>';
  w.document.write(html);w.document.close();
  setTimeout(function(){w.print()},500);
};

async function init(){await load();renderAll();}
init();
</script>
</body>
</html>
