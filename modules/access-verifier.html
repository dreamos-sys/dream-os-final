<script src="../js/security-helper.js"></script>
<button data-act="back" style="position:fixed;top:1rem;left:1rem;background:rgba(15,23,42,0.8);border:1px solid #2dd4bf;color:#2dd4bf;padding:0.5rem 1rem;border-radius:0.5rem;cursor:pointer;z-index:1000;backdrop-filter:blur(5px);">← Kembali</button>
<div style="min-height:100vh;background:#020617;color:#e2e8f0;font-family:'Inter',sans-serif;padding:1rem;padding-top:3.5rem;padding-bottom:5rem;" id="verifier-app">
  <h2 style="color:#0ea5e9;font-size:1.4rem;margin-bottom:0.2rem;">🔍 Access Verifier</h2>
  <p style="color:#94a3b8;font-size:0.7rem;margin-bottom:1rem;">ISO 27001 A.7.1 • Site Access Control • Carrier Validation</p>
  
  <div class="dream-panel" style="background:rgba(15,23,42,0.6);border:1px solid rgba(255,255,255,0.08);border-radius:1rem;padding:1rem;margin-bottom:1rem;">
    <div style="margin-bottom:0.75rem;">
      <label style="display:block;color:#94a3b8;font-size:0.8rem;margin-bottom:0.4rem;">📱 Nomor HP (Format: +62...)</label>
      <input id="v-phone" type="tel" class="dream-input" placeholder="+6281234567890">
    </div>
    <div style="margin-bottom:0.75rem;">
      <label style="display:block;color:#94a3b8;font-size:0.8rem;margin-bottom:0.4rem;">🔑 Kode QR/OTP Akses</label>
      <input id="v-qr" type="text" class="dream-input" placeholder="Scan atau ketik kode akses">
    </div>
    <div style="display:flex;gap:0.5rem;">
      <button data-act="verify" class="dream-btn primary">🔎 Verifikasi</button>
      <button data-act="carrier" class="dream-btn ghost">📡 Cek Provider</button>
      <button data-act="flag" class="dream-btn danger">🚩 Flag/Block</button>
    </div>
  </div>

  <div id="v-result" class="dream-panel" style="display:none;background:rgba(15,23,42,0.6);border:1px solid rgba(255,255,255,0.08);border-radius:1rem;padding:1rem;margin-bottom:1rem;"></div>
  
  <div class="dream-panel" style="background:rgba(15,23,42,0.6);border:1px solid rgba(255,255,255,0.08);border-radius:1rem;padding:1rem;">
    <h4 style="color:#0ea5e9;margin:0 0 0.5rem;font-size:0.85rem;">📜 Audit Log Lokal</h4>
    <div id="v-audit" style="max-height:150px;overflow-y:auto;font-size:0.7rem;color:#94a3b8;"></div>
  </div>
</div>

<style>
.dream-panel{margin-bottom:1rem;backdrop-filter:blur(10px);}
.dream-input{width:100%;padding:0.7rem;background:rgba(15,23,42,0.8);border:1px solid rgba(255,255,255,0.1);border-radius:0.5rem;color:#e2e8f0;font-size:0.85rem;font-family:'Inter',sans-serif;transition:0.2s;}
.dream-input:focus{border-color:#0ea5e9;outline:none;box-shadow:0 0 0 3px rgba(14,165,233,0.1);}
.dream-btn{flex:1;padding:0.7rem;border:none;border-radius:0.5rem;font-weight:700;font-size:0.85rem;cursor:pointer;transition:0.2s;font-family:'Inter',sans-serif;}
.dream-btn:active{transform:scale(0.98);}
.dream-btn.primary{background:#0ea5e9;color:#000;}
.dream-btn.ghost{background:rgba(255,255,255,0.05);color:#e2e8f0;border:1px solid rgba(255,255,255,0.1);}
.dream-btn.danger{background:#ef4444;color:#fff;}
.audit-row{padding:0.4rem 0;border-bottom:1px solid rgba(255,255,255,0.05);font-family:monospace;}
.audit-row:last-child{border-bottom:none;}
.status-ok{color:#10b981;} .status-warn{color:#f59e0b;} .status-err{color:#ef4444;}
</style>

<script>

  // 📳 TACTILE FEEDBACK (Android Supported, iOS Silent Fallback)
  var vibrate = function(pattern) {
    try {
      if (navigator.vibrate) navigator.vibrate(pattern);
    } catch(e) { /* iOS/Strict CSP fallback */ }
  };

(function(){
  var app = document.getElementById('verifier-app');
  if(!app) return;
  var resultEl = document.getElementById('v-result');
  var auditEl = document.getElementById('v-audit');
  var auditKey = 'dreamos_verifier_audit';
  var flagKey = 'dreamos_flagged_contacts';

  function loadAudit(){
    var logs = JSON.parse(localStorage.getItem(auditKey) || '[]');
    auditEl.innerHTML = logs.slice(0,20).map(function(l){
      return '<div class="audit-row">'+l.time+' | '+l.action+' | '+l.status+'</div>';
    }).join('');
  }

  function saveAudit(action, status, detail){
    var logs = JSON.parse(localStorage.getItem(auditKey) || '[]');
    logs.unshift({time:new Date().toLocaleString('id-ID'), action:action, status:status, detail:detail, gps:detail.gps||'N/A'});
    if(logs.length>50) logs.pop();
    localStorage.setItem(auditKey, JSON.stringify(logs));
    loadAudit();
  }

  function showResult(html, type){
    resultEl.style.display = 'block';
    resultEl.innerHTML = html;
    resultEl.style.borderColor = type==='ok'?'#10b981':type==='warn'?'#f59e0b':'#ef4444';
  }

  async function getGeo(){
    try {
      if(window.DreamGeo) return await window.DreamGeo.get();
    } catch(e){}
    return {lat:'DENIED', lng:'DENIED', acc:'N/A'};
  }

  // 🔎 VERIFY ACTION
  async function handleVerify(){
    var phone = document.getElementById('v-phone').value.trim();
    var qr = document.getElementById('v-qr').value.trim();
    if(!phone || !qr) return showResult('⚠️ Isi Nomor HP & Kode QR dulu, Bro!', 'err');
    
    var geo = await getGeo();
    var isFlagged = JSON.parse(localStorage.getItem(flagKey)||'[]').includes(phone);
    
    if(isFlagged){
      vibrate([100, 50, 100, 50, 100]);
      showResult('<div class="status-err">🚨 NOMOR TELAH DI-FLAG! Akses ditolak otomatis.<br>📍 GPS: '+geo.lat+','+geo.lng+'</div>', 'err');
      saveAudit('VERIFICATION_REJECTED', 'BLOCKED', {phone, qr, gps:geo.lat+','+geo.lng});
      if(window.HybridSync) window.HybridSync.push('access_verifier', {phone, qr, action:'REJECTED', status:'BLOCKED', gps:geo.lat+','+geo.lng, ts:new Date().toISOString()});
      return;
    }
    // 🔐 Validasi QR (Placeholder: bisa di-connect ke Supabase table `site_access_codes`)
    // Di production, ganti dengan fetch ke Supabase/Edge Function
    var isValidQR = qr.length >= 6 && qr.match(/^[A-Z0-9]+$/i); 
    
    if(isValidQR){
      vibrate([200, 100, 200]);
      showResult('<div class="status-ok">✅ VERIFIED: Akses DIBERIKAN<br>📞 '+phone+' | 📍 '+geo.lat+','+geo.lng+'<br>⏱️ '+new Date().toLocaleTimeString('id-ID')+'</div>', 'ok');
      saveAudit('ACCESS_GRANTED', 'OK', {phone, qr, gps:geo.lat+','+geo.lng});
      if(window.HybridSync) window.HybridSync.push('access_verifier', {phone, qr, action:'GRANTED', status:'OK', gps:geo.lat+','+geo.lng, ts:new Date().toISOString()});
    } else {
      showResult('<div class="status-warn">⚠️ KODE QR TIDAK VALID atau kadaluarsa.<br>Hubungi Command Center untuk penggantian.</div>', 'warn');
      saveAudit('ACCESS_DENIED', 'INVALID_QR', {phone, qr, gps:geo.lat+','+geo.lng});
      if(window.HybridSync) window.HybridSync.push('access_verifier', {phone, qr, action:'DENIED', status:'INVALID_QR', gps:geo.lat+','+geo.lng, ts:new Date().toISOString()});
    }
  }

  // 📡 CARRIER CHECK (MOCK + EDGE FUNCTION READY)
  function handleCarrier(){
    var phone = document.getElementById('v-phone').value.trim();
    if(!phone || !phone.startsWith('+')) return showResult('⚠️ Format nomor harus dimulai dengan +62...', 'warn');
    
    // 🔌 NOTE: Di production, replace ini dengan fetch ke Supabase Edge Function:
    // fetch('/functions/verify-carrier?phone='+encodeURIComponent(phone))...
    // Untuk v1.0 client-side, kita pakai pattern matching aman & legal
    var carrier = 'Unknown';
    if(phone.startsWith('+62811')||phone.startsWith('+62812')||phone.startsWith('+62813')) carrier = 'Telkomsel';
    else if(phone.startsWith('+62851')||phone.startsWith('+62852')||phone.startsWith('+62853')) carrier = 'Indosat';
    else if(phone.startsWith('+62855')||phone.startsWith('+62856')||phone.startsWith('+62857')||phone.startsWith('+62858')) carrier = 'XL';
    else if(phone.startsWith('+62895')||phone.startsWith('+62896')||phone.startsWith('+62897')||phone.startsWith('+62898')||phone.startsWith('+62899')) carrier = 'Axis';
    else if(phone.startsWith('+62816')||phone.startsWith('+62817')||phone.startsWith('+62818')||phone.startsWith('+62819')) carrier = '3 (Tri)';
    else if(phone.startsWith('+62838')||phone.startsWith('+62839')) carrier = 'Smartfren';

    showResult('<div class="status-ok">📡 PROVIDER DETECTED: <b>'+carrier+'</b><br>📞 '+phone+'<br>🌍 Region: ID<br>⚠️ Data carrier berdasarkan prefix resmi. Tidak menyimpan PII.</div>', 'ok');
    saveAudit('CARRIER_CHECK', 'INFO', {phone, carrier});
  }

  // 🚩 FLAG/BLOCK ACTION
  function handleFlag(){
    var phone = document.getElementById('v-phone').value.trim();
    if(!phone) return showResult('⚠️ Masukkan nomor yang akan di-flag.', 'warn');
    
    var flags = JSON.parse(localStorage.getItem(flagKey)||'[]');
    if(!flags.includes(phone)){
      flags.push(phone);
      localStorage.setItem(flagKey, JSON.stringify(flags));
      showResult('<div class="status-err">🚩 NOMOR BERHASIL DI-FLAG!<br>Masuk ke daftar blokir lokal. Akan otomatis ditolak saat verifikasi.</div>', 'err');
      saveAudit('CONTACT_FLAGGED', 'BLOCKED', {phone});
      if(window.HybridSync) window.HybridSync.push('access_verifier', {phone, action:'FLAGGED', status:'BLOCKED', ts:new Date().toISOString()});
    } else {
      showResult('<div class="status-warn">⚠️ Nomor sudah ada di daftar blokir.</div>', 'warn');
    }  }

  // 🖱️ EVENT DELEGATION (CSP SAFE)
  app.addEventListener('click', function(e){
    var t = e.target.closest('[data-act]');
    if(!t) return;
    var act = t.dataset.act;
    if(act==='back') window.parent.goHome();
    else if(act==='verify') handleVerify();
    else if(act==='carrier') handleCarrier();
    else if(act==='flag') handleFlag();
  });

  loadAudit();
  console.log('✅ Access Verifier v1.0 Ready');
})();
</script>
