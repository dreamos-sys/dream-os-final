<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Maintenance • CMMS • Dream OS</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');
    :root{
      --neon:#00ff9d; --accent:#0ea5e9; --warn:#e11d48; --gold:#f59e0b; --teal:#14b8a6;
      --ink:#070b1c; --panel:rgba(13,20,40,0.86); --panel2:rgba(8,13,28,0.92);
      --line:rgba(0,255,157,0.14); --line2:rgba(255,255,255,0.08);
      --txt:#e6edf6; --mut:#93a4bb; --mut2:#5d6b82;
      --disp:'Chakra Petch','Inter',system-ui,sans-serif;
      --body:'Inter',system-ui,sans-serif;
      --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
    }
    *{box-sizing:border-box;}
    .cmms{
      position:relative; min-height:100vh; margin:0; padding:0 0 6rem;
      color:var(--txt); font-family:var(--body); overflow:hidden;
      background:
        radial-gradient(1100px 560px at 88% -8%, rgba(14,165,233,0.10), transparent 60%),
        radial-gradient(820px 480px at -8% 108%, rgba(0,255,157,0.08), transparent 55%),
        radial-gradient(700px 700px at 50% 40%, rgba(20,184,166,0.05), transparent 70%),
        var(--ink);
    }
    .cmms::before{
      content:""; position:absolute; inset:-2px; z-index:0; pointer-events:none;
      background-image:
        linear-gradient(rgba(0,255,157,0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,157,0.045) 1px, transparent 1px);
      background-size:38px 38px;
      -webkit-mask-image:radial-gradient(circle at 50% 22%, #000 0%, transparent 82%);
      mask-image:radial-gradient(circle at 50% 22%, #000 0%, transparent 82%);
      animation:gridPan 110s linear infinite;
    }
    .cmms::after{
      content:""; position:absolute; top:-140px; right:-90px; width:340px; height:340px; z-index:0; pointer-events:none;
      background:radial-gradient(circle, rgba(0,255,157,0.14), transparent 70%); filter:blur(6px);
      animation:glowPulse 8s ease-in-out infinite;
    }
    .cmms > *{position:relative; z-index:1;}
    @keyframes gridPan{from{background-position:0 0,0 0;}to{background-position:38px 38px,38px 38px;}}
    @keyframes glowPulse{0%,100%{opacity:.45;transform:scale(1);}50%{opacity:.85;transform:scale(1.14);}}
    @keyframes floatY{0%,100%{transform:translateY(0) rotate(-7deg);}50%{transform:translateY(-8px) rotate(-7deg);}}
    @keyframes revealUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
    @keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(225,29,72,.5);}70%{box-shadow:0 0 0 7px rgba(225,29,72,0);}}
    @keyframes pulseDotG{0%,100%{box-shadow:0 0 0 0 rgba(0,255,157,.5);}70%{box-shadow:0 0 0 6px rgba(0,255,157,0);}}
    @keyframes shimmer{0%{background-position:-160% 0;}100%{background-position:260% 0;}}
    @keyframes toastIn{from{opacity:0;transform:translateX(42px);}to{opacity:1;transform:none;}}
    @keyframes scan{0%{transform:translateX(-100%);}100%{transform:translateX(220%);}}
    @keyframes sweep{0%{transform:rotate(0);}100%{transform:rotate(360deg);}}

    /* ===== top ambient bar ===== */
    .amb{display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap;
      padding:.7rem 1.1rem; border-bottom:1px solid var(--line); background:linear-gradient(180deg, rgba(0,255,157,0.05), transparent);
      position:relative; overflow:hidden;}
    .amb .scanline{position:absolute; top:0; bottom:0; width:38%; background:linear-gradient(90deg, transparent, rgba(0,255,157,0.07), transparent); animation:scan 6s linear infinite; pointer-events:none;}
    .amb .who{display:flex; align-items:center; gap:.6rem; font-family:var(--mono); font-size:.72rem; color:var(--mut);}
    .amb .who b{color:var(--neon);}
    .amb .clk{display:flex; align-items:baseline; gap:.6rem; font-family:var(--mono);}
    .amb .clk .t{font-size:1.05rem; font-weight:700; color:#fff; letter-spacing:1px; font-variant-numeric:tabular-nums;}
    .amb .clk .shift{font-size:.66rem; letter-spacing:1.5px; text-transform:uppercase; padding:.2rem .55rem; border-radius:999px; border:1px solid var(--line); color:var(--neon);}

    .back-btn{position:fixed; bottom:calc(1.1rem + env(safe-area-inset-bottom)); left:1rem; z-index:1200;
      background:rgba(7,11,28,0.94); border:1px solid var(--neon); color:var(--neon);
      padding:.55rem 1.1rem; border-radius:10px; cursor:pointer; font-weight:700; font-size:.82rem;
      font-family:var(--disp); letter-spacing:.5px; backdrop-filter:blur(8px); transition:transform .15s, box-shadow .2s;}
    .back-btn:hover{transform:translateY(-2px); box-shadow:0 8px 22px rgba(0,255,157,.25);}
    .back-btn:active{transform:scale(.96);}

    .shell{display:grid; grid-template-columns:230px 1fr; gap:1.1rem; padding:1.1rem; max-width:1320px; margin:0 auto;}
    @media(max-width:880px){ .shell{grid-template-columns:1fr; padding:.8rem;} }

    /* ===== rail ===== */
    .rail{position:sticky; top:.8rem; align-self:start; display:flex; flex-direction:column; gap:.35rem;
      background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:.7rem; backdrop-filter:blur(10px);}
    @media(max-width:880px){ .rail{position:static; flex-direction:row; overflow-x:auto; -webkit-overflow-scrolling:touch; padding:.5rem;} }
    .rail .brand{font-family:var(--disp); font-weight:700; font-size:1.05rem; color:#fff; letter-spacing:.5px; padding:.3rem .4rem .7rem; border-bottom:1px solid var(--line2); margin-bottom:.4rem; display:flex; align-items:center; gap:.5rem;}
    .rail .brand .gear{width:24px;height:24px;color:var(--neon);animation:sweep 9s linear infinite;}
    @media(max-width:880px){ .rail .brand{display:none;} }
    .nav{display:flex; align-items:center; gap:.6rem; padding:.6rem .65rem; border-radius:11px; cursor:pointer; color:var(--mut);
      font-family:var(--disp); font-size:.82rem; letter-spacing:.3px; border:1px solid transparent; transition:all .18s; white-space:nowrap; user-select:none;}
    .nav:hover{color:var(--txt); background:rgba(255,255,255,.04);}
    .nav.active{color:#04130d; background:var(--neon); font-weight:700; box-shadow:0 6px 18px rgba(0,255,157,.28);}
    .nav .ic{font-size:1rem; line-height:1;}
    .nav .bdg{margin-left:auto; font-family:var(--mono); font-size:.66rem; font-weight:700; background:rgba(0,0,0,.25); padding:.05rem .4rem; border-radius:999px;}
    .nav.active .bdg{background:rgba(0,0,0,.22); color:#04130d;}
    .rail .iso{margin-top:.5rem; padding:.6rem; border-top:1px solid var(--line2); font-size:.62rem; color:var(--mut2); line-height:1.5; letter-spacing:.3px;}
    .rail .iso b{color:var(--teal);}
    @media(max-width:880px){ .rail .iso{display:none;} }

    /* ===== main ===== */
    .main{min-width:0;}
    .view-head{display:flex; align-items:flex-end; justify-content:space-between; gap:1rem; flex-wrap:wrap; margin-bottom:1rem;}
    .eyebrow{font-family:var(--disp); font-size:.68rem; letter-spacing:3px; text-transform:uppercase; color:var(--neon); opacity:.85; margin:0 0 .35rem;}
    .vtitle{font-family:var(--disp); font-weight:700; font-size:clamp(1.4rem,4.4vw,2rem); line-height:1; margin:0; color:#fff; letter-spacing:.4px;}
    .vtitle b{color:var(--neon);}
    .vsub{color:var(--mut); font-size:.82rem; margin:.45rem 0 0; max-width:54ch; line-height:1.5;}
    .live-pill{display:inline-flex; align-items:center; gap:.45rem; font-family:var(--disp); font-size:.7rem; letter-spacing:1px; text-transform:uppercase; color:var(--neon); border:1px solid var(--line); background:rgba(0,255,157,.06); padding:.4rem .7rem; border-radius:999px;}
    .live-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--neon);animation:pulseDotG 1.8s infinite;}

    /* ===== bento ===== */
    .bento{display:grid; grid-template-columns:repeat(6,1fr); gap:.8rem; grid-auto-rows:minmax(120px,auto);}
    @media(max-width:980px){ .bento{grid-template-columns:repeat(2,1fr);} }
    .tile{position:relative; overflow:hidden; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:1rem; backdrop-filter:blur(8px);
      animation:revealUp .5s cubic-bezier(.2,.7,.2,1) both;}
    .tile::after{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--c,var(--neon));}
    .tile .shine{position:absolute; inset:0; pointer-events:none; opacity:0; background:linear-gradient(110deg, transparent 35%, rgba(255,255,255,.05) 50%, transparent 65%); background-size:220% 100%;}
    .tile:hover .shine{opacity:1; animation:shimmer 1.2s ease;}
    .tile .lab{font-size:.64rem; letter-spacing:1.6px; text-transform:uppercase; color:var(--mut); margin:0 0 .5rem; font-family:var(--disp);}
    .s2{grid-column:span 2;} .s3{grid-column:span 3;} .s4{grid-column:span 4;} .s6{grid-column:span 6;} .r2{grid-row:span 2;}
    @media(max-width:980px){ .s2,.s3,.s4,.s6{grid-column:span 2;} .r2{grid-row:span 1;} }

    .ringwrap{display:flex; align-items:center; gap:1rem;}
    .ring{position:relative; width:104px; height:104px; flex:0 0 auto;}
    .ring svg{transform:rotate(-90deg);}
    .ring .bg{stroke:rgba(255,255,255,.08);}
    .ring .fg{stroke-linecap:round; transition:stroke-dashoffset 1.1s cubic-bezier(.2,.7,.2,1);}
    .ring .ctr{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
    .ring .ctr .pct{font-family:var(--disp); font-weight:700; font-size:1.5rem; color:#fff; font-variant-numeric:tabular-nums;}
    .ring .ctr .cap{font-size:.58rem; letter-spacing:1px; text-transform:uppercase; color:var(--mut);}
    .ringmeta{flex:1; min-width:0;}
    .ringmeta h4{font-family:var(--disp); margin:0 0 .3rem; color:#fff; font-size:.95rem;}
    .ringmeta p{margin:0; font-size:.78rem; color:var(--mut); line-height:1.45;}

    .bignum{font-family:var(--disp); font-weight:700; font-size:2.3rem; line-height:1; color:#fff; font-variant-numeric:tabular-nums;}
    .bignum.alert{color:var(--warn);}
    .bignum.ok{color:var(--neon);}
    .dotlive{position:absolute; top:.8rem; right:.8rem; width:8px;height:8px;border-radius:50%;background:var(--warn);animation:pulseDot 1.4s infinite;}

    .kpigrid{display:grid; grid-template-columns:1fr 1fr; gap:.7rem;}
    .kpi{background:rgba(0,0,0,.25); border:1px solid var(--line2); border-radius:11px; padding:.6rem .7rem;}
    .kpi .v{font-family:var(--disp); font-weight:700; font-size:1.25rem; color:#fff; font-variant-numeric:tabular-nums;}
    .kpi .k{font-size:.6rem; letter-spacing:1px; text-transform:uppercase; color:var(--mut); margin-top:.2rem;}

    /* risk rows */
    .riskrow{display:flex; align-items:center; gap:.7rem; padding:.55rem 0; border-bottom:1px solid var(--line2);}
    .riskrow:last-child{border-bottom:none;}
    .riskrow .mini{width:42px;height:42px;flex:0 0 auto;position:relative;}
    .riskrow .mini svg{transform:rotate(-90deg);}
    .riskrow .mini .v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.62rem;font-weight:700;color:#fff;}
    .riskrow .nm{flex:1; min-width:0;}
    .riskrow .nm .t{font-size:.85rem; color:#fff; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    .riskrow .nm .l{font-size:.68rem; color:var(--mut2);}
    .lvl{font-family:var(--disp); font-size:.6rem; letter-spacing:.6px; padding:.18rem .45rem; border-radius:999px; font-weight:700; white-space:nowrap;}

    /* ===== buttons ===== */
    .btn{min-height:44px; padding:.6rem .9rem; border:none; border-radius:10px; font-weight:700; font-size:.8rem; cursor:pointer;
      display:inline-flex; align-items:center; justify-content:center; gap:.4rem; font-family:var(--disp); letter-spacing:.4px;
      transition:transform .14s, box-shadow .2s, background .2s, filter .2s;}
    .btn:active{transform:scale(.95);}
    .btn-primary{background:var(--accent); color:#fff;} .btn-primary:hover{box-shadow:0 8px 20px rgba(14,165,233,.35); transform:translateY(-2px);}
    .btn-success{background:#10b981; color:#fff;} .btn-success:hover{box-shadow:0 8px 20px rgba(16,185,129,.35); transform:translateY(-2px);}
    .btn-warn{background:var(--gold); color:#1a1205;} .btn-danger{background:var(--warn); color:#fff;}
    .btn-ghost{background:rgba(255,255,255,.05); color:var(--txt); border:1px solid var(--line);} .btn-ghost:hover{background:rgba(0,255,157,.1); border-color:var(--neon);}
    .btn-sm{min-height:38px; padding:.45rem .7rem; font-size:.74rem;}
    .btn-block{width:100%;}
    .toolbar{display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:.9rem;}

    /* ===== checklist ===== */
    .zone{margin-bottom:1.1rem;}
    .zone-h{display:flex; align-items:center; gap:.6rem; margin-bottom:.6rem;}
    .zone-h .zn{font-family:var(--disp); font-weight:700; font-size:.95rem; color:#fff; letter-spacing:.4px;}
    .zone-h .zbar{flex:1; height:6px; background:rgba(255,255,255,.07); border-radius:999px; overflow:hidden;}
    .zone-h .zbar i{display:block; height:100%; background:linear-gradient(90deg,var(--teal),var(--neon)); width:0; transition:width .6s ease;}
    .zone-h .zpct{font-family:var(--mono); font-size:.7rem; color:var(--mut); min-width:38px; text-align:right;}
    .ck{display:flex; align-items:center; gap:.7rem; background:var(--panel); border:1px solid var(--line2); border-left:3px solid var(--mut2);
      border-radius:12px; padding:.7rem .8rem; margin-bottom:.5rem; transition:border-color .2s, transform .15s, background .2s;}
    .ck:hover{transform:translateX(3px);}
    .ck.pass{border-left-color:var(--neon);} .ck.fail{border-left-color:var(--warn); background:rgba(225,29,72,.06);} .ck.na{border-left-color:var(--gold);}
    .ck .seg{display:flex; gap:.3rem;}
    .ck .seg button{min-width:42px; min-height:38px; border-radius:9px; border:1px solid var(--line2); background:rgba(0,0,0,.3); color:var(--mut); font-weight:700; font-size:.72rem; cursor:pointer; font-family:var(--disp); transition:all .15s;}
    .ck .seg button.on-pass{background:var(--neon); color:#04130d; border-color:var(--neon);}
    .ck .seg button.on-fail{background:var(--warn); color:#fff; border-color:var(--warn);}
    .ck .seg button.on-na{background:var(--gold); color:#1a1205; border-color:var(--gold);}
    .ck .meta{flex:1; min-width:0;}
    .ck .meta .q{font-size:.86rem; color:#fff; font-weight:600;}
    .ck .meta .tag{font-size:.6rem; letter-spacing:.8px; text-transform:uppercase; color:var(--mut2); font-family:var(--disp);}
    .ck .meta input{width:100%; margin-top:.4rem; padding:.4rem .55rem; background:rgba(0,0,0,.35); border:1px solid var(--line2); border-radius:8px; color:var(--txt); font-size:.78rem; outline:none;}
    .ck .meta input:focus{border-color:var(--neon);}

    /* ===== timeline (history) ===== */
    .tl{position:relative; padding-left:1.4rem;}
    .tl::before{content:""; position:absolute; left:6px; top:4px; bottom:4px; width:2px; background:linear-gradient(180deg,var(--neon),transparent);}
    .tl-item{position:relative; margin-bottom:.9rem; background:var(--panel); border:1px solid var(--line2); border-radius:13px; padding:.8rem .9rem; animation:revealUp .4s both;}
    .tl-item::before{content:""; position:absolute; left:-1.4rem; top:1rem; width:12px; height:12px; border-radius:50%; background:var(--neon); border:2px solid var(--ink); box-shadow:0 0 0 3px rgba(0,255,157,.18);}
    .tl-item.bad::before{background:var(--warn); box-shadow:0 0 0 3px rgba(225,29,72,.18);}
    .tl-top{display:flex; justify-content:space-between; align-items:center; gap:.6rem; flex-wrap:wrap;}
    .tl-top .d{font-family:var(--disp); font-weight:700; color:#fff; font-size:.92rem;}
    .tl-top .by{font-size:.72rem; color:var(--mut);}
    .tl-stat{display:flex; gap:.5rem; flex-wrap:wrap; margin-top:.5rem; font-size:.72rem; color:var(--mut);}
    .tl-stat b{color:var(--txt);}

    /* ===== PM list ===== */
    .pm{display:flex; align-items:center; gap:.8rem; background:var(--panel); border:1px solid var(--line2); border-left:4px solid var(--teal); border-radius:13px; padding:.8rem .9rem; margin-bottom:.6rem; transition:transform .15s, box-shadow .2s;}
    .pm:hover{transform:translateY(-2px); box-shadow:0 10px 26px rgba(0,0,0,.4);}
    .pm.over{border-left-color:var(--warn);} .pm.soon{border-left-color:var(--gold);}
    .pm .ic{font-size:1.5rem; width:42px; text-align:center;}
    .pm .info{flex:1; min-width:0;}
    .pm .info .t{font-family:var(--disp); font-weight:600; color:#fff; font-size:.92rem;}
    .pm .info .m{font-size:.74rem; color:var(--mut); margin-top:.15rem;}
    .pm .due{text-align:right; min-width:96px;}
    .pm .due .dd{font-family:var(--mono); font-size:.8rem; font-weight:700; color:#fff;}
    .pm .due .lbl{font-size:.6rem; letter-spacing:.8px; text-transform:uppercase; color:var(--mut2);}
    .pm.over .due .dd{color:var(--warn);} .pm.soon .due .dd{color:var(--gold);}

    /* ===== work orders (reuse look) ===== */
    .filters{display:flex; gap:.4rem; flex-wrap:wrap; margin-bottom:.9rem; padding:.35rem; background:rgba(0,0,0,.28); border:1px solid var(--line); border-radius:12px;}
    .chip{flex:1; min-width:72px; text-align:center; padding:.5rem .4rem; border-radius:9px; cursor:pointer; font-family:var(--disp); font-size:.72rem; letter-spacing:.6px; text-transform:uppercase; color:var(--mut); border:1px solid transparent; transition:all .18s; user-select:none;}
    .chip:hover{color:var(--txt); background:rgba(255,255,255,.04);}
    .chip.active{color:#04130d; background:var(--neon); font-weight:700; box-shadow:0 4px 14px rgba(0,255,157,.3);}
    .wo{position:relative; background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(0,0,0,.18)); border:1px solid var(--line); border-left:4px solid var(--bar,var(--accent)); border-radius:14px; padding:1rem 1rem 1rem 1.1rem; margin-bottom:.7rem; overflow:hidden; animation:revealUp .45s cubic-bezier(.2,.7,.2,1) both; transition:transform .18s, box-shadow .25s, border-color .2s;}
    .wo:hover{transform:translateY(-3px); box-shadow:0 12px 30px rgba(0,0,0,.45); border-color:rgba(0,255,157,.4);}
    .wo.done{opacity:.6;} .wo.done .wt{text-decoration:line-through; text-decoration-color:rgba(148,163,184,.6);}
    .wo .shine{position:absolute; inset:0; pointer-events:none; opacity:0; background:linear-gradient(110deg, transparent 30%, rgba(0,255,157,.1) 50%, transparent 70%); background-size:220% 100%;}
    .wo:not(.done):hover .shine{opacity:1; animation:shimmer 1.1s ease;}
    .wt{font-family:var(--disp); font-weight:600; font-size:1rem; color:#fff; margin:0;}

    /* ===== assets ===== */
    .asset{background:var(--panel); border:1px solid var(--line2); border-radius:13px; padding:.85rem .9rem; margin-bottom:.6rem; display:flex; gap:.8rem; align-items:center; animation:revealUp .4s both;}
    .asset .ai{font-size:1.5rem; width:40px; text-align:center;}
    .asset .am{flex:1; min-width:0;}
    .asset .am .t{font-family:var(--disp); font-weight:600; color:#fff; font-size:.92rem;}
    .asset .am .s{font-size:.72rem; color:var(--mut); margin-top:.15rem;}
    .crit{display:inline-flex; gap:2px;}
    .crit i{width:7px; height:13px; border-radius:2px; background:rgba(255,255,255,.12);}
    .crit i.on{background:var(--gold);}

    /* ===== audit / iso ===== */
    .log{font-family:var(--mono); font-size:.72rem; color:#9fb3c8; background:rgba(0,0,0,.35); border:1px solid var(--line2); border-radius:11px; padding:.4rem 0; max-height:340px; overflow:auto;}
    .log .row{display:flex; gap:.6rem; padding:.35rem .8rem; border-bottom:1px solid rgba(255,255,255,.04);}
    .log .row:last-child{border-bottom:none;}
    .log .ts{color:var(--mut2); white-space:nowrap;}
    .log .ac{color:var(--neon); min-width:120px;}
    table.iso{width:100%; border-collapse:collapse; font-size:.78rem;}
    table.iso th{text-align:left; font-family:var(--disp); letter-spacing:.5px; text-transform:uppercase; font-size:.66rem; color:var(--teal); padding:.6rem .7rem; background:rgba(0,0,0,.3); border-bottom:1px solid var(--line);}
    table.iso td{padding:.6rem .7rem; border-bottom:1px solid var(--line2); vertical-align:top; color:var(--mut);}
    table.iso td b{color:var(--txt);}
    table.iso td .cl{font-family:var(--mono); color:var(--neon); font-weight:700; white-space:nowrap;}

    .badge{padding:.22rem .55rem; border-radius:999px; font-size:.66rem; font-weight:700; letter-spacing:.4px; white-space:nowrap; font-family:var(--disp);}
    .b-pending{background:rgba(245,158,11,.16); color:var(--gold);} .b-done{background:rgba(16,185,129,.16); color:#34d399;}
    .b-prio{background:var(--pbg,rgba(14,165,233,.16)); color:var(--pcol,var(--accent));}

    .empty{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:2.2rem 1.4rem; text-align:center; backdrop-filter:blur(8px);}
    .empty svg{width:72px; height:72px; margin-bottom:.6rem; animation:floatY 4.5s ease-in-out infinite;}
    .empty h3{font-family:var(--disp); color:#fff; margin:.2rem 0 .4rem; font-size:1.1rem;}
    .empty p{color:var(--mut); font-size:.84rem; margin:0 auto 1.1rem; max-width:42ch; line-height:1.55;}

    .addpanel{overflow:hidden; max-height:0; opacity:0; transition:max-height .35s, opacity .3s, margin .3s; margin-bottom:0;}
    .addpanel.open{max-height:640px; opacity:1; margin-bottom:1rem;}
    .addcard{background:var(--panel); border:1px dashed var(--line); border-radius:14px; padding:1rem;}
    .addcard h4{font-family:var(--disp); margin:0 0 .7rem; color:var(--neon); font-size:.95rem;}
    .fld{margin-bottom:.6rem;} .fld label{display:block; font-size:.7rem; letter-spacing:.6px; text-transform:uppercase; color:var(--mut); margin-bottom:.3rem;}
    .fld input,.fld select,.fld textarea{width:100%; padding:.6rem .7rem; background:rgba(0,0,0,.4); border:1px solid var(--line2); border-radius:9px; color:var(--txt); font-size:.85rem; font-family:var(--body); outline:none;}
    .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--neon);}
    .fld-row{display:grid; grid-template-columns:1fr 1fr; gap:.6rem;}

    details.debug{margin-top:1.4rem; border:1px solid var(--line); border-radius:12px; background:rgba(0,0,0,.3); overflow:hidden;}
    details.debug summary{cursor:pointer; padding:.7rem .9rem; font-family:var(--disp); font-size:.72rem; letter-spacing:1px; text-transform:uppercase; color:var(--mut); list-style:none;}
    details.debug summary::-webkit-details-marker{display:none;} details.debug summary:hover{color:var(--neon);}
    details.debug pre{margin:0; padding:.8rem .9rem; font-family:var(--mono); font-size:.68rem; color:#9fb3c8; max-height:240px; overflow:auto; white-space:pre-wrap; border-top:1px solid var(--line);}

    #cmms-toast{position:fixed; top:calc(.8rem + env(safe-area-inset-top)); right:.8rem; z-index:1300; display:flex; flex-direction:column; gap:.5rem; max-width:88vw;}
    .toast{display:flex; align-items:center; gap:.55rem; background:rgba(7,11,28,.96); border:1px solid var(--line); border-left:4px solid var(--neon); color:var(--txt); padding:.7rem .9rem; border-radius:11px; font-size:.82rem; box-shadow:0 12px 30px rgba(0,0,0,.5); animation:toastIn .3s ease; backdrop-filter:blur(10px);}
    .toast.err{border-left-color:var(--warn);} .toast.warn{border-left-color:var(--gold);}
    @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.05ms !important;} }
  </style>
</head>
<body>
<div class="cmms">
  <button class="back-btn" onclick="window.goHome()">← HOME</button>
  <div id="cmms-toast"></div>

  <div class="amb">
    <span class="scanline"></span>
    <div class="who">🛰️ <span>CMMS · <b>ISO 55001 / 9001 / 45001</b></span> · Teknisi: <b id="amb-user">—</b></div>
    <div class="clk"><span class="t" id="amb-clock">--:--:--</span><span class="shift" id="amb-shift">—</span></div>
  </div>

  <div class="shell">
    <nav class="rail" id="rail"></nav>
    <main class="main">
      <div class="view-head">
        <div>
          <p class="eyebrow" id="vh-eye">Work Order Deck</p>
          <h1 class="vtitle" id="vh-title">Maintenance <b>Cockpit</b></h1>
          <p class="vsub" id="vh-sub"></p>
        </div>
        <span class="live-pill"><span class="dot"></span> Live Board</span>
      </div>
      <div id="view-root"></div>
      <details class="debug"><summary>🔍 Debug · Intip Data LocalStorage</summary><pre id="debug-data">—</pre></details>
    </main>
  </div>
</div>

<script>
(function(){
  'use strict';
  // ---------- keys ----------
  var K={ wo:'dreamos_maintenance_tasks', k3:'dreamos_k3_reports',
    assets:'dreamos_maint_assets', pm:'dreamos_maint_pm', tpl:'dreamos_maint_tpl',
    insp:'dreamos_maint_inspections', audit:'dreamos_maint_audit', draft:'dreamos_maint_draft' };
  var view='cockpit', woFilter='all';

  // ---------- dom/util ----------
  function $(id){return document.getElementById(id);}
  function safeGet(k,fb){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(fb));}catch(e){return fb;}}
  function safeSet(k,d){localStorage.setItem(k,JSON.stringify(d));}
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function escA(s){return esc(s).replace(/'/g,'&#39;').replace(/"/g,'&quot;');}
  function uid(p){return (p||'x')+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);}
  function now(){return new Date();}
  function iso(d){return (d||now()).toISOString();}
  function todayStr(){var d=now();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
  function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000);}
  function fmtDate(s){if(!s)return '-';return new Date(s).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});}
  function fmtDT(s){if(!s)return '-';return new Date(s).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}
  function timeAgo(s){if(!s)return '-';var m=Math.floor((now()-new Date(s))/60000);if(m<1)return 'baru saja';if(m<60)return m+' mnt';var h=Math.floor(m/60);if(h<24)return h+' jam';var d=Math.floor(h/24);return d+' hari';}
  function user(){return safeGet('dreamos_bound_user',{});}

  function toast(msg,type){var c=$('cmms-toast');if(!c)return;var t=document.createElement('div');t.className='toast'+(type?(' '+type):'');var ic=type==='err'?'⛔':type==='warn'?'⚠️':'✅';t.innerHTML='<span>'+ic+'</span><span>'+esc(msg)+'</span>';c.appendChild(t);setTimeout(function(){t.style.opacity='0';t.style.transform='translateX(42px)';setTimeout(function(){t.remove();},300);},3200);}
  function audit(action,detail){var l=safeGet(K.audit,[]);l.unshift({ts:iso(),user:(user().nama||user().email||'sistem'),action:action,detail:detail||''});if(l.length>400)l.length=400;safeSet(K.audit,l);}

  // ---------- goHome (same-document safe, no recursion) ----------
  window.goHome=function(){
    try{
      var mc=document.getElementById('mod-container'); if(mc){mc.style.display='none';mc.innerHTML='';}
      var ma=document.getElementById('main-app'); if(ma)ma.style.display='block';
      var bn=document.getElementById('bottom-nav'); if(bn)bn.style.display='block';
      if(typeof window.renderDashboard==='function')window.renderDashboard();
      window.scrollTo(0,0); return;
    }catch(e){}
    window.location.href=(location.pathname.indexOf('/dream-os-final/')>=0?'/dream-os-final/':'./')+'index.html';
  };

  // ---------- svg ring ----------
  function ring(pct,color,size,stroke,cap){
    pct=Math.max(0,Math.min(100,pct||0)); size=size||104; stroke=stroke||9;
    var r=(size-stroke)/2, c=2*Math.PI*r, off=c; // start empty, animate later
    return '<div class="ring" style="width:'+size+'px;height:'+size+'px;">'+
      '<svg width="'+size+'" height="'+size+'"><circle class="bg" cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke-width="'+stroke+'"/>'+
      '<circle class="ring-fg" data-off="'+(c-(pct/100*c)).toFixed(1)+'" cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+c.toFixed(1)+'"/></svg>'+
      '<div class="ctr"><div class="pct">'+Math.round(pct)+(cap==='raw'?'':'%')+'</div>'+(cap&&cap!=='raw'?'<div class="cap">'+esc(cap)+'</div>':'')+'</div></div>';
  }
  function miniRing(pct,color){var s=42,st=5,r=(s-st)/2,c=2*Math.PI*r;return '<div class="mini"><svg width="'+s+'" height="'+s+'"><circle cx="'+(s/2)+'" cy="'+(s/2)+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="'+st+'"/><circle class="ring-fg" data-off="'+(c-(pct/100*c)).toFixed(1)+'" cx="'+(s/2)+'" cy="'+(s/2)+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+st+'" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+c.toFixed(1)+'"/></svg><div class="v">'+Math.round(pct)+'</div></div>';}
  function animateRings(){requestAnimationFrame(function(){requestAnimationFrame(function(){document.querySelectorAll('.ring-fg').forEach(function(el){el.style.strokeDashoffset=el.getAttribute('data-off');});});});}
  function countUp(el,target,suffix){if(!el)return;var t0=null,dur=650;function step(ts){if(!t0)t0=ts;var p=Math.min((ts-t0)/dur,1);el.textContent=Math.round(target*p)+(suffix||'');if(p<1)requestAnimationFrame(step);}requestAnimationFrame(step);}

  // ---------- risk model (transparent, condition-based) ----------
  function assetIcon(cat){return ({ac:'❄️',genset:'🔋',pompa:'💧',panel:'⚡',lift:'🛗',fire:'🧯',default:'🛠️'})[cat]||'🛠️';}
  function k3Mentions(a){var list=safeGet(K.k3,[]),loc=(a.location||'').toLowerCase(),nm=(a.name||'').toLowerCase(),n=0;list.forEach(function(r){var rl=(r.lokasi||'').toLowerCase(),rd=(r.deskripsi||'').toLowerCase();if((loc&&rl&&rl.indexOf(loc)>=0)||(nm&&rd&&rd.indexOf(nm)>=0)||(nm&&rl&&rl.indexOf(nm)>=0))n++;});return n;}
  function assetFailRate(a){var ins=safeGet(K.insp,[]),tot=0,fail=0;ins.forEach(function(h){(h.items||[]).forEach(function(it){if(it.assetId===a.id){tot++;if(it.result==='fail')fail++;}});});return tot?fail/tot:0;}
  function assetOverduePM(a){var pms=safeGet(K.pm,[]),worst=0;pms.forEach(function(p){if(p.assetId===a.id){var d=daysBetween(now(),p.nextDue);if(d<0)worst=Math.max(worst,-d);}});return worst;}
  function assetSignals(a){
    var crit=(a.criticality||3)/5*30;
    var od=assetOverduePM(a); var odS=Math.min(25, od>0?(15+Math.min(10,od/3)):0);
    var k3=k3Mentions(a); var k3S=Math.min(20,k3*8);
    var fr=assetFailRate(a); var frS=fr*25;
    var age= a.installDate? Math.max(0,(now()-new Date(a.installDate))/3.154e10):0;
    var life=a.expectedLifeYears||10; var ageS=Math.min(20,(age/life)*20);
    var risk=Math.min(100,Math.round(crit+odS+k3S+frS+ageS));
    return {risk:risk,health:100-risk,breakdown:{criticality:Math.round(crit),overduePM:Math.round(odS),k3:Math.round(k3S),failRate:Math.round(frS),age:Math.round(ageS)},overdueDays:od,k3:k3,failRate:fr,age:age};
  }
  function riskLevel(r){return r>=66?{t:'RISIKO TINGGI',c:'#e11d48',bg:'rgba(225,29,72,.16)'}:r>=33?{t:'PANTAU',c:'#f59e0b',bg:'rgba(245,158,11,.16)'}:{t:'SEHAT',c:'#10b981',bg:'rgba(16,185,129,.16)'};}
  function riskColor(r){return r>=66?'#e11d48':r>=33?'#f59e0b':'#10b981';}
  function recommend(s){if(s.risk>=66)return 'Jadwalkan inspeksi detail & siapkan work order pencegahan segera.';if(s.risk>=33)return 'Pantau ketat; percepat perawatan berkala berikutnya.';return 'Lanjutkan perawatan rutin sesuai jadwal.';}

  // ---------- KPIs ----------
  function kpis(){
    var pms=safeGet(K.pm,[]), ins=safeGet(K.insp,[]), wos=safeGet(K.wo,[]);
    // PM compliance last 30d: on-time done / due
    var since=addDays(now(),-30), due=0,ontime=0;
    pms.forEach(function(p){var nd=new Date(p.nextDue);if(nd>=since&&nd<=now()){due++;if(p.lastDone&&new Date(p.lastDone)<=addDays(nd,1))ontime++;}});
    var pmComp= due? Math.round(ontime/due*100):null;
    // checklist today
    var draft=safeGet(K.draft,null), tpl=safeGet(K.tpl,[]), doneToday=0;
    if(draft&&draft.date===todayStr()){doneToday=(draft.items||[]).filter(function(i){return i.result;}).length;}
    var ckComp= tpl.length? Math.round(doneToday/tpl.length*100):0;
    // backlog
    var open=wos.filter(function(w){var s=(w.status||'').toLowerCase();return s!=='selesai'&&s!=='approved'&&s!=='done';});
    var urgen=open.filter(function(w){return /high|critical|urgent/i.test(w.priority||'');}).length;
    // MTTR (avg hours open->done)
    var mttr=null,mttrN=0,mttrS=0;wos.forEach(function(w){if(w.completed_at&&w.created_at){mttrS+=(new Date(w.completed_at)-new Date(w.created_at))/3600000;mttrN++;}});if(mttrN)mttr=Math.round(mttrS/mttrN);
    return {pmComp:pmComp,ckComp:ckComp,backlog:open.length,urgen:urgen,mttr:mttr,pmDue:due};
  }

  // ---------- seed ----------
  function seed(){
    if(!safeGet(K.assets,null)){
      var y=function(n){return new Date(now().getFullYear()-n,5,1).toISOString();};
      safeSet(K.assets,[
        {id:'a_ac_a',name:'AC Gedung A',category:'ac',location:'Gedung A',criticality:4,installDate:y(6),expectedLifeYears:10,lastServiceDate:iso(addDays(now(),-120))},
        {id:'a_ac_b',name:'AC Gedung B',category:'ac',location:'Gedung B',criticality:4,installDate:y(4),expectedLifeYears:10,lastServiceDate:iso(addDays(now(),-40))},
        {id:'a_ac_m',name:'AC R. Musik',category:'ac',location:'R. Musik',criticality:3,installDate:y(8),expectedLifeYears:10,lastServiceDate:iso(addDays(now(),-200))},
        {id:'a_gen',name:'Genset Utama',category:'genset',location:'R. Genset',criticality:5,installDate:y(3),expectedLifeYears:15,lastServiceDate:iso(addDays(now(),-20))},
        {id:'a_pompa',name:'Pompa Air',category:'pompa',location:'Area Belakang',criticality:4,installDate:y(5),expectedLifeYears:12,lastServiceDate:iso(addDays(now(),-70))},
        {id:'a_panel',name:'Panel Listrik Utama',category:'panel',location:'R. Panel',criticality:5,installDate:y(7),expectedLifeYears:20,lastServiceDate:iso(addDays(now(),-15))},
        {id:'a_lift',name:'Lift Gedung A',category:'lift',location:'Gedung A',criticality:5,installDate:y(9),expectedLifeYears:20,lastServiceDate:iso(addDays(now(),-50))},
        {id:'a_fire',name:'Fire Alarm',category:'fire',location:'Semua Gedung',criticality:5,installDate:y(2),expectedLifeYears:15,lastServiceDate:iso(addDays(now(),-30))}
      ]);
    }
    if(!safeGet(K.pm,null)){
      var A=safeGet(K.assets,[]),mk=function(id,title,freq,over){var a=A.find(function(x){return x.id===id;});var ld=over?iso(addDays(now(),-over-freq+5)):iso(addDays(now(),-freq+8));return {id:uid('pm'),assetId:id,title:title,freqDays:freq,lastDone:ld,nextDue:iso(addDays(new Date(ld),freq)),status:'active'};};
      safeSet(K.pm,[
        mk('a_ac_a','Servis & cuci AC',90,25), mk('a_ac_b','Servis & cuci AC',90,0), mk('a_ac_m','Servis & cuci AC',90,60),
        mk('a_gen','Uji beban & ganti oli',30,12), mk('a_pompa','Cek seal & tekanan',60,0),
        mk('a_panel','Thermography & kencangkan koneksi',180,0), mk('a_lift','Inspeksi berkala lift',30,5), mk('a_fire','Tes panel & detector',90,0)
      ]);
    }
    if(!safeGet(K.tpl,null)){
      safeSet(K.tpl,[
        {id:'t1',zone:'Gedung A',assetId:'a_ac_a',label:'AC dingin & tidak bocor',type:'functional'},
        {id:'t2',zone:'Gedung A',assetId:'a_lift',label:'Lift berhenti rata & tombol normal',type:'safety'},
        {id:'t3',zone:'Gedung A',label:'Kebersihan koridor & tangga',type:'visual'},
        {id:'t4',zone:'Gedung B',assetId:'a_ac_b',label:'AC dingin & tidak bocor',type:'functional'},
        {id:'t5',zone:'Gedung B',assetId:'a_panel',label:'Indikator panel normal, tidak panas',type:'visual'},
        {id:'t6',zone:'R. Musik',assetId:'a_ac_m',label:'AC dingin & tidak bocor',type:'functional'},
        {id:'t7',zone:'R. Musik',label:'APAR tersedia & segel utuh',type:'safety'},
        {id:'t8',zone:'Area Luar',assetId:'a_pompa',label:'Pompa air tidak bocor & suara normal',type:'functional'},
        {id:'t9',zone:'Area Luar',assetId:'a_gen',label:'Genset: oli & bahan bakar cukup',type:'visual'},
        {id:'t10',zone:'Semua Gedung',assetId:'a_fire',label:'Lampu darurat & fire alarm aktif',type:'safety'}
      ]);
    }
    if(!safeGet(K.insp,null)){
      var tpl=safeGet(K.tpl,[]);
      function mkHist(daysAgo,insp,fails){var items=tpl.map(function(t,i){var r=fails.indexOf(i)>=0?'fail':(i%7===6?'na':'pass');return {templateId:t.id,assetId:t.assetId||null,result:r,note:r==='fail'?'Ditemukan anomali':''};});var done=items.filter(function(i){return i.result;}).length;return {id:uid('insp'),date:iso(addDays(now(),-daysAgo)),inspector:insp,items:items,completion:Math.round(done/tpl.length*100),findings:fails.length};}
      safeSet(K.insp,[ mkHist(1,'Pak Budi',[2,7]), mkHist(3,'Pak Budi',[5]) ]);
    }
  }

  // ---------- rail ----------
  var NAV=[
    {id:'cockpit',ic:'🛰️',t:'Kokpit'},
    {id:'inspect',ic:'📋',t:'Inspeksi Harian'},
    {id:'history',ic:'🗂️',t:'Riwayat Inspeksi'},
    {id:'pm',ic:'🔁',t:'Perawatan Berkala'},
    {id:'risk',ic:'📈',t:'Prediksi & Risiko'},
    {id:'wo',ic:'🛠️',t:'Work Order'},
    {id:'assets',ic:'🏷️',t:'Daftar Aset'},
    {id:'iso',ic:'📜',t:'Audit & Standar'}
  ];
  function badges(){var wos=safeGet(K.wo,[]);var open=wos.filter(function(w){var s=(w.status||'').toLowerCase();return s!=='selesai'&&s!=='approved'&&s!=='done';}).length;var pms=safeGet(K.pm,[]).filter(function(p){return daysBetween(now(),p.nextDue)<0;}).length;var tpl=safeGet(K.tpl,[]),draft=safeGet(K.draft,null),done=(draft&&draft.date===todayStr())?(draft.items||[]).filter(function(i){return i.result;}).length:0;return {wo:open,pm:pms,insp:done+'/'+tpl.length};}
  function renderRail(){var b=badges();$('rail').innerHTML='<div class="brand"><svg class="gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>CMMS</div>'+
    NAV.map(function(n){var bdg=n.id==='wo'?(b.wo||''):n.id==='pm'?(b.pm||''):n.id==='inspect'?b.insp:'';return '<div class="nav'+(view===n.id?' active':'')+'" onclick="setView(\''+n.id+'\')"><span class="ic">'+n.ic+'</span><span>'+n.t+'</span>'+(bdg!==''?'<span class="bdg">'+bdg+'</span>':'')+'</div>';}).join('')+
    '<div class="iso"><b>Praktik:</b> loop tertutup Inspeksi ➜ Temuan  Work Order ➜ Tutup ➜ Skor Aset. Selaras ISO 55001 §8, ISO 9001 §7.1.3/§10.2, ISO 45001 §8.1.2.</div>';
  }
  window.setView=function(v){view=v;renderRail();renderView();window.scrollTo({top:0,behavior:'smooth'});};

  var HEAD={
    cockpit:['Operational Cockpit','Maintenance <b>Cockpit</b>','Ringkasan kesehatan aset, kepatuhan perawatan, dan beban kerja hari ini dalam satu papan.'],
    inspect:['Daily Inspection','Inspeksi <b>Rutin Harian</b>','Ceklis per gedung untuk hari ini. Tandai lolos / gagal / N/A; temuan gagal otomatis jadi work order.'],
    history:['Inspection Log','Riwayat <b>Inspeksi</b>','Jejak setiap putaran ceklis: siapa, kapan, tingkat penyelesaian, dan jumlah temuan.'],
    pm:['Preventive Maintenance','Perawatan <b>Berkala</b>','Jadwal preventive berdasarkan frekuensi. Yang telat menyala merah dan menaikkan risiko aset.'],
    risk:['Condition-Based Risk','Prediksi & <b>Risiko</b>','Skor kesehatan tiap aset dihitung dari umur, perawatan telat, laporan K3, dan tingkat gagal ceklis.'],
    wo:['Work Orders','<b>Work Order</b>','Papan perintah kerja: dari temuan inspeksi, perawatan, maupun laporan K3 “Kerusakan Sarana”.'],
    assets:['Asset Registry','Daftar <b>Aset</b>','Register aset terpelihara beserta kritikalitas & umur — fondasi bagi perawatan dan prediksi.'],
    iso:['Audit & Standards','Audit & <b>Standar ISO</b>','Jejak audit setiap aksi + matriks pemetaan fitur ke klausul ISO 55001 / 9001 / 14001 / 45001.']
  };

  // ---------- views ----------

  function vInspect(){
    var tpl=safeGet(K.tpl,[]), A=safeGet(K.assets,[]);

    var A=safeGet(K.assets,[]);
    var html='<div class="toolbar"><button class="btn btn-primary" onclick="toggleAssetAdd()">＋ Tambah Aset</button></div>'+
      '<div class="addpanel" id="asset-add"><div class="addcard"><h4>🏷️ Aset Baru + Jadwal Preventive</h4><form onsubmit="return submitAsset(event)"><div class="fld-row"><div class="fld"><label>Nama Aset *</label><input id="as-n" required></div><div class="fld"><label>Lokasi *</label><input id="as-l" required></div></div><div class="fld-row"><div class="fld"><label>Kategori</label><select id="as-c"><option value="ac">AC</option><option value="genset">Genset</option><option value="pompa">Pompa</option><option value="panel">Panel Listrik</option><option value="lift">Lift</option><option value="fire">Fire Alarm</option><option value="other">Lainnya</option></select></div><div class="fld"><label>Kritikalitas (1-5)</label><select id="as-cr"><option>3</option><option>4</option><option>5</option><option>2</option><option>1</option></select></div></div><div class="fld-row"><div class="fld"><label>Umur Pakai (tahun)</label><input id="as-life" type="number" value="10"></div><div class="fld"><label>Frekuensi Preventive (hari)</label><input id="as-freq" type="number" value="90"></div></div><div style="display:flex;gap:.5rem;"><button class="btn btn-success" style="flex:1;">💾 Simpan</button><button type="button" class="btn btn-ghost" onclick="toggleAssetAdd(false)">Batal</button></div></form></div></div>';
    if(!A.length)html+='<div class="empty"><h3>Belum ada aset</h3><p>Tambahkan aset pertama Anda.</p></div>';
    else html+=A.map(function(a){var s=assetSignals(a);var lv=riskLevel(s.risk);var crit='';for(var i=1;i<=5;i++)crit+='<i class="'+(i<=a.criticality?'on':'')+'"></i>';return '<div class="asset"><div class="ai">'+assetIcon(a.category)+'</div>'+miniRing(s.health,riskColor(s.risk))+'<div class="am"><div class="t">'+esc(a.name)+' <span class="lvl" style="background:'+lv.bg+';color:'+lv.c+';">'+lv.t+'</span></div><div class="s">'+esc(a.location)+' · dipasang '+fmtDate(a.installDate)+' · servis terakhir '+fmtDate(a.lastServiceDate)+'</div><div style="margin-top:.3rem;"><span class="crit" title="Kritikalitas">'+crit+'</span></div></div></div>';}).join('');
    return html;
  }
  window.toggleAssetAdd=function(force){var p=$('asset-add');if(!p)return;var open=(typeof force==='boolean')?force:!p.classList.contains('open');p.classList.toggle('open',open);};
  window.submitAsset=function(e){e.preventDefault();var n=$('as-n').value.trim(),l=$('as-l').value.trim();if(!n||!l){toast('Nama & lokasi wajib','err');return false;}var id=uid('a');var a={id:id,name:n,location:l,category:$('as-c').value,criticality:parseInt($('as-cr').value,10),installDate:iso(),expectedLifeYears:parseInt($('as-life').value,10)||10,lastServiceDate:iso()};var A=safeGet(K.assets,[]);A.push(a);safeSet(K.assets,A);var freq=parseInt($('as-freq').value,10)||90;var pms=safeGet(K.pm,[]);pms.push({id:uid('pm'),assetId:id,title:'Perawatan berkala '+n,freqDays:freq,lastDone:iso(),nextDue:iso(addDays(now(),freq)),status:'active'});safeSet(K.pm,pms);audit('ASSET_CREATE',n);renderRail();renderView();toast('Aset + jadwal preventive ditambahkan');return false;};

  function vISO(){
    var log=safeGet(K.audit,[]);
    var matrix=[
      ['55001','§6.2 / §8.1','Perencanaan & pengendalian operasional aset','Jadwal preventive, register aset, work order terstruktur'],
      ['55001','§9.1','Pemantauan & pengukuran kinerja aset','KPI kepatuhan PM, MTTR, papan risiko berbasis kondisi'],
      ['9001','§7.1.3','Pemeliharaan infrastruktur','Perawatan berkala + inspeksi rutin per gedung'],
      ['9001','§10.2','Ketidaksesuaian & tindakan korektif','Ceklis gagal ➜ work order otomatis (loop tertutup)'],
      ['14001','§6.1.2 / §8.1','Aspek lingkungan & pengendalian operasional','Butir ceklis kebocoran/energi, jejak audit tindakan'],
      ['45001','§6.1.2','Identifikasi bahaya & penilaian risiko K3','Terintegrasi modul K3; papan risiko aset'],
      ['45001','§8.1.2','Penghilangan bahaya & pengendalian','Preventive & predictive maintenance mengurangi risiko']
    ];
    var logHtml=log.length?log.slice(0,80).map(function(r){return '<div class="row"><span class="ts">'+fmtDT(r.ts)+'</span><span class="ac">'+esc(r.action)+'</span><span>'+esc(r.user)+' · '+esc(r.detail)+'</span></div>';}).join(''):'<div class="row"><span class="ts">—</span><span>Belum ada aktivitas tercatat.</span></div>';
    return '<div class="tile s6" style="--c:var(--teal);margin-bottom:1rem;"><span class="shine"></span><div class="lab">Jejak Audit (siap diperiksa auditor)</div><div class="log">'+logHtml+'</div></div>'+
      '<div class="tile s6" style="--c:var(--accent);"><span class="shine"></span><div class="lab">Matriks Pemetaan Standar</div><div style="overflow-x:auto;"><table class="iso"><thead><tr><th>Standar</th><th>Klausul</th><th>Persyaratan</th><th>Cara Dream OS Memenuhi</th></tr></thead><tbody>'+matrix.map(function(m){return '<tr><td><b>ISO '+m[0]+'</b></td><td class="cl">'+m[1]+'</td><td>'+m[2]+'</td><td>'+m[3]+'</td></tr>';}).join('')+'</tbody></table></div></div>';
  }

  // ---------- ambient clock ----------
  function tick(){var d=now(),hh=String(d.getHours()).padStart(2,'0'),mm=String(d.getMinutes()).padStart(2,'0'),ss=String(d.getSeconds()).padStart(2,'0');var c=$('amb-clock');if(c)c.textContent=hh+':'+mm+':'+ss;var h=d.getHours(),sh=h<11?'Sif Pagi':h<15?'Sif Siang':'Sif Malam';var s=$('amb-shift');if(s)s.textContent=sh;var u=$('amb-user');if(u)u.textContent=(user().nama||user().email||'tamu');}

  // ---------- init ----------
  seed();
  if(!safeGet(K.wo,[]).length){reconcileK3(false);} // pull existing K3 damage reports on first run
  renderRail(); renderView(); tick(); setInterval(tick,1000);
  console.log('🛰️ CMMS Maintenance ready — cockpit, inspection, PM, risk, WO, assets, ISO audit');
})();
</script>
</body>
</html>
