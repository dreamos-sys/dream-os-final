<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance • Dream OS</title>
  <style>
    :root { --neon:#00ff9d; --accent:#0ea5e9; --warning:#e11d48; --gold:#f59e0b; }
    * { box-sizing:border-box; }
    body { font-family:'Inter',system-ui,sans-serif; background:#0a0e27; color:#e2e8f0; min-height:100vh; margin:0; padding:1rem; }
    .glass { background:rgba(15,23,42,0.85); backdrop-filter:blur(16px); border:1px solid rgba(0,255,157,0.15); border-radius:16px; padding:1.25rem; margin-bottom:1rem; }
    .back-btn { position:fixed; bottom:calc(1.5rem + env(safe-area-inset-bottom)); left:1rem; z-index:1000; background:rgba(30,41,59,0.95); border:1px solid var(--neon); color:var(--neon); padding:0.5rem 1rem; border-radius:8px; cursor:pointer; font-weight:700; font-size:0.875rem; }
    .btn { min-height:44px; padding:0.6rem 0.85rem; border:none; border-radius:8px; font-weight:700; font-size:0.8125rem; cursor:pointer; }
    .btn-success { background:#10b981; color:#fff; }
    .btn-danger { background:var(--warning); color:#fff; }
    .badge { padding:0.2rem 0.5rem; border-radius:10px; font-size:0.8125rem; font-weight:700; }
    .badge-pending { background:rgba(245,158,11,0.2); color:#f59e0b; }
    .badge-approved { background:rgba(16,185,129,0.2); color:#10b981; }
    .badge-high { background:rgba(239,68,68,0.2); color:#ef4444; }
    .task-card { background:rgba(0,0,0,0.3); border-left:4px solid var(--accent); padding:1rem; border-radius:12px; margin-bottom:0.8rem; }
    .task-card.priority-high { border-left-color:var(--warning); }
  </style>
</head>
<body>
  <button class="back-btn" onclick="window.goHome()">← HOME</button>
  
  <div style="max-width:920px;margin:0 auto;padding:0.5rem 0.5rem 5rem;">
    <div class="glass">
      <h2 style="color:var(--neon);margin:0;font-size:1.1rem;"> Maintenance Tasks</h2>
      <p style="color:#64748b;font-size:0.875rem;">Auto-generated from K3 Reports</p>
    </div>
    
    <div id="task-list"></div>
  </div>

  <script>
  window.goHome = function() {
    if (window.parent && typeof window.parent.goHome === 'function') window.parent.goHome();
    else window.location.href = '../index.html';
  };
  
  function safeGet(k, fb) { try { return JSON.parse(localStorage.getItem(k) || JSON.stringify(fb)); } catch(e) { return fb; } }
  
  function renderTasks() {
    var tasks = safeGet('dreamos_maintenance_tasks', []);
    var el = document.getElementById('task-list');
    
    if (!tasks.length) {
      el.innerHTML = '<div class="glass"><p style="text-align:center;color:#94a3b8;">Belum ada task maintenance</p></div>';
      return;
    }
    
    var html = '';
    tasks.forEach(function(t) {
      var prioClass = (t.priority === 'high') ? 'priority-high' : '';
      var badgeClass = (t.status === 'approved' || t.status === 'selesai') ? 'badge-approved' : 'badge-pending';
      var statusText = t.status === 'approved' || t.status === 'selesai' ? '✅ Selesai' : '⏳ Pending';
      
      html += '<div class="task-card ' + prioClass + '">' +
        '<div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:0.5rem;">' +
          '<h3 style="margin:0;color:var(--neon);font-size:1rem;">' + (t.judul || t.deskripsi || 'Task Maintenance') + '</h3>' +
          '<span class="badge ' + badgeClass + '">' + statusText + '</span>' +
        '</div>' +
        '<p style="margin:0.3rem 0;color:#cbd5e1;font-size:0.875rem;">📍 ' + (t.lokasi || '-') + '</p>' +
        '<p style="margin:0.3rem 0;color:#94a3b8;font-size:0.8125rem;">' + (t.deskripsi || '') + '</p>' +
        '<div style="margin-top:0.5rem;font-size:0.75rem;color:#64748b;">' +
          'Priority: <strong>' + (t.priority || 'medium') + '</strong> • ' +
          'Dari K3: <strong>' + (t.k3_report_id ? 'Ya' : 'Tidak') + '</strong> • ' +
          'Dibuat: ' + new Date(t.created_at).toLocaleDateString('id-ID') +
        '</div>' +
        (t.status !== 'selesai' ? '<div style="margin-top:0.5rem;"><button class="btn btn-success" onclick="markComplete(\'' + t.id + '\')">✅ Tandai Selesai</button></div>' : '') +
      '</div>';
    });
    
    el.innerHTML = html;
  }
  
  window.markComplete = function(id) {
    var tasks = safeGet('dreamos_maintenance_tasks', []);
    var idx = tasks.findIndex(function(t) { return t.id === id; });
    if (idx > -1) {
      tasks[idx].status = 'selesai';
      tasks[idx].completed_at = new Date().toISOString();
      localStorage.setItem('dreamos_maintenance_tasks', JSON.stringify(tasks));
      renderTasks();
      alert('Task ditandai selesai!');
    }
  };
  
  renderTasks();
  </script>
</body>
</html>
