<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Dream OS</title>
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #0d1428 0%, #1a1f3a 100%); }
    .login-card { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(100, 116, 139, 0.3); border-radius: 16px; padding: 2rem; max-width: 400px; width: 90%; }
    .login-card h1 { color: #00ff9d; margin-bottom: 1.5rem; text-align: center; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; color: #94a3b8; margin-bottom: 0.5rem; font-size: 0.875rem; }
    .form-group input { width: 100%; padding: 0.75rem; border: 1px solid #334155; border-radius: 8px; background: rgba(15, 23, 42, 0.5); color: #e2e8f0; }
    .btn { width: 100%; padding: 0.75rem; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 0.5rem; }
    .btn-primary { background: #00ff9d; color: #0d1428; }
    .btn-primary:hover { background: #00cc7d; }
    .btn-link { background: none; color: #00ff9d; text-decoration: underline; }
    .message { padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.875rem; }
    .message.error { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid #ef4444; }
    .message.success { background: rgba(0, 255, 157, 0.1); color: #00ff9d; border: 1px solid #00ff9d; }
  </style>

</head>
<body>
  <div class="login-card">
    <h1>🛰️ Dream OS</h1>
    <div id="message"></div>
    
    <form id="login-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn btn-primary">Login</button>
    </form>
    
    <button class="btn btn-link" onclick="showSignUp()">Belum punya akun? Daftar</button>
    <button class="btn btn-link" onclick="showReset()">Lupa password?</button>
  </div>

  <script src="js/auth.js"></script>
  <script>
    function showMessage(msg, type) {
      const el = document.getElementById('message');
      el.className = 'message ' + type;
      el.textContent = msg;
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      showMessage('Logging in...', 'success');
      const result = await Auth.login(email, password);
      
      if (result.success) {
        showMessage('Login successful! Redirecting...', 'success');
        setTimeout(() => window.location.href = '/index.html', 1000);
      } else {
        showMessage(result.error, 'error');
      }
    });

    function showSignUp() {
      window.location.href = '/signup.html';
    }

    function showReset() {
      const email = document.getElementById('email').value;
      if (!email) {
        showMessage('Masukkan email dulu', 'error');
        return;
      }
      Auth.requestPasswordReset(email).then(result => {
        if (result.success) {
          showMessage('Email reset dikirim! Cek inbox.', 'success');
        } else {
          showMessage(result.error, 'error');
        }
      });
    }
  </script>

</body>
</html>
