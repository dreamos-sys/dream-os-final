<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile • Dream OS v3.0</title>
    <script src="../js/security-helper.js"></script>
    <style>
        :root {
            --glass-bg: rgba(15, 23, 42, 0.5);
            --glass-border: rgba(0, 255, 157, 0.1);
            --neon: #00ff9d;
            --accent: #0ea5e9;
            --warning: #e11d48;
            --gold: #f59e0b;
            --purple: #8b5cf6;
        }
        * { box-sizing: border-box; }
        body { margin:0; background:#0a0e27; color:#e2e8f0; font-family:'Inter',sans-serif; min-height:100vh; }
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 1.2rem; margin-bottom: 1rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .back-btn {
            position: fixed; top: 1rem; left: 1rem; z-index: 1000;
            background: rgba(30,41,59,0.9); border: 1px solid var(--neon);
            color: var(--neon); padding: 0.5rem 1rem; border-radius: 10px;
            cursor: pointer; font-weight: 700; font-size: 0.75rem;
        }
        .btn {
            padding: 0.6rem 1rem; border: none; border-radius: 10px;
            font-weight: 700; font-size: 0.75rem; cursor: pointer; transition: all 0.2s ease;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-success { background: #10b981; color: #fff; }
        .btn-danger { background: var(--warning); color: #fff; }
        .btn-warning { background: var(--gold); color: #000; }
        .btn:hover { transform: translateY(-1px); opacity: 0.95; }
        .input-field {
            width: 100%; padding: 0.6rem; background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
            color: #e2e8f0; font-size: 0.78rem; outline: none;
        }
        .input-field:focus { border-color: var(--neon); }
        
        .tab-nav {
            display: flex; gap: 0.3rem; margin-bottom: 1rem; flex-wrap: wrap;
            position: relative; z-index: 100;
        }
        .tab-btn {
            padding: 0.5rem 1rem; border-radius: 10px; font-size: 0.7rem; font-weight: 600;
            cursor: pointer; border: 1px solid rgba(255,255,255,0.15);
            background: rgba(30,41,59,0.7); color: #94a3b8;
            transition: all 0.2s ease; white-space: nowrap;
            pointer-events: auto; position: relative; z-index: 101;
        }
        .tab-btn:hover {
            background: rgba(30,41,59,0.9); border-color: var(--neon); color: #e2e8f0;
        }
        .tab-btn.active {
            background: var(--neon); color: #000; border-color: var(--neon);
            box-shadow: 0 0 15px rgba(0,255,157,0.4);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .avatar-preview {
            width: 70px; height: 70px; border-radius: 50%;
            background: rgba(30,41,59,0.8); border: 2px solid rgba(0,255,157,0.3);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; overflow: hidden;
        }
        .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
        .stat-card {
            background: rgba(0,0,0,0.3); padding: 0.8rem; border-radius: 12px;
            text-align: center; border: 1px solid rgba(255,255,255,0.05);
        }
        .stat-value { font-size: 1.4rem; font-weight: 800; color: var(--neon); }
        .stat-label { font-size: 0.6rem; color: #94a3b8; margin-top: 0.2rem; }
        table { width:100%; border-collapse:collapse; font-size:0.7rem; }
        th { background: rgba(0,0,0,0.3); color: #94a3b8; padding: 0.4rem; text-align: left; }
        td { padding: 0.35rem 0.4rem; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .section-title {
            font-size: 0.85rem; font-weight: 700; margin: 0 0 0.8rem;
            display: flex; align-items: center; gap: 0.4rem;
            border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.5rem;
        }
        .loading { text-align:center; padding:2rem; color:#94a3b8; }
        .empty-state { text-align:center; padding:2rem; color:#94a3b8; }
    </style>
</head>
<body>

<button class="back-btn" onclick="window.parent.goHome()">← KEMBALI</button>

<div style="max-width:650px; margin:0 auto; padding:4rem 1.2rem 5rem;">

    <!-- Profile Header -->
    <div class="glass" style="display:flex; align-items:center; gap:1rem;">
        <div class="avatar-preview" id="avatar-preview">👤</div>
        <div style="flex:1;">
            <h2 style="color:var(--neon); margin:0; font-size:1rem;" id="display-name">Loading...</h2>
            <div style="font-size:0.7rem; color:#94a3b8;" id="display-role">-</div>
            <div style="font-size:0.6rem; color:#64748b; margin-top:0.3rem;" id="display-email">-</div>
            <input type="file" id="avatar-input" accept="image/*" style="display:none;">
            <button class="btn btn-primary" onclick="document.getElementById('avatar-input').click()" style="font-size:0.65rem; padding:0.3rem 0.7rem; margin-top:0.4rem;">📷 Upload Foto</button>
        </div>
    </div>

    <!-- TABS - FIXED WITH EVENT DELEGATION -->
    <div class="tab-nav" id="tab-nav">
        <button class="tab-btn active" data-tab="overview">📊 Overview</button>
        <button class="tab-btn" data-tab="edit">✏️ Edit</button>
        <button class="tab-btn" data-tab="security">🔒 Security</button>
        <button class="tab-btn" data-tab="users">👥 Users</button>
        <button class="tab-btn" data-tab="settings">⚙️ Settings</button>
    </div>

    <!-- TAB: Overview -->
    <div id="tab-overview" class="tab-content active">
        <div class="glass">
            <div class="section-title" style="color:var(--accent);">📊 Statistik Akun</div>
            <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:0.6rem;">
                <div class="stat-card"><div class="stat-value" id="stat-logins">0</div><div class="stat-label">Total Logins</div></div>
                <div class="stat-card"><div class="stat-value" id="stat-days">0</div><div class="stat-label">Hari Aktif</div></div>
                <div class="stat-card"><div class="stat-value" id="stat-tasks">0</div><div class="stat-label">Tasks</div></div>
                <div class="stat-card"><div class="stat-value" id="stat-score">0</div><div class="stat-label">Score</div></div>
            </div>
        </div>
        <div class="glass">
            <div class="section-title" style="color:var(--gold);">🏆 Achievements</div>
            <div id="achievements-list"><p style="color:#94a3b8; text-align:center;">Belum ada achievement.</p></div>
        </div>
    </div>

    <!-- TAB: Edit -->
    <div id="tab-edit" class="tab-content">
        <div class="glass">
            <div class="section-title" style="color:var(--neon);">✏️ Edit Profile</div>
            <div style="margin-bottom:0.6rem;"><label style="font-size:0.65rem; color:#94a3b8;">Nama</label><input class="input-field" id="edit-nama"></div>
            <div style="margin-bottom:0.6rem;"><label style="font-size:0.65rem; color:#94a3b8;">Email</label><input class="input-field" id="edit-email" type="email"></div>
            <div style="margin-bottom:0.6rem;"><label style="font-size:0.65rem; color:#94a3b8;">No. Telepon</label><input class="input-field" id="edit-phone" type="tel"></div>
            <div style="margin-bottom:0.6rem;"><label style="font-size:0.65rem; color:#94a3b8;">Department</label><input class="input-field" id="edit-department"></div>
            <button class="btn btn-success" onclick="window.saveProfile()" style="width:100%;">💾 Simpan</button>
        </div>
    </div>

    <!-- TAB: Security -->
    <div id="tab-security" class="tab-content">
        <div class="glass">
            <div class="section-title" style="color:var(--warning);">🔐 Ganti Password</div>
            <input class="input-field" id="old-pass" type="password" placeholder="Password lama" style="margin-bottom:0.5rem;">
            <input class="input-field" id="new-pass" type="password" placeholder="Password baru" style="margin-bottom:0.5rem;">
            <input class="input-field" id="confirm-pass" type="password" placeholder="Konfirmasi" style="margin-bottom:0.5rem;">
            <button class="btn btn-warning" onclick="window.changePassword()" style="width:100%;">🔑 Ganti Password</button>
        </div>
        <div class="glass">
            <div class="section-title" style="color:var(--gold);">🛡️ Device DNA</div>
            <p style="font-size:0.75rem;"><strong>DNA:</strong> <span id="dna-hash" style="font-family:monospace; color:#f59e0b;">Menghitung...</span></p>
        </div>
    </div>

    <!-- TAB: Users -->
    <div id="tab-users" class="tab-content">
        <div class="glass">
            <div class="section-title" style="color:var(--purple);">👥 Daftar Pengguna</div>
            <div id="user-list" style="max-height:350px; overflow-y:auto;"></div>
            <button class="btn btn-success" onclick="window.showRegisterForm()" style="width:100%; margin-top:0.8rem;">➕ Tambah Pengguna Baru</button>
        </div>
        <div id="register-panel" class="glass" style="display:none; border-color: var(--neon);">
            <div class="section-title" style="color:var(--neon);">📝 Pendaftaran</div>
            <input class="input-field" id="reg-nama" placeholder="Nama Lengkap" style="margin-bottom:0.4rem;">
            <input class="input-field" id="reg-email" placeholder="Email" type="email" style="margin-bottom:0.4rem;">
            <select class="input-field" id="reg-role" style="margin-bottom:0.4rem;">
                <option value="staff">Staff</option><option value="security">Security</option>
                <option value="janitor">Janitor</option><option value="maintenance">Maintenance</option>
                <option value="koord">Koordinator</option><option value="kabag">Kabag</option>
            </select>
            <input class="input-field" type="password" id="reg-pass" placeholder="Password" style="margin-bottom:0.4rem;">
            <input class="input-field" type="password" id="reg-confirm" placeholder="Konfirmasi Password">
            <div style="display:flex; gap:0.5rem; margin-top:0.8rem;">
                <button class="btn btn-primary" onclick="window.registerUser()">✅ Daftar</button>
                <button class="btn btn-danger" onclick="window.hideRegisterForm()">❌ Batal</button>
            </div>
            <p id="reg-msg" style="font-size:0.7rem; margin-top:0.5rem;"></p>
        </div>
    </div>

    <!-- TAB: Settings -->
    <div id="tab-settings" class="tab-content">
        <div class="glass">
            <div class="section-title" style="color:var(--accent);">🔔 Notifikasi</div>
            <label style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.4rem; font-size:0.75rem;">
                <input type="checkbox" id="notif-email" checked style="accent-color:var(--neon);"> Email
            </label>
            <label style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.4rem; font-size:0.75rem;">
                <input type="checkbox" id="notif-push" checked style="accent-color:var(--neon);"> Push
            </label>
            <button class="btn btn-primary" onclick="window.saveNotifications()" style="width:100%; margin-top:0.5rem;">💾 Simpan</button>
        </div>
        <div class="glass">
            <div class="section-title" style="color:var(--gold);">🎨 Tampilan</div>
            <select class="input-field" id="setting-theme" style="margin-bottom:0.5rem;">
                <option value="dark">🌙 Dark</option><option value="light">☀️ Light</option>
            </select>
            <button class="btn btn-warning" onclick="window.saveAppearance()" style="width:100%;">💾 Simpan</button>
        </div>
    </div>

    <!-- Logout -->
    <button class="btn btn-danger" onclick="window.handleLogout()" style="width:100%; margin-top:1rem;">🚪 Logout</button>
    <p style="text-align:center; font-size:0.6rem; color:#ef4444; margin-top:0.4rem;">⚠️ Logout menghapus sesi.</p>

</div>

<script>
(function() {
  'use strict';
  
  var SEC = window.DreamSec;
  if (!SEC) {
    document.body.innerHTML = '<div style="text-align:center;padding:4rem;color:#ef4444;"><h2>⚠️ Error</h2><p>Security module not loaded.</p></div>';
    return;
  }
  
  var user = SEC.getCurrentUser();
  if (!user) {
    document.body.innerHTML = '<div style="text-align:center;padding:4rem;color:#ef4444;"><h2>🔒 Login Required</h2></div>';
    return;
  }

  // ========== TAB SWITCHING WITH EVENT DELEGATION ==========
  window.switchProfileTab = function(tabName, btn) {
    console.log('📑 Switching to tab:', tabName);
    
    document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
    document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
    
    if (btn) btn.classList.add('active');
    
    var content = document.getElementById('tab-' + tabName);
    if (content) {
      content.classList.add('active');
      
      // Load tab-specific data
      if (tabName === 'users') renderUserList();
      if (tabName === 'overview') loadStats();
      if (tabName === 'edit') loadEditForm();
      if (tabName === 'security') loadDNA();
      if (tabName === 'settings') loadSettings();
    }
  };

  // Event delegation for tab buttons
  document.getElementById('tab-nav').addEventListener('click', function(e) {
    var btn = e.target.closest('.tab-btn');
    if (btn) {
      switchProfileTab(btn.dataset.tab, btn);
    }
  });

  // ========== INIT ==========
  function init() {
    document.getElementById('display-name').textContent = user.nama || 'User';
    document.getElementById('display-role').textContent = (user.role || 'staff').toUpperCase();
    document.getElementById('display-email').textContent = user.email || '-';
    
    if (user.avatar) {
      document.getElementById('avatar-preview').innerHTML = '<img src="'+user.avatar+'" style="width:100%;height:100%;object-fit:cover;">';
    }
    
    loadStats();
    loadDNA();
    loadSettings();
    renderUserList();
  }

  function loadStats() {
    var logs = JSON.parse(localStorage.getItem('dreamos_audit_logs') || '[]');
    var userLogs = logs.filter(function(l) { return l.user === user.email || l.user === user.nama; });
    document.getElementById('stat-logins').textContent = userLogs.filter(function(l) { return l.action === 'LOGIN' || l.action === 'ACCESS'; }).length;
    document.getElementById('stat-days').textContent = Math.floor((Date.now() - new Date(user.created_at || Date.now())) / 86400000);
    document.getElementById('stat-tasks').textContent = userLogs.length;
    document.getElementById('stat-score').textContent = Math.min(100, userLogs.length * 3);
  }

  function loadDNA() {
    if (SEC.getDeviceDNA) {
      SEC.getDeviceDNA().then(function(dna) {
        document.getElementById('dna-hash').textContent = dna;
      }).catch(function() {
        document.getElementById('dna-hash').textContent = 'Error';
      });
    }
  }

  function loadSettings() {
    var settings = JSON.parse(localStorage.getItem('dreamos_user_settings') || '{}');
    document.getElementById('notif-email').checked = settings.notifEmail !== false;
    document.getElementById('notif-push').checked = settings.notifPush !== false;
    document.getElementById('setting-theme').value = settings.theme || 'dark';
  }

  function loadEditForm() {
    document.getElementById('edit-nama').value = user.nama || '';
    document.getElementById('edit-email').value = user.email || '';
    document.getElementById('edit-phone').value = user.phone || '';
    document.getElementById('edit-department').value = user.department || '';
  }

  function renderUserList() {
    var container = document.getElementById('user-list');
    if (!container) return;
    
    container.innerHTML = '<div class="loading">Loading...</div>';
    
    setTimeout(function() {
      var users = JSON.parse(localStorage.getItem('dreamos_users_db') || '[]');
      
      if (!users.length) {
        container.innerHTML = '<div class="empty-state"><p>📭 Belum ada pengguna terdaftar</p><p style="font-size:0.7rem;margin-top:0.5rem;">Klik tombol di bawah untuk menambah pengguna baru</p></div>';
        return;
      }
      
      container.innerHTML = '<table><tr><th>Nama</th><th>Email</th><th>Role</th><th></th></tr>' + users.map(function(u, i) {
        return '<tr><td>'+SEC.sanitize(u.nama)+'</td><td style="font-size:0.65rem;">'+SEC.sanitize(u.email)+'</td><td>'+SEC.sanitize(u.role)+'</td><td>'+(u.role !== 'dev' ? '<button class="btn btn-danger" onclick="window.deleteUser('+i+')" style="font-size:0.5rem;padding:0.15rem 0.3rem;">🗑️</button>' : '')+'</td></tr>';
      }).join('') + '</table>';
    }, 300);
  }

  // ========== ACTIONS ==========
  window.saveProfile = function() {
    user.nama = document.getElementById('edit-nama').value;
    user.phone = document.getElementById('edit-phone').value;
    user.department = document.getElementById('edit-department').value;
    localStorage.setItem('dreamos_bound_user', JSON.stringify(user));
    
    var users = JSON.parse(localStorage.getItem('dreamos_users_db') || '[]');
    var idx = users.findIndex(function(u) { return u.email === user.email; });
    if (idx >= 0) {
      users[idx].nama = user.nama;
      users[idx].phone = user.phone;
      users[idx].department = user.department;
      localStorage.setItem('dreamos_users_db', JSON.stringify(users));
    }
    
    document.getElementById('display-name').textContent = user.nama;
    SEC.auditLog('UPDATE_PROFILE', 'Updated');
    alert('✅ Profile diupdate!');
  };

  window.changePassword = async function() {
    try {
      var oldPass = document.getElementById('old-pass').value;
      var newPass = document.getElementById('new-pass').value;
      var confirmPass = document.getElementById('confirm-pass').value;
      
      if (!oldPass || !newPass || !confirmPass) return alert('⚠️ Semua field wajib diisi!');
      if (newPass.length < 6) return alert('⚠️ Password minimal 6 karakter!');
      if (newPass !== confirmPass) return alert('⚠️ Password tidak cocok!');
      
      var oldHash = await SEC.hashPassword(oldPass);
      var users = JSON.parse(localStorage.getItem('dreamos_users_db') || '[]');
      var currentUser = users.find(function(u) { return u.email === user.email; });
      
      if (!currentUser || currentUser.password_hash !== oldHash) return alert('⚠️ Password lama salah!');
      
      currentUser.password_hash = await SEC.hashPassword(newPass);
      localStorage.setItem('dreamos_users_db', JSON.stringify(users));
      SEC.auditLog('CHANGE_PASSWORD', 'Changed');
      document.getElementById('old-pass').value = '';
      document.getElementById('new-pass').value = '';
      document.getElementById('confirm-pass').value = '';
      alert('✅ Password diganti!');
    } catch (error) {
      console.error('Change password error:', error);
      alert('⚠️ Error: ' + error.message);
    }
  };

  window.showRegisterForm = function() {
    document.getElementById('register-panel').style.display = 'block';
  };

  window.hideRegisterForm = function() {
    document.getElementById('register-panel').style.display = 'none';
  };

  window.registerUser = async function() {
    try {
      var nama = document.getElementById('reg-nama').value.trim();
      var email = document.getElementById('reg-email').value.trim();
      var role = document.getElementById('reg-role').value;
      var pass = document.getElementById('reg-pass').value;
      var confirm = document.getElementById('reg-confirm').value;
      var msg = document.getElementById('reg-msg');
      
      if (!nama || !email || !pass) { msg.textContent = '⚠️ Nama, email, password wajib!'; msg.style.color = '#ef4444'; return; }
      if (pass.length < 6) { msg.textContent = '⚠️ Password min 6 karakter!'; msg.style.color = '#ef4444'; return; }
      if (pass !== confirm) { msg.textContent = '⚠️ Password tidak cocok!'; msg.style.color = '#ef4444'; return; }
      
      var users = JSON.parse(localStorage.getItem('dreamos_users_db') || '[]');
      if (users.find(function(u) { return u.email === email; })) {
        msg.textContent = '⚠️ Email sudah terdaftar!'; msg.style.color = '#ef4444'; return;
      }
      
      var hashed = await SEC.hashPassword(pass);
      users.push({ nama: nama, email: email, role: role, password_hash: hashed, device_dna: '', created_at: new Date().toISOString() });
      localStorage.setItem('dreamos_users_db', JSON.stringify(users));
      SEC.auditLog('REGISTER', nama + ' (' + email + ')');
      hideRegisterForm();
      renderUserList();
      alert('✅ ' + nama + ' berhasil didaftarkan!');
    } catch (error) {
      console.error('Register user error:', error);
      alert('⚠️ Error: ' + error.message);
    }
  };

  window.deleteUser = function(index) {
    if (!confirm('Hapus pengguna ini?')) return;
    var users = JSON.parse(localStorage.getItem('dreamos_users_db') || '[]');
    users.splice(index, 1);
    localStorage.setItem('dreamos_users_db', JSON.stringify(users));
    SEC.auditLog('DELETE_USER', 'Deleted');
    renderUserList();
  };

  window.saveNotifications = function() {
    var settings = JSON.parse(localStorage.getItem('dreamos_user_settings') || '{}');
    settings.notifEmail = document.getElementById('notif-email').checked;
    settings.notifPush = document.getElementById('notif-push').checked;
    localStorage.setItem('dreamos_user_settings', JSON.stringify(settings));
    alert('✅ Disimpan!');
  };

  window.saveAppearance = function() {
    var settings = JSON.parse(localStorage.getItem('dreamos_user_settings') || '{}');
    settings.theme = document.getElementById('setting-theme').value;
    localStorage.setItem('dreamos_user_settings', JSON.stringify(settings));
    alert('✅ Disimpan!');
  };

  // Avatar
  document.getElementById('avatar-input').addEventListener('change', function() {
    if (this.files[0]) {
      var reader = new FileReader();
      reader.onload = function(ev) {
        user.avatar = ev.target.result;
        localStorage.setItem('dreamos_bound_user', JSON.stringify(user));
        document.getElementById('avatar-preview').innerHTML = '<img src="'+ev.target.result+'" style="width:100%;height:100%;object-fit:cover;">';
      };
      reader.readAsDataURL(this.files[0]);
    }
  });

  window.handleLogout = function() {
    if (confirm('🚪 Yakin logout?')) {
      localStorage.removeItem('dreamos_bound_user');
      localStorage.removeItem('dreamos_session_active');
      window.parent.location.reload();
    }
  };

  // Init
  init();
})();
</script>
</body>
</html>
