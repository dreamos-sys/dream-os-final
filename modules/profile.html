<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile • Dream OS</title>
    <!-- NO EXTERNAL DEPENDENCIES -->
    <style>
        :root {
            --glass-bg: rgba(15, 23, 42, 0.5);
            --glass-border: rgba(0, 255, 157, 0.1);
            --neon: #00ff9d;
            --accent: #0ea5e9;
            --warning: #e11d48;
            --gold: #f59e0b;
            --purple: #8b5cf6;
        }
        * { box-sizing: border-box; }
        body { margin:0; background:#0a0e27; color:#e2e8f0; font-family:'Inter',sans-serif; min-height:100vh; }
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 1.2rem; margin-bottom: 1rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .back-btn {
            position: fixed; top: 1rem; left: 1rem; z-index: 1000;
            background: rgba(30,41,59,0.9); border: 1px solid var(--neon);
            color: var(--neon); padding: 0.5rem 1rem; border-radius: 10px;
            cursor: pointer; font-weight: 700; font-size: 0.75rem;
        }
        .btn {
            padding: 0.6rem 1rem; border: none; border-radius: 10px;
            font-weight: 700; font-size: 0.75rem; cursor: pointer; transition: all 0.2s ease;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-success { background: #10b981; color: #fff; }
        .btn-danger { background: var(--warning); color: #fff; }
        .btn-warning { background: var(--gold); color: #000; }
        .btn-purple { background: var(--purple); color: #fff; }
        .btn:hover { transform: translateY(-1px); opacity: 0.95; }
        .input-field, select {
            width: 100%; padding: 0.6rem; background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
            color: #e2e8f0; font-size: 0.78rem; outline: none;
        }
        .input-field:focus, select:focus { border-color: var(--neon); }
        
        .tab-nav {
            display: flex; gap: 0.3rem; margin-bottom: 1rem; flex-wrap: wrap;
            position: relative; z-index: 100;
        }
        .tab-btn {
            padding: 0.5rem 1rem; border-radius: 10px; font-size: 0.7rem; font-weight: 600;
            cursor: pointer; border: 1px solid rgba(255,255,255,0.15);
            background: rgba(30,41,59,0.7); color: #94a3b8;
            transition: all 0.2s ease; white-space: nowrap;
            pointer-events: auto;
        }
        .tab-btn:hover { background: rgba(30,41,59,0.9); border-color: var(--neon); color: #e2e8f0; }
        .tab-btn.active { background: var(--neon); color: #000; border-color: var(--neon); box-shadow: 0 0 15px rgba(0,255,157,0.4); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .avatar-preview {
            width: 70px; height: 70px; border-radius: 50%;
            background: rgba(30,41,59,0.8); border: 2px solid rgba(0,255,157,0.3);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; overflow: hidden;
        }
        .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
        .stat-card {
            background: rgba(0,0,0,0.3); padding: 0.8rem; border-radius: 12px;
            text-align: center; border: 1px solid rgba(255,255,255,0.05);
        }
        .stat-value { font-size: 1.4rem; font-weight: 800; color: var(--neon); }
        .stat-label { font-size: 0.6rem; color: #94a3b8; margin-top: 0.2rem; }
        table { width:100%; border-collapse:collapse; font-size:0.7rem; }
        th { background: rgba(0,0,0,0.3); color: #94a3b8; padding: 0.4rem; text-align: left; }
        td { padding: 0.35rem 0.4rem; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .badge {
            padding: 0.15rem 0.5rem; border-radius: 10px; font-size: 0.6rem; font-weight: 600;
        }
        .badge-success { background: rgba(16,185,129,0.2); color: #10b981; }
        .section-title {
            font-size: 0.85rem; font-weight: 700; margin: 0 0 0.8rem;
            display: flex; align-items: center; gap: 0.4rem;
            border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.5rem;
        }
    </style>
</head>
<body>

<button class="back-btn" onclick="window.parent.goHome()">← KEMBALI</button>

<div style="max-width:650px; margin:0 auto; padding:4rem 1.2rem 5rem;">

    <!-- Profile Header -->
    <div class="glass" style="display:flex; align-items:center; gap:1rem;">
        <div class="avatar-preview" id="avatar-preview">👤</div>
        <div style="flex:1;">
            <h2 style="color:var(--neon); margin:0; font-size:1rem;" id="display-name">Loading...</h2>
            <div style="font-size:0.7rem; color:#94a3b8;" id="display-role">-</div>
            <div style="font-size:0.6rem; color:#64748b; margin-top:0.3rem;" id="display-email">-</div>
            <input type="file" id="avatar-input" accept="image/*" style="display:none;">
            <button class="btn btn-primary" onclick="document.getElementById('avatar-input').click()" style="font-size:0.65rem; padding:0.3rem 0.7rem; margin-top:0.4rem;">📷 Upload Foto</button>
        </div>
    </div>

    <!-- TABS -->
    <div class="tab-nav">
        <button class="tab-btn active" data-tab="overview" onclick="switchTab('overview', this)">📊 Overview</button>
        <button class="tab-btn" data-tab="edit" onclick="switchTab('edit', this)">✏️ Edit</button>
        <button class="tab-btn" data-tab="security" onclick="switchTab('security', this)">🔒 Security</button>
        <button class="tab-btn" data-tab="users" onclick="switchTab('users', this)">👥 Users</button>
        <button class="tab-btn" data-tab="settings" onclick="switchTab('settings', this)">⚙️ Settings</button>
    </div>

    <!-- TAB CONTENTS (sama seperti sebelumnya) -->
    <div id="tab-overview" class="tab-content active">
        <div class="glass">
            <div class="section-title" style="color:var(--accent);">📊 Statistik Akun</div>
            <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:0.6rem;">
                <div class="stat-card"><div class="stat-value" id="stat-logins">0</div><div class="stat-label">Total Logins</div></div>
                <div class="stat-card"><div class="stat-value" id="stat-days">0</div><div class="stat-label">Hari Aktif</div></div>
                <div class="stat-card"><div class="stat-value" id="stat-tasks">0</div><div class="stat-label">Tasks</div></div>
                <div class="stat-card"><div class="stat-value" id="stat-score">0</div><div class="stat-label">Score</div></div>
            </div>
        </div>
    </div>

    <div id="tab-edit" class="tab-content">
        <div class="glass">
            <div class="section-title" style="color:var(--neon);">✏️ Edit Profile</div>
            <input class="input-field" id="edit-nama" placeholder="Nama" style="margin-bottom:0.5rem;">
            <input class="input-field" id="edit-email" type="email" readonly style="opacity:0.5; margin-bottom:0.5rem;">
            <input class="input-field" id="edit-phone" type="tel" placeholder="Telepon" style="margin-bottom:0.5rem;">
            <input class="input-field" id="edit-department" placeholder="Department" style="margin-bottom:0.5rem;">
            <button class="btn btn-success" onclick="saveProfile()" style="width:100%;">💾 Simpan</button>
        </div>
    </div>

    <div id="tab-security" class="tab-content">
        <div class="glass">
            <div class="section-title" style="color:var(--warning);">🔐 Ganti Password</div>
            <input class="input-field" id="old-pass" type="password" placeholder="Password lama" style="margin-bottom:0.5rem;">
            <input class="input-field" id="new-pass" type="password" placeholder="Password baru" style="margin-bottom:0.5rem;">
            <input class="input-field" id="confirm-pass" type="password" placeholder="Konfirmasi" style="margin-bottom:0.5rem;">
            <button class="btn btn-warning" onclick="changePassword()" style="width:100%;">🔑 Ganti Password</button>
        </div>
        <div class="glass">
            <div class="section-title" style="color:var(--gold);">🛡️ Device DNA</div>
            <p style="font-size:0.75rem;"><strong>DNA:</strong> <span id="dna-hash" style="font-family:monospace; color:#f59e0b;">Menghitung...</span></p>
        </div>
    </div>

    <div id="tab-users" class="tab-content">
        <div class="glass">
            <div class="section-title" style="color:var(--purple);">👥 Daftar Pengguna</div>
            <div id="user-list" style="max-height:350px; overflow-y:auto;"></div>
            <button class="btn btn-success" onclick="showRegisterForm()" style="width:100%; margin-top:0.8rem;">➕ Daftar Pengguna Baru</button>
        </div>
        <div id="register-panel" class="glass" style="display:none; border-color: var(--neon);">
            <div class="section-title" style="color:var(--neon);">📝 Pendaftaran</div>
            <input class="input-field" id="reg-nama" placeholder="Nama Lengkap" style="margin-bottom:0.4rem;">
            <input class="input-field" id="reg-email" placeholder="Email" type="email" style="margin-bottom:0.4rem;">
            <select class="input-field" id="reg-role" style="margin-bottom:0.4rem;">
                <option value="staff">Staff</option><option value="security">Security</option>
                <option value="janitor">Janitor</option><option value="maintenance">Maintenance</option>
                <option value="koord">Koordinator</option><option value="kabag">Kabag</option>
            </select>
            <input class="input-field" type="password" id="reg-pass" placeholder="Password" style="margin-bottom:0.4rem;">
            <input class="input-field" type="password" id="reg-confirm" placeholder="Konfirmasi Password">
            <div style="display:flex; gap:0.5rem; margin-top:0.8rem;">
                <button class="btn btn-primary" onclick="registerUser()">✅ Daftar</button>
                <button class="btn btn-danger" onclick="hideRegisterForm()">❌ Batal</button>
            </div>
            <p id="reg-msg" style="font-size:0.7rem; margin-top:0.5rem;"></p>
        </div>
    </div>

    <div id="tab-settings" class="tab-content">
        <div class="glass">
            <div class="section-title" style="color:var(--accent);">🔔 Notifikasi</div>
            <label style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.4rem; font-size:0.75rem;">
                <input type="checkbox" id="notif-email" checked style="accent-color:var(--neon);"> Email
            </label>
            <button class="btn btn-primary" onclick="saveNotifications()" style="width:100%; margin-top:0.5rem;">💾 Simpan</button>
        </div>
    </div>

    <button class="btn btn-danger" onclick="handleLogout()" style="width:100%; margin-top:1rem;">🚪 Logout</button>

</div>

<script>
// ========== 100% STANDALONE - NO DEPENDENCIES ==========
(function() {
  // Built-in helpers
  function sanitize(str) { if(!str)return ''; var d=document.createElement('div'); d.textContent=str; return d.innerHTML; }
  function getUser() { try{return JSON.parse(localStorage.getItem('dreamos_bound_user')||'null');}catch(e){return null;} }
  async function getDNA() {
    try{var c=document.createElement('canvas');var x=c.getContext('2d');x.fillStyle='#f60';x.fillRect(125,1,62,20);var m=[navigator.hardwareConcurrency||0,screen.colorDepth,c.toDataURL()].join('|');var h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(m));return Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,'0');}).join('').substring(0,32);}catch(e){return'UNKNOWN';}
  }
  async function hashPW(pw) { var e=new TextEncoder(); var h=await crypto.subtle.digest('SHA-256',e.encode(pw+'dreamos_salt_2026')); return Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,'0');}).join(''); }
  
  var user = getUser();
  if(!user) { document.body.innerHTML='<div style="text-align:center;padding:4rem;color:#ef4444;"><h2>🔒 Silakan login.</h2></div>'; return; }

  // Init
  document.getElementById('display-name').textContent = user.nama || 'User';
  document.getElementById('display-role').textContent = (user.role||'staff').toUpperCase();
  document.getElementById('display-email').textContent = user.email || '-';
  if(user.avatar) document.getElementById('avatar-preview').innerHTML='<img src="'+user.avatar+'" style="width:100%;height:100%;object-fit:cover;">';
  
  getDNA().then(function(d){ document.getElementById('dna-hash').textContent=d; });
  document.getElementById('edit-nama').value=user.nama||'';
  document.getElementById('edit-email').value=user.email||'';
  document.getElementById('edit-phone').value=user.phone||'';
  document.getElementById('edit-department').value=user.department||'';
  
  renderUserList();

  // Tab switching
  window.switchTab = function(name, btn) {
    document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
    document.querySelectorAll('.tab-content').forEach(function(c){c.classList.remove('active');});
    if(btn) btn.classList.add('active');
    var t=document.getElementById('tab-'+name);
    if(t) t.classList.add('active');
  };

  function renderUserList() {
    var users=JSON.parse(localStorage.getItem('dreamos_users_db')||'[]');
    var el=document.getElementById('user-list');
    if(!el)return;
    el.innerHTML=users.length?'<table><tr><th>Nama</th><th>Email</th><th>Role</th></tr>'+users.map(function(u){
      return '<tr><td>'+sanitize(u.nama)+'</td><td style="font-size:0.65rem;">'+sanitize(u.email)+'</td><td>'+sanitize(u.role)+'</td></tr>';
    }).join('')+'</table>':'<p style="color:#94a3b8;text-align:center;">Belum ada pengguna.</p>';
  }

  window.saveProfile = function() {
    user.nama=document.getElementById('edit-nama').value;
    user.phone=document.getElementById('edit-phone').value;
    user.department=document.getElementById('edit-department').value;
    localStorage.setItem('dreamos_bound_user',JSON.stringify(user));
    document.getElementById('display-name').textContent=user.nama;
    alert('✅ Disimpan!');
  };

  window.changePassword = async function() {
    var o=document.getElementById('old-pass').value;
    var n=document.getElementById('new-pass').value;
    var c=document.getElementById('confirm-pass').value;
    if(!o||!n||!c)return alert('⚠️ Isi semua!');
    if(n.length<6)return alert('⚠️ Min 6 karakter!');
    if(n!==c)return alert('⚠️ Tidak cocok!');
    var oh=await hashPW(o);
    var users=JSON.parse(localStorage.getItem('dreamos_users_db')||'[]');
    var cu=users.find(function(u){return u.email===user.email;});
    if(!cu||cu.password_hash!==oh)return alert('⚠️ Password lama salah!');
    cu.password_hash=await hashPW(n);
    localStorage.setItem('dreamos_users_db',JSON.stringify(users));
    alert('✅ Diganti!');
  };

  window.showRegisterForm = function() { document.getElementById('register-panel').style.display='block'; };
  window.hideRegisterForm = function() { document.getElementById('register-panel').style.display='none'; };

  window.registerUser = async function() {
    var n=document.getElementById('reg-nama').value.trim();
    var e=document.getElementById('reg-email').value.trim();
    var r=document.getElementById('reg-role').value;
    var p=document.getElementById('reg-pass').value;
    var c=document.getElementById('reg-confirm').value;
    if(!n||!e||!p)return alert('⚠️ Isi semua!');
    if(p.length<6)return alert('⚠️ Min 6 karakter!');
    if(p!==c)return alert('⚠️ Tidak cocok!');
    var users=JSON.parse(localStorage.getItem('dreamos_users_db')||'[]');
    if(users.find(function(u){return u.email===e;}))return alert('⚠️ Email sudah ada!');
    users.push({nama:n,email:e,role:r,password_hash:await hashPW(p),device_dna:'',created_at:new Date().toISOString()});
    localStorage.setItem('dreamos_users_db',JSON.stringify(users));
    hideRegisterForm(); renderUserList();
    alert('✅ '+n+' didaftarkan!');
  };

  window.saveNotifications = function() { alert('✅ Disimpan!'); };
  
  document.getElementById('avatar-input').addEventListener('change',function(){
    if(this.files[0]){var r=new FileReader();r.onload=function(ev){user.avatar=ev.target.result;localStorage.setItem('dreamos_bound_user',JSON.stringify(user));document.getElementById('avatar-preview').innerHTML='<img src="'+ev.target.result+'" style="width:100%;height:100%;object-fit:cover;">';};r.readAsDataURL(this.files[0]);}
  });

  window.handleLogout = function() {
    if(confirm('🚪 Logout?')){localStorage.removeItem('dreamos_bound_user');localStorage.removeItem('dreamos_session_active');window.parent.location.reload();}
  };
})();
</script>
</body>
</html>
