
<style>
        :root { --glass-bg: rgba(15, 23, 42, 0.5); --glass-border: rgba(0, 255, 157, 0.1); --neon: #00ff9d; --accent: #0ea5e9; --warning: #e11d48; --gold: #f59e0b; --purple: #8b5cf6; }
        * { box-sizing: border-box; }
        body { margin:0; background:#0a0e27; color:#e2e8f0; font-family:'Inter',sans-serif; min-height:100vh; }
        .glass { background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 1.2rem; margin-bottom: 1rem; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        .back-btn { position: fixed; bottom: calc(2rem + env(safe-area-inset-bottom)); left: 1rem; z-index: 1000; background: rgba(30,41,59,0.9); border: 1px solid var(--neon); color: var(--neon); padding: 0.4rem 0.8rem; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.7rem; }
        .btn { padding: 0.6rem 1rem; border: none; border-radius: 10px; font-weight: 700; font-size: 0.75rem; cursor: pointer; transition: all 0.2s ease; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-success { background: #10b981; color: #fff; }
        .btn-danger { background: var(--warning); color: #fff; }
        .btn-warning { background: var(--gold); color: #000; }
        .btn-purple { background: var(--purple); color: #fff; }
        .btn:hover { transform: translateY(-1px); opacity: 0.95; }
        .input-field, select { width: 100%; padding: 0.6rem; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #e2e8f0; font-size: 0.78rem; outline: none; }
        .input-field:focus, select:focus { border-color: var(--neon); }
        .tab-nav { display: flex; gap: 0.3rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .tab-btn { padding: 0.5rem 1rem; border-radius: 10px; font-size: 0.7rem; font-weight: 600; cursor: pointer; border: 1px solid rgba(255,255,255,0.15); background: rgba(30,41,59,0.7); color: #94a3b8; transition: all 0.2s ease; white-space: nowrap; }
        .tab-btn:hover { background: rgba(30,41,59,0.9); border-color: var(--neon); color: #e2e8f0; }
        .tab-btn.active { background: var(--neon); color: #000; border-color: var(--neon); box-shadow: 0 0 15px rgba(0,255,157,0.4); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .avatar-preview { width: 70px; height: 70px; border-radius: 50%; background: rgba(30,41,59,0.8); border: 2px solid rgba(0,255,157,0.3); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; overflow: hidden; }
        .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
        table { width:100%; border-collapse:collapse; font-size:0.7rem; }
        th { background: rgba(0,0,0,0.3); color: #94a3b8; padding: 0.4rem; text-align: left; }
        td { padding: 0.35rem 0.4rem; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .section-title { font-size: 0.85rem; font-weight: 700; margin: 0 0 0.8rem; display: flex; align-items: center; gap: 0.4rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.5rem; }
    </style>
<button class="back-btn" onclick="window.goHome()">← HOME</button>

<div style="max-width:650px; margin:0 auto; padding:4rem 1.2rem 5rem;">

    <!-- Profile Header -->
    <div class="glass" style="display:flex; align-items:center; gap:1rem;">
        <div class="avatar-preview" id="avatar-preview">👤</div>
        <div style="flex:1;">
            <h2 style="color:var(--neon); margin:0; font-size:1rem;" id="display-name">Loading...</h2>
            <div style="font-size:0.7rem; color:#94a3b8;" id="display-role">-</div>
            <div style="font-size:0.6rem; color:#64748b; margin-top:0.3rem;" id="display-email">-</div>
            <input type="file" id="avatar-input" accept="image/*" style="display:none;">
            <button class="btn btn-primary" onclick="document.getElementById('avatar-input').click()" style="font-size:0.65rem; padding:0.3rem 0.7rem; margin-top:0.4rem;">📷 Upload</button>
        </div>
    </div>

    <!-- TABS -->
    <div class="tab-nav">
        <button class="tab-btn active" data-tab="overview" onclick="switchTab('overview', this)">📊 Overview</button>
        <button class="tab-btn" data-tab="edit" onclick="switchTab('edit', this)">✏️ Edit</button>
        <button class="tab-btn" data-tab="security" onclick="switchTab('security', this)">🔒 Security</button>
        <button class="tab-btn" data-tab="users" onclick="switchTab('users', this)" style="display:none;">👥 Users</button>
        <button class="tab-btn" data-tab="settings" onclick="switchTab('settings', this)">⚙️ Settings</button>
    </div>

    <!-- TAB: Overview -->
    <div id="tab-overview" class="tab-content active">
        <div class="glass">
            <div class="section-title" style="color:var(--accent);">📊 Informasi Akun</div>
            <table>
                <tr><td style="color:#94a3b8;">Nama</td><td id="info-nama">-</td></tr>
                <tr><td style="color:#94a3b8;">Email</td><td id="info-email">-</td></tr>
                <tr><td style="color:#94a3b8;">Role</td><td id="info-role">-</td></tr>
                <tr><td style="color:#94a3b8;">Device DNA</td><td id="info-dna" style="font-family:monospace; font-size:0.6rem;">-</td></tr>
            </table>
        </div>
    </div>

    <!-- TAB: Edit -->
    <div id="tab-edit" class="tab-content">
        <div class="glass">
            <div class="section-title" style="color:var(--neon);">✏️ Edit Profile</div>
            <input class="input-field" id="edit-nama" placeholder="Nama" style="margin-bottom:0.5rem;">
            <input class="input-field" id="edit-email" type="email" readonly style="opacity:0.5; margin-bottom:0.5rem;">
            <input class="input-field" id="edit-phone" type="tel" placeholder="Telepon" style="margin-bottom:0.5rem;">
            <input class="input-field" id="edit-department" placeholder="Department" style="margin-bottom:0.5rem;">
            <button class="btn btn-success" onclick="saveProfile()" style="width:100%;">💾 Simpan & Update Dashboard</button>
        </div>
    </div>

    <!-- TAB: Security -->
    <div id="tab-security" class="tab-content">
        <div class="glass">
            <div class="section-title" style="color:var(--warning);">🔐 Ganti Password</div>
            <input class="input-field" id="old-pass" type="password" placeholder="Password lama" style="margin-bottom:0.5rem;">
            <input class="input-field" id="new-pass" type="password" placeholder="Password baru" style="margin-bottom:0.5rem;">
            <input class="input-field" id="confirm-pass" type="password" placeholder="Konfirmasi" style="margin-bottom:0.5rem;">
            <button class="btn btn-warning" onclick="changePassword()" style="width:100%;">🔑 Ganti Password</button>
        </div>
    </div>

    <!-- TAB: Users (Disabled: Centralized in Command Center for Zero Fraud) -->
    <div id="tab-users" class="tab-content" style="display:none;">
        <div class="glass">
            <div class="section-title" style="color:var(--purple);">👥 Daftar Pengguna</div>
            <div id="user-list" style="max-height:300px; overflow-y:auto;"></div>
            <button class="btn btn-success" onclick="showRegisterForm()" style="width:100%; margin-top:0.8rem;">➕ Daftar Pengguna Baru</button>
        </div>
        <div id="register-panel" class="glass" style="display:none; border-color: var(--neon);">
            <div class="section-title" style="color:var(--neon);">📝 Pendaftaran Pengguna Baru</div>
            <input class="input-field" id="reg-nama" placeholder="Nama Lengkap" style="margin-bottom:0.4rem;">
            <input class="input-field" id="reg-email" placeholder="Email" type="email" style="margin-bottom:0.4rem;">
            <select class="input-field" id="reg-role" style="margin-bottom:0.4rem;">
                <option value="guru">Guru</option>
                <option value="security">Security</option>
                <option value="janitor">Janitor</option>
                <option value="maintenance">Maintenance</option>
                <option value="staff">Staff</option>
            </select>
            <input class="input-field" type="password" id="reg-pass" placeholder="Password (min 6 karakter)" style="margin-bottom:0.4rem;">
            <input class="input-field" type="password" id="reg-confirm" placeholder="Konfirmasi Password">
            <div style="display:flex; gap:0.5rem; margin-top:0.8rem;">
                <button class="btn btn-primary" onclick="registerUser()">✅ Daftarkan</button>
                <button class="btn btn-danger" onclick="hideRegisterForm()">❌ Batal</button>
            </div>
            <p id="reg-msg" style="font-size:0.7rem; margin-top:0.5rem;"></p>
        </div>
    </div>

    <!-- TAB: Settings -->
    <div id="tab-settings" class="tab-content">
        <div class="glass">
            <div class="section-title" style="color:var(--accent);">🔔 Notifikasi</div>
            <label style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.4rem; font-size:0.75rem;">
                <input type="checkbox" id="notif-email" checked style="accent-color:var(--neon);"> Email
            </label>
            <button class="btn btn-primary" onclick="saveNotifications()" style="width:100%; margin-top:0.5rem;">💾 Simpan</button>
        </div>
    </div>

    <button class="btn btn-danger" onclick="handleLogout()" style="width:100%; margin-top:1rem;">🚪 Logout</button>

</div>

<script>
// ========== PROFILE MODULE (ENTERPRISE) ==========
(function() {
  'use strict';

  function sanitize(str) { if(!str) return ''; var d=document.createElement('div'); d.textContent=str; return d.innerHTML; }
  function getUser() { try { return JSON.parse(localStorage.getItem('dreamos_bound_user')||'null'); } catch(e) { return null; } }
  async function getDNA() { try { var c=document.createElement('canvas'); var x=c.getContext('2d'); x.fillStyle='#f60'; x.fillRect(125,1,62,20); var h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode([navigator.hardwareConcurrency||0,screen.colorDepth,c.toDataURL()].join('|'))); return Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,'0');}).join('').substring(0,32); } catch(e) { return 'UNKNOWN'; } }

  
  // SEC Global (dari index.html atau fallback)
  var SEC = window.SEC || {
    sanitize: function(s) { if(!s) return ''; var d=document.createElement('div'); d.textContent=s; return d.innerHTML; },
    hashPassword: async function(p) { var e=new TextEncoder(); var h=await crypto.subtle.digest('SHA-256',e.encode(p+'dreamos_salt_2026')); return Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,'0');}).join(''); }
  };
  var user = getUser();
  // Cek Supabase client
  if (window.supabaseClient) {
    console.log('✅ Supabase client tersedia di Profile Module');
  } else {
    console.warn('⚠️ Supabase client belum siap, retry dalam 2 detik...');
    setTimeout(function() {
      if (!window.supabaseClient) console.error('❌ Supabase tetap tidak tersedia setelah retry');
    }, 2000);
  }
  if (!user) {
    document.body.innerHTML = '<div style="text-align:center;padding:4rem;color:#ef4444;"><h2>🔒 Silakan login.</h2></div>';
    return;
  }

  // Init display
  document.getElementById('display-name').textContent = user.nama || 'User';
  document.getElementById('display-role').textContent = (user.role||'staff').toUpperCase();
  document.getElementById('display-email').textContent = user.email || '-';
  document.getElementById('edit-nama').value = user.nama || '';
  document.getElementById('edit-email').value = user.email || '';
  document.getElementById('edit-phone').value = user.phone || '';
  document.getElementById('edit-department').value = user.department || '';
  if (user.avatar) document.getElementById('avatar-preview').innerHTML = '<img src="'+user.avatar+'" style="width:100%;height:100%;object-fit:cover;">';

  document.getElementById('info-nama').textContent = user.nama || '-';
  document.getElementById('info-email').textContent = user.email || '-';
  document.getElementById('info-role').textContent = (user.role||'staff').toUpperCase();
  getDNA().then(function(d) { document.getElementById('info-dna').textContent = d; });

  renderUserList();
  
  // 🔐 Enterprise Audit: catat akses modul profile
  if (window.BankAudit) {
    BankAudit.log('ACCESS_PROFILE_MODULE', { role: user.role });
  }

  function notifyParent(action, detail) {
    // Gunakan BankAudit untuk enterprise-grade audit trail
    if (window.BankAudit) {
      BankAudit.log(action, detail);
    }
    // Fallback: tetap simpan ke localStorage
    try {
      var logs = JSON.parse(localStorage.getItem('dreamos_audit_logs')||'[]');
      logs.unshift({ time: new Date().toISOString(), user: user.email, role: user.role, action: action, details: detail });
      if (logs.length > 100) logs.pop();
      localStorage.setItem('dreamos_audit_logs', JSON.stringify(logs));
    } catch(e) {}
    // Update dashboard parent jika ada
    if (window.renderDashboard) {
      setTimeout(function() { window.renderDashboard(); }, 500);
    }
  }

  window.switchTab = function(name, btn) {
    document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
    document.querySelectorAll('.tab-content').forEach(function(c){c.classList.remove('active');});
    if(btn) btn.classList.add('active');
    var t = document.getElementById('tab-'+name);
    if(t) t.classList.add('active');
    if (name === 'users') renderUserList();
  };

  function renderUserList() {
    var users = JSON.parse(localStorage.getItem('dreamos_users_db')||'[]');
    var el = document.getElementById('user-list');
    if (!el) return;
    el.innerHTML = users.length ? '<table><tr><th>Nama</th><th>Email</th><th>Role</th></tr>'+users.map(function(u){ return '<tr><td>'+sanitize(u.nama)+'</td><td style="font-size:0.65rem;">'+sanitize(u.email)+'</td><td>'+sanitize(u.role)+'</td></tr>'; }).join('')+'</table>' : '<p style="color:#94a3b8;text-align:center;">Belum ada pengguna.</p>';
  }
  
  // 🔄 Real-Time Sync untuk user list (jika SyncEngine tersedia)
  if (window.SyncEngine && window.supabaseClient) {
    window.SyncEngine.subscribe('users', function() {
      console.log('📡 User list updated via SyncEngine');
      renderUserList();
    });
  }

  // ========== SAVE PROFILE (SUPABASE + AVATAR) ==========
  window.saveProfile = async function() {
    var nama = document.getElementById('edit-nama').value;
    var phone = document.getElementById('edit-phone').value;
    var department = document.getElementById('edit-department').value;
    
    if (!user) return alert('❌ Sesi tidak valid.');
    
    try {
        if (!window.supabaseClient) {
            alert('⚠️ Koneksi database terputus. Silakan refresh halaman.');
            return;
        }
        var { error } = await window.supabaseClient
            .from('users')
            .upsert({
                id: user.id,
                email: user.email,
                nama: nama,
                role: user.role,
                phone: phone,
                department: department,
                avatar_url: user.avatar || null
            });
            
        if (error) throw error;
        
        user.nama = nama;
        user.phone = phone;
        user.department = department;
        localStorage.setItem('dreamos_bound_user', JSON.stringify(user));
        
        document.getElementById('display-name').textContent = nama;
        document.getElementById('info-nama').textContent = nama;
        
        alert('✅ Profile disimpan ke Cloud & Lokal!');
        
        window.supabaseClient.from('audit_logs').insert({
            user_id: user.id,
            action: 'UPDATE_PROFILE',
            details: 'Profile updated'
        }).then(function(){});
        
    } catch (e) {
        alert('⚠️ Gagal simpan ke cloud: ' + e.message);
    }
  };

  // ========== UPLOAD AVATAR ==========
  document.getElementById('avatar-input').addEventListener('change', async function(){
    if (this.files[0]) {
      var file = this.files[0];
      if (!user) return alert('❌ Sesi tidak valid.');
      
      var filePath = user.id + '/' + Date.now() + '_' + file.name;
      var { data, error } = await window.supabaseClient.storage
        .from('avatars')
        .upload(filePath, file, { upsert: true });
        
      if (error) {
        alert('⚠️ Gagal upload: ' + error.message);
        return;
      }
      
      var { data: publicData } = window.supabaseClient.storage
        .from('avatars')
        .getPublicUrl(filePath);
        
      if (publicData && publicData.publicUrl) {
        user.avatar = publicData.publicUrl;
        localStorage.setItem('dreamos_bound_user', JSON.stringify(user));
        document.getElementById('avatar-preview').innerHTML = '<img src="'+publicData.publicUrl+'" style="width:100%;height:100%;object-fit:cover;">';
        notifyParent('UPDATE_AVATAR', 'Avatar updated');
      }
    }
  });

  // ========== OTHER FUNCTIONS ==========
  window.changePassword = async function() {
    var oldPass = document.getElementById('old-pass').value;
    var newPass = document.getElementById('new-pass').value;
    var confirmPass = document.getElementById('confirm-pass').value;
    
    if (!oldPass || !newPass || !confirmPass) return alert('⚠️ Isi semua field!');
    if (newPass.length < 6) return alert('⚠️ Minimal 6 karakter!');
    if (newPass !== confirmPass) return alert('⚠️ Password tidak cocok!');

    try {
      // 1. Verifikasi password lama langsung ke Supabase Auth
      const { error: signInError } = await window.supabaseClient.auth.signInWithPassword({
        email: user.email,
        password: oldPass
      });
      if (signInError) throw new Error('Password lama salah!');

      // 2. Update password baru di Supabase Auth (Bukan cuma localStorage)
      const { error: updateError } = await window.supabaseClient.auth.updateUser({
        password: newPass
      });
      if (updateError) throw updateError;

      notifyParent('CHANGE_PASSWORD_SUCCESS', 'Password updated via Supabase Auth');
      alert('✅ Password berhasil diubah! Silakan login ulang.');
      
      // 3. Logout paksa agar sesi baru menggunakan password baru (Zero Session Fraud)
      await window.supabaseClient.auth.signOut();
      localStorage.removeItem('dreamos_bound_user');
      localStorage.removeItem('dreamos_session_active');
      window.location.href = 'index.html';

    } catch (e) {
      alert('❌ Gagal: ' + e.message);
    }
  };

  window.showRegisterForm = function() { document.getElementById('register-panel').style.display='block'; };
  window.hideRegisterForm = function() { document.getElementById('register-panel').style.display='none'; };

  window.registerUser = async function() {
    var n=document.getElementById('reg-nama').value.trim();
    var e=document.getElementById('reg-email').value.trim();
    var r=document.getElementById('reg-role').value;
    var p=document.getElementById('reg-pass').value;
    var c=document.getElementById('reg-confirm').value;
    var msg = document.getElementById('reg-msg');
    
    if (!n||!e||!p) { msg.textContent = '⚠️ Semua field wajib diisi!'; msg.style.color = '#ef4444'; return; }
    if (p.length<6) { msg.textContent = '⚠️ Password minimal 6 karakter!'; msg.style.color = '#ef4444'; return; }
    if (p!==c) { msg.textContent = '⚠️ Password tidak cocok!'; msg.style.color = '#ef4444'; return; }

    var users = JSON.parse(localStorage.getItem('dreamos_users_db')||'[]');
    if (users.find(function(u){return u.email===e;})) { msg.textContent = '⚠️ Email sudah terdaftar!'; msg.style.color = '#ef4444'; return; }

    try {
      users.push({ nama:n, email:e, role:r, password_hash:await SEC.hashPassword(p), device_dna:'', created_at:new Date().toISOString() });
      localStorage.setItem('dreamos_users_db', JSON.stringify(users));
    } catch(ex) {
      msg.textContent = '⚠️ Penyimpanan penuh! Minta Admin membersihkan cache.'; msg.style.color = '#ef4444'; return;
    }
    
    hideRegisterForm();
    renderUserList();
    notifyParent('REGISTER_USER', n+' ('+e+')');
    msg.textContent = ''; 
    alert('✅ '+n+' berhasil didaftarkan!');
  };

  window.saveNotifications = function() { alert('✅ Disimpan!'); };

  window.handleLogout = function() {
    if (confirm('🚪 Yakin logout? Session akan dihapus dan harus login ulang.')) {
      localStorage.removeItem('dreamos_bound_user');
      localStorage.removeItem('dreamos_session_active');
      window.location.reload();
    }
  };
})();
</script>
