<style>
  :root { --neon: #00ff9d; --accent: #0ea5e9; --warning: #e11d48; --gold: #f59e0b; --green: #22c55e; }
  * { box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #0a0e27; color: #e2e8f0; min-height: 100vh; margin: 0; }
  .glass { background: rgba(15,23,42,0.8); backdrop-filter: blur(20px); border: 1px solid rgba(34,197,94,0.15); border-radius: 16px; padding: 1rem; margin-bottom: 0.8rem; }
  .back-btn { position: fixed; top: 0.8rem; left: 0.8rem; z-index: 1000; background: rgba(30,41,59,0.9); border: 1px solid var(--green); color: var(--green); padding: 0.4rem 0.8rem; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.7rem; }
  .btn { padding: 0.5rem 0.9rem; border: none; border-radius: 8px; font-weight: 700; font-size: 0.7rem; cursor: pointer; transition: 0.2s; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-success { background: #10b981; color: #fff; }
  .btn-danger { background: var(--warning); color: #fff; }
  .btn-warning { background: var(--gold); color: #000; }
  .btn:hover { transform: translateY(-1px); opacity: 0.95; }
  .input-field { width: 100%; padding: 0.6rem; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #e2e8f0; font-size: 0.8rem; outline: none; }
  .input-field:focus { border-color: var(--green); }
  .section-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 0.8rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.5rem; }
  .shift-btn { padding: 0.5rem 0.8rem; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.75rem; background: #1e293b; color: #e2e8f0; transition: 0.3s; }
  .shift-btn.active { background: var(--green); color: #000; border-color: var(--green); }
  
  /* ✅ FIX KONTRAS CHECKLIST AGAR SANGAT TERLIHAT */
  .check-label { 
    display: flex; 
    align-items: center; 
    gap: 0.6rem; 
    padding: 0.6rem; 
    background: rgba(15, 23, 42, 0.6); 
    border: 1px solid rgba(255,255,255,0.15); 
    border-radius: 8px; 
    cursor: pointer; 
    font-size: 0.8rem; 
    font-weight: 500;
    color: #e2e8f0;
    transition: all 0.2s; 
    user-select: none; 
  }
  .check-label:hover { 
    background: rgba(30, 41, 59, 0.8); 
    border-color: rgba(34,197,94,0.5); 
  }
  .check-label.checked { 
    background: rgba(34,197,94,0.15); 
    border-color: #22c55e; 
    color: #22c55e; 
  }
  .check-label.weekly.checked { 
    background: rgba(245,158,11,0.15); 
    border-color: #f59e0b; 
    color: #f59e0b;
  }
  .check-label input[type="checkbox"] { 
    cursor: pointer; 
    width: 20px; 
    height: 20px; 
    accent-color: #22c55e; 
    border: 2px solid #94a3b8;
    border-radius: 4px;
    flex-shrink: 0; 
  }
  .check-label span { flex: 1; }

  .mini-stat { background: rgba(15,23,42,0.6); border: 1px solid rgba(255,255,255,0.08); border-radius: 0.5rem; padding: 0.5rem; text-align: center; }
  .mini-stat-val { font-size: 1.2rem; font-weight: 700; color: #e2e8f0; }
  .mini-stat-label { font-size: 0.75rem; color: #94a3b8; }
</style>

<button class="back-btn" onclick="window.goHome()">← HOME</button>

<div style="max-width: 900px; margin: 0 auto; padding: 3.5rem 0.8rem 5rem;">
  
  <div class="glass" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
    <div>
      <h2 style="color: var(--green); margin: 0; font-size: 1.1rem;">🌿 Janitor Outdoor</h2>
      <p style="color: #64748b; font-size: 0.62rem; margin: 0;">Ceklis Harian & Tugas Mingguan • ISO 14001/45001/9001</p>
    </div>
    <div style="display: flex; gap: 0.3rem; flex-wrap: wrap;">
      <button class="btn btn-warning" onclick="showHistory()">📜 Riwayat</button>
      <button class="btn btn-success" onclick="exportCSV()">📥 CSV</button>
      <button class="btn btn-primary" onclick="submitToCloud()">☁️ Submit</button>
      <button class="btn" style="background: #6366f1; color: #fff;" onclick="cetakLaporan()">🖨️ Cetak</button>
    </div>
  </div>

  <div class="glass">
    <div class="section-title" style="color: var(--accent);">👤 Petugas & Area</div>
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem;">
      <input type="text" id="jo-petugas" class="input-field" placeholder="Nama Petugas" oninput="saveMeta()">
      <input type="text" id="jo-area" class="input-field" placeholder="Area / Taman" oninput="saveMeta()">
      <input type="text" id="jo-zona" class="input-field" placeholder="Zona (Utara/Selatan/dll)" oninput="saveMeta()">
    </div>
  </div>

  <div class="glass" style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;">
    <input type="date" id="jo-date" class="input-field" style="flex: 1; min-width: 150px; width: auto;" onchange="changeDate()">
    <div style="display: flex; gap: 0.3rem;">
      <button class="shift-btn active" id="btn-pagi" onclick="setShift('pagi')">🌅 Pagi</button>
      <button class="shift-btn" id="btn-siang" onclick="setShift('siang')">☀️ Siang</button>
      <button class="shift-btn" id="btn-sore" onclick="setShift('sore')">🌇 Sore</button>
    </div>
    <button class="btn btn-danger" onclick="resetShift()" style="margin-left: auto;">Reset Shift</button>
  </div>

  <div class="glass" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; text-align: center;">
    <div class="mini-stat"><div class="mini-stat-val" id="stat-total">0</div><div class="mini-stat-label">Total Item</div></div>
    <div class="mini-stat"><div class="mini-stat-val" id="stat-checked">0</div><div class="mini-stat-label" style="color: #10b981;">Selesai</div></div>
    <div class="mini-stat"><div class="mini-stat-val" id="stat-percent">0%</div><div class="mini-stat-label" style="color: #f59e0b;">Progress</div></div>
  </div>

  <div id="jo-photo-container" style="margin-bottom: 0.75rem;"></div>

  <div class="glass" id="panel-daily">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
      <div style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;" onclick="toggleExpand('daily', event)">
        <h4 style="color: var(--green); margin: 0;">📋 Ceklis Harian</h4>
        <span style="font-size: 0.7rem; color: #94a3b8;" id="daily-count">0/0</span>
      </div>
      <button onclick="uploadPhoto('daily', event)" class="btn" style="background: rgba(59,130,246,0.2); color: #3b82f6; padding: 0.2rem 0.5rem; font-size: 0.7rem;" id="btn-photo-daily">📸 Foto</button>
    </div>
    <div id="jo-daily-list"></div>
  </div>

  <div class="glass" id="panel-weekly">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
      <div style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;" onclick="toggleExpand('weekly', event)">
        <h4 style="color: var(--gold); margin: 0;">🗓️ Tugas Mingguan</h4>
        <span style="font-size: 0.7rem; color: #94a3b8;" id="weekly-count">0/0</span>
      </div>
      <button onclick="uploadPhoto('weekly', event)" class="btn" style="background: rgba(59,130,246,0.2); color: #3b82f6; padding: 0.2rem 0.5rem; font-size: 0.7rem;" id="btn-photo-weekly">📸 Foto</button>
    </div>
    <div id="jo-weekly-list"></div>
  </div>
</div>

<div id="history-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 99999; overflow-y: auto; padding: 1rem;">
  <div style="max-width: 800px; margin: 0 auto; background: #0f172a; border: 1px solid var(--green); border-radius: 16px; padding: 1.5rem;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
      <h3 style="color: var(--green); margin: 0;">📜 Riwayat Janitor Outdoor</h3>
      <button onclick="closeHistory()" class="btn btn-danger">✕ Tutup</button>
    </div>
    <div id="history-content"></div>
  </div>
</div>

<script>
(function() {
  'use strict';

  const DAILY = [
    'Jalan Utama','Lorong dan Jalan Kecil','Parkir Motor / Mobil','Area Loby','Play Ground','Taman','Lapangan',
    'Area Masjid / Musholla','Kantin & Saung Outdoor','Tempat Sampah Outdoor','Pagar & Gerbang','Lampu Penerangan',
    'Selokan & Drainase','Parkir Sepeda','Kolam / Air Mancur','Keterangan Dll'
  ];
  
  const WEEKLY = [
    'Pangkas Rumput','Pangkas Dahan','Pupuk Tanaman','Bersihkan Kolam','Perbaiki Pagar','Semprot Hama (Pest Control)',
    'Cuci Area Parkir','Bersihkan Selokan','Cek Lampu Taman','Cek Peralatan (Sabit/Mesin)','Rapikan Tanaman Hias','Lainnya'
  ];

  let state = {
    date: new Date().toISOString().split('T')[0],
    shift: 'pagi',
    data: {},
    photoData: {},
    expanded: { daily: true, weekly: true }
  };

  function safeGet(key, fb) { try { return JSON.parse(localStorage.getItem(key) || fb); } catch(e) { return JSON.parse(fb); } }
  function safeSet(key, data) { localStorage.setItem(key, JSON.stringify(data)); }

  function loadData() {
    let all = safeGet('dreamos_janitor_outdoor', '{}');
    if (!all[state.date]) all[state.date] = { shifts: { pagi: {}, siang: {}, sore: {} }, weekly: {}, photos: {}, petugas: '', area: '', zona: '' };
    if (!all[state.date].shifts) all[state.date].shifts = { pagi: {}, siang: {}, sore: {} };
    if (!all[state.date].photos) all[state.date].photos = {};
    state.data = all;
    state.photoData = all[state.date].photos || {};
    document.getElementById('jo-petugas').value = all[state.date].petugas || '';
    document.getElementById('jo-area').value = all[state.date].area || '';
    document.getElementById('jo-zona').value = all[state.date].zona || '';
    document.getElementById('jo-date').value = state.date;
    updateShiftBtns();
    renderAll();
    updateStats();
  }

  window.saveMeta = function() {
    if (!state.data[state.date]) state.data[state.date] = { shifts: { pagi: {}, siang: {}, sore: {} }, weekly: {}, photos: {}, petugas: '', area: '', zona: '' };
    state.data[state.date].petugas = document.getElementById('jo-petugas').value;
    state.data[state.date].area = document.getElementById('jo-area').value;
    state.data[state.date].zona = document.getElementById('jo-zona').value;
    safeSet('dreamos_janitor_outdoor', state.data);
  };

  window.changeDate = function() {
    state.date = document.getElementById('jo-date').value;
    loadData();
  };

  window.setShift = function(sh) {
    state.shift = sh;
    updateShiftBtns();
    renderAll();
    updateStats();
  };

  function updateShiftBtns() {
    ['pagi', 'siang', 'sore'].forEach(s => document.getElementById('btn-' + s).classList.toggle('active', state.shift === s));
  }

  window.toggleItem = function(item, checkbox, event) {
    if (event) event.stopPropagation();
    if (!state.data[state.date].shifts[state.shift]) state.data[state.date].shifts[state.shift] = {};
    state.data[state.date].shifts[state.shift][item] = checkbox.checked;
    safeSet('dreamos_janitor_outdoor', state.data);
    checkbox.closest('.check-label').classList.toggle('checked', checkbox.checked);
    updateStats();
  };

  window.toggleWeekly = function(task, checkbox, event) {
    if (event) event.stopPropagation();
    if (!state.data[state.date].weekly) state.data[state.date].weekly = {};
    state.data[state.date].weekly[task] = checkbox.checked;
    safeSet('dreamos_janitor_outdoor', state.data);
    checkbox.closest('.check-label').classList.toggle('checked', checkbox.checked);
    updateStats();
  };

  window.toggleExpand = function(section, event) {
    if (event) event.stopPropagation();
    state.expanded[section] = !state.expanded[section];
    renderAll();
  };

  function updateStats() {
    let shiftData = (state.data[state.date] && state.data[state.date].shifts[state.shift]) || {};
    let weeklyData = (state.data[state.date] && state.data[state.date].weekly) || {};
    let dailyChecked = DAILY.filter(it => shiftData[it]).length;
    let weeklyChecked = WEEKLY.filter(t => weeklyData[t]).length;
    let total = DAILY.length + WEEKLY.length;
    let checked = dailyChecked + weeklyChecked;
    let pct = total > 0 ? Math.round((checked / total) * 100) : 0;
    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-checked').textContent = checked;
    document.getElementById('stat-percent').textContent = pct + '%';
    document.getElementById('daily-count').textContent = dailyChecked + '/' + DAILY.length;
    document.getElementById('weekly-count').textContent = weeklyChecked + '/' + WEEKLY.length;
  }

  window.uploadPhoto = function(section, event) {
    if (event) event.stopPropagation();
    let input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*'; input.capture = 'environment';
    input.onchange = function(e) {
      let file = e.target.files[0]; if (!file) return;
      let reader = new FileReader();
      reader.onload = function(ev) {
        let key = state.shift + '-' + section;
        state.data[state.date].photos[key] = ev.target.result;
        state.photoData = state.data[state.date].photos;
        safeSet('dreamos_janitor_outdoor', state.data);
        renderAll();
      };
      reader.readAsDataURL(file);
    };
    input.click();
  };

  window.resetShift = function() {
    if (!confirm('Reset checklist shift ' + state.shift + '?')) return;
    if (state.data[state.date] && state.data[state.date].shifts) {
      state.data[state.date].shifts[state.shift] = {};
      safeSet('dreamos_janitor_outdoor', state.data);
      renderAll();
      updateStats();
    }
  };

  function renderAll() {
    let shiftData = (state.data[state.date] && state.data[state.date].shifts[state.shift]) || {};
    let weeklyData = (state.data[state.date] && state.data[state.date].weekly) || {};

    let dailyHTML = state.expanded.daily ? DAILY.map(item => {
      let isChecked = shiftData[item] ? true : false;
      return '<label class="check-label ' + (isChecked ? 'checked' : '') + '">' +
        '<input type="checkbox" ' + (isChecked ? 'checked' : '') + ' onchange="toggleItem(\'' + item.replace(/'/g, "\\'") + '\', this, event)"> ' +
        '<span>' + item + '</span></label>';
    }).join('') : '';
    document.getElementById('jo-daily-list').innerHTML = dailyHTML;
    document.getElementById('jo-daily-list').style.display = state.expanded.daily ? 'block' : 'none';

    let weeklyHTML = state.expanded.weekly ? WEEKLY.map(task => {
      let isChecked = weeklyData[task] ? true : false;
      return '<label class="check-label weekly ' + (isChecked ? 'checked' : '') + '">' +
        '<input type="checkbox" ' + (isChecked ? 'checked' : '') + ' onchange="toggleWeekly(\'' + task.replace(/'/g, "\\'") + '\', this, event)"> ' +
        '<span>' + task + '</span></label>';
    }).join('') : '';
    document.getElementById('jo-weekly-list').innerHTML = weeklyHTML;
    document.getElementById('jo-weekly-list').style.display = state.expanded.weekly ? 'block' : 'none';

    let photoHTML = '';
    ['daily', 'weekly'].forEach(section => {
      let photoKey = state.shift + '-' + section;
      let photo = state.photoData[photoKey];
      if (photo) {
        photoHTML += '<div style="margin-bottom:0.5rem;"><div style="font-size:0.7rem;color:#94a3b8;margin-bottom:0.3rem;">📸 Foto ' + (section === 'daily' ? 'Harian' : 'Mingguan') + '</div>';
        photoHTML += '<img src="' + photo + '" style="max-width:100%;max-height:150px;border-radius:8px;"></div>';
      }
      let btn = document.getElementById('btn-photo-' + section);
      if (btn) btn.innerHTML = photo ? '📸✓ Foto' : '📸 Foto';
    });
    document.getElementById('jo-photo-container').innerHTML = photoHTML;
  }

  window.showHistory = function() {
    let all = safeGet('dreamos_janitor_outdoor', '{}');
    let dates = Object.keys(all).sort().reverse();
    let html = '';
    dates.forEach(date => {
      let dayData = all[date];
      ['pagi', 'siang', 'sore'].forEach(shift => {
        if (dayData.shifts && dayData.shifts[shift]) {
          let shiftData = dayData.shifts[shift];
          let hasData = Object.keys(shiftData).some(item => shiftData[item]);
          if (hasData || dayData.petugas) {
            let dailyChecked = DAILY.filter(it => shiftData[it]).length;
            let weeklyChecked = (dayData.weekly ? WEEKLY.filter(t => dayData.weekly[t]).length : 0);
            let total = DAILY.length + WEEKLY.length;
            let checked = dailyChecked + weeklyChecked;
            let pct = total > 0 ? Math.round((checked / total) * 100) : 0;
            html += '<div class="glass" style="margin-bottom:0.5rem;">';
            html += '<h4 style="color:var(--green);margin:0;">📅 ' + new Date(date).toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) + ' - ' + shift.toUpperCase() + '</h4>';
            html += '<p style="font-size:0.7rem;color:#94a3b8;">👤 Petugas: ' + (dayData.petugas || '-') + ' | 🌳 Area: ' + (dayData.area || '-') + ' | 📍 Zona: ' + (dayData.zona || '-') + '</p>';
            html += '<p style="font-size:0.7rem;">✅ Progress: ' + checked + '/' + total + ' (' + pct + '%)</p>';
            html += '</div>';
          }
        }
      });
    });
    if (!html) html = '<p style="text-align:center;color:#94a3b8;padding:2rem;">Belum ada riwayat</p>';
    document.getElementById('history-content').innerHTML = html;
    document.getElementById('history-modal').style.display = 'block';
  };

  window.closeHistory = function() { document.getElementById('history-modal').style.display = 'none'; };

  window.exportCSV = function() {
    let all = safeGet('dreamos_janitor_outdoor', '{}');
    let dates = Object.keys(all).sort().reverse();
    let csv = 'Tanggal,Shift,Petugas,Area,Zona,Kategori,Item,Status\n';
    dates.forEach(date => {
      let dayData = all[date];
      ['pagi', 'siang', 'sore'].forEach(shift => {
        if (dayData.shifts && dayData.shifts[shift]) {
          let shiftData = dayData.shifts[shift];
          DAILY.forEach(item => csv += date + ',' + shift + ',' + (dayData.petugas || '') + ',' + (dayData.area || '') + ',' + (dayData.zona || '') + ',"Harian","' + item + '",' + (shiftData[item] ? 'Bersih' : 'Belum') + '\n');
        }
      });
      let weeklyData = dayData.weekly || {};
      WEEKLY.forEach(task => csv += date + ',-,' + (dayData.petugas || '') + ',' + (dayData.area || '') + ',' + (dayData.zona || '') + ',"Mingguan","' + task + '",' + (weeklyData[task] ? 'Selesai' : 'Belum') + '\n');
    });
    let blob = new Blob([csv], { type: 'text/csv' });
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a'); a.href = url; a.download = 'janitor_outdoor_' + new Date().toISOString().split('T')[0] + '.csv';
    a.click(); URL.revokeObjectURL(url);
    alert('✅ CSV berhasil diexport!');
  };

  window.cetakLaporan = function() {
    let shiftData = (state.data[state.date] && state.data[state.date].shifts[state.shift]) || {};
    let weeklyData = (state.data[state.date] && state.data[state.date].weekly) || {};
    let win = window.open('', '_blank', 'width=900,height=600');
    let doc = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Laporan Janitor Outdoor</title><style>body{font-family:sans-serif;padding:20px;color:#111;}h2,h3{text-align:center;}table{width:100%;border-collapse:collapse;margin:10px 0;}th,td{border:1px solid #000;padding:6px;text-align:left;}th{background:#eee;}.chk{color:#10b981;font-weight:bold;}.unchk{color:#ef4444;}@media print{button{display:none;}}</style></head><body>';
    doc += '<h2>LAPORAN JANITOR OUTDOOR</h2><p style="text-align:center;">ISO 14001 • ISO 45001 • ISO 9001</p>';
    doc += '<p style="text-align:center;">Tanggal: ' + new Date(state.date).toLocaleDateString('id-ID') + ' | Shift: ' + state.shift.toUpperCase() + '</p>';
    doc += '<p><strong>Petugas:</strong> ' + (document.getElementById('jo-petugas').value || '-') + ' | <strong>Area:</strong> ' + (document.getElementById('jo-area').value || '-') + ' | <strong>Zona:</strong> ' + (document.getElementById('jo-zona').value || '-') + '</p>';
    doc += '<button onclick="window.print()" style="padding:8px 16px;background:#6366f1;color:white;border:none;border-radius:4px;cursor:pointer;margin-bottom:15px;">🖨️ Cetak Laporan</button>';
    doc += '<h3>📋 Ceklis Harian</h3><table><tr><th>Item</th><th>Status</th></tr>';
    DAILY.forEach(it => doc += '<tr><td>' + it + '</td><td class="' + (shiftData[it] ? 'chk' : 'unchk') + '">' + (shiftData[it] ? '✅ Bersih' : '❌ Belum') + '</td></tr>');
    doc += '</table><h3>🗓️ Tugas Mingguan</h3><table><tr><th>Tugas</th><th>Status</th></tr>';
    WEEKLY.forEach(t => doc += '<tr><td>' + t + '</td><td class="' + (weeklyData[t] ? 'chk' : 'unchk') + '">' + (weeklyData[t] ? '✅ Selesai' : '❌ Belum') + '</td></tr>');
    doc += '</table>';
    ['daily', 'weekly'].forEach(section => {
      let photoKey = state.shift + '-' + section;
      if (state.photoData[photoKey]) doc += '<p><strong>Foto ' + (section === 'daily' ? 'Harian' : 'Mingguan') + ':</strong><br><img src="' + state.photoData[photoKey] + '" style="max-width:300px;border:1px solid #ccc;border-radius:4px;"></p>';
    });
    doc += '<p style="margin-top:30px;text-align:right;">Mengetahui,<br><br><br>Kepala Bagian Umum</p></body></html>';
    win.document.write(doc); win.document.close();
  };

  window.submitToCloud = async function() {
    let petugas = document.getElementById('jo-petugas').value;
    let area = document.getElementById('jo-area').value;
    if (!petugas || !area) return alert('⚠️ Isi Nama Petugas dan Area dulu!');
    let payload = {
      id: 'jo_' + Date.now(),
      petugas, area,
      zona: document.getElementById('jo-zona').value,
      tanggal: state.date,
      shift: state.shift,
      checklist: state.data[state.date].shifts[state.shift],
      weekly: state.data[state.date].weekly,
      created_at: new Date().toISOString()
    };
    if (window.supabaseClient) {
      try {
        let { error } = await window.supabaseClient.from('janitor_outdoor').insert(payload);
        if (error) throw error;
        alert('✅ Data terkirim ke cloud!');
        if (window.BankAudit) BankAudit.log('JANITOR_OUTDOOR_SUBMIT', { petugas, area, shift: state.shift });
      } catch (e) {
        console.warn('Gagal sync cloud:', e.message);
        if (window.OfflineQueue) {
          window.OfflineQueue.add('janitor_outdoor', 'insert', payload);
          alert('⚠️ Data masuk antrian offline. Akan terkirim saat online.');
        } else {
          alert('⚠️ Gagal sync: ' + e.message + '\nData tetap aman di lokal.');
        }
      }
    } else {
      if (window.OfflineQueue) {
        window.OfflineQueue.add('janitor_outdoor', 'insert', payload);
        alert('✅ Data masuk antrian offline!');
      } else {
        alert('⚠️ Koneksi tidak tersedia. Data tetap aman di lokal.');
      }
    }
  };

  document.getElementById('jo-date').value = state.date;
  loadData();
  if (window.BankAudit) BankAudit.log('ACCESS_JANITOR_OUTDOOR', { role: JSON.parse(localStorage.getItem('dreamos_bound_user') || '{}').role || 'staff' });
  console.log('🌿 Janitor Outdoor Ready');
})();
</script>
