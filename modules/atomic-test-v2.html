<script src="../js/security-helper.js"></script>
<button onclick="window.parent.goHome()" style="position:fixed;top:1rem;left:1rem;background:#1e293b;border:1px solid #2dd4bf;color:#2dd4bf;padding:0.5rem 1rem;border-radius:0.5rem;cursor:pointer;z-index:1000;">← Kembali</button>
<div style="min-height:100vh;background:#040814;color:#e2e8f0;font-family:'Inter',sans-serif;padding:1rem;padding-top:3.5rem;padding-bottom:5rem;" id="atomic-app">
  <h2 style="color:#06b6d4;font-size:1.4rem;margin-bottom:0.3rem;">🧪 Atomic System Test</h2>
  <p style="color:#94a3b8;font-size:0.7rem;margin-bottom:1rem;">CPU • Memory • Storage • Network • DOM Render</p>
  <button id="btn-run" style="width:100%;padding:0.75rem;background:#06b6d4;color:#000;border:none;border-radius:0.5rem;font-weight:700;cursor:pointer;margin-bottom:1rem;">⚡ JALANKAN DIAGNOSTIC</button>
  <div id="test-results" style="display:grid;gap:0.5rem;"></div>
</div>
<style>
  .test-card{background:rgba(15,23,42,0.6);border:1px solid rgba(255,255,255,0.1);border-radius:0.75rem;padding:0.75rem;display:flex;justify-content:space-between;align-items:center;}
  .test-label{font-size:0.8rem;color:#e2e8f0;}
  .test-val{font-weight:700;font-size:0.85rem;}
  .pass{color:#10b981;} .warn{color:#f59e0b;} .fail{color:#ef4444;}
</style>
<script>
(function(){
  var results = document.getElementById('test-results');
  function addCard(label, value, cls, id){
    var idAttr = id ? 'id="'+id+'"' : '';
    results.innerHTML += '<div class="test-card"><div class="test-label">'+label+'</div><div class="test-val '+cls+'" '+idAttr+'>'+value+'</div></div>';
  }

  function runTests(){
    results.innerHTML = '<div style="text-align:center;color:#94a3b8;padding:1rem;">⏳ Running diagnostics...</div>';
    setTimeout(function(){
      results.innerHTML = '';

      // 1️⃣ JS Execution Speed
      var t0 = performance.now();
      for(var i=0;i<1000000;i++){}
      var jsMs = (performance.now()-t0).toFixed(1);
      addCard('⚡ JS Loop (1M)', jsMs+'ms', jsMs<50?'pass':jsMs<150?'warn':'fail');

      // 2️⃣ LocalStorage I/O
      var t1 = performance.now();
      try {
        localStorage.setItem('__atomic_test', JSON.stringify({t:Date.now(),d:'x'.repeat(1000)}));
        JSON.parse(localStorage.getItem('__atomic_test'));
        localStorage.removeItem('__atomic_test');
      } catch(e){}
      var ioMs = (performance.now()-t1).toFixed(1);
      addCard('💾 Storage R/W', ioMs+'ms', ioMs<10?'pass':ioMs<30?'warn':'fail');

      // 3️⃣ DOM Render Speed
      var t2 = performance.now();
      var frag = document.createDocumentFragment();
      for(var j=0;j<100;j++){ var d=document.createElement('div'); d.textContent='test'; frag.appendChild(d); }
      var tmp = document.createElement('div'); tmp.appendChild(frag);
      var domMs = (performance.now()-t2).toFixed(1);
      addCard('🖼️ DOM Render (100)', domMs+'ms', domMs<5?'pass':domMs<15?'warn':'fail');

      // 4️⃣ Network Ping (Fixed: ID target + 5s timeout)
      addCard('📡 Network Ping', 'Testing...', 'warn', 'net-ping-val');
      var netStart = Date.now();
      var netDone = false;
      setTimeout(function(){
        if(!netDone){
          netDone = true;
          var el = document.getElementById('net-ping-val');
          if(el){ el.textContent = 'Timeout/Blocked'; el.className = 'test-val fail'; }
        }
      }, 5000);

      fetch('https://www.google.com/favicon.ico',{mode:'no-cors',cache:'no-store'})
        .then(function(){
          if(netDone) return;
          netDone = true;
          var ping = Date.now()-netStart;
          var el = document.getElementById('net-ping-val');
          if(el){ el.textContent = ping+'ms'; el.className = 'test-val '+(ping<200?'pass':ping<500?'warn':'fail'); }
        })
        .catch(function(){
          if(netDone) return;
          netDone = true;
          var el = document.getElementById('net-ping-val');
          if(el){ el.textContent = 'Offline/CORS'; el.className = 'test-val fail'; }
        });

      // 5️⃣ LocalStorage Usage
      var keys = Object.keys(localStorage).length;
      var size = new Blob([JSON.stringify(localStorage)]).size;
      addCard('📦 LocalStorage', keys+' keys / '+(size/1024).toFixed(1)+'KB', size<2048?'pass':'warn');

      // 6️⃣ System Info (Fixed: safe fallbacks)
      var cores = navigator.hardwareConcurrency || 'N/A';
      var lang = navigator.language || navigator.userLanguage || 'N/A';
      addCard('🧠 Cores / Lang', cores+' / '+lang, 'pass');

    }, 100);
  }

  setTimeout(function(){
    var btn = document.getElementById('btn-run');
    if(btn) btn.onclick = runTests;
    console.log('✅ Atomic Test module ready');
  }, 150);
})();
</script>
