<script src="../js/security-helper.js">
async function laporK3() {
    const lokasi = document.getElementById('k3-lokasi')?.value || '';
    const kategori = document.getElementById('k3-kategori')?.value || '';
    const deskripsi = document.getElementById('k3-deskripsi')?.value || '';
    if (!lokasi || !kategori) return alert('⚠️ Lokasi dan kategori wajib diisi!');
    
    try {
        const { error } = await window.parent.supabase.from('k3_reports').insert({
            pelapor_id: JSON.parse(localStorage.getItem('dreamos_bound_user'))?.id,
            lokasi, kategori, deskripsi,
            status: 'pending'
        });
        if (error) throw error;
        alert('✅ Laporan K3 berhasil dikirim ke cloud!');
        // Refresh tampilan
        if (typeof tampilkanLaporan === 'function') tampilkanLaporan();
    } catch(e) {
        alert('⚠️ Gagal mengirim laporan: ' + e.message);
    }
}


async 
function tampilkanLaporan() {
  var cache = JSON.parse(localStorage.getItem('dreamos_k3_reports') || '[]');
  if (cache.length) renderList(cache); // tampilkan cache dulu
  setSyncStatus('cached');
  
  try {
    window.parent.supabase.from('k3_reports').select('*').then(function(res) {
      if (!res.error && res.data) {
        localStorage.setItem('dreamos_k3_reports', JSON.stringify(res.data));
        renderList(res.data);
        setSyncStatus('synced');
      }
    });
  } catch(e) { setSyncStatus('error'); }

    const container = document.getElementById('k3-list');
    if (!container) return;
    container.innerHTML = '<p>Memuat laporan dari cloud...</p>';
    
    try {
        const { data, error } = await window.parent.supabase
            .from('k3_reports')
            .select('*, users!inner(nama)')
            .order('created_at', { ascending: false });
        
        if (error) throw error;
        
        if (!data || data.length === 0) {
            container.innerHTML = '<p>Belum ada laporan.</p>';
            return;
        }
        
        container.innerHTML = data.map(item => `
            <div style="background:rgba(0,0,0,0.3); padding:0.8rem; border-radius:12px; margin-bottom:0.5rem;">
                <b>${item.kategori?.toUpperCase() || 'UMUM'}</b> • ${item.lokasi || '-'}<br>
                <small>${new Date(item.created_at).toLocaleDateString('id-ID')}</small><br>
                ${item.deskripsi || '-'}<br>
                <span class="badge badge-${item.status === 'pending' ? 'pending' : 'approved'}">${item.status || 'pending'}</span>
            </div>
        `).join('');
        
        // Tetap simpan di localStorage sebagai cache offline
        localStorage.setItem('dreamos_k3_reports', JSON.stringify(data));
    } catch(e) {
        // Fallback ke localStorage jika offline
        const cached = JSON.parse(localStorage.getItem('dreamos_k3_reports') || '[]');
        if (cached.length > 0) {
            container.innerHTML = cached.map(item => `
                <div style="background:rgba(0,0,0,0.3); padding:0.8rem; border-radius:12px; margin-bottom:0.5rem;">
                    <b>${item.kategori?.toUpperCase() || 'UMUM'}</b> • ${item.lokasi || '-'}<br>
                    <small>${new Date(item.created_at).toLocaleDateString('id-ID')}</small><br>
                    ${item.deskripsi || '-'}<br>
                    <span class="badge badge-${item.status === 'pending' ? 'pending' : 'approved'}">${item.status || 'pending'}</span>
                </div>
            `).join('');
        } else {
            container.innerHTML = '<p>Gagal memuat laporan. Periksa koneksi.</p>';
        }
    }
}


function setSyncStatus(s) {
  var b = document.getElementById('sync-badge');
  if (b) b.innerHTML = s === 'synced' ? '🟢 Synced' : s === 'cached' ? '🟡 Cached' : '🔴 Error';
}
</script>

<script>
(function(){
  const SUPA_URL = 'https://gbigjdhifispatrrskgh.supabase.co';
  const SUPA_KEY = 'sb_publishable_rgSsdppHSeZ8a0I_NWtqZA_jBz2wWwW';
  
  function safeGet(k,fb){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(fb));}catch(e){return fb;}}
  function safeSet(k,d){localStorage.setItem(k,JSON.stringify(d));}
  
  async function syncK3Report(data) {
    const statusEl = document.getElementById('k3-status');    const localReports = safeGet('dreamos_k3_reports', []);
    const localId = 'local_' + Date.now();
    const localEntry = {...data, id: localId, synced: false, created_at: new Date().toISOString()};
    localReports.unshift(localEntry);
    safeSet('dreamos_k3_reports', localReports);
    
    statusEl.textContent = '✅ Disimpan lokal. Sync ke cloud...';
    statusEl.style.color = '#f59e0b';
    
    try {
      const response = await fetch(SUPA_URL + '/rest/v1/k3_reports', {
        method: 'POST',
        headers: {
          'apikey': SUPA_KEY,
          'Authorization': 'Bearer ' + SUPA_KEY,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation'
        },
        body: JSON.stringify(data)
      });
      
      if (response.ok) {
        const cloudData = await response.json();
        const idx = localReports.findIndex(r => r.id === localId);
        if (idx > -1) {
          localReports[idx] = {...localReports[idx], id: cloudData[0].id, synced: true};
          safeSet('dreamos_k3_reports', localReports);
        }
        statusEl.textContent = '✅ Synced to Cloud!';
        statusEl.style.color = '#10b981';
      } else { throw new Error('Cloud sync failed'); }
    } catch (e) {
      statusEl.textContent = '⚠️ Offline mode. Akan sync nanti.';
      statusEl.style.color = '#64748b';
      console.log('Cloud sync pending:', e.message);
    }
    renderList();
  }
  
  function renderList() {
    const list = document.getElementById('k3-list');
    const reports = safeGet('dreamos_k3_reports', []);
    if (reports.length === 0) {
      list.innerHTML = '<p style="color:#64748b;text-align:center;">Belum ada laporan.</p>';
      return;
    }
    list.innerHTML = reports.map(r => 
      '<div style="padding:0.8rem;margin:0.3rem 0;background:#1e293b;border-radius:0.5rem;border-left:3px solid ' + 
      (r.priority==='critical'?'#ef4444':r.priority==='high'?'#f59e0b':'#10b981') + 
      ';"><div style="font-weight:bold;">' + r.jenis.toUpperCase() + ' • ' + r.lokasi + '</div>' +      '<div style="font-size:0.75rem;color:#94a3b8;">' + r.nama + ' • ' + new Date(r.created_at).toLocaleDateString('id-ID') + '</div>' +
      '<div style="font-size:0.7rem;margin:0.3rem 0;">' + r.deskripsi + '</div>' +
      '<div style="font-size:0.65rem;">' + (r.synced?'☁️ Synced':'📱 Local only') + ' • ' +
      '<span style="color:' + (r.priority==='critical'?'#ef4444':r.priority==='high'?'#f59e0b':'#10b981') + '">' + r.priority.toUpperCase() + '</span></div></div>'
    ).join('');
  }
  
  document.getElementById('k3-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const report = {
      nama_pelapor: document.getElementById('k3-nama').value.trim(),
      jenis: document.getElementById('k3-jenis').value,
      lokasi: document.getElementById('k3-lokasi').value.trim(),
      deskripsi: document.getElementById('k3-deskripsi').value.trim(),
      priority: document.getElementById('k3-priority').value,
      status: 'pending'
    };
    if (!report.nama_pelapor || !report.lokasi || !report.deskripsi) {
      document.getElementById('k3-status').textContent = '❌ Isi semua field wajib!';
      document.getElementById('k3-status').style.color = '#ef4444';
      return;
    }
    syncK3Report(report);
    this.reset();
  });
  
  renderList();
  console.log('🌌 K3 Module - Hybrid Soul Active');
})();
