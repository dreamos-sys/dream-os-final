    if (typeof tampilkanLaporan === 'function') tampilkanLaporan();

        // Refresh tampilan

async function tampilkanLaporan() {
    const container = document.getElementById('k3-list');
    if (!container) return;
    container.innerHTML = '<p style="color:#cbd5e1;">Memuat laporan...</p>';
    
    try {
        const { data, error } = await window.supabaseClient
            .from('k3_reports')
            .select('*')
            .order('created_at', { ascending: false });
        
        if (error) throw error;
        
        const reports = data || [];
        localStorage.setItem('dreamos_k3_reports', JSON.stringify(reports));
        renderList(reports);
        setSyncStatus('synced');
    } catch(e) {
        console.warn('Cloud fetch failed, using cache:', e.message);
        setSyncStatus('error');
        const cached = JSON.parse(localStorage.getItem('dreamos_k3_reports') || '[]');
        renderList(cached);
    }
}

function renderList(reports) {
    const container = document.getElementById('k3-list');
    if (!container) return;
    if (!reports || reports.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#cbd5e1; padding:1rem;">Belum ada laporan.</p>';
        return;
    }
    
    container.innerHTML = reports.map(item => {
        let statusClass = item.status === 'pending' ? 'pending' : 'approved';
        let html = \`
            <div style="background:rgba(0,0,0,0.3); padding:0.8rem; border-radius:12px; margin-bottom:0.5rem;">
                <b>\${item.kategori?.toUpperCase() || 'UMUM'}</b> • \${item.lokasi || '-'}<br>
                <small style="color:#cbd5e1;">\${new Date(item.created_at).toLocaleDateString('id-ID')}</small><br>
                \${item.deskripsi || '-'}<br>
                <span class="badge badge-\${statusClass}">\${item.status || 'pending'}</span>
        \`;
        
        if (window.WorkflowEngine && (window.getUserRole() === 'dev' || window.getUserRole() === 'kabag_umum') && item.status === 'pending') {
            html += \`<div style="margin-top:0.5rem; display:flex; gap:0.5rem;">
                <button class="btn btn-success" style="min-height:44px; font-size:0.8125rem;" onclick="window.WorkflowEngine.approve('k3_reports', '\${item.id}')">✅ Setujui</button>
                <button class="btn btn-danger" style="min-height:44px; font-size:0.8125rem;" onclick="window.WorkflowEngine.reject('k3_reports', '\${item.id}')">❌ Tolak</button>
            </div>\`;
        }
        html += \`</div>\`;
        return html;
    }).join('');
}

function setSyncStatus(s) {
  var b = document.getElementById('sync-badge');
  if (b) b.innerHTML = s === 'synced' ? '🟢 Synced' : s === 'cached' ? '🟡 Cached' : '🔴 Error';
}
</script>
