<style>
  :root { --neon: #00ff9d; --accent: #0ea5e9; --warning: #e11d48; --gold: #f59e0b; }
  * { box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #0a0e27; color: #e2e8f0; min-height: 100vh; margin: 0; }
  .glass { background: rgba(15,23,42,0.8); backdrop-filter: blur(20px); border: 1px solid rgba(0,255,157,0.15); border-radius: 16px; padding: 1rem; margin-bottom: 0.8rem; }
  .back-btn { position: fixed; top: 0.8rem; left: 0.8rem; z-index: 1000; background: rgba(30,41,59,0.9); border: 1px solid var(--neon); color: var(--neon); padding: 0.4rem 0.8rem; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.7rem; }
  .btn { padding: 0.5rem 0.9rem; border: none; border-radius: 8px; font-weight: 700; font-size: 0.7rem; cursor: pointer; transition: 0.2s; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-success { background: #10b981; color: #fff; }
  .btn-danger { background: var(--warning); color: #fff; }
  .btn-warning { background: var(--gold); color: #000; }
  .btn:hover { transform: translateY(-1px); opacity: 0.95; }
  .input-field { width: 100%; padding: 0.6rem; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #e2e8f0; font-size: 0.8rem; outline: none; }
  .input-field:focus { border-color: var(--neon); }
  .section-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 0.8rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.5rem; }
  .shift-btn { padding: 0.5rem 0.8rem; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.75rem; background: #1e293b; color: #e2e8f0; transition: 0.3s; }
  .shift-btn.active { background: #10b981; color: #000; border-color: #10b981; }
  
  /* ✅ FIX KONTRAS CHECKLIST AGAR SANGAT TERLIHAT */
  .check-label { 
    display: flex; 
    align-items: center; 
    gap: 0.6rem; 
    padding: 0.6rem; 
    background: rgba(15, 23, 42, 0.6); 
    border: 1px solid rgba(255,255,255,0.15); 
    border-radius: 8px; 
    cursor: pointer; 
    font-size: 0.8rem; 
    font-weight: 500;
    color: #e2e8f0;
    transition: all 0.2s; 
    user-select: none; 
  }
  .check-label:hover { 
    background: rgba(30, 41, 59, 0.8); 
    border-color: rgba(0,255,157,0.4); 
  }
  .check-label.checked { 
    background: rgba(16,185,129,0.15); 
    border-color: #10b981; 
    color: #10b981; 
  }
  .check-label input[type="checkbox"] { 
    cursor: pointer; 
    width: 20px; 
    height: 20px; 
    accent-color: #00ff9d; /* Warna Neon Hijau Terang */
    border: 2px solid #94a3b8;
    border-radius: 4px;
    flex-shrink: 0; 
  }
  .check-label span { flex: 1; }

  .mini-stat { background: rgba(15,23,42,0.6); border: 1px solid rgba(255,255,255,0.08); border-radius: 0.5rem; padding: 0.5rem; text-align: center; }
  .mini-stat-val { font-size: 1.2rem; font-weight: 700; color: #e2e8f0; }
  .mini-stat-label { font-size: 0.75rem; color: #94a3b8; }
</style>

<button class="back-btn" onclick="window.goHome()">← HOME</button>

<div style="max-width: 900px; margin: 0 auto; padding: 3.5rem 0.8rem 5rem;">
  
  <div class="glass" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
    <div>
      <h2 style="color: var(--neon); margin: 0; font-size: 1.1rem;">🧹 Janitor Indoor</h2>
      <p style="color: #64748b; font-size: 0.62rem; margin: 0;">Ceklis Harian • Bank-Grade Security</p>
    </div>
    <div style="display: flex; gap: 0.3rem; flex-wrap: wrap;">
      <button class="btn btn-warning" onclick="showHistory()">📜 Riwayat</button>
      <button class="btn btn-success" onclick="exportCSV()">📥 CSV</button>
      <button class="btn btn-primary" onclick="submitToCloud()">☁️ Submit</button>
      <button class="btn" style="background: #6366f1; color: #fff;" onclick="cetakLaporan()">🖨️ Cetak</button>
    </div>
  </div>

  <div class="glass">
    <div class="section-title" style="color: var(--accent);">👤 Petugas & Lokasi</div>
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem;">
      <input type="text" id="ji-petugas" class="input-field" placeholder="Nama Petugas" oninput="saveMeta()">
      <input type="text" id="ji-gedung" class="input-field" placeholder="Gedung" oninput="saveMeta()">
      <input type="text" id="ji-lantai" class="input-field" placeholder="Lantai" oninput="saveMeta()">
    </div>
  </div>

  <div class="glass" style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;">
    <input type="date" id="ji-date" class="input-field" style="flex: 1; min-width: 150px; width: auto;" onchange="changeDate()">
    <div style="display: flex; gap: 0.3rem;">
      <button class="shift-btn active" id="btn-pagi" onclick="setShift('pagi')">🌅 Pagi</button>
      <button class="shift-btn" id="btn-siang" onclick="setShift('siang')">☀️ Siang</button>
      <button class="shift-btn" id="btn-sore" onclick="setShift('sore')">🌇 Sore</button>
    </div>
    <button class="btn btn-danger" onclick="resetShift()" style="margin-left: auto;">Reset Shift</button>
  </div>

  <div class="glass" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; text-align: center;">
    <div class="mini-stat"><div class="mini-stat-val" id="stat-total">0</div><div class="mini-stat-label">Total Item</div></div>
    <div class="mini-stat"><div class="mini-stat-val" id="stat-checked">0</div><div class="mini-stat-label" style="color: #10b981;">Selesai</div></div>
    <div class="mini-stat"><div class="mini-stat-val" id="stat-percent">0%</div><div class="mini-stat-label" style="color: #f59e0b;">Progress</div></div>
  </div>

  <div id="ji-checklist" style="display: flex; flex-direction: column; gap: 0.75rem;"></div>
</div>

<div id="history-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 99999; overflow-y: auto; padding: 1rem;">
  <div style="max-width: 800px; margin: 0 auto; background: #0f172a; border: 1px solid var(--neon); border-radius: 16px; padding: 1.5rem;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
      <h3 style="color: var(--neon); margin: 0;">📜 Riwayat Janitor Indoor</h3>
      <button onclick="closeHistory()" class="btn btn-danger">✕ Tutup</button>
    </div>
    <div id="history-content"></div>
  </div>
</div>

<script>
(function() {
  'use strict';

  const AREAS = {
    toilet_male: { title: '🚹 Toilet Laki-Laki', items: ['Pintu Utama','Pintu Kubikal','Kaca / Cermin','Exhoust','Dinding','Tempat Wudhu','Lantai','Floor Drain','Kloset','Flapond / Ceilling','Tempat Sampah','Tempat Handsoap','Gayung','Ember','Hanger / Gantungan Pakaian'] },
    toilet_female: { title: '🚺 Toilet Perempuan', items: ['Pintu Utama','Pintu Kubikal','Kaca / Cermin','Exhoust','Dinding','Tempat Wudhu','Lantai','Floor Drain','Kloset','Flapond / Ceilling','Tempat Sampah','Tempat Handsoap','Gayung','Ember','Hanger / Gantungan Pakaian'] },
    ruangan: { title: '🏢 Ruangan', items: ['Loby Utama','Teras','Lorong Utama Gedung','Balkon','Pintu Utama','Pintu Kelas dan R Lain','Jendela','Kelas','Aula','Sentra Musik','Sentra Kreasi','UKS','Psikolog','Lab Kom','Lab IPA','Perpustakaan','Kepala Sekolah','R.Guru (Laki/Perempuan)','R. Pemasaran','R. Admin TU','R. Rapat','R.CEO, Direktur dan Yayasan','R. Kepala Bidang (Kabid)','R. Osis','R. Mushalla','R. Inklusi','R. Gudang Olah Raga','R. Serbaguna','R. Masjid','Kantin','Saung Besar','Saung Kecil','Pos','Gudang Umum','Tangga','Lift','Keterangan Dll'] }
  };

  let state = {
    date: new Date().toISOString().split('T')[0],
    shift: 'pagi',
    data: {},
    expanded: { toilet_male: true, toilet_female: true, ruangan: true },
    photoData: {}
  };

  function safeGet(key, fallback) { try { return JSON.parse(localStorage.getItem(key) || fallback); } catch(e) { return JSON.parse(fallback); } }
  function safeSet(key, data) { localStorage.setItem(key, JSON.stringify(data)); }

  function loadData() {
    let all = safeGet('dreamos_janitor_indoor', '{}');
    if (!all[state.date]) all[state.date] = { shifts: { pagi: {}, siang: {}, sore: {} }, photos: {}, petugas: '', gedung: '', lantai: '' };
    if (!all[state.date].shifts) all[state.date].shifts = { pagi: {}, siang: {}, sore: {} };
    if (!all[state.date].photos) all[state.date].photos = {};
    state.data = all;
    state.photoData = all[state.date].photos || {};
    document.getElementById('ji-petugas').value = all[state.date].petugas || '';
    document.getElementById('ji-gedung').value = all[state.date].gedung || '';
    document.getElementById('ji-lantai').value = all[state.date].lantai || '';
    document.getElementById('ji-date').value = state.date;
    updateShiftBtns();
    renderChecklist();
    updateStats();
  }

  window.saveMeta = function() {
    if (!state.data[state.date]) state.data[state.date] = { shifts: { pagi: {}, siang: {}, sore: {} }, photos: {}, petugas: '', gedung: '', lantai: '' };
    state.data[state.date].petugas = document.getElementById('ji-petugas').value;
    state.data[state.date].gedung = document.getElementById('ji-gedung').value;
    state.data[state.date].lantai = document.getElementById('ji-lantai').value;
    safeSet('dreamos_janitor_indoor', state.data);
  };

  window.changeDate = function() {
    state.date = document.getElementById('ji-date').value;
    loadData();
  };

  window.setShift = function(sh) {
    state.shift = sh;
    updateShiftBtns();
    renderChecklist();
    updateStats();
  };

  function updateShiftBtns() {
    document.getElementById('btn-pagi').classList.toggle('active', state.shift === 'pagi');
    document.getElementById('btn-siang').classList.toggle('active', state.shift === 'siang');
    document.getElementById('btn-sore').classList.toggle('active', state.shift === 'sore');
  }

  window.toggleItem = function(area, item, checkbox, event) {
    if (event) event.stopPropagation();
    if (!state.data[state.date].shifts[state.shift]) state.data[state.date].shifts[state.shift] = {};
    if (!state.data[state.date].shifts[state.shift][area]) state.data[state.date].shifts[state.shift][area] = {};
    state.data[state.date].shifts[state.shift][area][item] = checkbox.checked;
    safeSet('dreamos_janitor_indoor', state.data);
    checkbox.closest('.check-label').classList.toggle('checked', checkbox.checked);
    updateStats();
  };

  window.toggleExpand = function(area, event) {
    if (event) event.stopPropagation();
    state.expanded[area] = !state.expanded[area];
    renderChecklist();
  };

  function updateStats() {
    let shiftData = (state.data[state.date] && state.data[state.date].shifts[state.shift]) || {};
    let total = 0, checked = 0;
    Object.keys(AREAS).forEach(areaKey => {
      let area = AREAS[areaKey];
      let aData = shiftData[areaKey] || {};
      total += area.items.length;
      area.items.forEach(it => { if (aData[it]) checked++; });
    });
    let pct = total > 0 ? Math.round((checked / total) * 100) : 0;
    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-checked').textContent = checked;
    document.getElementById('stat-percent').textContent = pct + '%';
  }

  window.uploadPhoto = function(area, event) {
    if (event) event.stopPropagation();
    let input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*'; input.capture = 'environment';
    input.onchange = function(e) {
      let file = e.target.files[0]; if (!file) return;
      let reader = new FileReader();
      reader.onload = function(ev) {
        let key = state.shift + '-' + area;
        state.data[state.date].photos[key] = ev.target.result;
        state.photoData = state.data[state.date].photos;
        safeSet('dreamos_janitor_indoor', state.data);
        renderChecklist();
      };
      reader.readAsDataURL(file);
    };
    input.click();
  };

  window.resetShift = function() {
    if (!confirm('Reset checklist shift ' + state.shift + '?')) return;
    if (state.data[state.date] && state.data[state.date].shifts) {
      state.data[state.date].shifts[state.shift] = {};
      safeSet('dreamos_janitor_indoor', state.data);
      renderChecklist();
      updateStats();
    }
  };

  function renderChecklist() {
    let container = document.getElementById('ji-checklist');
    let html = '';
    Object.keys(AREAS).forEach(areaKey => {
      let area = AREAS[areaKey];
      let shiftData = (state.data[state.date] && state.data[state.date].shifts[state.shift] && state.data[state.date].shifts[state.shift][areaKey]) || {};
      let checked = area.items.filter(it => shiftData[it]).length;
      let total = area.items.length;
      let pct = Math.round((checked / total) * 100);
      let col = pct === 100 ? '#10b981' : pct >= 50 ? '#f59e0b' : '#ef4444';
      let photoKey = state.shift + '-' + areaKey;
      let photo = state.photoData[photoKey];
      let isExp = state.expanded[areaKey];

      html += '<div class="glass">';
      html += '<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.3rem;">';
      html += '<div style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;" onclick="toggleExpand(\'' + areaKey + '\', event)">';
      html += '<h4 style="color: var(--neon); font-size: 0.9rem; margin: 0;">' + area.title + '</h4>';
      html += '<span style="font-size: 0.7rem; color: #94a3b8;">' + checked + '/' + total + '</span></div>';
      html += '<div style="display: flex; align-items: center; gap: 0.5rem;">';
      html += '<button onclick="uploadPhoto(\'' + areaKey + '\', event)" class="btn" style="background: rgba(59,130,246,0.2); color: #3b82f6; padding: 0.2rem 0.5rem; font-size: 0.7rem;">' + (photo ? '📸✓' : '📸') + '</button>';
      html += '<div style="width: 60px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px;"><div style="width: ' + pct + '%; height: 100%; background: ' + col + '; border-radius: 3px; transition: 0.3s;"></div></div>';
      html += '</div></div>';
      if (photo) html += '<img src="' + photo + '" style="max-width: 100%; max-height: 120px; border-radius: 8px; margin-bottom: 0.5rem;">';
      if (isExp) {
        html += '<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.3rem; margin-top: 0.3rem;">';
        area.items.forEach(item => {
          let isChecked = shiftData[item] ? true : false;
          html += '<label class="check-label ' + (isChecked ? 'checked' : '') + '">';
          html += '<input type="checkbox" ' + (isChecked ? 'checked' : '') + ' onchange="toggleItem(\'' + areaKey + '\', \'' + item.replace(/'/g, "\\'") + '\', this, event)"> ';
          html += '<span>' + item + '</span></label>';
        });
        html += '</div>';
      }
      html += '</div>';
    });
    container.innerHTML = html;
  }

  window.showHistory = function() {
    let all = safeGet('dreamos_janitor_indoor', '{}');
    let dates = Object.keys(all).sort().reverse();
    let html = '';
    dates.forEach(date => {
      let dayData = all[date];
      ['pagi', 'siang', 'sore'].forEach(shift => {
        if (dayData.shifts && dayData.shifts[shift]) {
          let shiftData = dayData.shifts[shift];
          let hasData = Object.keys(shiftData).some(area => Object.keys(shiftData[area]).some(item => shiftData[area][item]));
          if (hasData || dayData.petugas) {
            let total = 0, checked = 0;
            Object.keys(AREAS).forEach(areaKey => {
              let aData = shiftData[areaKey] || {};
              total += AREAS[areaKey].items.length;
              AREAS[areaKey].items.forEach(it => { if (aData[it]) checked++; });
            });
            let pct = total > 0 ? Math.round((checked / total) * 100) : 0;
            html += '<div class="glass" style="margin-bottom: 0.5rem;">';
            html += '<h4 style="color: var(--neon); margin: 0;">📅 ' + new Date(date).toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) + ' - ' + shift.toUpperCase() + '</h4>';
            html += '<p style="font-size: 0.7rem; color: #94a3b8;">👤 Petugas: ' + (dayData.petugas || '-') + ' | 🏢 ' + (dayData.gedung || '-') + ' | Lantai: ' + (dayData.lantai || '-') + '</p>';
            html += '<p style="font-size: 0.7rem;">✅ Progress: ' + checked + '/' + total + ' (' + pct + '%)</p>';
            html += '</div>';
          }
        }
      });
    });
    if (!html) html = '<p style="text-align: center; color: #94a3b8; padding: 2rem;">Belum ada riwayat</p>';
    document.getElementById('history-content').innerHTML = html;
    document.getElementById('history-modal').style.display = 'block';
  };

  window.closeHistory = function() { document.getElementById('history-modal').style.display = 'none'; };

  window.exportCSV = function() {
    let all = safeGet('dreamos_janitor_indoor', '{}');
    let dates = Object.keys(all).sort().reverse();
    let csv = 'Tanggal,Shift,Petugas,Gedung,Lantai,Area,Item,Status\n';
    dates.forEach(date => {
      let dayData = all[date];
      ['pagi', 'siang', 'sore'].forEach(shift => {
        if (dayData.shifts && dayData.shifts[shift]) {
          Object.keys(dayData.shifts[shift]).forEach(area => {
            Object.keys(dayData.shifts[shift][area]).forEach(item => {
              csv += date + ',' + shift + ',' + (dayData.petugas || '') + ',' + (dayData.gedung || '') + ',' + (dayData.lantai || '') + ',"' + area + '","' + item + '",' + (dayData.shifts[shift][area][item] ? 'Bersih' : 'Belum') + '\n';
            });
          });
        }
      });
    });
    let blob = new Blob([csv], { type: 'text/csv' });
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href = url; a.download = 'janitor_indoor_' + new Date().toISOString().split('T')[0] + '.csv';
    a.click(); URL.revokeObjectURL(url);
    alert('✅ CSV berhasil diexport!');
  };

  window.cetakLaporan = function() {
    let shiftData = (state.data[state.date] && state.data[state.date].shifts[state.shift]) || {};
    let win = window.open('', '_blank', 'width=900,height=600');
    let doc = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Laporan Janitor Indoor</title><style>body{font-family:sans-serif;padding:20px;color:#111;}h2,h3{text-align:center;}table{width:100%;border-collapse:collapse;margin:10px 0;}th,td{border:1px solid #000;padding:6px;text-align:left;}th{background:#eee;}.chk{color:#10b981;font-weight:bold;}.unchk{color:#ef4444;}@media print{button{display:none;}}</style></head><body>';
    doc += '<h2>LAPORAN JANITOR INDOOR</h2>';
    doc += '<p style="text-align:center;">Tanggal: ' + new Date(state.date).toLocaleDateString('id-ID') + ' | Shift: ' + state.shift.toUpperCase() + '</p>';
    doc += '<p><strong>Petugas:</strong> ' + (document.getElementById('ji-petugas').value || '-') + ' | <strong>Gedung:</strong> ' + (document.getElementById('ji-gedung').value || '-') + ' | <strong>Lantai:</strong> ' + (document.getElementById('ji-lantai').value || '-') + '</p>';
    doc += '<button onclick="window.print()" style="padding:8px 16px;background:#6366f1;color:white;border:none;border-radius:4px;cursor:pointer;margin-bottom:15px;">🖨️ Cetak Laporan</button>';
    Object.keys(AREAS).forEach(areaKey => {
      let area = AREAS[areaKey];
      let aData = shiftData[areaKey] || {};
      doc += '<h3>' + area.title + '</h3><table><tr><th>Item</th><th>Status</th></tr>';
      area.items.forEach(it => { doc += '<tr><td>' + it + '</td><td class="' + (aData[it] ? 'chk' : 'unchk') + '">' + (aData[it] ? '✅ Bersih' : '❌ Belum') + '</td></tr>'; });
      doc += '</table>';
      let pKey = state.shift + '-' + areaKey;
      if (state.photoData[pKey]) doc += '<p><strong>Foto:</strong><br><img src="' + state.photoData[pKey] + '" style="max-width:300px;border:1px solid #ccc;border-radius:4px;"></p>';
    });
    doc += '<p style="margin-top:30px;text-align:right;">Mengetahui,<br><br><br>Kepala Bagian Umum</p></body></html>';
    win.document.write(doc); win.document.close();
  };

  window.submitToCloud = async function() {
    let petugas = document.getElementById('ji-petugas').value;
    let gedung = document.getElementById('ji-gedung').value;
    if (!petugas || !gedung) return alert('⚠️ Isi Nama Petugas dan Gedung dulu!');
    
    let payload = {
      id: 'ji_' + Date.now(),
      petugas, gedung,
      lantai: document.getElementById('ji-lantai').value,
      tanggal: state.date,
      shift: state.shift,
      checklist: state.data[state.date].shifts[state.shift],
      created_at: new Date().toISOString()
    };

    if (window.supabaseClient) {
      try {
        let { error } = await window.supabaseClient.from('janitor_indoor').insert(payload);
        if (error) throw error;
        alert('✅ Data terkirim ke cloud!');
        if (window.BankAudit) BankAudit.log('JANITOR_INDOOR_SUBMIT', { petugas, gedung, shift: state.shift });
      } catch (e) {
        console.warn('Gagal sync cloud:', e.message);
        if (window.OfflineQueue) {
          window.OfflineQueue.add('janitor_indoor', 'insert', payload);
          alert('⚠️ Data masuk antrian offline.');
        } else {
          alert('⚠️ Gagal sync: ' + e.message);
        }
      }
    } else {
      if (window.OfflineQueue) {
        window.OfflineQueue.add('janitor_indoor', 'insert', payload);
        alert('✅ Data masuk antrian offline!');
      } else {
        alert('⚠️ Koneksi tidak tersedia. Data tetap aman di lokal.');
      }
    }
  };

  document.getElementById('ji-date').value = state.date;
  loadData();
  if (window.BankAudit) BankAudit.log('ACCESS_JANITOR_INDOOR', { role: JSON.parse(localStorage.getItem('dreamos_bound_user') || '{}').role || 'staff' });
  console.log('🧹 Janitor Indoor Ready');
})();
</script>
