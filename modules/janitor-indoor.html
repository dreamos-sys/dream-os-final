<style>
  :root { --neon: #00ff9d; --accent: #0ea5e9; --warning: #e11d48; --gold: #f59e0b; }
  * { box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #0a0e27; color: #e2e8f0; min-height: 100vh; margin: 0; }
  .glass { background: rgba(15,23,42,0.8); backdrop-filter: blur(20px); border: 1px solid rgba(0,255,157,0.15); border-radius: 16px; padding: 1rem; margin-bottom: 0.8rem; }
  .back-btn { position: fixed; bottom: calc(2rem + env(safe-area-inset-bottom)); left: 1rem; z-index: 1000; background: rgba(30,41,59,0.9); border: 1px solid var(--neon); color: var(--neon); padding: 0.4rem 0.8rem; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.8125rem; min-height: 44px; }
  .btn { min-height: 44px; padding: 0.6rem 0.9rem; border: none; border-radius: 8px; font-weight: 700; font-size: 0.8125rem; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 0.3rem; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-success { background: #10b981; color: #fff; }
  .btn-danger { background: var(--warning); color: #fff; }
  .btn-warning { background: var(--gold); color: #000; }
  .input-field { min-height: 44px; width: 100%; padding: 0.6rem; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #e2e8f0; font-size: 0.875rem; outline: none; }
  .input-field:focus { border-color: var(--neon); }
  .section-title { font-size: 0.9375rem; font-weight: 700; margin-bottom: 0.8rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.5rem; }
  .shift-btn { min-height: 44px; padding: 0.5rem 0.8rem; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.8125rem; background: #1e293b; color: #e2e8f0; transition: 0.3s; }
  .shift-btn.active { background: #10b981; color: #000; border-color: #10b981; }
  .check-label { display: flex; align-items: center; gap: 0.6rem; padding: 0.6rem; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; cursor: pointer; font-size: 0.875rem; font-weight: 500; color: #e2e8f0; transition: all 0.2s; user-select: none; min-height: 48px; }
  .check-label:hover { background: rgba(30, 41, 59, 0.8); border-color: rgba(0,255,157,0.4); }
  .check-label.checked { background: rgba(16,185,129,0.15); border-color: #10b981; color: #10b981; }
  .check-label input[type="checkbox"] { cursor: pointer; width: 20px; height: 20px; accent-color: #00ff9d; flex-shrink: 0; }
  .check-label span { flex: 1; }
  .mini-stat { background: rgba(15,23,42,0.6); border: 1px solid rgba(255,255,255,0.08); border-radius: 0.5rem; padding: 0.5rem; text-align: center; }
  .mini-stat-val { font-size: 1.2rem; font-weight: 700; color: #e2e8f0; }
  .mini-stat-label { font-size: 0.875rem; color: #cbd5e1; }
  .foto-preview-container { margin-top: 0.5rem; text-align: center; }
  .foto-preview-container img { max-width: 100%; max-height: 200px; border-radius: 8px; border: 1px solid var(--neon); display: none; }
  .btn-clear-foto { margin-top: 0.3rem; font-size: 0.75rem; padding: 0.3rem 0.6rem; display: none; }
</style>

<button class="back-btn" onclick="window.goHome()">← HOME</button>

<div style="max-width: 900px; margin: 0 auto; padding: 3.5rem 0.8rem 5rem;">
  <div class="glass" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
    <div>
      <h2 style="color: var(--neon); margin: 0; font-size: 1.1rem;">🧹 Janitor Indoor</h2>
      <p style="color: #cbd5e1; font-size: 0.875rem; margin: 0;">Ceklis Harian • Hybrid Cloud • Auto-Compress</p>
    </div>
    <div style="display: flex; gap: 0.3rem; flex-wrap: wrap;">
      <button class="btn btn-warning" onclick="showHistory()">📜 Riwayat</button>
      <button class="btn btn-success" onclick="exportCSV()">📥 CSV</button>
      <button class="btn btn-primary" onclick="submitToCloud()">☁️ Submit</button>
      <button class="btn" style="background: #6366f1; color: #fff;" onclick="cetakLaporan()">🖨️ Cetak</button>
    </div>
  </div>

  <div class="glass">
    <div class="section-title" style="color: var(--accent);">👤 Petugas & Lokasi</div>
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem;">
      <input type="text" id="ji-petugas" class="input-field" placeholder="Nama Petugas" oninput="saveMeta()">
      <input type="text" id="ji-gedung" class="input-field" placeholder="Gedung" oninput="saveMeta()">
      <input type="text" id="ji-lantai" class="input-field" placeholder="Lantai" oninput="saveMeta()">
    </div>
    
    <div style="margin-top: 0.5rem;">
      <label style="color: #cbd5e1; font-size: 0.8125rem; display: block; margin-bottom: 0.3rem;">📸 Foto Kondisi Area (Auto-Compress)</label>
      <div style="display:flex; gap:0.5rem; margin-bottom:0.3rem;">
        <input type="file" id="ji-foto-camera" accept="image/*" capture="environment" onchange="handlePhoto(this, 'ji-foto-preview')" style="display:none;">
        <input type="file" id="ji-foto-gallery" accept="image/*" onchange="handlePhoto(this, 'ji-foto-preview')" style="display:none;">
        <button type="button" onclick="document.getElementById('ji-foto-camera').click()" class="btn btn-primary" style="flex:1;">📷 Kamera</button>
        <button type="button" onclick="document.getElementById('ji-foto-gallery').click()" class="btn btn-success" style="flex:1;">🖼️ Galeri</button>
      </div>
      <div id="ji-foto-status" style="font-size:0.72rem; margin:0.3rem 0; min-height:1rem;"></div>
      <div class="foto-preview-container">
        <img id="ji-foto-preview">
        <button type="button" onclick="clearPhoto()" class="btn btn-danger btn-clear-foto" id="btn-clear-photo">✕ Hapus Foto</button>
      </div>
    </div>
  </div>

  <div class="glass" style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;">
    <input type="date" id="ji-date" class="input-field" style="flex: 1; min-width: 150px; width: auto;" onchange="changeDate()">
    <div style="display: flex; gap: 0.3rem;">
      <button class="shift-btn active" id="btn-pagi" onclick="setShift('pagi')">🌅 Pagi</button>
      <button class="shift-btn" id="btn-siang" onclick="setShift('siang')">☀️ Siang</button>
      <button class="shift-btn" id="btn-sore" onclick="setShift('sore')">🌇 Sore</button>
    </div>
    <button class="btn btn-danger" onclick="resetShift()" style="margin-left: auto;">Reset Shift</button>
  </div>

  <div class="glass" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; text-align: center;">
    <div class="mini-stat"><div class="mini-stat-val" id="stat-total">0</div><div class="mini-stat-label">Total Item</div></div>
    <div class="mini-stat"><div class="mini-stat-val" id="stat-checked">0</div><div class="mini-stat-label" style="color: #10b981;">Selesai</div></div>
    <div class="mini-stat"><div class="mini-stat-val" id="stat-percent">0%</div><div class="mini-stat-label" style="color: #f59e0b;">Progress</div></div>
  </div>

  <div id="ji-checklist" style="display: flex; flex-direction: column; gap: 0.75rem;"></div>
</div>

<div id="history-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 99999; overflow-y: auto; padding: 1rem;">
  <div style="max-width: 800px; margin: 0 auto; background: #0f172a; border: 1px solid var(--neon); border-radius: 16px; padding: 1.5rem;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
      <h3 style="color: var(--neon); margin: 0;">📜 Riwayat Janitor Indoor</h3>
      <button onclick="closeHistory()" class="btn btn-danger">✕ Tutup</button>
    </div>
    <div id="history-content"></div>
    <div id="history-pagination" style="display:flex; gap:0.3rem; justify-content:center; margin-top:1rem;"></div>
  </div>
</div>

<script>
(function() {
  'use strict';
  
  // === ENTERPRISE CONFIG (DreamOSConfig) ===
  var CFG = window.DreamOSConfig || {};
  
  // === XSS SANITIZER (delegate DreamOSSecurity) ===
  function esc(s) {
    if (window.DreamOSSecurity && window.DreamOSSecurity.esc) return window.DreamOSSecurity.esc(s);
    if (s === null || s === undefined || s === '') return '';
    return String(s).replace(/[&<>"'`=/]/g, function(c) {
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;','=':'&#61;','/':'&#47;'})[c];
    });
  }
  
  function _toast(msg, type) {
    if (typeof window.showToast === 'function') window.showToast(msg, type || 'info');
    else alert(msg);
  }

  const AREAS = {
    toilet_male: { title: '🚹 Toilet Laki-Laki', items: ['Pintu Utama','Pintu Kubikal','Kaca / Cermin','Exhoust','Dinding','Tempat Wudhu','Lantai','Floor Drain','Kloset','Flapond / Ceilling','Tempat Sampah','Tempat Handsoap','Gayung','Ember','Hanger / Gantungan Pakaian'] },
    toilet_female: { title: '🚺 Toilet Perempuan', items: ['Pintu Utama','Pintu Kubikal','Kaca / Cermin','Exhoust','Dinding','Tempat Wudhu','Lantai','Floor Drain','Kloset','Flapond / Ceilling','Tempat Sampah','Tempat Handsoap','Gayung','Ember','Hanger / Gantungan Pakaian'] },
    ruangan: { title: '🏢 Ruangan', items: ['Loby Utama','Teras','Lorong Utama Gedung','Balkon','Pintu Utama','Pintu Kelas dan R Lain','Jendela','Kelas','Aula','Sentra Musik','Sentra Kreasi','UKS','Psikolog','Lab Kom','Lab IPA','Perpustakaan','Kepala Sekolah','R.Guru (Laki/Perempuan)','R. Pemasaran','R. Admin TU','R. Rapat','R.CEO, Direktur dan Yayasan','R. Kepala Bidang (Kabid)','R. Osis','R. Mushalla','R. Inklusi','R. Gudang Olah Raga','R. Serbaguna','R. Masjid','Kantin','Saung Besar','Saung Kecil','Pos','Gudang Umum','Tangga','Lift','Keterangan Dll'] }
  };

  // ===== STATE MANAGEMENT (CLEAN) =====
  let state = {
    date: new Date().toISOString().split('T')[0],
    shift: 'pagi',
    data: {},
    expanded: { toilet_male: true, toilet_female: true, ruangan: true },
    currentFotoBase64: null,
    currentFotoUrl: null,
    currentFotoStatus: null,
    historyPage: 0,
    historyPageSize: (CFG.HISTORY_PAGE_SIZE || 10)
  };

  // ===== STORAGE HELPERS (with quota handling) =====
  function safeGet(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); }
    catch(e) { return fallback; }
  }
  function safeSet(key, data) {
    try {
      window.safeStorageSet(key, JSON.stringify(data));
    } catch(e) {
      // Quota exceeded — buang foto base64 lama (bukan data checklist)
      try {
        var all = safeGet('dreamos_janitor_indoor', {});
        var dates = Object.keys(all).sort();
        // Hapus foto dari tanggal tertua
        for (var i = 0; i < Math.min(3, dates.length); i++) {
          if (all[dates[i]] && all[dates[i]].photos) {
            all[dates[i]].photos = {};
          }
        }
        window.safeStorageSet('dreamos_janitor_indoor', JSON.stringify(all));
        window.safeStorageSet(key, JSON.stringify(data));
        if (window.showToast) showToast('⚠️ Storage penuh, foto lama dibersihkan', 'warning');
      } catch(e2) {
        if (window.showToast) showToast('❌ Storage sangat penuh', 'error');
      }
    }
  }

  // ===== PHOTO HANDLING (single clean version) =====
  window.handlePhoto = function(input, previewId) {
    if (!input.files || !input.files[0]) return;
    const file = input.files[0];
    
    // Validasi
    if (!file.type.startsWith('image/')) {
      if (window.showToast) showToast('⚠️ File harus berupa gambar', 'error');
      input.value = '';
      return;
    }
    if (file.size > (CFG.MAX_PHOTO_SIZE_BYTES || 10 * 1024 * 1024)) {
      if (window.showToast) showToast('⚠️ Maksimal 10MB', 'error');
      input.value = '';
      return;
    }

    const statusEl = document.getElementById('ji-foto-status');
    const clearBtn = document.getElementById('btn-clear-photo');
    const reader = new FileReader();
    
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        // Compress via canvas
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = (CFG.PHOTO_MAX_WIDTH || 800);
        const scaleSize = MAX_WIDTH / img.width;
        canvas.width = MAX_WIDTH;
        canvas.height = img.height * scaleSize;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        
        state.currentFotoBase64 = canvas.toDataURL('image/jpeg', (CFG.PHOTO_QUALITY || 0.6));
        
        const preview = document.getElementById(previewId);
        if (preview) {
          preview.src = state.currentFotoBase64;
          preview.style.display = 'block';
        }
        if (clearBtn) clearBtn.style.display = 'inline-block';
        
        // Cleanup memory
        canvas.width = 0; canvas.height = 0;
        try { img.src = ''; } catch(_){}
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);

    // Cloud upload (single, clean)
    (async function(){
      if (!window.CloudPhoto) {
        if (statusEl) statusEl.innerHTML = '<span style="color:#f59e0b;">⚠️ CloudPhoto tidak aktif — base64 lokal</span>';
        return;
      }
      if (statusEl) statusEl.innerHTML = '<span style="color:#0ea5e9;">☁️ Mengunggah ke cloud…</span>';
      try {
        var url = await window.CloudPhoto.upload(file, 'janitor-photos');
        state.currentFotoUrl = url;
        state.currentFotoStatus = 'cloud';
        if (statusEl) statusEl.innerHTML = '<span style="color:#10b981;">✅ Cloud tersimpan (' + Math.round(file.size/1024) + ' KB)</span>';
      } catch(e) {
        state.currentFotoStatus = 'offline';
        if (statusEl) statusEl.innerHTML = '<span style="color:#f59e0b;">⚠️ Cloud gagal — base64 fallback</span>';
      }
    })();
  };

  window.clearPhoto = function() {
    state.currentFotoBase64 = null;
    state.currentFotoUrl = null;
    state.currentFotoStatus = null;
    var i1 = document.getElementById('ji-foto-camera'); if (i1) i1.value = '';
    var i2 = document.getElementById('ji-foto-gallery'); if (i2) i2.value = '';
    var preview = document.getElementById('ji-foto-preview');
    if (preview) preview.style.display = 'none';
    var clearBtn = document.getElementById('btn-clear-photo');
    if (clearBtn) clearBtn.style.display = 'none';
    var statusEl = document.getElementById('ji-foto-status');
    if (statusEl) statusEl.textContent = '';
  };

  // ===== CORE DATA FUNCTIONS =====
  function loadData() {
    let all = safeGet('dreamos_janitor_indoor', {});
    if (!all[state.date]) {
      all[state.date] = { shifts: { pagi: {}, siang: {}, sore: {} }, photos: {}, petugas: '', gedung: '', lantai: '' };
    }
    if (!all[state.date].shifts) all[state.date].shifts = { pagi: {}, siang: {}, sore: {} };
    if (!all[state.date].photos) all[state.date].photos = {};
    state.data = all;
    document.getElementById('ji-petugas').value = all[state.date].petugas || '';
    document.getElementById('ji-gedung').value = all[state.date].gedung || '';
    document.getElementById('ji-lantai').value = all[state.date].lantai || '';
    document.getElementById('ji-date').value = state.date;
    updateShiftBtns();
    renderChecklist();
    updateStats();
  }

  window.saveMeta = function() {
    if (!state.data[state.date]) {
      state.data[state.date] = { shifts: { pagi: {}, siang: {}, sore: {} }, photos: {}, petugas: '', gedung: '', lantai: '' };
    }
    state.data[state.date].petugas = document.getElementById('ji-petugas').value;
    state.data[state.date].gedung = document.getElementById('ji-gedung').value;
    state.data[state.date].lantai = document.getElementById('ji-lantai').value;
    safeSet('dreamos_janitor_indoor', state.data);
  };

  window.changeDate = function() {
    state.date = document.getElementById('ji-date').value;
    clearPhoto();
    loadData();
  };

  window.setShift = function(sh) {
    state.shift = sh;
    updateShiftBtns();
    renderChecklist();
    updateStats();
  };

  function updateShiftBtns() {
    document.getElementById('btn-pagi').classList.toggle('active', state.shift === 'pagi');
    document.getElementById('btn-siang').classList.toggle('active', state.shift === 'siang');
    document.getElementById('btn-sore').classList.toggle('active', state.shift === 'sore');
  }

  window.toggleItem = function(area, item, checkbox, event) {
    if (event) event.stopPropagation();
    if (!state.data[state.date].shifts[state.shift]) state.data[state.date].shifts[state.shift] = {};
    if (!state.data[state.date].shifts[state.shift][area]) state.data[state.date].shifts[state.shift][area] = {};
    state.data[state.date].shifts[state.shift][area][item] = checkbox.checked;
    safeSet('dreamos_janitor_indoor', state.data);
    checkbox.closest('.check-label').classList.toggle('checked', checkbox.checked);
    updateStats();
  };

  window.toggleExpand = function(area, event) {
    if (event) event.stopPropagation();
    state.expanded[area] = !state.expanded[area];
    renderChecklist();
  };

  function updateStats() {
    let shiftData = (state.data[state.date] && state.data[state.date].shifts[state.shift]) || {};
    let total = 0, checked = 0;
    Object.keys(AREAS).forEach(areaKey => {
      let area = AREAS[areaKey];
      let aData = shiftData[areaKey] || {};
      total += area.items.length;
      area.items.forEach(it => { if (aData[it]) checked++; });
    });
    let pct = total > 0 ? Math.round((checked / total) * 100) : 0;
    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-checked').textContent = checked;
    document.getElementById('stat-percent').textContent = pct + '%';
  }

  // ===== PHOTO PER AREA (compressed, cloud-first) =====
  window.uploadPhoto = function(area, event) {
    if (event) event.stopPropagation();
    let input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.capture = 'environment';
    input.onchange = function(e) {
      let file = e.target.files[0];
      if (!file) return;
      
      // Validasi
      if (!file.type.startsWith('image/')) {
        if (window.showToast) showToast('⚠️ File harus gambar', 'error');
        return;
      }
      if (file.size > (CFG.MAX_PHOTO_SIZE_BYTES || 10 * 1024 * 1024)) {
        if (window.showToast) showToast('⚠️ Maksimal 10MB', 'error');
        return;
      }
      
      let reader = new FileReader();
      reader.onload = function(ev) {
        // Compress via canvas
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = (CFG.PHOTO_AREA_MAX_WIDTH || 600);
          const scaleSize = MAX_WIDTH / img.width;
          canvas.width = MAX_WIDTH;
          canvas.height = img.height * scaleSize;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          
          let key = state.shift + '-' + area;
          let base64 = canvas.toDataURL('image/jpeg', (CFG.PHOTO_AREA_QUALITY || 0.5));
          
          try {
            state.data[state.date].photos[key] = base64;
            safeSet('dreamos_janitor_indoor', state.data);
          } catch(e) {
            if (window.showToast) showToast('⚠️ Storage penuh, foto gagal disimpan', 'error');
          }
          renderChecklist();
          
          // Cleanup
          canvas.width = 0; canvas.height = 0;
          try { img.src = ''; } catch(_){}
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    };
    input.click();
  };

  window.resetShift = function() {
    if (!confirm('Reset checklist shift ' + state.shift + '?')) return;
    if (state.data[state.date] && state.data[state.date].shifts) {
      state.data[state.date].shifts[state.shift] = {};
      safeSet('dreamos_janitor_indoor', state.data);
      renderChecklist();
      updateStats();
      if (window.showToast) showToast('✅ Shift ' + state.shift + ' direset', 'success');
    }
  };

  function renderChecklist() {
    let container = document.getElementById('ji-checklist');
    let html = '';
    Object.keys(AREAS).forEach(areaKey => {
      let area = AREAS[areaKey];
      let shiftData = (state.data[state.date] && state.data[state.date].shifts[state.shift] && state.data[state.date].shifts[state.shift][areaKey]) || {};
      let checked = area.items.filter(it => shiftData[it]).length;
      let total = area.items.length;
      let pct = Math.round((checked / total) * 100);
      let col = pct === 100 ? '#10b981' : pct >= 50 ? '#f59e0b' : '#ef4444';
      let photoKey = state.shift + '-' + areaKey;
      let photo = state.data[state.date].photos[photoKey];
      let isExp = state.expanded[areaKey];

      html += '<div class="glass">';
      html += '<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.3rem;">';
      html += '<div style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;" onclick="toggleExpand(\'' + esc(areaKey) + '\', event)">';
      html += '<h4 style="color: var(--neon); font-size: 0.9375rem; margin: 0;">' + esc(area.title) + '</h4>';
      html += '<span style="font-size: 0.8125rem; color: #cbd5e1;">' + checked + '/' + total + '</span></div>';
      html += '<div style="display: flex; align-items: center; gap: 0.5rem;">';
      html += '<button onclick="uploadPhoto(\'' + areaKey + '\', event)" class="btn" style="background: rgba(59,130,246,0.2); color: #3b82f6; padding: 0.2rem 0.5rem; font-size: 0.8125rem;">' + (photo ? '📸✓' : '📸') + '</button>';
      html += '<div style="width: 60px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px;"><div style="width: ' + pct + '%; height: 100%; background: ' + col + '; border-radius: 3px; transition: 0.3s;"></div></div>';
      html += '</div></div>';
      if (photo) html += '<img src="' + esc(photo) + '" loading="lazy" decoding="async" style="max-width: 100%; max-height: 120px; border-radius: 8px; margin-bottom: 0.5rem;">';
      if (isExp) {
        html += '<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.3rem; margin-top: 0.3rem;">';
        area.items.forEach(item => {
          let isChecked = shiftData[item] ? true : false;
          html += '<label class="check-label ' + (isChecked ? 'checked' : '') + '">';
          html += '<input type="checkbox" ' + (isChecked ? 'checked' : '') + ' onchange="toggleItem(\'' + esc(areaKey) + '\', \'' + esc(item).replace(/'/g, "\\'") + '\', this, event)"> ';
          html += '<span>' + esc(item) + '</span></label>';
        });
        html += '</div>';
      }
      html += '</div>';
    });
    container.innerHTML = html;
  }

  // ===== HISTORY WITH PAGINATION =====
  window.showHistory = function() {
    state.historyPage = 0;
    renderHistoryPage();
    document.getElementById('history-modal').style.display = 'block';
  };

  function renderHistoryPage() {
    let all = safeGet('dreamos_janitor_indoor', {});
    let entries = [];
    
    // Build flat entries list
    Object.keys(all).sort().reverse().forEach(date => {
      let dayData = all[date];
      ['pagi', 'siang', 'sore'].forEach(shift => {
        if (dayData.shifts && dayData.shifts[shift]) {
          let shiftData = dayData.shifts[shift];
          let hasData = Object.keys(shiftData).some(area => 
            Object.keys(shiftData[area] || {}).some(item => shiftData[area][item])
          );
          if (hasData || dayData.petugas) {
            let total = 0, checked = 0;
            Object.keys(AREAS).forEach(areaKey => {
              let aData = shiftData[areaKey] || {};
              total += AREAS[areaKey].items.length;
              AREAS[areaKey].items.forEach(it => { if (aData[it]) checked++; });
            });
            let pct = total > 0 ? Math.round((checked / total) * 100) : 0;
            entries.push({ date, shift, dayData, checked, total, pct });
          }
        }
      });
    });

    let totalPages = Math.ceil(entries.length / state.historyPageSize);
    let start = state.historyPage * state.historyPageSize;
    let pageEntries = entries.slice(start, start + state.historyPageSize);

    let html = '';
    if (!entries.length) {
      html = '<p style="text-align: center; color: #cbd5e1; padding: 2rem;">Belum ada riwayat</p>';
    } else {
      pageEntries.forEach(e => {
        html += '<div class="glass" style="margin-bottom: 0.5rem;">';
        html += '<h4 style="color: var(--neon); margin: 0;">📅 ' + new Date(e.date).toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) + ' - ' + e.shift.toUpperCase() + '</h4>';
        html += '<p style="font-size: 0.8125rem; color: #cbd5e1;">👤 ' + esc(e.dayData.petugas || '-') + ' | 🏢 ' + esc(e.dayData.gedung || '-') + ' | Lantai: ' + esc(e.dayData.lantai || '-') + '</p>';
        html += '<p style="font-size: 0.8125rem;">✅ Progress: ' + e.checked + '/' + e.total + ' (' + e.pct + '%)</p>';
        html += '</div>';
      });
    }
    document.getElementById('history-content').innerHTML = html;

    // Pagination controls
    let pagHtml = '';
    if (totalPages > 1) {
      pagHtml += '<button class="btn btn-outline" onclick="historyNav(-1)" ' + (state.historyPage === 0 ? 'disabled style="opacity:0.4;"' : '') + '>◀ Prev</button>';
      pagHtml += '<span style="color:#cbd5e1; padding:0.5rem;">' + (state.historyPage + 1) + ' / ' + totalPages + '</span>';
      pagHtml += '<button class="btn btn-outline" onclick="historyNav(1)" ' + (state.historyPage >= totalPages - 1 ? 'disabled style="opacity:0.4;"' : '') + '>Next ▶</button>';
    }
    document.getElementById('history-pagination').innerHTML = pagHtml;
  }

  window.historyNav = function(delta) {
    state.historyPage += delta;
    renderHistoryPage();
  };

  window.closeHistory = function() { 
    document.getElementById('history-modal').style.display = 'none'; 
  };

  // ===== EXPORT CSV (with UTF-8 BOM) =====
  window.exportCSV = function() {
    let all = safeGet('dreamos_janitor_indoor', {});
    let dates = Object.keys(all).sort().reverse();
    let csv = 'Tanggal,Shift,Petugas,Gedung,Lantai,Area,Item,Status\n';
    dates.forEach(date => {
      let dayData = all[date];
      ['pagi', 'siang', 'sore'].forEach(shift => {
        if (dayData.shifts && dayData.shifts[shift]) {
          Object.keys(dayData.shifts[shift]).forEach(area => {
            Object.keys(dayData.shifts[shift][area] || {}).forEach(item => {
              csv += date + ',' + shift + ',' + (dayData.petugas || '') + ',' + (dayData.gedung || '') + ',' + (dayData.lantai || '') + ',"' + area + '","' + item + '",' + (dayData.shifts[shift][area][item] ? 'Bersih' : 'Belum') + '\n';
            });
          });
        }
      });
    });
    let blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href = url;
    a.download = 'janitor_indoor_' + new Date().toISOString().split('T')[0] + '.csv';
    a.click();
    URL.revokeObjectURL(url);
    if (window.showToast) showToast('✅ CSV ter-export', 'success');
  };

  // ===== PRINT (with cleanup) =====
  window.cetakLaporan = function() {
    let shiftData = (state.data[state.date] && state.data[state.date].shifts[state.shift]) || {};
    let win = window.open('', '_blank', 'width=900,height=600');
    let doc = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Laporan Janitor Indoor</title><style>body{font-family:sans-serif;padding:20px;color:#111;}h2,h3{text-align:center;}table{width:100%;border-collapse:collapse;margin:10px 0;}th,td{border:1px solid #000;padding:6px;text-align:left;}th{background:#eee;}.chk{color:#10b981;font-weight:bold;}.unchk{color:#ef4444;}img{max-width:300px;}@media print{button{display:none;}}</style>
  
</head>
<body>`;
    doc += '<h2>LAPORAN JANITOR INDOOR</h2>';
    doc += '<p style="text-align:center;">Tanggal: ' + new Date(state.date).toLocaleDateString('id-ID') + ' | Shift: ' + state.shift.toUpperCase() + '</p>';
    doc += '<p><strong>Petugas:</strong> ' + (document.getElementById('ji-petugas').value || '-') + ' | <strong>Gedung:</strong> ' + (document.getElementById('ji-gedung').value || '-') + ' | <strong>Lantai:</strong> ' + (document.getElementById('ji-lantai').value || '-') + '</p>';
    doc += '<button onclick="window.print()" style="padding:8px 16px;background:#6366f1;color:white;border:none;border-radius:4px;cursor:pointer;margin-bottom:15px;">🖨️ Cetak</button>';
    Object.keys(AREAS).forEach(areaKey => {
      let area = AREAS[areaKey];
      let aData = shiftData[areaKey] || {};
      doc += '<h3>' + area.title + '</h3><table><tr><th>Item</th><th>Status</th></tr>';
      area.items.forEach(it => { 
        doc += '<tr><td>' + it + '</td><td class="' + (aData[it] ? 'chk' : 'unchk') + '">' + (aData[it] ? '✅ Bersih' : '❌ Belum') + '</td></tr>'; 
      });
      doc += '</table>';
      let pKey = state.shift + '-' + areaKey;
      let photo = state.data[state.date].photos[pKey];
      if (photo) {
        // Use URL if available (lighter), else base64
        let src = photo.indexOf('http') === 0 ? photo : photo;
        doc += '<p><strong>Foto:</strong><br><img src="' + src + '" loading="lazy"></p>';
      }
    });
    doc += '<p style="margin-top:30px;text-align:right;">Mengetahui,<br><br><br>Kepala Bagian Umum</p></body></html>';
    win.document.write(doc);
    win.document.close();
  };

  // ===== SUBMIT TO CLOUD =====
  window.submitToCloud = async function() {
    let petugas = document.getElementById('ji-petugas').value;
    let gedung = document.getElementById('ji-gedung').value;
    if (!petugas || !gedung) {
      if (window.showToast) showToast('⚠️ Isi Nama Petugas & Gedung', 'error');
      return;
    }
    
    let payload = {
      id: 'ji_' + Date.now(),
      petugas, gedung,
      lantai: document.getElementById('ji-lantai').value,
      tanggal: state.date,
      shift: state.shift,
      checklist: state.data[state.date].shifts[state.shift],
      foto: state.currentFotoUrl || state.currentFotoBase64 || null,
      foto_source: state.currentFotoStatus || (state.currentFotoBase64 ? 'offline' : null),
      foto_uploaded_at: (state.currentFotoUrl || state.currentFotoBase64) ? new Date().toISOString() : null,
      created_at: new Date().toISOString()
    };

    if (window.supabaseClient) {
      try {
        let { error } = await window.supabaseClient.from('janitor_indoor').insert(payload);
        if (error) throw error;
        if (window.showToast) showToast('✅ Data terkirim ke cloud!', 'success');
        
        // Cleanup state foto
        clearPhoto();
        
        // Trigger notification
        if (typeof window.addNotification === 'function') {
          window.addNotification('success', '✅ Ceklis Indoor Diserahkan',
            'Shift ' + state.shift + ' oleh ' + petugas + ' telah disubmit.',
            'janitor', ['koordinator_umum', 'kabag_umum', 'dev']);
        }
        if (window.BankAudit) BankAudit.log('JANITOR_INDOOR_SUBMIT', { petugas, gedung, shift: state.shift });
      } catch (e) {
        console.warn('Janitor Indoor sync error:', e.message);
        if (window.OfflineQueue) {
          window.OfflineQueue.add('janitor_indoor', 'insert', payload);
          if (window.showToast) showToast('⚠️ Data masuk antrian offline', 'warning');
        } else {
          if (window.showToast) showToast('❌ Gagal sync: ' + e.message, 'error');
        }
      }
    } else {
      if (window.OfflineQueue) {
        window.OfflineQueue.add('janitor_indoor', 'insert', payload);
        if (window.showToast) showToast('✅ Data masuk antrian offline', 'success');
      } else {
        if (window.showToast) showToast('⚠️ Koneksi tidak tersedia', 'warning');
      }
    }
  };

  // ===== INIT dengan ERROR BOUNDARY =====
  try {
    loadData();
    if (window.BankAudit && window.BankAudit.log) {
      try { BankAudit.log('ACCESS_JANITOR_INDOOR', { role: window.getUserRole ? window.getUserRole() : 'staff' }); } catch(_){}
    }
    console.log('🧹 Janitor Indoor Ready — Enterprise Clean Architecture');
  } catch(initErr) {
    console.error('[JanIndoor] init error:', initErr);
    if (window.DreamOSSecurity && window.DreamOSSecurity.report) window.DreamOSSecurity.report(initErr);
    _toast('⚠️ Gagal init Janitor Indoor: ' + (initErr.message || initErr), 'error');
    var container = document.getElementById('ji-checklist');
    if (container) container.innerHTML = '<div class="glass" style="color:#ef4444;text-align:center;">⚠️ Error: ' + esc(initErr.message || String(initErr)) + '</div>';
  }
})();
</script>

<script>
(function(){
  // v85: binding eksplisit (backup kalau inline onclick mati)
  function bind(id, fn){ var el = document.getElementById(id); if(el && !el.__v85){ el.__v85 = true; el.addEventListener('click', fn); } }

  // Modal riwayat: klik backdrop (luar box) = tutup
  var hm = document.getElementById('history-modal');
  if (hm && !hm.__v85bg) {
    hm.__v85bg = true;
    hm.addEventListener('click', function(e){ if (e.target === hm && typeof window.closeHistory === 'function') window.closeHistory(); });
  }
  // Tombol TUTUP: binding ganda (inline + listener)
  if (hm) {
    var tb = hm.querySelector('button.btn-danger');
    if (tb && !tb.__v85) { tb.__v85 = true; tb.addEventListener('click', function(){ if (typeof window.closeHistory === 'function') window.closeHistory(); }); }
  }
  // Shift buttons: binding ganda (idempotent, aman)
  ['pagi','siang','sore'].forEach(function(s){
    bind('btn-' + s, function(){ if (typeof window.setShift === 'function') window.setShift(s); });
  });
  // Reset + aksi utama
  var rb = document.querySelector('[onclick*="resetShift"]');
  if (rb && !rb.__v85) { rb.__v85 = true; rb.addEventListener('click', function(){ if (typeof window.resetShift === 'function') window.resetShift(); }); }
  console.log('[v85] explicit bindings ready');
})();
</script>
