<script id="qr-theme-js">
(function(){
  function applyTheme(){
    var theme = 'dark';
    try {
      theme = (window.parent && window.parent.document && window.parent.document.documentElement.getAttribute('data-theme')) || 
              localStorage.getItem('dreamos_theme') || 'dark';
    } catch(e){ theme = localStorage.getItem('dreamos_theme') || 'dark'; }
    document.documentElement.setAttribute('data-theme', theme);
    if (theme === 'light') document.body.classList.add('light-theme');
    else document.body.classList.remove('light-theme');
  }
  applyTheme();
  try {
    var parentRoot = window.parent && window.parent.document && window.parent.document.documentElement;
    if (parentRoot) new MutationObserver(applyTheme).observe(parentRoot, { attributes: true, attributeFilter: ['data-theme'] });
  } catch(e){}
  window.addEventListener('storage', function(e){ if (e.key === 'dreamos_theme') applyTheme(); });
})();
</script>

    function generate(){
        var type = state.currentType;
        var data = '';
        var useLogo = document.getElementById('qr-logo')?.checked || false;
        var useGeo = document.getElementById('qr-geo')?.checked || false;
        var encrypt = document.getElementById('qr-encrypt')?.checked || false;
        var expire = document.getElementById('qr-expire')?.checked || false;
        
        if(type==='asset') data = 'DREAMOS-ASSET:'+(document.getElementById('asset-select')?.value||'');
        else if(type==='inventory') data = 'DREAMOS-INV:'+(document.getElementById('inventory-select')?.value||'');
        else if(type==='gudang') data = 'DREAMOS-GDG:'+(document.getElementById('gudang-select')?.value||'');
        else if(type==='wifi') data = 'WIFI:S:'+(document.getElementById('wifi-ssid')?.value||'')+';T:'+(document.getElementById('wifi-enc')?.value||'WPA')+';P:'+(document.getElementById('wifi-pass')?.value||'')+';;';
        else if(type==='contact') {
            var vcard = 'BEGIN:VCARD\nVERSION:3.0\n';
            vcard += 'FN:'+(document.getElementById('contact-name')?.value||'')+'\n';
            vcard += 'TEL:'+(document.getElementById('contact-tel')?.value||'')+'\n';
            if(document.getElementById('contact-email')?.value) vcard += 'EMAIL:'+(document.getElementById('contact-email').value)+'\n';
            if(document.getElementById('contact-org')?.value) vcard += 'ORG:'+(document.getElementById('contact-org').value)+'\n';
            vcard += 'END:VCARD';
            data = vcard;
        }
        else data = (document.getElementById('qr-data')?.value||'').trim();
        
        if(!data || data.split(':').pop()==='') { if(window.showToast) showToast('⚠️ Masukkan data payload!','error'); else _toast('⚠️ Masukkan data payload!', 'warning'); return; }
        
        if(encrypt || type==='encrypted') data = 'ENC:' + encryptData(data);
        if(expire || type==='expiring') {
            var expTime = document.getElementById('qr-expire-date')?.value;
            if(!expTime) { if(window.showToast) showToast('⚠️ Waktu expired wajib diisi!','error'); else _toast('⚠️ Waktu expired wajib diisi!', 'warning'); return; }
            data = 'EXP:' + new Date(expTime).getTime() + ':' + data;
        }
        if(useGeo) data = 'GEO:' + DEPOK_LAT + ',' + DEPOK_LNG + ':' + data;

        var imgUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=350x350&data='+encodeURIComponent(data);
        if(useLogo) {
            var logoUrl = encodeURIComponent('https://dreamos-sys.github.io/assets/logo-sultan.png');
            imgUrl = 'https://quickchart.io/qr?size=350&margin=2&text='+encodeURIComponent(data)+'&centerImageUrl='+logoUrl;
        }

        state.currentImg = imgUrl; state.currentData = data;
        document.getElementById('qr-image-container').innerHTML = '<img src="'+state.currentImg+'" style="max-width:100%;border-radius:1rem;border:4px solid #00ff9d;box-shadow:0 0 20px rgba(0,255,157,0.4);">';
        document.getElementById('qr-save-area').style.display = 'flex';
    }

    function executePayload(dataStr) {
        var resBox = document.getElementById('scan-result');
        if(!resBox) return;
        
        resBox.style.display = 'block';
        resBox.style.background = 'rgba(0, 255, 157, 0.1)';
        setTimeout(() => { resBox.style.background = 'rgba(0,0,0,0.5)'; }, 300);

        var displayData = dataStr;
        var actionHtml = '';
        var timestamp = '🕒 Scanned: ' + new Date().toLocaleString('id-ID');
        
        if (dataStr.startsWith('DREAMOS-ASSET:')) {
            var id = dataStr.split(':')[1];
            var assets = getData('dreamos_assets');
            var asset = assets.find(a => a.id === id);
            if (asset) {
                displayData = '🏢 <b>[ASET INTERNAL]</b><br>' + (asset.nama || asset.name) + '<br>📍 Lokasi: ' + (asset.lokasi || asset.location || 'Unknown');
                actionHtml = '<span style="color:#0ea5e9;font-weight:700;">✅ Sinkronisasi Modul Aset (Auto-Load)...</span>';
            } else {
                displayData = '❌ <b>[ASET TIDAK DITEMUKAN]</b><br>ID: ' + id;
            }
        } 
        else if (dataStr.startsWith('http://') || dataStr.startsWith('https://')) {
            displayData = '🌐 <b>[WEB LINK / URL]</b><br>' + dataStr;
            actionHtml = '<span style="color:#3b82f6;font-weight:700;">🚀 Mengalihkan Tab Secara Otomatis...</span>';
            setTimeout(() => window.open(dataStr, '_blank'), 800);
        }
        else {
            var cleanId = dataStr.replace('DREAMOS-INV:', '').replace('DREAMOS-GDG:', '');
            var inv = getData('dreamos_inventory');
            var item = inv.find(i => i.id === cleanId || i.barcode === cleanId);
            
            if (item) {
                displayData = '📦 <b>[STOK GUDANG TERIDENTIFIKASI]</b><br>' + (item.nama || item.nama_barang) + '<br>📊 Tersedia: ' + (item.jumlah || 0) + ' unit';
                actionHtml = '<span style="color:#10b981;font-weight:700;">✅ Terhubung ke Form Update Stok...</span>';
            } else {
                displayData = '❓ <b>[BARCODE BARU DITEMUKAN]</b><br>Data: <span style="font-family:monospace;color:#f59e0b;">' + cleanId + '</span>';
                actionHtml = '<span style="color:#f59e0b;font-weight:700;">⚡ Mengalihkan ke Modul Tambah Inventaris...</span>';
                setTimeout(() => {
                    try { if(window.parent && typeof window.parent.switchModule === 'function') {
                        window.parent.switchModule('inventory', { barcodeScan: cleanId });
                    } } catch(e) { console.warn('Parent switchModule failed:', e); }
                }, 1500);
            }
        }

        document.getElementById('scan-data').innerHTML = displayData;
        document.getElementById('scan-meta').innerHTML = timestamp + '<br>' + actionHtml;
        state.scans.unshift({ time: new Date().toISOString(), data: dataStr.substring(0,50) });
        if(state.scans.length > 100) state.scans.pop(); saveScans();
    }

    function processSmartScan(rawDecodedText) {
        var payload = rawDecodedText;
        if (payload.startsWith('GEO:')) {
            if(!navigator.geolocation) { if(window.showToast) showToast('⛔ Perangkat tidak mendukung GPS.','error'); else _toast('⛔ Perangkat tidak mendukung GPS.', 'warning'); return; }
            var geoParts = payload.substring(4).split(':'); var coords = geoParts[0].split(',');
            payload = geoParts.slice(1).join(':');
            navigator.geolocation.getCurrentPosition(function(pos) {
                var lat = pos.coords.latitude, lng = pos.coords.longitude;
                var targetLat = parseFloat(coords[0]), targetLng = parseFloat(coords[1]);
                var p = 0.017453292519943295;
                var a = 0.5 - Math.cos((targetLat - lat) * p)/2 + Math.cos(lat * p) * Math.cos(targetLat * p) * (1 - Math.cos((targetLng - lng) * p))/2;
                var distance = 12742 * Math.asin(Math.sqrt(a)); 
                if (distance > 5) return _toast('⛔ SECURITY ALERT!\nAnda berada ' + distance.toFixed(1) + ' km dari Safe Core (Depok).', 'warning');
                processNextLayers(payload);
            }, function(err) { console.warn('GPS ditolak/timeout, melanjutkan scan tanpa geo-fence'); processNextLayers(payload); }, {enableHighAccuracy: true, timeout: 10000, maximumAge: 0});
            return;
        }
        processNextLayers(payload);
    }

    function processNextLayers(payload) {
        if (payload.startsWith('EXP:')) {
            var expParts = payload.substring(4).split(':');
            var expTime = parseInt(expParts[0]); payload = expParts.slice(1).join(':');
            if (Date.now() > expTime) return _toast('⏰ QR EXPIRED pada: ' + new Date(expTime).toLocaleString('id-ID'), 'warning');
        }
        if (payload.startsWith('ENC:')) {
            var pin = prompt('🔐 SECURITY CHALLENGE\nMasukkan PIN Admin/Sistem untuk Dekripsi:');
            if (pin === '123456' || pin === 'SULTAN') {
                var decrypted = decryptData(payload.substring(4));
                if(decrypted) payload = '<span style="color:#f59e0b;">🔓 [DECRYPTED SECURE DATA]</span><br>' + decrypted;
                else { if(window.showToast) showToast('⛔ Kunci Dekripsi Gagal!','error'); else _toast('⛔ Kunci Dekripsi Gagal!', 'warning'); return; }
            } else { if(window.showToast) showToast('⛔ Akses Ditolak!','error'); else _toast('⛔ Akses Ditolak!', 'warning'); return; }
        }
        executePayload(payload);
    }

    // 📸 SAFE AUTO-RETRY SCANNER LOADER (ANTI BUG LIBRARY BELUM SIAP)
    function startScanner(retryCount){
        if(state.scanner) return;
        
        if(typeof Html5Qrcode === 'undefined') {
            retryCount = (retryCount || 0) + 1;
            if(retryCount > 40) {
                if(window.showToast) showToast('⚠️ Scanner gagal dimuat. Gunakan Input Bypass (manual scan) di bawah.','info'); else _toast('⚠️ Scanner gagal dimuat. Gunakan Input Bypass (manual scan) di bawah.', 'warning');
                var manualDiv = document.querySelector('#manual-scan-input')?.parentElement;
                if(manualDiv) manualDiv.style.display = 'block';
                return;
            }
            // Tunggu senyap selama 300ms sampai library benar-benar siap
            setTimeout(function(){ startScanner(retryCount); }, 300);
            return;
        }
        
        try {
            state.scanner = new Html5Qrcode("qr-reader");
            state.lastScanData = ''; 
            state.lastScanTime = 0;
            
            state.scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } },
                function(text){ 
                    var now = Date.now();
                    if (text === state.lastScanData && (now - state.lastScanTime) < 3000) return;
                    state.lastScanData = text;
                    state.lastScanTime = now;
                    processSmartScan(text); 
                }, function(err){}
            ).then(function(){
                var sBtn = document.querySelector('[data-qr="start-scan"]');
                var xBtn = document.querySelector('[data-qr="stop-scan"]');
                if(sBtn) sBtn.style.display = 'none';
                if(xBtn) xBtn.style.display = 'block';
            }).catch(function(err){ 
                _toast('❌ Gagal akses kamera: ' + err, 'warning'); 
                state.scanner = null; 
            });
        } catch(e) {
            state.scanner = null;
            _toast('❌ Inisialisasi Scanner Error: ' + e.message, 'warning');
        }
    }
    
    function stopScanner(){
        if(!state.scanner) return;
        state.scanner.stop().then(function(){
            state.scanner = null;
            var sBtn = document.querySelector('[data-qr="start-scan"]');
            var xBtn = document.querySelector('[data-qr="stop-scan"]');
            if(sBtn) sBtn.style.display = 'block';
            if(xBtn) xBtn.style.display = 'none';
        }).catch(function(){ state.scanner = null; });
    }

    function renderCodes(){
        var list = document.getElementById('qr-codes-list'); if(!list) return;

        filtered.forEach(function(q){ h += `<div style="background:rgba(30,41,59,0.8);padding:0.75rem;text-align:center;border-radius:0.5rem;border:1px solid rgba(0,255,157,0.1);"><img src="${q.image}" style="width:100%;max-width:120px;border-radius:0.5rem;background:#fff;padding:4px;"><div style="font-weight:800;font-size:0.8rem;margin-top:0.5rem;color:#00ff9d;">${q.label}</div><div style="font-size:0.6rem;color:#94a3b8;margin:2px 0;">🏷️ ${q.category}</div><button data-qr="delete" data-id="${q.id}" style="margin-top:0.5rem;background:#ef4444;color:white;border:none;border-radius:0.3rem;padding:0.3rem 0.6rem;font-size:0.7rem;cursor:pointer;">🗑️ Hapus</button></div>`; });

    function batchGenerate(){
        var input = prompt('Masukkan data batch (satu per baris):\n\nContoh:\nhttps://example1.com\nhttps://example2.com');
        if(!input) return;
        var lines = input.split('\n').filter(function(l){ return l.trim(); });
        if(!lines.length) { if(window.showToast) showToast('⚠️ Tidak ada data valid!','error'); else _toast('⚠️ Tidak ada data valid!', 'warning'); return; }
        var count = 0;
        lines.forEach(function(line){
            state.codes.push({
                id: 'qr_' + Date.now() + '_' + count,
                label: 'Batch QR #' + (count + 1),
                type: state.currentType,
                image: 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' + encodeURIComponent(line.trim()),
                data: line.trim(),
                created: new Date().toISOString(),
                category: 'batch',
                scans: 0
            });
            count++;
        });
        saveCodes();
        _toast('✅ ' + count + ' QR codes berhasil di-generate!', 'warning');
        if(state.activeTab === 'codes') renderCodes();
    }

    function exportQr(){
        if(!state.codes.length) { if(window.showToast) showToast('⚠️ Belum ada QR tersimpan!','error'); else _toast('⚠️ Belum ada QR tersimpan!', 'warning'); return; }
        var data = JSON.stringify(state.codes, null, 2);
        var blob = new Blob([data], {type: 'application/json'});
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'qr_backup_' + new Date().toISOString().split('T')[0] + '.json';
        a.click();
        URL.revokeObjectURL(url);
        if(window.showToast) showToast('✅ QR codes di-export!','info'); else _toast('✅ QR codes di-export!', 'warning');
    }

        if(navigator.share){

        } else {
            navigator.clipboard.writeText(state.currentImg).then(function(){ _toast('✅ Link QR disalin ke clipboard!', 'warning'); });
        }
    }

    function switchTab(tab){
        state.activeTab = tab;
        document.querySelectorAll('.qr-tab').forEach(function(b){
            var isMatch = b.dataset.key === tab;
            b.classList.toggle('active', isMatch);
            b.style.background = isMatch ? '#00ff9d' : '#1e293b';
            b.style.color = isMatch ? '#000' : '#e2e8f0';
        });
        ['generate', 'scanner', 'codes', 'history', 'stats'].forEach(function(p){
            var pEl = document.getElementById('panel-'+p);
            if(pEl) pEl.style.display = p === tab ? 'block' : 'none';
        });
        if(tab==='codes') renderCodes();
    }

    if (!window.__qr_pro_bound) {
        window.__qr_pro_bound = true;
        document.addEventListener('click', function(e){
            var t = e.target.closest('[data-qr]');
            if(!t) return;
            var act = t.dataset.qr, key = t.dataset.key, id = t.dataset.id;
            
            if(act==='tab') switchTab(key);
            else if(act==='generate') generate();
            else if(act==='save') saveQr();
            else if(act==='print-all') printAll();
            else if(act==='delete') { state.codes = state.codes.filter(x=>x.id!==id); saveCodes(); renderCodes(); }
            else if(act==='delete-all') { if(confirm('Hapus semua aset QR?')) { state.codes=[]; saveCodes(); renderCodes(); } }
            else if(act==='start-scan') startScanner();
            else if(act==='stop-scan') stopScanner();
            else if(act==='batch-generate') batchGenerate();
            else if(act==='export-qr') exportQr();
            else if(act==='share') shareQr();
            else if(act==='download') downloadQr();
            else if(act==='manual-scan') {
                var v = document.getElementById('manual-scan-input').value.trim();
                if(v) processSmartScan(v);
            }
        });
        document.addEventListener('change', function(e){
            if(e.target.dataset.qr === 'type-change') renderForm();
            if(e.target.id === 'qr-expire') { var el = document.getElementById('qr-expire-date'); if(el) el.style.display = e.target.checked ? 'block' : 'none'; }
        });
    }

    try { renderForm(); switchTab('scanner'); } catch(initErr){ console.error('[QR] init error:', initErr); if (window.DreamOSSecurity) window.DreamOSSecurity.report(initErr); }
    
    // ===== MODULE CLEANUP: stop scanner, clear timers, disconnect observer =====
    window.__qrCleanup = function() {
        if(state.scanner) {
            try { state.scanner.stop().catch(function(){}); } catch(e){}
            state.scanner = null;
        }
        if(state.__retryTimer) { clearTimeout(state.__retryTimer); state.__retryTimer = null; }
        if(__renderCodesTimer) { clearTimeout(__renderCodesTimer); __renderCodesTimer = null; }
        if(state.__openTimer) { clearTimeout(state.__openTimer); state.__openTimer = null; }
        if(state.__switchTimer) { clearTimeout(state.__switchTimer); state.__switchTimer = null; }
        if(window.__qrThemeCleanup) window.__qrThemeCleanup();
        console.log('[QR] Cleanup complete');
    };
    
    // Hook cleanup ke goHome (TANPA menimpa fungsi asli)
    var __origGoHome = window.goHome;
    window.goHome = function() {
        if(window.__qrCleanup) window.__qrCleanup();
        // Panggil fungsi asli (yang sudah didefinisikan di global scope)
        if(__origGoHome && typeof __origGoHome === 'function') {
            return __origGoHome();
        }
        // Fallback darurat
        console.warn('[QR] __origGoHome not available, using fallback');
        try {
            if(window.parent && window.parent !== window && typeof window.parent.goHome === 'function') {
                window.parent.goHome(); return;
            }
        } catch(e){}
        var base = window.location.pathname.indexOf('/dream-os-final/') >= 0 ? '/dream-os-final/' : '/';
        window.location.href = base + 'index.html';
    };
    
    // Pause scanner saat tab hidden
    document.addEventListener('visibilitychange', function(){
        if(document.hidden){
            if(state.scanner) {
                try { state.scanner.pause(); } catch(e){}
            }
        } else {
            if(state.activeTab === 'scanner' && state.scanner) {
                try { state.scanner.resume(); } catch(e){}
            }
        }
    });
})();
</script>
