    <p style="color:#94a3b8;font-size:0.7rem;margin-bottom:1rem;">ISO 27001 • ISO 9001 • ISO 55001 Compliant</p>
    
    <!-- Tabs -->
    <div style="display:flex;gap:0.5rem;margin-bottom:1rem;flex-wrap:wrap;">
        <button class="qr-tab active" data-qr="tab" data-key="generate" style="padding:0.5rem 1rem;background:#00ff9d;color:#000;border:none;border-radius:0.5rem;font-weight:700;cursor:pointer;">🔳 Generate</button>
        <button class="qr-tab" data-qr="tab" data-key="scanner" style="padding:0.5rem 1rem;background:#1e293b;color:#e2e8f0;border:none;border-radius:0.5rem;font-weight:600;cursor:pointer;">📷 Scanner</button>
        <button class="qr-tab" data-qr="tab" data-key="codes" style="padding:0.5rem 1rem;background:#1e293b;color:#e2e8f0;border:none;border-radius:0.5rem;font-weight:600;cursor:pointer;">🏷️ Tersimpan</button>
        <button class="qr-tab" data-qr="tab" data-key="history" style="padding:0.5rem 1rem;background:#1e293b;color:#e2e8f0;border:none;border-radius:0.5rem;font-weight:600;cursor:pointer;">📋 Riwayat</button>
        <button class="qr-tab" data-qr="tab" data-key="stats" style="padding:0.5rem 1rem;background:#1e293b;color:#e2e8f0;border:none;border-radius:0.5rem;font-weight:600;cursor:pointer;">📊 Statistik</button>
    </div>

    <!-- Panel: Generate -->
    <div id="panel-generate" class="qr-panel" style="background:rgba(15,23,42,0.6);border:1px solid rgba(0,255,157,0.2);border-radius:1rem;padding:1rem;">
        <label style="color:#94a3b8;font-size:0.8rem;">Tipe QR</label>
        <select id="qr-type" data-qr="type-change" style="width:100%;padding:0.6rem;margin-bottom:0.75rem;background:#0f172a;border:1px solid #334155;border-radius:0.5rem;color:#e2e8f0;">
            <option value="text">📝 Teks Biasa</option>
            <option value="url">🌐 URL / Link</option>
            <option value="wifi">📶 WiFi</option>
            <option value="contact">👤 Kontak (vCard)</option>
            <option value="asset">🏢 Aset (ISO 55001)</option>
            <option value="inventory">📦 Inventaris</option>
            <option value="gudang">🗄️ Gudang</option>
            <option value="encrypted">🔒 Encrypted (ISO 27001)</option>
            <option value="expiring">⏰ Expiring QR</option>
        </select>
        <div id="qr-dynamic-inputs"></div>
        
        <!-- Advanced Pro Options -->
        <div style="margin-top:0.75rem;padding:0.75rem;background:rgba(0,0,0,0.3);border-radius:0.5rem;border:1px solid rgba(0,255,157,0.1);">
            <div style="color:#00ff9d;font-size:0.75rem;margin-bottom:0.5rem;font-weight:700;">⚙️ Fitur Enterprise Pro:</div>
            <label style="color:#e2e8f0;font-size:0.75rem;display:flex;align-items:center;gap:0.4rem;margin-bottom:0.4rem;cursor:pointer;">
                <input type="checkbox" id="qr-logo" style="accent-color:#0ea5e9;"> 🖼️ Tambahkan Logo Sultan di Tengah QR
            </label>
            <label style="color:#e2e8f0;font-size:0.75rem;display:flex;align-items:center;gap:0.4rem;margin-bottom:0.4rem;cursor:pointer;">
                <input type="checkbox" id="qr-geo" style="accent-color:#ef4444;"> 📍 Geo-Fence (Wajib di Area Depok 5km)
            </label>
            <label style="color:#e2e8f0;font-size:0.75rem;display:flex;align-items:center;gap:0.4rem;margin-bottom:0.4rem;cursor:pointer;">
                <input type="checkbox" id="qr-encrypt" style="accent-color:#00ff9d;"> 🔒 Encrypt Payload (AES-256 + PIN Challenge)
            </label>
            <label style="color:#e2e8f0;font-size:0.75rem;display:flex;align-items:center;gap:0.4rem;cursor:pointer;">
                <input type="checkbox" id="qr-expire" style="accent-color:#f59e0b;"> ⏰ Set Expiration (Time Bomb)
            </label>
            <input type="datetime-local" id="qr-expire-date" style="display:none;width:100%;padding:0.4rem;margin-top:0.5rem;background:#0f172a;border:1px solid #334155;border-radius:0.3rem;color:#e2e8f0;font-size:0.75rem;">
            <input type="text" id="qr-category" placeholder="🏷️ Label / Kategori (opsional)" style="width:100%;padding:0.4rem;margin-top:0.5rem;background:#0f172a;border:1px solid #334155;border-radius:0.3rem;color:#e2e8f0;font-size:0.75rem;">
        </div>
        
        <button data-qr="generate" style="width:100%;padding:0.75rem;background:#00ff9d;color:#000;border:none;border-radius:0.5rem;font-weight:700;cursor:pointer;margin-top:0.75rem;">🔳 Generate Pro QR</button>
        <button data-qr="batch-generate" style="width:100%;padding:0.5rem;background:#8b5cf6;color:white;border:none;border-radius:0.5rem;font-weight:600;cursor:pointer;margin-top:0.5rem;font-size:0.8rem;">📦 Batch Generate</button>
        
        <div id="qr-image-container" style="text-align:center;margin-top:1rem;"></div>
        <div id="qr-save-area" style="display:none;text-align:center;margin-top:0.5rem;gap:0.5rem;justify-content:center;">
            <button data-qr="save" style="padding:0.5rem 1rem;background:#8b5cf6;color:white;border:none;border-radius:0.5rem;cursor:pointer;">💾 Simpan</button>
            <button data-qr="download" style="padding:0.5rem 1rem;background:#10b981;color:white;border:none;border-radius:0.5rem;cursor:pointer;">📥 Unduh</button>
            <button data-qr="share" style="padding:0.5rem 1rem;background:#3b82f6;color:white;border:none;border-radius:0.5rem;cursor:pointer;">🔗 Share</button>
        </div>
    </div>

    <!-- Panel: Scanner -->
    <div id="panel-scanner" class="qr-panel" style="display:none;background:rgba(15,23,42,0.6);border:1px solid rgba(0,255,157,0.2);border-radius:1rem;padding:1rem;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem;">
            <h3 style="color:#00ff9d;margin:0;">📷 Smart Auto Scanner</h3>
            <span style="font-size:0.6rem;background:#0ea5e9;padding:0.2rem 0.5rem;border-radius:0.2rem;color:#fff;">Continuous Mode</span>
        </div>
        <div id="qr-reader" style="width:100%;border-radius:0.5rem;overflow:hidden;border:2px solid #0f172a;position:relative;"></div>
        <button data-qr="start-scan" style="width:100%;padding:0.6rem;background:#00ff9d;color:#000;border:none;border-radius:0.5rem;font-weight:700;cursor:pointer;margin-top:0.75rem;">▶️ Mulai Pemindaian</button>
        
        <div style="margin-top:1rem;padding:0.75rem;background:rgba(0,0,0,0.3);border-radius:0.5rem;">
            <div style="color:#94a3b8;font-size:0.75rem;margin-bottom:0.3rem;">⌨️ Input Bypass (Jika kamera rusak):</div>
            <div style="display:flex;gap:0.5rem;">
                <input type="text" id="manual-scan-input" placeholder="Paste data QR/Barcode..." style="flex:1;padding:0.5rem;background:#0f172a;border:1px solid #334155;border-radius:0.3rem;color:#e2e8f0;font-size:0.8rem;">
                <button data-qr="manual-scan" style="padding:0.5rem 1rem;background:#6366f1;color:white;border:none;border-radius:0.3rem;cursor:pointer;font-weight:600;">Proses</button>
            </div>
        </div>
        <button data-qr="stop-scan" style="width:100%;padding:0.6rem;background:#ef4444;color:white;border:none;border-radius:0.5rem;font-weight:700;cursor:pointer;margin-top:0.5rem;display:none;">⏹️ Hentikan Pemindaian</button>
        
        <div id="scan-result" style="margin-top:0.75rem;padding:1rem;background:rgba(0,0,0,0.5);border:1px solid #00ff9d;border-radius:0.5rem;display:none;box-shadow:0 0 20px rgba(0,255,157,0.1);transition:all 0.3s ease;">
            <div style="color:#00ff9d;font-size:0.65rem;margin-bottom:0.5rem;text-transform:uppercase;letter-spacing:1px;font-weight:800;">📋 Eksekusi Automasi:</div>
            <div id="scan-data" style="color:#e2e8f0;font-size:0.9rem;word-break:break-all;line-height:1.4;"></div>
            <div id="scan-meta" style="color:#64748b;font-size:0.7rem;margin-top:0.8rem;border-top:1px dashed rgba(255,255,255,0.1);padding-top:0.5rem;"></div>
        </div>
    </div>

    <!-- Panel: Codes -->
    <div id="panel-codes" class="qr-panel" style="display:none;background:rgba(15,23,42,0.6);border:1px solid rgba(0,255,157,0.2);border-radius:1rem;padding:1rem;">
        <div style="display:flex;gap:0.5rem;margin-bottom:0.75rem;flex-wrap:wrap;">
            <input type="text" id="qr-search" placeholder="🔍 Cari QR..." style="flex:1;min-width:150px;padding:0.5rem;background:#0f172a;border:1px solid #334155;border-radius:0.5rem;color:#e2e8f0;font-size:0.8rem;">
            <select id="qr-filter-category" style="padding:0.5rem;background:#0f172a;border:1px solid #334155;border-radius:0.5rem;color:#e2e8f0;font-size:0.8rem;">
                <option value="">Semua Kategori</option>
            </select>
        </div>
        <div style="display:flex;gap:0.5rem;margin-bottom:0.75rem;flex-wrap:wrap;">
            <button data-qr="print-all" style="flex:1;padding:0.5rem;background:#0ea5e9;color:white;border:none;border-radius:0.5rem;cursor:pointer;font-weight:700;font-size:0.75rem;">🖨️ Generate PDF Label</button>
            <button data-qr="export-qr" style="flex:1;padding:0.5rem;background:#10b981;color:white;border:none;border-radius:0.5rem;cursor:pointer;font-weight:600;font-size:0.75rem;">📤 Backup Data</button>
            <button data-qr="delete-all" style="flex:1;padding:0.5rem;background:#ef4444;color:white;border:none;border-radius:0.5rem;cursor:pointer;font-weight:600;font-size:0.75rem;">🗑️ Hapus Semua</button>
        </div>
        <div id="qr-codes-list"></div>
    </div>

    <!-- Panel: History & Stats -->
    <div id="panel-history" class="qr-panel" style="display:none;background:rgba(15,23,42,0.6);border:1px solid rgba(0,255,157,0.2);border-radius:1rem;padding:1rem;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem;">
            <h3 style="color:#00ff9d;margin:0;">📋 Riwayat Aktivitas</h3>
            <button data-qr="clear-history" style="padding:0.4rem 0.8rem;background:#ef4444;color:white;border:none;border-radius:0.5rem;cursor:pointer;font-size:0.75rem;">🗑️ Clear</button>
        </div>
        <div id="qr-history-list"></div>
    </div>

    <div id="panel-stats" class="qr-panel" style="display:none;background:rgba(15,23,42,0.6);border:1px solid rgba(0,255,157,0.2);border-radius:1rem;padding:1rem;">
        <h3 style="color:#00ff9d;margin:0 0 0.75rem;">📊 Data Intelijen</h3>
        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:0.75rem;margin-bottom:1rem;">
            <div style="padding:0.75rem;background:rgba(0,255,157,0.1);border-radius:0.5rem;text-align:center;border:1px solid rgba(0,255,157,0.3);">
                <div style="font-size:1.5rem;font-weight:800;color:#00ff9d;" id="stat-total-qr">0</div>
                <div style="font-size:0.7rem;color:#94a3b8;font-weight:700;text-transform:uppercase;">Total Aset QR</div>
            </div>
            <div style="padding:0.75rem;background:rgba(239,68,68,0.1);border-radius:0.5rem;text-align:center;border:1px solid rgba(239,68,68,0.3);">
                <div style="font-size:1.5rem;font-weight:800;color:#ef4444;" id="stat-expired-qr">0</div>
                <div style="font-size:0.7rem;color:#94a3b8;font-weight:700;text-transform:uppercase;">QR Expired</div>
            </div>
        </div>
        <div id="stat-type-distribution" style="padding:1rem;background:rgba(0,0,0,0.4);border-radius:0.5rem;"></div>
    </div>
</div>

<script>
(function(){
    var state = {
        codes: JSON.parse(localStorage.getItem('dreamos_qr_codes')||'[]'),
        history: JSON.parse(localStorage.getItem('dreamos_qr_history')||'[]'),
        scans: JSON.parse(localStorage.getItem('dreamos_qr_scans')||'[]'),
        currentImg: '', currentData: '', currentType: 'text', activeTab: 'generate', scanner: null,
        lastScanData: '', lastScanTime: 0, // Engine Anti-Spam
        encryptionKey: (function(){ try{ var u=JSON.parse(localStorage.getItem('dreamos_bound_user')||'{}'); return CryptoJS.SHA256((u.email||'anon') + 'dreamos_salt_2026').toString(); }catch(e){ return 'fallback_key'; } })()
    };
    
    const DEPOK_LAT = -6.4025, DEPOK_LNG = 106.7942;
    
    function saveCodes(){ localStorage.setItem('dreamos_qr_codes', JSON.stringify(state.codes)); }
    function saveHistory(){ localStorage.setItem('dreamos_qr_history', JSON.stringify(state.history)); }
    function saveScans(){ localStorage.setItem('dreamos_qr_scans', JSON.stringify(state.scans)); }
    function getData(k){ try{return JSON.parse(localStorage.getItem(k)||'[]');}catch(e){return[];} }
    
    function encryptData(data){ return CryptoJS.AES.encrypt(data, state.encryptionKey).toString(); }
    function decryptData(encrypted){ try { var bytes = CryptoJS.AES.decrypt(encrypted, state.encryptionKey); return bytes.toString(CryptoJS.enc.Utf8); } catch(e) { return null; } }

    function renderForm(){
        var typeSel = document.getElementById('qr-type');
        if(!typeSel) return;
        var type = typeSel.value;
        state.currentType = type;
        var c = document.getElementById('qr-dynamic-inputs');
        if(!c) return;
        var h = '';
        
        if(type==='text') h='<textarea id="qr-data" placeholder="Masukkan teks..." rows="3" style="width:100%;padding:0.6rem;background:#0f172a;border:1px solid #334155;border-radius:0.5rem;color:#e2e8f0;resize:none;"></textarea>';
        else if(type==='url') h='<input type="url" id="qr-data" placeholder="https://..." style="width:100%;padding:0.6rem;background:#0f172a;border:1px solid #334155;border-radius:0.5rem;color:#e2e8f0;">';
        else if(type==='asset'){ var as=getData('dreamos_assets'); h='<select id="asset-select" style="width:100%;padding:0.6rem;background:#0f172a;border:1px solid #334155;border-radius:0.5rem;color:#e2e8f0;"><option value="">-- Pilih Aset --</option>'; as.forEach(function(a){h+='<option value="'+a.id+'">'+(a.name||a.nama)+' ('+(a.location||'-')+')</option>';}); h+='</select>'; }
        else if(type==='inventory'){ var st=getData('dreamos_inventory'); h='<select id="inventory-select" style="width:100%;padding:0.6rem;background:#0f172a;border:1px solid #334155;border-radius:0.5rem;color:#e2e8f0;"><option value="">-- Pilih Barang --</option>'; st.forEach(function(s){h+='<option value="'+s.id+'">'+s.nama+' ('+s.jumlah+')</option>';}); h+='</select>'; }
        else if(type==='gudang'){ var gd=getData('dreamos_assets').filter(function(a){return a.category==='Gedung'||a.type==='fixed';}); h='<select id="gudang-select" style="width:100%;padding:0.6rem;background:#0f172a;border:1px solid #334155;border-radius:0.5rem;color:#e2e8f0;"><option value="">-- Pilih Gudang --</option>'; gd.forEach(function(g){h+='<option value="'+g.id+'">'+(g.name||g.nama)+' ('+(g.location||'-')+')</option>';}); h+='</select>'; }
        else if(type==='encrypted') h='<textarea id="qr-data" placeholder="Payload rahasia..." rows="3" style="width:100%;padding:0.6rem;background:#0f172a;border:1px solid #ef4444;border-radius:0.5rem;color:#e2e8f0;resize:none;"></textarea>';
        else if(type==='expiring') h='<textarea id="qr-data" placeholder="Payload sementara..." rows="3" style="width:100%;padding:0.6rem;background:#0f172a;border:1px solid #f59e0b;border-radius:0.5rem;color:#e2e8f0;resize:none;"></textarea>';
        else h='<input type="text" id="qr-data" placeholder="Masukkan data..." style="width:100%;padding:0.6rem;background:#0f172a;border:1px solid #334155;border-radius:0.5rem;color:#e2e8f0;">';
        c.innerHTML = h;
    }

    function generate(){
        var type = state.currentType;
        var data = '';
        var useLogo = document.getElementById('qr-logo')?.checked || false;
        var useGeo = document.getElementById('qr-geo')?.checked || false;
        var encrypt = document.getElementById('qr-encrypt')?.checked || false;
        var expire = document.getElementById('qr-expire')?.checked || false;
        
        if(type==='asset') data = 'DREAMOS-ASSET:'+(document.getElementById('asset-select')?.value||'');
        else if(type==='inventory') data = 'DREAMOS-INV:'+(document.getElementById('inventory-select')?.value||'');
        else if(type==='gudang') data = 'DREAMOS-GDG:'+(document.getElementById('gudang-select')?.value||'');
        else data = (document.getElementById('qr-data')?.value||'').trim();
        
        if(!data || data.split(':').pop()==='') return alert('⚠️ Masukkan data payload!');
        
        if(encrypt || type==='encrypted') data = 'ENC:' + encryptData(data);
        if(expire || type==='expiring') {
            var expTime = document.getElementById('qr-expire-date')?.value;
            if(!expTime) return alert('⚠️ Waktu expired wajib diisi!');
            data = 'EXP:' + new Date(expTime).getTime() + ':' + data;
        }
        if(useGeo) data = 'GEO:' + DEPOK_LAT + ',' + DEPOK_LNG + ':' + data;

        var imgUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=350x350&data='+encodeURIComponent(data);
        if(useLogo) {
            var logoUrl = encodeURIComponent('https://dreamos-sys.github.io/assets/logo-sultan.png');
            imgUrl = 'https://quickchart.io/qr?size=350&margin=2&text='+encodeURIComponent(data)+'&centerImageUrl='+logoUrl;
        }

        state.currentImg = imgUrl; state.currentData = data;
        document.getElementById('qr-image-container').innerHTML = '<img src="'+state.currentImg+'" style="max-width:100%;border-radius:1rem;border:4px solid #00ff9d;box-shadow:0 0 20px rgba(0,255,157,0.4);">';
        document.getElementById('qr-save-area').style.display = 'flex';
    }

    function saveQr(){
        if(!state.currentImg) return;
        var label = prompt('📝 Nama Label Aset/QR ini:');
        if(!label) return;
        state.codes.unshift({
            id: 'qr_' + Date.now(), label: label, type: state.currentType, image: state.currentImg, data: state.currentData,
            category: document.getElementById('qr-category')?.value || 'General', created: new Date().toISOString(), scans: 0
        });
        saveCodes(); switchTab('codes');
    }

    function printAll(){
        if(!state.codes.length) return alert('⚠️ Belum ada QR tersimpan!');
        var w = window.open('','_blank','width=900,height=700');
        var html = `<!DOCTYPE html><html><head><title>Dream OS - Asset Tags</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap');body{font-family:'Inter',sans-serif;background:#fff;margin:0;padding:15mm;}.header{text-align:center;margin-bottom:20px;border-bottom:2px solid #000;padding-bottom:10px;}.header h1{margin:0;font-size:24px;font-weight:800;letter-spacing:2px;}.grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:15px;}.sticker{border:2px dashed #999;padding:12px;text-align:center;border-radius:8px;position:relative;}.sticker img{width:140px;height:140px;margin-bottom:8px;}.label{font-weight:800;font-size:14px;text-transform:uppercase;margin-bottom:4px;color:#000;}.meta{font-size:10px;color:#444;background:#f0f0f0;padding:4px;border-radius:4px;display:inline-block;}.iso-badge{position:absolute;bottom:5px;right:8px;font-size:8px;font-weight:700;color:#000;}@media print{.no-print{display:none;}body{padding:0;}}</style></head><body><div class="no-print" style="margin-bottom:20px;text-align:center;"><button onclick="window.print()" style="padding:10px 20px;background:#000;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;font-weight:bold;">🖨️ Cetak ke PDF</button></div><div class="header"><h1>DREAM OS ENTERPRISE</h1><p>OFFICIAL ASSET TAGS • ISO 55001 COMPLIANT</p></div><div class="grid">`;
        state.codes.forEach(q => { html += `<div class="sticker"><img src="${q.image}"><div class="label">${q.label}</div><div class="meta">Tipe: ${q.type.toUpperCase()} | ID: ${q.id.split('_')[1]}</div><div class="iso-badge">SECURE TAG</div></div>`; });
        html += `</div></body></html>`; w.document.write(html); w.document.close();
    }

    // 🤖 ENGINE UNIVERSAL SMART SCAN & AUTO ROUTING
    function executePayload(dataStr) {
        var resBox = document.getElementById('scan-result');
        if(!resBox) return;
        
        // Efek visual sukses
        resBox.style.display = 'block';
        resBox.style.background = 'rgba(0, 255, 157, 0.1)';
        setTimeout(() => { resBox.style.background = 'rgba(0,0,0,0.5)'; }, 300);

        var displayData = dataStr;
        var actionHtml = '';
        var timestamp = '🕒 Scanned: ' + new Date().toLocaleString('id-ID');
        
        // Skenario 1: Aset Internal Dream OS
        if (dataStr.startsWith('DREAMOS-ASSET:')) {
            var id = dataStr.split(':')[1];
            var assets = getData('dreamos_assets');
            var asset = assets.find(a => a.id === id);
            if (asset) {
                displayData = '🏢 <b>[ASET INTERNAL]</b><br>' + (asset.nama || asset.name) + '<br>📍 Lokasi: ' + (asset.lokasi || asset.location || 'Unknown');
                actionHtml = '<span style="color:#0ea5e9;font-weight:700;">✅ Sinkronisasi Modul Aset (Auto-Load)...</span>';
            } else {
                displayData = '❌ <b>[ASET TIDAK DITEMUKAN]</b><br>ID: ' + id;
            }
        } 
        // Skenario 2: URL Universal
        else if (dataStr.startsWith('http://') || dataStr.startsWith('https://')) {
            displayData = '🌐 <b>[WEB LINK / URL]</b><br>' + dataStr;
            actionHtml = '<span style="color:#3b82f6;font-weight:700;">🚀 Mengalihkan Tab Secara Otomatis...</span>';
            // Auto routing eksekusi
            setTimeout(() => window.open(dataStr, '_blank'), 800);
        }
        // Skenario 3: Barcode/QR Fisik Barang
        else {
            var cleanId = dataStr.replace('DREAMOS-INV:', '').replace('DREAMOS-GDG:', '');
            var inv = getData('dreamos_inventory');
            var item = inv.find(i => i.id === cleanId || i.barcode === cleanId);
            
            if (item) {
                displayData = '📦 <b>[STOK GUDANG TERIDENTIFIKASI]</b><br>' + (item.nama || item.nama_barang) + '<br>📊 Tersedia: ' + (item.jumlah || 0) + ' unit';
                actionHtml = '<span style="color:#10b981;font-weight:700;">✅ Terhubung ke Form Update Stok...</span>';
            } else {
                displayData = '❓ <b>[BARCODE BARU DITEMUKAN]</b><br>Data: <span style="font-family:monospace;color:#f59e0b;">' + cleanId + '</span>';
                actionHtml = '<span style="color:#f59e0b;font-weight:700;">⚡ Mengalihkan ke Modul Tambah Inventaris...</span>';
                
                // Auto-Routing Lempar Data antar modul (Integrasi Dream OS Parent)
                setTimeout(() => {
                    if(window.parent && window.parent.switchModule) {
                        // Kanjeng bisa buat logic ini di index.html nantinya
                        window.parent.switchModule('inventory', { barcodeScan: cleanId });
                    }
                }, 1500);
            }
        }

        document.getElementById('scan-data').innerHTML = displayData;
        document.getElementById('scan-meta').innerHTML = timestamp + '<br>' + actionHtml;
        state.scans.unshift({ time: new Date().toISOString(), data: dataStr.substring(0,50) });
        if(state.scans.length > 100) state.scans.pop(); saveScans();
    }

    function processSmartScan(rawDecodedText) {
        var payload = rawDecodedText;
        if (payload.startsWith('GEO:')) {
            if(!navigator.geolocation) return alert('⛔ Perangkat tidak mendukung GPS.');
            var geoParts = payload.substring(4).split(':'); var coords = geoParts[0].split(',');
            payload = geoParts.slice(1).join(':');
            navigator.geolocation.getCurrentPosition(function(pos) {
                var lat = pos.coords.latitude, lng = pos.coords.longitude;
                var targetLat = parseFloat(coords[0]), targetLng = parseFloat(coords[1]);
                var p = 0.017453292519943295;
                var a = 0.5 - Math.cos((targetLat - lat) * p)/2 + Math.cos(lat * p) * Math.cos(targetLat * p) * (1 - Math.cos((targetLng - lng) * p))/2;
                var distance = 12742 * Math.asin(Math.sqrt(a)); 
                if (distance > 5) return alert('⛔ SECURITY ALERT!\nAnda berada ' + distance.toFixed(1) + ' km dari Safe Core (Depok).');
                processNextLayers(payload);
            }, function(err) { alert('⛔ Gagal mendapatkan GPS.'); });
            return;
        }
        processNextLayers(payload);
    }

    function processNextLayers(payload) {
        if (payload.startsWith('EXP:')) {
            var expParts = payload.substring(4).split(':');
            var expTime = parseInt(expParts[0]); payload = expParts.slice(1).join(':');
            if (Date.now() > expTime) return alert('⏰ QR EXPIRED pada: ' + new Date(expTime).toLocaleString('id-ID'));
        }
        if (payload.startsWith('ENC:')) {
            var pin = prompt('🔐 SECURITY CHALLENGE\nMasukkan PIN Admin/Sistem untuk Dekripsi:');
            if (pin === '123456' || pin === 'SULTAN') {
                var decrypted = decryptData(payload.substring(4));
                if(decrypted) payload = '<span style="color:#f59e0b;">🔓 [DECRYPTED SECURE DATA]</span><br>' + decrypted;
                else return alert('⛔ Kunci Dekripsi Gagal!');
            } else return alert('⛔ Akses Ditolak!');
        }
        executePayload(payload);
    }

    // 📸 ENGINE CONTINUOUS SCAN + DEBOUNCE (ANTI-SPAM)
    function startScanner(retryCount){
        if(state.scanner) return;
        if(typeof Html5Qrcode === 'undefined') {
            retryCount = (retryCount || 0) + 1;
            if (retryCount > 15) {
                alert('⚠️ Koneksi internet lambat. Pustaka scanner gagal dimuat.');
                return;
            }
            // Auto-retry senyap tiap 300ms sampai library siap
            setTimeout(function(){ startScanner(retryCount); }, 300);
            return;
        }
        
        try {
            state.scanner = new Html5Qrcode("qr-reader");
        state.lastScanData = ''; 
        state.lastScanTime = 0;
        
        state.scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } },
            function(text){ 
                // Anti-Spam: Block duplicate scan dalam 3 detik
                var now = Date.now();
                if (text === state.lastScanData && (now - state.lastScanTime) < 3000) return;
                
                state.lastScanData = text;
                state.lastScanTime = now;
                
                // Panggil logic tanpa mematikan scanner!
                processSmartScan(text); 
            }, function(err){}
        ).then(function(){
            var sBtn = document.querySelector('[data-qr="start-scan"]');
            var xBtn = document.querySelector('[data-qr="stop-scan"]');
            if(sBtn) sBtn.style.display = 'none';
            if(xBtn) xBtn.style.display = 'block';
        }).catch(function(err){ alert('❌ Gagal akses kamera: ' + err); state.scanner = null; });
    }
    
    function stopScanner(){
        if(!state.scanner) return;
        state.scanner.stop().then(function(){
            state.scanner = null;
            document.querySelector('[data-qr="start-scan"]').style.display = 'block';
            document.querySelector('[data-qr="stop-scan"]').style.display = 'none';
        }).catch(function(){});
    }

    function renderCodes(){
        var list = document.getElementById('qr-codes-list'); if(!list) return;
        var search = (document.getElementById('qr-search')?.value || '').toLowerCase();
        var filtered = state.codes.filter(function(q){ return !search || q.label.toLowerCase().includes(search) || q.category.toLowerCase().includes(search); });
        if(!filtered.length) return list.innerHTML = '<p style="color:#64748b;text-align:center;padding:2rem;">📭 Belum ada QR tersimpan.</p>';
        var h = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0.5rem;">';
        filtered.forEach(function(q){ h += `<div style="background:rgba(30,41,59,0.8);padding:0.75rem;text-align:center;border-radius:0.5rem;border:1px solid rgba(0,255,157,0.1);"><img src="${q.image}" style="width:100%;max-width:120px;border-radius:0.5rem;background:#fff;padding:4px;"><div style="font-weight:800;font-size:0.8rem;margin-top:0.5rem;color:#00ff9d;">${q.label}</div><div style="font-size:0.6rem;color:#94a3b8;margin:2px 0;">🏷️ ${q.category}</div><button data-qr="delete" data-id="${q.id}" style="margin-top:0.5rem;background:#ef4444;color:white;border:none;border-radius:0.3rem;padding:0.3rem 0.6rem;font-size:0.7rem;cursor:pointer;">🗑️ Hapus</button></div>`; });
        list.innerHTML = h + '</div>';
    }

    function switchTab(tab){
        state.activeTab = tab;
        document.querySelectorAll('.qr-tab').forEach(function(b){
            var isMatch = b.dataset.key === tab;
            b.classList.toggle('active', isMatch);
            b.style.background = isMatch ? '#00ff9d' : '#1e293b';
            b.style.color = isMatch ? '#000' : '#e2e8f0';
        });
        ['generate', 'scanner', 'codes', 'history', 'stats'].forEach(function(p){
            var pEl = document.getElementById('panel-'+p);
            if(pEl) pEl.style.display = p === tab ? 'block' : 'none';
        });
        if(tab==='codes') renderCodes();
        // Jangan matikan otomatis jika ganti tab agar bisa continuous multi-tasking!
    }

    if (!window.__qr_pro_bound) {
        window.__qr_pro_bound = true;
        document.addEventListener('click', function(e){
            var t = e.target.closest('[data-qr]');
            if(!t) return;
            var act = t.dataset.qr, key = t.dataset.key, id = t.dataset.id;
            
            if(act==='tab') switchTab(key);
            else if(act==='generate') generate();
            else if(act==='save') saveQr();
            else if(act==='print-all') printAll();
            else if(act==='delete') { state.codes = state.codes.filter(x=>x.id!==id); saveCodes(); renderCodes(); }
            else if(act==='delete-all') { if(confirm('Hapus semua aset QR?')) { state.codes=[]; saveCodes(); renderCodes(); } }
            else if(act==='start-scan') startScanner();
            else if(act==='stop-scan') stopScanner();
            else if(act==='manual-scan') {
                var v = document.getElementById('manual-scan-input').value.trim();
                if(v) processSmartScan(v);
            }
        });
        document.addEventListener('change', function(e){
            if(e.target.dataset.qr === 'type-change') renderForm();
            if(e.target.id === 'qr-expire') { var el = document.getElementById('qr-expire-date'); if(el) el.style.display = e.target.checked ? 'block' : 'none'; }
        });
    }

    renderForm(); switchTab('scanner'); // Auto-buka di tab scanner agar siap pakai!
})();
</script>
