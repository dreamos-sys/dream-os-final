<style>:root{--neon:#00ff9d;--accent:#0ea5e9}*{box-sizing:border-box}body{background:#0a0e27;color:#e2e8f0;font-family:'Inter',sans-serif;min-height:100vh;margin:0;padding:1rem}.glass{background:rgba(15,23,42,0.7);backdrop-filter:blur(20px);border:1px solid rgba(0,255,157,0.1);border-radius:16px;padding:1rem;margin-bottom:1rem}.btn{padding:0.5rem 1rem;border:none;border-radius:8px;font-weight:700;cursor:pointer}.btn-success{background:#10b981;color:#fff}.input-field{width:100%;padding:0.6rem;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#e2e8f0;font-size:0.8rem;outline:none;margin-bottom:0.5rem}table{width:100%;border-collapse:collapse;font-size:0.7rem}th{background:rgba(0,0,0,0.3);color:#94a3b8;padding:0.4rem;text-align:left}td{padding:0.35rem;border-bottom:1px solid rgba(255,255,255,0.03)}</style>
<button onclick="window.goHome()" style="background:rgba(30,41,59,0.9);border:1px solid var(--neon);color:var(--neon);padding:0.4rem 0.8rem;border-radius:8px;cursor:pointer;font-weight:700;font-size:0.7rem;position:fixed;top:0.8rem;left:0.8rem;z-index:1000">← HOME</button>
<div style="max-width:800px;margin:0 auto;padding-top:3.5rem;">
  <div class="glass"><h2 style="color:var(--neon)">📅 Booking Ruangan</h2>
    <input type="date" id="booking-tgl" class="input-field">
    <input type="text" id="booking-ruang" class="input-field" placeholder="Ruangan">
    <input type="text" id="booking-peminjam" class="input-field" placeholder="Nama Peminjam">
    <div style="display:flex;gap:0.5rem;"><input type="time" id="booking-jam-mulai" class="input-field" value="08:00"><input type="time" id="booking-jam-selesai" class="input-field" value="10:00"></div>
    <button class="btn btn-success" onclick="addBooking()" style="width:100%">✅ SIMPAN BOOKING</button>
  </div>
  <div class="glass"><h3 style="color:var(--accent)">📋 Daftar Booking</h3><div id="booking-list"></div></div>
  <div id="qr-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:9999;align-items:center;justify-content:center;"><div style="background:#1e293b;padding:2rem;border-radius:16px;text-align:center;"><h3 style="color:#00ff9d">QR Code Booking</h3><canvas id="qr-canvas"></canvas><p id="qr-text" style="color:#fff;margin-top:1rem;font-size:0.8rem;"></p><button onclick="closeQR()" class="btn" style="background:#e11d48;color:#fff;margin-top:1rem;">Tutup</button></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function renderList(){var b=JSON.parse(localStorage.getItem('dreamos_bookings')||'[]');document.getElementById('booking-list').innerHTML=b.length?('<table><tr><th>Tgl</th><th>Ruang</th><th>Peminjam</th><th>Jam</th><th>QR</th></tr>'+b.map(function(x,i){return'<tr><td>'+esc(x.tgl)+'</td><td>'+esc(x.ruang)+'</td><td>'+esc(x.nama_peminjam)+'</td><td>'+esc(x.jam_mulai)+'-'+esc(x.jam_selesai)+'</td><td><button onclick="showQR('+i+')" style="background:#0ea5e9;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:0.6rem;">QR</button></td></tr>'}).join('')+'</table>'):'<p>Belum ada booking.</p>'}
window.showQR=function(idx){var b=JSON.parse(localStorage.getItem('dreamos_bookings')||'[]')[idx];if(!b)return;var text=b.tgl+'|'+b.ruang+'|'+b.nama_peminjam+'|'+b.jam_mulai+'-'+b.jam_selesai;var qr=qrcode(0,'M');qr.addData(text);qr.make();document.getElementById('qr-canvas').innerHTML='';var c=document.getElementById('qr-canvas');c.width=200;c.height=200;var ctx=c.getContext('2d');var img=new Image();img.src=qr.createDataURL(4);img.onload=function(){ctx.drawImage(img,0,0,200,200)};document.getElementById('qr-text').textContent='Booking: '+b.ruang+' - '+b.nama_peminjam;document.getElementById('qr-modal').style.display='flex'}
window.closeQR=function(){document.getElementById('qr-modal').style.display='none'}
window.addBooking=async function(){var tgl=document.getElementById('booking-tgl').value;var ruang=document.getElementById('booking-ruang').value.trim();var peminjam=document.getElementById('booking-peminjam').value.trim();var mulai=document.getElementById('booking-jam-mulai').value;var selesai=document.getElementById('booking-jam-selesai').value;if(!tgl||!ruang||!peminjam)return alert('⚠️ Lengkapi semua field!');var book={id:'book_'+Date.now(),tgl:tgl,ruang:ruang,nama_peminjam:peminjam,jam_mulai:mulai,jam_selesai:selesai,status:'pending',created_at:new Date().toISOString()};var books=JSON.parse(localStorage.getItem('dreamos_bookings')||'[]');books.push(book);localStorage.setItem('dreamos_bookings',JSON.stringify(books));renderList();if(window.supabaseClient)window.supabaseClient.from('bookings').insert(book).then(function(){}).catch(function(){});if(window.addNotification)window.addNotification('Booking baru: '+ruang+' oleh '+peminjam);document.getElementById('booking-ruang').value='';document.getElementById('booking-peminjam').value='';alert('✅ Booking tersimpan!')}
renderList()
</script>
