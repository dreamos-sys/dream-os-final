<style>
  :root { --neon: #00ff9d; --accent: #0ea5e9; --warning: #e11d48; --gold: #f59e0b; --purple: #8b5cf6; }
  * { box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #0a0e27; color: #e2e8f0; min-height: 100vh; margin: 0; padding: 1rem; }
  .glass { background: rgba(15,23,42,0.8); backdrop-filter: blur(20px); border: 1px solid rgba(0,255,157,0.15); border-radius: 16px; padding: 1.25rem; margin-bottom: 1rem; }
  .back-btn { position: fixed; top: 0.8rem; left: 0.8rem; z-index: 1000; background: rgba(30,41,59,0.9); border: 1px solid var(--neon); color: var(--neon); padding: 0.4rem 0.8rem; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.7rem; }
  .btn { padding: 0.5rem 0.9rem; border: none; border-radius: 8px; font-weight: 700; font-size: 0.7rem; cursor: pointer; transition: 0.2s; }
  .btn-success { background: #10b981; color: #fff; }
  .btn-danger { background: var(--warning); color: #fff; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-warning { background: var(--gold); color: #000; }
  .btn-purple { background: var(--purple); color: #fff; }
  .btn:hover { transform: translateY(-1px); opacity: 0.95; }
  .input-field { width: 100%; padding: 0.6rem; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #e2e8f0; font-size: 0.8rem; outline: none; margin-bottom: 0.5rem; }
  .input-field:focus { border-color: var(--neon); }
  table { width: 100%; border-collapse: collapse; font-size: 0.7rem; }
  th { background: rgba(0,0,0,0.3); color: #94a3b8; padding: 0.4rem; text-align: left; }
  td { padding: 0.35rem; border-bottom: 1px solid rgba(255,255,255,0.03); }
  .badge { padding: 0.12rem 0.4rem; border-radius: 10px; font-size: 0.55rem; font-weight: 600; }
  .badge-pending { background: rgba(245,158,11,0.2); color: #f59e0b; }
  .badge-approved { background: rgba(16,185,129,0.2); color: #10b981; }
  .badge-rejected { background: rgba(225,29,72,0.2); color: #e11d48; }
  .qr-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; align-items: center; justify-content: center; }
  .qr-content { background: #1e293b; padding: 2rem; border-radius: 16px; text-align: center; border: 1px solid var(--neon); max-width: 350px; }
  .section-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 0.8rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.5rem; }
  .flex-row { display: flex; gap: 0.5rem; }
  @media (max-width: 500px) { .flex-row { flex-direction: column; } }
</style>

<button class="back-btn" onclick="window.goHome()">← HOME</button>

<div style="max-width: 900px; margin: 0 auto; padding: 3.5rem 0.8rem 5rem;">

  <div class="glass" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
    <div>
      <h2 style="color: var(--neon); margin: 0; font-size: 1.1rem;">📅 Booking Ruangan</h2>
      <p style="color: #64748b; font-size: 0.62rem; margin: 0;">Manajemen Peminjaman Ruangan • Enterprise Grade</p>
    </div>
    <div style="display: flex; gap: 0.3rem; flex-wrap: wrap;">
      <button class="btn btn-success" onclick="exportCSV()">📥 CSV</button>
      <button class="btn btn-primary" onclick="syncToCloud()">☁️ Sync</button>
    </div>
  </div>

  <div class="glass">
    <div class="section-title" style="color: var(--accent);">📝 Form Booking Baru</div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
      <input type="date" id="booking-tgl" class="input-field">
      <input type="text" id="booking-ruang" class="input-field" placeholder="Nama Ruangan *">
      <input type="text" id="booking-peminjam" class="input-field" placeholder="Nama Peminjam *">
      <input type="text" id="booking-keperluan" class="input-field" placeholder="Keperluan (rapat, seminar, dll)">
      <input type="time" id="booking-jam-mulai" class="input-field" value="08:00">
      <input type="time" id="booking-jam-selesai" class="input-field" value="10:00">
    </div>
    <button class="btn btn-success" onclick="addBooking()" style="width: 100%; margin-top: 0.5rem;">✅ SIMPAN BOOKING</button>
  </div>

  <div class="glass" style="overflow-x: auto;">
    <div class="section-title" style="color: var(--neon);">📋 Daftar Booking</div>
    <div id="booking-list"></div>
  </div>
</div>

<div id="qr-modal" class="qr-modal">
  <div class="qr-content">
    <h3 style="color: var(--neon);">🎫 QR Code Booking</h3>
    <div id="qr-code" style="background: #fff; padding: 10px; border-radius: 8px; display: inline-block; margin: 1rem 0;"></div>
    <p id="qr-text" style="color: #e2e8f0; font-size: 0.75rem; word-break: break-all;"></p>
    <button onclick="closeQR()" class="btn btn-danger" style="margin-top: 1rem;">✕ Tutup</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

<script>
(function() {
  'use strict';

  function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function getBookings() { try { return JSON.parse(localStorage.getItem('dreamos_bookings') || '[]'); } catch(e) { return []; } }
  function saveBookings(data) { localStorage.setItem('dreamos_bookings', JSON.stringify(data)); }
  
  function isAdmin() {
    const user = JSON.parse(localStorage.getItem('dreamos_bound_user') || '{}');
    return ['dev', 'kabag_umum', 'koordinator_umum'].includes(user.role);
  }

  function renderBookings() {
    const bookings = getBookings();
    const el = document.getElementById('booking-list');
    if (!bookings.length) {
      el.innerHTML = '<p style="text-align:center;color:#94a3b8;padding:1rem;">Belum ada booking.</p>';
      return;
    }

    let html = '<table><tr><th>Tgl</th><th>Ruang</th><th>Peminjam</th><th>Jam</th><th>Keperluan</th><th>Status</th><th>Aksi</th></tr>';
    bookings.forEach((b, i) => {
      html += '<tr>' +
        '<td>' + esc(b.tgl) + '</td>' +
        '<td>' + esc(b.ruang) + '</td>' +
        '<td>' + esc(b.nama_peminjam) + '</td>' +
        '<td>' + esc(b.jam_mulai) + '-' + esc(b.jam_selesai) + '</td>' +
        '<td style="font-size:0.65rem;">' + esc(b.keperluan || '-') + '</td>' +
        '<td><span class="badge badge-' + (b.status === 'approved' ? 'approved' : b.status === 'rejected' ? 'rejected' : 'pending') + '">' + (b.status || 'pending') + '</span></td>' +
        '<td style="display:flex;gap:0.2rem;">' +
          '<button onclick="showQR(' + i + ')" class="btn btn-primary" style="font-size:0.5rem;padding:0.2rem 0.4rem;">QR</button>' +
          (isAdmin() ? '<button onclick="approveBooking(\'' + b.id + '\')" class="btn btn-success" style="font-size:0.5rem;padding:0.2rem 0.4rem;">✅</button><button onclick="rejectBooking(\'' + b.id + '\')" class="btn btn-danger" style="font-size:0.5rem;padding:0.2rem 0.4rem;">❌</button>' : '') +
          '<button onclick="deleteBooking(' + i + ')" class="btn btn-danger" style="font-size:0.5rem;padding:0.2rem 0.4rem;">🗑️</button>' +
        '</td>' +
      '</tr>';
    });
    html += '</table>';
    el.innerHTML = html;
  }

  // ===== VALIDASI BENTROK =====
  function isBentrok(newBooking, excludeIndex = -1) {
    const bookings = getBookings();
    return bookings.some((b, i) => {
      if (i === excludeIndex) return false;
      if (b.tgl !== newBooking.tgl || b.ruang !== newBooking.ruang) return false;
      const newStart = newBooking.jam_mulai.replace(':', '');
      const newEnd = newBooking.jam_selesai.replace(':', '');
      const oldStart = b.jam_mulai.replace(':', '');
      const oldEnd = b.jam_selesai.replace(':', '');
      return (newStart < oldEnd && newEnd > oldStart);
    });
  }

  // ===== TAMBAH BOOKING =====
  window.addBooking = async function() {
    const tgl = document.getElementById('booking-tgl').value.trim();
    const ruang = document.getElementById('booking-ruang').value.trim();
    const peminjam = document.getElementById('booking-peminjam').value.trim();
    const keperluan = document.getElementById('booking-keperluan').value.trim();
    const mulai = document.getElementById('booking-jam-mulai').value;
    const selesai = document.getElementById('booking-jam-selesai').value;

    if (!tgl || !ruang || !peminjam) return alert('⚠️ Tanggal, ruangan, dan peminjam wajib diisi!');

    const newBooking = {
      id: 'book_' + Date.now(),
      tgl, ruang, nama_peminjam: peminjam,
      keperluan, jam_mulai: mulai || '08:00', jam_selesai: selesai || '10:00',
      status: 'pending', created_at: new Date().toISOString()
    };

    // Cek bentrok
    if (isBentrok(newBooking)) {
      if (!confirm('⚠️ Jadwal bentrok dengan booking lain di ruangan dan tanggal yang sama. Tetap simpan?')) return;
    }

    const bookings = getBookings();
    bookings.push(newBooking);
    saveBookings(bookings);
    renderBookings();

    // Sync Supabase
    if (window.supabaseClient) {
      window.supabaseClient.from('bookings').insert(newBooking).then(() => {}).catch(() => {});
    } else if (window.OfflineQueue) {
      window.OfflineQueue.add('bookings', 'insert', newBooking);
    }

    // Notifikasi
    if (window.PhantomAlerter) PhantomAlerter.newBooking(ruang, peminjam, tgl);
    if (window.addNotification) window.addNotification('Booking baru: ' + ruang + ' oleh ' + peminjam);
    if (window.BankAudit) BankAudit.log('BOOKING_ADD', { ruang, peminjam, tgl });

    document.getElementById('booking-ruang').value = '';
    document.getElementById('booking-peminjam').value = '';
    document.getElementById('booking-keperluan').value = '';
    alert('✅ Booking tersimpan!');
  };

  // ===== APPROVE/REJECT =====
  window.approveBooking = function(id) {
    if (!isAdmin()) return alert('⛔ Hanya admin yang bisa approve.');
    const bookings = getBookings();
    const b = bookings.find(x => x.id === id);
    if (b) { b.status = 'approved'; saveBookings(bookings); renderBookings(); }
    if (window.supabaseClient) window.supabaseClient.from('bookings').update({ status: 'approved' }).eq('id', id).then(() => {}).catch(() => {});
    if (window.BankAudit) BankAudit.log('BOOKING_APPROVE', { id });
  };

  window.rejectBooking = function(id) {
    if (!isAdmin()) return alert('⛔ Hanya admin yang bisa reject.');
    const bookings = getBookings();
    const b = bookings.find(x => x.id === id);
    if (b) { b.status = 'rejected'; saveBookings(bookings); renderBookings(); }
    if (window.supabaseClient) window.supabaseClient.from('bookings').update({ status: 'rejected' }).eq('id', id).then(() => {}).catch(() => {});
    if (window.BankAudit) BankAudit.log('BOOKING_REJECT', { id });
  };

  // ===== DELETE =====
  window.deleteBooking = function(index) {
    if (!confirm('Hapus booking ini?')) return;
    const bookings = getBookings();
    const deleted = bookings.splice(index, 1)[0];
    saveBookings(bookings);
    renderBookings();
    if (window.supabaseClient) window.supabaseClient.from('bookings').delete().eq('id', deleted.id).then(() => {}).catch(() => {});
    if (window.BankAudit) BankAudit.log('BOOKING_DELETE', { id: deleted.id });
  };

  // ===== QR CODE =====
  window.showQR = function(index) {
    const b = getBookings()[index];
    if (!b) return;
    const qrText = b.tgl + '|' + b.ruang + '|' + b.nama_peminjam + '|' + b.jam_mulai + '-' + b.jam_selesai;
    document.getElementById('qr-text').textContent = qrText;
    document.getElementById('qr-code').innerHTML = '';

    if (typeof qrcode !== 'undefined') {
      const qr = qrcode(0, 'M');
      qr.addData(qrText);
      qr.make();
      document.getElementById('qr-code').innerHTML = qr.createImgTag(5);
    } else {
      document.getElementById('qr-code').innerHTML = '<p style="color:var(--warning);">QR library loading...</p>';
    }

    document.getElementById('qr-modal').style.display = 'flex';
  };

  window.closeQR = function() {
    document.getElementById('qr-modal').style.display = 'none';
    document.getElementById('qr-code').innerHTML = '';
  };

  document.getElementById('qr-modal').addEventListener('click', function(e) {
    if (e.target === this) closeQR();
  });

  // ===== EXPORT CSV =====
  window.exportCSV = function() {
    const bookings = getBookings();
    let csv = 'Tgl,Ruang,Peminjam,Jam,Keperluan,Status\n';
    bookings.forEach(b => {
      csv += `"${b.tgl}","${b.ruang}","${b.nama_peminjam}","${b.jam_mulai}-${b.jam_selesai}","${b.keperluan || '-'}","${b.status || 'pending'}"\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'booking_' + new Date().toISOString().split('T')[0] + '.csv';
    a.click(); URL.revokeObjectURL(a.href);
    alert('✅ CSV berhasil diexport!');
  };

  // ===== SYNC TO CLOUD =====
  window.syncToCloud = async function() {
    if (!window.supabaseClient) return alert('⚠️ Koneksi database tidak tersedia.');
    const bookings = getBookings();
    if (!bookings.length) return alert('⚠️ Tidak ada data untuk disync.');
    let count = 0;
    for (const b of bookings) {
      try { await window.supabaseClient.from('bookings').upsert(b); count++; } catch(e) {}
    }
    alert('✅ ' + count + '/' + bookings.length + ' booking tersync ke cloud!');
    if (window.BankAudit) BankAudit.log('BOOKING_SYNC', { total: bookings.length, success: count });
  };

  // Init
  renderBookings();
  if (window.BankAudit) BankAudit.log('ACCESS_BOOKING_MODULE');
  console.log('📅 Booking Module Ready');
})();
</script>
