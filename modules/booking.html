<script>
(function(){
  var lang = localStorage.getItem('dreamos_lang') || 'id';
  var dict = window.DreamLang ? (window.DreamLang[lang] || window.DreamLang.id) : {};
  function t(key, fb) { return (dict && dict[key]) ? dict[key] : (fb || key); }
  function safeGet(k, fb){ try{ return JSON.parse(localStorage.getItem(k) || JSON.stringify(fb)); }catch(e){ return fb; } }
  function safeSet(k, d){ localStorage.setItem(k, JSON.stringify(d)); }
  function verifyPin(cb){ var pin=prompt('🔐 PIN Admin/Kabag:'); if(pin==='PIN_VERIFIED_BY_HASH'||btoa(pin)===btoa('PIN_VERIFIED_BY_HASH')){ cb(); } else { alert('❌ PIN salah.'); } }

  var state = { tab: 'form' };
  var today = new Date(); today.setHours(0,0,0,0);
  var tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1);
  var minDateStr = tomorrow.toISOString().split('T')[0];
  var holidays = ['2026-01-01','2026-03-29','2026-03-31','2026-04-10','2026-05-01','2026-05-14','2026-05-26','2026-06-01','2026-06-07','2026-06-29','2026-08-17','2026-09-23','2026-12-25'];

  var fridayBlockedRooms = ['Aula SMP', 'Aula SMA', 'Serbaguna', 'Mushalla SMA'];

  function isFridayBlock(ruang, tgl, mulai, selesai) {
    var d = new Date(tgl);
    if (d.getDay() !== 5) return false;
    if (!fridayBlockedRooms.includes(ruang)) return false;
    return (mulai < '13:00' && selesai > '10:30');
  }

  function hasOverlap(ruang, tgl, mulai, selesai, excludeId){
    var data = safeGet('dreamos_bookings', []);
    // 🛡️ STRENGTHEN: Cek juga di Outbox (Hybrid Sync) biar anti-double booking pas offline!
    var outbox = safeGet('dreamos_sync_outbox', []).filter(o => o.ruang && o.tgl); 
    var allBookings = data.concat(outbox);
    
    return allBookings.some(function(b){
      if(b.id === excludeId) return false;
      if(b.ruang !== ruang || b.tgl !== tgl) return false;
      // Strict overlap logic
      return mulai < b.jam_selesai && selesai > b.jam_mulai;
    });
  }

  function getDayRule(tgl){
    var d = new Date(tgl); var day = d.getDay();
    var diff = Math.ceil((new Date(tgl).setHours(0,0,0,0) - today) / 86400000);
    var r = { block:false, note:'', status:'pending', color:'#64748b' };
    if(day===0 || holidays.includes(tgl)){ r.block=true; r.note='🚫 LIBUR: Minggu / Hari Besar. Booking hanya Senin-Jumat.'; r.color='#ef4444'; return r; }
    if(diff < 1){ r.block=true; r.note='⏰ DEADLINE: Booking maksimal H-1.'; r.color='#ef4444'; return r; }
    if(day===6){ r.note='🟣 SABTU: Wajib ACC Ganda (Admin Only).'; r.status='pending_sabtu'; r.color='#8b5cf6'; return r; }
    r.note='🔄 HARI KERJA: Senin-Jumat 07.30-16.00 WIB.'; r.color='#0ea5e9';
    return r;
  }

  function getFacilityList() {
    return [
      'Aula SMP', 'Aula SMA', 'Saung Besar', 'Saung Kecil', 'Serbaguna',
      'Mushalla SMA', 'Lapangan Basket', 'Lapangan Volly', 'Lapangan Tanah',
      'Lapangan SMA', 'Kantin SMP', 'Kantin SMA', 'Labkom SD', 'Labkom SMP',
      'Labkom SMA', 'Perpustakaan SD', 'Perpustakaan SMP', 'Perpustakaan SMA'
    ];
  }

  function generateQR(id) {
    var modal = document.createElement('div'); modal.className = 'qr-modal';
    var box = document.createElement('div'); box.className = 'qr-box';
    var booking = safeGet('dreamos_bookings',[]).find(b => b.id === id);
    box.innerHTML = '<h3>✅ Booking Disetujui</h3><p>'+booking.ruang+' | '+booking.tgl+' | '+booking.jam_mulai+'-'+booking.jam_selesai+'</p><p style="font-size:0.8rem;color:#64748b;">Scan QR ini untuk check-in</p><div id="qrcode-'+id+'"></div><button onclick="this.parentNode.parentNode.remove()" style="margin-top:1rem;background:#ef4444;color:#fff;border:none;padding:0.5rem 1rem;border-radius:0.5rem;">Tutup</button>';
    modal.appendChild(box); document.body.appendChild(modal);
    new QRCode(document.getElementById('qrcode-'+id), { text: 'DREAMOS-BOOKING:'+id, width: 128, height: 128 });
  }

  function renderApp(){
    var app = document.getElementById('booking-app-content');
    if(!app) return;
    var data = safeGet('dreamos_bookings', []);
    var h = '<div style="display:flex;gap:0.4rem;margin-bottom:0.75rem;">';
    h += '<button data-act="tab" data-val="timeline" class="bk-tab" style="background:'+(state.tab==='timeline'?'#f59e0b;color:#000;':'#1e293b;color:#e2e8f0;')+'">📊 Timeline</button>';
    h += '<button data-act="tab" data-val="form" class="bk-tab" style="background:'+(state.tab==='form'?'#f59e0b;color:#000;':'#1e293b;color:#e2e8f0;')+'">📝 Form</button>';
    h += '<button data-act="tab" data-val="list" class="bk-tab" style="background:'+(state.tab==='list'?'#f59e0b;color:#000;':'#1e293b;color:#e2e8f0;')+'">📋 List</button></div>';

    if(state.tab==='form'){
      h += '<div class="bk-panel">';
      h += '<input id="bk-nama" class="bk-input" placeholder="Nama Pemohon *">';
      h += '<select id="bk-divisi" class="bk-select"><option value="">-- Pilih Divisi/Unit --</option><option value="TK">TK</option><option value="SD">SD</option><option value="SMP">SMP</option><option value="SMA">SMA</option><option value="OPERASIONAL">OPERASIONAL</option></select>';
      h += '<input id="bk-hp" type="tel" class="bk-input" placeholder="No HP / WA">';
      h += '<select id="bk-sarana" class="bk-select"><option value="">-- Pilih Sarana --</option>';
      getFacilityList().forEach(function(f) { h += '<option value="'+f+'">'+f+'</option>'; });
      h += '</select>';
      h += '<div style="font-size:0.65rem;color:#64748b;margin-bottom:0.4rem;">🕌 Masjid maintenance. Aula/Serbaguna TIDAK BISA dipakai Jumat 10:30-13:00.</div>';
      h += '<div style="display:flex;gap:0.4rem;margin-bottom:0.4rem;"><input id="bk-tgl" type="date" class="bk-input" min="'+minDateStr+'" value="'+minDateStr+'" style="flex:1;"><input id="bk-mulai" type="time" class="bk-input" style="flex:1;" value="08:00"><input id="bk-selesai" type="time" class="bk-input" style="flex:1;" value="10:00"></div>';
      h += '<div id="bk-rule-box" style="background:rgba(100,116,139,0.2);color:#94a3b8;padding:0.4rem;border-radius:0.4rem;font-size:0.7rem;margin-bottom:0.5rem;">Pilih tanggal dan sarana untuk melihat aturan.</div>';
      h += '<div id="bk-jumat-alert" class="rule-alert" style="display:none;">⚠️ PERINGATAN: Ruangan ini tidak bisa dipakai Jumat 10:30-13:00 (Shalat Jumat).</div>';
      h += '<textarea id="bk-keperluan" class="bk-input" placeholder="Keperluan / Acara" rows="2" style="resize:none;"></textarea>';
      h += '<button data-act="submit" style="width:100%;padding:0.6rem;background:#f59e0b;color:#000;border:none;border-radius:0.5rem;font-weight:700;cursor:pointer;">📩 Ajukan Booking</button>';
      h += '<div id="bk-msg" style="text-align:center;margin-top:0.4rem;font-size:0.75rem;"></div></div>';
    } else if(state.tab==='list'){
      var sorted = data.slice().sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
      if(!sorted.length) h += '<p style="text-align:center;color:#64748b;">Belum ada booking.</p>';
      else {
        sorted.forEach(b => {
          var sc = b.status==='approved'?'#10b981':'#f59e0b';
          h += '<div class="bk-item" style="border-left-color:'+sc+';">';
          h += '<div style="font-weight:700;">📍 '+b.ruang+' | 📅 '+b.tgl+' | ⏰ '+b.jam_mulai+'-'+b.jam_selesai+'</div>';
          h += '<div style="font-size:0.7rem;color:#94a3b8;">👤 '+b.nama_peminjam+' | 🏫 '+ (b.divisi || '-') +' | 📞 '+b.no_hp+'</div>';
          var progress = 0;
          if(b.status==='approved') progress = 100;
          else if(b.status==='pending_admin' || b.status==='pending_sabtu') progress = 50;
          else progress = 25;
          h += '<div class="tracking-bar"><div class="tracking-fill" style="width:'+progress+'%;background:'+(progress===100?'#10b981':'#f59e0b')+';"></div></div>';
          h += '<div style="margin-top:0.3rem;display:flex;gap:0.3rem;">';
          if(b.status==='approved') h += '<button data-act="qr" data-id="'+b.id+'" style="background:#8b5cf6;color:#fff;border:none;border-radius:0.3rem;padding:0.2rem 0.5rem;font-size:0.6rem;">QR Check-in</button>';
          if(b.status!=='approved') h += '<button data-act="approve" data-id="'+b.id+'" style="background:#10b981;color:#fff;border:none;border-radius:0.3rem;padding:0.2rem 0.5rem;font-size:0.6rem;">✅ ACC</button>';
          h += '<button data-act="delete" data-id="'+b.id+'" style="background:#ef4444;color:#fff;border:none;border-radius:0.3rem;padding:0.2rem 0.5rem;font-size:0.6rem;">🗑️</button>';
          h += '</div></div>';
        });
      }
    } else if(state.tab==='timeline'){
      var date = document.getElementById('bk-filter-date')?.value || today.toISOString().split('T')[0];
      var filtered = data.filter(b => b.tgl === date);
      h += '<div class="bk-panel"><h4 style="margin-top:0;">📊 Timeline - '+date+'</h4>';
      if(!filtered.length) h += '<p style="color:#64748b;text-align:center;">Tidak ada booking untuk tanggal ini.</p>';
      else {
        var hours = ['07:30','08:30','09:30','10:30','11:30','12:30','13:30','14:30','15:30'];
        hours.forEach(function(hour){
          h += '<div class="timeline-container"><span class="timeline-hour">'+hour+'</span>';
          filtered.forEach(function(b){
            if(b.jam_mulai >= hour && b.jam_mulai < (parseInt(hour)+1).toString().padStart(2,'0')+':00'){
              var cls = b.status==='approved'?'approved':'pending';
              h += '<div class="timeline-slot '+cls+'" data-act="show-booking" data-id="'+b.id+'">'+b.ruang+' - '+b.nama_peminjam+' ('+b.jam_mulai+'-'+b.jam_selesai+')</div>';
            }
          });
          h += '</div>';
        });
      }
      h += '</div>';
    }
    app.innerHTML = h;
  }

  setTimeout(function(){
    var app = document.getElementById('booking-app');
    if(!app) return;
    renderApp();

    app.addEventListener('change', function(e){
      var tgl = document.getElementById('bk-tgl')?.value;
      var sarana = document.getElementById('bk-sarana')?.value;
      var box = document.getElementById('bk-rule-box');
      var alertEl = document.getElementById('bk-jumat-alert');
      if(tgl && box){
        var rule = getDayRule(tgl);
        box.style.background = rule.color+'22'; box.style.color = rule.color;
        box.textContent = rule.note;
      }
      if(tgl && sarana && fridayBlockedRooms.includes(sarana) && new Date(tgl).getDay()===5){
        if(alertEl) alertEl.style.display = 'block';
      } else {
        if(alertEl) alertEl.style.display = 'none';
      }
    });

    app.addEventListener('click', function(e){
      var t = e.target.closest('[data-act]');
      if(!t) return;
      var act = t.dataset.act, val = t.dataset.val, id = t.dataset.id;
      if(act==='tab'){ state.tab=val; renderApp(); }
      else if(act==='submit'){
        var nama=document.getElementById('bk-nama').value.trim();
        var divisi=document.getElementById('bk-divisi').value;
        var hp=document.getElementById('bk-hp').value.trim();
        var sarana=document.getElementById('bk-sarana').value;
        var tgl=document.getElementById('bk-tgl').value;
        var mulai=document.getElementById('bk-mulai').value;
        var selesai=document.getElementById('bk-selesai').value;
        var keperluan=document.getElementById('bk-keperluan').value.trim();
        var msg = document.getElementById('bk-msg');
        if(!nama||!sarana||!tgl||!mulai||!selesai){ msg.style.color='#ef4444'; msg.textContent='Lengkapi data!'; return; }
        if(selesai <= mulai){ msg.style.color='#ef4444'; msg.textContent='Jam selesai harus > mulai!'; return; }
        if(mulai < '07:30' || selesai > '16:00'){ msg.style.color='#ef4444'; msg.textContent='⏰ Jam booking hanya 07.30-16.00 WIB (Senin-Jumat).'; return; }
        var rule = getDayRule(tgl);
        if(rule.block){ msg.style.color='#ef4444'; msg.textContent=rule.note; return; }
        if(isFridayBlock(sarana, tgl, mulai, selesai)){ msg.style.color='#ef4444'; msg.textContent='🚫 Dilarang booking ruangan ini pada Jumat 10:30-13:00 (Shalat Jumat).'; return; }
        if(hasOverlap(sarana, tgl, mulai, selesai, null)){ msg.style.color='#ef4444'; msg.textContent='Tabrakan jadwal!'; return; }
        var save = async function(){
          var id = 'bk_'+Date.now();
          var gps = 'DENIED';
          try { if(window.DreamGeo) { var loc = await window.DreamGeo.get(); gps = loc.lat+','+loc.lng; } } catch(e){}
          var profile = JSON.parse(localStorage.getItem('dreamos_user_profile') || '{}');
          var dna = profile.deviceDNA || 'Unknown';
          
          var payload = {
            id:id, nama_peminjam:nama, divisi:divisi, no_hp:hp, ruang:sarana, 
            tgl:tgl, jam_mulai:mulai, jam_selesai:selesai, keperluan:keperluan, 
            status:rule.status, created_at:new Date().toISOString(),
            gps_lokasi: gps, device_dna: dna
          };

          // 1. Local First (Biar UI langsung update & anti-double booking berikutnya)
          var data = safeGet('dreamos_bookings',[]);
          data.push(payload);
          safeSet('dreamos_bookings', data);
          
          // 2. Hybrid Cloud Sync (Masuk antrian kalau offline)
          if(typeof window.HybridSync !== 'undefined') {
            window.HybridSync.push('bookings', payload);
          }

          
          // 🔔 KIRIM NOTIFIKASI KE HP USER
          if ("Notification" in window) {
              if (Notification.permission === "granted") {
                  new Notification("✅ Booking Diajukan!", {
                      body: 'Booking ' + sarana + ' pada ' + tgl + ' (' + mulai + '-' + selesai + ') berhasil diajukan!',
                      icon: '../assets/logo-sultan.png'
                  });
              } else if (Notification.permission !== "denied") {
                  Notification.requestPermission().then(permission => {
                      if (permission === "granted") {
                          new Notification("✅ Booking Diajukan!", {
                              body: 'Booking ' + sarana + ' berhasil diajukan & masuk antrian sync!',
                              icon: '../assets/logo-sultan.png'
                          });
                      }
                  });
              }
          }

          msg.style.color='#10b981'; msg.textContent='✅ Booking Diajukan & Masuk Antrian Sync!';
          setTimeout(renderApp, 800);
        };
        if(rule.status==='pending_admin' || rule.status==='pending_sabtu') verifyPin(save); else save();
      }
      else if(act==='approve'){
        verifyPin(function(){
          var data = safeGet('dreamos_bookings',[]);
          var updated = data.map(function(b){ if(b.id===id){ var c=JSON.parse(JSON.stringify(b)); c.status='approved'; return c; } return b; });
          safeSet('dreamos_bookings', updated); renderApp();
        });
      }
      else if(act==='delete'){
        verifyPin(function(){
          safeSet('dreamos_bookings', safeGet('dreamos_bookings',[]).filter(b => b.id !== id));
          renderApp();
        });
      }
    });
    console.log('✅ Booking Pro Final V2 siap');
  }, 150);
})();

async function simpanBooking() {
    const ruangan = document.getElementById('booking-ruangan')?.value || '';
    const tgl = document.getElementById('booking-tgl')?.value || '';
    const jamMulai = document.getElementById('booking-jam-mulai')?.value || '';
    const jamSelesai = document.getElementById('booking-jam-selesai')?.value || '';
    const keperluan = document.getElementById('booking-keperluan')?.value || '';
    if (!ruangan || !tgl || !jamMulai || !jamSelesai) return alert('⚠️ Ruangan, tanggal, dan jam wajib diisi!');
    
    try {
        const user = JSON.parse(localStorage.getItem('dreamos_bound_user'));
        const { error } = await window.parent.supabase.from('bookings').insert({
            peminjam_id: user?.id,
            ruangan, tgl, jam_mulai: jamMulai, jam_selesai: jamSelesai, keperluan,
            status: 'pending'
        });
        if (error) throw error;
        alert('✅ Booking berhasil dikirim ke cloud!');
        if (typeof tampilkanBooking === 'function') tampilkanBooking();
    } catch(e) {
        alert('⚠️ Gagal: ' + e.message);
    }
}

function tampilkanLaporan() {
  var cache = JSON.parse(localStorage.getItem('dreamos_k3_reports') || '[]');
  if (cache.length) renderList(cache); // tampilkan cache dulu
  setSyncStatus('cached');
  
  try {
    window.parent.supabase.from('k3_reports').select('*').then(function(res) {
      if (!res.error && res.data) {
        localStorage.setItem('dreamos_k3_reports', JSON.stringify(res.data));
        renderList(res.data);
        setSyncStatus('synced');
      }
    });
  } catch(e) { setSyncStatus('error'); }

    const container = document.getElementById('booking-list');
    if (!container) return;
    container.innerHTML = '<p>Memuat dari cloud...</p>';
    try {
        const { data, error } = await window.parent.supabase
            .from('bookings')
            .select('*, users!inner(nama)')
            .order('tgl', { ascending: false });
        if (error) throw error;
        if (!data || data.length === 0) {
            container.innerHTML = '<p>Belum ada booking.</p>';
            return;
        }
        container.innerHTML = data.map(b => `
            <div style="background:rgba(0,0,0,0.3); padding:0.5rem; border-radius:8px; margin-bottom:0.3rem;">
                <b>${b.ruangan}</b> - ${b.tgl} (${b.jam_mulai}-${b.jam_selesai})<br>
                <small>${b.users?.nama || 'Unknown'} | ${b.keperluan || '-'}</small>
                <span class="badge badge-${b.status==='approved'?'approved':'pending'}">${b.status}</span>
            </div>
        `).join('');
        localStorage.setItem('dreamos_bookings', JSON.stringify(data));
    } catch(e) {
        const cache = JSON.parse(localStorage.getItem('dreamos_bookings')||'[]');
        container.innerHTML = cache.length ? cache.map(b => `<div>${b.ruangan} - ${b.tgl}</div>`).join('') : '<p>Offline - tidak ada data.</p>';
    }
}


function setSyncStatus(s) {
  var b = document.getElementById('sync-badge');
  if (b) b.innerHTML = s === 'synced' ? '🟢 Synced' : s === 'cached' ? '🟡 Cached' : '🔴 Error';
}
