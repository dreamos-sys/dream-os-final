<style>
    :root { --glass-bg: rgba(15, 23, 42, 0.5); --glass-border: rgba(0, 255, 157, 0.1); --neon: #00ff9d; --accent: #0ea5e9; --warning: #e11d48; --gold: #f59e0b; --purple: #8b5cf6; }
    * { box-sizing: border-box; }
    /* body style removed - inherit from parent */
    .glass { background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 1.2rem; margin-bottom: 1rem; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
    .back-btn { position: fixed; top: 0.8rem; left: 0.8rem; z-index: 1000; background: rgba(30,41,59,0.9); border: 1px solid var(--neon); color: var(--neon); padding: 0.4rem 0.8rem; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.7rem; }
    .btn { padding: 0.6rem 1rem; border: none; border-radius: 10px; font-weight: 700; font-size: 0.75rem; cursor: pointer; transition: all 0.2s ease; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-success { background: #10b981; color: #fff; }
    .btn-danger { background: var(--warning); color: #fff; }
    .btn:hover { transform: translateY(-1px); opacity: 0.95; }
    .input-field, select, textarea { width: 100%; padding: 0.6rem; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #e2e8f0; font-size: 0.78rem; outline: none; }
    .input-field:focus, select:focus { border-color: var(--neon); }
    table { width:100%; border-collapse:collapse; font-size:0.7rem; }
    th { background: rgba(0,0,0,0.3); color: #94a3b8; padding: 0.4rem; text-align: left; }
    td { padding: 0.35rem 0.4rem; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .badge { padding: 0.12rem 0.4rem; border-radius: 10px; font-size: 0.55rem; font-weight: 600; }
    .badge-pending { background: rgba(245,158,11,0.2); color: #f59e0b; }
    .badge-approved { background: rgba(16,185,129,0.2); color: #10b981; }
    .badge-rejected { background: rgba(239,68,68,0.2); color: #ef4444; }
    .section-title { font-size: 0.85rem; font-weight: 700; margin: 0 0 0.8rem; display: flex; align-items: center; gap: 0.4rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.5rem; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
    @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }
    .sync-badge { font-size: 0.65rem; color: #94a3b8; margin-bottom: 0.5rem; }
  </style>
<button class="back-btn" onclick="window.goHome()">← HOME</button>

<div style="max-width:800px; margin:0 auto; padding:4rem 1.2rem 5rem;">

  <!-- Header -->
  <div class="glass" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem;">
    <div>
      <h2 style="color:var(--neon); margin:0; font-size:1rem;">📅 Pemesanan Ruangan</h2>
      <div class="sync-badge" id="sync-badge">🟡 Cached</div>
    </div>
    <div style="display:flex; gap:0.4rem;">
      <button class="btn btn-primary" onclick="document.getElementById('booking-form').style.display='block'">+ Tambah Booking</button>
      <button class="btn btn-success" onclick="exportBooking()">📥 CSV</button>
    </div>
  </div>

  <!-- Form Tambah Booking -->
  <div id="booking-form" class="glass" style="display:none;">
    <div class="section-title" style="color:var(--neon);">📝 Tambah Pesanan Baru</div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.5rem; margin-bottom:0.5rem;">
      <select id="booking-ruangan" class="input-field">
        <option value="">Pilih Ruangan</option>
        <option value="Aula Besar">Aula Besar</option>
        <option value="Ruang Meeting 1">Ruang Meeting 1</option>
        <option value="Ruang Meeting 2">Ruang Meeting 2</option>
        <option value="Lab Komputer">Lab Komputer</option>
        <option value="Lapangan">Lapangan</option>
        <option value="Musholla">Musholla</option>
      </select>
      <input type="date" id="booking-tgl" class="input-field" placeholder="Tanggal">
      <input type="time" id="booking-jam-mulai" class="input-field" placeholder="Jam Mulai">
      <input type="time" id="booking-jam-selesai" class="input-field" placeholder="Jam Selesai">
      <input type="text" id="booking-peminjam" class="input-field" placeholder="Nama Peminjam" style="grid-column:span 2;">
      <textarea id="booking-keperluan" class="input-field" placeholder="Keperluan / Agenda" style="grid-column:span 2; min-height:60px;"></textarea>
    </div>
    <div style="display:flex; gap:0.5rem;">
      <button class="btn btn-success" onclick="simpanBooking()" style="flex:1;">💾 Simpan ke Cloud</button>
      <button class="btn btn-danger" onclick="document.getElementById('booking-form').style.display='none'" style="flex:1;">❌ Batal</button>
    </div>
  </div>

  <!-- Daftar Booking -->
  <div class="glass">
    <div class="section-title" style="color:var(--accent);">📋 Daftar Pemesanan</div>
    <div id="booking-list">🔄 Memuat data...</div>
  </div>

</div>

<script>
// Auto-fallback untuk fungsi global
if (!window.goHome) window.goHome = function() { 
  if (window.parent && window.parent.goHome) window.parent.goHome();
  else window.location.reload();
};
if (!window.supabaseClient && window.parent && window.parent.supabaseClient) 
  window.supabaseClient = window.parent.supabaseClient;

(function(){
  // ========== HELPERS ==========
  function safeGet(k, fb) { try { return JSON.parse(localStorage.getItem(k) || JSON.stringify(fb)); } catch(e) { return fb; } }
  function safeSet(k, d) { localStorage.setItem(k, JSON.stringify(d)); }
  function getCurrentUser() { try { return JSON.parse(localStorage.getItem('dreamos_bound_user') || 'null'); } catch(e) { return null; } }
  
  // Safety check
  if (!window.supabaseClient) {
    console.warn('⚠️ Supabase client belum siap di booking module');
  }

  // ========== SYNC BADGE ==========
  function setSyncStatus(status) {
    var badge = document.getElementById('sync-badge');
    if (!badge) return;
    if (status === 'synced') { badge.innerHTML = '🟢 Synced'; badge.style.color = '#10b981'; }
    else if (status === 'cached') { badge.innerHTML = '🟡 Cached'; badge.style.color = '#f59e0b'; }
    else { badge.innerHTML = '🔴 Error'; badge.style.color = '#ef4444'; }
  }

  // ========== SIMPAN BOOKING ==========
  window.simpanBooking = async function() {
    var ruangan = document.getElementById('booking-ruangan').value;
    var tgl = document.getElementById('booking-tgl').value;
    var jamMulai = document.getElementById('booking-jam-mulai').value;
    var jamSelesai = document.getElementById('booking-jam-selesai').value;
    var peminjam = document.getElementById('booking-peminjam').value.trim();
    var keperluan = document.getElementById('booking-keperluan').value.trim();
    var user = getCurrentUser();

    if (!ruangan || !tgl || !jamMulai || !jamSelesai) return alert('⚠️ Ruangan, tanggal, dan jam wajib diisi!');
    if (jamMulai >= jamSelesai) return alert('⚠️ Jam selesai harus lebih besar dari jam mulai.');

    var newBooking = {
      id: 'book_' + Date.now(),
      ruangan: ruangan,
      tgl: tgl,
      jam_mulai: jamMulai,
      jam_selesai: jamSelesai,
      nama_peminjam: peminjam || user?.nama || 'Unknown',
      keperluan: keperluan,
      status: 'pending',
      created_at: new Date().toISOString(),
      peminjam_id: user?.id || null
    };

    // Simpan ke localStorage dulu (offline-first)
    var localData = safeGet('dreamos_bookings', []);
    localData.unshift(newBooking);
    safeSet('dreamos_bookings', localData);
    tampilkanBooking();
    setSyncStatus('cached');

    // Kirim ke Supabase
    try {
      var { error } = await window.supabaseClient.from('bookings').insert([newBooking]);
      if (error) throw error;
      setSyncStatus('synced');
      console.log('✅ Booking tersimpan ke cloud.');
    } catch(e) {
      console.warn('⚠️ Gagal sync ke cloud:', e.message);
      // Tetap tersimpan di localStorage, akan dicoba lagi nanti
      window.addToRetryQueue && window.addToRetryQueue({
        label: 'Booking: ' + ruangan,
        fn: async () => await window.supabaseClient.from('bookings').insert([newBooking])
      });
    }

    // Reset form
    ['booking-ruangan','booking-tgl','booking-jam-mulai','booking-jam-selesai','booking-peminjam','booking-keperluan'].forEach(function(id) {
      document.getElementById(id).value = '';
    });
    document.getElementById('booking-form').style.display = 'none';
    alert('✅ Booking berhasil disimpan!');
  };

  // ========== TAMPILKAN BOOKING ==========
  window.tampilkanBooking = async function() {
    var container = document.getElementById('booking-list');
    if (!container) return;
    container.innerHTML = '<p style="color:#94a3b8;">🔄 Memuat dari cloud...</p>';

    // Coba ambil dari Supabase
    try {
      var { data, error } = await window.supabaseClient
        .from('bookings')
        .select('*')
        .order('tgl', { ascending: false })
        .order('jam_mulai', { ascending: false })
        .limit(50);

      if (error) throw error;
      if (data && data.length > 0) {
        safeSet('dreamos_bookings', data); // update cache
        renderBookingList(data);
        setSyncStatus('synced');
        return;
      }
    } catch(e) {
      console.warn('⚠️ Gagal ambil dari cloud:', e.message);
    }

    // Fallback ke localStorage
    var localData = safeGet('dreamos_bookings', []);
    setSyncStatus(localData.length > 0 ? 'cached' : 'error');
    renderBookingList(localData);
  };

  function renderBookingList(data) {
    var container = document.getElementById('booking-list');
    if (!container) return;
    if (!data || data.length === 0) {
      container.innerHTML = '<p style="color:#94a3b8;text-align:center;">Belum ada pemesanan.</p>';
      return;
    }

    var html = '<table><tr><th>Ruangan</th><th>Tanggal</th><th>Jam</th><th>Peminjam</th><th>Keperluan</th><th>Status</th></tr>';
    data.forEach(function(b) {
      var statusClass = b.status === 'approved' ? 'approved' : (b.status === 'rejected' ? 'rejected' : 'pending');
      html += '<tr>' +
        '<td><b>' + (b.ruangan || '-') + '</b></td>' +
        '<td>' + (b.tgl || '-') + '</td>' +
        '<td>' + (b.jam_mulai || '') + ' - ' + (b.jam_selesai || '') + '</td>' +
        '<td>' + (b.nama_peminjam || '-') + '</td>' +
        '<td>' + (b.keperluan || '-') + '</td>' +
        '<td><span class="badge badge-' + statusClass + '">' + (b.status || 'pending') + '</span></td>' +
        '</tr>';
    });
    html += '</table>';
    container.innerHTML = html;
  }

  // ========== EXPORT CSV ==========
  window.exportBooking = function() {
    var data = safeGet('dreamos_bookings', []);
    if (!data.length) return alert('⚠️ Tidak ada data untuk diexport.');
    var csv = 'Ruangan,Tanggal,Jam Mulai,Jam Selesai,Peminjam,Keperluan,Status\n';
    data.forEach(function(b) {
      csv += '"' + (b.ruangan||'') + '","' + (b.tgl||'') + '","' + (b.jam_mulai||'') + '","' + (b.jam_selesai||'') + '","' + (b.nama_peminjam||'') + '","' + (b.keperluan||'') + '","' + (b.status||'') + '"\n';
    });
    var blob = new Blob([csv], {type: 'text/csv'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'booking_' + new Date().toISOString().split('T')[0] + '.csv';
    a.click();
  };

  // Init
  tampilkanBooking();
})();
</script>
