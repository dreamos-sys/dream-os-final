<style>:root{--neon:#00ff9d;--accent:#0ea5e9}*{box-sizing:border-box}body{background:#0a0e27;color:#e2e8f0;font-family:'Inter',sans-serif;min-height:100vh;margin:0;padding:1rem}.glass{background:rgba(15,23,42,0.7);backdrop-filter:blur(20px);border:1px solid rgba(0,255,157,0.1);border-radius:16px;padding:1rem;margin-bottom:1rem}.btn{padding:0.5rem 1rem;border:none;border-radius:8px;font-weight:700;cursor:pointer}.btn-success{background:#10b981;color:#fff}.btn-danger{background:#e11d48;color:#fff}.input-field{width:100%;padding:0.6rem;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#e2e8f0;font-size:0.8rem;outline:none;margin-bottom:0.5rem}table{width:100%;border-collapse:collapse;font-size:0.7rem}th{background:rgba(0,0,0,0.3);color:#94a3b8;padding:0.4rem;text-align:left}td{padding:0.35rem;border-bottom:1px solid rgba(255,255,255,0.03)}</style>
<button onclick="window.goHome()" style="background:rgba(30,41,59,0.9);border:1px solid var(--neon);color:var(--neon);padding:0.4rem 0.8rem;border-radius:8px;cursor:pointer;font-weight:700;font-size:0.7rem;position:fixed;top:0.8rem;left:0.8rem;z-index:1000">← HOME</button>
<div style="max-width:800px;margin:0 auto;padding-top:3.5rem;">
  <div class="glass"><h2 style="color:var(--neon)">📦 Stok Gudang</h2>
    <input type="text" id="stok-nama" class="input-field" placeholder="Nama Barang">
    <input type="number" id="stok-qty" class="input-field" placeholder="Jumlah">
    <input type="text" id="stok-lokasi" class="input-field" placeholder="Lokasi / Gudang">
    <button class="btn btn-success" onclick="addStok()" style="width:100%">✅ SIMPAN BARANG</button>
  </div>
  <div class="glass"><h3 style="color:var(--accent)">📋 Daftar Barang</h3><div id="stok-list"></div></div>
</div>
<script>
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function renderList(){var s=JSON.parse(localStorage.getItem('dreamos_stok')||'[]');document.getElementById('stok-list').innerHTML=s.length?('<table><tr><th>Nama</th><th>Qty</th><th>Lokasi</th><th>Aksi</th></tr>'+s.map(function(x,i){return'<tr><td>'+esc(x.nama)+'</td><td>'+x.qty+'</td><td>'+esc(x.lokasi)+'</td><td><button onclick="deleteStok('+i+')" class="btn btn-danger" style="font-size:0.5rem;">🗑️</button></td></tr>'}).join('')+'</table>'):'<p>Belum ada data.</p>'}
window.addStok=function(){var nama=document.getElementById('stok-nama').value.trim();var qty=parseInt(document.getElementById('stok-qty').value)||0;var lokasi=document.getElementById('stok-lokasi').value.trim();if(!nama||qty<=0)return alert('⚠️ Nama dan jumlah harus diisi!');var s=JSON.parse(localStorage.getItem('dreamos_stok')||'[]');s.push({nama:nama,qty:qty,lokasi:lokasi||'-',id:'stok_'+Date.now()});localStorage.setItem('dreamos_stok',JSON.stringify(s));renderList();document.getElementById('stok-nama').value='';document.getElementById('stok-qty').value='';document.getElementById('stok-lokasi').value=''}
window.deleteStok=function(i){var s=JSON.parse(localStorage.getItem('dreamos_stok')||'[]');s.splice(i,1);localStorage.setItem('dreamos_stok',JSON.stringify(s));renderList()}
renderList()
</script>
