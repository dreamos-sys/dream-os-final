      <input type="text" id="f-lokasi" placeholder="Lokasi" style="background:#0f172a;border:1px solid rgba(255,255,255,0.1);border-radius:0.5rem;padding:0.5rem;color:#e2e8f0;font-size:0.75rem;">
      <input type="number" id="f-harga" placeholder="Harga (Rp)" style="grid-column:span 2;background:#0f172a;border:1px solid rgba(255,255,255,0.1);border-radius:0.5rem;padding:0.5rem;color:#e2e8f0;font-size:0.75rem;">
    </div>
    <button id="btn-save-item" style="width:100%;padding:0.5rem;margin-top:0.5rem;background:#10b981;color:white;border:none;border-radius:0.5rem;cursor:pointer;font-weight:600;">💾 Simpan</button>
  </div>
  <div style="background:rgba(15,23,42,0.6);border:1px solid rgba(255,255,255,0.1);border-radius:0.75rem;padding:0.75rem;margin-bottom:0.75rem;"><h4 style="color:#eab308;margin:0 0 0.5rem;">📊 Tren Stok</h4><div style="height:200px;"><canvas id="stock-chart"></canvas></div></div>
  <div id="stok-list" style="display:flex;flex-direction:column;gap:0.4rem;"></div>
</div>
<script>
(function(){
  function g(k){try{return JSON.parse(localStorage.getItem(k)||"[]");}catch(e){return[];}}
  function s(k,d){localStorage.setItem(k,JSON.stringify(d));}
  function fmt(n){return "Rp "+(parseInt(n)||0).toLocaleString("id-ID");}
  function dt(iso){if(!iso)return"-";var d=new Date(iso);return d.getDate()+"/"+(d.getMonth()+1)+" "+d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");}
  window.state={showForm:false,search:"",filterCategory:"all",showProcurement:false,showOpname:false,expandedHistory:null,opnameData:{},scannerActive:false};
  var html5QrCode=null;
  function logMovement(id,nm,delta,reason,user){var l=g("dreamos_stok_audit");l.push({id:"log_"+Date.now(),itemId:id,itemName:nm,delta:delta,reason:reason,user:user||"Petugas",time:new Date().toISOString()});s("dreamos_stok_audit",l);}
  window.toggleForm=function(){window.state.showForm=!window.state.showForm;var el=document.getElementById("stok-form");if(el){el.style.display=window.state.showForm?"block":"none";}};
  window.toggleProcurement=function(){window.state.showProcurement=!window.state.showProcurement;var el=document.getElementById("procurement-panel");if(el){el.style.display=window.state.showProcurement?"block":"none";if(window.state.showProcurement)renderProcurement();}};
  window.toggleOpname=function(){window.state.showOpname=!window.state.showOpname;var el=document.getElementById("opname-panel");if(el){el.style.display=window.state.showOpname?"block":"none";if(window.state.showOpname)renderOpname();}};
  window.toggleScanner=function(){var m=document.getElementById("scanner-modal");if(m){m.style.display="flex";initScanner();}};
  window.stopScanner=function(){var m=document.getElementById("scanner-modal");if(m)m.style.display="none";if(html5QrCode&&window.state.scannerActive){html5QrCode.stop().then(function(){html5QrCode.clear();window.state.scannerActive=false;}).catch(function(){});}html5QrCode=null;window.state.scannerActive=false;};
  window.loadItems=function(){var all=g("dreamos_stok");var tj=all.length;var tn=all.reduce(function(s,i){return s+((i.harga||0)*(i.jumlah||0));},0);var mn=all.filter(function(i){return i.jumlah<=i.minimal&&i.jumlah>0;}).length;var hb=all.filter(function(i){return i.jumlah===0;}).length;document.getElementById("stok-stats").innerHTML='<div><div style="font-size:1.2rem;font-weight:700;color:#eab308;">'+tj+'</div><div style="font-size:0.55rem;color:#94a3b8;">Jenis</div></div><div><div style="font-size:1.2rem;font-weight:700;color:#10b981;">'+fmt(tn)+'</div><div style="font-size:0.55rem;color:#94a3b8;">Nilai</div></div><div><div style="font-size:1.2rem;font-weight:700;color:'+(mn>0?"#f59e0b":"#10b981")+';">'+mn+'</div><div style="font-size:0.55rem;color:#94a3b8;">Menipis</div></div><div><div style="font-size:1.2rem;font-weight:700;color:'+(hb>0?"#ef4444":"#10b981")+';">'+hb+'</div><div style="font-size:0.55rem;color:#94a3b8;">Habis</div></div>';var al=document.getElementById("stok-alert");if(mn>0||hb>0){al.style.display="block";al.style.background=hb>0?"rgba(239,68,68,0.2)":"rgba(245,158,11,0.2)";al.style.borderColor=hb>0?"#ef4444":"#f59e0b";al.innerHTML=(hb>0?'🚨 <b>'+hb+' HABIS!</b>':"")+(mn>0?'⚠️ <b>'+mn+' MENIPIS.</b>':"");}else{al.style.display="none";}var f=all;if(window.state.filterCategory!=="all")f=f.filter(function(i){return i.kategori===window.state.filterCategory;});if(window.state.search){var q=window.state.search.toLowerCase();f=f.filter(function(i){return(i.nama||"").toLowerCase().includes(q)||(i.lokasi||"").toLowerCase().includes(q);});}var c=document.getElementById("stok-list");if(f.length===0){c.innerHTML='<p style="color:#94a3b8;text-align:center;padding:2rem;">📭 Kosong.</p>';return;}var h="";f.forEach(function(it){var ih=it.jumlah===0;var il=it.jumlah<=it.minimal&&!ih;var bc=ih?"#ef4444":(il?"#f59e0b":"#10b981");var bg=ih?"rgba(239,68,68,0.1)":(il?"rgba(245,158,11,0.1)":"transparent");var sid=it.id.replace(/'/g,"\\'");h+='<div style="background:rgba(15,23,42,0.6);border:1px solid rgba(255,255,255,0.1);border-radius:0.75rem;padding:0.6rem;border-left:4px solid '+bc+';"><div style="display:flex;justify-content:space-between;align-items:center;"><div style="flex:1;"><b>'+it.nama+'</b><br><small>'+fmt(it.harga)+'/'+it.satuan+' | Min:'+it.minimal+' | '+it.jumlah+' '+it.satuan+'</small></div><div style="display:flex;gap:0.2rem;"><button class="stk-btn" data-act="dec" data-id="'+sid+'" style="background:#ef4444;color:white;border:none;border-radius:0.3rem;padding:0.2rem 0.5rem;cursor:pointer;">-1</button><button class="stk-btn" data-act="inc" data-id="'+sid+'" style="background:#10b981;color:white;border:none;border-radius:0.3rem;padding:0.2rem 0.5rem;cursor:pointer;">+1</button><button class="stk-btn" data-act="restock" data-id="'+sid+'" style="background:#0ea5e9;color:white;border:none;border-radius:0.3rem;padding:0.2rem 0.5rem;cursor:pointer;">📦</button><button class="stk-btn" data-act="del" data-id="'+sid+'" style="background:#dc2626;color:white;border:none;border-radius:0.3rem;padding:0.2rem 0.5rem;cursor:pointer;">🗑</button></div></div></div>';});c.innerHTML=h;};
  window.saveItem=function(){var n=document.getElementById("f-nama").value.trim();var j=parseInt(document.getElementById("f-jumlah").value)||0;if(!n||j<0)return alert("Nama & jumlah wajib!");var it=g("dreamos_stok");var nw={id:"stok_"+Date.now(),nama:n,kategori:document.getElementById("f-kategori").value,jumlah:j,satuan:document.getElementById("f-satuan").value.trim()||"pcs",minimal:parseInt(document.getElementById("f-minimal").value)||5,lokasi:document.getElementById("f-lokasi").value.trim(),harga:parseInt(document.getElementById("f-harga").value)||0,created:new Date().toISOString()};it.push(nw);s("dreamos_stok",it);logMovement(nw.id,n,j,"Stok Masuk","Admin");["f-nama","f-jumlah","f-satuan","f-minimal","f-lokasi","f-harga"].forEach(function(x){document.getElementById(x).value="";});window.state.showForm=false;document.getElementById("stok-form").style.display="none";loadItems();};
  window.updateJumlah=function(id,delta){var it=g("dreamos_stok");var i=it.find(function(x){return x.id===id;});if(i){i.jumlah=Math.max(0,(i.jumlah||0)+delta);s("dreamos_stok",it);logMovement(id,i.nama,delta,"Adjust","Petugas");loadItems();}};
  window.quickRestock=function(id){var it=g("dreamos_stok");var i=it.find(function(x){return x.id===id;});if(i){var q=prompt("Restock "+i.nama+":","10");if(q&&!isNaN(q)&&parseInt(q)>0){i.jumlah+=parseInt(q);s("dreamos_stok",it);logMovement(id,i.nama,parseInt(q),"Restock Cepat","Admin");loadItems();}}};
  window.deleteItem=function(id){if(!confirm("Hapus permanen?"))return;var user=JSON.parse(localStorage.getItem('dreamos_bound_user')||'{}');if(!['dev','kabag','koord'].includes(user.role)){alert('⛔ Hanya admin yang bisa menghapus.');return;}var it=g("dreamos_stok").filter(function(x){return x.id!==id;});s("dreamos_stok",it);loadItems();};
  function renderProcurement(){var all=g("dreamos_stok");var nd=all.filter(function(i){return i.jumlah<=i.minimal;}).map(function(i){var rc=Math.max(0,(i.minimal*3)-i.jumlah);return{id:i.id,nama:i.nama,satuan:i.satuan,stok:i.jumlah,minimal:i.minimal,rekomendasi:rc,harga:i.harga||0,total:rc*(i.harga||0)};});var c=document.getElementById("procurement-list");if(!nd.length){c.innerHTML='<div style="color:#10b981;">✅ Semua stok aman.</div>';return;}c.innerHTML=nd.map(function(n){return '<div style="display:flex;justify-content:space-between;padding:0.4rem;background:rgba(0,0,0,0.3);border-radius:0.4rem;margin-bottom:0.3rem;"><div><b>'+n.nama+'</b><br>Stok:'+n.stok+' → Beli:'+n.rekomendasi+' '+n.satuan+'</div><div style="color:#eab308;font-weight:700;">'+fmt(n.total)+'</div></div>';}).join('');}
  window.ajukanKeDana=function(){var all=g("dreamos_stok");var nd=all.filter(function(i){return i.jumlah<=i.minimal;});if(!nd.length)return alert("✅ Tidak ada yang perlu diajukan.");var t=0;nd.forEach(function(i){var rc=Math.max(0,(i.minimal*3)-i.jumlah);t+=rc*(i.harga||0);});var dn=g("dreamos_dana");dn.push({id:"dana_"+Date.now(),judul:"Pengadaan Stok ("+nd.length+" item)",nominal:t,status:"pending",created:new Date().toISOString()});s("dreamos_dana",dn);alert("✅ Diajukan ke Dana!\nTotal: "+fmt(t));window.state.showProcurement=false;document.getElementById("procurement-panel").style.display="none";};
  function renderOpname(){var all=g("dreamos_stok");window.state.opnameData={};var c=document.getElementById("opname-list");if(!all.length){c.innerHTML='<p>Kosong.</p>';return;}c.innerHTML=all.map(function(i){window.state.opnameData[i.id]={sistem:i.jumlah,fisik:i.jumlah,nama:i.nama};return '<div style="display:flex;justify-content:space-between;padding:0.4rem;background:rgba(0,0,0,0.3);border-radius:0.4rem;margin-bottom:0.3rem;"><div><b>'+i.nama+'</b><br>Sistem:'+i.jumlah+'</div><input type="number" value="'+i.jumlah+'" onchange="window.state.opnameData[\''+i.id+'\'].fisik=parseInt(this.value)||0" style="width:60px;background:#0f172a;border:1px solid #334155;color:#e2e8f0;text-align:center;border-radius:0.3rem;"></div>';}).join('');}
  window.saveOpname=function(){var it=g("dreamos_stok");var adj=0;it.forEach(function(i){var op=window.state.opnameData[i.id];if(op&&op.fisik!==op.sistem){var d=op.fisik-op.sistem;i.jumlah=Math.max(0,op.fisik);logMovement(i.id,i.nama,d,"Opname","Auditor");adj++;}});s("dreamos_stok",it);alert("✅ "+adj+" item disesuaikan.");window.state.showOpname=false;document.getElementById("opname-panel").style.display="none";loadItems();};
  window.exportCSV=function(){var it=g("dreamos_stok");var c="Nama,Kategori,Jumlah,Satuan,Minimal,Lokasi,Harga\\n";it.forEach(function(i){c+='"'+i.nama+'","'+i.kategori+'",'+i.jumlah+','+i.satuan+','+i.minimal+',"'+i.lokasi+'",'+i.harga+'\\n';});var b=new Blob([c],{type:"text/csv"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="stok_"+new Date().toISOString().split("T")[0]+".csv";a.click();};
  window.showAuditLog=function(){var logs=g("dreamos_stok_audit");var h=logs.length?logs.slice(0,20).map(function(l){return dt(l.time)+' '+l.user+': '+l.reason+' ('+(l.delta>0?'+':'')+l.delta+')';}).join('\\n'):'Belum ada aktivitas.';alert('📜 AUDIT LOG:\\n\\n'+h);};
  window.syncStokToCloud=async function(){var data=g("dreamos_stok");if(!data.length)return alert('⚠️ Tidak ada data.');var count=0;for(var item of data){try{var{error}=await window.supabaseClient.from('stok').upsert({id:item.id,nama_barang:item.nama,kategori:item.kategori,jumlah:parseInt(item.jumlah)||0,satuan:item.satuan||'pcs',ambang_batas:parseInt(item.minimal)||5,lokasi:item.lokasi||'',harga:parseInt(item.harga)||0});if(!error)count++;}catch(e){}}alert('✅ '+count+'/'+data.length+' barang disync ke cloud!');};

  setTimeout(function(){
    try{loadItems();}catch(e){console.error(e);}
    var map={"btn-tambah":window.toggleForm,"btn-procurement":window.toggleProcurement,"btn-opname":window.toggleOpname,"btn-scan":window.toggleScanner,"btn-cetak":function(){alert('🖨️ Fitur cetak tersedia.');},"btn-csv":window.exportCSV,"btn-audit-log":window.showAuditLog,"btn-ajukan-dana":window.ajukanKeDana,"btn-save-opname":window.saveOpname,"btn-cetak-opname":function(){alert('🖨️ Fitur cetak opname tersedia.');},"btn-save-item":window.saveItem,"btn-manual-scan":window.handleManualScan,"btn-close-scan":window.stopScanner,"btn-sync-stok":window.syncStokToCloud};
    for(var id in map){var b=document.getElementById(id);if(b){b.onclick=map[id];console.log('✅',id);}else{console.warn('⚠️',id);}}
    document.getElementById("stok-search").oninput=function(){window.state.search=this.value;loadItems();};
    document.getElementById("stok-filter").onchange=function(){window.state.filterCategory=this.value;loadItems();};
    document.getElementById("stok-list").addEventListener("click",function(e){var btn=e.target.closest(".stk-btn");if(!btn)return;var act=btn.dataset.act,id=btn.dataset.id;if(act==="dec")window.updateJumlah(id,-1);else if(act==="inc")window.updateJumlah(id,1);else if(act==="restock")window.quickRestock(id);else if(act==="del")window.deleteItem(id);});
    console.log('✅ Stok Enterprise v2.0 Ready');
  },200);
})();
</script>
