  window.loadItems=function(){var all=g("dreamos_stok");var tj=all.length;var tn=all.reduce(function(s,i){return s+((i.harga||0)*(i.jumlah||0));},0);var mn=all.filter(function(i){return i.jumlah<=i.minimal&&i.jumlah>0;}).length;var hb=all.filter(function(i){return i.jumlah===0;}).length;document.getElementById("stok-stats").innerHTML='<div><div style="font-size:1.2rem;font-weight:700;color:#eab308;">'+tj+'</div><div style="font-size:0.55rem;color:#94a3b8;">Jenis</div></div><div><div style="font-size:1.2rem;font-weight:700;color:#10b981;">'+fmt(tn)+'</div><div style="font-size:0.55rem;color:#94a3b8;">Nilai</div></div><div><div style="font-size:1.2rem;font-weight:700;color:'+(mn>0?"#f59e0b":"#10b981")+';">'+mn+'</div><div style="font-size:0.55rem;color:#94a3b8;">Menipis</div></div><div><div style="font-size:1.2rem;font-weight:700;color:'+(hb>0?"#ef4444":"#10b981")+';">'+hb+'</div><div style="font-size:0.55rem;color:#94a3b8;">Habis</div></div>';var al=document.getElementById("stok-alert");if(mn>0||hb>0){al.style.display="block";al.style.background=hb>0?"rgba(239,68,68,0.2)":"rgba(245,158,11,0.2)";al.style.borderColor=hb>0?"#ef4444":"#f59e0b";al.innerHTML=(hb>0?'<div style="font-weight:700;color:#ef4444;margin-bottom:0.3rem;">🚨 '+hb+" HABIS!</div>":"")+(mn>0?'<div style="font-weight:700;color:#f59e0b;">⚠️ '+mn+" MENIPIS.</div>":"");}else{al.style.display="none";}var f=all;if(window.state.filterCategory!=="all")f=f.filter(function(i){return i.kategori===window.state.filterCategory;});if(window.state.search){var q=window.state.search.toLowerCase();f=f.filter(function(i){return(i.nama||"").toLowerCase().includes(q)||(i.lokasi||"").toLowerCase().includes(q);});}var c=document.getElementById("stok-list");if(f.length===0){c.innerHTML='<p style="color:#94a3b8;text-align:center;padding:2rem;">📭 Kosong.</p>';return;}var h="";f.forEach(function(it){var ih=it.jumlah===0;var il=it.jumlah<=it.minimal&&!ih;var bc=ih?"#ef4444":(il?"#f59e0b":"#10b981");var bg=ih?"rgba(239,68,68,0.1)":(il?"rgba(245,158,11,0.1)":"transparent");var st=ih?"🚨 HABIS":(il?"⚠️ MENIPIS":"✅ AMAN");var sc=ih?"#ef4444":(il?"#f59e0b":"#10b981");var sid=it.id.replace(/'/g,"\\'");var ie=window.state.expandedHistory===it.id;h+='<div style="background:rgba(15,23,42,0.6);border:1px solid rgba(255,255,255,0.1);border-radius:0.75rem;padding:0.6rem;border-left:4px solid '+bc+";background:"+bg+';"><div style="display:flex;justify-content:space-between;align-items:center;"><div style="flex:1;"><div style="font-weight:700;font-size:0.8rem;color:#e2e8f0;">'+it.nama+'</div><div style="font-size:0.6rem;color:#94a3b8;">'+(it.kategori||"").replace(/_/g," ")+" | Rak:"+(it.lokasi||"-")+" | "+fmt(it.harga)+"/"+it.satuan+'</div><div style="font-size:0.65rem;color:'+sc+';font-weight:600;margin-top:0.2rem;">'+st+'</div></div><div style="text-align:right;"><div style="font-weight:700;font-size:0.9rem;color:'+(ih?"#ef4444":il?"#f59e0b":"#eab308")+';">'+it.jumlah+" "+it.satuan+'</div><div style="font-size:0.55rem;color:#94a3b8;">Min:'+it.minimal+'</div><div style="display:flex;gap:0.2rem;margin-top:0.3rem;justify-content:flex-end;"><button class="stk-btn" data-act="dec" data-id="'+sid+'" style="background:#ef4444;color:white;border:none;border-radius:0.3rem;padding:0.1rem 0.4rem;font-size:0.6rem;cursor:pointer;">-1</button><button class="stk-btn" data-act="inc" data-id="'+sid+'" style="background:#10b981;color:white;border:none;border-radius:0.3rem;padding:0.1rem 0.4rem;font-size:0.6rem;cursor:pointer;">+1</button><button class="stk-btn" data-act="log" data-id="'+sid+'" style="background:#8b5cf6;color:white;border:none;border-radius:0.3rem;padding:0.1rem 0.4rem;font-size:0.6rem;cursor:pointer;">📜</button><button class="stk-btn" data-act="del" data-id="'+sid+'" style="background:#dc2626;color:white;border:none;border-radius:0.3rem;padding:0.1rem 0.4rem;font-size:0.6rem;cursor:pointer;">🗑</button></div></div></div>';if(ie){var lg=g("dreamos_stok_audit").filter(function(l){return l.itemId===it.id;}).sort(function(a,b){return new Date(b.time)-new Date(a.time);}).slice(0,5);h+='<div style="margin-top:0.4rem;padding-top:0.4rem;border-top:1px solid rgba(255,255,255,0.1);font-size:0.65rem;color:#94a3b8;">';if(!lg.length)h+="<div>Belum ada riwayat.</div>";else lg.forEach(function(l){h+='<div style="margin-bottom:0.2rem;">'+dt(l.time)+" | "+l.user+" | "+l.delta+" | "+l.reason+"</div>";});h+="</div>";}h+="</div>";});c.innerHTML=h;};
  window.saveItem=function(){var n=document.getElementById("f-nama").value.trim();var j=parseInt(document.getElementById("f-jumlah").value)||0;if(!n||j<0)return alert("Nama & jumlah wajib!");var it=g("dreamos_stok");var nw={id:"stok_"+Date.now(),nama:n,kategori:document.getElementById("f-kategori").value,jumlah:j,satuan:document.getElementById("f-satuan").value.trim()||"pcs",minimal:parseInt(document.getElementById("f-minimal").value)||5,lokasi:document.getElementById("f-lokasi").value.trim(),harga:parseInt(document.getElementById("f-harga").value)||0,created:new Date().toISOString()};it.push(nw);s("dreamos_stok",it);logMovement(nw.id,n,j,"Stok Masuk","Admin");["f-nama","f-jumlah","f-satuan","f-minimal","f-lokasi","f-harga"].forEach(function(x){document.getElementById(x).value="";});window.state.showForm=false;document.getElementById("stok-form").style.display="none";loadItems();if(typeof window.dispatchEvent==="function")window.dispatchEvent(new CustomEvent("stok-updated"));};

  window.saveOpname=function(){var it=g("dreamos_stok");var adj=0;it.forEach(function(i){var op=window.state.opnameData[i.id];if(op&&op.fisik!==op.sistem){var d=op.fisik-op.sistem;i.jumlah=Math.max(0,op.fisik);logMovement(i.id,i.nama,d,"Opname "+new Date().toISOString().split("T")[0],"Auditor");adj++;}});s("dreamos_stok",it);alert("✅ "+adj+" disesuaikan.");window.state.showOpname=false;document.getElementById("opname-panel").style.display="none";loadItems();};
  window.cetakOpname=function(){var all=g("dreamos_stok");var w=window.open("","_blank","width=900,height=600");var d='<html><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; connect-src 'self' https:;"><title>Opname</title><style>body{font-family:sans-serif;padding:20px;color:#111;}h2{text-align:center;}table{width:100%;border-collapse:collapse;margin:10px 0;}th,td{border:1px solid #000;padding:6px;text-align:left;font-size:12px;}th{background:#eee;}.diff{background:#fff3cd;}@media print{button{display:none;}}</style></head><body><h2>BERITA ACARA OPNAME</h2><p>Tanggal: '+new Date().toLocaleDateString("id-ID")+'</p><button onclick="window.print()" style="padding:8px 16px;background:#f59e0b;color:#000;border:none;border-radius:4px;cursor:pointer;margin-bottom:15px;">🖨️ Cetak</button><table><tr><th>No</th><th>Barang</th><th>Sistem</th><th>Fisik</th><th>Selisih</th><th>Status</th></tr>';all.forEach(function(i,x){var op=window.state.opnameData[i.id]||{sistem:i.jumlah,fisik:i.jumlah};var s=op.fisik-op.sistem;var c=s!==0?"diff":"";var st=s===0?"✅ Match":(s>0?"📈 Lebih":"📉 Kurang");d+='<tr class="'+c+'"><td>'+(x+1)+"</td><td>"+i.nama+"</td><td>"+op.sistem+"</td><td>"+op.fisik+"</td><td>"+s+"</td><td>"+st+"</td></tr>";});d+='</table><p style="margin-top:30px;text-align:right;">Mengetahui,<br><br><br>Kepala Gudang</p></body></html>';w.document.write(d);w.document.close();};
  window.initScanner=function(){if(window.state.scannerActive)return;if(html5QrCode){try{html5QrCode.clear();}catch(e){}html5QrCode=null;}var q=document.getElementById("qr-reader");if(q)q.innerHTML="";if(typeof Html5Qrcode==="undefined"){var sc=document.createElement("script");sc.src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js";sc.onload=function(){startQrEngine();};sc.onerror=function(){alert("Gagal load QR. Pakai manual.");};document.head.appendChild(sc);}else{startQrEngine();}};
  function startQrEngine(){try{html5QrCode=new Html5Qrcode("qr-reader");html5QrCode.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:250}},handleScanSuccess,function(){}).then(function(){window.state.scannerActive=true;}).catch(function(e){console.warn("Cam err:",e);document.getElementById("qr-reader").innerHTML='<div style="color:#ef4444;padding:1rem;">📷 Kamera ditolak. Pakai manual.</div>';});}catch(e){console.error("QR fail:",e);}}
  window.handleScanSuccess=function(dec){window.stopScanner();var it=g("dreamos_stok");var m=it.find(function(i){return i.id===dec||(i.sku&&i.sku===dec);});if(m){var d=prompt("Found: "+m.nama+"\nStok: "+m.jumlah+"\n\nDelta (+/-):");if(d&&!isNaN(d)){var v=parseInt(d);var it2=g("dreamos_stok");var x=it2.find(function(y){return y.id===m.id;});if(x){x.jumlah=Math.max(0,x.jumlah+v);s("dreamos_stok",it2);logMovement(x.id,x.nama,v,"Scan Adjust","Petugas");loadItems();}}}else{alert("❌ Tidak ditemukan.");}};
  window.handleManualScan=function(){var c=document.getElementById("manual-sku").value.trim();if(!c)return alert("Isi ID!");window.handleScanSuccess(c);};
  window.exportCSV=function(){var it=g("dreamos_stok");var c="Nama,Kategori,Jumlah,Satuan,Minimal,Lokasi,Harga\n";it.forEach(function(i){c+='"'+(i.nama||"")+'","'+(i.kategori||"")+'",'+i.jumlah+","+(i.satuan||"pcs")+","+i.minimal+',"'+(i.lokasi||"")+'",'+(i.harga||0)+"\n";});var b=new Blob([c],{type:"text/csv"});var u=URL.createObjectURL(b);var a=document.createElement("a");a.href=u;a.download="stok_"+new Date().toISOString().split("T")[0]+".csv";a.click();URL.revokeObjectURL(u);};
  window.cetakLaporan=function(){var it=g("dreamos_stok");var w=window.open("","_blank","width=900,height=600");var d='<html><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; connect-src 'self' https:;"><title>Laporan Stok</title><style>body{font-family:sans-serif;padding:20px;color:#111;}h2{text-align:center;}table{width:100%;border-collapse:collapse;margin:10px 0;}th,td{border:1px solid #000;padding:6px;text-align:left;font-size:12px;}th{background:#eee;}.low{background:#fff3cd;}.out{background:#f8d7da;}@media print{button{display:none;}}</style></head><body><h2>LAPORAN STOK</h2><p>Tanggal: '+new Date().toLocaleDateString("id-ID")+" | Total: "+it.length+'</p><button onclick="window.print()" style="padding:8px 16px;background:#eab308;color:#000;border:none;border-radius:4px;cursor:pointer;margin-bottom:15px;">🖨️ Cetak</button><table><tr><th>No</th><th>Nama</th><th>Kategori</th><th>Stok</th><th>Min</th><th>Status</th><th>Harga</th></tr>';it.forEach(function(i,x){var s=i.jumlah===0?"HABIS":(i.jumlah<=i.minimal?"MENIPIS":"AMAN");var c=i.jumlah===0?"out":(i.jumlah<=i.minimal?"low":"");d+='<tr class="'+c+'"><td>'+(x+1)+"</td><td>"+i.nama+"</td><td>"+(i.kategori||"-")+"</td><td>"+i.jumlah+" "+(i.satuan||"pcs")+"</td><td>"+i.minimal+"</td><td>"+s+"</td><td>"+fmt(i.harga)+"</td></tr>";});d+='</table><p style="margin-top:30px;text-align:right;">Mengetahui,<br><br><br>Kabag Umum</p></body></html>';w.document.write(d);w.document.close();};
  var lMC=0,lJC=0;function syncTaskDeductions(){var mt=g("dreamos_maintenance_tasks");var jt=g("dreamos_janitor_tasks");var ai=g("dreamos_stok");var now=Date.now();mt.forEach(function(t){if(t.status==="selesai"&&t.completedAt&&new Date(t.completedAt).getTime()>lMC){var m=ai.filter(function(i){var k=(t.kategori||"").toLowerCase();return(k.includes("listrik")&&i.nama.toLowerCase().includes("kabel"))||(k.includes("ac")&&i.nama.toLowerCase().includes("freon"))||(k.includes("plumbing")&&i.nama.toLowerCase().includes("pipa"))||(k.includes("bangunan")&&i.nama.toLowerCase().includes("semen"));});m.forEach(function(x){if(x.jumlah>0){x.jumlah=Math.max(0,x.jumlah-1);logMovement(x.id,x.nama,-1,"Auto-deduct Maint #"+t.id,"Sistem");}});}});lMC=now;jt.forEach(function(t){if(t.status==="selesai"&&t.completedAt&&new Date(t.completedAt).getTime()>lJC){var m=ai.filter(function(i){return i.nama.toLowerCase().includes("sabun")||i.nama.toLowerCase().includes("wipol")||i.nama.toLowerCase().includes("karbol");});m.forEach(function(x){if(x.jumlah>0){x.jumlah=Math.max(0,x.jumlah-1);logMovement(x.id,x.nama,-1,"Auto-deduct Jan #"+t.id,"Sistem");}});}});lJC=now;s("dreamos_stok",ai);if(typeof window.loadItems==="function")loadItems();}
  window.addEventListener("maintenance-updated",syncTaskDeductions);window.addEventListener("janitor-updated",syncTaskDeductions);setInterval(syncTaskDeductions,30000);
  setTimeout(function(){try{loadItems();}catch(e){console.error("❌ Stok Init:",e);}var map={"btn-tambah":window.toggleForm,"btn-procurement":window.toggleProcurement,"btn-opname":window.toggleOpname,"btn-scan":window.toggleScanner,"btn-cetak":window.cetakLaporan,"btn-csv":window.exportCSV,"btn-ajukan-dana":window.ajukanKeDana,"btn-save-opname":window.saveOpname,"btn-cetak-opname":window.cetakOpname,"btn-save-item":window.saveItem,"btn-manual-scan":window.handleManualScan,"btn-close-scan":window.stopScanner};for(var id in map){var b=document.getElementById(id);if(b){b.onclick=map[id];console.log("✅ Bound:",id);}else{console.warn("⚠️ Missing:",id);}}document.getElementById("stok-search").oninput=function(){window.state.search=this.value;loadItems();};document.getElementById("stok-filter").onchange=function(){window.state.filterCategory=this.value;loadItems();};document.getElementById("stok-list").addEventListener("click",function(e){var btn=e.target.closest(".stk-btn");if(!btn)return;var act=btn.dataset.act,id=btn.dataset.id;if(act==="dec")window.updateJumlah(id,-1);else if(act==="inc")window.updateJumlah(id,1);else if(act==="log")window.toggleHistory(id);else if(act==="del")window.deleteItem(id);});console.log("✅ Stok module fully bound & ready");},150);
})();
</script>
