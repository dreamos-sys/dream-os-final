<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Command Center Pro • Enterprise v5.1</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root { --glass-bg: rgba(15, 23, 42, 0.6); --glass-border: rgba(0, 255, 157, 0.12); --neon: #00ff9d; --accent: #0ea5e9; --warning: #e11d48; --gold: #f59e0b; --purple: #8b5cf6; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #0a0e27; color: #e2e8f0; min-height: 100vh; }
  .glass { background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 1rem; margin-bottom: 0.8rem; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
  .back-btn { position: fixed; top: 0.8rem; left: 0.8rem; z-index: 1000; background: rgba(30,41,59,0.9); border: 1px solid var(--neon); color: var(--neon); padding: 0.4rem 0.8rem; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.7rem; }
  .btn { padding: 0.5rem 0.9rem; border: none; border-radius: 8px; font-weight: 700; font-size: 0.7rem; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.3rem; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-success { background: #10b981; color: #fff; }
  .btn-danger { background: var(--warning); color: #fff; }
  .btn-warning { background: var(--gold); color: #000; }
  .btn-purple { background: var(--purple); color: #fff; }
  .btn:hover { transform: translateY(-1px); opacity: 0.95; }
  .input-field, textarea, select { width: 100%; padding: 0.6rem; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #e2e8f0; font-size: 0.8rem; outline: none; font-family: 'Inter',sans-serif; }
  .input-field:focus { border-color: var(--neon); }
  table { width:100%; border-collapse:collapse; font-size:0.7rem; }
  th { background: rgba(0,0,0,0.3); color: #94a3b8; padding: 0.4rem; text-align: left; font-size:0.6rem; text-transform:uppercase; }
  td { padding: 0.35rem 0.4rem; border-bottom: 1px solid rgba(255,255,255,0.03); }
  .badge { padding: 0.12rem 0.4rem; border-radius: 10px; font-size: 0.55rem; font-weight: 600; }
  .badge-pending { background: rgba(245,158,11,0.2); color: #f59e0b; }
  .badge-approved { background: rgba(16,185,129,0.2); color: #10b981; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
  .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 0.6rem; }
  @media (max-width: 600px) { .grid-2, .grid-4 { grid-template-columns: 1fr; } }
  .kpi-card { text-align: center; padding: 0.6rem; border-radius: 10px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
  .kpi-value { font-size: 1.2rem; font-weight: 700; }
  .kpi-label { font-size: 0.55rem; color: #94a3b8; text-transform: uppercase; }
  .section-title { font-size: 0.8rem; font-weight: 700; margin: 0 0 0.6rem; display: flex; align-items: center; gap: 0.3rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.4rem; }
  .tabs { display: flex; gap: 0.2rem; margin-bottom: 0.8rem; flex-wrap: wrap; }
  .tab { padding: 0.35rem 0.8rem; border-radius: 8px; font-size: 0.65rem; font-weight: 600; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: #94a3b8; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .progress-bar { height: 8px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; margin-top: 0.4rem; }
  .progress-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; background: var(--accent); }
  .action-row { display: flex; gap: 0.4rem; margin-bottom: 0.6rem; flex-wrap: wrap; }
  .search-box { display: flex; gap: 0.4rem; margin-bottom: 0.6rem; }
  .quick-actions { display: flex; gap: 0.3rem; flex-wrap: wrap; margin-bottom: 0.8rem; }
  .chart-container { min-height: 200px; position: relative; }
  .loading-text { text-align: center; padding: 2rem; color: #94a3b8; }
</style>
</head>
<body>

<button class="back-btn" onclick="window.parent.goHome()">← HOME</button>

<div style="max-width:1400px; margin:0 auto; padding:3.5rem 0.8rem 5rem;">

  <!-- HEADER -->
  <div class="glass" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.8rem;">
    <div>
      <h2 style="color:var(--neon); margin:0; font-size:1.1rem;">🏢 COMMAND CENTER PRO <span style="font-size:0.6rem; color:#64748b;">v5.1</span></h2>
      <p style="color:#94a3b8; font-size:0.62rem; margin:0;" id="role-subtitle">Loading...</p>
    </div>
    <div style="display:flex; align-items:center; gap:0.8rem;">
      <div style="text-align:right;">
        <div style="font-weight:700; font-size:0.8rem;" id="user-display">🔒</div>
        <div style="font-size:0.55rem; color:#64748b;" id="live-clock">--:--:--</div>
      </div>
      <button class="btn btn-danger" onclick="doLogout()" style="font-size:0.6rem; padding:0.25rem 0.6rem;">🚪</button>
      <button class="btn btn-warning" onclick="clearLocalCache()" style="font-size:0.55rem;">🧹 Cache</button>
    </div>
  </div>

  <!-- QUICK ACTIONS -->
  <div class="quick-actions">
    <button class="btn btn-primary" onclick="quickAddDana()">💸 Dana</button>
    <button class="btn btn-warning" onclick="quickAddK3()">⚠️ K3</button>
    <button class="btn btn-purple" onclick="quickAddMaint()">🔧 Maint</button>
    <button class="btn btn-pink" onclick="openSlideManager()">📢 Slide</button>
    <button class="btn btn-success" onclick="openExecutiveNote()">📝 Catatan</button>
  </div>

  <!-- KPI DASHBOARD -->
  <div class="glass">
    <div class="section-title" style="color:var(--accent);">📊 REAL-TIME DASHBOARD</div>
    <div class="grid-4" id="kpi-cards"></div>
    <div class="grid-2" style="margin-top:0.8rem;">
      <div class="chart-container"><canvas id="mainChart"></canvas></div>
      <div class="chart-container"><canvas id="trendChart"></canvas></div>
    </div>
  </div>

  <!-- EXECUTIVE NOTE -->
  <div id="executive-note-panel" class="glass" style="display:none; border-color: rgba(245,158,11,0.3);">
    <div class="section-title" style="color:var(--gold);">📝 CATATAN PIMPINAN</div>
    <textarea id="executive-note-input" rows="2" placeholder="Tulis instruksi..."></textarea>
    <button class="btn btn-warning" onclick="saveExecutiveNote()" style="margin-top:0.4rem;">💾 Simpan</button>
  </div>

  <!-- SLIDE MANAGER -->
  <div id="slide-manager-panel" class="glass" style="display:none;">
    <div class="section-title" style="color:var(--pink);">📢 SLIDE DASHBOARD</div>
    <div class="grid-2">
      <div><label style="font-size:0.6rem;">Slide 5</label><input class="input-field" id="slide5-input"></div>
      <div><label style="font-size:0.6rem;">Slide 6</label><input class="input-field" id="slide6-input"></div>
      <div><label style="font-size:0.6rem;">Slide 7</label><input class="input-field" id="slide7-input"></div>
      <div><label style="font-size:0.6rem;">Security</label><input class="input-field" id="slide-sec-input"></div>
    </div>
    <button class="btn btn-pink" onclick="saveSlides()" style="margin-top:0.5rem;">💾 Simpan</button>
  </div>

  <!-- TABS -->
  <div class="tabs" id="workspace-tabs">
    <button class="tab active" data-tab="users">👥 Users</button>
    <button class="tab" data-tab="dana">💰 Dana</button>
    <button class="tab" data-tab="k3">⚠️ K3</button>
    <button class="tab" data-tab="maint">🔧 Maint</button>
    <button class="tab" data-tab="booking">📅 Booking</button>
    <button class="tab" data-tab="audit">📜 Audit</button>
    <button class="tab" data-tab="system">⚙️ System</button>
  </div>

  <!-- ========== TAB USERS ========== -->
  <div id="tab-users" class="tab-content">
    <div class="glass">
      <div class="section-title" style="color:var(--purple);">👥 MANAJEMEN USER</div>
      
      <div class="glass" style="border:1px solid rgba(0,255,157,0.3); margin-bottom:1rem;">
        <h4 style="color:#00ff9d; margin:0 0 0.8rem;">➕ TAMBAH USER BARU</h4>
        <div style="display:grid; gap:0.5rem;">
          <input type="text" id="new-nama" class="input-field" placeholder="Nama Lengkap">
          <input type="email" id="new-email" class="input-field" placeholder="Email">
          <select id="new-role" class="input-field">
            <option value="guru">Guru</option>
            <option value="security">Security</option>
            <option value="janitor">Janitor</option>
            <option value="maintenance">Maintenance</option>
            <option value="staff">Staff</option>
          </select>
          <input type="password" id="new-password" class="input-field" placeholder="Password (min 6 karakter)">
          <button class="btn btn-primary" onclick="addUserWithForm()" style="width:100%;">✅ SIMPAN USER</button>
          <div id="form-msg" style="font-size:0.7rem; margin-top:0.3rem;"></div>
        </div>
      </div>

      <div class="action-row">
        <button class="btn btn-warning" onclick="printUserList()">🖨️ Cetak</button>
        <button class="btn btn-success" onclick="syncUsersToSupabase()">☁️ Sync ke Cloud</button>
      </div>
      <div id="user-table" class="loading-text">Memuat...</div>
    </div>
  </div>

  <!-- Tab lainnya... (dana, k3, maint, booking, audit, system) sama seperti sebelumnya -->
</div>

<script>
// ========== SELF-CONTAINED HELPER ==========
(function(global) {
  var SANDBOX = {
    sanitize: function(s) {
      return String(s || '').replace(/[&<>"']/g, function(m) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
      });
    },
    getCurrentUser: function() {
      try { return JSON.parse(localStorage.getItem('dreamos_bound_user') || 'null'); } catch(e) { return null; }
    },
    getCurrentRole: function() {
      var u = this.getCurrentUser();
      return u ? u.role : 'staff';
    },
    auditLog: function(a, d) {
      var logs = JSON.parse(localStorage.getItem('dreamos_audit_logs') || '[]');
      logs.unshift({ time: new Date().toISOString(), user: 'System', role: 'admin', action: a, details: d || '' });
      if (logs.length > 50) logs.pop();
      localStorage.setItem('dreamos_audit_logs', JSON.stringify(logs));
    },
    hashPassword: async function(p) {
      var e = new TextEncoder();
      var h = await crypto.subtle.digest('SHA-256', e.encode(p + 'dreamos_salt_2026'));
      return Array.from(new Uint8Array(h)).map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
    }
  };
  global.SEC = SANDBOX;
})(window);

(function() {
  'use strict';
  var SEC = window.SEC;

  var currentUser = SEC.getCurrentUser();
  var role = SEC.getCurrentRole();
  document.getElementById('user-display').textContent = currentUser ? (currentUser.nama || 'User') : 'Admin';
  document.getElementById('role-subtitle').textContent = 'Role: ' + role.toUpperCase() + ' • v5.1';

  setInterval(function() { document.getElementById('live-clock').textContent = new Date().toLocaleTimeString('id-ID'); }, 1000);

  function safeGet(key, fb) { try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fb)); } catch(e) { return fb; } }

  // Tab switching
  document.getElementById('workspace-tabs').addEventListener('click', function(e) {
    var tab = e.target.closest('.tab');
    if (!tab) return;
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    document.querySelectorAll('.tab-content').forEach(function(c) { c.style.display = 'none'; });
    tab.classList.add('active');
    var target = document.getElementById('tab-' + tab.dataset.tab);
    if (target) { target.style.display = 'block'; refreshTab(tab.dataset.tab); }
  });

  function refreshTab(name) {
    if (name === 'users') renderUserTable();
    if (name === 'dana') { renderDanaPending(); renderBudgetSummary(); renderDanaHistory(); }
    if (name === 'k3') { renderK3Active(); renderK3Chart(); }
    if (name === 'maint') { renderMaintenanceActive(); renderMaintenanceDone(); }
    if (name === 'booking') renderBookingList();
    if (name === 'audit') renderAuditFull();
    if (name === 'system') renderSystemInfo();
  }

  function renderAll() {
    renderKPIs(); renderCharts();
    renderUserTable();
    renderDanaPending(); renderBudgetSummary(); renderDanaHistory();
    renderK3Active(); renderBookingList();
    renderAuditFull(); renderSystemInfo();
  }

  function renderKPIs() {
    var users = safeGet('dreamos_users_db',[]);
    var dana = safeGet('dreamos_dana',[]);
    var k3 = safeGet('dreamos_k3_reports',[]);
    var maint = safeGet('dreamos_maintenance_tasks',[]);
    var kpis = [
      { label:'Users', value: users.length, color:'#8b5cf6', tab:'users' },
      { label:'Dana Pending', value: dana.filter(function(d){return d.status==='pending';}).length, color:'#f59e0b', tab:'dana' },
      { label:'K3 Urgent', value: k3.filter(function(k){return k.status==='pending';}).length, color:'#ef4444', tab:'k3' },
      { label:'Maint Aktif', value: maint.filter(function(m){return m.status!=='Selesai'}).length, color:'#0ea5e9', tab:'maint' }
    ];
    document.getElementById('kpi-cards').innerHTML = kpis.map(function(k) {
      return '<div class="kpi-card" onclick="switchTab(\''+k.tab+'\')"><div class="kpi-value" style="color:'+k.color+'">'+k.value+'</div><div class="kpi-label">'+k.label+'</div></div>';
    }).join('');
  }

  // Fungsi render lainnya (sama seperti sebelumnya, gunakan SEC.sanitize)

  // ========== USER MANAGEMENT ==========
  window.addUserWithForm = async function() {
    var nama = document.getElementById('new-nama').value.trim();
    var email = document.getElementById('new-email').value.trim();
    var role = document.getElementById('new-role').value;
    var password = document.getElementById('new-password').value;
    var msg = document.getElementById('form-msg');

    if (!nama || !email || !password) {
      msg.textContent = '⚠️ Semua field wajib diisi!';
      msg.style.color = '#ef4444';
      return;
    }
    if (password.length < 6) {
      msg.textContent = '⚠️ Password minimal 6 karakter!';
      msg.style.color = '#ef4444';
      return;
    }

    var users = safeGet('dreamos_users_db', []);
    if (users.find(function(u) { return u.email === email; })) {
      msg.textContent = '⚠️ Email sudah terdaftar!';
      msg.style.color = '#ef4444';
      return;
    }

    try {
      var hashed = await SEC.hashPassword(password);
      var newUser = { nama: nama, email: email, role: role, password_hash: hashed, device_dna: '', created_at: new Date().toISOString() };
      
      users.push(newUser);
      try {
        localStorage.setItem('dreamos_users_db', JSON.stringify(users));
        msg.textContent = '✅ ' + nama + ' berhasil ditambahkan!';
        msg.style.color = '#10b981';
      } catch(e) {
        users.pop();
        msg.textContent = '⚠️ Penyimpanan penuh! Klik 🧹 Cache lalu coba lagi.';
        msg.style.color = '#f59e0b';
      }
      
      document.getElementById('new-nama').value = '';
      document.getElementById('new-email').value = '';
      document.getElementById('new-password').value = '';
      renderUserTable();
      SEC.auditLog('ADD_USER', nama + ' (' + email + ')');
    } catch(e) {
      msg.textContent = '❌ Error: ' + e.message;
      msg.style.color = '#ef4444';
    }
  };

  window.clearLocalCache = function() {
    if (confirm('Bersihkan cache? Data user & sesi akan tetap aman.')) {
      var keysToKeep = ['dreamos_users_db', 'dreamos_bound_user', 'dreamos_session_active'];
      for (var i = localStorage.length - 1; i >= 0; i--) {
        var key = localStorage.key(i);
        if (!keysToKeep.includes(key) && key.startsWith('dreamos_')) {
          localStorage.removeItem(key);
        }
      }
      alert('✅ Cache dibersihkan! Silakan coba tambah user lagi.');
      renderAll();
    }
  };

  // ... (semua fungsi lainnya seperti renderDanaPending, renderCharts, dll.)

  // Init
  renderAll();
})();
</script>
</body>
</html>
