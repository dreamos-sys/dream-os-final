<style>
  :root { --glass-bg: rgba(15, 23, 42, 0.7); --glass-border: rgba(0, 255, 157, 0.15); --neon: #00ff9d; --accent: #0ea5e9; --warning: #e11d48; --gold: #f59e0b; --purple: #8b5cf6; --pink: #ec4899; }
  * { box-sizing: border-box; }
  body { background: #0a0e27; color: #e2e8f0; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
  .glass { background: var(--glass-bg); backdrop-filter: blur(15px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 1rem; margin-bottom: 0.8rem; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
  .back-btn { position: fixed; top: 0.8rem; left: 0.8rem; z-index: 1000; background: rgba(30,41,59,0.9); border: 1px solid var(--neon); color: var(--neon); padding: 0.4rem 0.8rem; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.7rem; }
  .btn { padding: 0.5rem 0.8rem; border-radius: 8px; font-weight: 600; font-size: 0.7rem; cursor: pointer; border: none; transition: 0.2s; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-success { background: #10b981; color: white; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
  .tab-container { display: flex; gap: 0.3rem; margin-bottom: 1rem; overflow-x: auto; padding-bottom: 0.3rem; }
  .tab { padding: 0.5rem 1rem; background: rgba(30,41,59,0.5); color: #94a3b8; border-radius: 8px; font-size: 0.75rem; cursor: pointer; border: 1px solid transparent; }
  .tab.active { background: var(--accent); color: white; border-color: var(--accent); }
  .section-title { font-size: 0.8rem; font-weight: 700; color: #94a3b8; margin-bottom: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.3rem; }
  table { width: 100%; font-size: 0.7rem; border-collapse: collapse; }
  td, th { padding: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .loading { color: var(--neon); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.5; } }
</style>

<button class="back-btn" onclick="window.goHome()">← HOME</button>

<div style="padding: 3.5rem 1rem 2rem; max-width: 1200px; margin: auto;">
  <div class="glass" style="display:flex; justify-content:space-between; align-items:center;">
    <div><h2 style="color:var(--neon); margin:0; font-size:1rem;">COMMAND CENTER PRO</h2></div>
    <div id="user-display" style="font-size:0.8rem;">--</div>
  </div>

  <div class="grid-4" id="kpi-cards" style="margin-bottom: 1rem;"></div>

  <div class="tab-container" id="workspace-tabs">
    <button class="tab active" data-tab="dana">💰 Dana</button>
    <button class="tab" data-tab="k3">⚠️ K3</button>
    <button class="tab" data-tab="maint">🔧 Maint</button>
    <button class="tab" data-tab="booking">📅 Booking</button>
    <button class="tab" data-tab="users">👥 Users</button>
  </div>

  <div id="tab-content-area"></div>
</div>

<script>
(function() {
  const user = JSON.parse(localStorage.getItem('dreamos_bound_user') || '{}');
  document.getElementById('user-display').textContent = user.nama || 'User';

  async function loadData(t) {
    if(window.supabaseClient) {
      const { data } = await window.supabaseClient.from(t).select('*').order('created_at', {ascending:false});
      if(data) { localStorage.setItem('c_'+t, JSON.stringify(data)); return data; }
    }
    return JSON.parse(localStorage.getItem('c_'+t) || '[]');
  }

  async function render() {
    const d = await loadData('dana_requests'), k = await loadData('k3_reports'), m = await loadData('maintenance_tasks'), b = await loadData('bookings'), u = await loadData('users');
    
    // Render KPI
    document.getElementById('kpi-cards').innerHTML = 
      `<div class="glass kpi-card"><div>${k.length}</div><div class="kpi-label">K3</div></div>` +
      `<div class="glass kpi-card"><div>${m.length}</div><div class="kpi-label">Maint</div></div>` +
      `<div class="glass kpi-card"><div>${d.length}</div><div class="kpi-label">Dana</div></div>` +
      `<div class="glass kpi-card"><div>${b.length}</div><div class="kpi-label">Booking</div></div>`;

    // Render Content (Dummy Content Full Grid)
    const active = document.querySelector('.tab.active').dataset.tab;
    const area = document.getElementById('tab-content-area');
    
    let html = `<div class="glass"><div class="section-title">${active.toUpperCase()} DATA</div>`;
    if(active === 'dana') html += `<table><tr><th>Judul</th><th>Nominal</th><th>Status</th></tr>${d.map(x=>`<tr><td>${x.judul}</td><td>${x.nominal}</td><td>${x.status}</td></tr>`).join('')}</table>`;
    else html += `<p>Data ${active} dimuat dari Cloud...</p>`;
    html += `</div>`;
    area.innerHTML = html;
  }

  document.getElementById('workspace-tabs').addEventListener('click', e => {
    if(!e.target.classList.contains('tab')) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    render();
  });

  if(window.SyncEngine) {
    ['dana_requests', 'k3_reports', 'maintenance_tasks', 'bookings'].forEach(t => window.SyncEngine.subscribe(t, render));
  }
  render();
})();
</script>
