<style>
  :root { --glass-bg: rgba(15, 23, 42, 0.7); --neon: #00ff9d; --accent: #0ea5e9; --warning: #e11d48; --gold: #f59e0b; --purple: #8b5cf6; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #0a0e27; color: #e2e8f0; min-height: 100vh; padding: 1rem; }
  .glass { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 1.5rem; margin-bottom: 1rem; }
  .back-btn { position: fixed; top: 1rem; left: 1rem; z-index: 1000; background: rgba(30,41,59,0.9); border: 1px solid var(--neon); color: var(--neon); padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.75rem; }
  .btn { padding: 0.6rem 1.2rem; border: none; border-radius: 8px; font-weight: 700; font-size: 0.75rem; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.4rem; }
  .btn-success { background: #10b981; color: #fff; }
  .btn-danger { background: var(--warning); color: #fff; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-warning { background: var(--gold); color: #000; }
  .btn:hover { transform: translateY(-2px); opacity: 0.95; }
  .module-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin: 1rem 0; }
  .mod-card { background: rgba(0,0,0,0.3); padding: 1.5rem; border-radius: 12px; text-align: center; cursor: pointer; border: 2px solid rgba(255,255,255,0.05); transition: all 0.3s; }
  .mod-card:hover { border-color: var(--neon); transform: translateY(-5px); }
  .mod-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
  .mod-title { font-size: 0.8rem; font-weight: 600; color: #94a3b8; }
  .role-info { background: rgba(139,92,246,0.1); border-left: 4px solid var(--purple); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
  .audit-item { background: rgba(0,0,0,0.3); padding: 0.5rem; border-radius: 4px; margin-bottom: 0.3rem; font-size: 0.75rem; font-family: 'Courier New', monospace; }
  .badge { padding: 0.25rem 0.6rem; border-radius: 12px; font-size: 0.65rem; font-weight: 700; }
  .badge-success { background: rgba(16,185,129,0.2); color: #10b981; }
  .badge-warning { background: rgba(245,158,11,0.2); color: #f59e0b; }
  .badge-purple { background: rgba(139,92,246,0.2); color: var(--purple); }
  table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
  th { background: rgba(0,0,0,0.4); color: var(--accent); padding: 0.6rem; text-align: left; }
  td { padding: 0.6rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .tab { padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: #94a3b8; font-size: 0.75rem; font-weight: 600; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .form-group { margin-bottom: 1rem; }
  .form-group label { display: block; color: #94a3b8; font-size: 0.75rem; margin-bottom: 0.3rem; }
  .form-group input, .form-group select { width: 100%; padding: 0.6rem; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #e2e8f0; font-size: 0.8rem; }
  .form-group input:focus, .form-group select:focus { border-color: var(--neon); outline: none; }
  .alert { padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
  .alert-success { background: rgba(16,185,129,0.2); border: 1px solid #10b981; color: #10b981; }
  .alert-error { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #ef4444; }
</style>

<button class="back-btn" onclick="window.goHome()">← HOME</button>

<div style="max-width: 1200px; margin: 3.5rem auto; padding: 0 1rem;">

  <!-- HEADER -->
  <div class="glass">
    <h2 style="color: var(--neon); margin: 0; font-size: 1.3rem;">🏢 COMMAND CENTER</h2>
    <div style="color: #94a3b8; font-size: 0.8rem; margin-top: 0.5rem;">
      User: <strong id="user-name">Loading...</strong> | 
      Role: <span id="role-badge" class="badge badge-success">---</span>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('dashboard')">📊 Dashboard</button>
    <button class="tab" onclick="switchTab('users')" id="tab-users-btn" style="display:none;">👥 Users</button>
    <button class="tab" onclick="switchTab('audit')" id="tab-audit-btn" style="display:none;">📜 Audit Log</button>
  </div>

  <!-- TAB: DASHBOARD -->
  <div id="tab-dashboard" class="tab-content active">
    <div class="glass">
      <div class="role-info" id="role-permissions">
        Loading permissions...
      </div>
    </div>

    <div class="glass">
      <div class="section-title" style="color: var(--neon); margin-bottom: 1rem;">📱 Modul yang Dapat Diakses</div>
      <div class="module-grid" id="module-grid"></div>
    </div>

    <div class="glass" id="quick-actions" style="display: none;">
      <div class="section-title" style="color: var(--gold); margin-bottom: 1rem;">⚡ Quick Actions</div>
      <div id="quick-actions-content"></div>
    </div>
  </div>

  <!-- TAB: USERS -->
  <div id="tab-users" class="tab-content">
    <div class="glass">
      <h3 style="color: var(--neon); margin-bottom: 1rem;">👥 Manajemen User</h3>
      
      <div id="user-form-container">
        <h4 style="color: var(--accent); margin-bottom: 1rem;">➕ Tambah User Baru</h4>
        <div class="form-group">
          <label>Nama Lengkap *</label>
          <input type="text" id="new-user-nama" placeholder="Nama lengkap">
        </div>
        <div class="form-group">
          <label>Email *</label>
          <input type="email" id="new-user-email" placeholder="email@example.com">
        </div>
        <div class="form-group">
          <label>Role *</label>
          <select id="new-user-role">
            <option value="staff">Staff</option>
            <option value="guru">Guru</option>
            <option value="security">Security</option>
            <option value="komandan_regu">Komandan Regu</option>
            <option value="janitor_indoor">Janitor Indoor</option>
            <option value="janitor_outdoor">Janitor Outdoor</option>
            <option value="maintenance">Maintenance</option>
            <option value="koordinator_umum">Koordinator Umum</option>
            <option value="kabag_umum">Kabag Umum</option>
          </select>
        </div>
        <div class="form-group">
          <label>Divisi</label>
          <select id="new-user-divisi">
            <option value="UMUM">Umum</option>
            <option value="TK">TK</option>
            <option value="SD">SD</option>
            <option value="SMP">SMP</option>
            <option value="SMA">SMA</option>
            <option value="Management">Management</option>
          </select>
        </div>
        <div class="form-group">
          <label>Password Default *</label>
          <input type="text" id="new-user-password" value="12345678" placeholder="Password default">
          <small style="color: #94a3b8; font-size: 0.7rem;">User wajib ganti password saat login pertama</small>
        </div>
        <button class="btn btn-success" onclick="createUser()">✅ Buat User</button>
        <div id="user-form-message"></div>
      </div>

      <h4 style="color: var(--accent); margin: 2rem 0 1rem;">📋 Daftar User</h4>
      <div id="user-list">
        <p style="color: #94a3b8;">Memuat data...</p>
      </div>
    </div>
  </div>

  <!-- TAB: AUDIT LOG -->
  <div id="tab-audit" class="tab-content">
    <div class="glass">
      <h3 style="color: var(--neon); margin-bottom: 1rem;">📜 Activity Log</h3>
      <div id="audit-log" style="max-height: 500px; overflow-y: auto;">
        <div class="audit-item">Memuat log...</div>
      </div>
    </div>
  </div>

</div>

<script>
// Auto-fallback
if (!window.goHome) window.goHome = function() { 
  if (window.parent && window.parent.goHome) window.parent.goHome();
  else window.location.reload();
};

(function() {
  'use strict';

  const user = JSON.parse(localStorage.getItem('dreamos_bound_user') || '{}');
  const role = user.role || 'staff';
  
  document.getElementById('user-name').textContent = user.nama || user.email || 'Unknown';
  document.getElementById('role-badge').textContent = role.toUpperCase();

  const RBAC = {
    staff: {
      modules: ['booking', 'k3'],
      canSubmitDana: false,
      canApproveDana: false,
      canEditSecuritySchedule: false,
      canManageUsers: false,
      logActivity: true
    },
    security: {
      modules: ['security', 'k3'],
      canSubmitDana: false,
      canApproveDana: false,
      canEditSecuritySchedule: false,
      canManageUsers: false,
      logActivity: true
    },
    komandan_regu: {
      modules: ['security', 'k3', 'security_schedule'],
      canSubmitDana: false,
      canApproveDana: false,
      canEditSecuritySchedule: true,
      canManageUsers: false,
      logActivity: true
    },
    janitor_indoor: {
      modules: ['janitor_indoor', 'k3'],
      canSubmitDana: false,
      canApproveDana: false,
      canEditSecuritySchedule: false,
      canManageUsers: false,
      logActivity: true
    },
    janitor_outdoor: {
      modules: ['janitor_outdoor', 'k3'],
      canSubmitDana: false,
      canApproveDana: false,
      canEditSecuritySchedule: false,
      canManageUsers: false,
      logActivity: true
    },
    maintenance: {
      modules: ['maintenance', 'k3'],
      canSubmitDana: false,
      canApproveDana: false,
      canEditSecuritySchedule: false,
      canManageUsers: false,
      logActivity: true
    },
    koordinator_umum: {
      modules: ['booking', 'k3', 'dana'],
      canSubmitDana: true,
      canApproveDana: false,
      canEditSecuritySchedule: false,
      canManageUsers: true,
      logActivity: true
    },
    kabag_umum: {
      modules: ['booking', 'k3', 'dana', 'users', 'audit'],
      canSubmitDana: true,
      canApproveDana: true,
      canEditSecuritySchedule: false,
      canManageUsers: true,
      logActivity: true
    },
    dev: {
      modules: ['booking', 'k3', 'security', 'security_schedule', 'janitor_indoor', 'janitor_outdoor', 'maintenance', 'dana', 'users', 'audit', 'system'],
      canSubmitDana: true,
      canApproveDana: true,
      canEditSecuritySchedule: true,
      canManageUsers: true,
      logActivity: false
    }
  };

  const permissions = RBAC[role] || RBAC.staff;

  const MODULES = {
    booking: { icon: '📅', title: 'Booking', desc: 'Pemesanan Ruangan' },
    k3: { icon: '⚠️', title: 'K3 Safety', desc: 'Keselamatan Kerja' },
    security: { icon: '🛡️', title: 'Security', desc: 'Keamanan' },
    security_schedule: { icon: '📆', title: 'Jadwal Security', desc: 'Edit Jadwal' },
    janitor_indoor: { icon: '🏠', title: 'Janitor Indoor', desc: 'Kebersihan Dalam' },
    janitor_outdoor: { icon: '🌳', title: 'Janitor Outdoor', desc: 'Kebersihan Luar' },
    maintenance: { icon: '🔧', title: 'Maintenance', desc: 'Perawatan' },
    dana: { icon: '💸', title: 'Dana', desc: 'Pengajuan Dana' },
    users: { icon: '👥', title: 'Users', desc: 'Manajemen User' },
    audit: { icon: '📜', title: 'Audit', desc: 'Audit Log' },
    system: { icon: '⚙️', title: 'System', desc: 'System Settings' }
  };

  // Show tabs based on role
  if (permissions.canManageUsers) {
    document.getElementById('tab-users-btn').style.display = 'block';
  }
  if (permissions.logActivity) {
    document.getElementById('tab-audit-btn').style.display = 'block';
  }

  function renderModules() {
    const grid = document.getElementById('module-grid');
    grid.innerHTML = '';
    
    permissions.modules.forEach(modKey => {
      const mod = MODULES[modKey];
      if (!mod) return;
      
      const card = document.createElement('div');
      card.className = 'mod-card';
      card.innerHTML = `
        <div class="mod-icon">${mod.icon}</div>
        <div class="mod-title">${mod.title}</div>
        <div style="font-size: 0.65rem; color: #64748b; margin-top: 0.3rem;">${mod.desc}</div>
      `;
      card.onclick = () => openModule(modKey);
      grid.appendChild(card);
    });
  }

  function renderRoleInfo() {
    const infoEl = document.getElementById('role-permissions');
    let html = '<strong>📋 Hak Akses Role ' + role.toUpperCase() + ':</strong><br>';
    html += '<div style="margin-top: 0.5rem; font-size: 0.75rem;">';
    html += '• Modul: ' + permissions.modules.join(', ') + '<br>';
    html += '• Submit Dana: ' + (permissions.canSubmitDana ? '✅' : '❌') + ' | ';
    html += 'Approve Dana: ' + (permissions.canApproveDana ? '✅' : '❌') + '<br>';
    html += '• Manage Users: ' + (permissions.canManageUsers ? '✅' : '❌') + '<br>';
    html += '• Audit Log: ' + (permissions.logActivity ? '✅ Enabled' : '❌ Disabled') + '</div>';
    infoEl.innerHTML = html;
  }

  function renderQuickActions() {
    const container = document.getElementById('quick-actions');
    const content = document.getElementById('quick-actions-content');
    
    if (permissions.canSubmitDana) {
      container.style.display = 'block';
      content.innerHTML += `<button class="btn btn-success" onclick="openDanaForm()" style="margin-right: 0.5rem;">💸 Ajukan Dana</button>`;
    }
    
    if (permissions.canApproveDana) {
      container.style.display = 'block';
      content.innerHTML += `<button class="btn btn-warning" onclick="openDanaApproval()" style="margin-right: 0.5rem;">✅ Approve Dana</button>`;
    }
    
    if (permissions.canEditSecuritySchedule) {
      container.style.display = 'block';
      content.innerHTML += `<button class="btn btn-primary" onclick="openSecuritySchedule()" style="margin-right: 0.5rem;">📆 Edit Jadwal Security</button>`;
    }
  }

  window.switchTab = function(tabName) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    
    event.target.classList.add('active');
    document.getElementById('tab-' + tabName).classList.add('active');
    
    if (tabName === 'users') renderUserList();
    if (tabName === 'audit') renderAuditLog();
  };

  window.openModule = function(modKey) {
    if (permissions.logActivity) {
      logActivity('OPEN_MODULE', { module: modKey });
    }
    
    const modPages = {
      booking: 'booking.html',
      k3: 'k3.html',
      security: 'security.html',
      security_schedule: 'security_schedule.html',
      janitor_indoor: 'janitor-indoor.html',
      janitor_outdoor: 'janitor-outdoor.html',
      maintenance: 'maintenance.html',
      dana: 'dana.html',
      users: '#users',
      audit: '#audit',
      system: 'system.html'
    };
    
    if (modKey === 'users') {
      switchTab('users');
      document.querySelector('.tab[onclick*="users"]').click();
    } else if (modKey === 'audit') {
      switchTab('audit');
      document.querySelector('.tab[onclick*="audit"]').click();
    } else if (modPages[modKey]) {
      window.location.href = modPages[modKey];
    } else {
      alert('Modul ' + modKey + ' sedang dalam pengembangan');
    }
  };

  window.openDanaForm = function() {
    if (!permissions.canSubmitDana) return alert('⛔ Anda tidak memiliki akses');
    if (permissions.logActivity) logActivity('SUBMIT_DANA', {});
    window.location.href = 'dana.html?action=submit';
  };

  window.openDanaApproval = function() {
    if (!permissions.canApproveDana) return alert('⛔ Anda tidak memiliki akses');
    if (permissions.logActivity) logActivity('APPROVE_DANA_QUEUE', {});
    window.location.href = 'dana.html?action=approve';
  };

  window.openSecuritySchedule = function() {
    if (!permissions.canEditSecuritySchedule) return alert('⛔ Anda tidak memiliki akses');
    if (permissions.logActivity) logActivity('EDIT_SECURITY_SCHEDULE', {});
    window.location.href = 'security_schedule.html';
  };

  async function hashPassword(pwd) {
    const encoder = new TextEncoder();
    const data = encoder.encode(pwd + 'dreamos_salt_2026');
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }

  window.createUser = async function() {
    if (!permissions.canManageUsers) return alert('⛔ Anda tidak memiliki akses');

    const nama = document.getElementById('new-user-nama').value.trim();
    const email = document.getElementById('new-user-email').value.trim();
    const userRole = document.getElementById('new-user-role').value;
    const divisi = document.getElementById('new-user-divisi').value;
    const password = document.getElementById('new-user-password').value;
    const msgEl = document.getElementById('user-form-message');

    if (!nama || !email || !password) {
      msgEl.innerHTML = '<div class="alert alert-error">⚠️ Nama, email, dan password wajib diisi!</div>';
      return;
    }

    try {
      const hashed = await hashPassword(password);
      const newUser = {
        id: 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
        email: email,
        nama: nama,
        role: userRole,
        divisi: divisi,
        password_hash: hashed,
        must_change_password: true,
        is_active: true,
        created_at: new Date().toISOString()
      };

      let localUsers = JSON.parse(localStorage.getItem('dreamos_users_db') || '[]');
      localUsers = localUsers.filter(u => u.email !== email);
      localUsers.push(newUser);
      localStorage.setItem('dreamos_users_db', JSON.stringify(localUsers));

      if (window.supabaseClient) {
        await window.supabaseClient.from('users').upsert(newUser, { onConflict: 'email' });
      }

      if (permissions.logActivity) {
        logActivity('CREATE_USER', { email: email, role: userRole });
      }

      msgEl.innerHTML = `<div class="alert alert-success">✅ User ${nama} berhasil dibuat!<br>Email: ${email}<br>Password: ${password}</div>`;
      
      document.getElementById('new-user-nama').value = '';
      document.getElementById('new-user-email').value = '';
      document.getElementById('new-user-password').value = '12345678';

      renderUserList();

    } catch(e) {
      msgEl.innerHTML = '<div class="alert alert-error">❌ Error: ' + e.message + '</div>';
    }
  };

  function renderUserList() {
    const users = JSON.parse(localStorage.getItem('dreamos_users_db') || '[]');
    const container = document.getElementById('user-list');

    if (users.length === 0) {
      container.innerHTML = '<p style="color: #94a3b8;">Belum ada user.</p>';
      return;
    }

    let html = '<table><tr><th>Nama</th><th>Email</th><th>Role</th><th>Divisi</th><th>Status</th>';
    if (permissions.canManageUsers) html += '<th>Aksi</th>';
    html += '</tr>';

    users.forEach(u => {
      const status = u.must_change_password ? '<span class="badge badge-warning">Ganti Password</span>' : '<span class="badge badge-success">Active</span>';
      html += '<tr>';
      html += '<td>' + (u.nama || '-') + '</td>';
      html += '<td>' + (u.email || '-') + '</td>';
      html += '<td><span class="badge badge-purple">' + (u.role || '-') + '</span></td>';
      html += '<td>' + (u.divisi || '-') + '</td>';
      html += '<td>' + status + '</td>';
      if (permissions.canManageUsers) {
        html += '<td><button class="btn btn-danger" onclick="deleteUser(\'' + u.id + '\')" style="font-size: 0.6rem; padding: 0.3rem 0.6rem;">🗑️ Hapus</button></td>';
      }
      html += '</tr>';
    });
    html += '</table>';
    container.innerHTML = html;
  }

  window.deleteUser = function(userId) {
    if (!permissions.canManageUsers) return alert('⛔ Anda tidak memiliki akses');
    if (!confirm('Yakin hapus user ini?')) return;

    let users = JSON.parse(localStorage.getItem('dreamos_users_db') || '[]');
    users = users.filter(u => u.id !== userId);
    localStorage.setItem('dreamos_users_db', JSON.stringify(users));

    if (window.supabaseClient) {
      window.supabaseClient.from('users').delete().eq('id', userId).then(() => {}).catch(() => {});
    }

    if (permissions.logActivity) {
      logActivity('DELETE_USER', { user_id: userId });
    }

    renderUserList();
  };

  function logActivity(action, details) {
    const logs = JSON.parse(localStorage.getItem('dreamos_activity_log') || '[]');
    logs.unshift({
      timestamp: new Date().toISOString(),
      user: user.email,
      role: role,
      action: action,
      details: details
    });
    
    if (logs.length > 100) logs.length = 100;
    localStorage.setItem('dreamos_activity_log', JSON.stringify(logs));
    
    if (window.supabaseClient) {
      window.supabaseClient.from('activity_logs').insert([{
        user_email: user.email,
        user_role: role,
        action: action,
        details: JSON.stringify(details),
        created_at: new Date().toISOString()
      }]).then(() => {}).catch(() => {});
    }
  }

  function renderAuditLog() {
    const logs = JSON.parse(localStorage.getItem('dreamos_activity_log') || '[]');
    const container = document.getElementById('audit-log');
    
    if (logs.length === 0) {
      container.innerHTML = '<div class="audit-item">Belum ada aktivitas</div>';
      return;
    }
    
    container.innerHTML = logs.slice(0, 50).map(log => {
      const time = new Date(log.timestamp).toLocaleString('id-ID');
      return `<div class="audit-item">[${time}] <strong>${log.user}</strong> (${log.role}): ${log.action}</div>`;
    }).join('');
  }

  renderModules();
  renderRoleInfo();
  renderQuickActions();
  
  console.log('🏢 Command Center Loaded');
  console.log('Role:', role);
  console.log('Can Manage Users:', permissions.canManageUsers);
  
})();
</script>
