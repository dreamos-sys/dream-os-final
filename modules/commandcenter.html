<style>
  :root { --glass-bg: rgba(15, 23, 42, 0.7); --neon: #00ff9d; --accent: #0ea5e9; --warning: #e11d48; --gold: #f59e0b; }
  .glass { background: var(--glass-bg); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 1.2rem; margin-bottom: 1rem; }
  .grid-9 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem; }
  .mod-card { background: rgba(0,0,0,0.3); padding: 1rem; border-radius: 12px; text-align: center; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
  .mod-card:hover { border-color: var(--neon); transform: translateY(-5px); }
  .mod-icon { font-size: 1.5rem; margin-bottom: 0.5rem; }
  .mod-title { font-size: 0.7rem; font-weight: 600; color: #94a3b8; }
  table { width:100%; border-collapse:collapse; font-size:0.75rem; color: #e2e8f0; }
  th { text-align:left; color: var(--accent); padding: 0.5rem; border-bottom: 1px solid #334155; }
  td { padding: 0.5rem; border-bottom: 1px solid #1e293b; }
  .back-btn { position: fixed; top: 1rem; left: 1rem; z-index: 99; background: #0ea5e9; color: white; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; border: none; font-size: 0.7rem; }
</style>

<button class="back-btn" onclick="window.goHome()">← HOME</button>

<div style="max-width: 900px; margin: 3rem auto; padding: 0 1rem;">
  <div class="glass" style="text-align:center;">
    <h2 style="color:var(--neon);">COMMAND CENTER</h2>
    <div id="user-info" style="font-size:0.8rem;">---</div>
  </div>

  <div class="grid-9">
    <div class="mod-card" onclick="openMod('dana')"><div class="mod-icon">💸</div><div class="mod-title">DANA</div></div>
    <div class="mod-card" onclick="openMod('k3')"><div class="mod-icon">⚠️</div><div class="mod-title">K3</div></div>
    <div class="mod-card" onclick="openMod('maint')"><div class="mod-icon">🔧</div><div class="mod-title">MAINT</div></div>
    <div class="mod-card" onclick="openMod('booking')"><div class="mod-icon">📅</div><div class="mod-title">BOOKING</div></div>
    <div class="mod-card" onclick="openMod('users')"><div class="mod-icon">👥</div><div class="mod-title">USERS</div></div>
    <div class="mod-card" onclick="openMod('audit')"><div class="mod-icon">📜</div><div class="mod-title">AUDIT</div></div>
  </div>

  <div class="glass" id="live-data-panel">
    <h3 style="color:var(--gold); font-size:0.9rem; margin-bottom:1rem;">📡 LIVE DATA FEED</h3>
    <div id="data-content">Memuat data...</div>
  </div>
</div>

<script>
// Auto-fallback untuk fungsi global
if (!window.goHome) window.goHome = function() { 
  if (window.parent && window.parent.goHome) window.parent.goHome();
  else window.location.reload();
};
if (!window.supabaseClient && window.parent && window.supabaseClientClient) 
  window.supabaseClient = window.supabaseClientClient;
if (!window.renderDashboard && window.parent && window.parent.renderDashboard) 
  window.renderDashboard = window.parent.renderDashboard;

(function() {
  const user = JSON.parse(localStorage.getItem('dreamos_bound_user') || '{}');
  document.getElementById('user-info').textContent = `User: ${user.nama || user.email} | Role: ${user.role}`;

  async function loadTable(table) {
    const el = document.getElementById('data-content');
    try {
      if(!window.supabaseClient) throw new Error("Supabase Offline");
      const { data, error } = await window.supabaseClient.from(table).select('*').limit(5);
      if(error) throw error;
      localStorage.setItem('cache_'+table, JSON.stringify(data));
      return data;
    } catch(e) {
      console.warn("Fallback to cache for:", table);
      return JSON.parse(localStorage.getItem('cache_'+table) || '[]');
    }
  }

  window.openMod = async function(tab) {
    const el = document.getElementById('data-content');
    el.innerHTML = '<div style="color:var(--neon)">Loading ' + tab + '...</div>';
    
    const data = await loadTable(tab === 'maint' ? 'maintenance_tasks' : tab === 'dana' ? 'dana_requests' : tab);
    
    if(data.length === 0) {
      el.innerHTML = '<p>Data kosong.</p>';
      return;
    }

    let html = '<table><tr>';
    Object.keys(data[0]).slice(0,3).forEach(k => html += `<th>${k}</th>`);
    html += '</tr>';
    data.forEach(row => {
      html += '<tr>';
      Object.values(row).slice(0,3).forEach(v => html += `<td>${v}</td>`);
      html += '</tr>';
    });
    html += '</table>';
    el.innerHTML = html;
  };

  if(window.SyncEngine) {
    ['bookings', 'dana_requests', 'k3_reports', 'maintenance_tasks', 'users'].forEach(t => {
      window.SyncEngine.subscribe(t, () => console.log('Sync Update:', t));
    });
  }
})();
</script>
