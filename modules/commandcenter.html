<style>
  :root { --glass-bg: rgba(15, 23, 42, 0.6); --glass-border: rgba(0, 255, 157, 0.12); --neon: #00ff9d; --accent: #0ea5e9; --warning: #e11d48; --gold: #f59e0b; --purple: #8b5cf6; --pink: #ec4899; }
  * { box-sizing: border-box; }
  .glass { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 1rem; margin-bottom: 0.8rem; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
  .back-btn { position: fixed; top: 0.8rem; left: 0.8rem; z-index: 1000; background: rgba(30,41,59,0.9); border: 1px solid var(--neon); color: var(--neon); padding: 0.4rem 0.8rem; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.7rem; }
  .btn { padding: 0.5rem 0.9rem; border: none; border-radius: 8px; font-weight: 700; font-size: 0.7rem; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.3rem; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-success { background: #10b981; color: #fff; }
  .btn-danger { background: var(--warning); color: #fff; }
  .btn-warning { background: var(--gold); color: #000; }
  .btn-purple { background: var(--purple); color: #fff; }
  .btn-pink { background: var(--pink); color: #fff; }
  .input-field { width: 100%; padding: 0.6rem; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #e2e8f0; font-size: 0.8rem; outline: none; margin-bottom: 0.5rem; }
  table { width:100%; border-collapse:collapse; font-size:0.7rem; }
  th { background: rgba(0,0,0,0.3); color: #94a3b8; padding: 0.4rem; text-align: left; font-size:0.6rem; text-transform:uppercase; }
  td { padding: 0.35rem 0.4rem; border-bottom: 1px solid rgba(255,255,255,0.03); }
  .badge { padding: 0.12rem 0.4rem; border-radius: 10px; font-size: 0.55rem; font-weight: 600; }
  .badge-pending { background: rgba(245,158,11,0.2); color: #f59e0b; }
  .badge-approved { background: rgba(16,185,129,0.2); color: #10b981; }
  .badge-rejected { background: rgba(225,29,72,0.2); color: #e11d48; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.6rem; }
  .kpi-card { text-align: center; padding: 0.6rem; border-radius: 10px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
  .kpi-value { font-size: 1.2rem; font-weight: 700; }
  .kpi-label { font-size: 0.55rem; color: #94a3b8; text-transform: uppercase; }
  .section-title { font-size: 0.8rem; font-weight: 700; margin: 0 0 0.6rem; display: flex; align-items: center; gap: 0.3rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.4rem; }
  .tab { padding: 0.35rem 0.8rem; border-radius: 8px; font-size: 0.65rem; font-weight: 600; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: #94a3b8; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chart-container { min-height: 200px; }
  .loading-text { color: #0ea5e9; }
</style>

<button class="back-btn" onclick="window.goHome()">← HOME</button>

<div style="max-width:1400px; margin:0 auto; padding:3.5rem 0.8rem 5rem;">
  <!-- HEADER & KPI -->
  <div class="glass" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.8rem;">
    <div><h2 style="color:var(--neon); margin:0; font-size:1.1rem;">🏢 COMMAND CENTER PRO</h2></div>
    <div style="text-align:right;"><div id="user-display" style="font-weight:700;">--</div><div id="live-clock" style="font-size:0.55rem;">--:--:--</div></div>
  </div>

  <div class="grid-4" id="kpi-cards" style="margin-bottom:0.8rem;"></div>

  <!-- TABS -->
  <div style="display:flex; gap:0.3rem; margin-bottom:0.8rem; flex-wrap:wrap;" id="workspace-tabs">
    <button class="tab active" data-tab="dana">💰 Dana</button>
    <button class="tab" data-tab="k3">⚠️ K3</button>
    <button class="tab" data-tab="maint">🔧 Maint</button>
    <button class="tab" data-tab="booking">📅 Booking</button>
    <button class="tab" data-tab="users">👥 Users</button>
  </div>

  <!-- PANEL DANA -->
  <div id="tab-dana" class="tab-content">
    <div class="grid-2">
      <div class="glass"><div class="section-title">💸 Dana Pending</div><div id="dana-pending-list"></div></div>
      <div class="glass"><div class="section-title">📊 Anggaran</div><div id="budget-summary"></div></div>
    </div>
    <div class="glass"><div class="section-title">📋 Riwayat Dana</div><div id="dana-history"></div></div>
  </div>

  <!-- PANEL K3 -->
  <div id="tab-k3" class="tab-content" style="display:none;">
    <div class="glass"><div class="section-title">⚠️ Laporan K3</div><div id="k3-all-list"></div></div>
  </div>

  <!-- PANEL MAINT -->
  <div id="tab-maint" class="tab-content" style="display:none;">
    <div class="glass"><div class="section-title">🔧 Perawatan</div><div id="maint-list"></div></div>
  </div>

  <!-- PANEL BOOKING -->
  <div id="tab-booking" class="tab-content" style="display:none;">
    <div class="glass"><div class="section-title">📅 Booking</div><div id="booking-list"></div></div>
  </div>

  <!-- PANEL USERS -->
  <div id="tab-users" class="tab-content" style="display:none;">
    <div class="glass"><div class="section-title">👥 User Management</div><div id="user-table"></div></div>
  </div>
</div>

<script>
(function() {
  const user = JSON.parse(localStorage.getItem('dreamos_bound_user') || 'null');
  if(!user) return;
  document.getElementById('user-display').textContent = user.nama || user.email;
  setInterval(() => document.getElementById('live-clock').textContent = new Date().toLocaleTimeString(), 1000);

  // FIX: Data Fetcher yang lebih aman
  async function loadData(table) {
    if(window.supabaseClient) {
      const { data } = await window.supabaseClient.from(table).select('*').order('created_at', {ascending:false});
      if(data) { localStorage.setItem('cache_'+table, JSON.stringify(data)); return data; }
    }
    return JSON.parse(localStorage.getItem('cache_'+table) || '[]');
  }

  async function renderAll() {
    // KPI
    const d = await loadData('dana_requests'), k = await loadData('k3_reports'), m = await loadData('maintenance_tasks'), b = await loadData('bookings');
    document.getElementById('kpi-cards').innerHTML = 
      '<div class="kpi-card" onclick="switchTab(\'k3\')"><div class="kpi-value">'+k.filter(x=>x.status==='pending').length+'</div><div class="kpi-label">K3</div></div>' +
      '<div class="kpi-card" onclick="switchTab(\'maint\')"><div class="kpi-value">'+m.length+'</div><div class="kpi-label">Maint</div></div>' +
      '<div class="kpi-card" onclick="switchTab(\'dana\')"><div class="kpi-value">'+d.filter(x=>x.status==='pending').length+'</div><div class="kpi-label">Dana</div></div>' +
      '<div class="kpi-card" onclick="switchTab(\'booking\')"><div class="kpi-value">'+b.length+'</div><div class="kpi-label">Booking</div></div>';

    // RENDER TAB ACTIVE
    const activeTab = document.querySelector('.tab.active').dataset.tab;
    if(activeTab === 'dana') {
      document.getElementById('dana-pending-list').innerHTML = d.filter(x=>x.status==='pending').map(x => '<div>'+x.judul+'</div>').join('') || 'Kosong';
      document.getElementById('dana-history').innerHTML = '<table>'+d.map(x=>'<tr><td>'+x.judul+'</td><td>'+x.status+'</td></tr>').join('')+'</table>';
    }
    // ...tambah render lainnya untuk tab lain...
  }

  window.switchTab = (name) => {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    document.querySelectorAll('.tab-content').forEach(c => c.style.display = (c.id === 'tab-'+name) ? 'block' : 'none');
    renderAll();
  };

  document.getElementById('workspace-tabs').addEventListener('click', e => { if(e.target.dataset.tab) window.switchTab(e.target.dataset.tab); });
  
  // Realtime Sync
  if(window.SyncEngine) {
    ['dana_requests', 'k3_reports', 'maintenance_tasks', 'bookings'].forEach(t => {
      window.SyncEngine.subscribe(t, renderAll);
    });
  }
  
  renderAll();
})();
</script>
