<style>
  :root { --glass-bg: rgba(15, 23, 42, 0.6); --glass-border: rgba(0, 255, 157, 0.12); --neon: #00ff9d; --accent: #0ea5e9; --warning: #e11d48; --gold: #f59e0b; --purple: #8b5cf6; --pink: #ec4899; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #0a0e27; color: #e2e8f0; min-height: 100vh; }
  .glass { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 1rem; margin-bottom: 0.8rem; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
  .back-btn { position: fixed; top: 0.8rem; left: 0.8rem; z-index: 1000; background: rgba(30,41,59,0.9); border: 1px solid var(--neon); color: var(--neon); padding: 0.4rem 0.8rem; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.7rem; }
  .btn { padding: 0.5rem 0.9rem; border: none; border-radius: 8px; font-weight: 700; font-size: 0.7rem; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.3rem; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-success { background: #10b981; color: #fff; }
  .btn-danger { background: var(--warning); color: #fff; }
  .btn-warning { background: var(--gold); color: #000; }
  .btn-purple { background: var(--purple); color: #fff; }
  .btn-pink { background: var(--pink); color: #fff; }
  .input-field, textarea, select { width: 100%; padding: 0.6rem; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #e2e8f0; font-size: 0.8rem; outline: none; font-family: 'Inter',sans-serif; }
  .input-field:focus { border-color: var(--neon); }
  table { width:100%; border-collapse:collapse; font-size:0.7rem; }
  th { background: rgba(0,0,0,0.3); color: #94a3b8; padding: 0.4rem; text-align: left; font-size:0.6rem; text-transform:uppercase; }
  td { padding: 0.35rem 0.4rem; border-bottom: 1px solid rgba(255,255,255,0.03); }
  .badge { padding: 0.12rem 0.4rem; border-radius: 10px; font-size: 0.55rem; font-weight: 600; }
  .badge-pending { background: rgba(245,158,11,0.2); color: #f59e0b; }
  .badge-approved { background: rgba(16,185,129,0.2); color: #10b981; }
  .badge-rejected { background: rgba(225,29,72,0.2); color: #e11d48; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
  .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 0.6rem; }
  @media (max-width: 600px) { .grid-2, .grid-4 { grid-template-columns: 1fr; } }
  .kpi-card { text-align: center; padding: 0.6rem; border-radius: 10px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
  .kpi-value { font-size: 1.2rem; font-weight: 700; }
  .kpi-label { font-size: 0.55rem; color: #94a3b8; text-transform: uppercase; }
  .section-title { font-size: 0.8rem; font-weight: 700; margin: 0 0 0.6rem; display: flex; align-items: center; gap: 0.3rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.4rem; }
  .tabs { display: flex; gap: 0.2rem; margin-bottom: 0.8rem; flex-wrap: wrap; }
  .tab { padding: 0.35rem 0.8rem; border-radius: 8px; font-size: 0.65rem; font-weight: 600; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: #94a3b8; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .progress-bar { height: 8px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; margin-top: 0.4rem; }
  .progress-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; background: var(--accent); }
  .action-row { display: flex; gap: 0.4rem; margin-bottom: 0.6rem; flex-wrap: wrap; }
  .search-box { display: flex; gap: 0.4rem; margin-bottom: 0.6rem; }
  .quick-actions { display: flex; gap: 0.3rem; flex-wrap: wrap; margin-bottom: 0.8rem; }
  .chart-container { min-height: 200px; position: relative; }
  .loading-text { text-align: center; padding: 2rem; color: #94a3b8; }
</style>
<button class="back-btn" onclick="window.goHome()">← HOME</button>

<div style="max-width:1400px; margin:0 auto; padding:3.5rem 0.8rem 5rem;">
  <div class="glass" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.8rem;">
    <div>
      <h2 style="color:var(--neon); margin:0; font-size:1.1rem;">🏢 COMMAND CENTER PRO <span style="font-size:0.6rem; color:#64748b;">v5.9</span></h2>
      <p style="color:#94a3b8; font-size:0.62rem; margin:0;" id="role-subtitle">Loading...</p>
    </div>
    <div style="display:flex; align-items:center; gap:0.8rem;">
      <div style="text-align:right;">
        <div style="font-weight:700; font-size:0.8rem;" id="user-display">🔒</div>
        <div style="font-size:0.55rem; color:#64748b;" id="live-clock">--:--:--</div>
      </div>
      <button class="btn btn-danger" onclick="doLogout()" style="font-size:0.6rem; padding:0.25rem 0.6rem;">🚪</button>
    </div>
  </div>

  <div class="tabs" id="workspace-tabs">
    <button class="tab active" data-tab="dana">💰 Dana</button>
    <button class="tab" data-tab="k3">⚠️ K3</button>
    <button class="tab" data-tab="maint">🔧 Maint</button>
    <button class="tab" data-tab="booking">📅 Booking</button>
    <button class="tab" data-tab="users">👥 Users</button>
    <button class="tab" data-tab="audit">📜 Audit</button>
    <button class="tab" data-tab="system">⚙️ System</button>
  </div>

  <div id="tab-users" class="tab-content" style="display:none;">
    <div class="glass">
      <div class="section-title" style="color:var(--purple);">👥 MANAJEMEN USER</div>
      <div id="user-table" class="loading-text">Memuat...</div>
    </div>
  </div>

  <div id="tab-dana" class="tab-content">
    <div class="glass"><div class="section-title" style="color:var(--gold);">💸 Dana</div><div id="dana-list" class="loading-text">Memuat...</div></div>
  </div>

  <div id="tab-k3" class="tab-content" style="display:none;">
    <div class="glass"><div class="section-title" style="color:var(--warning);">⚠️ K3</div><div id="k3-list" class="loading-text">Memuat...</div></div>
  </div>

  <div id="tab-maint" class="tab-content" style="display:none;">
    <div class="glass"><div class="section-title" style="color:var(--accent);">🔧 Maint</div><div id="maint-list" class="loading-text">Memuat...</div></div>
  </div>

  <div id="tab-booking" class="tab-content" style="display:none;">
    <div class="glass">
      <div class="section-title" style="color:var(--accent);">📅 FORM BOOKING</div>
      <div style="display:grid; gap:0.5rem;">
        <input type="date" id="booking-tgl" class="input-field">
        <input type="text" id="booking-ruang" class="input-field" placeholder="Ruangan">
        <input type="text" id="booking-peminjam" class="input-field" placeholder="Nama Peminjam">
        <input type="time" id="booking-jam-mulai" class="input-field" value="08:00">
        <input type="time" id="booking-jam-selesai" class="input-field" value="10:00">
        <button class="btn btn-success" onclick="addBooking()">✅ SIMPAN BOOKING</button>
      </div>
    </div>
    <div class="glass" style="margin-top:0.8rem;">
      <div class="section-title">📋 DAFTAR BOOKING</div>
      <div id="booking-list" class="loading-text">Memuat...</div>
    </div>
  </div>

  <div id="tab-audit" class="tab-content" style="display:none;">
    <div class="glass"><div class="section-title">📜 Audit</div><div id="audit-list" class="loading-text">Memuat...</div></div>
  </div>

  <div id="tab-system" class="tab-content" style="display:none;">
    <div class="glass"><div class="section-title">⚙️ System</div><div id="system-info" class="loading-text">Memuat...</div></div>
  </div>
</div>

<script>
(function() {
  var user = JSON.parse(localStorage.getItem('dreamos_bound_user') || 'null');
  if (!user) { document.body.innerHTML = '<h2 style="color:#ef4444;text-align:center;padding:4rem;">🔒 Silakan login.</h2>'; return; }

  var role = user.role || 'staff';
  document.getElementById('user-display').textContent = user.nama || 'User';
  document.getElementById('role-subtitle').textContent = 'Role: ' + role.toUpperCase() + ' • v5.9';
  setInterval(function() { document.getElementById('live-clock').textContent = new Date().toLocaleTimeString('id-ID'); }, 1000);

  function safeGet(k, fb) { try { return JSON.parse(localStorage.getItem(k) || JSON.stringify(fb)); } catch(e) { return fb; } }
  function renderAllNow() { try { renderAll(); } catch(e) { console.error(e); } }

  // RBAC yang BENAR
  function getAllowedTabs() {
    var tabs = {
      dev: ['users','dana','k3','maint','booking','audit','system'],
      kabag_umum: ['users','dana','k3','maint','booking','audit','system'],
      koordinator_umum: ['dana'],
      komandan_regu: ['security'],
      guru: ['booking', 'k3'],
      janitor_indoor: ['janitor-indoor'],
      janitor_outdoor: ['janitor-outdoor'],
      security: ['security'],
      maintenance: ['maint'],
      staff: ['profile','qr','about','setting']
    };
    return tabs[role] || [];
  }

  var allowed = getAllowedTabs();
  document.querySelectorAll('#workspace-tabs .tab').forEach(function(tab) {
    tab.style.display = allowed.includes(tab.dataset.tab) ? '' : 'none';
  });

  function canAccess(tabName) { return allowed.includes(tabName); }
  function isAdmin() { return ['dev','kabag_umum','koordinator_umum'].includes(role); }

  document.getElementById('workspace-tabs').addEventListener('click', function(e) {
    var tab = e.target.closest('.tab');
    if (!tab || !canAccess(tab.dataset.tab)) return;
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    document.querySelectorAll('[id^="tab-"]').forEach(function(c) { c.style.display = 'none'; });
    tab.classList.add('active');
    document.getElementById('tab-' + tab.dataset.tab).style.display = 'block';
    refreshTab(tab.dataset.tab);
  });

  function refreshTab(name) {
    if (name === 'users') renderUserTable();
    if (name === 'dana') renderDanaList();
    if (name === 'k3') renderK3List();
    if (name === 'maint') renderMaintList();
    if (name === 'booking') renderBookingList();
    if (name === 'audit') renderAuditList();
    if (name === 'system') renderSystemInfo();
  }

  function renderAll() {
    if (canAccess('users')) renderUserTable();
    if (canAccess('dana')) renderDanaList();
    if (canAccess('k3')) renderK3List();
    if (canAccess('maint')) renderMaintList();
    if (canAccess('booking')) renderBookingList();
    if (canAccess('audit')) renderAuditList();
    if (canAccess('system')) renderSystemInfo();
  }

  function renderUserTable() {
    var el = document.getElementById('user-table');
    if (!el) return;
    var users = safeGet('dreamos_users_db', []);
    el.innerHTML = users.length ? '<table><tr><th>Nama</th><th>Email</th><th>Role</th></tr>' + users.map(function(u) { return '<tr><td>' + u.nama + '</td><td>' + u.email + '</td><td>' + u.role + '</td></tr>'; }).join('') + '</table>' : '<p>Belum ada user.</p>';
  }

  function renderDanaList() {
    var el = document.getElementById('dana-list');
    if (!el) return;
    var dana = safeGet('dreamos_dana', []);
    el.innerHTML = dana.length ? '<table><tr><th>Judul</th><th>Nominal</th><th>Status</th></tr>' + dana.map(function(d) { return '<tr><td>' + d.judul + '</td><td>Rp ' + parseInt(d.nominal).toLocaleString('id-ID') + '</td><td>' + d.status + '</td></tr>'; }).join('') + '</table>' : '<p>Belum ada pengajuan dana.</p>';
  }

  function renderK3List() {
    var el = document.getElementById('k3-list');
    if (!el) return;
    var k3 = safeGet('dreamos_k3_reports', []);
    el.innerHTML = k3.length ? '<table><tr><th>Lokasi</th><th>Kategori</th><th>Status</th></tr>' + k3.map(function(k) { return '<tr><td>' + k.lokasi + '</td><td>' + k.kategori + '</td><td>' + k.status + '</td></tr>'; }).join('') + '</table>' : '<p>Belum ada laporan K3.</p>';
  }

  function renderMaintList() {
    var el = document.getElementById('maint-list');
    if (!el) return;
    var maint = safeGet('dreamos_maintenance_tasks', []);
    el.innerHTML = maint.length ? '<table><tr><th>Judul</th><th>Lokasi</th><th>Status</th></tr>' + maint.map(function(m) { return '<tr><td>' + m.judul + '</td><td>' + m.lokasi + '</td><td>' + m.status + '</td></tr>'; }).join('') + '</table>' : '<p>Belum ada tugas maintenance.</p>';
  }

  function renderBookingList() {
    var el = document.getElementById('booking-list');
    if (!el) return;
    var b = safeGet('dreamos_bookings', []);
    el.innerHTML = b.length ? '<table><tr><th>Tgl</th><th>Ruang</th><th>Peminjam</th><th>Jam</th></tr>' + b.map(function(x) { return '<tr><td>' + x.tgl + '</td><td>' + x.ruang + '</td><td>' + x.nama_peminjam + '</td><td>' + x.jam_mulai + '-' + x.jam_selesai + '</td></tr>'; }).join('') + '</table>' : '<p>Belum ada booking.</p>';
  }

  function renderAuditList() {
    var el = document.getElementById('audit-list');
    if (!el) return;
    var logs = safeGet('dreamos_audit_logs', []);
    el.innerHTML = logs.length ? '<table><tr><th>Waktu</th><th>User</th><th>Aksi</th></tr>' + logs.slice(0, 20).map(function(l) { return '<tr><td>' + new Date(l.time).toLocaleString('id-ID') + '</td><td>' + l.user + '</td><td>' + l.action + '</td></tr>'; }).join('') + '</table>' : '<p>Belum ada log audit.</p>';
  }

  function renderSystemInfo() {
    var el = document.getElementById('system-info');
    if (!el) return;
    var totalKeys = localStorage.length;
    var totalSize = 0;
    for (var i = 0; i < localStorage.length; i++) {
      totalSize += (localStorage.getItem(localStorage.key(i)) || '').length * 2;
    }
    el.innerHTML = '<p>Total keys: ' + totalKeys + '</p><p>Estimasi ukuran: ' + (totalSize / 1024).toFixed(1) + ' KB</p>';
  }

  // FUNGSI BOOKING (TERHUBUNG KE SUPABASE)
  window.addBooking = async function() {
    var tgl = document.getElementById('booking-tgl').value;
    var ruang = document.getElementById('booking-ruang').value.trim();
    var peminjam = document.getElementById('booking-peminjam').value.trim();
    var mulai = document.getElementById('booking-jam-mulai').value;
    var selesai = document.getElementById('booking-jam-selesai').value;
    if (!tgl || !ruang || !peminjam) return alert('⚠️ Tanggal, ruangan, dan peminjam wajib diisi!');

    var booking = {
      id: 'book_' + Date.now(),
      tgl: tgl, ruang: ruang, nama_peminjam: peminjam,
      jam_mulai: mulai, jam_selesai: selesai,
      status: 'pending', created_at: new Date().toISOString()
    };

    var bookings = safeGet('dreamos_bookings', []);
    bookings.push(booking);
    localStorage.setItem('dreamos_bookings', JSON.stringify(bookings));
    renderBookingList();

    if (window.supabaseClient) {
      try {
        await window.supabaseClient.from('bookings').insert(booking);
        console.log('✅ Booking tersimpan di cloud');
      } catch(e) { console.warn('⚠️ Gagal sync cloud:', e.message); }
    }

    document.getElementById('booking-ruang').value = '';
    document.getElementById('booking-peminjam').value = '';
    alert('✅ Booking tersimpan!');
  };

  window.doLogout = function() {
    localStorage.removeItem('dreamos_bound_user');
    localStorage.removeItem('dreamos_session_active');
    window.location.reload();
  };

  // SYNC ENGINE
  if (window.SyncEngine) {
    window.SyncEngine.subscribe('bookings', function() { if (canAccess('booking')) renderBookingList(); });
    window.SyncEngine.subscribe('k3_reports', function() { if (canAccess('k3')) renderK3List(); });
    window.SyncEngine.subscribe('dana_requests', function() { if (canAccess('dana')) renderDanaList(); });
    window.SyncEngine.subscribe('maintenance_tasks', function() { if (canAccess('maint')) renderMaintList(); });
  }

  // Tampilkan tab pertama yang diizinkan
  if (allowed.length > 0) {
    var firstTab = document.querySelector('#workspace-tabs .tab[style=""]');
    if (firstTab) firstTab.click();
  }

  renderAll();
})();
</script>
