<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Enterprise Ops Room • v4.5</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  /* ... (style sama seperti sebelumnya) ... */
</style>
</head>
<body>
<button class="back-btn" onclick="window.parent.goHome()">← HOME</button>

<div style="max-width:1400px; margin:0 auto; padding:3.5rem 0.8rem 5rem;">
  <!-- HEADER, KPI, TABS ... (sama seperti sebelumnya) ... -->

  <!-- ========== TAB USERS DENGAN FORM INPUT ========== -->
  <div id="tab-users" class="tab-content" style="display:none;">
    <div class="glass">
      <div class="section-title" style="color:var(--purple);">👥 MANAJEMEN USER</div>
      
      <!-- FORM TAMBAH USER -->
      <div class="glass" style="border:1px solid rgba(0,255,157,0.3); margin-bottom:1rem;">
        <h4 style="color:#00ff9d; margin:0 0 0.8rem;">➕ TAMBAH USER BARU</h4>
        <div style="display:grid; gap:0.5rem;">
          <input type="text" id="new-nama" class="input-field" placeholder="Nama Lengkap">
          <input type="email" id="new-email" class="input-field" placeholder="Email">
          <select id="new-role" class="input-field">
            <option value="staff">Staff</option>
            <option value="security">Security</option>
            <option value="janitor">Janitor</option>
            <option value="maintenance">Maintenance</option>
            <option value="koord">Koordinator</option>
            <option value="kabag">Kabag</option>
          </select>
          <input type="password" id="new-password" class="input-field" placeholder="Password (min 6 karakter)">
          <button class="btn btn-primary" onclick="addUserWithForm()" style="width:100%;">✅ SIMPAN USER</button>
          <div id="form-msg" style="font-size:0.7rem; margin-top:0.3rem;"></div>
        </div>
      </div>

      <!-- DAFTAR USER -->
      <div class="action-row">
        <button class="btn btn-warning" onclick="printUserList()">🖨️ Cetak</button>
        <button class="btn btn-success" onclick="syncUsersToSupabase()">☁️ Sync ke Cloud</button>
      </div>
      <div id="user-table" class="loading-text">Memuat...</div>
    </div>
  </div>

  <!-- Tab lainnya ... -->
</div>

<script>
(function() {
  'use strict';

  var SEC = window.DreamSec || window.parent.DreamSec || {
    sanitize: function(s) { return String(s || '').replace(/[&<>"']/g, function(m) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); },
    getCurrentUser: function() { try { return JSON.parse(localStorage.getItem('dreamos_bound_user') || 'null'); } catch(e) { return null; } },
    getCurrentRole: function() { var u = this.getCurrentUser(); return u ? u.role : 'staff'; },
    canAccess: function() { return true; },
    auditLog: function(a, d) { var logs = JSON.parse(localStorage.getItem('dreamos_audit_logs') || '[]'); logs.unshift({ time: new Date().toISOString(), user: 'System', role: 'admin', action: a, details: d || '' }); if (logs.length > 100) logs.pop(); localStorage.setItem('dreamos_audit_logs', JSON.stringify(logs)); },
    hashPassword: async function(p) { var e = new TextEncoder(); var h = await crypto.subtle.digest('SHA-256', e.encode(p + 'dreamos_salt_2026')); return Array.from(new Uint8Array(h)).map(function(b) { return b.toString(16).padStart(2, '0'); }).join(''); }
  };

  // ... (semua fungsi renderAll, renderKPIs, renderCharts, dll. sama seperti sebelumnya) ...

  // ========== FUNGSI TAMBAH USER DENGAN FORM ==========
  window.addUserWithForm = async function() {
    var nama = document.getElementById('new-nama').value.trim();
    var email = document.getElementById('new-email').value.trim();
    var role = document.getElementById('new-role').value;
    var password = document.getElementById('new-password').value;
    var msg = document.getElementById('form-msg');

    if (!nama || !email || !password) {
      msg.textContent = '⚠️ Semua field wajib diisi!';
      msg.style.color = '#ef4444';
      return;
    }
    if (password.length < 6) {
      msg.textContent = '⚠️ Password minimal 6 karakter!';
      msg.style.color = '#ef4444';
      return;
    }

    var users = safeGet('dreamos_users_db', []);
    if (users.find(function(u) { return u.email === email; })) {
      msg.textContent = '⚠️ Email sudah terdaftar!';
      msg.style.color = '#ef4444';
      return;
    }

    try {
      var hashed = await SEC.hashPassword(password);
      users.push({
        nama: nama,
        email: email,
        role: role,
        password_hash: hashed,
        device_dna: '',
        created_at: new Date().toISOString()
      });
      localStorage.setItem('dreamos_users_db', JSON.stringify(users));
      
      // Sync ke Supabase
      syncUserToCloud({ nama, email, role, password_hash: hashed });
      
      // Reset form
      document.getElementById('new-nama').value = '';
      document.getElementById('new-email').value = '';
      document.getElementById('new-password').value = '';
      
      msg.textContent = '✅ ' + nama + ' berhasil ditambahkan!';
      msg.style.color = '#10b981';
      
      renderUserTable();
      SEC.auditLog('ADD_USER', nama + ' (' + email + ')');
    } catch(e) {
      msg.textContent = '❌ Error: ' + e.message;
      msg.style.color = '#ef4444';
    }
  };

  // Sync satu user ke Supabase
  function syncUserToCloud(user) {
    if (!window.DREAMOS_CONFIG) return;
    var SUPABASE_URL = window.DREAMOS_CONFIG.supabaseUrl;
    var SUPABASE_KEY = window.DREAMOS_CONFIG.supabaseKey;
    
    fetch(SUPABASE_URL + '/rest/v1/users', {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(user)
    }).then(function(res) {
      if (res.ok) console.log('✅ Synced to Supabase');
    }).catch(function(e) {
      console.error('Sync error:', e);
    });
  }

  // Sync semua user ke Supabase
  window.syncUsersToSupabase = function() {
    var users = safeGet('dreamos_users_db', []);
    if (!window.DREAMOS_CONFIG) {
      alert('⚠️ Config Supabase tidak ditemukan');
      return;
    }
    
    var count = 0;
    users.forEach(function(u) {
      syncUserToCloud(u);
      count++;
    });
    
    alert('✅ ' + count + ' user sedang disync ke cloud!');
  };

  // ... (fungsi lainnya) ...

})();
</script>
</body>
</html>
