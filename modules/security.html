
<script>

if (!window.supabaseClient && window.parent && window.parent.supabaseClient) 
  window.supabaseClient = window.parent.supabaseClient;

<style>:root{--neon:#00ff9d;--accent:#0ea5e9;--warning:#e11d48;--gold:#f59e0b}*{box-sizing:border-box}body{margin:0;background:#0a0e27;color:#e2e8f0;font-family:'Inter',sans-serif;min-height:100vh}.bk-input{width:100%;padding:.6rem;background:#020617;border:1px solid #334155;border-radius:.3rem;color:#fff;margin-bottom:.3rem}.disp-btn{padding:.6rem;border:none;border-radius:.3rem;color:#fff;cursor:pointer;font-weight:600}.sec-tab{padding:.5rem 1rem;background:rgba(30,41,59,.5);border:1px solid transparent;border-radius:.4rem;color:#94a3b8;cursor:pointer;font-size:.8rem;white-space:nowrap}.sec-tab.active{background:rgba(14,165,233,.1);border-color:#0ea5e9;color:#0ea5e9}td.sticky-name,th.sticky-name{position:sticky;left:0;background:#0f172a;z-index:1}.cell-klik{cursor:pointer;user-select:none}.cell-klik:hover{background:rgba(255,255,255,.1)!important}.cell-readonly{cursor:not-allowed;opacity:.8}.mini-stat{background:rgba(15,23,42,.6);border:1px solid rgba(255,255,255,.08);border-radius:.5rem;padding:.5rem;text-align:center}.mini-stat-val{font-size:1.2rem;font-weight:700;color:#e2e8f0}.mini-stat-label{font-size:.6rem;color:#94a3b8;margin-top:.2rem}@media print{@page{margin:1cm;size:landscape}body,html{background:#fff!important;color:#000!important}.no-print{display:none!important}.print-area{display:block!important}.print-only-header{display:block!important}.excel-table th,.excel-table td{border:1px solid #000!important;padding:4px!important;color:#000!important}.excel-table th{background-color:#e2e8f0!important;-webkit-print-color-adjust:exact}}</style>
<button onclick="window.goHome()" class="no-print" style="background:rgba(30,41,59,.9);border:1px solid var(--neon);color:var(--neon);padding:.4rem .8rem;border-radius:8px;cursor:pointer;font-weight:700;font-size:.7rem;position:fixed;top:.8rem;left:.8rem;z-index:1000">← HOME</button>
<div style="padding:1rem;max-width:1400px;margin:0 auto;padding-top:3.5rem" id="security-app">
<div class="no-print" style="margin-bottom:1rem"><h2 style="color:var(--accent);margin:0;font-size:1.4rem">🛡️ Security Ops Center Pro</h2><p style="color:#64748b;font-size:.75rem">ISO 27001 • Bank-Grade Security</p><div id="sec-access-status" style="background:rgba(245,158,11,.1);border:1px solid #f59e0b;color:#f59e0b;padding:.5rem;border-radius:.5rem;font-size:.75rem;margin-top:.5rem;text-align:center">⏳ Verifikasi Device DNA & Hak Akses...</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-top:.8rem"><div class="mini-stat"><div class="mini-stat-val" id="stat-total-log">0</div><div class="mini-stat-label">Total Log</div></div><div class="mini-stat"><div class="mini-stat-val" id="stat-urgent">0</div><div class="mini-stat-label" style="color:#ef4444">Urgent</div></div><div class="mini-stat"><div class="mini-stat-val" id="stat-petugas">0</div><div class="mini-stat-label">Petugas Aktif</div></div><div class="mini-stat"><div class="mini-stat-val" id="sec-live-clock">--:--</div><div class="mini-stat-label">Waktu</div></div></div></div>
<div class="no-print" style="display:flex;gap:.5rem;margin-bottom:1rem;overflow-x:auto;padding-bottom:.5rem;border-bottom:1px solid #334155"><button class="sec-tab active" data-target="tab-jadwal">📅 Jadwal</button><button class="sec-tab" data-target="tab-input-log">📝 Serah Terima</button><button class="sec-tab" data-target="tab-report">📊 Laporan</button><button class="sec-tab" data-target="tab-bridge">🚨 Slide</button></div>
<div id="tab-jadwal" class="sec-panel no-print">...</div>

<div id="tab-report" class="sec-panel print-area" style="display:none">...</div>
<div id="tab-bridge" class="sec-panel no-print" style="display:none">...</div>
</div>
<script>
(function(){'use strict';let isDanru=false;const u=JSON.parse(localStorage.getItem('dreamos_bound_user')||'null');const role=u?u.role||'staff':'staff';function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;')}
async function dna(){try{const c=document.createElement('canvas');const x=c.getContext('2d');x.textBaseline='top';x.font="14px 'Arial'";x.fillStyle='#f60';x.fillRect(125,1,62,20);x.fillStyle='#069';x.fillText('DreamOS',2,15);const m=[navigator.hardwareConcurrency||0,screen.colorDepth,c.toDataURL()].join('|');const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(m));return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('').substring(0,16)}catch(e){return'UNKNOWN'}}
async function check(){const s=document.getElementById('sec-access-status');const a=document.getElementById('admin-controls');if(!u){s.innerHTML='🔒 Silakan login';return}if(['dev','kabag_umum','koordinator_umum'].includes(role)){isDanru=true;s.innerHTML='🔓 Admin Mode';s.style.color='#10b981';s.style.borderColor='#10b981';if(a)a.style.display='flex';return}if(role==='security'||role==='komandan_regu'){try{const d=await dna();if(window.supabaseClient){const{data:db}=await window.supabaseClient.from('users').select('device_dna').eq('email',u.email).single();if(db&&db.device_dna===d){isDanru=true;s.innerHTML='🔓 Danru Mode';s.style.color='#10b981';s.style.borderColor='#10b981';if(a)a.style.display='flex';return}}const udb=JSON.parse(localStorage.getItem('dreamos_users_db')||'[]');const lu=udb.find(x=>x.email===u.email);if(lu&&lu.device_dna===d){isDanru=true;s.innerHTML='🔓 Danru Mode (Local)';s.style.color='#10b981';s.style.borderColor='#10b981';if(a)a.style.display='flex';return}}catch(e){}s.innerHTML='🔒 Device tidak terdaftar';s.style.color='#f59e0b'}else{s.innerHTML='🔒 Role: '+role;s.style.color='#ef4444'}}
function stats(){const l=JSON.parse(localStorage.getItem('dreamos_piket_logs')||'[]');document.getElementById('stat-total-log').textContent=l.length;document.getElementById('stat-urgent').textContent=l.filter(x=>x.stat==='URGENT/KEJADIAN').length;document.getElementById('stat-petugas').textContent=new Set(l.map(x=>x.petugas)).size;document.getElementById('sec-live-clock').textContent=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}
function init(){let m=JSON.parse(localStorage.getItem('dreamos_matrix')||'[]');if(!m.length){const s=[{n:"SUDARSONO",s:["L","L","P","P","M","M","L","L","P","P","M","M","L","L","P","P","M","M","L","L","P","P","M","M","L","L","P","P","M","M","L"]},{n:"MARHUSIN",s:["M","M","L","L","P","P","M","M","L","L","P","P","M","M","L","L","P","P","M","M","L","L","P","P","M","M","L","L","P","P","M"]},{n:"HERIYATNO",s:["L","P","P","M","M","L","L","P","P","M","M","L","L","P","P","M","M","L","L","P","P","M","M","L","L","P","P","M","M","L","P"]},{n:"SUNARKO",s:["P","M","M","L","L","P","P","M","M","L","L","P","P","M","M","L","L","P","P","M","M","L","L","P","P","M","M","L","L","P","P"]},{n:"HARIYANSAHC",s:["P","P","M","M","L","L","P","P","M","M","L","L","P","P","M","M","L","L","P","P","M","M","L","L","P","P","M","M","L","L","P"]},{n:"AGUS SUTISNA",s:["M","L","L","P","P","M","M","L","L","P","P","M","M","L","L","CT","CT","CT","CT","CT","CT","P","P","M","M","L","L","P","P","M","M"]},{n:"DONIH",s:["P","P","P","P","P","P","P","P","P","P","P","P","P","P","P","P","P","P","P","P","P","P","P","P","P","P","P","P","P","P","P"]}];s.forEach(r=>{r.s.forEach((sh,i)=>{m.push({nama:r.n,tgl:i+1,shift:sh,periode:'2026-07'})})});localStorage.setItem('dreamos_matrix',JSON.stringify(m))}}
function slide(){const n=new Date();const p=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');const m=JSON.parse(localStorage.getItem('dreamos_matrix')||'[]');const t=m.filter(x=>x.periode===p&&parseInt(x.tgl)===n.getDate());const pg=t.filter(x=>x.shift==='P').map(x=>"Sdr. "+x.nama);const ml=t.filter(x=>x.shift==='M').map(x=>"Sdr. "+x.nama);const txt=(pg.length?"☀️ SIANG: "+pg.join(", "):"")+(ml.length?" | 🌙 MALAM: "+ml.join(", "):"")||"Tidak ada jadwal";const si=document.getElementById('slide-petugas');if(si)si.value=txt;localStorage.setItem('dreamos_sec_today',txt);if(typeof window.renderDashboard==='function')window.renderDashboard()}
window.renderMatrix=function(){const pe=document.getElementById('m-period');if(!pe)return;const p=pe.value;if(!p)return;const pt=p.split('-');const dim=new Date(pt[0],pt[1],0).getDate();let h='<th class="sticky-name">Nama</th>';for(let i=1;i<=dim;i++)h+='<th>'+i+'</th>';document.getElementById('matrix-head').innerHTML=h;const m=JSON.parse(localStorage.getItem('dreamos_matrix')||'[]');const b=document.getElementById('matrix-body');b.innerHTML='';const names=[...new Set(m.map(x=>x.nama))];const cc=isDanru?'cell-klik':'cell-readonly';const ca=isDanru?'onclick="toggleShift(this)"':'';names.forEach(n=>{let r='<tr><td class="sticky-name">'+esc(n)+'</td>';for(let i=1;i<=dim;i++){const s=m.find(x=>x.nama===n&&parseInt(x.tgl)===i&&x.periode===p);const sh=s?s.shift:'';const bg=sh==='L'?'color:#0ea5e9':sh==='P'?'color:#10b981':sh==='M'?'color:#ef4444':sh==='CT'?'color:#eab308;font-weight:bold':'';r+='<td class="'+cc+'" data-nama="'+esc(n)+'" data-tgl="'+i+'" '+ca+' style="'+bg+'">'+esc(sh)+'</td>'}b.innerHTML+=r+'</tr>'});slide();stats()};
window.toggleShift=function(el){if(!isDanru)return alert('⛔ Akses Ditolak!');const n=el.dataset.nama;const t=parseInt(el.dataset.tgl);const p=document.getElementById('m-period').value;const m=JSON.parse(localStorage.getItem('dreamos_matrix')||'[]');const idx=m.findIndex(x=>x.nama===n&&parseInt(x.tgl)===t&&x.periode===p);const cy=['L','P','M','CT'];if(idx>-1){const ni=cy.indexOf(m[idx].shift)+1;if(ni>=cy.length)m.splice(idx,1);else m[idx].shift=cy[ni]}else m.push({nama:n,tgl:t,shift:'L',periode:p});localStorage.setItem('dreamos_matrix',JSON.stringify(m));if(window.supabaseClient&&window.OfflineQueue)window.OfflineQueue.add('security_matrix','upsert',{nama:n,tgl:t,shift:m[idx]?.shift||'',periode:p});renderMatrix()};
function rlogs(){const l=JSON.parse(localStorage.getItem('dreamos_piket_logs')||'[]');const f=document.getElementById('filter-shift-report')?.value||'all';const fl=f==='all'?l:l.filter(x=>x.shift===f);document.getElementById('lap-table').innerHTML=fl.map((x,i)=>'<tr><td>'+(fl.length-i)+'</td><td>'+esc(x.tanggal)+'<br><b>'+esc(x.jam)+'</b></td><td>'+esc(x.shift)+'<br><i>'+esc(x.pos)+'</i></td><td><b>D:</b> '+esc(x.petugas)+'<br><b>K:</b> '+esc(x.penerima)+'</td><td>'+esc(x.teks)+'</td><td style="color:'+(x.stat==='URGENT/KEJADIAN'?'red':'green')+'">'+esc(x.stat)+'</td><td>P:'+esc(x.ttd_penyerah||'-')+'<br>K:'+esc(x.ttd_penerima||'-')+'</td></tr>').join('')}
document.querySelectorAll('.sec-tab').forEach(b=>{b.addEventListener('click',function(){document.querySelectorAll('.sec-tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.sec-panel').forEach(p=>p.style.display='none');this.classList.add('active');const t=document.getElementById(this.dataset.target);if(t)t.style.display='block'})});
document.getElementById('security-app').addEventListener('click',function(e){const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;if(a==='add-name'){if(!isDanru)return alert('⛔ Akses Ditolak!');const n=document.getElementById('new-name').value.trim().toUpperCase();if(!n)return;const m=JSON.parse(localStorage.getItem('dreamos_matrix')||'[]');m.push({nama:n,tgl:1,shift:'',periode:document.getElementById('m-period').value});localStorage.setItem('dreamos_matrix',JSON.stringify(m));document.getElementById('new-name').value='';renderMatrix()}else if(a==='save-laporan-pro'){const l=JSON.parse(localStorage.getItem('dreamos_piket_logs')||'[]');const n=new Date();const nl={tanggal:n.toLocaleDateString('id-ID'),jam:n.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}),petugas:esc(document.getElementById('lap-petugas').value.substring(0,100))||'Anonim',penerima:esc(document.getElementById('lap-penerima').value.substring(0,100))||'Regu',shift:esc(document.getElementById('lap-shift').value.substring(0,50)),pos:esc(document.getElementById('lap-pos').value.substring(0,50)),stat:esc(document.getElementById('lap-stat').value.substring(0,50)),teks:esc(document.getElementById('lap-teks').value.substring(0,500)),ttd_penyerah:esc(document.getElementById('ttd-penyerah').value.substring(0,100)),ttd_penerima:esc(document.getElementById('ttd-penerima').value.substring(0,100))};l.unshift(nl);localStorage.setItem('dreamos_piket_logs',JSON.stringify(l));if(window.supabaseClient){if(navigator.onLine)window.supabaseClient.from('security_logs').insert(nl).then(()=>{}).catch(()=>{});else if(window.OfflineQueue)window.OfflineQueue.add('security_logs','insert',nl)}document.getElementById('lap-teks').value='';stats();rlogs();alert('✅ Tersimpan!');document.querySelector('[data-target="tab-report"]')?.click()}else if(a==='set-slide'){localStorage.setItem('dreamos_sec_today',document.getElementById('slide-petugas').value);if(typeof window.renderDashboard==='function')window.renderDashboard();alert('✅ Slide Updated!')}});
document.getElementById('m-period').addEventListener('change',renderMatrix);
document.getElementById('filter-shift-report')?.addEventListener('change',rlogs);
const n=new Date();document.getElementById('m-period').value=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');
init();check().then(()=>{renderMatrix();rlogs();stats();slide()});setInterval(stats,30000);
if(window.SyncEngine&&window.supabaseClient)window.SyncEngine.subscribe('security_logs',()=>{rlogs();stats()});
console.log('🛡️ Security Ops Center Ready');})();
</script>
