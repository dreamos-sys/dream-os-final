<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Security Ops Center Pro • Dream OS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0a0e27; --panel:rgba(15,23,42,0.95); --border:rgba(0,255,157,0.2);
      --neon:#00ff9d; --accent:#0ea5e9; --gold:#f59e0b; --danger:#ef4444;
      --text:#e2e8f0; --muted:#94a3b8;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:.875rem;padding-bottom:90px}
    .glass{background:var(--panel);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:14px;padding:1.25rem;margin-bottom:1rem}
    .header{padding:1rem;margin-bottom:1.5rem;border-bottom:2px solid var(--border)}
    .header h1{color:var(--neon);font-size:1.5rem;margin-bottom:.25rem}
    .header-meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
    .user-badge{background:rgba(0,255,157,.1);border:1px solid var(--neon);padding:.35rem .75rem;border-radius:8px;font-size:.8125rem;font-weight:600}
    .mode-badge{background:rgba(245,158,11,.15);border:1px solid var(--gold);padding:.5rem .75rem;border-radius:10px;font-size:.8125rem;color:var(--gold);font-weight:600;display:flex;align-items:center;gap:.4rem}
    .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.75rem;margin-bottom:1.5rem}
    .metric{background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:12px;padding:1rem;text-align:center}
    .metric-val{font-size:1.75rem;font-weight:800;color:var(--neon)}
    .metric-label{font-size:.75rem;color:var(--muted);text-transform:uppercase;margin-top:.25rem}
    .btn{min-height:44px;padding:.6rem 1rem;border:none;border-radius:10px;font-weight:600;font-size:.875rem;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem}
    .btn-primary{background:var(--accent);color:#fff}
    .btn-success{background:var(--neon);color:#0a0e27}
    .btn-warning{background:var(--gold);color:#1a1205}
    .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
    .btn-sm{padding:.5rem .75rem;font-size:.8125rem;min-height:38px}
    .toolbar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
    .matrix-container{overflow-x:auto;margin-top:1rem}
    .matrix-table{width:100%;border-collapse:collapse;font-size:.8125rem}
    .matrix-table th,.matrix-table td{border:1px solid rgba(255,255,255,.1);padding:.5rem;text-align:center;min-width:45px}
    .matrix-table th{background:rgba(0,0,0,.4);color:var(--accent);font-weight:700}
    .matrix-table td{cursor:pointer;transition:all .2s}
    .matrix-table td:hover{background:rgba(0,255,157,.1)}
    .matrix-table td.readonly{cursor:not-allowed;opacity:.7}
    .cell-L{color:#3b82f6;font-weight:700}
    .cell-P{color:#10b981;font-weight:700}
    .cell-M{color:#ef4444;font-weight:700}
    .cell-CT{color:#f59e0b;font-weight:700}
    .cell-empty{color:var(--muted)}
    .personil-input{margin-bottom:1rem;display:flex;gap:.5rem;flex-wrap:wrap}
    .personil-input input{flex:1;min-width:200px;padding:.75rem;background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.875rem}
    .back-btn{position:fixed;bottom:1.5rem;left:1rem;z-index:200;background:rgba(15,23,42,.95);border:1px solid var(--neon);color:var(--neon);padding:.65rem 1.1rem;border-radius:10px;font-weight:700;font-size:.85rem;cursor:pointer}
    .toast{position:fixed;bottom:5rem;right:1rem;background:var(--panel);border-left:4px solid var(--success);padding:.85rem 1.1rem;border-radius:8px;animation:slideIn .3s ease;z-index:9999}
    @keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:none;opacity:1}}
    @media(max-width:640px){.metrics{grid-template-columns:repeat(2,1fr)}.matrix-table{font-size:.75rem}}
  </style>
</head>
<body>
  <button class="back-btn" onclick="goHome()">← HOME</button>

  <div class="header">
    <h1>🛡️ Security Ops Center Pro</h1>
    <div class="header-meta">
      <div class="user-badge" id="user-badge">Loading...</div>
      <div class="mode-badge" id="mode-badge">🔓 Mode Anggota (View Only)</div>
    </div>
  </div>

  <div class="glass">
    <div class="metrics">
      <div class="metric"><div class="metric-val" id="total-log">0</div><div class="metric-label">Total Log</div></div>
      <div class="metric"><div class="metric-val" id="urgent-count">0</div><div class="metric-label">Urgent</div></div>
      <div class="metric"><div class="metric-val" id="active-petugas">0</div><div class="metric-label">Petugas Aktif</div></div>
      <div class="metric"><div class="metric-val" id="month-count">0</div><div class="metric-label">Bulan Ini</div></div>
    </div>

    <div class="toolbar">
      <button class="btn btn-primary" onclick="showJadwalMatriks()"> Jadwal Matriks</button>
      <button class="btn btn-outline" onclick="showInputSerahTerima()">📝 Input Serah Terima</button>
      <button class="btn btn-outline" onclick="showBulanan()"> Laporan Bulanan</button>
    </div>
  </div>

  <div id="content-area">
    <!-- Content will be loaded here -->
  </div>

  <script>
    // ===== GLOBAL STATE =====
    window.currentUser = JSON.parse(localStorage.getItem('dreamos_bound_user') || '{}');
    window.userRole = window.currentUser.role || 'staff';
    window.canEdit = ['dev', 'komandan_regu'].includes(window.userRole);
    window.currentMonth = new Date().getMonth();
    window.currentYear = new Date().getFullYear();
    window.scheduleData = {};
    window.personilList = [];

    // ===== NAVIGATION =====
    window.goHome = function() {
      try {
        if (window.parent && typeof window.parent.goHome === 'function') window.parent.goHome();
        else if (typeof window.goHome === 'function') window.goHome();
        else window.location.href = '../index.html';
      } catch(e) { window.location.href = '../index.html'; }
    };

    // ===== INIT =====
    function init() {
      document.getElementById('user-badge').textContent = window.currentUser.nama || window.currentUser.email || 'User';
      
      if (window.canEdit) {
        document.getElementById('mode-badge').innerHTML = ' Mode Danru: ' + (window.currentUser.nama || window.currentUser.email) + ' (Edit Jadwal Penuh)';
        document.getElementById('mode-badge').style.background = 'rgba(0,255,157,.15)';
        document.getElementById('mode-badge').style.borderColor = 'var(--neon)';
      }
      
      loadScheduleData();
      loadPersonilList();
      showJadwalMatriks();
      updateMetrics();
      setupAutoTriggers();
    }

    // ===== AUTO-TRIGGERS (Slide #1, Serah Terima, etc) =====
    function setupAutoTriggers() {
      // 1. Trigger Slide #1 (5 detik sekali)
      setInterval(() => {
        const slide1 = document.getElementById('slide-1');
        if (slide1) slide1.innerHTML = '<strong>🚨 Waktu Serah Terima Shift</strong><br>Harap lakukan serah terima shift di modul Security.';
      }, 5000);

      // 2. Serah Terima Otomatis Jam 07:00 & 19:00 WIB
      setInterval(() => {
        const now = new Date();
        const hour = now.getHours();
        const minutes = now.getMinutes();
        const isMorning = hour === 7 && minutes >= 0 && minutes < 3;
        const isEvening = hour === 19 && minutes >= 0 && minutes < 3;

        if (isMorning || isEvening) {
          showToast(`⏰ Serah Terima Shift ${isMorning ? 'Pagi' : 'Malam'}! Harap lakukan di modul Security.`, 'warning');
          if (window.PhantomAlerter) PhantomAlerter.trigger('SHIFT_HANDOVER_' + (isMorning ? 'MORNING' : 'EVENING'));
        }
      }, 60000);

      // 3. Laporan 24/7 Windows Excel
      document.getElementById('laporan-excel').addEventListener('click', () => {
        if (window.jspdf && window.jspdf.jsPDF) {
          const pdf = new window.jspdf.jsPDF();
          pdf.text('Laporan Keamanan 24/7', 10, 10);
          pdf.save('laporan_keamanan.pdf');
        }
      });
    }

    // ===== LOAD DATA FROM SUPABASE & LOCAL =====
    async function loadScheduleData() {
      const key = 'dreamos_security_schedule_' + window.currentYear + '_' + (window.currentMonth + 1);
      window.scheduleData = JSON.parse(localStorage.getItem(key) || '{}');
      
      // Try to load from Supabase if available
      if (window.supabaseClient) {
        try {
          const { data, error } = await window.supabaseClient
            .from('security_schedule')
            .select('*')
            .eq('year', window.currentYear)
            .eq('month', window.currentMonth + 1);
          
          if (!error && data && data.length > 0) {
            window.scheduleData = data[0].schedule_data || {};
            localStorage.setItem(key, JSON.stringify(window.scheduleData));
          }
        } catch(e) {
          console.warn('Failed to load from Supabase:', e);
        }
      }
    }

    async function loadPersonilList() {
      // 1. Cek apakah ada daftar personil yang disimpan manual
      const savedPersonil = JSON.parse(localStorage.getItem('dreamos_security_personil') || 'null');
      if (savedPersonil && Array.isArray(savedPersonil) && savedPersonil.length > 0) {
        window.personilList = savedPersonil.sort();
        return;
      }

      // 2. Ambil SEMUA user dari database agar TIDAK ADA yang hilang dari matriks
      const users = JSON.parse(localStorage.getItem('dreamos_users_db') || '[]');
      
      window.personilList = users
        .map(u => u.nama || u.email.split('@')[0])
        .filter((v, i, a) => a.indexOf(v) === i) // ambil nama unik
        .sort();
      
      // 3. Jika kosong, coba ambil SEMUA dari Supabase
      if (window.personilList.length === 0 && window.supabaseClient) {
        try {
          const { data, error } = await window.supabaseClient
            .from('users')
            .select('nama, email');
          
          if (!error && data) {
            window.personilList = data.map(u => u.nama || u.email.split('@')[0])
              .filter((v, i, a) => a.indexOf(v) === i).sort();
          }
        } catch(e) {
          console.warn('Failed to load personil from Supabase:', e);
        }
      }
      
      // 4. Fallback: gunakan data lengkap jika masih kosong (termasuk Pak Hanung & Pak Erwin)
      if (window.personilList.length === 0) {
        window.personilList = [
          'SUDARSONO', 'MARHUSIN', 'HERIYATNO', 'SUNARKO', 
          'HARIYANSAHC', 'AGUS SUTISNA', 'DONIH', 
          'HANUNG BUDIANTO, S.E.', 'ERWINSYAH'
        ];
      }
    }

    // ===== DISPLAY FUNCTIONS =====
    window.showJadwalMatriks = function() {
      const content = document.getElementById('content-area');
      const monthNames = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
      
      let html = '<div class="glass">';
      html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem">';
      html += '<h2 style="color:var(--accent);margin:0">📅 Matriks Jadwal Shift</h2>';
      html += '<div style="display:flex;gap:.5rem;align-items:center">';
      html += '<select id="month-select" onchange="changeMonth()" style="padding:.5rem;background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:8px;color:var(--text)">';
      monthNames.forEach((m, i) => {
        html += '<option value="' + i + '"' + (i === window.currentMonth ? ' selected' : '') + '>' + m + ' ' + window.currentYear + '</option>';
      });
      html += '</select>';
      html += '<button class="btn btn-outline btn-sm" onclick="prevMonth()">◀</button>';
      html += '<button class="btn btn-outline btn-sm" onclick="nextMonth()">▶</button>';
      html += '</div></div>';
      
      // Add personil input (only for dev & komandan_regu)
      if (window.canEdit) {
        html += '<div class="personil-input">';
        html += '<input type="text" id="new-personil" placeholder="+ Tambah Nama Personil">';
        html += '<button class="btn btn-success" onclick="addPersonil()">+ Tambah</button>';
        html += '</div>';
        html += '<p style="font-size:.8125rem;color:var(--muted);margin-bottom:1rem">Klik kotak: L (Libur) → P (Pagi) → M (Malam) → CT (Cuti) → Hapus</p>';
      } else {
        html += '<p style="font-size:.8125rem;color:var(--gold);margin-bottom:1rem">🔒 Mode View Only - Hubungi Danru untuk edit jadwal</p>';
      }
      
      // Generate matrix table
      html += '<div class="matrix-container">';
      html += '<p style="font-size:.8125rem;color:var(--muted);margin-bottom:.5rem">📱 Putar HP ke landscape untuk melihat tabel lebih leluasa</p>';
      html += '<table class="matrix-table">';
      html += '<thead><tr><th>Nama</th>';
      
      // Days header
      const daysInMonth = new Date(window.currentYear, window.currentMonth + 1, 0).getDate();
      for (let d = 1; d <= daysInMonth; d++) {
        html += '<th>' + d + '</th>';
      }
      html += '</tr></thead><tbody>';
      
      // Personil rows
      window.personilList.forEach(personil => {
        html += '<tr><td style="font-weight:700;text-align:left;padding-left:.5rem">' + personil + '</td>';
        for (let d = 1; d <= daysInMonth; d++) {
          const cellKey = personil + '_' + d;
          const cellValue = window.scheduleData[cellKey] || '';
          const cellClass = 'cell-' + (cellValue || 'empty');
          const readonly = window.canEdit ? '' : 'readonly';
          html += '<td class="' + cellClass + ' ' + readonly + '" onclick="toggleShift(\'' + personil + '\',' + d + ')" data-key="' + cellKey + '">' + (cellValue || '-') + '</td>';
        }
        html += '</tr>';
      });
      
      html += '</tbody></table></div>';
      
      // Save button (only for dev & komandan_regu)
      if (window.canEdit) {
        html += '<div style="margin-top:1rem;display:flex;gap:.5rem">';
        html += '<button class="btn btn-success" onclick="saveSchedule()">💾 Simpan Jadwal</button>';
        html += '<button class="btn btn-outline" onclick="loadScheduleData()">🔄 Reload</button>';
        html += '</div>';
      }
      
      html += '</div>';
      content.innerHTML = html;
    };

    // ===== SHIFT TOGGLE FUNCTION =====
    window.toggleShift = function(personil, day) {
      if (!window.canEdit) {
        showToast('⛔ Akses Ditolak: Hanya Danru yang bisa edit jadwal', 'warn');
        return;
      }
      
      const cellKey = personil + '_' + day;
      const shifts = ['', 'L', 'P', 'M', 'CT'];
      const currentValue = window.scheduleData[cellKey] || '';
      const currentIndex = shifts.indexOf(currentValue);
      const nextIndex = (currentIndex + 1) % shifts.length;
      const nextValue = shifts[nextIndex];
      
      if (nextValue === '') {
        delete window.scheduleData[cellKey];
      } else {
        window.scheduleData[cellKey] = nextValue;
      }
      
      // Update UI immediately
      const cell = document.querySelector('[data-key="' + cellKey + '"]');
      if (cell) {
        cell.textContent = nextValue || '-';
        cell.className = 'cell-' + (nextValue || 'empty');
      }
    };

    // ===== SAVE WITH CONFIRMATION =====
    window.saveSchedule = async function() {
      if (!window.canEdit) {
        showToast('⛔ Akses Ditolak', 'danger');
        return;
      }
      
      // Confirmation dialog
      const confirmed = confirm('⚠️ KONFIRMASI PENYIMPATAN\n\nAnda yakin ingin menyimpan jadwal piket bulan ini?\n\nPerubahan akan tersimpan dan tidak dapat dibatalkan.\n\nKlik OK untuk melanjutkan, atau Cancel untuk batal.');
      
      if (!confirmed) {
        showToast('❌ Penyimpanan dibatalkan', 'warn');
        return;
      }
      
      try {
        // Save to localStorage
        const key = 'dreamos_security_schedule_' + window.currentYear + '_' + (window.currentMonth + 1);
        localStorage.setItem(key, JSON.stringify(window.scheduleData));
        
        // Save to Supabase
        if (window.supabaseClient) {
          const { data: existing } = await window.supabaseClient
            .from('security_schedule')
            .select('id')
            .eq('year', window.currentYear)
            .eq('month', window.currentMonth + 1)
            .single();
          
          const record = {
            year: window.currentYear,
            month: window.currentMonth + 1,
            schedule_data: window.scheduleData,
            updated_by: window.currentUser.email,
            updated_at: new Date().toISOString()
          };
          
          if (existing) {
            await window.supabaseClient.from('security_schedule').update(record).eq('id', existing.id);
          } else {
            await window.supabaseClient.from('security_schedule').insert(record);
          }
        }
        
        showToast('✅ Jadwal berhasil disimpan!', 'success');
        logActivity('SAVE_SCHEDULE', 'Jadwal bulan ' + (window.currentMonth + 1) + '/' + window.currentYear);
        
      } catch(e) {
        console.error('Save failed:', e);
        showToast('⚠️ Jadwal tersimpan lokal (gagal sync ke cloud)', 'warn');
      }
    };

    // ===== PERSONIL MANAGEMENT =====
    window.addPersonil = function() {
      if (!window.canEdit) return;
      
      const input = document.getElementById('new-personil');
      const nama = input.value.trim().toUpperCase();
      
      if (!nama) {
        showToast('⚠️ Nama personil tidak boleh kosong', 'warn');
        return;
      }
      
      if (window.personilList.includes(nama)) {
        showToast('️ Personil sudah ada dalam daftar', 'warn');
        return;
      }
      
      window.personilList.push(nama);
      window.personilList.sort();
      
      // Save to localStorage
      localStorage.setItem('dreamos_security_personil', JSON.stringify(window.personilList));
      
      input.value = '';
      showJadwalMatriks();
      showToast('✅ Personil ' + nama + ' berhasil ditambahkan', 'success');
    };

    // ===== MONTH NAVIGATION =====
    window.changeMonth = function() {
      const select = document.getElementById('month-select');
      window.currentMonth = parseInt(select.value);
      loadScheduleData();
      showJadwalMatriks();
    };

    window.prevMonth = function() {
      window.currentMonth--;
      if (window.currentMonth < 0) {
        window.currentMonth = 11;
        window.currentYear--;
      }
      loadScheduleData();
      showJadwalMatriks();
    };

    window.nextMonth = function() {
      window.currentMonth++;
      if (window.currentMonth > 11) {
        window.currentMonth = 0;
        window.currentYear++;
      }
      loadScheduleData();
      showJadwalMatriks();
    };

    // ===== METRICS =====
    function updateMetrics() {
      const logs = JSON.parse(localStorage.getItem('dreamos_security_logs') || '[]');
      const today = new Date().toISOString().split('T')[0];
      const thisMonth = today.substring(0, 7);
      
      const totalLogs = logs.length;
      const urgentLogs = logs.filter(l => l.priority === 'URGENT' || l.priority === 'KEJADIAN').length;
      const todayLogs = logs.filter(l => l.tanggal === today).length;
      const monthLogs = logs.filter(l => l.tanggal && l.tanggal.startsWith(thisMonth)).length;
      
      document.getElementById('total-log').textContent = totalLogs;
      document.getElementById('urgent-count').textContent = urgentLogs;
      document.getElementById('active-petugas').textContent = window.personilList.length;
      document.getElementById('month-count').textContent = monthLogs;
    }

    // ===== ACTIVITY LOG =====
    function logActivity(action, detail) {
      const logs = JSON.parse(localStorage.getItem('dreamos_activity_feed') || '[]');
      logs.unshift({
        id: 'act_' + Date.now(),
        action: action,
        detail: detail,
        user: window.currentUser.nama || window.currentUser.email,
        time: new Date().toISOString()
      });
      if (logs.length > 200) logs.length = 200;
      localStorage.setItem('dreamos_activity_feed', JSON.stringify(logs));
    }

    // ===== UTILS =====
    function showToast(msg, type) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.style.borderLeftColor = type === 'danger' ? 'var(--danger)' : (type === 'warn' ? 'var(--gold)' : 'var(--neon)');
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    // Placeholder functions for other tabs
    window.showInputSerahTerima = function() {
      document.getElementById('content-area').innerHTML = '<div class="glass"><h2>📝 Input Serah Terima</h2><p>Fitur ini dalam pengembangan...</p></div>';
    };
    
    window.showBulanan = function() {
      document.getElementById('content-area').innerHTML = '<div class="glass"><h2> Laporan Bulanan</h2><p>Fitur ini dalam pengembangan...</p></div>';
    };

    // ===== INIT ON LOAD =====
    init();
  </script>
</body>
</html>
