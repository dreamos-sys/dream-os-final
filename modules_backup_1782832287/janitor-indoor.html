<button onclick="window.parent.goHome()" style="position:fixed;top:1rem;left:1rem;background:#1e293b;border:1px solid #2dd4bf;color:#2dd4bf;padding:0.5rem 1rem;border-radius:0.5rem;cursor:pointer;z-index:100000;">← Kembali</button>

<div style="min-height:100vh; background:#040814; color:#e2e8f0; font-family:'Inter',sans-serif; padding:1rem; padding-top:3.5rem; padding-bottom:5rem;" id="janin-app">
    <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1rem;">
        <div>
            <h2 style="color:#10b981; font-size:1.3rem; font-weight:800; margin:0;">🧹 Janitor Indoor</h2>
            <p style="color:#94a3b8; font-size:0.7rem; margin:0;">Ceklis Harian • 06:30-17:00</p>
        </div>
        <button onclick="submitToCloudIndoor()" style="margin-left:auto; margin-right:0.5rem; background:#10b981; color:white; border:none; border-radius:0.5rem; cursor:pointer; font-weight:600; font-size:0.75rem; padding:0.4rem 0.8rem;">☁️ Submit</button><button onclick="cetakLaporan()" style="margin-left:0; padding:0.4rem 0.8rem; background:#6366f1; color:white; border:none; border-radius:0.5rem; cursor:pointer; font-weight:600; font-size:0.75rem;">🖨️ Cetak</button>
    </div>

    <!-- Metadata Petugas -->
    <div style="background:rgba(15,23,42,0.6); border:1px solid rgba(255,255,255,0.1); border-radius:0.75rem; padding:0.75rem; margin-bottom:0.75rem;">
        <h4 style="color:#10b981; margin:0 0 0.5rem;">👤 Petugas & Lokasi</h4>
        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:0.5rem;">
            <input type="text" id="ji-petugas" placeholder="Nama Petugas" oninput="window.state.petugas=this.value; saveMeta();" style="width:100%; padding:0.5rem; background:#0f172a; border:1px solid #334155; border-radius:0.5rem; color:#e2e8f0; font-size:0.8rem;">
            <input type="text" id="ji-gedung" placeholder="Gedung" oninput="window.state.gedung=this.value; saveMeta();" style="width:100%; padding:0.5rem; background:#0f172a; border:1px solid #334155; border-radius:0.5rem; color:#e2e8f0; font-size:0.8rem;">
            <input type="text" id="ji-lantai" placeholder="Lantai" oninput="window.state.lantai=this.value; saveMeta();" style="width:100%; padding:0.5rem; background:#0f172a; border:1px solid #334155; border-radius:0.5rem; color:#e2e8f0; font-size:0.8rem;">
        </div>
    </div>

    <!-- Tanggal & Shift -->
    <div style="background:rgba(15,23,42,0.6); border:1px solid rgba(255,255,255,0.1); border-radius:0.75rem; padding:0.75rem; margin-bottom:0.75rem; display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center;">
        <input type="date" id="ji-date" onchange="window.state.date=this.value; loadData();" style="flex:1; padding:0.5rem; background:#0f172a; border:1px solid #334155; border-radius:0.5rem; color:#e2e8f0; font-size:0.8rem;">
        <div style="display:flex; gap:0.3rem;">
            <button class="ji-shift active" id="btn-pagi" onclick="setShift('pagi')">🌅 Pagi</button>
            <button class="ji-shift" id="btn-siang" onclick="setShift('siang')">☀️ Siang</button>
            <button class="ji-shift" id="btn-sore" onclick="setShift('sore')">🌇 Sore</button>
        </div>
        <button onclick="resetShift()" style="margin-left:auto; background:#ef4444; color:white; border:none; padding:0.4rem 0.8rem; border-radius:0.5rem; cursor:pointer; font-size:0.7rem;">Reset Shift</button>
    </div>

    <!-- Checklist Container -->
    <div id="ji-checklist" style="display:flex; flex-direction:column; gap:0.75rem;"></div>
</div>

<style>
    .ji-shift { padding:0.5rem 0.8rem; border:none; border-radius:0.5rem; cursor:pointer; font-weight:600; font-size:0.75rem; background:#1e293b; color:#e2e8f0; transition:0.3s; }
    .ji-shift.active { background:#10b981; color:#000; }
    .ji-panel { background:rgba(15,23,42,0.6); border:1px solid rgba(255,255,255,0.1); border-radius:0.75rem; padding:0.75rem; }
</style>

<script src="../js/core/supabase-bridge.js"></script>
<script>
(function(){
    var AREAS = {
        toilet: { title:'🚻 Toilet', items:['Pintu Utama','Pintu Kubikal','Kaca / Cermin','Exhoust','Dinding','Tempat Wudhu','Lantai','Floor Drain','Kloset','Flapond / Ceilling','Tempat Sampah'] },        ruangan: { title:'🏢 Ruangan', items:['Loby Utama','Teras','Lorong Utama Gedung','Balkon','Pintu Utama','Pintu Kelas dan R Lain','Jendela','Kelas','Aula','Sentra Musik','Sentra Kreasi','UKS','Psikolog','Lab Kom','Lab IPA','Perpustakaan','Kepala Sekolah','R.Guru (Laki/Perempuan)','R. Pemasaran','R. Admin TU','R. Rapat','R.CEO, Direktur dan Yayasan','R. Kepala Bidang (Kabid)','R. Osis','R. Mushalla','R. Inklusi','R. Gudang Olah Raga','R. Serbaguna','R. Masjid','Kantin','Saung Besar','Saung Kecil','Pos','Gudang Umum','Tangga','Lift','Keterangan Dll'] }
    };

    window.state = {
        date: new Date().toISOString().split('T')[0],
        shift: 'pagi',
        petugas: '', gedung: '', lantai: '',
        data: {}, expanded: { toilet: true, ruangan: true },
        photoData: {}
    };

    function g(k){ try{return JSON.parse(localStorage.getItem(k)||'{}');}catch(e){return {};} }
    function s(k,d){ localStorage.setItem(k,JSON.stringify(d)); }

    window.loadData = function(){
        var all = g('dreamos_janitor_indoor');
        if(!all[state.date]) all[state.date] = { shifts:{pagi:{},siang:{},sore:{}}, photos:{}, petugas:'', gedung:'', lantai:'' };
        if(!all[state.date].shifts) all[state.date].shifts = { pagi:{}, siang:{}, sore:{} };
        if(!all[state.date].photos) all[state.date].photos = {};
        state.data = all;
        state.petugas = all[state.date].petugas || '';
        state.gedung = all[state.date].gedung || '';
        state.lantai = all[state.date].lantai || '';
        state.photoData = all[state.date].photos || {};
        document.getElementById('ji-petugas').value = state.petugas;
        document.getElementById('ji-gedung').value = state.gedung;
        document.getElementById('ji-lantai').value = state.lantai;
        document.getElementById('ji-date').value = state.date;
        updateShiftBtns();
        renderChecklist();
    };

    window.saveMeta = function(){
        if(!state.data[state.date]) state.data[state.date] = { shifts:{pagi:{},siang:{},sore:{}}, photos:{}, petugas:'', gedung:'', lantai:'' };
        state.data[state.date].petugas = state.petugas;
        state.data[state.date].gedung = state.gedung;
        state.data[state.date].lantai = state.lantai;
        s('dreamos_janitor_indoor', state.data);
    };

    window.setShift = function(sh){
        state.shift = sh;
        updateShiftBtns();
        renderChecklist();
    };

    function updateShiftBtns(){
        document.getElementById('btn-pagi').classList.toggle('active', state.shift==='pagi');
        document.getElementById('btn-siang').classList.toggle('active', state.shift==='siang');
        document.getElementById('btn-sore').classList.toggle('active', state.shift==='sore');    }

    window.toggleItem = function(area, item){
        if(!state.data[state.date].shifts[state.shift]) state.data[state.date].shifts[state.shift] = {};
        if(!state.data[state.date].shifts[state.shift][area]) state.data[state.date].shifts[state.shift][area] = {};
        state.data[state.date].shifts[state.shift][area][item] = !state.data[state.date].shifts[state.shift][area][item];
        s('dreamos_janitor_indoor', state.data);
        renderChecklist();
    };

    window.toggleExpand = function(area){
        state.expanded[area] = !state.expanded[area];
        renderChecklist();
    };

    window.uploadPhoto = function(area){
        var input = document.createElement('input');
        input.type = 'file'; input.accept = 'image/*'; input.capture = 'environment';
        input.onchange = function(e){
            var file = e.target.files[0]; if(!file) return;
            var reader = new FileReader();
            reader.onload = function(ev){
                var key = state.shift + '-' + area;
                state.data[state.date].photos[key] = ev.target.result;
                state.photoData = state.data[state.date].photos;
                s('dreamos_janitor_indoor', state.data);
                renderChecklist();
            };
            reader.readAsDataURL(file);
        };
        input.click();
    };

    window.resetShift = function(){
        if(!confirm('Reset checklist shift ' + state.shift + '?')) return;
        if(state.data[state.date] && state.data[state.date].shifts){
            state.data[state.date].shifts[state.shift] = {};
            s('dreamos_janitor_indoor', state.data);
            renderChecklist();
        }
    };

    window.renderChecklist = function(){
        var container = document.getElementById('ji-checklist');
        var html = '';
        Object.keys(AREAS).forEach(function(areaKey){
            var area = AREAS[areaKey];
            var shiftData = (state.data[state.date] && state.data[state.date].shifts[state.shift] && state.data[state.date].shifts[state.shift][areaKey]) || {};
            var checked = area.items.filter(function(it){ return shiftData[it]; }).length;
            var total = area.items.length;            var pct = Math.round((checked/total)*100);
            var col = pct===100?'#10b981':pct>=50?'#f59e0b':'#ef4444';
            var photoKey = state.shift + '-' + areaKey;
            var photo = state.photoData[photoKey];
            var isExp = state.expanded[areaKey];

            html += '<div class="ji-panel">';
            html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.3rem;">';
            html += '<div style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;" onclick="toggleExpand(\''+areaKey+'\')">';
            html += '<h4 style="color:#10b981;font-size:0.9rem;margin:0;">'+area.title+'</h4>';
            html += '<span style="font-size:0.7rem;color:#94a3b8;">'+checked+'/'+total+'</span></div>';
            html += '<div style="display:flex;align-items:center;gap:0.5rem;">';
            html += '<button onclick="uploadPhoto(\''+areaKey+'\')" style="background:rgba(59,130,246,0.2);color:#3b82f6;border:none;border-radius:0.3rem;padding:0.2rem 0.5rem;font-size:0.7rem;cursor:pointer;">'+(photo?'📸✓':'📸')+'</button>';
            html += '<div style="width:60px;height:6px;background:rgba(255,255,255,0.1);border-radius:3px;"><div style="width:'+pct+'%;height:100%;background:'+col+';border-radius:3px;transition:width 0.3s;"></div></div>';
            html += '</div></div>';
            if(photo) html += '<img src="'+photo+'" style="max-width:100%;max-height:120px;border-radius:0.5rem;margin-bottom:0.5rem;">';
            if(isExp){
                html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:0.3rem;margin-top:0.3rem;">';
                area.items.forEach(function(item){
                    var chk = shiftData[item] ? 'checked' : '';
                    var bg = shiftData[item] ? 'rgba(16,185,129,0.15)' : 'rgba(255,255,255,0.03)';
                    var safeItem = item.replace(/'/g, "\\'");
                    html += '<label style="display:flex;align-items:center;gap:0.3rem;padding:0.3rem;background:'+bg+';border-radius:0.3rem;cursor:pointer;font-size:0.75rem;">';
                    html += '<input type="checkbox" '+chk+' onchange="toggleItem(\''+areaKey+'\',\''+safeItem+'\')"> '+item+'</label>';
                });
                html += '</div>';
            }
            html += '</div>';
        });
        container.innerHTML = html;
    };

    window.cetakLaporan = function(){
        var shiftData = (state.data[state.date] && state.data[state.date].shifts[state.shift]) || {};
        var win = window.open('', '_blank', 'width=900,height=600');
        var doc = '<html><head><title>Laporan Janitor Indoor</title><style>body{font-family:sans-serif;padding:20px;color:#111;}h2,h3{text-align:center;}table{width:100%;border-collapse:collapse;margin:10px 0;}th,td{border:1px solid #000;padding:6px;text-align:left;}th{background:#eee;}.chk{color:#10b981;font-weight:bold;}.unchk{color:#ef4444;}@media print{button{display:none;}}</style></head><body>';
        doc += '<h2>LAPORAN JANITOR INDOOR</h2>';
        doc += '<p style="text-align:center;">Tanggal: '+new Date(state.date).toLocaleDateString('id-ID')+' | Shift: '+state.shift.toUpperCase()+'</p>';
        doc += '<p><strong>Petugas:</strong> '+state.petugas+' | <strong>Gedung:</strong> '+state.gedung+' | <strong>Lantai:</strong> '+state.lantai+'</p>';
        doc += '<button onclick="window.print()" style="padding:8px 16px;background:#6366f1;color:white;border:none;border-radius:4px;cursor:pointer;margin-bottom:15px;">🖨️ Cetak Laporan</button>';
        
        Object.keys(AREAS).forEach(function(areaKey){
            var area = AREAS[areaKey];
            var aData = shiftData[areaKey] || {};
            doc += '<h3>'+area.title+'</h3><table><tr><th>Item</th><th>Status</th></tr>';
            area.items.forEach(function(it){
                doc += '<tr><td>'+it+'</td><td class="'+(aData[it]?'chk':'unchk')+'">'+(aData[it]?'✅ Bersih':'❌ Belum')+'</td></tr>';
            });
            doc += '</table>';
            var pKey = state.shift+'-'+areaKey;            if(state.photoData[pKey]) doc += '<p><strong>Foto '+area.title+':</strong><br><img src="'+state.photoData[pKey]+'" style="max-width:300px;border:1px solid #ccc;border-radius:4px;"></p>';
        });
        
        doc += '<p style="margin-top:30px;text-align:right;">Mengetahui,<br><br><br>Kepala Bagian Umum</p></body></html>';
        win.document.write(doc);
        win.document.close();
    };

    
    window.submitToCloudIndoor = async function(){
        if(!state.petugas || !state.gedung) return alert('⚠️ Isi Nama Petugas dan Gedung dulu!');
        var payload = {
            id: 'ji_'+Date.now(), petugas: state.petugas, gedung: state.gedung,
            lantai: state.lantai, tanggal: state.date, shift: state.shift,
            checklist: state.data[state.date].shifts[state.shift],
            created_at: new Date().toISOString()
        };
        // 🌍 GPS Stamping
        if(window.DreamGeo) { try { var loc = await window.DreamGeo.get(); payload.gps_lat = loc.lat; payload.gps_lng = loc.lng; } catch(e){ payload.gps_lat='DENIED'; } }
        // 📦 Hybrid Sync (Offline-First)
        if(window.HybridSync) { window.HybridSync.push('janitor_indoor', payload); alert('✅ Janitor Indoor tersimpan & masuk antrian sync!'); }
        else { alert('⚠️ HybridSync belum siap, data tetap aman di lokal.'); }
    };

    // 🛡️ SAFE INIT
    setTimeout(function(){
        try { loadData(); }
        catch(e){ console.error('❌ Janitor Indoor Init:', e); }
    }, 80);
})();
</script>
