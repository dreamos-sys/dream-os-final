<!DOCTYPE html>
<html lang='id'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Force Sync DreamOS</title>
<script src='../js/config-supabase.js'></script>
<style>
body{background:#020617;color:#e2e8f0;font-family:'Inter',sans-serif;padding:2rem;text-align:center}
.card{background:#1e293b;padding:2rem;border-radius:1rem;border:1px solid #334155;max-width:400px;margin:0 auto}
h2{color:#0ea5e9;margin-top:0}
p{color:#94a3b8;font-size:0.9rem;margin-bottom:1.5rem}
.btn{display:block;width:100%;padding:1rem;margin-bottom:1rem;border:none;border-radius:0.5rem;font-weight:bold;cursor:pointer;font-size:1rem}
.btn-upload{background:#10b981;color:white}
.btn-download{background:#f59e0b;color:black}
#log{text-align:left;background:#0f172a;padding:1rem;border-radius:0.5rem;font-size:0.7rem;max-height:200px;overflow-y:auto;color:#10b981;font-family:monospace;margin-top:1rem}
</style>
</head>
<body>
<div class='card'>
<h2>⚡ Force Sync Cloud</h2>
<p>Gunakan ini untuk memindahkan data dari HP ke Supabase (Cloud) dan sebaliknya.</p>
<button class='btn btn-upload' onclick='uploadAllToCloud()'>⬆️ 1. UPLOAD SEMUA DATA KE CLOUD (HP Mr. M)</button>
<p style='font-size:0.7rem;margin-top:-0.5rem'>(Klik ini di HP yang datanya lengkap. Data akan dikirim ke Supabase)</p>
<hr style='border-color:#334155;margin:1.5rem 0'>
<button class='btn btn-download' onclick='downloadAllFromCloud()'>⬇️ 2. DOWNLOAD SEMUA DATA DARI CLOUD (HP Pak Erwin)</button>
<p style='font-size:0.7rem;margin-top:-0.5rem'>(Klik ini di HP yang datanya kosong. Data akan ditarik dari Supabase)</p>
<button class='btn' style='background:#334155;color:white;margin-top:1rem' onclick='window.parent.goHome()'>← Kembali ke Dashboard</button>
<div id='log'>Menunggu perintah...</div>
</div>
<script>
const logDiv=document.getElementById('log');
function log(msg){logDiv.innerHTML+='> '+msg+'<br>';logDiv.scrollTop=logDiv.scrollHeight}
async function uploadAllToCloud(){
if(!window.DREAMOS_CONFIG){log('❌ Error: Config Supabase tidak ditemukan!');return}
log('🚀 Memulai upload ke Supabase...');
const tables=['dreamos_bookings','dreamos_maintenance_tasks','dreamos_k3_reports','dreamos_piket_logs','dreamos_stok','dreamos_assets','dreamos_dana','dreamos_users_db','dreamos_notifications','dreamos_matrix'];
for(let t of tables){
let dataStr=localStorage.getItem(t);
if(dataStr){
try{
let data=JSON.parse(dataStr);
if(!Array.isArray(data))data=[data];
let res=await fetch(window.DREAMOS_CONFIG.supabaseUrl+'/rest/v1/'+t,{method:'POST',headers:{'apikey':window.DREAMOS_CONFIG.supabaseKey,'Authorization':'Bearer '+window.DREAMOS_CONFIG.supabaseKey,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},body:JSON.stringify(data)});
if(res.ok||res.status===409)log('✅ '+t+' berhasil diupload!');
else{let err=await res.text();log('⚠️ '+t+' gagal: '+err.substring(0,50))}
}catch(e){log('❌ Error upload '+t+': '+e.message)}
}
}
log('🏁 Upload selesai!')
}
async function downloadAllFromCloud(){
if(!window.DREAMOS_CONFIG){log('❌ Error: Config Supabase tidak ditemukan!');return}
log('🚀 Memulai download dari Supabase...');
const tables=['dreamos_bookings','dreamos_maintenance_tasks','dreamos_k3_reports','dreamos_piket_logs','dreamos_stok','dreamos_assets','dreamos_dana','dreamos_users_db','dreamos_notifications','dreamos_matrix'];
for(let t of tables){
try{
let res=await fetch(window.DREAMOS_CONFIG.supabaseUrl+'/rest/v1/'+t+'?select=*',{headers:{'apikey':window.DREAMOS_CONFIG.supabaseKey,'Authorization':'Bearer '+window.DREAMOS_CONFIG.supabaseKey}});
if(res.ok){let data=await res.json();localStorage.setItem(t,JSON.stringify(data));log('✅ '+t+' berhasil didownload ('+data.length+' data)!')}
else{log('⚠️ '+t+' kosong atau error.')}
}catch(e){log('❌ Error download '+t+': '+e.message)}
}
log('🏁 Download selesai!');
setTimeout(()=>{if(confirm('Data berhasil ditarik! Refresh aplikasi sekarang?'))location.reload()},1000)
}
</script>
</body>
</html>
