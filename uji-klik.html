<!DOCTYPE html>
<html>
<head><title>UJI KLIK</title></head>
<body style="background:black;color:white;text-align:center;padding-top:100px;">
  <h1>UJI KLIK LINGKUNGAN</h1>
  <button id="btn" style="padding:30px;font-size:30px;">KLIK SAYA</button>
  <p id="hasil" style="margin-top:30px;font-size:24px;color:lime;"></p>
  <script>
    document.getElementById('btn').addEventListener('click', function() {
      document.getElementById('hasil').innerText = '✅ BERHASIL!';
      alert('Tombol berfungsi normal.');
    });
    console.log('✅ Uji klik siap.');
  </script>
</body>
</html>
